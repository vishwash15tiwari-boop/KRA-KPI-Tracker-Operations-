<!--
  Index.html — single-file client build.

  Straight concatenation of src/client/ (Styles + ClientCore + ClientComponents
  + the 9 view modules + ClientBoot) into one file, for projects that prefer
  one HTML file over thirteen in the Apps Script editor. Behaviour is
  identical either way. Regenerate from src/client/ rather than hand-editing
  this file after a source change.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OMP Operations KRA/KPI Tracker</title>
  <style>
/* ==========================================================================
   OMP Operations Tracker — design system
   Light-first tokens, redefined for dark under both prefers-color-scheme and
   an explicit [data-theme] so the manual toggle always wins.
   ========================================================================== */

:root {
  --bg:            #f4f6f9;
  --surface:       #ffffff;
  --surface-2:     #f8fafc;
  --surface-3:     #eef2f7;
  --border:        #dde3ec;
  --border-strong: #c3ccda;
  --text:          #131b26;
  --text-muted:    #5b6878;
  --text-faint:    #8a97a8;

  --brand:         #0f4c81;
  --brand-strong:  #0a3a63;
  --brand-soft:    #e6eef6;
  --brand-fg:      #ffffff;

  --excellent:     #0f7b52;
  --excellent-bg:  #e3f5ec;
  --good:          #2c8a5b;
  --good-bg:       #e8f6ee;
  --ok:            #9a6b09;
  --ok-bg:         #fdf3dc;
  --warn:          #b4560f;
  --warn-bg:       #fdeee2;
  --bad:           #b3261e;
  --bad-bg:        #fdeceb;
  --critical:      #8c1d18;
  --critical-bg:   #fbe3e1;
  --info:          #1b5faa;
  --info-bg:       #e7f0fb;

  --plan:          #7b61b6;
  --actual:        #0f4c81;
  --lastmonth:     #8a97a8;

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15,27,40,.06), 0 1px 3px rgba(15,27,40,.05);
  --shadow:    0 4px 12px rgba(15,27,40,.08), 0 1px 3px rgba(15,27,40,.05);
  --shadow-lg: 0 18px 44px rgba(15,27,40,.18);

  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;

  --topbar-h: 58px;
  --sidebar-w: 244px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:            #0c1219;
    --surface:       #131c26;
    --surface-2:     #18232f;
    --surface-3:     #1f2c3a;
    --border:        #24313f;
    --border-strong: #34455a;
    --text:          #e6edf5;
    --text-muted:    #9fb0c3;
    --text-faint:    #6d7f93;

    --brand:         #4b9fe1;
    --brand-strong:  #7bbcf0;
    --brand-soft:    #16293c;
    --brand-fg:      #06121d;

    --excellent:     #4ecf9a;
    --excellent-bg:  #102b21;
    --good:          #62c68f;
    --good-bg:       #12291d;
    --ok:            #e2b23c;
    --ok-bg:         #2c2410;
    --warn:          #f0904a;
    --warn-bg:       #331f11;
    --bad:           #f2776d;
    --bad-bg:        #331616;
    --critical:      #ff8a80;
    --critical-bg:   #3a1512;
    --info:          #6fb0f2;
    --info-bg:       #14263a;

    --plan:          #a892e0;
    --actual:        #4b9fe1;
    --lastmonth:     #6d7f93;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow:    0 4px 14px rgba(0,0,0,.45);
    --shadow-lg: 0 20px 50px rgba(0,0,0,.6);
  }
}

:root[data-theme="dark"] {
  --bg:            #0c1219;
  --surface:       #131c26;
  --surface-2:     #18232f;
  --surface-3:     #1f2c3a;
  --border:        #24313f;
  --border-strong: #34455a;
  --text:          #e6edf5;
  --text-muted:    #9fb0c3;
  --text-faint:    #6d7f93;

  --brand:         #4b9fe1;
  --brand-strong:  #7bbcf0;
  --brand-soft:    #16293c;
  --brand-fg:      #06121d;

  --excellent:     #4ecf9a;
  --excellent-bg:  #102b21;
  --good:          #62c68f;
  --good-bg:       #12291d;
  --ok:            #e2b23c;
  --ok-bg:         #2c2410;
  --warn:          #f0904a;
  --warn-bg:       #331f11;
  --bad:           #f2776d;
  --bad-bg:        #331616;
  --critical:      #ff8a80;
  --critical-bg:   #3a1512;
  --info:          #6fb0f2;
  --info-bg:       #14263a;

  --plan:          #a892e0;
  --actual:        #4b9fe1;
  --lastmonth:     #6d7f93;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow:    0 4px 14px rgba(0,0,0,.45);
  --shadow-lg: 0 20px 50px rgba(0,0,0,.6);
}

/* -------------------------------------------------------------- reset --- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1,h2,h3,h4,h5 { margin: 0; font-weight: 650; line-height: 1.25; letter-spacing: -.01em; }
p { margin: 0 0 .75em; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
table { border-collapse: collapse; width: 100%; }
[hidden] { display: none !important; }

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: 3px;
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 200;
  background: var(--brand); color: var(--brand-fg);
  padding: 10px 16px; border-radius: 0 0 var(--radius) 0;
}
.skip-link:focus { left: 0; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* --------------------------------------------------------------- boot --- */
.boot {
  position: fixed; inset: 0; display: grid; place-items: center;
  background: var(--bg); z-index: 100;
}
.boot__inner { text-align: center; }
.boot__mark {
  font-weight: 800; font-size: 26px; letter-spacing: .14em;
  color: var(--brand); margin-bottom: 18px;
}
.boot__text { color: var(--text-muted); margin-top: 14px; font-size: 13px; }
.spinner {
  width: 30px; height: 30px; margin: 0 auto;
  border: 2.5px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2s; }
  * { scroll-behavior: auto !important; }
}

/* -------------------------------------------------------------- shell --- */
.shell { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px;
  height: var(--topbar-h); padding: 0 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar__menu { display: none; }
.topbar__brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.topbar__mark {
  display: grid; place-items: center;
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--brand); color: var(--brand-fg);
  font-size: 10.5px; font-weight: 800; letter-spacing: .06em;
}
.topbar__title { font-weight: 650; white-space: nowrap; }
.topbar__context { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.topbar__actions { display: flex; align-items: center; gap: 6px; }

.burger, .burger::before, .burger::after {
  display: block; width: 17px; height: 2px; border-radius: 2px;
  background: currentColor; content: '';
}
.burger { position: relative; }
.burger::before { position: absolute; top: -5px; }
.burger::after  { position: absolute; top: 5px; }

.usermenu { position: relative; }
.usermenu__btn {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 8px 4px 4px; border: 1px solid transparent;
  border-radius: 999px; background: none; cursor: pointer;
}
.usermenu__btn:hover { background: var(--surface-3); }
.avatar {
  display: grid; place-items: center; flex: none;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--brand-soft); color: var(--brand);
  font-size: 11.5px; font-weight: 700;
}
.usermenu__meta { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
.usermenu__name { font-size: 12.5px; font-weight: 600; }
.usermenu__role { font-size: 10.5px; color: var(--text-muted); letter-spacing: .04em; }
.usermenu__panel {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 60;
  min-width: 250px; padding: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
}
.usermenu__panel dl { margin: 0; padding: 8px 10px; }
.usermenu__panel dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); }
.usermenu__panel dd { margin: 0 0 8px; font-size: 13px; }

.body { display: flex; flex: 1; min-height: 0; }

.sidebar {
  width: var(--sidebar-w); flex: none;
  display: flex; flex-direction: column;
  background: var(--surface); border-right: 1px solid var(--border);
  position: sticky; top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
}
.sidebar__scroll { flex: 1; overflow-y: auto; padding: 12px 10px; }
.sidebar__foot { padding: 10px 16px; border-top: 1px solid var(--border); }
.sidebar__version { font-size: 10.5px; color: var(--text-faint); }

.navgroup { margin-bottom: 16px; }
.navgroup__label {
  padding: 0 10px 6px; font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint);
}
.navitem {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; margin-bottom: 1px;
  border: 0; border-radius: var(--radius-sm);
  background: none; color: var(--text-muted);
  font-size: 13.5px; text-align: left; cursor: pointer;
}
.navitem:hover { background: var(--surface-3); color: var(--text); }
.navitem[aria-current="page"] {
  background: var(--brand-soft); color: var(--brand); font-weight: 600;
}
.navitem__icon { flex: none; width: 18px; text-align: center; opacity: .85; }
.navitem__badge {
  margin-left: auto; min-width: 20px; padding: 1px 6px;
  border-radius: 999px; background: var(--bad); color: #fff;
  font-size: 10.5px; font-weight: 700; text-align: center;
}

.scrim {
  position: fixed; inset: var(--topbar-h) 0 0; z-index: 25;
  background: rgba(8,14,20,.45);
}

.main { flex: 1; min-width: 0; padding: 20px 22px 56px; }
.view { max-width: 1560px; margin: 0 auto; }

@media (max-width: 900px) {
  .topbar__menu { display: grid; place-items: center; }
  .topbar__title { display: none; }
  .sidebar {
    position: fixed; top: var(--topbar-h); left: 0; z-index: 30;
    transform: translateX(-100%); transition: transform .2s ease;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.is-open { transform: none; }
  .main { padding: 14px 12px 48px; }
  .btn__label { display: none; }
}

/* ------------------------------------------------------------ headings --- */
.page-head {
  display: flex; flex-wrap: wrap; align-items: flex-end;
  justify-content: space-between; gap: 12px; margin-bottom: 18px;
}
.page-head__text { min-width: 0; }
.page-head h1 { font-size: 21px; }
.page-head__sub { margin: 4px 0 0; color: var(--text-muted); font-size: 13px; }
.page-head__actions { display: flex; flex-wrap: wrap; gap: 8px; }

.section { margin-bottom: 26px; }
.section__head {
  display: flex; flex-wrap: wrap; align-items: baseline;
  justify-content: space-between; gap: 10px; margin-bottom: 10px;
}
.section__head h2 { font-size: 15.5px; }
.section__hint { font-size: 12.5px; color: var(--text-muted); }

/* --------------------------------------------------------------- card --- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.card--pad { padding: 16px; }
.card__head {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: 10px;
  padding: 13px 16px; border-bottom: 1px solid var(--border);
}
.card__title { font-size: 14px; font-weight: 650; }
.card__body { padding: 16px; }
.card__body--flush { padding: 0; }
.card__foot {
  padding: 11px 16px; border-top: 1px solid var(--border);
  background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius);
  font-size: 12.5px; color: var(--text-muted);
}

.grid { display: grid; gap: 14px; }
.grid--tiles { grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

/* --------------------------------------------------------------- tile --- */
.tile {
  position: relative; padding: 15px 16px 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--border-strong);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
  text-align: left; width: 100%; cursor: pointer;
  transition: box-shadow .15s ease, transform .15s ease;
}
.tile:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.tile[data-tone="excellent"] { border-left-color: var(--excellent); }
.tile[data-tone="good"]      { border-left-color: var(--good); }
.tile[data-tone="ok"]        { border-left-color: var(--ok); }
.tile[data-tone="warn"]      { border-left-color: var(--warn); }
.tile[data-tone="bad"]       { border-left-color: var(--bad); }
.tile[data-tone="critical"]  { border-left-color: var(--critical); }

.tile__label {
  display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-muted);
}
.tile__value {
  margin: 7px 0 2px; font-size: 26px; font-weight: 700;
  letter-spacing: -.02em; font-variant-numeric: tabular-nums;
}
.tile__target { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.tile__foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--border);
  font-size: 11.5px; color: var(--text-muted);
}
.tile__drr { display: flex; gap: 4px; align-items: baseline; font-variant-numeric: tabular-nums; }
.tile__drr b { color: var(--text); font-weight: 650; }

.meter { height: 5px; margin-top: 10px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.meter__fill { height: 100%; border-radius: 3px; background: var(--brand); transition: width .3s ease; }
.meter__fill[data-tone="excellent"] { background: var(--excellent); }
.meter__fill[data-tone="good"]      { background: var(--good); }
.meter__fill[data-tone="ok"]        { background: var(--ok); }
.meter__fill[data-tone="warn"]      { background: var(--warn); }
.meter__fill[data-tone="bad"]       { background: var(--bad); }
.meter__fill[data-tone="critical"]  { background: var(--critical); }

/* --------------------------------------------------------------- pill --- */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
  background: var(--surface-3); color: var(--text-muted);
}
.pill[data-tone="excellent"] { background: var(--excellent-bg); color: var(--excellent); }
.pill[data-tone="good"]      { background: var(--good-bg); color: var(--good); }
.pill[data-tone="ok"]        { background: var(--ok-bg); color: var(--ok); }
.pill[data-tone="warn"]      { background: var(--warn-bg); color: var(--warn); }
.pill[data-tone="bad"]       { background: var(--bad-bg); color: var(--bad); }
.pill[data-tone="critical"]  { background: var(--critical-bg); color: var(--critical); }
.pill[data-tone="info"]      { background: var(--info-bg); color: var(--info); }
.pill[data-tone="brand"]     { background: var(--brand-soft); color: var(--brand); }

.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

/* ------------------------------------------------------------- button --- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); background: var(--surface); color: var(--text);
  font-size: 13px; font-weight: 550; cursor: pointer; white-space: nowrap;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover:not(:disabled) { background: var(--surface-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn--primary { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.btn--primary:hover:not(:disabled) { background: var(--brand-strong); border-color: var(--brand-strong); }
.btn--danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn--ghost { border-color: transparent; background: none; }
.btn--ghost:hover:not(:disabled) { background: var(--surface-3); }
.btn--sm { padding: 5px 10px; font-size: 12px; }
.btn--block { width: 100%; }

.iconbtn {
  display: grid; place-items: center; width: 34px; height: 34px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  background: none; cursor: pointer; color: var(--text-muted); font-size: 15px;
}
.iconbtn:hover { background: var(--surface-3); color: var(--text); }

.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }

/* --------------------------------------------------------------- form --- */
.field { margin-bottom: 13px; }
.field__label {
  display: block; margin-bottom: 5px;
  font-size: 12px; font-weight: 600; color: var(--text-muted);
}
.field__label .req { color: var(--bad); }
.field__hint { margin-top: 4px; font-size: 11.5px; color: var(--text-faint); }
.field__error { margin-top: 4px; font-size: 11.5px; color: var(--bad); font-weight: 550; }

.input, .select, .textarea {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); font-size: 13.5px;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--brand); outline: 2px solid var(--brand-soft); outline-offset: 0;
}
.input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] {
  border-color: var(--bad);
}
.textarea { min-height: 76px; resize: vertical; }
.input--num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }

.formgrid { display: grid; gap: 0 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.formgrid--wide { grid-column: 1 / -1; }

.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }
.check input { width: 15px; height: 15px; accent-color: var(--brand); }

.filters {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px;
  padding: 12px 14px; margin-bottom: 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
}
.filters .field { margin: 0; min-width: 150px; }
.filters__spacer { flex: 1; }

/* -------------------------------------------------------------- table --- */
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.table { font-size: 13px; min-width: 100%; }
.table th, .table td {
  padding: 9px 11px; text-align: left; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.table thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface-2); color: var(--text-muted);
  font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  white-space: nowrap;
}
.table tbody tr:hover { background: var(--surface-2); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table .strong { font-weight: 650; }
.table tfoot td {
  background: var(--surface-2); font-weight: 700; border-top: 2px solid var(--border-strong);
}
.table__group td {
  background: var(--surface-3); font-weight: 700; font-size: 12px;
  text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted);
}
.table--compact th, .table--compact td { padding: 6px 9px; }
.table--clickable tbody tr { cursor: pointer; }

.linklike {
  background: none; border: 0; padding: 0; color: var(--brand);
  font: inherit; cursor: pointer; text-align: left; text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--brand) 40%, transparent);
  text-underline-offset: 2px;
}
.linklike:hover { text-decoration-color: currentColor; }

.cell-sub { display: block; font-size: 11.5px; color: var(--text-faint); }

/* --------------------------------------------------------------- misc --- */
.empty { padding: 40px 20px; text-align: center; color: var(--text-muted); }
.empty__icon { font-size: 30px; opacity: .4; margin-bottom: 8px; }
.empty__title { font-weight: 650; color: var(--text); margin-bottom: 4px; }

.banner {
  display: flex; gap: 11px; align-items: flex-start;
  padding: 12px 14px; margin-bottom: 14px;
  border: 1px solid var(--border); border-left-width: 3px;
  border-radius: var(--radius); background: var(--surface);
  font-size: 13px;
}
.banner[data-tone="info"]     { border-left-color: var(--info); background: var(--info-bg); }

.banner[data-tone="bad"]      { border-left-color: var(--bad); background: var(--bad-bg); }
.banner[data-tone="critical"] { border-left-color: var(--critical); background: var(--critical-bg); }

.banner__body { flex: 1; min-width: 0; }

.tabs { display: flex; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab {
  padding: 9px 14px; border: 0; border-bottom: 2px solid transparent;

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

.nowrap { white-space: nowrap; }

.mt-0 { margin-top: 0; } .mb-0 { margin-bottom: 0; }

/* --------------------------------------------------------------- list --- */
.itemlist { list-style: none; margin: 0; padding: 0; }
.item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 14px; border-bottom: 1px solid var(--border);
}
.item:last-child { border-bottom: 0; }
.item__sev {
  flex: none; width: 26px; height: 20px; border-radius: 4px;
  display: grid; place-items: center;

}
.item__sev[data-sev="P1"] { background: var(--bad-bg); color: var(--bad); }

/* ------------------------------------------------------------- charts --- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font); fill: var(--text-muted); font-size: 10px; }
.chart .axis line, .chart .axis path { stroke: var(--border); }

.chart-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 12px; }

/* ------------------------------------------------------- drawer/modal --- */
.drawer, .modal { position: fixed; inset: 0; z-index: 80; }
.drawer__scrim, .modal__scrim { position: absolute; inset: 0; background: rgba(8,14,20,.5); }
.drawer__panel {
  position: absolute; top: 0; right: 0; bottom: 0;

  background: var(--surface); box-shadow: var(--shadow-lg);

}

  display: flex; align-items: center; justify-content: space-between; gap: 12px;

}

  position: relative; margin: 6vh auto 0; width: min(640px, calc(100% - 24px));
  max-height: 88vh; display: flex; flex-direction: column;
  background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);

}
.modal__panel--wide { width: min(1040px, calc(100% - 24px)); }
@keyframes popin { from { transform: scale(.97); opacity: .5; } }

/* ------------------------------------------------------------- toasts --- */

  position: fixed; right: 16px; bottom: 16px; z-index: 90;

}

  display: flex; gap: 10px; align-items: flex-start;

@keyframes toastin { from { transform: translateY(8px); opacity: 0; } }
.toast[data-tone="good"]     { border-left-color: var(--good); }
.toast[data-tone="bad"]      { border-left-color: var(--bad); }
.toast[data-tone="warn"]     { border-left-color: var(--warn); }
.toast[data-tone="info"]     { border-left-color: var(--info); }
.toast__body { flex: 1; min-width: 0; }
.toast__title { font-weight: 650; }
.toast__msg { margin-top: 2px; color: var(--text-muted); font-size: 12.5px; }

/* ----------------------------------------------------------- skeleton --- */
.skeleton {
  background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 50%, var(--surface-3) 75%);
  background-size: 200% 100%; animation: shimmer 1.3s infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer { to { background-position: -200% 0; } }
.skeleton--tile { height: 118px; }
.skeleton--row { height: 34px; margin-bottom: 6px; }

/* --------------------------------------------------------------- misc --- */
.kpi-target-bands {
  display: flex; gap: 3px; margin-top: 6px;
}
.kpi-target-bands span {
  flex: 1; padding: 2px 4px; text-align: center; font-size: 10px;

}

.doc-slots { display: flex; flex-wrap: wrap; gap: 6px; }
.doc-slot {
  display: inline-flex; align-items: center; gap: 5px;

  <script>
/* ==========================================================================
   ClientCore — RPC, application state, routing, formatting and DOM helpers.
   Everything the views build on. No view logic lives here.
   ========================================================================== */

/* ------------------------------------------------------------------ RPC --- */
const Api = (() => {
  const inflight = new Map();
  const cache = new Map();

  function call(action, payload, options = {}) {
    const key = action + ':' + JSON.stringify(payload || {});

    if (options.cache && cache.has(key)) {
      const hit = cache.get(key);
      if (Date.now() - hit.at < (options.cacheMs || 30000)) return Promise.resolve(hit.data);
      cache.delete(key);
    }
    // Identical concurrent requests share one round trip.
    if (inflight.has(key)) return inflight.get(key);

    const promise = new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(res => {
          if (!res) { reject(new ApiError('EMPTY', 'The server returned no response.')); return; }
          if (res.ok) {
            if (options.cache) cache.set(key, { at: Date.now(), data: res.data });
            resolve(res.data);
          } else {
            reject(new ApiError(res.error.code, res.error.message, res.error.details));
          }
        })
        .withFailureHandler(err => {
          reject(new ApiError('TRANSPORT',
            (err && err.message) || 'Could not reach the server. Check your connection and retry.'));
        })
        .api(action, payload || {});
    }).finally(() => inflight.delete(key));

    inflight.set(key, promise);
    return promise;
  }

  return {
    call,
    invalidate() { cache.clear(); },
    /** Run several calls together; a failure in one does not lose the others. */
    all(specs) {
      return Promise.all(specs.map(s =>
        call(s.action, s.payload, s.options).then(
          data => ({ ok: true, data, key: s.key }),
          error => ({ ok: false, error, key: s.key }))));
    }
  };
})();

class ApiError extends Error {
  constructor(code, message, details) {
    super(message);
    this.name = 'ApiError';
    this.code = code;
    this.details = details || null;
  }
}

/* ---------------------------------------------------------------- State --- */
const State = {
  boot: null,
  user: null,
  cycleId: null,
  category: null,
  stream: 'SUPPLY',
  route: 'dashboard',
  params: {},
  filters: {},
  alertCount: 0,

  cycle() {
    if (!this.boot) return null;
    return (this.boot.cycles || []).find(c => c.cycleId === this.cycleId)
      || this.boot.activeCycle || null;
  },
  can(permission) {
    return !!(this.user && this.user.permissions && this.user.permissions.includes(permission));
  },
  isPoc() { return this.user && this.user.role === 'POC'; },
  ref(key) { return (this.boot && this.boot.reference && this.boot.reference[key]) || []; },
  setting(key) { return this.boot && this.boot.settings ? this.boot.settings[key] : undefined; },
  userName(userId) {
    const u = this.ref('users').find(x => x.userId === userId);
    return u ? u.fullName : (userId || '—');
  },
  regionName(regionId) {
    const r = this.ref('regions').find(x => x.regionId === regionId);
    return r ? r.regionName : (regionId || '—');
  }
};

/* ------------------------------------------------------------ Formatting --- */
const F = {
  /** HTML-escape. Every value interpolated into a template must pass through. */
  esc(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },

  num(v, places = 2) {
    if (v === null || v === undefined || v === '' || !isFinite(v)) return '—';
    return Number(v).toLocaleString('en-IN', {
      minimumFractionDigits: places, maximumFractionDigits: places
    });
  },
  int(v) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    return Math.round(Number(v)).toLocaleString('en-IN');
  },
  pct(v, places = 1) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    return (Number(v) * 100).toFixed(places) + '%';
  },
  signedPct(v, places = 1) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    const n = Number(v) * 100;
    return (n > 0 ? '+' : '') + n.toFixed(places) + '%';
  },
  cr(v, places = 2) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    return '₹' + Number(v).toFixed(places) + ' Cr';
  },
  inr(v) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    return '₹' + Number(v).toLocaleString('en-IN', { maximumFractionDigits: 0 });
  },
  mt(v, places = 2) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    return Number(v).toLocaleString('en-IN',
      { minimumFractionDigits: places, maximumFractionDigits: places }) + ' MT';
  },

  /** Format by the metric's declared unit, so a value never renders ambiguously. */
  unit(v, unit, places) {
    switch (unit) {
      case 'CR': return F.cr(v, places === undefined ? 2 : places);
      case 'MT': return F.mt(v, places === undefined ? 2 : places);
      case 'PCT': return F.pct(v, places === undefined ? 2 : places);
      case 'INR': return F.inr(v);
      case 'DAYS': return F.num(v, places === undefined ? 1 : places) + ' d';
      case 'RATE': return '₹' + F.num(v, places === undefined ? 2 : places) + '/kg';
      case 'COUNT':
      default: return F.int(v);
    }
  },

  date(iso) {
    if (!iso) return '—';
    const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
    if (isNaN(d)) return F.esc(iso);
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  },
  dateShort(iso) {
    if (!iso) return '—';
    const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
    if (isNaN(d)) return F.esc(iso);
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
  },
  dateTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return F.esc(iso);
    return d.toLocaleString('en-IN', {
      day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
    });
  },
  relative(iso) {
    if (!iso) return '—';
    const d = new Date(iso), now = new Date();
    if (isNaN(d)) return F.esc(iso);
    const days = Math.round((now - d) / 86400000);
    if (days === 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 0) return 'in ' + Math.abs(days) + ' days';
    if (days < 30) return days + ' days ago';
    return F.date(iso.slice(0, 10));
  },

  initials(name) {
    return String(name || '?').trim().split(/\s+/).slice(0, 2)
      .map(w => w[0]).join('').toUpperCase() || '?';
  },

  /** Achievement → tone token, matching the server's rating bands. */
  tone(achievement) {
    if (achievement === null || achievement === undefined || !isFinite(achievement)) return '';
    if (achievement >= 1.05) return 'excellent';
    if (achievement >= 1.00) return 'good';
    if (achievement >= 0.90) return 'ok';
    if (achievement >= 0.75) return 'warn';
    if (achievement >= 0.60) return 'bad';
    return 'critical';
  },

  paceLabel(status) {
    return ({
      ACHIEVED: 'Achieved', ON_TRACK: 'On track',
      AT_RISK: 'At risk', CRITICAL: 'Critical'
    })[status] || status || '—';
  },
  paceTone(status) {
    return ({
      ACHIEVED: 'excellent', ON_TRACK: 'good', AT_RISK: 'warn', CRITICAL: 'bad'
    })[status] || '';
  },
  statusTone(status) {
    return ({
      DRAFT: 'info', PUBLISHED: 'good', LOCKED: 'warn', CLOSED: '',
      OPEN: 'info', IN_PROGRESS: 'ok', BLOCKED: 'bad', DONE: 'good', CANCELLED: '',
      PENDING: 'warn', VERIFIED: 'good', REJECTED: 'bad', NOT_REQUIRED: '',
      SHARED: 'info', ACKNOWLEDGED: 'ok', SIGNED_OFF: 'good',
      COMPLETED: 'good', IN_REVIEW: 'warn', ONBOARDED: 'good', DROPPED: ''
    })[status] || '';
  },
  titleCase(s) {
    return String(s || '').toLowerCase().replace(/_/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());
  }
};

/* --------------------------------------------------------------- DOM ----- */
const D = {
  q(sel, root = document) { return root.querySelector(sel); },
  qa(sel, root = document) { return Array.from(root.querySelectorAll(sel)); },
  html(el, markup) { if (el) el.innerHTML = markup; return el; },

  /** Event delegation — views re-render freely without leaking listeners. */
  on(root, eventName, selector, handler) {
    root.addEventListener(eventName, e => {
      const target = e.target.closest(selector);
      if (target && root.contains(target)) handler(e, target);
    });
  },

  /** Read a form into a plain object, coercing numbers and checkboxes. */
  formData(formEl) {
    const out = {};
    D.qa('[name]', formEl).forEach(el => {
      const name = el.getAttribute('name');
      if (el.type === 'checkbox') out[name] = el.checked;
      else if (el.type === 'number') out[name] = el.value === '' ? '' : Number(el.value);
      else out[name] = el.value;
    });
    return out;
  },

  markInvalid(formEl, message) {
    D.qa('[aria-invalid]', formEl).forEach(el => el.removeAttribute('aria-invalid'));
    D.qa('.field__error', formEl).forEach(el => el.remove());
    if (!message) return;
    // Best effort: highlight the first field whose label the message names.
    const fields = D.qa('.field', formEl);
    const hit = fields.find(f => {
      const label = (f.querySelector('.field__label') || {}).textContent || '';
      return label && message.toLowerCase().includes(label.trim().replace('*', '').toLowerCase());
    });
    const host = hit || formEl;
    const err = document.createElement('div');
    err.className = 'field__error';
    err.setAttribute('role', 'alert');
    err.textContent = message;
    host.appendChild(err);
    const input = host.querySelector('.input, .select, .textarea');
    if (input) { input.setAttribute('aria-invalid', 'true'); input.focus(); }
  }
};

/* -------------------------------------------------------------- Toasts --- */
const Toast = (() => {
  function show(title, message, tone = 'info', ms = 4800) {
    const host = D.q('#toaster');
    if (!host) return;
    const el = document.createElement('div');
    el.className = 'toast';
    el.dataset.tone = tone;
    el.setAttribute('role', tone === 'bad' ? 'alert' : 'status');
    el.innerHTML =
      `<div class="toast__body">
         <div class="toast__title">${F.esc(title)}</div>
         ${message ? `<div class="toast__msg">${F.esc(message)}</div>` : ''}
       </div>
       <button class="iconbtn" aria-label="Dismiss">✕</button>`;
    el.querySelector('button').onclick = () => el.remove();
    host.appendChild(el);
    if (ms) setTimeout(() => el.remove(), ms);
  }
  return {
    success: (t, m) => show(t, m, 'good'),
    error: (t, m) => show(t, m, 'bad', 9000),
    warn: (t, m) => show(t, m, 'warn', 7000),
    info: (t, m) => show(t, m, 'info'),
    /** Render an ApiError with its code, so support can act on it. */
    fromError(err, fallbackTitle = 'Something went wrong') {
      const known = {
        FORBIDDEN: 'Not permitted',
        VALIDATION: 'Check the details',
        NOT_FOUND: 'Not found',
        DUPLICATE: 'Already exists',
        CYCLE_LOCKED: 'Cycle locked',
        CYCLE_NOT_OPEN: 'Cycle not open',
        BUSY: 'Please retry',
        NOT_PROVISIONED: 'No access'
      };
      show(known[err && err.code] || fallbackTitle,
        (err && err.message) || String(err), 'bad', 9000);
    }
  };
})();

/* ------------------------------------------------------ Modal / Drawer --- */
const Overlay = (() => {
  let lastFocus = null;

  function trapFocus(panel) {
    const focusables = D.qa(
      'a[href],button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])',
      panel);
    if (!focusables.length) return;
    focusables[0].focus();
    panel.onkeydown = e => {
      if (e.key !== 'Tab') return;
      const list = D.qa(
        'a[href],button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])',
        panel);
      const first = list[0], last = list[list.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
  }

  function openModal({ title, body, footer, wide }) {
    lastFocus = document.activeElement;
    D.q('#modalTitle').textContent = title || '';
    D.html(D.q('#modalBody'), body || '');
    D.html(D.q('#modalFoot'), footer || '');
    D.q('#modalPanel').classList.toggle('modal__panel--wide', !!wide);
    D.q('#modal').hidden = false;
    trapFocus(D.q('#modalPanel'));
    return D.q('#modalBody');
  }
  function closeModal() {
    D.q('#modal').hidden = true;
    D.html(D.q('#modalBody'), '');
    D.html(D.q('#modalFoot'), '');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function openDrawer({ title, body, footer }) {
    lastFocus = document.activeElement;
    D.q('#drawerTitle').textContent = title || '';
    D.html(D.q('#drawerBody'), body || '');
    D.html(D.q('#drawerFoot'), footer || '');
    D.q('#drawer').hidden = false;
    trapFocus(D.q('.drawer__panel'));
    return D.q('#drawerBody');
  }
  function closeDrawer() {
    D.q('#drawer').hidden = true;
    D.html(D.q('#drawerBody'), '');
    D.html(D.q('#drawerFoot'), '');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function confirm({ title, message, confirmLabel = 'Confirm', tone = 'primary', requireReason }) {
    return new Promise(resolve => {
      const body = `
        <p>${F.esc(message)}</p>
        ${requireReason ? `
          <div class="field">
            <label class="field__label" for="confirmReason">Reason <span class="req">*</span></label>
            <textarea class="textarea" id="confirmReason"
              placeholder="This is recorded in the audit trail."></textarea>
          </div>` : ''}`;
      const footer = `
        <button class="btn" data-confirm="no">Cancel</button>
        <button class="btn btn--${tone === 'danger' ? 'danger' : 'primary'}" data-confirm="yes">
          ${F.esc(confirmLabel)}</button>`;
      openModal({ title, body, footer });

      D.q('#modalFoot').onclick = e => {
        const btn = e.target.closest('[data-confirm]');
        if (!btn) return;
        if (btn.dataset.confirm === 'no') { closeModal(); resolve(null); return; }
        const reason = requireReason ? (D.q('#confirmReason').value || '').trim() : true;
        if (requireReason && !reason) {
          Toast.warn('Reason required', 'Explain why, so the change can be audited.');
          return;
        }
        closeModal();
        resolve(requireReason ? reason : true);
      };
    });
  }

  return { openModal, closeModal, openDrawer, closeDrawer, confirm };
})();

/* -------------------------------------------------------------- Router --- */
const Router = (() => {
  const routes = {};

  function register(name, spec) { routes[name] = spec; }

  function parseHash() {
    const raw = (location.hash || '').replace(/^#\/?/, '');
    const [path, query] = raw.split('?');
    const params = {};
    if (query) {
      query.split('&').forEach(pair => {
        const [k, v] = pair.split('=');
        if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
      });
    }
    return { route: path || 'dashboard', params };
  }

  function go(route, params) {
    const qs = params && Object.keys(params).length
      ? '?' + Object.entries(params)
        .filter(([, v]) => v !== undefined && v !== null && v !== '')
        .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&')
      : '';
    const next = '#/' + route + qs;
    if (location.hash === next) render();
    else location.hash = next;
  }

  async function render() {
    const { route, params } = parseHash();
    const spec = routes[route] || routes['dashboard'];

    if (spec.permission && !State.can(spec.permission)) {
      D.html(D.q('#view'), Components.emptyState({
        icon: '🔒', title: 'Not available to your role',
        message: 'Ask your Team Lead if you need access to this area.'
      }));
      return;
    }

    State.route = route;
    State.params = params;
    Nav.markActive(route);

    const host = D.q('#view');
    host.innerHTML = spec.skeleton ? spec.skeleton() : Components.loading();
    D.q('#main').focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });

    try {
      await spec.render(host, params);
    } catch (err) {
      console.error(route, err);
      host.innerHTML = Components.errorState(err);
      D.on(host, 'click', '[data-retry]', () => render());
    }
  }

  window.addEventListener('hashchange', render);
  return { register, go, render, parseHash };
})();

/* ----------------------------------------------------------- Navigation --- */
const Nav = (() => {
  const GROUPS = [
    {
      label: 'Operate',
      items: [
        { route: 'myday', icon: '☑', label: 'My Day', pocFirst: true },
        { route: 'dashboard', icon: '◈', label: 'Dashboard' },
        { route: 'activity', icon: '✎', label: 'Activity Log' },
        { route: 'accounts', icon: '🏢', label: 'Accounts' },
        { route: 'pipeline', icon: '⇢', label: 'Onboarding Pipeline' }
      ]
    },
    {
      label: 'Plan',
      items: [
        { route: 'planning', icon: '◱', label: 'Monthly Plan', permission: 'PLAN_VIEW' },
        { route: 'weekly', icon: '▤', label: 'Weekly Plan', permission: 'PLAN_VIEW' },
        { route: 'receivables', icon: '₹', label: 'Receivables', permission: 'PLAN_MANAGE' }
      ]
    },
    {
      label: 'Measure',
      items: [
        { route: 'daily-review', icon: '⧉', label: 'Daily Review' },
        { route: 'scorecard', icon: '◉', label: 'Scorecard' },
        { route: 'leaderboard', icon: '⚑', label: 'Leaderboard', permission: 'SCORECARD_VIEW_ALL' },
        { route: 'performance', icon: '⊞', label: 'POC & Region' },
        { route: 'account-performance', icon: '▦', label: 'Account Performance' },
        { route: 'coverage', icon: '◌', label: 'Coverage' }
      ]
    },
    {
      label: 'Improve',
      items: [
        { route: 'alerts', icon: '⚠', label: 'Needs Attention', badge: 'alerts' },
        { route: 'actions', icon: '➔', label: 'Action Items' },
        { route: 'review', icon: '★', label: 'Reviews', permission: 'REVIEW_MANAGE' },
        { route: 'my-reviews', icon: '☆', label: 'My Reviews' }
      ]
    },
    {
      label: 'Administer',
      permission: 'USER_MANAGE',
      items: [
        { route: 'users', icon: '👥', label: 'Users & Regions', permission: 'USER_MANAGE' },
        { route: 'sync', icon: '⇄', label: 'Data Sync', permission: 'SYNC_RUN' },
        { route: 'settings', icon: '⚙', label: 'Settings', permission: 'CONFIG_MANAGE' },
        { route: 'audit', icon: '❑', label: 'Audit Trail', permission: 'AUDIT_VIEW' }
      ]
    }
  ];

  function build() {
    const host = D.q('#navList');
    host.innerHTML = GROUPS
      .filter(g => !g.permission || State.can(g.permission))
      .map(group => {
        const items = group.items.filter(i => !i.permission || State.can(i.permission));
        if (!items.length) return '';
        return `
          <div class="navgroup">
            <div class="navgroup__label">${F.esc(group.label)}</div>
            ${items.map(i => `
              <button class="navitem" data-route="${i.route}">
                <span class="navitem__icon" aria-hidden="true">${i.icon}</span>
                <span>${F.esc(i.label)}</span>
                ${i.badge ? `<span class="navitem__badge" data-badge="${i.badge}" hidden></span>` : ''}
              </button>`).join('')}
          </div>`;
      }).join('');

    D.on(host, 'click', '[data-route]', (e, el) => {
      Router.go(el.dataset.route);
      closeMobile();
    });
  }

  function markActive(route) {
    D.qa('#navList .navitem').forEach(el => {
      if (el.dataset.route === route) el.setAttribute('aria-current', 'page');
      else el.removeAttribute('aria-current');
    });
  }

  function setBadge(name, count) {
    const el = D.q(`[data-badge="${name}"]`);
    if (!el) return;
    el.hidden = !count;
    el.textContent = count > 99 ? '99+' : count;
  }

  function defaultRoute() {
    return State.isPoc() ? 'myday' : 'dashboard';
  }

  function openMobile() {
    D.q('#sidebar').classList.add('is-open');
    D.q('#navScrim').hidden = false;
    D.q('#navToggle').setAttribute('aria-expanded', 'true');
  }
  function closeMobile() {
    D.q('#sidebar').classList.remove('is-open');
    D.q('#navScrim').hidden = true;
    D.q('#navToggle').setAttribute('aria-expanded', 'false');
  }
  function toggleMobile() {
    D.q('#sidebar').classList.contains('is-open') ? closeMobile() : openMobile();
  }

  return { build, markActive, setBadge, defaultRoute, toggleMobile, closeMobile };
})();

/* --------------------------------------------------------------- Theme --- */
const Theme = (() => {
  const KEY = 'omp.theme';
  function current() {
    try { return localStorage.getItem(KEY) || 'system'; } catch (e) { return 'system'; }
  }
  function apply(mode) {
    if (mode === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    const icon = D.q('#themeIcon');
    if (icon) icon.textContent = mode === 'dark' ? '☾' : mode === 'light' ? '☀' : '◐';
  }
  function cycle() {
    const order = ['system', 'light', 'dark'];
    const next = order[(order.indexOf(current()) + 1) % order.length];
    try { localStorage.setItem(KEY, next); } catch (e) { /* private mode */ }
    apply(next);
    return next;
  }
  return { current, apply, cycle, init: () => apply(current()) };
})();

  <script>
/* ==========================================================================
   Components — the shared visual vocabulary. Every view composes from here so
   a metric tile, a table or a chart reads identically wherever it appears.
   ========================================================================== */

const Components = (() => {

  /* ------------------------------------------------------------ states --- */
  function loading(rows = 4) {
    return `<div class="grid grid--tiles">${
      Array.from({ length: rows }, () => '<div class="skeleton skeleton--tile"></div>').join('')
    }</div>`;
  }

  function tableSkeleton(rows = 8) {
    return `<div class="card card--pad">${
      Array.from({ length: rows }, () => '<div class="skeleton skeleton--row"></div>').join('')
    }</div>`;
  }

  function emptyState({ icon = '◌', title, message, action }) {
    return `
      <div class="card">
        <div class="empty">
          <div class="empty__icon" aria-hidden="true">${icon}</div>
          <div class="empty__title">${F.esc(title)}</div>
          <div>${F.esc(message || '')}</div>
          ${action ? `<div style="margin-top:14px">${action}</div>` : ''}
        </div>
      </div>`;
  }

  function errorState(err) {
    const code = (err && err.code) || 'ERROR';
    return `
      <div class="banner" data-tone="bad">
        <span aria-hidden="true">⚠</span>
        <div class="banner__body">
          <div class="banner__title">Could not load this page</div>
          <div>${F.esc((err && err.message) || String(err))}</div>
          <div class="faint mono" style="margin-top:6px">${F.esc(code)}</div>
        </div>
        <button class="btn btn--sm" data-retry>Retry</button>
      </div>`;
  }

  function banner(tone, title, message, actionHtml) {
    return `
      <div class="banner" data-tone="${tone}">
        <span aria-hidden="true">${
          tone === 'good' ? '✓' : tone === 'info' ? 'ℹ' : '⚠'}</span>
        <div class="banner__body">
          ${title ? `<div class="banner__title">${F.esc(title)}</div>` : ''}
          <div>${message}</div>
        </div>
        ${actionHtml || ''}
      </div>`;
  }

  /* ------------------------------------------------------------ layout --- */
  function pageHead({ title, subtitle, actions }) {
    return `
      <div class="page-head">
        <div class="page-head__text">
          <h1>${F.esc(title)}</h1>
          ${subtitle ? `<p class="page-head__sub">${subtitle}</p>` : ''}
        </div>
        ${actions ? `<div class="page-head__actions">${actions}</div>` : ''}
      </div>`;
  }

  function section({ title, hint, body, actions }) {
    return `
      <section class="section">
        ${title ? `
          <div class="section__head">
            <h2>${F.esc(title)}</h2>
            ${hint ? `<span class="section__hint">${hint}</span>` : ''}
            ${actions || ''}
          </div>` : ''}
        ${body}
      </section>`;
  }

  function card({ title, actions, body, foot, flush }) {
    return `
      <div class="card">
        ${title ? `
          <div class="card__head">
            <div class="card__title">${F.esc(title)}</div>
            ${actions ? `<div class="btnrow">${actions}</div>` : ''}
          </div>` : ''}
        <div class="card__body${flush ? ' card__body--flush' : ''}">${body}</div>
        ${foot ? `<div class="card__foot">${foot}</div>` : ''}
      </div>`;
  }

  function pill(text, tone) {
    return `<span class="pill"${tone ? ` data-tone="${tone}"` : ''}>${F.esc(text)}</span>`;
  }

  /* ------------------------------------------------------------- tiles --- */
  /**
   * The metric tile. Shows the number, the target, the pace and the trend —
   * the whole decision in one glance — and opens the drill-down on click.
   */
  function metricTile(t) {
    const tone = F.tone(t.achievement);
    const fill = Math.max(0, Math.min(1, t.achievement || 0)) * 100;
    const growthTone = t.growthPct > 0 ? 'good' : t.growthPct < 0 ? 'bad' : '';
    const drill = t.drill ? ` data-drill='${F.esc(JSON.stringify(t.drill))}'` : '';

    return `
      <button class="tile" data-tone="${tone}"${drill}
              aria-label="${F.esc(t.label)}: ${F.esc(F.unit(t.actual, t.unit))} of ${F.esc(F.unit(t.target, t.unit))}">
        <div class="tile__label">
          <span>${F.esc(t.label)}</span>
          ${t.paceStatus ? `<span class="pill" data-tone="${F.paceTone(t.paceStatus)}"
            style="margin-left:auto">${F.paceLabel(t.paceStatus)}</span>` : ''}
        </div>
        <div class="tile__value">${F.unit(t.actual, t.unit)}</div>
        <div class="tile__target">
          of ${F.unit(t.target, t.unit)} target
          <span class="pill" data-tone="${tone}" style="margin-left:6px">${F.pct(t.achievement)}</span>
        </div>
        <div class="meter"><div class="meter__fill" data-tone="${tone}" style="width:${fill.toFixed(1)}%"></div></div>
        <div class="tile__foot">
          <span class="tile__drr" title="Achieved per day so far">
            Now <b>${F.num(t.currentDrr, 2)}</b>/d</span>
          <span class="tile__drr" title="Required per day to hit the target">
            Need <b>${F.num(t.requiredDrr, 2)}</b>/d</span>
          ${t.growthPct !== null && t.growthPct !== undefined
            ? `<span class="pill" data-tone="${growthTone}" style="margin-left:auto"
                 title="Versus the same period last month">${F.signedPct(t.growthPct)}</span>` : ''}
        </div>
      </button>`;
  }

  function statTile({ label, value, sub, tone }) {
    return `
      <div class="tile" style="cursor:default"${tone ? ` data-tone="${tone}"` : ''}>
        <div class="tile__label">${F.esc(label)}</div>
        <div class="tile__value">${value}</div>
        ${sub ? `<div class="tile__target">${sub}</div>` : ''}
      </div>`;
  }

  /* ------------------------------------------------------------ tables --- */
  /**
   * columns: [{ key, label, align, width, format(row), cls }]
   * The `format` callback must return already-escaped HTML.
   */
  function table({ columns, rows, footer, empty, rowAttrs, compact, clickable }) {
    if (!rows || !rows.length) {
      return `<div class="empty">${F.esc(empty || 'Nothing to show yet.')}</div>`;
    }
    const head = columns.map(c =>
      `<th${c.align === 'right' ? ' class="num"' : ''}${c.width ? ` style="width:${c.width}"` : ''}>${F.esc(c.label)}</th>`
    ).join('');

    const body = rows.map(r => {
      const attrs = rowAttrs ? rowAttrs(r) : '';
      const cells = columns.map(c => {
        const cls = [c.align === 'right' ? 'num' : '', c.cls || ''].filter(Boolean).join(' ');
        const content = c.format ? c.format(r) : F.esc(r[c.key]);
        return `<td${cls ? ` class="${cls}"` : ''}>${content}</td>`;
      }).join('');
      return `<tr ${attrs}>${cells}</tr>`;
    }).join('');

    return `
      <div class="tablewrap">
        <table class="table${compact ? ' table--compact' : ''}${clickable ? ' table--clickable' : ''}">
          <thead><tr>${head}</tr></thead>
          <tbody>${body}</tbody>
          ${footer ? `<tfoot>${footer}</tfoot>` : ''}
        </table>
      </div>`;
  }

  /** Target / Achieved / Ach% triple — the workbook's core reading unit. */
  function tva(target, actual, unit, places) {
    const ach = target ? actual / target : 0;
    return `<span class="tnum">${F.unit(actual, unit, places)}</span>
            <span class="cell-sub">of ${F.unit(target, unit, places)} · ${F.pct(ach)}</span>`;
  }

  function achievementCell(value) {
    const tone = F.tone(value);
    return `<span class="pill" data-tone="${tone}">${F.pct(value)}</span>`;
  }

  function growthCell(value) {
    if (value === null || value === undefined) return '<span class="faint">—</span>';
    const tone = value > 0.001 ? 'good' : value < -0.001 ? 'bad' : '';
    return `<span class="pill" data-tone="${tone}">${F.signedPct(value)}</span>`;
  }

  /* ------------------------------------------------------------ charts --- */
  /**
   * Cumulative line chart: actual vs straight-line plan vs last month, with the
   * projection dashed beyond today. Pure inline SVG — no external libraries,
   * which the artifact CSP would block anyway.
   */
  function lineChart(series, options = {}) {
    const W = options.width || 720, H = options.height || 240;
    const pad = { t: 12, r: 14, b: 26, l: 52 };
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;

    const allValues = series.flatMap(s => s.points.map(p => p.y).filter(v => v !== null && isFinite(v)));
    const maxY = Math.max(1, ...allValues) * 1.08;
    const n = Math.max(1, Math.max(...series.map(s => s.points.length)) - 1);

    const x = i => pad.l + (i / n) * iw;
    const y = v => pad.t + ih - (Math.max(0, v) / maxY) * ih;

    const gridCount = 4;
    const grid = Array.from({ length: gridCount + 1 }, (_, i) => {
      const v = (maxY / gridCount) * i;
      const gy = y(v);
      return `<line class="gridline" x1="${pad.l}" y1="${gy}" x2="${W - pad.r}" y2="${gy}"></line>
              <text x="${pad.l - 8}" y="${gy + 3}" text-anchor="end">${
                options.formatY ? options.formatY(v) : F.num(v, 0)}</text>`;
    }).join('');

    const paths = series.map(s => {
      const pts = s.points.map((p, i) => ({ i, y: p.y })).filter(p => p.y !== null && isFinite(p.y));
      if (!pts.length) return '';
      const d = pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"
              ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} stroke-linejoin="round" stroke-linecap="round"></path>`;
    }).join('');

    const labelEvery = Math.max(1, Math.ceil((series[0] ? series[0].points.length : 1) / 10));
    const xLabels = (series[0] ? series[0].points : []).map((p, i) =>
      i % labelEvery === 0
        ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${F.esc(p.label || (i + 1))}</text>`
        : '').join('');

    return `
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
           aria-label="${F.esc(options.ariaLabel || 'Trend chart')}"
           preserveAspectRatio="xMidYMid meet">
        ${grid}
        <line class="axis" x1="${pad.l}" y1="${pad.t + ih}" x2="${W - pad.r}" y2="${pad.t + ih}"
              stroke="currentColor" stroke-opacity=".2"></line>
        ${paths}
        ${xLabels}
      </svg>
      <div class="chart-legend">
        ${series.map(s => `
          <span class="chart-legend__key">
            <span class="chart-legend__swatch" style="background:${s.color}${
              s.dash ? ';opacity:.7' : ''}"></span>${F.esc(s.name)}
          </span>`).join('')}
      </div>`;
  }

  /** Horizontal target-vs-actual bars — a ranked comparison at a glance. */
  function barChart(rows, options = {}) {
    if (!rows.length) return `<div class="empty">${F.esc(options.empty || 'No data.')}</div>`;
    const max = Math.max(1, ...rows.map(r => Math.max(r.target || 0, r.actual || 0)));
    return `
      <div class="stack">
        ${rows.map(r => {
          const tone = F.tone(r.target ? r.actual / r.target : 0);
          return `
            <div>
              <div class="row row--between" style="margin-bottom:3px">
                <span style="font-size:12.5px;font-weight:550">${F.esc(r.label)}</span>
                <span class="tnum faint" style="font-size:12px">
                  ${F.unit(r.actual, options.unit)} / ${F.unit(r.target, options.unit)}
                  <span class="pill" data-tone="${tone}" style="margin-left:6px">${
                    F.pct(r.target ? r.actual / r.target : 0)}</span>
                </span>
              </div>
              <div style="position:relative;height:9px;background:var(--surface-3);border-radius:5px">
                <div style="position:absolute;left:0;top:0;height:100%;border-radius:5px;
                     width:${((r.actual || 0) / max * 100).toFixed(1)}%;
                     background:var(--${tone || 'brand'})"></div>
                <div style="position:absolute;top:-2px;height:13px;width:2px;background:var(--plan);
                     left:${((r.target || 0) / max * 100).toFixed(1)}%" title="Target"></div>
              </div>
            </div>`;
        }).join('')}
      </div>`;
  }

  function sparkline(values, options = {}) {
    const W = options.width || 88, H = options.height || 22;
    const clean = (values || []).map(v => (v === null || !isFinite(v)) ? 0 : v);
    if (!clean.length) return '';
    const max = Math.max(1, ...clean), n = Math.max(1, clean.length - 1);
    const d = clean.map((v, i) =>
      `${i ? 'L' : 'M'}${(i / n * W).toFixed(1)},${(H - (v / max) * (H - 3) - 1.5).toFixed(1)}`).join(' ');
    return `<svg class="sparkline" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"
              role="img" aria-label="${F.esc(options.ariaLabel || 'Trend')}">
      <path d="${d}" fill="none" stroke="var(--brand)" stroke-width="1.6"
            stroke-linejoin="round" stroke-linecap="round"></path>
    </svg>`;
  }

  function progressRing(pct, size = 54) {
    const r = (size - 6) / 2, c = 2 * Math.PI * r;
    const clamped = Math.max(0, Math.min(1.05, pct || 0));
    const tone = F.tone(pct);
    return `
      <svg class="progress-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"
           role="img" aria-label="${F.pct(pct)} achieved">
        <circle class="progress-ring__track" cx="${size / 2}" cy="${size / 2}" r="${r}"
                fill="none" stroke-width="5"></circle>
        <circle class="progress-ring__fill" cx="${size / 2}" cy="${size / 2}" r="${r}"
                fill="none" stroke-width="5" stroke="var(--${tone || 'brand'})"
                stroke-dasharray="${c.toFixed(1)}"
                stroke-dashoffset="${(c * (1 - Math.min(1, clamped))).toFixed(1)}"></circle>
      </svg>`;
  }

  /* ------------------------------------------------------------ inputs --- */
  function field({ name, label, type = 'text', value = '', required, hint, options, rows,
    placeholder, min, max, step, disabled, wide, readonly }) {
    const id = 'f_' + name;
    const common = `id="${id}" name="${name}"${required ? ' required' : ''}${
      disabled ? ' disabled' : ''}${readonly ? ' readonly' : ''}${
      placeholder ? ` placeholder="${F.esc(placeholder)}"` : ''}`;

    let control;
    if (type === 'select') {
      control = `<select class="select" ${common}>${
        (options || []).map(o => {
          const val = typeof o === 'object' ? o.value : o;
          const lab = typeof o === 'object' ? o.label : o;
          return `<option value="${F.esc(val)}"${
            String(val) === String(value) ? ' selected' : ''}>${F.esc(lab)}</option>`;
        }).join('')}</select>`;
    } else if (type === 'textarea') {
      control = `<textarea class="textarea" ${common} rows="${rows || 3}">${F.esc(value)}</textarea>`;
    } else if (type === 'checkbox') {
      return `<div class="field${wide ? ' formgrid--wide' : ''}">
        <label class="check"><input type="checkbox" ${common}${value ? ' checked' : ''}>
        <span>${F.esc(label)}</span></label>
        ${hint ? `<div class="field__hint">${F.esc(hint)}</div>` : ''}</div>`;
    } else {
      control = `<input class="input${type === 'number' ? ' input--num' : ''}" type="${type}" ${common}
        value="${F.esc(value)}"${min !== undefined ? ` min="${min}"` : ''}${
        max !== undefined ? ` max="${max}"` : ''}${step !== undefined ? ` step="${step}"` : ''}>`;
    }

    return `
      <div class="field${wide ? ' formgrid--wide' : ''}">
        <label class="field__label" for="${id}">${F.esc(label)}${
          required ? ' <span class="req" aria-hidden="true">*</span>' : ''}</label>
        ${control}
        ${hint ? `<div class="field__hint">${F.esc(hint)}</div>` : ''}
      </div>`;
  }

  function userOptions(includeBlank = true, filter) {
    const users = State.ref('users').filter(u => u.active && (!filter || filter(u)));
    const opts = users.map(u => ({
      value: u.userId,
      label: u.fullName + (u.regionName ? ' · ' + u.regionName : '')
    }));
    return includeBlank ? [{ value: '', label: '— Select —' }].concat(opts) : opts;
  }

  function regionOptions(includeBlank = true, category) {
    const regions = State.ref('regions')
      .filter(r => !category || r.category === category);
    const opts = regions.map(r => ({ value: r.regionId, label: r.regionName }));
    return includeBlank ? [{ value: '', label: 'All regions' }].concat(opts) : opts;
  }

  function cycleSelect(selectedId) {
    const cycles = (State.boot && State.boot.cycles) || [];
    return `<select class="select" id="cyclePicker" aria-label="Planning cycle">
      ${cycles.map(c => `<option value="${F.esc(c.cycleId)}"${
        c.cycleId === selectedId ? ' selected' : ''}>${F.esc(c.label)}</option>`).join('')}
    </select>`;
  }

  /* -------------------------------------------------------- drill-down --- */
  /**
   * Open the operational records behind a number. This is the traceability
   * promise made concrete: dashboard → KPI → activity → person → evidence.
   */
  async function openDrilldown(spec) {
    const body = Overlay.openDrawer({
      title: 'Loading records…',
      body: '<div class="stack">' +
        Array.from({ length: 6 }, () => '<div class="skeleton skeleton--row"></div>').join('') +
        '</div>'
    });

    try {
      const payload = Object.assign({ cycleId: State.cycleId, window: 'MTD' }, spec);
      const res = await Api.call('activity.drilldown', payload);

      D.q('#drawerTitle').textContent = res.metricLabel;

      const scopeBits = [];
      if (spec.pocUserId) scopeBits.push(State.userName(spec.pocUserId));
      if (spec.regionId) scopeBits.push(State.regionName(spec.regionId));
      if (spec.gstin) scopeBits.push(spec.gstin);

      const summary = `
        <div class="grid grid--3" style="margin-bottom:16px">
          ${statTile({ label: 'Value', value: F.unit(res.value, res.unit) })}
          ${statTile({ label: 'Records', value: F.int(res.recordCount) })}
          ${statTile({
            label: 'Window',
            value: `<span style="font-size:15px">${F.dateShort(res.window.from)} – ${F.dateShort(res.window.to)}</span>`,
            sub: res.window.kind
          })}
        </div>
        ${scopeBits.length ? `<p class="muted" style="margin-top:-6px">Scope: ${F.esc(scopeBits.join(' · '))}</p>` : ''}
        ${res.meta ? `<p class="faint mono" style="font-size:11.5px">${
          F.esc(Object.entries(res.meta).map(([k, v]) =>
            `${k}=${typeof v === 'number' ? Math.round(v * 100) / 100 : v}`).join('  '))}</p>` : ''}`;

      const rows = res.records || [];
      const list = rows.length ? table({
        compact: true,
        columns: [
          { label: 'Date', width: '96px', format: r => F.dateShort(r.date) },
          {
            label: 'Record', format: r => `
              <span class="strong">${F.esc(r.accountName || r.name || r.id)}</span>
              <span class="cell-sub">${F.esc(r.gstin || '')}${
                r.counterparty ? ' → ' + F.esc(r.counterparty) : ''}</span>`
          },
          { label: 'POC', format: r => F.esc(r.pocName || State.userName(r.pocUserId)) },
          {
            label: 'Measure', align: 'right', format: r => {
              const bits = [];
              if (r.tonnageMT) bits.push(F.mt(r.tonnageMT));
              if (r.gmvCr) bits.push(F.cr(r.gmvCr));
              if (r.quantityMT) bits.push(F.mt(r.quantityMT));
              if (r.amountINR) bits.push(F.inr(r.amountINR));
              if (r.visits) bits.push(F.int(r.visits) + ' visit(s)');
              if (r.txnCount) bits.push(F.int(r.txnCount) + ' txn');
              return bits.length ? bits.join('<span class="cell-sub"></span>') : '<span class="faint">—</span>';
            }
          },
          {
            label: 'Evidence & remarks', format: r => `
              ${r.remarks ? `<span>${F.esc(r.remarks)}</span>` : ''}
              ${r.evidence ? (String(r.evidence).startsWith('http')
                ? `<a class="cell-sub" href="${F.esc(r.evidence)}" target="_blank" rel="noopener">Open evidence ↗</a>`
                : `<span class="cell-sub">${F.esc(r.evidence)}</span>`) : ''}
              ${r.status ? `<span class="cell-sub">${F.esc(F.titleCase(r.status))}</span>` : ''}
              ${!r.remarks && !r.evidence && !r.status ? '<span class="faint">—</span>' : ''}`
          },
          { label: 'Source', width: '112px', format: r => `<span class="faint mono" style="font-size:11px">${F.esc(r.source || r.type)}</span>` }
        ],
        rows
      }) : `<div class="empty">
              <div class="empty__title">No underlying records</div>
              <div>Nothing has been recorded for this metric in this window yet.</div>
            </div>`;

      D.html(D.q('#drawerBody'), summary + list +
        (res.recordCount > rows.length
          ? `<p class="faint" style="margin-top:10px">Showing the first ${rows.length} of ${
            F.int(res.recordCount)} records.</p>` : ''));

      D.html(D.q('#drawerFoot'), `
        <button class="btn" data-close-drawer>Close</button>
        ${State.can('REPORT_EXPORT')
          ? `<button class="btn btn--primary" id="drillExport">Export activity log</button>` : ''}`);

      const exportBtn = D.q('#drillExport');
      if (exportBtn) {
        exportBtn.onclick = async () => {
          exportBtn.disabled = true;
          try {
            const out = await Api.call('report.export', {
              reportKey: 'ACTIVITIES', cycleId: State.cycleId,
              pocUserId: spec.pocUserId, regionId: spec.regionId
            });
            Toast.success('Exported', out.rows + ' rows written to ' + out.sheetName);
            window.open(out.url, '_blank', 'noopener');
          } catch (e) { Toast.fromError(e, 'Export failed'); }
          finally { exportBtn.disabled = false; }
        };
      }
    } catch (err) {
      D.q('#drawerTitle').textContent = 'Could not load records';
      D.html(D.q('#drawerBody'), errorState(err));
    }
  }

  /** Wire tiles and links carrying data-drill to the drill-down drawer. */
  function bindDrilldown(root) {
    D.on(root, 'click', '[data-drill]', (e, el) => {
      try { openDrilldown(JSON.parse(el.dataset.drill)); }
      catch (err) { console.error('Bad drill payload', err); }
    });
  }

  return {
    loading, tableSkeleton, emptyState, errorState, banner,
    pageHead, section, card, pill,
    metricTile, statTile,
    table, tva, achievementCell, growthCell,
    lineChart, barChart, sparkline, progressRing,
    field, userOptions, regionOptions, cycleSelect,
    openDrilldown, bindDrilldown
  };
})();
</script>

      ${Components.card({
        title: 'Step 1 — Create the database',
        body: `
          <p class="muted">Creates ${health.missingSheets.length || 23} backend sheets with their
          schema, seeds regions, configuration defaults and the KRA/KPI template library.</p>
          <div class="btnrow">
            <button class="btn btn--primary" id="runSetup">Run setup</button>
          </div>
          <div id="setupResult" style="margin-top:14px"></div>`
      })}

      <div style="height:14px"></div>

      ${Components.card({

          <span class="mono">Overall Shipments</span>, <span class="mono">Seller Onboarding</span>
          and <span class="mono">MTD Pulse Summary</span>. Leave blank if those tabs live in this
          same spreadsheet.</p>
          <div class="formgrid">
            ${Components.field({
              name: 'sourceId', label: 'Source spreadsheet ID', wide: true,
              placeholder: '1Nm_6yL74UOlJ-MycU9x0kgOxnAdqP38YMeLSMnxdYrY',
              hint: 'The long identifier in the sheet URL between /d/ and /edit.'
            })}
          </div>
          <div class="btnrow">
            <button class="btn" id="inspectSource">Check access</button>
          </div>
          <div id="inspectResult" style="margin-top:14px"></div>`
      })}`;

    D.q('#runSetup').onclick = async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.textContent = 'Creating…';
      try {
        const res = await Api.call('setup.run', {});
        D.html(D.q('#setupResult'), Components.banner('good', 'Database ready',
          `Schema version ${res.schemaVersion}. Created ${res.created.length} sheet(s), ` +
          `migrated ${res.migrated.length}.`));

    D.q('#inspectSource').onclick = async () => {

      const out = D.q('#inspectResult');
      out.innerHTML = '<div class="skeleton skeleton--row"></div>';

        const info = await Api.call('sync.inspect', { spreadsheetId: id });
        out.innerHTML = Components.banner('good', 'Access confirmed — ' + F.esc(info.name),
          `${info.sheets.length} tab(s) found.`) +
          Components.table({
            compact: true,
            columns: [
              { label: 'Tab', key: 'name', format: r => `<span class="mono">${F.esc(r.name)}</span>` },
              { label: 'Rows', key: 'rows', align: 'right', format: r => F.int(r.rows) },
              { label: 'Columns', key: 'cols', align: 'right', format: r => F.int(r.cols) },
              { label: '', format: r => r.hidden ? Components.pill('hidden', '') : '' }
            ],
            rows: info.sheets
          });
        try { localStorage.setItem('omp.sourceId', id); } catch (e) { /* ignore */ }
      } catch (err) {
        out.innerHTML = Components.errorState(err);
      }
    };
  }

  /** Shown when the schema exists but no cycle has been created yet. */
  function renderNoCycle(host) {
    const now = new Date();
    host.innerHTML = `
      ${Components.pageHead({
        title: 'Create your first planning cycle',
        subtitle: 'A cycle is one month for one category. It holds the KRAs, KPIs, weightages and targets.'
      })}
      ${Components.card({
        title: 'New cycle',
        body: `
          <form id="firstCycleForm">
            <div class="formgrid">
              ${Components.field({
                name: 'category', label: 'Category', type: 'select', required: true,
                options: State.ref('categories')
              })}
              ${Components.field({
                name: 'year', label: 'Year', type: 'number', required: true,
                value: now.getFullYear(), min: 2020, max: 2100
              })}
              ${Components.field({
                name: 'month', label: 'Month', type: 'select', required: true,
                value: now.getMonth() + 1,
                options: Array.from({ length: 12 }, (_, i) => ({
                  value: i + 1,
                  label: new Date(2000, i, 1).toLocaleString('en-IN', { month: 'long' })
                }))
              })}
              ${Components.field({
                name: 'workingDays', label: 'Working days', type: 'number',
                value: 25, min: 1, max: 31,
                hint: 'Drives the field-visit target.'
              })}
            </div>
            <div class="btnrow">
              <button class="btn btn--primary" type="submit">Create cycle from the KRA library</button>
            </div>
          </form>`
      })}`;

    D.q('#firstCycleForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        const cycle = await Api.call('cycle.create', D.formData(e.target));
        Toast.success('Cycle created', cycle.label + ' is in draft.');
        await Boot.reload();
        Router.go('planning', { cycleId: cycle.cycleId });
      } catch (err) {
        btn.disabled = false;
        Toast.fromError(err, 'Could not create the cycle');
      }
    };
  }

  return { renderNeedsSetup, renderNoCycle };
})();

/* ==========================================================================
   Dashboard — the executive view, and the alerts list it links to.
   Answers, in order: what is achieved, what is pending, who owns it, why.
   ========================================================================== */

Router.register('dashboard', {
  skeleton: () => Components.loading(6),
  async render(host) {
    const cycleId = State.cycleId;
    if (!cycleId) { SetupView.renderNoCycle(host); return; }

    const filters = {
      cycleId,
      stream: State.params.stream || State.stream,
      regionId: State.params.regionId || '',
      pocUserId: State.params.pocUserId || ''
    };

    const [exec, alerts, trendGmv, regions] = await Promise.all([
      Api.call('dashboard.executive', filters),
      Api.call('dashboard.alerts', { cycleId, limit: 8 }),
      Api.call('dashboard.trend', Object.assign({ metricKey: 'GMV_CR' }, filters)),
      Api.call('report.regionWise', filters)
    ]);

    State.alertCount = alerts.counts.total;
    Nav.setBadge('alerts', alerts.counts.p1 + alerts.counts.p2);

    const dq = exec.dataQuality;
    const cycleTone = F.statusTone(exec.cycle.status);

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Operations Dashboard',
        subtitle: `${F.esc(exec.scopeLabel)} · ${F.esc(exec.asOfLabel)} ·
          Day ${exec.progress.elapsedDays} of ${exec.progress.daysInMonth}
          <span class="pill" data-tone="${cycleTone}">${F.esc(exec.cycle.status)}</span>`,
        actions: `
          ${filterBar(filters)}
          ${State.can('REPORT_EXPORT')
            ? `<button class="btn btn--sm" id="exportDaily">Export</button>` : ''}`
      })}

      ${dq.ok ? '' : Components.banner(
        dq.issues.some(i => i.severity === 'P1') ? 'bad' : 'warn',
        'Data quality needs attention',
        dq.issues.slice(0, 3).map(i => F.esc(i.message)).join('<br>'),
        `<button class="btn btn--sm" data-route-to="alerts">Review</button>`)}

      ${Components.section({
        title: 'Month to date',
        hint: `Target vs achieved, with the run rate needed to close the gap`,
        body: `<div class="grid grid--tiles">${exec.tiles.map(Components.metricTile).join('')}</div>`
      })}

      <div class="grid grid--2">
        ${Components.card({
          title: 'GMV pace',
          actions: `<span class="pill" data-tone="${F.tone(trendGmv.projectedAchievement)}">
            Projected ${F.pct(trendGmv.projectedAchievement)}</span>`,
          body: gmvTrend(trendGmv)
        })}
        ${Components.card({
          title: 'Region performance',
          actions: `<button class="btn btn--sm" data-route-to="performance">Details</button>`,
          body: Components.barChart(regions.rows.map(r => ({
            label: r.regionName,
            target: r.totals.gmvTargetCr,
            actual: r.totals.gmvAchievedCr
          })), { unit: 'CR', empty: 'No regional plan yet.' })
        })}
      </div>

      <div style="height:16px"></div>

      ${Components.section({
        title: 'Needs attention',
        hint: `${alerts.counts.p1} critical · ${alerts.counts.p2} important · ${alerts.counts.p3} watch`,
        actions: `<button class="btn btn--sm" data-route-to="alerts">See all ${alerts.counts.total}</button>`,

            : `<div class="empty">
                 <div class="empty__icon" aria-hidden="true">✓</div>
                 <div class="empty__title">Nothing needs attention</div>
                 <div>Every KPI is on pace and no account is blocked.</div>
               </div>`
        })
      })}

      ${basisFootnote(exec.basis)}`;

    Components.bindDrilldown(host);
    bindFilterBar(host);

    D.on(host, 'click', '[data-route-to]', (e, el) => Router.go(el.dataset.routeTo));

    const exportBtn = D.q('#exportDaily', host);

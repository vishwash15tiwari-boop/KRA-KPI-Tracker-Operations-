      ],
      rows,
      footer: `<tr>
        <td>Total</td>
        <td class="num">${F.num(rows.reduce((a, k) => a + k.weightage, 0), 0)}%</td>
        <td colspan="3"></td>
        <td class="num">${F.num(rows.reduce((a, k) => a + k.evaluation.weightedScore, 0), 2)}</td>
        <td colspan="3"></td>
      </tr>`
    });

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Scorecard',
        subtitle: `${F.esc(card.poc.fullName)} · ${F.esc(card.cycleLabel)} · as of ${F.date(card.asOf)}`,
        actions: `
          ${State.can('SCORECARD_VIEW_ALL') ? `
            <select class="select btn--sm" id="scPoc" style="width:auto">
              ${State.ref('users').filter(u => u.active).map(u =>
                `<option value="${F.esc(u.userId)}"${u.userId === pocUserId ? ' selected' : ''}>${
                  F.esc(u.fullName)}</option>`).join('')}
            </select>` : ''}
          ${State.can('REPORT_EXPORT') ? `<button class="btn" id="exportSC">Export</button>` : ''}
          <button class="btn" onclick="window.print()">Print</button>`

      ${s.weightageValid ? '' : Components.banner('warn', 'Weightage does not total 100%',
        `This scorecard carries ${F.num(s.totalWeightage, 1)}% of weightage. The overall figure is ` +
        `divided by the actual total, so it remains meaningful — but the plan should be corrected.`)}

      <div class="card card--pad" style="margin-bottom:18px">
        <div class="row" style="gap:24px;align-items:center">
          ${Components.progressRing(s.overallAchievement, 84)}
          <div>
            <div style="font-size:32px;font-weight:700" class="tnum">${F.pct(s.overallAchievement)}</div>
            <div class="row" style="gap:8px;margin-top:4px">
              ${Components.pill(s.ratingLabel, s.tone)}
              ${Components.pill('Rating ' + s.rating + ' of 5', '')}
            </div>
          </div>
          <div style="flex:1;min-width:220px">
            <div class="muted" style="font-size:12.5px">Weighted score</div>
            <div style="font-size:20px;font-weight:650" class="tnum">
              ${F.num(s.weightedScore, 2)} <span class="muted" style="font-size:14px">

      ${bySt.SUPPLY && bySt.SUPPLY.length ? Components.section({

      ? await Api.call('report.regionWise', params)
      : await Api.call('report.pocWise', params);

    host.innerHTML = `
      ${Components.pageHead({
        title: level === 'region' ? 'Region Performance' : 'POC Performance',
        subtitle: `${F.esc(data.cycleLabel)} · as of ${F.date(data.asOf)} ·
          generated from operational records`,
        actions: `
          <select class="select btn--sm" id="pfStream" style="width:auto">
            <option value="SUPPLY"${stream === 'SUPPLY' ? ' selected' : ''}>Supply</option>

      })}

      </div>

      ${level === 'poc' ? Components.section({
        title: 'Material split',
        hint: 'Target vs achieved tonnage by material type',
        body: Components.card({
          flush: true,
          body: Components.table({
            compact: true,
            columns: [{ label: 'POC', format: r => F.esc(r.pocName) }].concat(
              (data.rows[0] ? data.rows[0].materials : []).map((m, i) => ({
                label: m.materialType, align: 'right',
                format: r => {

                  return x.tonnageTargetMT || x.tonnageAchievedMT

                }

            rows: data.rows,
            empty: 'No material split available.'
          })
        })
      }) : ''}`;

      Router.go('performance', { level, stream: e.target.value });
    const exp = D.q('#exportPF', host);
    if (exp) exp.onclick = () =>
      runExport(level === 'region' ? 'REGION_WISE' : 'POC_WISE', params, exp);
  }
});

        <td></td>
      </tr>` : ''

  });
}

        ${Components.statTile({

          compact: true,
          columns: [
            {
              label: 'Account', format: r => `<span class="strong">${F.esc(r.businessName)}</span>
                <span class="cell-sub mono">${F.esc(r.gstin || '')}</span>`
            },
            { label: 'POC', width: '140px', format: r => F.esc(r.pocName) },
            { label: 'Region', width: '100px', format: r => F.esc(r.regionName) },
            {
              label: 'Status', width: '110px',
              format: r => Components.pill(F.titleCase(r.onboardingStatus), F.statusTone(r.onboardingStatus))
            },
            { label: 'Onboarded', width: '110px', format: r => F.dateShort(r.onboardedDate) },
            {
              label: 'Visits MTD', align: 'right', width: '96px',
              format: r => `<span class="tnum ${r.mtdVisits ? '' : 'faint'}">${F.int(r.mtdVisits)}</span>
                <span class="cell-sub">LMTD ${F.int(r.lmtdVisits)}</span>`
            },
            { label: 'Last visit', width: '110px', format: r => r.lastVisitDate ? F.relative(r.lastVisitDate) : '<span class="faint">Never</span>' },
            {
              label: 'Txns MTD', align: 'right', width: '86px',
              format: r => `<span class="tnum ${r.mtdTxns ? '' : 'faint'}">${F.int(r.mtdTxns)}</span>`

            {
              label: 'Coverage', width: '150px', format: r => {
                if (r.transacted) return Components.pill('Transacting', 'good');
                if (r.visited) return Components.pill('Visited, no txn', 'warn');
                return Components.pill('Untouched', 'bad');
              }
            }
          ],
          rows: cov.rows,
          empty: 'No accounts to report on.'

      })}`;

    D.q('#covType', host).onchange = (e) =>

  }
});

  <script>
/* ==========================================================================
   Three screens that complete the loop:
     · Account Performance — the generated replacement for OMP-Sellers/Buyers

          the OMP-${accountType === 'BUYER' ? 'Buyers' : 'Sellers'} sheet`,

          <select class="select btn--sm" id="apType" style="width:auto">

      </div>

      ${Components.card({
        flush: true,
        body: Components.table({
          compact: true,
          columns: [

              label: 'Account', format: r => `<span class="strong">${F.esc(r.accountName)}</span>

            ...data.monthLabels.map((label, i) => ({
              label, align: 'right', width: '92px',
              format: r => {
                const m = r.monthly[i];
                return m.gmvCr
                  ? `<span class="tnum">${F.num(m.gmvCr, 2)}</span>
                     <span class="cell-sub">${F.num(m.tonnageMT, 0)} MT</span>`
                  : '<span class="faint">—</span>';
              }
            })),
            {
              label: 'Target', align: 'right', width: '120px',
              format: r => r.target.gmvTargetCr
                ? `<span class="tnum">${F.num(r.target.gmvTargetCr, 3)}</span>
                   <span class="cell-sub">${F.num(r.target.tonnageTargetMT, 0)} MT @ ₹${

              label: 'Achieved', align: 'right', width: '130px',
              format: r => `<button class="linklike tnum strong" data-drill='${F.esc(JSON.stringify({

function receivableModal(row, buyers) {

    title: row ? 'Edit receivable position' : 'Record receivable position',

            ${buyers.map(b => `<option value="${F.esc(b.accountId)}"${

              F.esc(b.businessName)} · ${F.esc(b.gstin || 'no GSTIN')}</option>`).join('')}
          </select>

        ${Components.field({
          name: 'asOnDate', label: 'As on', type: 'date', required: true,
          value: (row && row.asOnDate) || State.setting('asOf')
        })}
        ${Components.field({
          name: 'openingReceivableINR', label: 'Opening receivable (₹)', type: 'number',

        })}
        ${Components.field({
          name: 'closingReceivableINR', label: 'Closing receivable (₹)', type: 'number',
          min: 0, step: 'any', value: (row && row.closingReceivableINR) || 0
        })}
        ${Components.field({
          name: 'debitNoteINR', label: 'Debit notes (₹)', type: 'number',
          min: 0, step: 'any', value: (row && row.debitNoteINR) || 0,

        })}
        ${Components.field({
          name: 'creditNoteINR', label: 'Credit notes (₹)', type: 'number',
          min: 0, step: 'any', value: (row && row.creditNoteINR) || 0
        })}
        ${Components.field({
          name: 'overdueINR', label: 'Overdue (₹)', type: 'number',
          min: 0, step: 'any', value: (row && row.overdueINR) || 0

          ${r.gaps ? `<div class="field">

          ${r.status === 'SHARED' ? `

            <button class="btn btn--primary" data-ack="${F.esc(r.reviewId)}">Acknowledge</button>`
            : ''}`,
        foot: `Reviewed by ${F.esc(r.reviewedBy || '—')}${

  <script>
/* ==========================================================================
   Review and action items — where measurement turns into improvement.
   A review freezes the scorecard; the gaps it raises become owned actions that
   reappear on the POC's My Day screen until they are closed.
   ========================================================================== */

Router.register('review', {
  permission: 'REVIEW_MANAGE',
  skeleton: () => Components.loading(4),
  async render(host) {
    if (!State.cycleId) { SetupView.renderNoCycle(host); return; }
    const pack = await Api.call('review.pack', { cycleId: State.cycleId });
    const c = pack.completion;

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Monthly Review',
        subtitle: `${F.esc(pack.cycle.label)} · as of ${F.date(pack.asOf)} ·
          everything needed for the meeting, already assembled`,
        actions: `<button class="btn" onclick="window.print()">Print pack</button>`
      })}

      <div class="grid grid--tiles" style="margin-bottom:18px">
        ${Components.statTile({
          label: 'Reviews completed', value: `${c.reviewsDone} / ${c.reviewsExpected}`,
          tone: c.reviewsDone === c.reviewsExpected ? 'good' : 'warn'
        })}
        ${Components.statTile({
          label: 'Open actions', value: F.int(c.actionsOpen),
          tone: c.actionsOverdue ? 'warn' : ''
        })}
        ${Components.statTile({
          label: 'Overdue actions', value: F.int(c.actionsOverdue),
          tone: c.actionsOverdue ? 'bad' : 'good'
        })}
        ${Components.statTile({
          label: 'Items needing attention', value: F.int(pack.alerts.counts.total),
          sub: `${pack.alerts.counts.p1} critical`,
          tone: pack.alerts.counts.p1 ? 'bad' : ''
        })}
      </div>

      ${Components.section({
        title: 'Headline',
        body: `<div class="grid grid--tiles">${pack.headline.map(Components.metricTile).join('')}</div>`
      })}

      <div class="grid grid--2">
        ${Components.card({
          title: 'Top performers',
          flush: true,
          body: leaderRows(pack.topPerformers)
        })}
        ${Components.card({
          title: 'Needs support',
          flush: true,
          body: leaderRows(pack.needsSupport)
        })}
      </div>

      <div style="height:16px"></div>

      ${Components.section({
        title: 'Individual reviews',
        hint: 'The scorecard is frozen at the moment a review is opened',
        body: Components.card({
          flush: true,
          body: Components.table({
            columns: [
              {
                label: 'POC', format: r => `<span class="strong">${F.esc(r.pocName)}</span>
                  <span class="cell-sub">${F.esc(r.regionName)}</span>`
              },
              { label: 'Rank', align: 'right', width: '60px', format: r => r.rank },
              {
                label: 'Overall', align: 'right', width: '140px',
                format: r => `<span class="tnum strong">${F.pct(r.overallAchievement)}</span>
                  ${Components.pill(r.ratingLabel, r.tone)}`
              },
              {
                label: 'Review status', width: '150px', format: r => {
                  const rev = pack.reviews.find(x => x.subjectUserId === r.pocUserId);
                  return rev ? Components.pill(F.titleCase(rev.status), F.statusTone(rev.status))
                    : Components.pill('Not started', '');
                }
              },
              {
                label: '', width: '170px', format: r => {
                  const rev = pack.reviews.find(x => x.subjectUserId === r.pocUserId);
                  return `
                    <button class="btn btn--sm" data-scorecard="${F.esc(r.pocUserId)}">Scorecard</button>
                    <button class="btn btn--sm btn--primary" data-review="${F.esc(r.pocUserId)}"
                      ${rev ? `data-review-id="${F.esc(rev.reviewId)}"` : ''}>
                      ${rev ? 'Open' : 'Start review'}</button>`;
                }
              }
            ],
            rows: pack.leaderboard.rows,
            empty: 'No POCs assigned for this cycle.'
          })
        })
      })}

      ${Components.section({
        title: 'Open actions',
        hint: `${pack.openActions.length} item(s)`,
        actions: `<button class="btn btn--sm" data-goto="actions">Manage</button>`,
        body: Components.card({
          flush: true,
          body: pack.openActions.length ? Components.table({
            compact: true,
            columns: [
              { label: 'Action', format: r => F.esc(r.title) },
              { label: 'Owner', width: '150px', format: r => F.esc(r.ownerName) },
              { label: 'Priority', width: '80px', format: r => Components.pill(r.priority, r.priority === 'P1' ? 'bad' : r.priority === 'P2' ? 'warn' : '') },
              {
                label: 'Due', width: '120px',
                format: r => `${F.dateShort(r.dueDate)}${r.overdue ? ' ' + Components.pill('Overdue', 'bad') : ''}`
              },
              { label: 'Status', width: '120px', format: r => Components.pill(F.titleCase(r.status), F.statusTone(r.status)) }
            ],
            rows: pack.openActions
          }) : '<div class="empty"><div class="empty__title">No open actions</div></div>'
        })
      })}`;

    Components.bindDrilldown(host);
    D.on(host, 'click', '[data-goto]', (e, el) => Router.go(el.dataset.goto));
    D.on(host, 'click', '[data-scorecard]', (e, el) =>
      Router.go('scorecard', { pocUserId: el.dataset.scorecard }));
    D.on(host, 'click', '[data-review]', (e, el) =>
      reviewModal(el.dataset.review, el.dataset.reviewId, pack));
  }
});

function leaderRows(rows) {
  if (!rows.length) return '<div class="empty">No data.</div>';
  return `<ul class="itemlist">${rows.map(r => `
    <li class="item">
      <div class="item__body">
        <div class="item__title">${F.esc(r.pocName)}
          <span class="faint" style="font-weight:400"> · ${F.esc(r.regionName)}</span></div>
        <div class="item__detail">
          Weighted score ${F.num(r.weightedScore, 1)} ·
          ${r.onPace} KPI(s) on pace${r.atRisk ? `, ${r.atRisk} at risk` : ''}</div>
      </div>
      <div class="item__actions">
        <span class="pill" data-tone="${r.tone}">${F.pct(r.overallAchievement)}</span>
      </div>
    </li>`).join('')}</ul>`;
}

async function reviewModal(pocUserId, reviewId, pack) {
  const existing = reviewId ? await Api.call('review.get', { reviewId }) : null;
  const board = pack.leaderboard.rows.find(r => r.pocUserId === pocUserId);
  const card = await Api.call('report.scorecard', { cycleId: State.cycleId, pocUserId });

  const weakest = card.kpis.slice()
    .sort((a, b) => a.evaluation.achievement - b.evaluation.achievement).slice(0, 3);
  const strongest = card.kpis.slice()
    .sort((a, b) => b.evaluation.achievement - a.evaluation.achievement).slice(0, 3);

  Overlay.openModal({
    title: `Review · ${card.poc.fullName}`,
    wide: true,
    body: `
      <div class="row" style="gap:20px;margin-bottom:16px">
        ${Components.progressRing(card.summary.overallAchievement, 64)}
        <div>
          <div style="font-size:22px;font-weight:700" class="tnum">
            ${F.pct(card.summary.overallAchievement)}</div>
          <div>${Components.pill(card.summary.ratingLabel, card.summary.tone)}
            ${board ? Components.pill('Rank ' + board.rank, '') : ''}</div>
        </div>
        <div class="muted" style="font-size:12.5px">
          Weighted score ${F.num(card.summary.weightedScore, 1)} of
          ${F.num(card.summary.maxWeightedScore, 0)}<br>
          ${card.summary.kpiCount} KPI(s) · as of ${F.date(card.asOf)}
        </div>
      </div>

      ${Components.table({
        compact: true,
        columns: [
          { label: 'KPI', format: k => F.esc(k.kpiName) },
          { label: 'Weight', align: 'right', format: k => F.num(k.weightage, 0) + '%' },
          { label: 'Target', align: 'right', format: k => F.unit(k.evaluation.target, k.unit) },
          { label: 'Actual', align: 'right', format: k => F.unit(k.evaluation.actual, k.unit) },
          { label: 'Ach %', align: 'right', format: k => Components.achievementCell(k.evaluation.achievement) },
          { label: 'Weighted', align: 'right', format: k => F.num(k.evaluation.weightedScore, 2) }
        ],
        rows: card.kpis
      })}

      <form id="reviewForm" style="margin-top:16px">
        <input type="hidden" name="cycleId" value="${F.esc(State.cycleId)}">
        <input type="hidden" name="subjectUserId" value="${F.esc(pocUserId)}">
        ${existing ? `<input type="hidden" name="reviewId" value="${F.esc(existing.reviewId)}">` : ''}
        ${Components.field({
          name: 'strengths', label: 'What went well', type: 'textarea', wide: true, rows: 2,
          value: existing ? existing.strengths :
            strongest.filter(k => k.evaluation.achievement >= 0.9)
              .map(k => `${k.kpiName} at ${F.pct(k.evaluation.achievement)}`).join('; ')
        })}
        ${Components.field({
          name: 'gaps', label: 'Where the gap is', type: 'textarea', wide: true, rows: 2,
          value: existing ? existing.gaps :
            weakest.filter(k => k.evaluation.achievement < 0.9)
              .map(k => `${k.kpiName} at ${F.pct(k.evaluation.achievement)} ` +
                `(${F.unit(k.evaluation.actual, k.unit)} of ${F.unit(k.evaluation.target, k.unit)})`).join('; ')
        })}
        ${Components.field({
          name: 'leadershipNote', label: 'Leadership note', type: 'textarea', wide: true, rows: 2,
          value: existing ? existing.leadershipNote : ''
        })}
        ${Components.field({
          name: 'reviewDate', label: 'Review date', type: 'date',
          value: (existing && existing.reviewDate) || State.setting('today')
        })}
      </form>

      ${existing && existing.pocResponse ? Components.banner('info',
        'Response from ' + card.poc.fullName, F.esc(existing.pocResponse)) : ''}

      ${existing && existing.actions && existing.actions.length ? `
        <h3 style="font-size:14px;margin:16px 0 8px">Actions from this review</h3>
        ${Components.table({
          compact: true,
          columns: [
            { label: 'Action', format: r => F.esc(r.title) },
            { label: 'Due', format: r => F.dateShort(r.dueDate) },
            { label: 'Status', format: r => Components.pill(F.titleCase(r.status), F.statusTone(r.status)) }
          ],
          rows: existing.actions
        })}` : ''}`,
    footer: `
      <button class="btn" data-close-modal>Cancel</button>
      <button class="btn" id="addReviewAction">＋ Add action</button>
      <button class="btn btn--primary" id="saveReview">Save review</button>
      ${existing && existing.status === 'DRAFT'
        ? `<button class="btn btn--primary" id="shareReview">Save &amp; share</button>` : ''}
      ${existing && ['SHARED', 'ACKNOWLEDGED'].includes(existing.status)
        ? `<button class="btn btn--primary" id="signOffReview">Sign off</button>` : ''}`
  });

  const save = async () => Api.call('review.open', D.formData(D.q('#reviewForm')));

  D.q('#saveReview').onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      await save();
      Toast.success('Review saved');
      Overlay.closeModal();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      Toast.fromError(err);
    }
  };

  const shareBtn = D.q('#shareReview');
  if (shareBtn) shareBtn.onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      const saved = await save();
      await Api.call('review.share', { reviewId: saved.reviewId });
      Toast.success('Shared', card.poc.fullName + ' can now see and acknowledge it.');
      Overlay.closeModal();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      Toast.fromError(err);
    }
  };

  const signBtn = D.q('#signOffReview');
  if (signBtn) signBtn.onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      await save();
      await Api.call('review.signOff', { reviewId: existing.reviewId });
      Toast.success('Signed off');
      Overlay.closeModal();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      Toast.fromError(err);
    }
  };

  D.q('#addReviewAction').onclick = () => {
    Overlay.closeModal();
    actionModal(null, {
      ownerUserId: pocUserId,
      reviewId: existing ? existing.reviewId : '',
      sourceType: 'REVIEW'
    });
  };
}

Router.register('actions', {
  skeleton: () => Components.tableSkeleton(8),
  async render(host) {
    const filters = {
      cycleId: State.cycleId,
      ownerUserId: State.isPoc() ? State.user.userId : (State.params.ownerUserId || ''),
      status: State.params.status || '',
      openOnly: State.params.openOnly !== '0'
    };
    const rows = await Api.call('action.list', filters);
    const canManage = State.can('ACTION_MANAGE');

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Action Items',
        subtitle: `${rows.length} item(s) · ${rows.filter(r => r.overdue).length} overdue`,
        actions: canManage ? `<button class="btn btn--primary" id="newAction">＋ New action</button>` : ''
      })}

      <div class="filters">
        <div class="field">
          <label class="field__label" for="acOwner">Owner</label>
          <select class="select" id="acOwner"${State.isPoc() ? ' disabled' : ''}>
            <option value="">Everyone</option>
            ${State.ref('users').filter(u => u.active).map(u =>
              `<option value="${F.esc(u.userId)}"${u.userId === filters.ownerUserId ? ' selected' : ''}>${
                F.esc(u.fullName)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="acStatus">Status</label>
          <select class="select" id="acStatus">
            <option value="">Any open</option>
            ${['OPEN', 'IN_PROGRESS', 'BLOCKED', 'DONE', 'CANCELLED'].map(s =>
              `<option value="${s}"${s === filters.status ? ' selected' : ''}>${F.titleCase(s)}</option>`).join('')}
          </select>
        </div>
        <label class="check" style="margin-bottom:2px">
          <input type="checkbox" id="acAll"${!filters.openOnly ? ' checked' : ''}>
          <span>Include closed</span>
        </label>
      </div>

      ${Components.card({
        flush: true,
        body: Components.table({
          columns: [
            {
              label: 'Action', format: r => `<span class="strong">${F.esc(r.title)}</span>
                ${r.description ? `<span class="cell-sub">${F.esc(r.description)}</span>` : ''}`
            },
            { label: 'Owner', width: '150px', format: r => F.esc(r.ownerName) },
            {
              label: 'Priority', width: '80px',
              format: r => Components.pill(r.priority,
                r.priority === 'P1' ? 'bad' : r.priority === 'P2' ? 'warn' : '')
            },
            {
              label: 'Due', width: '130px',
              format: r => `${F.dateShort(r.dueDate)}
                ${r.overdue ? Components.pill('Overdue', 'bad') : ''}`
            },
            {
              label: 'Status', width: '130px',
              format: r => Components.pill(F.titleCase(r.status), F.statusTone(r.status))
            },
            { label: 'Source', width: '100px', format: r => `<span class="faint">${F.titleCase(r.sourceType)}</span>` },
            {
              label: '', width: '80px',
              format: r => `<button class="btn btn--sm" data-edit-action="${F.esc(r.actionId)}">Open</button>`
            }
          ],
          rows,
          empty: 'No action items. Convert an alert on the Needs Attention screen to create one.'
        })
      })}`;

    const apply = () => Router.go('actions', {
      ownerUserId: D.q('#acOwner', host).value,
      status: D.q('#acStatus', host).value,
      openOnly: D.q('#acAll', host).checked ? '0' : '1'
    });
    ['#acOwner', '#acStatus', '#acAll'].forEach(s => { D.q(s, host).onchange = apply; });

    const newBtn = D.q('#newAction', host);
    if (newBtn) newBtn.onclick = () => actionModal(null, {});

    D.on(host, 'click', '[data-edit-action]', (e, el) =>
      actionModal(rows.find(r => r.actionId === el.dataset.editAction), {}));
  }
});

function actionModal(action, defaults) {
  const canManage = State.can('ACTION_MANAGE');
  const isOwner = action && action.ownerUserId === State.user.userId;
  const ownerOnly = action && !canManage && isOwner;

  Overlay.openModal({
    title: action ? 'Action item' : 'New action item',
    body: `<form id="actionForm">
      ${action ? `<input type="hidden" name="actionId" value="${F.esc(action.actionId)}">` : ''}
      <input type="hidden" name="cycleId" value="${F.esc(State.cycleId || '')}">
      ${defaults.reviewId ? `<input type="hidden" name="reviewId" value="${F.esc(defaults.reviewId)}">` : ''}
      ${defaults.sourceType ? `<input type="hidden" name="sourceType" value="${F.esc(defaults.sourceType)}">` : ''}

      ${ownerOnly ? `
        <div class="banner" data-tone="info">
          <div class="banner__body">
            <div class="banner__title">${F.esc(action.title)}</div>
            <div>${F.esc(action.description || '')}</div>
            <div class="faint" style="margin-top:6px">Due ${F.date(action.dueDate)} ·
              ${F.esc(action.priority)}</div>
          </div>
        </div>
        <input type="hidden" name="ownerUserId" value="${F.esc(action.ownerUserId)}">` : `
        <div class="formgrid">
          ${Components.field({
            name: 'title', label: 'Action', required: true, wide: true,
            value: (action && action.title) || '',
            placeholder: 'What specifically needs to happen'
          })}
          ${Components.field({
            name: 'description', label: 'Detail', type: 'textarea', wide: true, rows: 2,
            value: (action && action.description) || ''
          })}
          ${Components.field({
            name: 'ownerUserId', label: 'Owner', type: 'select', required: true,
            value: (action && action.ownerUserId) || defaults.ownerUserId || '',
            options: Components.userOptions(true)
          })}
          ${Components.field({
            name: 'priority', label: 'Priority', type: 'select',
            value: (action && action.priority) || 'P2',
            options: [
              { value: 'P1', label: 'P1 — this week' },
              { value: 'P2', label: 'P2 — this cycle' },
              { value: 'P3', label: 'P3 — watch' }
            ]
          })}
          ${Components.field({
            name: 'dueDate', label: 'Due date', type: 'date',
            value: (action && action.dueDate) || ''
          })}
        </div>`}

      <div class="formgrid">
        ${Components.field({
          name: 'status', label: 'Status', type: 'select',
          value: (action && action.status) || 'OPEN',
          options: ['OPEN', 'IN_PROGRESS', 'BLOCKED', 'DONE', 'CANCELLED']
            .map(s => ({ value: s, label: F.titleCase(s) }))
        })}
        ${Components.field({
          name: 'closureRemarks', label: 'Progress / closure note', type: 'textarea', wide: true, rows: 2,
          value: (action && action.closureRemarks) || '',
          hint: 'Required when marking the action done.'
        })}
        ${Components.field({
          name: 'evidenceUrl', label: 'Evidence link', type: 'url',
          value: (action && action.evidenceUrl) || ''
        })}
      </div>
    </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="saveAction">Save</button>`
  });

  D.q('#saveAction').onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      await Api.call('action.save', D.formData(D.q('#actionForm')));
      Toast.success('Action saved');
      Overlay.closeModal();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      D.markInvalid(D.q('#actionForm'), err.message);
    }
  };
}
</script>

Router.register('users', {

  skeleton: () => Components.tableSkeleton(8),
  async render(host) {
    const tab = State.params.tab || 'users';
    const [users, regions] = await Promise.all([
      Api.call('user.list', { includeInactive: true }),
      Api.call('region.list', {})

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Users & Regions',
        subtitle: `${users.filter(u => u.active).length} active user(s) · ${regions.length} region(s)`,
        actions: `
          <button class="btn" id="newRegion">＋ Region</button>
          <button class="btn btn--primary" id="newUser">＋ User</button>`
      })}

      ${provisional.length ? Components.banner('warn',
        `${provisional.length} provisional user(s) created by the data sync`,
        'The sync met a name it did not recognise and created a placeholder so the transaction ' +
        'was not orphaned. Add an email and region, or merge each into an existing account.') : ''}

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="users" aria-selected="${tab === 'users'}">Users</button>
        <button class="tab" role="tab" data-tab="regions" aria-selected="${tab === 'regions'}">Regions</button>
      </div>

      ${tab === 'users' ? Components.card({
        flush: true,
        body: Components.table({
          columns: [
            {
              label: 'Name', format: u => `<span class="strong">${F.esc(u.fullName)}</span>
                <span class="cell-sub">${F.esc(u.email || 'no email — provisional')}</span>`
            },
            { label: 'Code', width: '110px', format: u => `<span class="mono">${F.esc(u.employeeCode || '—')}</span>` },
            { label: 'Role', width: '120px', format: u => Components.pill(F.titleCase(u.role), u.role === 'ADMIN' ? 'brand' : '') },
            { label: 'Category', width: '100px', format: u => F.esc(u.category) },
            { label: 'Region', width: '120px', format: u => F.esc(u.regionName || '—') },
            { label: 'Reports to', width: '150px', format: u => F.esc(u.reportsToName || '—') },
            {
              label: 'Status', width: '110px', format: u => u.active
                ? (u.provisional ? Components.pill('Provisional', 'warn') : Components.pill('Active', 'good'))
                : Components.pill('Disabled', '')
            },
            {
              label: '', width: '130px', format: u => `
                <button class="btn btn--sm" data-edit-user="${F.esc(u.userId)}">Edit</button>
                ${u.provisional ? `<button class="btn btn--sm" data-merge-user="${F.esc(u.userId)}">Merge</button>` : ''}`
            }
          ],
          rows: users,
          empty: 'No users yet.'
        })
      }) : Components.card({
        flush: true,
        body: Components.table({
          columns: [
            { label: 'Region', format: r => `<span class="strong">${F.esc(r.regionName)}</span>` },
            { label: 'Category', width: '110px', format: r => F.esc(r.category) },
            { label: 'Regional Head', width: '180px', format: r => F.esc(r.rhName || '—') },
            { label: 'States', format: r => F.esc(r.states || '—') },
            { label: 'Order', align: 'right', width: '70px', format: r => r.sequence },
            {
              label: '', width: '70px',
              format: r => `<button class="btn btn--sm" data-edit-region="${F.esc(r.regionId)}">Edit</button>`
            }
          ],
          rows: regions,
          empty: 'No regions defined.'
        })
      })}`;

    D.on(host, 'click', '[data-tab]', (e, el) => Router.go('users', { tab: el.dataset.tab }));
    D.q('#newUser', host).onclick = () => userModal(null);
    D.q('#newRegion', host).onclick = () => regionModal(null);
    D.on(host, 'click', '[data-edit-user]', (e, el) =>
      userModal(users.find(u => u.userId === el.dataset.editUser)));
    D.on(host, 'click', '[data-edit-region]', (e, el) =>
      regionModal(regions.find(r => r.regionId === el.dataset.editRegion)));
    D.on(host, 'click', '[data-merge-user]', (e, el) =>
      mergeUserModal(users.find(u => u.userId === el.dataset.mergeUser), users));
  }
});

function userModal(user) {
  Overlay.openModal({
    title: user ? 'Edit user' : 'New user',
    wide: true,
    body: `<form id="userForm">
      ${user ? `<input type="hidden" name="userId" value="${F.esc(user.userId)}">` : ''}
      <div class="formgrid">
        ${Components.field({
          name: 'fullName', label: 'Full name', required: true,
          value: (user && user.fullName) || '',
          hint: 'Must match the name used in the source spreadsheets so the sync links up.'
        })}
        ${Components.field({
          name: 'email', label: 'Work email', type: 'email',
          value: (user && user.email) || '',
          hint: 'Their Google account. Without it they cannot sign in.'
        })}
        ${Components.field({
          name: 'employeeCode', label: 'Employee code', value: (user && user.employeeCode) || '',
          placeholder: 'FFIRT00328'
        })}
        ${Components.field({
          name: 'role', label: 'Role', type: 'select', required: true,
          value: (user && user.role) || 'POC',
          options: [
            { value: 'POC', label: 'POC — records their own work' },
            { value: 'RH', label: 'Regional Head — plans and reviews a region' },
            { value: 'TEAM_LEAD', label: 'Team Lead — owns planning for a category' },
            { value: 'LEADERSHIP', label: 'Leadership — read all, review' },
            { value: 'VIEWER', label: 'Viewer — read only' },
            { value: 'ADMIN', label: 'Administrator — full control' }
          ]
        })}
        ${Components.field({
          name: 'category', label: 'Category', type: 'select',
          value: (user && user.category) || 'ALL',
          options: [{ value: 'ALL', label: 'All categories' }]
            .concat(State.ref('categories').map(c => ({ value: c, label: c })))
        })}
        ${Components.field({
          name: 'regionId', label: 'Region', type: 'select',
          value: (user && user.regionId) || '',
          options: Components.regionOptions(true)
        })}
        ${Components.field({
          name: 'stream', label: 'Stream', type: 'select',
          value: (user && user.stream) || 'BOTH',
          options: [
            { value: 'BOTH', label: 'Both' },
            { value: 'SUPPLY', label: 'Supply — sellers' },
            { value: 'DEMAND', label: 'Demand — buyers' }
          ]
        })}
        ${Components.field({
          name: 'reportsTo', label: 'Reports to', type: 'select',
          value: (user && user.reportsTo) || '', options: Components.userOptions(true)
        })}
        ${Components.field({ name: 'phone', label: 'Phone', value: (user && user.phone) || '' })}
        ${Components.field({
          name: 'aliases', label: 'Name aliases', wide: true, value: (user && user.aliases) || '',
          hint: 'Pipe-separated alternative spellings used in the source sheets, e.g. Joy Deep|Joydeep D.'
        })}
        ${Components.field({
          name: 'active', label: 'Active', type: 'checkbox',
          value: user ? user.active : true
        })}
      </div>
    </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="saveUser">Save user</button>`
  });

  D.q('#saveUser').onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      await Api.call('user.save', D.formData(D.q('#userForm')));
      Toast.success('User saved');
      Overlay.closeModal();
      await Boot.reload();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      D.markInvalid(D.q('#userForm'), err.message);
    }
  };
}

function mergeUserModal(source, users) {
  Overlay.openModal({
    title: 'Merge provisional user',
    body: `<form id="mergeForm">
      <p class="muted">Everything owned by <b>${F.esc(source.fullName)}</b> — accounts, activities,
      shipments, onboarding, visits and assignments — moves to the target user. The source name is
      kept as an alias so future syncs resolve correctly.</p>
      <input type="hidden" name="sourceUserId" value="${F.esc(source.userId)}">
      ${Components.field({
        name: 'targetUserId', label: 'Merge into', type: 'select', required: true, wide: true,
        options: [{ value: '', label: '— Select the real user —' }].concat(
          users.filter(u => u.active && u.email && u.userId !== source.userId)
            .map(u => ({ value: u.userId, label: `${u.fullName} · ${u.email}` })))
      })}
    </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="doMerge">Merge</button>`
  });

  D.q('#doMerge').onclick = async (e) => {
    const data = D.formData(D.q('#mergeForm'));
    if (!data.targetUserId) { Toast.warn('Select a target', 'Choose which user to merge into.'); return; }
    e.currentTarget.disabled = true;
    try {
      const res = await Api.call('user.merge', data);
      Toast.success('Merged', Object.entries(res.moved)
        .filter(([, v]) => v).map(([k, v]) => `${v} ${k}`).join(', ') || 'nothing to move');
      Overlay.closeModal();
      await Boot.reload();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      Toast.fromError(err);
    }
  };
}

/* ------------------------------------------------------------------- sync --- */
Router.register('sync', {
  permission: 'SYNC_RUN',
  skeleton: () => Components.tableSkeleton(6),
  async render(host) {
    const history = await Api.call('sync.history', { limit: 25 });
    let sourceId = '';
    try { sourceId = localStorage.getItem('omp.sourceId') || ''; } catch (e) { /* ignore */ }

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Data Sync',
        subtitle: 'Pulls shipments, onboarding and field visits from the operational workbook. ' +
          'Re-running corrects rather than duplicates.'
      })}

      ${Components.banner('info', 'How the sync behaves',
        'Rows are matched on their natural key — Shipment ID, Seller ID, employee and date — so ' +
        'the job is safe to re-run. Unknown sellers, buyers, regions and POCs are created ' +
        'automatically and flagged for you to complete.')}

      ${Components.card({
        title: 'Run a sync',
        body: `
          <form id="syncForm">
            <div class="formgrid">
              ${Components.field({
                name: 'spreadsheetId', label: 'Source spreadsheet ID', wide: true, value: sourceId,
                hint: 'Leave blank when the source tabs are in this same spreadsheet.'
              })}
              ${Components.field({
                name: 'category', label: 'Category', type: 'select',
                value: State.category, options: State.ref('categories')
              })}
            </div>
            <div class="btnrow" style="margin-top:6px">
              <button type="button" class="btn btn--primary" data-sync="all">Sync everything</button>
              <button type="button" class="btn" data-sync="onboarding">Onboarding only</button>
              <button type="button" class="btn" data-sync="shipments">Shipments only</button>
              <button type="button" class="btn" data-sync="pulse">Field visits only</button>
              <button type="button" class="btn btn--ghost" id="inspectBtn">Check access</button>
            </div>
            <div id="syncOut" style="margin-top:14px"></div>
          </form>`
      })}

      <div style="height:16px"></div>

      ${Components.card({
        title: 'Sync history',
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            { label: 'Started', width: '150px', format: r => F.dateTime(r.startedAt) },
            { label: 'Source', width: '120px', format: r => F.titleCase(r.source) },
            {
              label: 'Status', width: '100px',
              format: r => Components.pill(r.status, r.status === 'SUCCESS' ? 'good' : 'bad')
            },
            { label: 'Read', align: 'right', width: '70px', format: r => F.int(r.rowsRead) },
            { label: 'Added', align: 'right', width: '70px', format: r => F.int(r.rowsInserted) },
            { label: 'Updated', align: 'right', width: '80px', format: r => F.int(r.rowsUpdated) },
            { label: 'Skipped', align: 'right', width: '80px', format: r => F.int(r.rowsSkipped) },
            {
              label: 'Notes', format: r => r.errorMessage
                ? `<span style="color:var(--bad)">${F.esc(r.errorMessage)}</span>`
                : (r.warnings ? `<span class="faint">${F.esc(String(r.warnings).slice(0, 180))}</span>` : '')
            },
            { label: 'By', width: '150px', format: r => `<span class="faint">${F.esc(r.triggeredBy)}</span>` }
          ],
          rows: history,
          empty: 'No sync has run yet.'
        })
      })}`;

    const out = D.q('#syncOut', host);

    D.on(host, 'click', '[data-sync]', async (e, el) => {
      const kind = el.dataset.sync;
      const data = D.formData(D.q('#syncForm'));
      try { localStorage.setItem('omp.sourceId', data.spreadsheetId || ''); } catch (x) { /* ignore */ }

      D.qa('[data-sync]', host).forEach(b => { b.disabled = true; });
      out.innerHTML = '<div class="skeleton skeleton--row"></div>';
      try {
        const res = await Api.call('sync.' + kind, data);
        const results = kind === 'all'
          ? ['onboarding', 'shipments', 'pulse'].map(k => res[k])
          : [res];
        out.innerHTML = results.map(r => Components.banner(
          r.status === 'SUCCESS' ? 'good' : 'bad',
          `${F.titleCase(r.source)} — ${r.status}`,
          `Read ${F.int(r.rowsRead)}, added ${F.int(r.rowsInserted)}, ` +
          `updated ${F.int(r.rowsUpdated)}, skipped ${F.int(r.rowsSkipped)}.` +
          (r.errorMessage ? `<br><b>${F.esc(r.errorMessage)}</b>` : '') +
          (r.warnings && r.warnings.length
            ? `<details style="margin-top:6px"><summary style="cursor:pointer">
                ${r.warnings.length} warning(s)</summary>
                <ul style="margin:6px 0 0 16px">${r.warnings.map(w =>
                  `<li>${F.esc(w)}</li>`).join('')}</ul></details>` : '')
        )).join('');
        Toast.success('Sync finished', 'Dashboards already reflect the new data.');
      } catch (err) {
        out.innerHTML = Components.errorState(err);
        Toast.fromError(err, 'Sync failed');
      } finally {
        D.qa('[data-sync]', host).forEach(b => { b.disabled = false; });
      }
    });

    D.q('#inspectBtn', host).onclick = async () => {
      const id = D.q('#f_spreadsheetId', host).value.trim();
      if (!id) { Toast.warn('Enter an ID', 'Paste the source spreadsheet ID first.'); return; }
      out.innerHTML = '<div class="skeleton skeleton--row"></div>';
      try {
        const info = await Api.call('sync.inspect', { spreadsheetId: id });
        out.innerHTML = Components.banner('good', F.esc(info.name), `${info.sheets.length} tab(s).`) +
          Components.table({
            compact: true,
            columns: [
              { label: 'Tab', format: r => `<span class="mono">${F.esc(r.name)}</span>` },
              { label: 'Rows', align: 'right', format: r => F.int(r.rows) },
              { label: 'Cols', align: 'right', format: r => F.int(r.cols) }
            ],
            rows: info.sheets
          });
      } catch (err) { out.innerHTML = Components.errorState(err); }
    };
  }
});

/* --------------------------------------------------------------- settings --- */
Router.register('settings', {
  permission: 'CONFIG_MANAGE',
  skeleton: () => Components.tableSkeleton(10),
  async render(host) {
    const [config, health] = await Promise.all([
      Api.call('config.list', {}),
      Api.call('session.health', {})
    ]);

    const GROUPS = {
      'Fiscal calendar & reporting': ['FY_START_MONTH', 'REPORTING_LAG_DAYS'],
      'Value basis': ['GMV_BASIS', 'GMV_CR_DIVISOR', 'RATE_GST_DIVISOR', 'GST_RATE'],
      'Scoring': ['ACHIEVEMENT_CAP', 'REQUIRE_WEIGHTAGE_100', 'WEIGHTAGE_TOTAL'],
      'Derived KPI targets': ['EXISTING_TXN_TARGET_PCT', 'NEW_TXN_TARGET_PCT',
        'RETENTION_TARGET_PCT', 'DN_TARGET_PCT_OF_GMV'],
      'Field visits': ['PULSE_VISITS_PER_DAY', 'PULSE_DEFAULT_WORKING_DAYS', 'PULSE_DEDUCT_LEAVE'],
      'SLAs & alerts': ['SLA_ONBOARDING_DAYS', 'SLA_REVIEW_SUBMISSION_DAYS', 'SLA_DISPATCH_DAYS',
        'SLA_DELIVERY_DAYS', 'DORMANCY_DAYS', 'PACE_WARN_RATIO', 'PACE_CRITICAL_RATIO'],
      'Operational limits': ['MAX_ROWS_PER_READ', 'CACHE_TTL_SECONDS', 'ACTIVITY_BACKDATE_DAYS',
        'EVIDENCE_URL_PATTERN'],
      'Presentation': ['DEFAULT_CATEGORY', 'CURRENCY_SYMBOL']
    };
    const byKey = {};
    config.forEach(c => { byKey[c.key] = c; });

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Settings',
        subtitle: `Schema version ${health.schemaVersion} · ` +
          `${Object.values(health.rowCounts || {}).reduce((a, b) => a + Math.max(0, b), 0)} rows stored`,
        actions: `<a class="btn" href="${F.esc(health.spreadsheetUrl)}" target="_blank" rel="noopener">
          Open backend sheet ↗</a>`
      })}

      ${Components.banner('warn', 'These values change reported numbers',
        'GMV basis and the realised-rate divisor exist because the source workbook was internally ' +
        'inconsistent. The defaults are the corrected behaviour; the alternates reproduce the ' +
        'legacy spreadsheet figures exactly.')}

      ${Object.entries(GROUPS).map(([group, keys]) => Components.card({
        title: group,
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            {
              label: 'Setting', format: c => `<span class="strong mono">${F.esc(c.key)}</span>
                <span class="cell-sub">${F.esc(c.description || '')}</span>`
            },
            {
              label: 'Value', width: '220px', format: c => c.type === 'boolean'
                ? `<label class="check"><input type="checkbox" data-config="${F.esc(c.key)}"
                     ${String(c.value) === 'true' ? 'checked' : ''}><span>${
                     String(c.value) === 'true' ? 'Enabled' : 'Disabled'}</span></label>`
                : `<input class="input${c.type === 'number' ? ' input--num' : ''}"
                     type="${c.type === 'number' ? 'number' : 'text'}" step="any"
                     data-config="${F.esc(c.key)}" value="${F.esc(c.value)}">`
            },
            {
              label: 'Default', width: '120px',
              format: c => `<span class="faint mono">${F.esc(c.defaultValue)}</span>`
            },
            {
              label: '', width: '100px',
              format: c => c.modified ? Components.pill('Modified', 'warn') : ''
            }
          ],
          rows: keys.map(k => byKey[k]).filter(Boolean)
        })
      })).join('<div style="height:14px"></div>')}

      <div style="height:16px"></div>

      ${Components.card({
        title: 'Backend tables',
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            { label: 'Table', format: r => `<span class="mono">${F.esc(r.name)}</span>` },
            { label: 'Rows', align: 'right', format: r => r.count < 0 ? '—' : F.int(r.count) }
          ],
          rows: Object.entries(health.rowCounts || {}).map(([name, count]) => ({ name, count }))
        })
      })}`;

    D.on(host, 'change', '[data-config]', async (e, el) => {
      const key = el.dataset.config;
      const value = el.type === 'checkbox' ? el.checked : el.value;
      el.disabled = true;
      try {
        const res = await Api.call('config.set', { key, value });
        Toast.success('Setting updated', `${key}: ${res.previous} → ${res.value}`);
        Api.invalidate();
        await Boot.reload();
      } catch (err) {
        Toast.fromError(err, 'Could not save the setting');
      } finally {
        el.disabled = false;
      }
    });
  }
});

/* ------------------------------------------------------------------ audit --- */
Router.register('audit', {
  permission: 'AUDIT_VIEW',
  skeleton: () => Components.tableSkeleton(12),
  async render(host) {
    const entries = await Api.call('audit.recent', { limit: 300 });

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Audit Trail',
        subtitle: 'Every change: who, when, what, and the before/after state',
        actions: State.can('REPORT_EXPORT')
          ? `<button class="btn" id="exportAudit">Export</button>` : ''
      })}

      <div class="filters">
        <div class="field" style="flex:1;min-width:200px">
          <label class="field__label" for="auSearch">Filter</label>
          <input class="input" id="auSearch" type="search" placeholder="Action, user or entity">
        </div>
      </div>

      ${Components.card({
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            { label: 'When', width: '150px', format: r => F.dateTime(r.timestamp) },
            {
              label: 'Who', width: '190px', format: r => `${F.esc(r.userEmail || '—')}
                <span class="cell-sub">${F.esc(r.role || '')}</span>`
            },
            { label: 'Action', width: '180px', format: r => `<span class="mono">${F.esc(r.action)}</span>` },
            {
              label: 'Entity', width: '160px', format: r => `${F.esc(r.entity || '—')}
                <span class="cell-sub mono">${F.esc(String(r.entityId || '').slice(0, 24))}</span>`
            },
            { label: 'Summary', format: r => F.esc(r.summary) },
            {
              label: '', width: '80px', format: r => r.success
                ? Components.pill('OK', 'good')
                : `${Components.pill('Failed', 'bad')}<span class="cell-sub">${F.esc(r.errorMessage || '')}</span>`
            }
          ],
          rows: entries,
          empty: 'No audit entries yet.'
        })
      })}`;

    D.q('#auSearch', host).oninput = (e) => {
      const q = e.target.value.toLowerCase();
      D.qa('.table tbody tr', host).forEach(tr => {
        tr.hidden = q && !tr.textContent.toLowerCase().includes(q);
      });
    };

    const exp = D.q('#exportAudit', host);
    if (exp) exp.onclick = () => runExport('AUDIT', { limit: 2000 }, exp);
  }
});
</script>
  <script>
/* ==========================================================================
   Boot — first paint, shell wiring and global keyboard shortcuts.
   ========================================================================== */

const Boot = (() => {

  async function start() {
    Theme.init();
    try {
      const boot = await Api.call('session.bootstrap', {});

      if (boot.needsSetup) {
        showShell();
        D.q('#navList').innerHTML = '';
        D.q('#cycleContext').innerHTML = '';
        D.q('#userName').textContent = 'Setup';
        D.q('#userRole').textContent = '';
        D.q('#userAvatar').textContent = '⚙';
        SetupView.renderNeedsSetup(D.q('#view'), boot.health);
        return;
      }

      apply(boot);
      showShell();
      Nav.build();
      wireShell();

      if (!location.hash || location.hash === '#/') {
        Router.go(Nav.defaultRoute());
      } else {
        await Router.render();
      }
    } catch (err) {
      renderBootError(err);
    }
  }

  function apply(boot) {
    State.boot = boot;
    State.user = boot.user;
    State.category = boot.activeCycle
      ? boot.activeCycle.category
      : (boot.user.category === 'ALL' ? boot.reference.categories[0] : boot.user.category);
    State.cycleId = State.cycleId || (boot.activeCycle ? boot.activeCycle.cycleId : null);
    State.stream = State.user.stream === 'DEMAND' ? 'DEMAND' : 'SUPPLY';

    D.q('#userName').textContent = boot.user.fullName;
    D.q('#userRole').textContent = F.titleCase(boot.user.role);
    D.q('#userAvatar').textContent = F.initials(boot.user.fullName);
    D.q('#appVersion').textContent = `${boot.app.shortName} v${boot.app.version}`;

    renderCycleContext();
    renderUserPanel();
  }

  function renderCycleContext() {
    const boot = State.boot;
    const cycles = boot.cycles || [];
    const active = State.cycle();
    D.html(D.q('#cycleContext'), cycles.length ? `
      <select class="select" id="topCyclePicker" aria-label="Planning cycle"
              style="width:auto;max-width:230px;padding:5px 9px;font-size:12.5px">
        ${cycles.map(c => `<option value="${F.esc(c.cycleId)}"${
          c.cycleId === State.cycleId ? ' selected' : ''}>${F.esc(c.label)}</option>`).join('')}
      </select>
      ${active ? `<span class="pill" data-tone="${F.statusTone(active.status)}">${
        F.esc(active.status)}</span>` : ''}
      <span class="pill" title="Dashboards report through this date">
        As of ${F.dateShort(boot.settings.asOf)}</span>` : '');

    const picker = D.q('#topCyclePicker');
    if (picker) picker.onchange = (e) => {
      State.cycleId = e.target.value;
      const cycle = State.cycle();
      if (cycle) State.category = cycle.category;
      renderCycleContext();
      Api.invalidate();
      Router.render();
    };
  }

  function renderUserPanel() {
    const u = State.user;
    const scope = State.boot.scope;
    D.html(D.q('#userPanel'), `
      <dl>
        <dt>Signed in as</dt><dd>${F.esc(u.email || 'no email on record')}</dd>
        <dt>Role</dt><dd>${F.titleCase(u.role)}</dd>
        <dt>Scope</dt><dd>${F.titleCase(scope.level)} · ${F.esc(scope.categories.join(', '))}${
          u.regionName ? ' · ' + F.esc(u.regionName) : ''}</dd>
        <dt>Reporting basis</dt><dd>GMV ${F.esc(State.setting('gmvBasis'))} ·
          ${State.setting('reportingLagDays')}-day lag · ${F.esc(State.setting('fiscalYear'))}</dd>
      </dl>
      <div style="border-top:1px solid var(--border);padding-top:8px">
        <button class="navitem" data-user-action="theme">
          <span class="navitem__icon" aria-hidden="true">◐</span>
          <span>Theme: ${F.titleCase(Theme.current())}</span></button>
        <button class="navitem" data-user-action="reload">
          <span class="navitem__icon" aria-hidden="true">⟳</span><span>Reload data</span></button>
        ${State.can('CONFIG_MANAGE') ? `
          <button class="navitem" data-user-action="settings">
            <span class="navitem__icon" aria-hidden="true">⚙</span><span>Settings</span></button>` : ''}
      </div>`);
  }

  function showShell() {
    D.q('#boot').hidden = true;
    D.q('#shell').hidden = false;
  }

  function renderBootError(err) {
    const code = (err && err.code) || 'ERROR';
    const guidance = {
      NOT_PROVISIONED: 'Ask your Team Lead to add you under Administration → Users.',
      ACCOUNT_DISABLED: 'Your access has been disabled. Contact your Team Lead.',
      NO_IDENTITY: 'Open the application from your work Google account.',
      DB_NOT_CONFIGURED: 'An administrator needs to run setup from the Apps Script editor.',
      TRANSPORT: 'The server could not be reached. Check your connection and reload.'
    }[code] || 'If this persists, contact your administrator.';

    D.html(D.q('#boot'), `
      <div class="boot__inner" style="max-width:520px;padding:20px">
        <div class="boot__mark">OMP</div>
        <h2 style="font-size:17px;margin-bottom:8px">Cannot open the tracker</h2>
        <p style="color:var(--text-muted)">${F.esc((err && err.message) || String(err))}</p>
        <p style="color:var(--text-muted)">${F.esc(guidance)}</p>
        <p class="mono" style="color:var(--text-faint);font-size:11px">${F.esc(code)}</p>
        <button class="btn btn--primary" onclick="location.reload()">Reload</button>
      </div>`);
  }

  async function reload() {
    Api.invalidate();
    const boot = await Api.call('session.bootstrap', {});
    if (!boot.needsSetup) {
      apply(boot);
      Nav.build();
      Nav.markActive(State.route);
    }
    return boot;
  }

  function wireShell() {
    D.q('#navToggle').onclick = () => Nav.toggleMobile();
    D.q('#navScrim').onclick = () => Nav.closeMobile();

    D.q('#refreshBtn').onclick = async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      try {
        await reload();
        await Router.render();
        Toast.info('Refreshed', 'Showing the latest operational data.');
      } catch (err) {
        Toast.fromError(err, 'Could not refresh');
      } finally {
        btn.disabled = false;
      }
    };

    D.q('#themeBtn').onclick = () => { Theme.cycle(); renderUserPanel(); };

    const userBtn = D.q('#userBtn');
    userBtn.onclick = () => {
      const panel = D.q('#userPanel');
      panel.hidden = !panel.hidden;
      userBtn.setAttribute('aria-expanded', String(!panel.hidden));
    };
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.usermenu')) {
        D.q('#userPanel').hidden = true;
        userBtn.setAttribute('aria-expanded', 'false');
      }
    });

    D.on(D.q('#userPanel'), 'click', '[data-user-action]', (e, el) => {
      const action = el.dataset.userAction;
      D.q('#userPanel').hidden = true;
      if (action === 'theme') { Theme.cycle(); renderUserPanel(); }
      else if (action === 'reload') D.q('#refreshBtn').click();
      else if (action === 'settings') Router.go('settings');
    });

    // Overlays
    document.addEventListener('click', (e) => {
      if (e.target.closest('[data-close-modal]')) Overlay.closeModal();
      if (e.target.closest('[data-close-drawer]')) Overlay.closeDrawer();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!D.q('#modal').hidden) Overlay.closeModal();
        else if (!D.q('#drawer').hidden) Overlay.closeDrawer();
        else Nav.closeMobile();
        return;
      }
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;

      const shortcuts = {
        d: 'dashboard', m: 'myday', a: 'activity', p: 'planning',
        s: 'scorecard', l: 'leaderboard', n: 'alerts'
      };
      if (shortcuts[e.key]) { Router.go(shortcuts[e.key]); return; }
      if (e.key === 'r') D.q('#refreshBtn').click();
      if (e.key === '?') showShortcuts();
    });
  }

  function showShortcuts() {
    Overlay.openModal({
      title: 'Keyboard shortcuts',
      body: `<table class="table table--compact">
        <tbody>
          ${[
            ['d', 'Dashboard'], ['m', 'My Day'], ['a', 'Activity Log'],
            ['p', 'Monthly Plan'], ['s', 'Scorecard'], ['l', 'Leaderboard'],
            ['n', 'Needs Attention'], ['r', 'Refresh data'],
            ['Esc', 'Close dialog'], ['?', 'This list']
          ].map(([k, v]) => `<tr>
            <td style="width:90px"><span class="mono pill">${F.esc(k)}</span></td>
            <td>${F.esc(v)}</td></tr>`).join('')}
        </tbody></table>`,
      footer: `<button class="btn btn--primary" data-close-modal>Got it</button>`
    });
  }

  return { start, reload, apply };
})();

document.addEventListener('DOMContentLoaded', () => Boot.start());
</script>

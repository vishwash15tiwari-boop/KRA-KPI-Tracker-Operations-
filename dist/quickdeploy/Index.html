});

/* ---------------------------------------------------------------- alerts --- */
Router.register('alerts', {
  skeleton: () => Components.tableSkeleton(),
  async render(host) {
    const cycleId = State.cycleId;
    if (!cycleId) { SetupView.renderNoCycle(host); return; }

    const [alerts, quality] = await Promise.all([
      Api.call('dashboard.alerts', { cycleId }),
      Api.call('dashboard.dataQuality', { cycleId })
    ]);

    Nav.setBadge('alerts', alerts.counts.p1 + alerts.counts.p2);

    const grouped = {};
    alerts.alerts.forEach(a => { (grouped[a.kind] || (grouped[a.kind] = [])).push(a); });

    const KIND_LABELS = {
      KPI_OFF_PACE: 'KPIs behind pace',
      PLANNED_NOT_TRANSACTED: 'Planned accounts with no transaction',
      DORMANT_ACCOUNT: 'Dormant accounts',
      ONBOARDING_SLA: 'Onboarding SLA breaches',
      PIPELINE_OVERDUE: 'Overdue pipeline follow-ups',
      EVIDENCE_PENDING: 'Evidence awaiting verification',
      ACTION_OVERDUE: 'Overdue action items'
    };

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Needs attention',
        subtitle: `${alerts.counts.total} open item(s) as of ${F.date(alerts.asOf)}. ` +
          `Each names an owner and the next step.`
      })}

      <div class="grid grid--3" style="margin-bottom:18px">
        ${Components.statTile({ label: 'Critical (P1)', value: F.int(alerts.counts.p1), tone: 'bad' })}
        ${Components.statTile({ label: 'Important (P2)', value: F.int(alerts.counts.p2), tone: 'warn' })}
        ${Components.statTile({ label: 'Watch (P3)', value: F.int(alerts.counts.p3), tone: '' })}
      </div>

      ${quality.issues.length ? Components.section({
        title: 'Data quality',
        hint: 'Gaps that would otherwise distort a number silently',
        body: Components.card({
          flush: true,
          body: `<ul class="itemlist">${quality.issues.map(i => `
            <li class="item">
              <span class="item__sev" data-sev="${F.esc(i.severity)}">${F.esc(i.severity)}</span>
              <div class="item__body">
                <div class="item__title">${F.esc(i.message)}</div>
                ${i.sample && i.sample.length
                  ? `<div class="item__detail">${F.esc(i.sample.join(' · '))}${
                      i.count > i.sample.length ? ` and ${i.count - i.sample.length} more` : ''}</div>` : ''}
                <div class="faint mono" style="font-size:11px;margin-top:4px">${F.esc(i.code)}</div>
              </div>
            </li>`).join('')}</ul>`
        })
      }) : ''}

      ${Object.keys(grouped).length
        ? Object.keys(grouped).map(kind => Components.section({
            title: KIND_LABELS[kind] || F.titleCase(kind),
            hint: `${grouped[kind].length} item(s)`,
            body: Components.card({
              flush: true,
              body: `<ul class="itemlist">${grouped[kind].map(a => alertItem(a, true)).join('')}</ul>`
            })
          })).join('')
        : Components.emptyState({
            icon: '✓', title: 'All clear',
            message: 'No KPI is behind pace and nothing is blocked.'
          })}`;

    Components.bindDrilldown(host);

    D.on(host, 'click', '[data-alert-action]', async (e, el) => {
      const alert = JSON.parse(el.dataset.alertAction);
      el.disabled = true;
      try {
        const action = await Api.call('action.fromAlert', {
          alert: Object.assign({ cycleId: State.cycleId }, alert)
        });
        Toast.success('Action created', `Assigned to ${action.ownerName}, due ${F.date(action.dueDate)}.`);
        el.textContent = 'Tracked ✓';
      } catch (err) {
        el.disabled = false;
        Toast.fromError(err, 'Could not create the action');
      }
    });
  }
});

/* --------------------------------------------------------------- helpers --- */

function alertItem(a, showAction) {
  const payload = F.esc(JSON.stringify({
    id: a.id, kind: a.kind, title: a.title, detail: a.detail, nextStep: a.nextStep,
    severity: a.severity, ownerUserId: a.ownerUserId, regionId: a.regionId,
    accountId: a.accountId, kpiId: a.kpiId
  }));
  return `
    <li class="item">
      <span class="item__sev" data-sev="${F.esc(a.severity)}">${F.esc(a.severity)}</span>
      <div class="item__body">
        <div class="item__title">${F.esc(a.title)}</div>
        ${a.detail ? `<div class="item__detail">${F.esc(a.detail)}</div>` : ''}
        ${a.nextStep ? `<div class="item__next">${F.esc(a.nextStep)}</div>` : ''}
        ${a.ownerName ? `<div class="faint" style="font-size:11.5px;margin-top:5px">
          Owner: ${F.esc(a.ownerName)}</div>` : ''}
      </div>
      <div class="item__actions">
        ${a.drill ? `<button class="btn btn--sm" data-drill='${F.esc(JSON.stringify(a.drill))}'
          title="Show the underlying records">Trace</button>` : ''}
        ${showAction && a.ownerUserId && State.can('ACTION_MANAGE')
          ? `<button class="btn btn--sm" data-alert-action='${payload}'>Track</button>` : ''}
      </div>
    </li>`;
}

function gmvTrend(t) {
  const labels = t.points.map(p => p.day);
  return Components.lineChart([
    {
      name: 'Actual', color: 'var(--actual)', width: 2.4,
      points: t.points.map((p, i) => ({ y: p.actual, label: labels[i] }))
    },
    {
      name: 'Projection', color: 'var(--actual)', dash: '4 4',
      points: t.points.map((p, i) => ({ y: p.future ? p.projection : null, label: labels[i] }))
    },
    {
      name: 'Plan (straight line)', color: 'var(--plan)', dash: '5 4',
      points: t.points.map((p, i) => ({ y: p.plan, label: labels[i] }))
    },
    {
      name: 'Last month', color: 'var(--lastmonth)', width: 1.5,
      points: t.points.map((p, i) => ({ y: p.lastMonth, label: labels[i] }))
    }
  ], {
    formatY: v => '₹' + v.toFixed(1),
    ariaLabel: 'Cumulative GMV against plan and last month'
  }) + `
    <div class="row" style="margin-top:10px;gap:16px;font-size:12.5px">
      <span>Achieved <b class="tnum">${F.cr(t.actual)}</b></span>
      <span>Target <b class="tnum">${F.cr(t.target)}</b></span>
      <span>Run rate <b class="tnum">${F.num(t.currentDrr, 3)}</b> Cr/day</span>
      <span>Needed <b class="tnum">${F.num(t.requiredDrr, 3)}</b> Cr/day</span>
    </div>`;
}

function filterBar(filters) {
  const showScopePickers = !State.isPoc();
  return `
    <div class="row" style="gap:6px">
      <select class="select btn--sm" id="streamFilter" aria-label="Stream" style="width:auto">
        <option value="SUPPLY"${filters.stream === 'SUPPLY' ? ' selected' : ''}>Supply (Sellers)</option>
        <option value="DEMAND"${filters.stream === 'DEMAND' ? ' selected' : ''}>Demand (Buyers)</option>
      </select>
      ${showScopePickers ? `
        <select class="select btn--sm" id="regionFilter" aria-label="Region" style="width:auto">
          ${Components.regionOptions(true, State.category).map(o =>
            `<option value="${F.esc(o.value)}"${o.value === filters.regionId ? ' selected' : ''}>${F.esc(o.label)}</option>`
          ).join('')}
        </select>
        <select class="select btn--sm" id="pocFilter" aria-label="POC" style="width:auto">
          <option value="">All POCs</option>
          ${State.ref('users').filter(u => u.active && ['POC', 'RH', 'TEAM_LEAD'].includes(u.role))
            .map(u => `<option value="${F.esc(u.userId)}"${
              u.userId === filters.pocUserId ? ' selected' : ''}>${F.esc(u.fullName)}</option>`).join('')}
        </select>` : ''}
    </div>`;
}

function bindFilterBar(host) {
  const apply = () => {
    const params = { };
    const s = D.q('#streamFilter', host); if (s) params.stream = s.value;
    const r = D.q('#regionFilter', host); if (r && r.value) params.regionId = r.value;
    const p = D.q('#pocFilter', host); if (p && p.value) params.pocUserId = p.value;
    State.stream = params.stream || State.stream;
    Router.go(State.route, params);
  };
  ['#streamFilter', '#regionFilter', '#pocFilter'].forEach(sel => {
    const el = D.q(sel, host);
    if (el) el.onchange = apply;
  });
}

function basisFootnote(basis) {
  return `
    <p class="faint" style="font-size:11.5px;margin-top:18px">
      GMV basis: <span class="mono">${F.esc(basis.gmvBasis)}</span>
      ${basis.gmvBasis === 'TAXABLE' ? '(invoice value excluding GST)' : '(invoice value including GST)'} ·
      realised rate divisor <span class="mono">${F.esc(basis.rateGstDivisor)}</span> ·
      reporting lag <span class="mono">${F.esc(basis.reportingLagDays)}</span> day(s).
      Every figure above is computed from operational records — click any tile to see them.
    </p>`;
}

async function runExport(reportKey, params, btn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Exporting…';
  try {
    const out = await Api.call('report.export', Object.assign({ reportKey }, params));
    Toast.success('Exported', `${out.rows} rows written to ${out.sheetName}.`);
    window.open(out.url, '_blank', 'noopener');
  } catch (err) {
    Toast.fromError(err, 'Export failed');
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

  <script>
/* ==========================================================================
   My Day — the POC's home screen.
   The whole "under ten minutes a day" promise lives here: see what needs doing,
   log the work once, done. No trackers, no reports, no spreadsheets.
   ========================================================================== */

Router.register('myday', {
  skeleton: () => Components.loading(4),
  async render(host) {
    if (!State.cycleId) { SetupView.renderNoCycle(host); return; }

    const day = State.params.date || State.setting('today');
    const data = await Api.call('activity.myDay', { cycleId: State.cycleId, date: day });

    const s = data.scorecard;
    const isToday = day === State.setting('today');

    host.innerHTML = `
      ${Components.pageHead({
        title: `Good ${greeting()}, ${F.esc(data.user.fullName.split(' ')[0])}`,
        subtitle: `${F.esc(data.cycle.label)} · ${isToday ? 'Today' : F.date(day)} ·
          ${data.loggedTodayCount} update(s) recorded`,
        actions: `
          <input class="input" type="date" id="dayPicker" value="${F.esc(day)}"
                 max="${F.esc(State.setting('today'))}" style="width:auto" aria-label="Date">
          <button class="btn btn--ghost btn--sm" id="markLeave">Mark leave</button>
          <button class="btn btn--primary" id="logWork">＋ Log work</button>`
      })}

      <div class="grid grid--2" style="align-items:start">
        <div>
          ${Components.section({
            title: 'Needs your attention',
            hint: `${data.attention.length} item(s)`,
            body: Components.card({
              flush: true,
              body: data.attention.length
                ? `<ul class="itemlist">${data.attention.map(a => `
                    <li class="item">
                      <span class="item__sev" data-sev="${F.esc(a.severity)}">${F.esc(a.severity)}</span>
                      <div class="item__body">
                        <div class="item__title">${F.esc(a.title)}</div>
                        <div class="item__detail">${F.esc(a.detail)}</div>
                      </div>
                      ${a.accountId ? `<div class="item__actions">
                        <button class="btn btn--sm" data-log-account="${F.esc(a.accountId)}">Log</button>
                      </div>` : ''}
                    </li>`).join('')}</ul>`
                : `<div class="empty">
                     <div class="empty__icon" aria-hidden="true">✓</div>
                     <div class="empty__title">You are on top of everything</div>
                     <div>No KPI is behind pace and no account is waiting on you.</div>
                   </div>`
            })
          })}
        </div>

        <div>
          ${Components.section({
            title: 'Your scorecard',
            hint: `${F.pct(s.overallAchievement)} overall · ${F.esc(s.ratingLabel)}`,
            actions: `<button class="btn btn--sm" data-goto-scorecard>Open</button>`,
            body: Components.card({
              body: `
                <div class="row" style="gap:16px;margin-bottom:14px">
                  ${Components.progressRing(s.overallAchievement, 64)}
                  <div>
                    <div style="font-size:24px;font-weight:700" class="tnum">${F.pct(s.overallAchievement)}</div>
                    <div class="muted" style="font-size:12.5px">
                      Weighted score ${F.num(s.weightedScore, 1)} of ${F.num(s.maxWeightedScore, 0)}
                    </div>
                    <div class="muted" style="font-size:12.5px">
                      Day ${s.elapsedDays} of ${s.daysInMonth} · ${s.remainingDays} left
                    </div>
                  </div>
                </div>
                ${data.kpis.length ? `<div class="stack">${data.kpis.map(k => `
                  <div>
                    <div class="row row--between" style="margin-bottom:3px">
                      <span style="font-size:12.5px;font-weight:550">${F.esc(k.kpiName)}</span>
                      <span class="pill" data-tone="${F.paceTone(k.paceStatus)}">${F.paceLabel(k.paceStatus)}</span>
                    </div>
                    <div class="meter">
                      <div class="meter__fill" data-tone="${F.tone(k.achievement)}"
                           style="width:${Math.min(100, (k.achievement || 0) * 100).toFixed(1)}%"></div>
                    </div>
                    <div class="faint tnum" style="font-size:11.5px;margin-top:3px">
                      ${F.unit(k.actual, k.unit)} of ${F.unit(k.target, k.unit)} ·
                      need ${F.num(k.requiredDrr, 2)}/day
                    </div>
                  </div>`).join('')}</div>`
                  : '<p class="muted">No KPIs are assigned to you for this cycle yet.</p>'}`
            })
          })}
        </div>
      </div>

      ${Components.section({
        title: isToday ? "Today's updates" : `Updates on ${F.date(day)}`,
        hint: 'Recorded once — every dashboard reads from these',
        body: Components.card({
          flush: true,
          body: data.loggedToday.length
            ? Components.table({
                compact: true,
                columns: [
                  { label: 'Type', format: r => F.esc(r.activityTypeLabel) },
                  {
                    label: 'Account', format: r => `<span class="strong">${F.esc(r.accountName || '—')}</span>
                      <span class="cell-sub">${F.esc(r.gstin || '')}</span>`
                  },
                  {
                    label: 'Measure', align: 'right', format: r => {
                      const bits = [];
                      if (r.quantityMT) bits.push(F.mt(r.quantityMT));
                      if (r.amountINR) bits.push(F.inr(r.amountINR));
                      if (r.count) bits.push(F.int(r.count));
                      return bits.join(' · ') || '<span class="faint">—</span>';
                    }
                  },
                  { label: 'Remarks', format: r => F.esc(r.remarks) },
                  {
                    label: 'Evidence', format: r => r.evidenceUrl
                      ? `<a href="${F.esc(r.evidenceUrl)}" target="_blank" rel="noopener">Open ↗</a>`
                      : '<span class="faint">—</span>'
                  },
                  {
                    label: '', width: '80px', format: r => r.systemOwned ? ''
                      : `<button class="btn btn--sm" data-void="${F.esc(r.activityId)}">Void</button>`
                  }
                ],
                rows: data.loggedToday
              })
            : `<div class="empty">
                 <div class="empty__title">Nothing recorded yet</div>
                 <div>Log the visits, proposals and follow-ups you completed. It takes a minute.</div>
                 <div style="margin-top:14px">
                   <button class="btn btn--primary" id="logWork2">＋ Log work</button>
                 </div>
               </div>`
        })
      })}`;

    const openForm = (accountId) => ActivityForm.open({
      cycleId: State.cycleId,
      pocUserId: data.user.userId,
      activityDate: day,
      accountId,
      accounts: data.accounts,
      types: data.activityTypes,
      onSaved: () => Router.render()
    });

    D.q('#logWork', host).onclick = () => openForm();
    const alt = D.q('#logWork2', host);
    if (alt) alt.onclick = () => openForm();

    D.on(host, 'click', '[data-log-account]', (e, el) => openForm(el.dataset.logAccount));
    D.on(host, 'click', '[data-goto-scorecard]', () => Router.go('scorecard'));

    D.q('#dayPicker', host).onchange = (e) => Router.go('myday', { date: e.target.value });

    D.q('#markLeave', host).onclick = async () => {
      const ok = await Overlay.confirm({
        title: 'Mark leave',
        message: `Record ${F.date(day)} as a leave day? Your field-visit target is reduced accordingly.`,
        confirmLabel: 'Mark leave'
      });
      if (!ok) return;
      try {
        await Api.call('activity.markLeave', {
          date: day, category: State.category, pocUserId: data.user.userId
        });
        Toast.success('Leave recorded', F.date(day));
        Router.render();
      } catch (err) { Toast.fromError(err, 'Could not record leave'); }
    };

    D.on(host, 'click', '[data-void]', async (e, el) => {
      const reason = await Overlay.confirm({
        title: 'Void this record',
        message: 'The row is kept with your reason so the change stays auditable. It stops counting towards KPIs.',
        confirmLabel: 'Void record', tone: 'danger', requireReason: true
      });
      if (!reason) return;
      try {
        await Api.call('activity.void', { activityId: el.dataset.void, reason });
        Toast.success('Record voided');
        Router.render();
      } catch (err) { Toast.fromError(err, 'Could not void the record'); }
    });
  }
});

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
}

/* ==========================================================================
   The activity form — the single place a POC types anything.
   ========================================================================== */
const ActivityForm = (() => {

  function open({ cycleId, pocUserId, activityDate, accountId, accounts, types, activity, onSaved }) {
    const typeList = types || State.ref('activityTypes').filter(t => !t.systemOwned);
    const initialType = (activity && activity.activityType) || typeList[0].key;

    Overlay.openModal({
      title: activity ? 'Edit activity' : 'Log work',
      wide: false,
      body: `
        <form id="activityForm" novalidate>
          <div class="field">
            <label class="field__label">What did you do? <span class="req">*</span></label>
            <div class="btnrow" id="typeChips">
              ${typeList.map(t => `
                <button type="button" class="btn btn--sm" data-type="${F.esc(t.key)}"
                        aria-pressed="${t.key === initialType}"
                        ${t.key === initialType ? 'style="background:var(--brand);border-color:var(--brand);color:var(--brand-fg)"' : ''}>
                  ${F.esc(t.label)}</button>`).join('')}
            </div>
            <div class="field__hint" id="typeHelp"></div>
          </div>
          <input type="hidden" name="activityType" value="${F.esc(initialType)}">
          <input type="hidden" name="cycleId" value="${F.esc(cycleId)}">
          <input type="hidden" name="pocUserId" value="${F.esc(pocUserId)}">
          ${activity ? `<input type="hidden" name="activityId" value="${F.esc(activity.activityId)}">` : ''}

          <div class="formgrid">
            ${Components.field({
              name: 'activityDate', label: 'Date', type: 'date', required: true,
              value: (activity && activity.activityDate) || activityDate || State.setting('today'),
              max: State.setting('today')
            })}
            <div class="field" id="accountField">
              <label class="field__label" for="f_accountId">Account <span class="req">*</span></label>
              <select class="select" id="f_accountId" name="accountId">
                <option value="">— Select seller or buyer —</option>
                ${(accounts || []).map(a => `
                  <option value="${F.esc(a.accountId)}"${
                    a.accountId === ((activity && activity.accountId) || accountId) ? ' selected' : ''}>
                    ${F.esc(a.businessName)}${a.city ? ' · ' + F.esc(a.city) : ''}
                  </option>`).join('')}
              </select>
              <div class="field__hint">Not listed? Add it under Accounts first.</div>
            </div>
          </div>

          <div class="formgrid" id="measureFields"></div>

          ${Components.field({
            name: 'remarks', label: 'What happened', type: 'textarea', required: true, wide: true,
            value: (activity && activity.remarks) || '', rows: 3,
            placeholder: 'One or two lines. This is what leadership reads at review.'
          })}

          <div class="formgrid">
            ${Components.field({
              name: 'blockerReason', label: 'Blocker (if any)', type: 'select',
              value: (activity && activity.blockerReason) || '',
              options: [{ value: '', label: 'No blocker' }].concat(State.ref('blockerReasons'))
            })}
            ${Components.field({
              name: 'evidenceUrl', label: 'Evidence link', type: 'url',
              value: (activity && activity.evidenceUrl) || '',
              placeholder: 'https://drive.google.com/…',
              hint: 'Photo, document or system record.'
            })}
          </div>
        </form>`,
      footer: `
        <button class="btn" data-close-modal>Cancel</button>
        <button class="btn btn--primary" id="saveActivity">
          ${activity ? 'Save changes' : 'Record it'}</button>`
    });

    const form = D.q('#activityForm');

    function applyType(key) {
      const def = typeList.find(t => t.key === key) || typeList[0];
      form.querySelector('[name=activityType]').value = def.key;
      D.q('#typeHelp').textContent = def.help || '';

      D.qa('#typeChips [data-type]').forEach(btn => {
        const on = btn.dataset.type === def.key;
        btn.setAttribute('aria-pressed', on);
        btn.style.cssText = on
          ? 'background:var(--brand);border-color:var(--brand);color:var(--brand-fg)' : '';
      });

      D.q('#accountField').hidden = !def.requiresAccount;
      D.q('#f_accountId').required = !!def.requiresAccount;

      D.html(D.q('#measureFields'), (def.measures || []).map(m => Components.field({
        name: m.key, label: `${m.label} (${m.unit})`, type: 'number', step: 'any', min: 0,
        value: activity ? (activity[m.key] || '') : (m.default !== undefined ? m.default : '')
      })).join(''));

      const evidenceField = D.q('#f_evidenceUrl').closest('.field');
      const label = evidenceField.querySelector('.field__label');
      const required = def.evidence === 'REQUIRED';
      D.q('#f_evidenceUrl').required = required;
      label.innerHTML = 'Evidence link' + (required
        ? ' <span class="req" aria-hidden="true">*</span>'
        : ' <span class="faint">(optional)</span>');
    }

    applyType(initialType);
    D.on(D.q('#typeChips'), 'click', '[data-type]', (e, el) => applyType(el.dataset.type));

    D.q('#saveActivity').onclick = async (e) => {
      const btn = e.currentTarget;
      const payload = D.formData(form);
      D.markInvalid(form, null);

      if (!payload.remarks || !payload.remarks.trim()) {
        D.markInvalid(form, 'Add a short remark describing what happened.');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await Api.call('activity.save', payload);
        Toast.success('Recorded', 'Every dashboard already reflects it.');
        Overlay.closeModal();
        if (onSaved) onSaved();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = activity ? 'Save changes' : 'Record it';
        if (err.code === 'VALIDATION') D.markInvalid(form, err.message);
        else Toast.fromError(err, 'Could not save');
      }
    };
  }

  return { open };
})();

  <script>
/* ==========================================================================
   Planning — "Assign Once".
   Cycle, KRA/KPI structure, assignments, account plan and the annual onboarding
   plan, in the order a Team Lead works through them at the start of a month.
   ========================================================================== */

Router.register('planning', {
  permission: 'PLAN_VIEW',
  skeleton: () => Components.tableSkeleton(6),
  async render(host) {
    const cycleId = State.params.cycleId || State.cycleId;
    if (!cycleId) { SetupView.renderNoCycle(host); return; }

    const tab = State.params.tab || 'structure';
    const cycle = await Api.call('cycle.get', { cycleId });
    const canEdit = State.can('KRA_MANAGE') || State.can('PLAN_MANAGE');
    const editable = cycle.status === 'DRAFT' || cycle.status === 'PUBLISHED';

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Monthly Plan',
        subtitle: `${F.esc(cycle.label)} ·
          <span class="pill" data-tone="${F.statusTone(cycle.status)}">${F.esc(cycle.status)}</span> ·
          ${cycle.workingDays} working days`,
        actions: cycleActions(cycle)
      })}

      <div class="tabs" role="tablist">
        ${[
          ['structure', 'KRAs & KPIs'],
          ['assignments', 'Assignments'],
          ['accounts', 'Account Plan'],
          ['annual', 'Annual Onboarding Plan'],
          ['validate', 'Readiness']
        ].map(([key, label]) => `
          <button class="tab" role="tab" data-tab="${key}"
                  aria-selected="${tab === key}">${F.esc(label)}</button>`).join('')}
      </div>

      <div id="planBody"></div>`;

    D.on(host, 'click', '[data-tab]', (e, el) =>
      Router.go('planning', { cycleId, tab: el.dataset.tab }));

    bindCycleActions(host, cycle);

    const body = D.q('#planBody', host);
    body.innerHTML = Components.tableSkeleton(5);

    if (tab === 'structure') await renderStructure(body, cycle, canEdit && editable);
    else if (tab === 'assignments') await renderAssignments(body, cycle, canEdit && editable);
    else if (tab === 'accounts') await renderAccountPlan(body, cycle, State.can('PLAN_MANAGE') && editable);
    else if (tab === 'annual') await renderAnnualPlan(body, cycle, State.can('PLAN_MANAGE'));
    else await renderValidation(body, cycle);
  }
});

/* ------------------------------------------------------------- structure --- */
async function renderStructure(host, cycle, canEdit) {
  const tree = await Api.call('kra.tree', { cycleId: cycle.cycleId });
  const byStream = { SUPPLY: [], DEMAND: [] };
  tree.forEach(k => (byStream[k.stream] || (byStream[k.stream] = [])).push(k));

  const streamBlock = (stream, label) => {
    const kras = byStream[stream] || [];
    const total = kras.reduce((sum, k) => sum + k.totalWeightage, 0);
    const valid = Math.abs(total - 100) < 0.01;
    return Components.section({
      title: label,
      hint: `Weightage total <b class="${valid ? '' : 'muted'}">${F.num(total, 1)}%</b>` +
        (valid ? ' ✓' : ' — must equal 100% before publishing'),
      actions: canEdit
        ? `<button class="btn btn--sm" data-add-kra="${stream}">＋ Add KRA</button>` : '',
      body: kras.length ? kras.map(k => Components.card({
        title: `${k.kraName}`,
        actions: `
          <span class="pill" data-tone="brand">${F.num(k.totalWeightage, 0)}%</span>
          ${k.perspective ? Components.pill(k.perspective, '') : ''}
          ${canEdit ? `
            <button class="btn btn--sm" data-add-kpi="${F.esc(k.kraId)}">＋ KPI</button>
            <button class="btn btn--sm" data-edit-kra="${F.esc(k.kraId)}">Edit</button>
            <button class="btn btn--sm" data-del-kra="${F.esc(k.kraId)}">Remove</button>` : ''}`,
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            {
              label: 'KPI', format: r => `<span class="strong">${F.esc(r.kpiName)}</span>
                <span class="cell-sub">${F.esc(r.definition)}</span>`
            },
            { label: 'Weight', align: 'right', width: '80px', format: r => F.num(r.weightage, 0) + '%' },
            {
              label: 'Measured by', width: '190px', format: r =>
                `${F.esc(r.metricLabel)}<span class="cell-sub">${F.esc(F.titleCase(r.direction))}</span>`
            },
            {
              label: 'Target from', width: '180px', format: r =>
                `${F.esc(F.titleCase(r.targetBasis))}${r.basisPct
                  ? `<span class="cell-sub">${F.pct(r.basisPct, 0)} of ${F.esc(F.titleCase(r.basisMetric))}</span>` : ''}`
            },
            {
              label: 'Rating bands (1→5)', format: r => `
                <div class="kpi-target-bands">${r.targets.map((t, i) =>
                  `<span title="Rating ${i + 1}">${r.unitOfMeasure === 'Percentage'
                    ? F.pct(t, 0) : F.num(t, t < 1 ? 3 : 0)}</span>`).join('')}</div>`
            },
            {
              label: '', width: '70px', format: r => canEdit
                ? `<button class="btn btn--sm" data-edit-kpi="${F.esc(r.kpiId)}"
                     data-kra="${F.esc(r.kraId)}">Edit</button>` : ''
            }
          ],
          rows: k.kpis,
          empty: 'No KPIs under this KRA yet.'
        }),
        foot: k.sourceOfTracking ? `Source of tracking: ${F.esc(k.sourceOfTracking)}` : ''
      })).join('<div style="height:12px"></div>')
        : Components.emptyState({
            title: `No ${label} KRAs`,
            message: canEdit ? 'Add the first KRA to start the plan.' : 'Nothing defined yet.'
          })
    });
  };

  host.innerHTML = streamBlock('SUPPLY', 'Supply — Sellers') +
    streamBlock('DEMAND', 'Demand — Buyers');

  if (!canEdit) return;

  D.on(host, 'click', '[data-add-kra]', (e, el) => kraModal(cycle, { stream: el.dataset.addKra }));
  D.on(host, 'click', '[data-edit-kra]', (e, el) => {
    const kra = tree.find(k => k.kraId === el.dataset.editKra);
    kraModal(cycle, kra);
  });
  D.on(host, 'click', '[data-del-kra]', async (e, el) => {
    const kra = tree.find(k => k.kraId === el.dataset.delKra);
    const ok = await Overlay.confirm({
      title: 'Remove KRA',
      message: `Remove "${kra.kraName}" and its ${kra.kpis.length} KPI(s) from ${cycle.label}? ` +
        'Historical records are kept.',
      confirmLabel: 'Remove', tone: 'danger'
    });
    if (!ok) return;
    try {
      await Api.call('kra.delete', { kraId: kra.kraId });
      Toast.success('KRA removed');
      Router.render();
    } catch (err) { Toast.fromError(err); }
  });
  D.on(host, 'click', '[data-add-kpi]', (e, el) => kpiModal(cycle, { kraId: el.dataset.addKpi }));
  D.on(host, 'click', '[data-edit-kpi]', (e, el) => {
    const kra = tree.find(k => k.kraId === el.dataset.kra);
    const kpi = kra.kpis.find(p => p.kpiId === el.dataset.editKpi);
    kpiModal(cycle, Object.assign({ kraId: kra.kraId }, kpi));
  });
}

          name: 'metricKey', label: 'Measured by', type: 'select', required: true,

            { value: 'LOWER_BETTER', label: 'Lower is better (DSO, DN%)' }

        ${Components.field({
          name: 'targetBasis', label: 'Target comes from', type: 'select',
          value: kpi.targetBasis || 'MANUAL',
          options: [
            { value: 'ACCOUNT_PLAN', label: 'Sum of the account plan' },
            { value: 'PCT_OF_METRIC', label: 'Percentage of another metric' },
            { value: 'BALANCE_PLUS_MTD', label: 'Annual balance + month to date' },
            { value: 'RATE_PER_DAY', label: 'Working days × rate' },
            { value: 'MANUAL', label: 'Entered manually' }
          ]
        })}
        ${Components.field({
          name: 'basisMetric', label: 'Base metric', type: 'select',
          value: kpi.basisMetric || '',
          options: [{ value: '', label: '— None —' }].concat(
            metrics.map(m => ({ value: m.key, label: m.label })),
            [
              { value: 'ONBOARDED_SELLERS_FYTD', label: 'Onboarded sellers (FYTD)' },
              { value: 'ONBOARDED_BUYERS_FYTD', label: 'Onboarded buyers (FYTD)' },
              { value: 'PREV_MONTH_TRANSACTING_SELLERS', label: 'Sellers transacting last month' },
              { value: 'PREV_MONTH_TRANSACTING_BUYERS', label: 'Buyers transacting last month' }
            ])
        })}
        ${Components.field({
          name: 'basisPct', label: 'Percentage of base', type: 'number', step: 'any',
          value: kpi.basisPct === null || kpi.basisPct === undefined ? '' : kpi.basisPct,
          hint: 'As a fraction — 0.5 means 50%.'
        })}

      <div class="field formgrid--wide">
        <label class="field__label">Rating bands — the achievement needed for each rating</label>
        <div class="formgrid">
          ${targets.map((t, i) => `
            <div class="field">
              <label class="field__label" for="f_t${i + 1}">
                ${i + 1} · ${F.esc(State.ref('ratingScale').slice().reverse()[i]
                  ? State.ref('ratingScale').slice().reverse()[i].label : '')}</label>
              <input class="input input--num" type="number" step="any"

      e.currentTarget.disabled = false;

  const del = D.q('#delKpi');
  if (del) del.onclick = async () => {
    const ok = await Overlay.confirm({
      title: 'Remove KPI', message: `Remove "${kpi.kpiName}" from this cycle?`,
      confirmLabel: 'Remove', tone: 'danger'
    });
    if (!ok) return;
    try {
      await Api.call('kpi.delete', { kpiId: kpi.kpiId });
      Toast.success('KPI removed');
      Overlay.closeModal();
      Router.render();
    } catch (err) { Toast.fromError(err); }
  };
}

/* ----------------------------------------------------------- assignments --- */
async function renderAssignments(host, cycle, canEdit) {
  const [assignments, tree] = await Promise.all([
    Api.call('assignment.list', { cycleId: cycle.cycleId }),
    Api.call('kra.tree', { cycleId: cycle.cycleId })
  ]);
  const allKpis = tree.flatMap(k => k.kpis.map(p => Object.assign({ kraName: k.kraName, stream: k.stream }, p)));
  const byPoc = {};
  assignments.forEach(a => (byPoc[a.pocUserId] || (byPoc[a.pocUserId] = [])).push(a));

  host.innerHTML = `
    ${canEdit ? Components.banner('info', 'Assign once',
      'Select the POCs and the KPIs they own. Targets are derived automatically from the ' +
      'account plan and the annual plan — override one only when there is a reason.',
      `<button class="btn btn--sm btn--primary" id="bulkAssign">Assign KPIs</button>`) : ''}

    ${Object.keys(byPoc).length ? Object.keys(byPoc).map(pocId => {
      const rows = byPoc[pocId];
      const total = rows.reduce((s, r) => s + Number(r.weightage || 0), 0);
      const valid = Math.abs(total - 100) < 0.01;
      return Components.card({
        title: State.userName(pocId),
        actions: `<span class="pill" data-tone="${valid ? 'good' : 'warn'}">${
          F.num(total, 1)}% weightage${valid ? ' ✓' : ''}</span>`,
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            { label: 'KPI', format: r => F.esc(r.kpiName) },
            {
              label: 'Weight', align: 'right', width: '90px',
              format: r => `${F.num(r.weightage, 0)}%${r.weightageInherited
                ? '<span class="cell-sub">inherited</span>' : '<span class="cell-sub">override</span>'}`
            },
            {
              label: 'Target', align: 'right', width: '150px',
              format: r => r.targetOverride
                ? `<span class="strong tnum">${F.num(r.targetValue, 2)}</span>
                   <span class="cell-sub">manual override</span>`
                : `<span class="faint">derived</span>
                   <span class="cell-sub">${F.esc(F.titleCase(r.targetBasis))}</span>`
            },
            { label: 'Due', width: '110px', format: r => F.date(r.dueDate) },
            { label: 'Notes', format: r => F.esc(r.notes) },
            {
              label: '', width: '110px', format: r => canEdit ? `
                <button class="btn btn--sm" data-edit-asg="${F.esc(r.assignmentId)}">Edit</button>
                <button class="btn btn--sm" data-del-asg="${F.esc(r.assignmentId)}">✕</button>` : ''
            }
          ],
          rows
        })
      });
    }).join('<div style="height:12px"></div>')
      : Components.emptyState({
          icon: '👥', title: 'No KPIs assigned yet',
          message: 'Assign the KRA set to each POC so their scorecard can be calculated.',
          action: canEdit ? '<button class="btn btn--primary" id="bulkAssign2">Assign KPIs</button>' : ''
        })}`;

  if (!canEdit) return;

  const openBulk = () => bulkAssignModal(cycle, allKpis);
  ['#bulkAssign', '#bulkAssign2'].forEach(sel => {
    const el = D.q(sel, host); if (el) el.onclick = openBulk;
  });

  D.on(host, 'click', '[data-edit-asg]', (e, el) => {
    const a = assignments.find(x => x.assignmentId === el.dataset.editAsg);
    assignmentModal(a);
  });
  D.on(host, 'click', '[data-del-asg]', async (e, el) => {
    const a = assignments.find(x => x.assignmentId === el.dataset.delAsg);
    const ok = await Overlay.confirm({
      title: 'Remove assignment',
      message: `Remove "${a.kpiName}" from ${a.pocName}'s scorecard?`,
      confirmLabel: 'Remove', tone: 'danger'
    });
    if (!ok) return;
    try {
      await Api.call('assignment.remove', { assignmentId: a.assignmentId });
      Toast.success('Assignment removed');
      Router.render();
    } catch (err) { Toast.fromError(err); }
  });
}

              <button type="button" class="btn btn--sm" data-select="kpis" data-stream="DEMAND">Demand set</button>
              <button type="button" class="btn btn--sm" data-select="kpis" data-all="0">Clear</button>
            </div>

          ${Components.field({
            name: 'dueDate', label: 'Due date', type: 'date',
            value: cycle.endDate, hint: 'Defaults to the end of the cycle.'
          })}
          ${Components.field({ name: 'notes', label: 'Note to the POC' })}
        </div>
      </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="doAssign">Assign</button>`
  });

  D.on(D.q('#assignForm'), 'click', '[data-select]', (e, el) => {
    const group = el.dataset.select;
    D.qa(`[data-group="${group}"]`).forEach(cb => {
      if (el.dataset.stream) cb.checked = cb.dataset.stream === el.dataset.stream;
      else cb.checked = el.dataset.all === '1';
    });
  });

  D.q('#doAssign').onclick = async (e) => {
    const form = D.q('#assignForm');
    const payload = D.formData(form);
    payload.pocUserIds = D.qa('[data-group="pocs"]:checked', form).map(c => c.value);
    payload.kpiIds = D.qa('[data-group="kpis"]:checked', form).map(c => c.value);
    if (!payload.pocUserIds.length || !payload.kpiIds.length) {
      Toast.warn('Select both', 'Choose at least one POC and one KPI.');
      return;
    }
    e.currentTarget.disabled = true;
    try {
      const res = await Api.call('assignment.assign', payload);
      Toast.success('Assigned', `${res.inserted} created, ${res.updated} updated.`);
      Overlay.closeModal();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      Toast.fromError(err, 'Could not assign');
    }
  };

    gmv: t.gmv + p.gmvTargetCr

      flush: true,
      body: Components.table({
        compact: true,
        columns: [
          {

              <span class="cell-sub mono">${F.esc(r.gstin)}</span>`

          { label: 'Material', width: '110px', format: r => F.esc(r.materialType) },

          { label: 'Tonnage', align: 'right', width: '100px', format: r => F.num(r.tonnageTargetMT, 1) },
          { label: '₹/kg', align: 'right', width: '80px', format: r => F.num(r.ratePerKgTarget, 2) },

          `<button class="btn btn--sm" data-plan-account="${F.esc(a.accountId)}">

    const q = e.target.value.toLowerCase();
    D.qa('.table tbody tr', host).forEach(tr => {
      tr.hidden = q && !tr.textContent.toLowerCase().includes(q);

    openPlan(plans.find(p => p.planId === el.dataset.editPlan)));

  D.q('#importPlan', host).onclick = () => importPlanModal(cycle, accountType);

/* -------------------------------------------------------- cycle actions --- */
function cycleActions(cycle) {
  if (!State.can('CYCLE_MANAGE')) return Components.cycleSelect(cycle.cycleId);
  const buttons = [];
  if (cycle.status === 'DRAFT') buttons.push(`<button class="btn btn--primary" data-cycle="publish">Publish</button>`);
  if (cycle.status === 'PUBLISHED') buttons.push(`<button class="btn" data-cycle="lock">Lock cycle</button>`);
  if (cycle.status === 'LOCKED') {
    buttons.push(`<button class="btn" data-cycle="reopen">Reopen</button>`);
    buttons.push(`<button class="btn btn--primary" data-cycle="close">Close</button>`);
  }
  return `${Components.cycleSelect(cycle.cycleId)}
    <button class="btn" data-cycle="new">＋ New cycle</button>${buttons.join('')}`;
}

function bindCycleActions(host, cycle) {
  const picker = D.q('#cyclePicker', host);
  if (picker) picker.onchange = (e) => {
    State.cycleId = e.target.value;
    Router.go(State.route, Object.assign({}, State.params, { cycleId: e.target.value }));
  };

  D.on(host, 'click', '[data-cycle]', async (e, el) => {
    const op = el.dataset.cycle;
    if (op === 'new') { newCycleModal(); return; }

    const messages = {
      publish: ['Publish this cycle',
        'POCs will see their assignments and can start recording work. Structure changes stay possible.'],
      lock: ['Lock this cycle',
        'No further activity can be recorded and scores freeze for review. You can reopen it if needed.'],
      reopen: ['Reopen this cycle', 'Activity capture resumes and scores become live again.'],
      close: ['Close this cycle', 'The cycle is archived. This is the final state.']
    };
    const [title, message] = messages[op];
    const ok = await Overlay.confirm({ title, message, confirmLabel: F.titleCase(op) });
    if (!ok) return;

    el.disabled = true;
    try {
      await Api.call('cycle.' + op, { cycleId: cycle.cycleId });
      Toast.success(F.titleCase(op) + 'd', cycle.label);
      await Boot.reload();
      Router.render();
    } catch (err) {
      el.disabled = false;
      if (err.code === 'VALIDATION') {
        Toast.error('Cannot publish yet', err.message);
        Router.go('planning', { cycleId: cycle.cycleId, tab: 'validate' });
      } else {
        Toast.fromError(err);
      }
    }
  });
}

Router.register('weekly', {

        ${Components.statTile({ label: 'Achieved', value: F.mt(review.totals.achievedMT, 1) })}

          label: 'Achievement',
          value: F.pct(review.totals.targetMT ? review.totals.achievedMT / review.totals.targetMT : 0),

        })}
      </div>

      ${Components.card({
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            { label: 'POC', format: r => `${F.esc(r.pocName)}<span class="cell-sub">${F.esc(r.regionName)}</span>` },
            { label: 'Week target', align: 'right', format: r => F.num(r.weeklyTargetMT, 1) },
            { label: 'Achieved', align: 'right', format: r => F.num(r.weeklyAchievedMT, 1) },
            { label: 'Ach %', align: 'right', format: r => Components.achievementCell(r.achievementPct) }
          ].concat(review.days.map((d, i) => ({
            label: d.label.split(' ').slice(0, 2).join(' '), align: 'right',
            format: r => {
              const cell = r.daily[i];
              if (cell.future) return `<span class="faint tnum">${F.num(cell.target, 0)}</span>`;
              const tone = F.tone(cell.achievementPct);
              return `<span class="tnum">${F.num(cell.achieved, 1)}</span>
                <span class="cell-sub">of ${F.num(cell.target, 0)}</span>
                ${cell.target ? `<span class="pill" data-tone="${tone}"

    });

    const edit = D.q('#editWeek', host);
    if (edit) edit.onclick = () => weeklyPlanModal(review);

async function weeklyPlanModal(review) {
  const plan = await Api.call('weeklyPlan.get', {
    cycleId: State.cycleId, weekStart: review.weekStart
  });
  const pocs = State.ref('users').filter(u => u.active && ['POC', 'RH'].includes(u.role));
  const existing = {};
  plan.rows.forEach(r => r.daily.forEach(d => { existing[r.pocUserId + '|' + d.date] = d.tonnageTargetMT; }));

  Overlay.openModal({
    title: `Weekly targets · ${F.date(review.weekStart)}`,
    wide: true,
    body: `
      <p class="muted">Enter the daily tonnage target for each POC. Achievement is calculated
      from recorded shipments — there is nothing else to fill in.</p>
      <div class="tablewrap">
        <table class="table table--compact" id="weekGrid">
          <thead><tr><th>POC</th>${plan.days.map(d =>
            `<th class="num">${F.dateShort(d)}</th>`).join('')}<th class="num">Total</th></tr></thead>
          <tbody>
            ${pocs.map(u => `
              <tr data-poc="${F.esc(u.userId)}">
                <td>${F.esc(u.fullName)}</td>
                ${plan.days.map(d => `
                  <td class="num"><input class="input input--num" type="number" min="0" step="any"
                    style="width:76px" data-date="${F.esc(d)}"
                    value="${F.esc(existing[u.userId + '|' + d] || '')}"></td>`).join('')}
                <td class="num strong" data-total>0</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="saveWeek">Save targets</button>`
  });

  const recalc = () => {
    D.qa('#weekGrid tbody tr').forEach(tr => {
      const total = D.qa('input', tr).reduce((s, i) => s + Number(i.value || 0), 0);
      tr.querySelector('[data-total]').textContent = total ? F.num(total, 1) : '—';
    });
  };
  D.q('#weekGrid').addEventListener('input', recalc);
  recalc();

  D.q('#saveWeek').onclick = async (e) => {
    const entries = [];
    D.qa('#weekGrid tbody tr').forEach(tr => {
      const pocUserId = tr.dataset.poc;
      D.qa('input', tr).forEach(input => {
        const v = Number(input.value || 0);
        if (v > 0) entries.push({ pocUserId, date: input.dataset.date, tonnageTargetMT: v });
      });
    });
    if (!entries.length) { Toast.warn('Nothing entered', 'Add at least one daily target.'); return; }
    e.currentTarget.disabled = true;
    try {
      await Api.call('weeklyPlan.save', { cycleId: State.cycleId, entries });
      Toast.success('Weekly plan saved', entries.length + ' daily targets.');
      Overlay.closeModal();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      Toast.fromError(err);
    }
  };
}
</script>
  <script>
/* ==========================================================================
   Activity Log — every operational record, filterable and traceable.
   This is the audit surface: any dashboard number can be followed to a row here.
   ========================================================================== */

Router.register('activity', {
  skeleton: () => Components.tableSkeleton(10),
  async render(host) {
    if (!State.cycleId) { SetupView.renderNoCycle(host); return; }

    const filters = {
      cycleId: State.cycleId,
      pocUserId: State.params.pocUserId || (State.isPoc() ? State.user.userId : ''),
      activityType: State.params.activityType || '',
      verificationStatus: State.params.verificationStatus || '',
      from: State.params.from || '',
      to: State.params.to || '',
      search: State.params.search || '',
      includeVoided: State.params.includeVoided === '1',
      limit: 400
    };

    const [rows, accounts] = await Promise.all([
      Api.call('activity.list', filters),
      Api.call('account.list', { category: State.category, limit: 800 })
    ]);

    const pending = rows.filter(r => r.verificationStatus === 'PENDING').length;
    const canVerify = State.can('ACTIVITY_VERIFY');

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Activity Log',
        subtitle: `${rows.length} record(s) · every dashboard number resolves to a row here`,
        actions: `
          ${State.can('ACTIVITY_WRITE') ? `<button class="btn btn--primary" id="newActivity">＋ Log work</button>` : ''}
          ${State.can('REPORT_EXPORT') ? `<button class="btn" id="exportActivities">Export</button>` : ''}`
      })}

      <div class="filters">
        <div class="field">
          <label class="field__label" for="fPoc">POC</label>
          <select class="select" id="fPoc"${State.isPoc() ? ' disabled' : ''}>
            <option value="">Everyone</option>
            ${State.ref('users').filter(u => u.active).map(u =>
              `<option value="${F.esc(u.userId)}"${u.userId === filters.pocUserId ? ' selected' : ''}>${
                F.esc(u.fullName)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="fType">Type</label>
          <select class="select" id="fType">
            <option value="">All types</option>
            ${State.ref('activityTypes').map(t =>
              `<option value="${F.esc(t.key)}"${t.key === filters.activityType ? ' selected' : ''}>${
                F.esc(t.label)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="fVerify">Verification</label>
          <select class="select" id="fVerify">
            <option value="">Any</option>
            ${['PENDING', 'VERIFIED', 'REJECTED', 'NOT_REQUIRED'].map(s =>
              `<option value="${s}"${s === filters.verificationStatus ? ' selected' : ''}>${
                F.titleCase(s)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="fFrom">From</label>
          <input class="input" type="date" id="fFrom" value="${F.esc(filters.from)}">
        </div>
        <div class="field">
          <label class="field__label" for="fTo">To</label>
          <input class="input" type="date" id="fTo" value="${F.esc(filters.to)}">
        </div>
        <div class="field" style="flex:1;min-width:190px">
          <label class="field__label" for="fSearch">Search</label>
          <input class="input" type="search" id="fSearch" value="${F.esc(filters.search)}"
                 placeholder="Account, GSTIN or remark">
        </div>
        <button class="btn" id="applyFilters">Apply</button>
        <button class="btn btn--ghost" id="clearFilters">Clear</button>
      </div>

      ${pending && canVerify ? Components.banner('warn', `${pending} record(s) await verification`,
        'Evidence-bearing activities count towards KPIs immediately and are flagged until verified.',
        `<button class="btn btn--sm" id="filterPending">Show them</button>`) : ''}

      ${Components.card({
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            { label: 'Date', width: '92px', format: r => F.dateShort(r.activityDate) },
            {
              label: 'Type', width: '150px', format: r =>
                `${F.esc(r.activityTypeLabel)}${r.systemOwned
                  ? '<span class="cell-sub">synced</span>' : ''}`
            },
            { label: 'POC', width: '140px', format: r => F.esc(r.pocName) },
            {
              label: 'Account', format: r => `<span class="strong">${F.esc(r.accountName || '—')}</span>
                <span class="cell-sub mono">${F.esc(r.gstin || '')}</span>`
            },
            {
              label: 'Measure', align: 'right', width: '130px', format: r => {
                const bits = [];
                if (r.quantityMT) bits.push(F.mt(r.quantityMT));
                if (r.amountINR) bits.push(F.inr(r.amountINR));
                if (r.ratePerKg) bits.push('₹' + F.num(r.ratePerKg, 2) + '/kg');
                if (!bits.length && r.count) bits.push(F.int(r.count));
                return bits.length ? bits.join('<span class="cell-sub"></span>')
                  : '<span class="faint">—</span>';
              }
            },
            {
              label: 'Remarks & evidence', format: r => `
                ${F.esc(r.remarks)}
                ${r.blockerReason ? `<span class="cell-sub">Blocker: ${F.esc(r.blockerReason)}</span>` : ''}
                ${r.evidenceUrl ? `<a class="cell-sub" href="${F.esc(r.evidenceUrl)}"
                  target="_blank" rel="noopener">Evidence ↗</a>` : ''}`
            },
            {
              label: 'Status', width: '116px', format: r => r.voided
                ? `${Components.pill('Voided', 'bad')}<span class="cell-sub">${F.esc(r.voidReason)}</span>`
                : `${Components.pill(F.titleCase(r.verificationStatus), F.statusTone(r.verificationStatus))}
                   ${r.verifiedBy ? `<span class="cell-sub">${F.esc(r.verifiedBy)}</span>` : ''}`
            },
            {
              label: '', width: '130px', format: r => {
                if (r.voided) return '';
                const bits = [];
                if (canVerify && r.verificationStatus === 'PENDING') {
                  bits.push(`<button class="btn btn--sm" data-verify="${F.esc(r.activityId)}">Verify</button>`);
                }
                if (!r.systemOwned && (State.can('ACTIVITY_WRITE_ANY') || r.pocUserId === State.user.userId)) {
                  bits.push(`<button class="btn btn--sm" data-void="${F.esc(r.activityId)}">Void</button>`);
                }
                return bits.join(' ');
              }
            }
          ],
          rows,
          empty: 'No activity matches these filters.'
        })
      })}

      <p class="faint" style="margin-top:12px;font-size:11.5px">
        Recorded by · timestamp · remark · evidence are captured on every row. Records are never
        deleted — voiding keeps the row with its reason so any number that changed can be explained.
      </p>`;

    const apply = () => Router.go('activity', {
      pocUserId: D.q('#fPoc', host).value,
      activityType: D.q('#fType', host).value,
      verificationStatus: D.q('#fVerify', host).value,
      from: D.q('#fFrom', host).value,
      to: D.q('#fTo', host).value,
      search: D.q('#fSearch', host).value
    });

    D.q('#applyFilters', host).onclick = apply;
    D.q('#clearFilters', host).onclick = () => Router.go('activity');
    D.q('#fSearch', host).onkeydown = (e) => { if (e.key === 'Enter') apply(); };

    const pendingBtn = D.q('#filterPending', host);
    if (pendingBtn) pendingBtn.onclick = () =>
      Router.go('activity', { verificationStatus: 'PENDING' });

    const newBtn = D.q('#newActivity', host);
    if (newBtn) newBtn.onclick = () => ActivityForm.open({
      cycleId: State.cycleId,
      pocUserId: State.user.userId,
      accounts,
      onSaved: () => Router.render()
    });

    const exportBtn = D.q('#exportActivities', host);
    if (exportBtn) exportBtn.onclick = () => runExport('ACTIVITIES', filters, exportBtn);

    D.on(host, 'click', '[data-verify]', (e, el) => verifyModal(el.dataset.verify, rows));

    D.on(host, 'click', '[data-void]', async (e, el) => {
      const reason = await Overlay.confirm({
        title: 'Void this record',
        message: 'It stops counting towards KPIs. The row and your reason are kept for audit.',
        confirmLabel: 'Void record', tone: 'danger', requireReason: true
      });
      if (!reason) return;
      try {
        await Api.call('activity.void', { activityId: el.dataset.void, reason });
        Toast.success('Record voided');
        Router.render();
      } catch (err) { Toast.fromError(err); }
    });
  }
});

function verifyModal(activityId, rows) {
  const a = rows.find(r => r.activityId === activityId);
  Overlay.openModal({
    title: 'Verify evidence',
    body: `
      <dl class="stack" style="margin:0 0 14px">
        <div><dt class="faint" style="font-size:11.5px">ACTIVITY</dt>
          <dd style="margin:0">${F.esc(a.activityTypeLabel)} · ${F.date(a.activityDate)}</dd></div>
        <div><dt class="faint" style="font-size:11.5px">ACCOUNT</dt>
          <dd style="margin:0">${F.esc(a.accountName || '—')}</dd></div>
        <div><dt class="faint" style="font-size:11.5px">RECORDED BY</dt>
          <dd style="margin:0">${F.esc(a.pocName)} · ${F.dateTime(a.createdAt)}</dd></div>
        <div><dt class="faint" style="font-size:11.5px">REMARK</dt>
          <dd style="margin:0">${F.esc(a.remarks)}</dd></div>
        <div><dt class="faint" style="font-size:11.5px">EVIDENCE</dt>
          <dd style="margin:0">${a.evidenceUrl
            ? `<a href="${F.esc(a.evidenceUrl)}" target="_blank" rel="noopener">Open evidence ↗</a>`
            : '<span class="faint">None attached</span>'}</dd></div>
      </dl>
      <form id="verifyForm">
        ${Components.field({
          name: 'note', label: 'Note', type: 'textarea', rows: 2,
          hint: 'Required when rejecting.'
        })}
      </form>`,
    footer: `
      <button class="btn" data-close-modal>Cancel</button>
      <button class="btn btn--danger" data-decision="REJECTED">Reject</button>
      <button class="btn btn--primary" data-decision="VERIFIED">Verify</button>`
  });

  D.q('#modalFoot').onclick = async (e) => {
    const btn = e.target.closest('[data-decision]');
    if (!btn) return;
    const note = D.q('#f_note').value;
    if (btn.dataset.decision === 'REJECTED' && !note.trim()) {
      Toast.warn('Note required', 'Explain why the evidence was rejected.');
      return;
    }
    btn.disabled = true;
    try {
      await Api.call('activity.verify', {
        activityId, decision: btn.dataset.decision, note
      });
      Toast.success('Recorded', F.titleCase(btn.dataset.decision));
      Overlay.closeModal();
      Router.render();
    } catch (err) {
      btn.disabled = false;
      Toast.fromError(err);
    }
  };
}
</script>

/* ==========================================================================
   Accounts and the onboarding pipeline.
   The account master is the join key for every fact in the system, so this
   screen carries the coverage, dormancy and never-transacted signals directly.

Router.register('accounts', {
  skeleton: () => Components.tableSkeleton(10),
  async render(host) {
    const filters = {
      category: State.category,
      accountType: State.params.accountType || 'SELLER',

    const stats = {
      total: rows.length,
      onboarded: rows.filter(r => r.onboardingStatus === 'COMPLETED').length,
      dormant: rows.filter(r => r.dormant).length,
      never: rows.filter(r => r.neverTransacted && r.onboardingStatus === 'COMPLETED').length

      <div class="grid grid--3" style="margin-bottom:16px">

        ${Components.statTile({ label: 'Onboarded', value: F.int(stats.onboarded), tone: 'good' })}
        ${Components.statTile({

        ${Components.statTile({

      <div class="filters">
        <div class="field">

            <option value="SELLER"${filters.accountType === 'SELLER' ? ' selected' : ''}>Sellers</option>
            <option value="BUYER"${filters.accountType === 'BUYER' ? ' selected' : ''}>Buyers</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="aRegion">Region</label>
          <select class="select" id="aRegion">
            ${Components.regionOptions(true, State.category).map(o =>
              `<option value="${F.esc(o.value)}"${o.value === filters.regionId ? ' selected' : ''}>${
                F.esc(o.label)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="aPoc">POC</label>
          <select class="select" id="aPoc"${State.isPoc() ? ' disabled' : ''}>
            <option value="">All</option>
            ${State.ref('users').filter(u => u.active).map(u =>
              `<option value="${F.esc(u.userId)}"${u.userId === filters.pocUserId ? ' selected' : ''}>${
                F.esc(u.fullName)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="aStatus">Status</label>
          <select class="select" id="aStatus">
            <option value="">Any</option>
            ${['DRAFT', 'IN_REVIEW', 'COMPLETED', 'REJECTED'].map(s =>
              `<option value="${s}"${s === filters.onboardingStatus ? ' selected' : ''}>${
                F.titleCase(s)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:1;min-width:180px">
          <label class="field__label" for="aSearch">Search</label>
          <input class="input" type="search" id="aSearch" value="${F.esc(filters.search)}"
                 placeholder="Name, GSTIN or city">
        </div>
        <button class="btn" id="applyA">Apply</button>
      </div>

      ${Components.card({
        flush: true,
        body: Components.table({
          compact: true, clickable: true,
          rowAttrs: r => `data-account="${F.esc(r.accountId)}"`,
          columns: [
            {
              label: 'Account', format: r => `<span class="strong">${F.esc(r.businessName)}</span>
                <span class="cell-sub mono">${F.esc(r.gstin || 'no GSTIN')}</span>`
            },
            {
              label: 'Location', width: '150px',
              format: r => `${F.esc(r.city || '—')}<span class="cell-sub">${F.esc(r.state || '')}</span>`
            },
            { label: 'POC', width: '140px', format: r => F.esc(r.pocName || '—') },
            { label: 'Region', width: '100px', format: r => F.esc(r.regionName || '—') },
            { label: 'Material', width: '100px', format: r => F.esc(r.materialType || '—') },
            {
              label: 'Status', width: '120px',
              format: r => Components.pill(F.titleCase(r.onboardingStatus), F.statusTone(r.onboardingStatus))
            },
            {
              label: 'Last activity', width: '140px', format: r => {
                if (r.lastTxnDate) return `Txn ${F.relative(r.lastTxnDate)}`;
                if (r.lastVisitDate) return `Visit ${F.relative(r.lastVisitDate)}`;

async function accountDrawer(accountId) {
  Overlay.openDrawer({
    title: 'Loading account…',
    body: '<div class="skeleton skeleton--tile"></div>'
  });
  try {
    const [account, activities] = await Promise.all([
      Api.call('account.get', { accountId }),
      Api.call('activity.list', { accountId, limit: 40 })
    ]);

    D.q('#drawerTitle').textContent = account.businessName;
    D.html(D.q('#drawerBody'), `
      <div class="grid grid--3" style="margin-bottom:16px">
        ${Components.statTile({
          label: 'Status', value: `<span style="font-size:16px">${F.titleCase(account.onboardingStatus)}</span>`,
          sub: account.onboardedDate ? 'Onboarded ' + F.date(account.onboardedDate) : 'Not onboarded'
        })}
        ${Components.statTile({
          label: 'Last transaction',
          value: `<span style="font-size:16px">${account.lastTxnDate ? F.relative(account.lastTxnDate) : 'Never'}</span>`,
          tone: account.neverTransacted ? 'bad' : ''
        })}
        ${Components.statTile({
          label: 'Last visit',
          value: `<span style="font-size:16px">${account.lastVisitDate ? F.relative(account.lastVisitDate) : 'Never'}</span>`,
          tone: account.dormant ? 'warn' : ''
        })}
      </div>

      <dl class="formgrid" style="margin:0 0 18px">
        ${[
          ['GSTIN', account.gstin], ['Type', F.titleCase(account.accountType)],
          ['Sub-type', account.accountSubType], ['Material', account.materialType],
          ['POC', account.pocName], ['Region', account.regionName],
          ['Contact', account.contactPerson], ['Mobile', account.mobile],
          ['Email', account.email], ['Location', [account.city, account.state].filter(Boolean).join(', ')],
          ['Payment terms', account.paymentTerms], ['Vintage', account.businessVintage],
          ['Linked counterparty', account.counterpartyName], ['Blocker', account.blockerReason]
        ].filter(([, v]) => v).map(([k, v]) => `
          <div><dt class="faint" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em">${
            F.esc(k)}</dt><dd style="margin:2px 0 10px">${F.esc(v)}</dd></div>`).join('')}
      </dl>

      ${account.remarks ? Components.banner('info', 'Remarks', F.esc(account.remarks)) : ''}

      <h3 style="font-size:14px;margin-bottom:8px">Recent activity</h3>
      ${activities.length ? Components.table({
        compact: true,
        columns: [
          { label: 'Date', width: '90px', format: r => F.dateShort(r.activityDate) },
          { label: 'Type', format: r => F.esc(r.activityTypeLabel) },
          { label: 'POC', format: r => F.esc(r.pocName) },
          { label: 'Remarks', format: r => F.esc(r.remarks) },
          {
            label: '', width: '70px', format: r => r.evidenceUrl
              ? `<a href="${F.esc(r.evidenceUrl)}" target="_blank" rel="noopener">Evidence ↗</a>` : ''
          }
        ],
        rows: activities
      }) : '<p class="muted">Nothing recorded against this account yet.</p>'}`);

    D.html(D.q('#drawerFoot'), `
      <button class="btn" data-close-drawer>Close</button>
      ${State.can('ACTIVITY_WRITE') ? `<button class="btn" id="logForAccount">Log work</button>` : ''}
      ${State.can('PIPELINE_MANAGE') ? `<button class="btn btn--primary" id="editAccount">Edit</button>` : ''}`);

    const logBtn = D.q('#logForAccount');
    if (logBtn) logBtn.onclick = async () => {
      const accounts = await Api.call('account.list',
        { category: State.category, pocUserId: State.isPoc() ? State.user.userId : '' });
      Overlay.closeDrawer();
      ActivityForm.open({
        cycleId: State.cycleId, pocUserId: State.user.userId,
        accountId: account.accountId, accounts, onSaved: () => Router.render()
      });
    };

    const editBtn = D.q('#editAccount');
    if (editBtn) editBtn.onclick = () => { Overlay.closeDrawer(); accountModal(account); };
  } catch (err) {
    D.html(D.q('#drawerBody'), Components.errorState(err));
  }
}

function accountModal(account, defaultType) {
  Overlay.openModal({
    title: account ? 'Edit account' : 'New account',
    wide: true,
    body: `<form id="accountForm">
      ${account ? `<input type="hidden" name="accountId" value="${F.esc(account.accountId)}">` : ''}

        })}
        ${Components.field({
          name: 'category', label: 'Category', type: 'select',
          value: (account && account.category) || State.category, options: State.ref('categories')
        })}
        ${Components.field({
          name: 'businessName', label: 'Business name', required: true, wide: true,
          value: (account && account.businessName) || ''
        })}
        ${Components.field({
          name: 'gstin', label: 'GSTIN', value: (account && account.gstin) || '',
          placeholder: '27AAKCA0967H1ZI',
          hint: 'The join key to shipments. 15 characters.'
        })}
        ${Components.field({
          name: 'externalId', label: 'Source system ID', value: (account && account.externalId) || ''
        })}
        ${Components.field({
          name: 'pocUserId', label: 'POC', type: 'select',
          value: (account && account.pocUserId) || State.user.userId,
          options: Components.userOptions(true, u => ['POC', 'RH', 'TEAM_LEAD'].includes(u.role)),
          disabled: State.isPoc()

Router.register('pipeline', {
  skeleton: () => Components.tableSkeleton(8),
  async render(host) {
    const filters = {
      category: State.category,

    const rows = await Api.call('pipeline.list', filters);

    const STAGES = ['PROSPECT', 'FOLLOWUP', 'DOCS_PENDING', 'UNDER_PROCESS', 'ONBOARDED', 'DROPPED'];
    const byStage = {};
    STAGES.forEach(s => { byStage[s] = rows.filter(r => r.stage === s); });

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Onboarding Pipeline',
        subtitle: `${rows.length} ${filters.accountType === 'BUYER' ? 'buyer' : 'seller'}(s) in flight ·
          onboarding is gated on the document checklist`,
        actions: `
          <select class="select btn--sm" id="pType" style="width:auto">
            <option value="BUYER"${filters.accountType === 'BUYER' ? ' selected' : ''}>Buyers</option>
            <option value="SELLER"${filters.accountType === 'SELLER' ? ' selected' : ''}>Sellers</option>
          </select>
          ${State.can('PIPELINE_MANAGE')
            ? `<button class="btn btn--primary" id="newPipeline">＋ Add prospect</button>` : ''}`
      })}

      <div class="grid grid--3" style="margin-bottom:16px">
        ${STAGES.map(s => `
          <button class="tile" data-stage-filter="${s}" style="cursor:pointer"
                  ${filters.stage === s ? 'data-tone="brand"' : ''}>
            <div class="tile__label">${F.titleCase(s)}</div>
            <div class="tile__value">${F.int(byStage[s].length)}</div>
            <div class="tile__target">${
              byStage[s].filter(r => r.overdue).length
                ? `<span class="pill" data-tone="bad">${byStage[s].filter(r => r.overdue).length} overdue</span>`
                : '&nbsp;'}</div>
          </button>`).join('')}
      </div>

      ${Components.card({
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            {
              label: 'Business', format: r => `<span class="strong">${F.esc(r.businessName)}</span>
                <span class="cell-sub">${F.esc([r.city, r.state].filter(Boolean).join(', '))}</span>`
            },
            { label: 'Commodity', width: '110px', format: r => F.esc(r.commodity || '—') },
            { label: 'POC', width: '140px', format: r => F.esc(r.pocName) },
            { label: 'Terms', width: '100px', format: r => F.esc(r.paymentTerms || '—') },
            {
              label: 'Stage', width: '130px',
              format: r => Components.pill(F.titleCase(r.stage), F.statusTone(r.stage))
            },
            {
              label: 'Documents', width: '220px', format: r => `
                <div class="doc-slots">${r.documents.map(d => `
                  <span class="doc-slot" data-collected="${d.collected}"
                        data-doc="${F.esc(r.pipelineId)}|${F.esc(d.slotKey)}"
                        title="${F.esc(d.slotLabel)}${d.collectedDate ? ' · ' + d.collectedDate : ''}">
                    ${d.collected ? '✓' : '○'} ${F.esc(d.slotLabel.split(' ')[0])}
                  </span>`).join('')}</div>
                <span class="cell-sub">${r.documentsCollected}/${r.documentsRequired} collected</span>`
            },
            {
              label: 'Next action', width: '130px', format: r => r.nextActionDate
                ? `<span class="${r.overdue ? '' : 'muted'}">${F.dateShort(r.nextActionDate)}</span>
                   ${r.overdue ? Components.pill('Overdue', 'bad') : ''}`
                : '<span class="faint">—</span>'
            },
            {
              label: '', width: '70px', format: r => State.can('PIPELINE_MANAGE')
                ? `<button class="btn btn--sm" data-edit-pipe="${F.esc(r.pipelineId)}">Edit</button>` : ''
            }
          ],
          rows,
          empty: 'No prospects in the pipeline.'
        })
      })}`;

    D.q('#pType', host).onchange = (e) =>
      Router.go('pipeline', { accountType: e.target.value, stage: filters.stage });

    D.on(host, 'click', '[data-stage-filter]', (e, el) =>
      Router.go('pipeline', {
        accountType: filters.accountType,
        stage: filters.stage === el.dataset.stageFilter ? '' : el.dataset.stageFilter
      }));

    const newBtn = D.q('#newPipeline', host);
    if (newBtn) newBtn.onclick = () => pipelineModal(null, filters.accountType);

    D.on(host, 'click', '[data-edit-pipe]', (e, el) =>
      pipelineModal(rows.find(r => r.pipelineId === el.dataset.editPipe)));

    if (State.can('PIPELINE_MANAGE')) {
      D.on(host, 'click', '[data-doc]', (e, el) => {
        e.stopPropagation();
        const [pipelineId, slotKey] = el.dataset.doc.split('|');
        const row = rows.find(r => r.pipelineId === pipelineId);
        documentModal(row, row.documents.find(d => d.slotKey === slotKey));
      });
    }
  }
});

function documentModal(row, doc) {

  <script>
/* ==========================================================================
   Generated reports — daily review, scorecard, leaderboard, POC/Region
   performance and coverage. Nothing on these screens is ever typed.
   ========================================================================== */

/* ---------------------------------------------------------- daily review --- */
Router.register('daily-review', {
  skeleton: () => Components.tableSkeleton(10),
  async render(host) {
    if (!State.cycleId) { SetupView.renderNoCycle(host); return; }
    const stream = State.params.stream || State.stream;
    const dr = await Api.call('report.dailyReview', { cycleId: State.cycleId, stream });

    const gridTable = (metrics, scopeLabel) => Components.table({
      compact: true,
      columns: [
        { label: 'Metric', format: m => `<span class="strong">${F.esc(m.label)}</span>` },
        { label: 'Target', align: 'right', format: m => F.unit(m.target, m.unit) },
        {
          label: 'Achieved', align: 'right',
          format: m => `<button class="linklike tnum" data-drill='${F.esc(JSON.stringify(m.drill))}'
            >${F.unit(m.achieved, m.unit)}</button>`
        },
        { label: 'Ach %', align: 'right', format: m => Components.achievementCell(m.achievementPct) },
        {
          label: 'Current DRR', align: 'right',
          format: m => `<span class="tnum">${F.num(m.currentDrr, 2)}</span>`
        },
        {
          label: 'Required DRR', align: 'right', format: m => {
            const behind = m.requiredDrr > m.currentDrr;
            return `<span class="tnum ${behind ? '' : 'muted'}"
              ${behind ? 'style="color:var(--warn);font-weight:650"' : ''}>${F.num(m.requiredDrr, 2)}</span>`;
          }
        },
        { label: 'LMTD', align: 'right', format: m => `<span class="tnum">${F.unit(m.lmtd, m.unit)}</span>` },
        { label: 'MTD Growth', align: 'right', format: m => Components.growthCell(m.growthPct) },
        {
          label: 'Pace', width: '96px',
          format: m => Components.pill(F.paceLabel(m.paceStatus), F.paceTone(m.paceStatus))
        }
      ],
      rows: metrics
    });

    host.innerHTML = `
      ${Components.pageHead({
        title: dr.title,
        subtitle: `${F.esc(dr.asOfLabel)} · day ${dr.elapsedDays} of ${dr.daysInMonth},
          ${dr.remainingDays} remaining`,
        actions: `
          <select class="select btn--sm" id="drStream" style="width:auto">
            <option value="SUPPLY"${stream === 'SUPPLY' ? ' selected' : ''}>Supply (Sellers)</option>
            <option value="DEMAND"${stream === 'DEMAND' ? ' selected' : ''}>Demand (Buyers)</option>
          </select>
          ${State.can('REPORT_EXPORT') ? `<button class="btn" id="exportDR">Export</button>` : ''}
          <button class="btn" onclick="window.print()">Print</button>`
      })}

      ${Components.banner('info', 'Current DRR vs Required DRR',
        'Current DRR is the daily rate achieved so far. Required DRR is the rate needed each ' +
        'remaining day to reach the target. When required exceeds current, the gap is widening.')}

      ${Components.section({
        title: `${F.esc(dr.category)} — overall`,
        body: Components.card({ flush: true, body: gridTable(dr.overall) })
      })}

      ${dr.regions.map(r => Components.section({
        title: `${F.esc(r.regionName)}${r.rhName ? ' · ' + F.esc(r.rhName) : ''}`,
        hint: `${r.pocCount} POC(s)`,
        body: `
          ${Components.card({ flush: true, body: gridTable(r.metrics) })}
          <div style="height:10px"></div>
          <details>
            <summary style="cursor:pointer;padding:8px 2px;font-size:13px;color:var(--text-muted)">
              POC breakdown (${r.pocs.length})</summary>
            <div style="margin-top:10px" class="stack">
              ${r.pocs.map(p => Components.card({
                title: p.pocName, flush: true, body: gridTable(p.metrics)
              })).join('')}
            </div>
          </details>`
      })).join('')}

      <p class="faint" style="font-size:11.5px">Generated ${F.dateTime(dr.generatedAt)} —
        this replaces the manually maintained WhatsApp summary. Click any achieved figure to see
        the underlying operational records.</p>`;

    Components.bindDrilldown(host);
    D.q('#drStream', host).onchange = (e) => Router.go('daily-review', { stream: e.target.value });
    const exp = D.q('#exportDR', host);
    if (exp) exp.onclick = () => runExport('DAILY_REVIEW', { cycleId: State.cycleId, stream }, exp);
  }
});

/* -------------------------------------------------------------- scorecard --- */
Router.register('scorecard', {
  skeleton: () => Components.loading(3),
  async render(host) {

    const card = await Api.call('report.scorecard', { cycleId: State.cycleId, pocUserId });

    const s = card.summary;
    const bySt = { SUPPLY: [], DEMAND: [] };
    card.kpis.forEach(k => (bySt[k.stream] || (bySt[k.stream] = [])).push(k));

    const kpiTable = (rows) => Components.table({
      columns: [

          label: 'KRA / KPI', format: k => `<span class="strong">${F.esc(k.kpiName)}</span>

        {
          label: 'Target', align: 'right', width: '128px',
          format: k => `<span class="tnum">${F.unit(k.evaluation.target, k.unit)}</span>
            <span class="cell-sub" title="${F.esc(k.targetDetail)}">${F.esc(k.targetDetail)}</span>`
        },
        {
          label: 'Actual', align: 'right', width: '110px',
          format: k => `<button class="linklike tnum" data-drill='${F.esc(JSON.stringify(k.drill))}'

          label: 'Ach %', align: 'right', width: '86px',

        {
          label: 'Weighted', align: 'right', width: '96px',

            <span class="cell-sub">of ${F.num(k.evaluation.maxWeightedScore, 1)}</span>`
        },
        {
          label: 'Status', width: '116px',
          format: k => `${Components.pill(k.evaluation.bandLabel, F.tone(k.evaluation.achievement))}
            <span class="cell-sub">${F.esc(k.evaluation.ratingLabel)}</span>`
        },
        {
          label: 'Pace', width: '150px', format: k => `
            ${Components.pill(F.paceLabel(k.evaluation.paceStatus), F.paceTone(k.evaluation.paceStatus))}

        {
          label: 'vs LMTD', align: 'right', width: '92px',
          format: k => Components.growthCell(k.evaluation.growthPct)

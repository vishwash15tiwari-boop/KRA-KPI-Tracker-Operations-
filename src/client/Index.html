<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OMP Operations KRA/KPI Tracker</title>
  <?!= include('Styles'); ?>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div id="boot" class="boot">
    <div class="boot__inner">
      <div class="boot__mark" aria-hidden="true">OMP</div>
      <div class="spinner" role="status" aria-label="Loading"></div>
      <p class="boot__text">Loading your operating platform…</p>
    </div>
  </div>

  <div id="shell" class="shell" hidden>
    <header class="topbar">
      <button class="iconbtn topbar__menu" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span class="burger" aria-hidden="true"></span>
      </button>

      <div class="topbar__brand">
        <span class="topbar__mark" aria-hidden="true">OMP</span>
        <span class="topbar__title">Operations Tracker</span>
      </div>

      <div class="topbar__context" id="cycleContext"></div>

      <div class="topbar__actions">
        <button class="btn btn--ghost btn--sm" id="refreshBtn" title="Reload data (r)">
          <span aria-hidden="true">⟳</span><span class="btn__label">Refresh</span>
        </button>
        <button class="iconbtn" id="themeBtn" aria-label="Switch colour theme" title="Switch theme">
          <span id="themeIcon" aria-hidden="true">◐</span>
        </button>
        <div class="usermenu">
          <button class="usermenu__btn" id="userBtn" aria-haspopup="true" aria-expanded="false">
            <span class="avatar" id="userAvatar" aria-hidden="true"></span>
            <span class="usermenu__meta">
              <span class="usermenu__name" id="userName"></span>
              <span class="usermenu__role" id="userRole"></span>
            </span>
          </button>
          <div class="usermenu__panel" id="userPanel" hidden role="menu"></div>
        </div>
      </div>
    </header>

    <div class="body">
      <nav class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="sidebar__scroll" id="navList"></div>
        <div class="sidebar__foot">
          <div class="sidebar__version" id="appVersion"></div>
        </div>
      </nav>
      <div class="scrim" id="navScrim" hidden></div>

      <main class="main" id="main" tabindex="-1">
        <div id="view" class="view"></div>
      </main>
    </div>

    <div class="toaster" id="toaster" aria-live="polite" aria-atomic="false"></div>
  </div>

  <div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer__scrim" data-close-drawer></div>
    <div class="drawer__panel">
      <header class="drawer__head">
        <h2 class="drawer__title" id="drawerTitle"></h2>
        <button class="iconbtn" data-close-drawer aria-label="Close">✕</button>
      </header>
      <div class="drawer__body" id="drawerBody"></div>
      <footer class="drawer__foot" id="drawerFoot"></footer>
    </div>
  </div>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__scrim" data-close-modal></div>
    <div class="modal__panel" id="modalPanel">
      <header class="modal__head">
        <h2 class="modal__title" id="modalTitle"></h2>
        <button class="iconbtn" data-close-modal aria-label="Close">✕</button>
      </header>
      <div class="modal__body" id="modalBody"></div>
      <footer class="modal__foot" id="modalFoot"></footer>
    </div>
  </div>

  <?!= include('ViewReview'); ?>
  <?!= include('ViewAdmin'); ?>

</body>
</html>

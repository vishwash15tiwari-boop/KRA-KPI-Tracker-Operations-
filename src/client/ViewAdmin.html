<script>
/* ==========================================================================
   Administration — users and regions, data sync, settings, audit trail.
   ========================================================================== */

/* -------------------------------------------------------- users & regions --- */
Router.register('users', {
  permission: 'USER_MANAGE',
  skeleton: () => Components.tableSkeleton(8),
  async render(host) {
    const tab = State.params.tab || 'users';
    const [users, regions] = await Promise.all([
      Api.call('user.list', { includeInactive: true }),
      Api.call('region.list', {})
    ]);
    const provisional = users.filter(u => u.provisional && u.active);

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Users & Regions',
        subtitle: `${users.filter(u => u.active).length} active user(s) · ${regions.length} region(s)`,
        actions: `
          <button class="btn" id="newRegion">＋ Region</button>
          <button class="btn btn--primary" id="newUser">＋ User</button>`
      })}

      ${provisional.length ? Components.banner('warn',
        `${provisional.length} provisional user(s) created by the data sync`,
        'The sync met a name it did not recognise and created a placeholder so the transaction ' +
        'was not orphaned. Add an email and region, or merge each into an existing account.') : ''}

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="users" aria-selected="${tab === 'users'}">Users</button>
        <button class="tab" role="tab" data-tab="regions" aria-selected="${tab === 'regions'}">Regions</button>
      </div>

      ${tab === 'users' ? Components.card({
        flush: true,
        body: Components.table({
          columns: [
            {
              label: 'Name', format: u => `<span class="strong">${F.esc(u.fullName)}</span>
                <span class="cell-sub">${F.esc(u.email || 'no email — provisional')}</span>`
            },
            { label: 'Code', width: '110px', format: u => `<span class="mono">${F.esc(u.employeeCode || '—')}</span>` },
            { label: 'Role', width: '120px', format: u => Components.pill(F.titleCase(u.role), u.role === 'ADMIN' ? 'brand' : '') },
            { label: 'Category', width: '100px', format: u => F.esc(u.category) },
            { label: 'Region', width: '120px', format: u => F.esc(u.regionName || '—') },
            { label: 'Reports to', width: '150px', format: u => F.esc(u.reportsToName || '—') },
            {
              label: 'Status', width: '110px', format: u => u.active
                ? (u.provisional ? Components.pill('Provisional', 'warn') : Components.pill('Active', 'good'))
                : Components.pill('Disabled', '')
            },
            {
              label: '', width: '130px', format: u => `
                <button class="btn btn--sm" data-edit-user="${F.esc(u.userId)}">Edit</button>
                ${u.provisional ? `<button class="btn btn--sm" data-merge-user="${F.esc(u.userId)}">Merge</button>` : ''}`
            }
          ],
          rows: users,
          empty: 'No users yet.'
        })
      }) : Components.card({
        flush: true,
        body: Components.table({
          columns: [
            { label: 'Region', format: r => `<span class="strong">${F.esc(r.regionName)}</span>` },
            { label: 'Category', width: '110px', format: r => F.esc(r.category) },
            { label: 'Regional Head', width: '180px', format: r => F.esc(r.rhName || '—') },
            { label: 'States', format: r => F.esc(r.states || '—') },
            { label: 'Order', align: 'right', width: '70px', format: r => r.sequence },
            {
              label: '', width: '70px',
              format: r => `<button class="btn btn--sm" data-edit-region="${F.esc(r.regionId)}">Edit</button>`
            }
          ],
          rows: regions,
          empty: 'No regions defined.'
        })
      })}`;

    D.on(host, 'click', '[data-tab]', (e, el) => Router.go('users', { tab: el.dataset.tab }));
    D.q('#newUser', host).onclick = () => userModal(null);
    D.q('#newRegion', host).onclick = () => regionModal(null);
    D.on(host, 'click', '[data-edit-user]', (e, el) =>
      userModal(users.find(u => u.userId === el.dataset.editUser)));
    D.on(host, 'click', '[data-edit-region]', (e, el) =>
      regionModal(regions.find(r => r.regionId === el.dataset.editRegion)));
    D.on(host, 'click', '[data-merge-user]', (e, el) =>
      mergeUserModal(users.find(u => u.userId === el.dataset.mergeUser), users));
  }
});

function userModal(user) {
  Overlay.openModal({
    title: user ? 'Edit user' : 'New user',
    wide: true,
    body: `<form id="userForm">
      ${user ? `<input type="hidden" name="userId" value="${F.esc(user.userId)}">` : ''}
      <div class="formgrid">
        ${Components.field({
          name: 'fullName', label: 'Full name', required: true,
          value: (user && user.fullName) || '',
          hint: 'Must match the name used in the source spreadsheets so the sync links up.'
        })}
        ${Components.field({
          name: 'email', label: 'Work email', type: 'email',
          value: (user && user.email) || '',
          hint: 'Their Google account. Without it they cannot sign in.'
        })}
        ${Components.field({
          name: 'employeeCode', label: 'Employee code', value: (user && user.employeeCode) || '',
          placeholder: 'FFIRT00328'
        })}
        ${Components.field({
          name: 'role', label: 'Role', type: 'select', required: true,
          value: (user && user.role) || 'POC',
          options: [
            { value: 'POC', label: 'POC — records their own work' },
            { value: 'RH', label: 'Regional Head — plans and reviews a region' },
            { value: 'TEAM_LEAD', label: 'Team Lead — owns planning for a category' },
            { value: 'LEADERSHIP', label: 'Leadership — read all, review' },
            { value: 'VIEWER', label: 'Viewer — read only' },
            { value: 'ADMIN', label: 'Administrator — full control' }
          ]
        })}
        ${Components.field({
          name: 'category', label: 'Category', type: 'select',
          value: (user && user.category) || 'ALL',
          options: [{ value: 'ALL', label: 'All categories' }]
            .concat(State.ref('categories').map(c => ({ value: c, label: c })))
        })}
        ${Components.field({
          name: 'regionId', label: 'Region', type: 'select',
          value: (user && user.regionId) || '',
          options: Components.regionOptions(true)
        })}
        ${Components.field({
          name: 'stream', label: 'Stream', type: 'select',
          value: (user && user.stream) || 'BOTH',
          options: [
            { value: 'BOTH', label: 'Both' },
            { value: 'SUPPLY', label: 'Supply — sellers' },
            { value: 'DEMAND', label: 'Demand — buyers' }
          ]
        })}
        ${Components.field({
          name: 'reportsTo', label: 'Reports to', type: 'select',
          value: (user && user.reportsTo) || '', options: Components.userOptions(true)
        })}
        ${Components.field({ name: 'phone', label: 'Phone', value: (user && user.phone) || '' })}
        ${Components.field({
          name: 'aliases', label: 'Name aliases', wide: true, value: (user && user.aliases) || '',
          hint: 'Pipe-separated alternative spellings used in the source sheets, e.g. Joy Deep|Joydeep D.'
        })}
        ${Components.field({
          name: 'active', label: 'Active', type: 'checkbox',
          value: user ? user.active : true
        })}
      </div>
    </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="saveUser">Save user</button>`
  });

  D.q('#saveUser').onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      await Api.call('user.save', D.formData(D.q('#userForm')));
      Toast.success('User saved');
      Overlay.closeModal();
      await Boot.reload();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      D.markInvalid(D.q('#userForm'), err.message);
    }
  };
}

function mergeUserModal(source, users) {
  Overlay.openModal({
    title: 'Merge provisional user',
    body: `<form id="mergeForm">
      <p class="muted">Everything owned by <b>${F.esc(source.fullName)}</b> — accounts, activities,
      shipments, onboarding, visits and assignments — moves to the target user. The source name is
      kept as an alias so future syncs resolve correctly.</p>
      <input type="hidden" name="sourceUserId" value="${F.esc(source.userId)}">
      ${Components.field({
        name: 'targetUserId', label: 'Merge into', type: 'select', required: true, wide: true,
        options: [{ value: '', label: '— Select the real user —' }].concat(
          users.filter(u => u.active && u.email && u.userId !== source.userId)
            .map(u => ({ value: u.userId, label: `${u.fullName} · ${u.email}` })))
      })}
    </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="doMerge">Merge</button>`
  });

  D.q('#doMerge').onclick = async (e) => {
    const data = D.formData(D.q('#mergeForm'));
    if (!data.targetUserId) { Toast.warn('Select a target', 'Choose which user to merge into.'); return; }
    e.currentTarget.disabled = true;
    try {
      const res = await Api.call('user.merge', data);
      Toast.success('Merged', Object.entries(res.moved)
        .filter(([, v]) => v).map(([k, v]) => `${v} ${k}`).join(', ') || 'nothing to move');
      Overlay.closeModal();
      await Boot.reload();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      Toast.fromError(err);
    }
  };
}

function regionModal(region) {
  Overlay.openModal({
    title: region ? 'Edit region' : 'New region',
    body: `<form id="regionForm">
      ${region ? `<input type="hidden" name="regionId" value="${F.esc(region.regionId)}">` : ''}
      <div class="formgrid">
        ${Components.field({
          name: 'regionName', label: 'Region name', required: true,
          value: (region && region.regionName) || ''
        })}
        ${Components.field({
          name: 'category', label: 'Category', type: 'select',
          value: (region && region.category) || State.category, options: State.ref('categories')
        })}
        ${Components.field({
          name: 'rhUserId', label: 'Regional Head', type: 'select',
          value: (region && region.rhUserId) || '',
          options: Components.userOptions(true, u => ['RH', 'TEAM_LEAD'].includes(u.role))
        })}
        ${Components.field({
          name: 'states', label: 'States covered', wide: true,
          value: (region && region.states) || '',
          placeholder: 'Uttar Pradesh, Bihar, Jharkhand'
        })}
        ${Components.field({
          name: 'sequence', label: 'Display order', type: 'number',
          value: (region && region.sequence) || 50
        })}
      </div>
    </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="saveRegion">Save region</button>`
  });

  D.q('#saveRegion').onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      await Api.call('region.save', D.formData(D.q('#regionForm')));
      Toast.success('Region saved');
      Overlay.closeModal();
      await Boot.reload();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      D.markInvalid(D.q('#regionForm'), err.message);
    }
  };
}

/* ------------------------------------------------------------------- sync --- */
Router.register('sync', {
  permission: 'SYNC_RUN',
  skeleton: () => Components.tableSkeleton(6),
  async render(host) {
    const history = await Api.call('sync.history', { limit: 25 });
    let sourceId = '';
    try { sourceId = localStorage.getItem('omp.sourceId') || ''; } catch (e) { /* ignore */ }

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Data Sync',
        subtitle: 'Pulls shipments, onboarding and field visits from the operational workbook. ' +
          'Re-running corrects rather than duplicates.'
      })}

      ${Components.banner('info', 'How the sync behaves',
        'Rows are matched on their natural key — Shipment ID, Seller ID, employee and date — so ' +
        'the job is safe to re-run. Unknown sellers, buyers, regions and POCs are created ' +
        'automatically and flagged for you to complete.')}

      ${Components.card({
        title: 'Run a sync',
        body: `
          <form id="syncForm">
            <div class="formgrid">
              ${Components.field({
                name: 'spreadsheetId', label: 'Source spreadsheet ID', wide: true, value: sourceId,
                hint: 'Leave blank to use the configured default (Settings → Data source), or the ' +
                  'source tabs in this same spreadsheet if none is set.'
              })}
              ${Components.field({
                name: 'category', label: 'Category', type: 'select',
                value: State.category, options: State.ref('categories')
              })}
            </div>
            <div class="btnrow" style="margin-top:6px">
              <button type="button" class="btn btn--primary" data-sync="all">Sync everything</button>
              <button type="button" class="btn" data-sync="onboarding">Onboarding only</button>
              <button type="button" class="btn" data-sync="shipments">Shipments only</button>
              <button type="button" class="btn" data-sync="pulse">Field visits only</button>
              <button type="button" class="btn btn--ghost" id="inspectBtn">Check access</button>
            </div>
            <div id="syncOut" style="margin-top:14px"></div>
          </form>`
      })}

      <div style="height:16px"></div>

      ${Components.card({
        title: 'Sync history',
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            { label: 'Started', width: '150px', format: r => F.dateTime(r.startedAt) },
            { label: 'Source', width: '120px', format: r => F.titleCase(r.source) },
            {
              label: 'Status', width: '100px',
              format: r => Components.pill(r.status, r.status === 'SUCCESS' ? 'good' : 'bad')
            },
            { label: 'Read', align: 'right', width: '70px', format: r => F.int(r.rowsRead) },
            { label: 'Added', align: 'right', width: '70px', format: r => F.int(r.rowsInserted) },
            { label: 'Updated', align: 'right', width: '80px', format: r => F.int(r.rowsUpdated) },
            { label: 'Skipped', align: 'right', width: '80px', format: r => F.int(r.rowsSkipped) },
            {
              label: 'Notes', format: r => r.errorMessage
                ? `<span style="color:var(--bad)">${F.esc(r.errorMessage)}</span>`
                : (r.warnings ? `<span class="faint">${F.esc(String(r.warnings).slice(0, 180))}</span>` : '')
            },
            { label: 'By', width: '150px', format: r => `<span class="faint">${F.esc(r.triggeredBy)}</span>` }
          ],
          rows: history,
          empty: 'No sync has run yet.'
        })
      })}`;

    const out = D.q('#syncOut', host);

    D.on(host, 'click', '[data-sync]', async (e, el) => {
      const kind = el.dataset.sync;
      const data = D.formData(D.q('#syncForm'));
      try { localStorage.setItem('omp.sourceId', data.spreadsheetId || ''); } catch (x) { /* ignore */ }

      D.qa('[data-sync]', host).forEach(b => { b.disabled = true; });
      out.innerHTML = '<div class="skeleton skeleton--row"></div>';
      try {
        const res = await Api.call('sync.' + kind, data);
        const results = kind === 'all'
          ? ['onboarding', 'shipments', 'pulse'].map(k => res[k])
          : [res];
        out.innerHTML = results.map(r => Components.banner(
          r.status === 'SUCCESS' ? 'good' : 'bad',
          `${F.titleCase(r.source)} — ${r.status}`,
          `Read ${F.int(r.rowsRead)}, added ${F.int(r.rowsInserted)}, ` +
          `updated ${F.int(r.rowsUpdated)}, skipped ${F.int(r.rowsSkipped)}.` +
          (r.errorMessage ? `<br><b>${F.esc(r.errorMessage)}</b>` : '') +
          (r.warnings && r.warnings.length
            ? `<details style="margin-top:6px"><summary style="cursor:pointer">
                ${r.warnings.length} warning(s)</summary>
                <ul style="margin:6px 0 0 16px">${r.warnings.map(w =>
                  `<li>${F.esc(w)}</li>`).join('')}</ul></details>` : '')
        )).join('');
        Toast.success('Sync finished', 'Dashboards already reflect the new data.');
      } catch (err) {
        out.innerHTML = Components.errorState(err);
        Toast.fromError(err, 'Sync failed');
      } finally {
        D.qa('[data-sync]', host).forEach(b => { b.disabled = false; });
      }
    });

    D.q('#inspectBtn', host).onclick = async () => {
      const id = D.q('#f_spreadsheetId', host).value.trim();
      if (!id) { Toast.warn('Enter an ID', 'Paste the source spreadsheet ID first.'); return; }
      out.innerHTML = '<div class="skeleton skeleton--row"></div>';
      try {
        const info = await Api.call('sync.inspect', { spreadsheetId: id });
        out.innerHTML = Components.banner('good', F.esc(info.name), `${info.sheets.length} tab(s).`) +
          Components.table({
            compact: true,
            columns: [
              { label: 'Tab', format: r => `<span class="mono">${F.esc(r.name)}</span>` },
              { label: 'Rows', align: 'right', format: r => F.int(r.rows) },
              { label: 'Cols', align: 'right', format: r => F.int(r.cols) }
            ],
            rows: info.sheets
          });
      } catch (err) { out.innerHTML = Components.errorState(err); }
    };
  }
});

/* --------------------------------------------------------------- settings --- */
Router.register('settings', {
  permission: 'CONFIG_MANAGE',
  skeleton: () => Components.tableSkeleton(10),
  async render(host) {
    const [config, health] = await Promise.all([
      Api.call('config.list', {}),
      Api.call('session.health', {})
    ]);

    const GROUPS = {
      'Fiscal calendar & reporting': ['FY_START_MONTH', 'REPORTING_LAG_DAYS'],
      'Value basis': ['GMV_BASIS', 'GMV_CR_DIVISOR', 'RATE_GST_DIVISOR', 'GST_RATE'],
      'Scoring': ['ACHIEVEMENT_CAP', 'REQUIRE_WEIGHTAGE_100', 'WEIGHTAGE_TOTAL'],
      'Derived KPI targets': ['EXISTING_TXN_TARGET_PCT', 'NEW_TXN_TARGET_PCT',
        'RETENTION_TARGET_PCT', 'DN_TARGET_PCT_OF_GMV'],
      'Field visits': ['PULSE_VISITS_PER_DAY', 'PULSE_DEFAULT_WORKING_DAYS', 'PULSE_DEDUCT_LEAVE'],
      'SLAs & alerts': ['SLA_ONBOARDING_DAYS', 'SLA_REVIEW_SUBMISSION_DAYS', 'SLA_DISPATCH_DAYS',
        'SLA_DELIVERY_DAYS', 'DORMANCY_DAYS', 'PACE_WARN_RATIO', 'PACE_CRITICAL_RATIO'],
      'Operational limits': ['MAX_ROWS_PER_READ', 'CACHE_TTL_SECONDS', 'ACTIVITY_BACKDATE_DAYS',
        'EVIDENCE_URL_PATTERN'],
      'Data source': ['SOURCE_SPREADSHEET_ID'],
      'Presentation': ['DEFAULT_CATEGORY', 'CURRENCY_SYMBOL']
    };
    const byKey = {};
    config.forEach(c => { byKey[c.key] = c; });

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Settings',
        subtitle: `Schema version ${health.schemaVersion} · ` +
          `${Object.values(health.rowCounts || {}).reduce((a, b) => a + Math.max(0, b), 0)} rows stored`,
        actions: `<a class="btn" href="${F.esc(health.spreadsheetUrl)}" target="_blank" rel="noopener">
          Open backend sheet ↗</a>`
      })}

      ${Components.banner('warn', 'These values change reported numbers',
        'GMV basis and the realised-rate divisor exist because the source workbook was internally ' +
        'inconsistent. The defaults are the corrected behaviour; the alternates reproduce the ' +
        'legacy spreadsheet figures exactly.')}

      ${Object.entries(GROUPS).map(([group, keys]) => Components.card({
        title: group,
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            {
              label: 'Setting', format: c => `<span class="strong mono">${F.esc(c.key)}</span>
                <span class="cell-sub">${F.esc(c.description || '')}</span>`
            },
            {
              label: 'Value', width: '220px', format: c => c.type === 'boolean'
                ? `<label class="check"><input type="checkbox" data-config="${F.esc(c.key)}"
                     ${String(c.value) === 'true' ? 'checked' : ''}><span>${
                     String(c.value) === 'true' ? 'Enabled' : 'Disabled'}</span></label>`
                : `<input class="input${c.type === 'number' ? ' input--num' : ''}"
                     type="${c.type === 'number' ? 'number' : 'text'}" step="any"
                     data-config="${F.esc(c.key)}" value="${F.esc(c.value)}">`
            },
            {
              label: 'Default', width: '120px',
              format: c => `<span class="faint mono">${F.esc(c.defaultValue)}</span>`
            },
            {
              label: '', width: '100px',
              format: c => c.modified ? Components.pill('Modified', 'warn') : ''
            }
          ],
          rows: keys.map(k => byKey[k]).filter(Boolean)
        })
      })).join('<div style="height:14px"></div>')}

      <div style="height:16px"></div>

      ${Components.card({
        title: 'Backend tables',
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            { label: 'Table', format: r => `<span class="mono">${F.esc(r.name)}</span>` },
            { label: 'Rows', align: 'right', format: r => r.count < 0 ? '—' : F.int(r.count) }
          ],
          rows: Object.entries(health.rowCounts || {}).map(([name, count]) => ({ name, count }))
        })
      })}`;

    D.on(host, 'change', '[data-config]', async (e, el) => {
      const key = el.dataset.config;
      const value = el.type === 'checkbox' ? el.checked : el.value;
      el.disabled = true;
      try {
        const res = await Api.call('config.set', { key, value });
        Toast.success('Setting updated', `${key}: ${res.previous} → ${res.value}`);
        Api.invalidate();
        await Boot.reload();
      } catch (err) {
        Toast.fromError(err, 'Could not save the setting');
      } finally {
        el.disabled = false;
      }
    });
  }
});

/* ------------------------------------------------------- business functions --- */
/**
 * The config-driven platform layer. OMP-Metal/Plastic are built in (LEGACY);
 * every other business function (Onboarding, Collections, or a new one
 * created here) is entirely configuration — its activity types and metrics
 * are rows an admin defines below, then a Team Lead builds its KRAs/KPIs
 * from the Monthly Plan screen exactly as they would for OMP. No code.
 */
Router.register('functions', {
  permission: 'CONFIG_MANAGE',
  skeleton: () => Components.tableSkeleton(6),
  async render(host) {
    const tab = State.params.tab || 'types';
    const [functions, activityTypes, metricDefs] = await Promise.all([
      Api.call('businessFunction.list', { includeInactive: true }),
      Api.call('activityTypeDef.list', {}),
      Api.call('metricDef.list', {})
    ]);
    const genericFns = functions.filter(f => f.calculatorMode === 'GENERIC');
    const scopeFn = genericFns.find(f => f.businessFunctionId === State.params.fn) || genericFns[0] || null;
    const ownTypes = scopeFn ? activityTypes.filter(a => a.businessFunctionId === scopeFn.businessFunctionId) : [];
    const ownMetrics = scopeFn ? metricDefs.filter(m => m.businessFunctionId === scopeFn.businessFunctionId) : [];

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Business Functions',
        subtitle: `${functions.length} business function(s) configured on this platform`,
        actions: `<button class="btn btn--primary" id="newFunction">＋ Business Function</button>`
      })}

      ${Components.banner('info', 'Onboarding a new business function is configuration, not code',
        'OMP-Metal and OMP-Plastic compute their metrics from built-in engine code. Every other ' +
        'function — Onboarding, Collections, or one you add here — computes its metrics purely from ' +
        'the activity types and metric definitions below. Build its KRAs and KPIs from the Monthly ' +
        'Plan screen once its taxonomy is defined.')}

      ${Components.card({
        title: 'All business functions', flush: true,
        body: Components.table({
          columns: [
            {
              label: 'Name', format: f => `<span class="strong">${F.esc(f.name)}</span>
                <span class="cell-sub mono">${F.esc(f.businessFunctionId)}</span>`
            },
            {
              label: 'Calculator', width: '110px', format: f =>
                Components.pill(F.titleCase(f.calculatorMode), f.calculatorMode === 'LEGACY' ? 'brand' : 'good')
            },
            {
              label: 'Streams', width: '170px', format: f => F.esc(
                f.streamMode === 'SINGLE' ? ((f.streamLabels && f.streamLabels.GENERAL) || 'General')
                  : Object.values(f.streamLabels || {}).join(' / '))
            },
            { label: 'Status', width: '90px', format: f => f.active ? Components.pill('Active', 'good') : Components.pill('Inactive', '') },
            {
              label: '', width: '220px', format: f => `
                <button class="btn btn--sm" data-edit-fn="${F.esc(f.businessFunctionId)}">Edit</button>
                ${f.calculatorMode === 'GENERIC' ? `<button class="btn btn--sm" data-scope-fn="${F.esc(f.businessFunctionId)}">
                  Activity types & metrics</button>` : ''}`
            }
          ],
          rows: functions,
          empty: 'No business functions yet.'
        })
      })}

      <div style="height:16px"></div>

      ${scopeFn ? `
        ${Components.pageHead({
          title: `${F.esc(scopeFn.name)} — taxonomy`,
          subtitle: 'The activity types a POC can log, and the metrics the engine computes from them.'
        })}
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="types" aria-selected="${tab !== 'metrics'}">Activity Types</button>
          <button class="tab" role="tab" data-tab="metrics" aria-selected="${tab === 'metrics'}">Metrics</button>
        </div>
        ${tab === 'metrics' ? `
          ${Components.card({
            flush: true,
            actions: `<button class="btn btn--sm" data-new-metric>＋ Metric</button>`,
            body: Components.table({
              compact: true,
              columns: [
                {
                  label: 'Metric', format: m => `<span class="strong">${F.esc(m.label)}</span>
                    <span class="cell-sub mono">${F.esc(m.metricKey)}</span>`
                },
                { label: 'Aggregation', width: '120px', format: m => F.titleCase(m.aggregation) },
                {
                  label: 'Computed from', format: m => {
                    if (m.aggregation === 'RATIO') return `${F.esc(m.numeratorMetric)} ÷ ${F.esc(m.denominatorMetric)}`
                      + (m.multiplier && m.multiplier !== 1 ? ` × ${F.esc(m.multiplier)}` : '');
                    if (m.aggregation === 'DERIVED') return `<span class="mono">${F.esc(m.expression)}</span>`;
                    return `${F.esc(m.sourceActivityType)}${m.measureField ? ' · ' + F.esc(m.measureField) : ''}`;
                  }
                },
                { label: 'Unit', width: '80px', format: m => F.esc(m.unit) },
                { label: '', width: '70px', format: m => `<button class="btn btn--sm" data-edit-metric="${F.esc(m.metricKey)}">Edit</button>` }
              ],
              rows: ownMetrics,
              empty: 'No metrics defined yet.'
            })
          })}
        ` : `
          ${Components.card({
            flush: true,
            actions: `<button class="btn btn--sm" data-new-type>＋ Activity Type</button>`,
            body: Components.table({
              compact: true,
              columns: [
                {
                  label: 'Activity type', format: t => `<span class="strong">${F.esc(t.label)}</span>
                    <span class="cell-sub mono">${F.esc(t.activityTypeId)}</span>`
                },
                { label: 'Evidence', width: '100px', format: t => F.titleCase(t.evidence) },
                { label: 'Account required', width: '130px', format: t => t.requiresAccount ? 'Yes' : 'No' },
                {
                  label: 'Measures', format: t => (t.measures || []).length
                    ? t.measures.map(m => `<span class="mono">${F.esc(m.key)}</span>`).join(', ')
                    : '<span class="faint">count only</span>'
                },
                { label: '', width: '70px', format: t => `<button class="btn btn--sm" data-edit-type="${F.esc(t.activityTypeId)}">Edit</button>` }
              ],
              rows: ownTypes,
              empty: 'No activity types defined yet.'
            })
          })}
        `}
      ` : Components.emptyState({
        title: 'No configurable business function selected',
        message: 'Create one above, or select an existing GENERIC business function to manage its taxonomy.'
      })}`;

    D.q('#newFunction', host).onclick = () => businessFunctionModal(null);
    D.on(host, 'click', '[data-edit-fn]', (e, el) =>
      businessFunctionModal(functions.find(f => f.businessFunctionId === el.dataset.editFn)));
    D.on(host, 'click', '[data-scope-fn]', (e, el) => Router.go('functions', { fn: el.dataset.scopeFn, tab: 'types' }));
    D.on(host, 'click', '[data-tab]', (e, el) =>
      Router.go('functions', { fn: scopeFn && scopeFn.businessFunctionId, tab: el.dataset.tab }));

    const newType = D.q('[data-new-type]', host);
    if (newType) newType.onclick = () => activityTypeDefModal(scopeFn, null);
    D.on(host, 'click', '[data-edit-type]', (e, el) =>
      activityTypeDefModal(scopeFn, ownTypes.find(t => t.activityTypeId === el.dataset.editType)));

    const newMetric = D.q('[data-new-metric]', host);
    if (newMetric) newMetric.onclick = () => metricDefModal(scopeFn, null, ownTypes, metricDefs);
    D.on(host, 'click', '[data-edit-metric]', (e, el) =>
      metricDefModal(scopeFn, ownMetrics.find(m => m.metricKey === el.dataset.editMetric), ownTypes, metricDefs));
  }
});

function businessFunctionModal(fn) {
  const streamMode = (fn && fn.streamMode) || 'SINGLE';
  Overlay.openModal({
    title: fn ? 'Edit business function' : 'New business function',
    body: `<form id="fnForm">
      ${fn ? `<input type="hidden" name="businessFunctionId" value="${F.esc(fn.businessFunctionId)}">` : ''}
      <div class="formgrid">
        ${!fn ? Components.field({
          name: 'businessFunctionId', label: 'Code', required: true,
          placeholder: 'e.g. RETURNS', hint: 'Letters, numbers, underscores. Cannot be changed later.'
        }) : ''}
        ${Components.field({ name: 'name', label: 'Name', required: true, value: (fn && fn.name) || '' })}
        ${Components.field({
          name: 'description', label: 'Description', wide: true, value: (fn && fn.description) || ''
        })}
        ${Components.field({
          name: 'streamMode', label: 'Stream shape', type: 'select', value: streamMode,
          options: [
            { value: 'SINGLE', label: 'Single stream — most operations teams' },
            { value: 'SUPPLY_DEMAND', label: 'Two-sided (Supply / Demand) — marketplace-style' }
          ]
        })}
        ${Components.field({
          name: 'generalLabel', label: 'Stream label (single)', value: (fn && fn.streamLabels && fn.streamLabels.GENERAL) || (fn && fn.name) || ''
        })}
        ${Components.field({
          name: 'supplyLabel', label: 'Supply-side label', value: (fn && fn.streamLabels && fn.streamLabels.SUPPLY) || 'Supply'
        })}
        ${Components.field({
          name: 'demandLabel', label: 'Demand-side label', value: (fn && fn.streamLabels && fn.streamLabels.DEMAND) || 'Demand'
        })}
        ${Components.field({
          name: 'sequence', label: 'Display order', type: 'number', value: (fn && fn.sequence) || 50
        })}
        ${Components.field({ name: 'active', label: 'Active', type: 'checkbox', value: fn ? fn.active : true })}
      </div>
      ${!fn ? Components.banner('info', 'What happens next',
        'This creates the business function only. Add its activity types and metrics from the ' +
        '"Activity types & metrics" screen, then build its first month\'s KRAs and KPIs from Monthly Plan.') : ''}
    </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="saveFn">Save</button>`
  });

  D.q('#saveFn').onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      await Api.call('businessFunction.save', D.formData(D.q('#fnForm')));
      Toast.success('Business function saved');
      Overlay.closeModal();
      await Boot.reload();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      D.markInvalid(D.q('#fnForm'), err.message);
    }
  };
}

function activityTypeDefModal(fn, def) {
  const measuresJson = JSON.stringify((def && def.measures) || [], null, 0);
  Overlay.openModal({
    title: def ? 'Edit activity type' : 'New activity type',
    wide: true,
    body: `<form id="typeForm">
      <input type="hidden" name="businessFunctionId" value="${F.esc(fn.businessFunctionId)}">
      <div class="formgrid">
        ${!def ? Components.field({
          name: 'activityTypeId', label: 'Key', required: true,
          placeholder: 'e.g. APPLICATION_RECEIVED', hint: 'Must be globally unique across every business function.'
        }) : `<input type="hidden" name="activityTypeId" value="${F.esc(def.activityTypeId)}">`}
        ${Components.field({ name: 'label', label: 'Label', required: true, value: (def && def.label) || '' })}
        ${Components.field({
          name: 'evidence', label: 'Evidence', type: 'select', value: (def && def.evidence) || 'NONE',
          options: [
            { value: 'NONE', label: 'Not needed' },
            { value: 'OPTIONAL', label: 'Optional' },
            { value: 'REQUIRED', label: 'Required' }
          ]
        })}
        ${Components.field({
          name: 'requiresAccount', label: 'Requires a linked account', type: 'checkbox',
          value: def ? def.requiresAccount : false
        })}
        ${Components.field({
          name: 'sequence', label: 'Display order', type: 'number', value: (def && def.sequence) || 50
        })}
        ${Components.field({ name: 'active', label: 'Active', type: 'checkbox', value: def ? def.active : true })}
        ${Components.field({
          name: 'help', label: 'Help text', wide: true, value: (def && def.help) || ''
        })}
      </div>
      <div class="field formgrid--wide">
        <label class="field__label" for="f_measures">Measures (JSON)</label>
        <textarea class="textarea mono" id="f_measures" name="measuresRaw" rows="3">${F.esc(measuresJson)}</textarea>
        <div class="field__hint">
          An array of fields captured when this activity is logged, e.g.
          <span class="mono">[{"key":"amount","label":"Amount","unit":"₹","column":"measureA"}]</span>.
          <b>column</b> must be one of count, measureA, measureB, measureC. Leave as
          <span class="mono">[]</span> for a simple occurrence with no numeric field.
        </div>
      </div>
    </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="saveType">Save</button>`
  });

  D.q('#saveType').onclick = async (e) => {
    e.currentTarget.disabled = true;
    const data = D.formData(D.q('#typeForm'));
    try {
      data.measures = JSON.parse(data.measuresRaw || '[]');
      if (!Array.isArray(data.measures)) throw new Error('not an array');
    } catch (err) {
      e.currentTarget.disabled = false;
      D.markInvalid(D.q('#typeForm'), 'Measures must be valid JSON — an array of {key,label,unit,column}.');
      return;
    }
    delete data.measuresRaw;
    try {
      await Api.call('activityTypeDef.save', data);
      Toast.success('Activity type saved');
      Overlay.closeModal();
      Api.invalidate();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      D.markInvalid(D.q('#typeForm'), err.message);
    }
  };
}

function metricDefModal(fn, def, ownTypes, allMetricDefs) {
  const aggregation = (def && def.aggregation) || 'COUNT';
  const metricOptions = () => [{ value: '', label: '— Select —' }].concat(
    allMetricDefs.map(m => ({ value: m.metricKey, label: `${m.label} (${m.businessFunctionId})` })));

  Overlay.openModal({
    title: def ? 'Edit metric' : 'New metric',
    wide: true,
    body: `<form id="metricForm">
      <input type="hidden" name="businessFunctionId" value="${F.esc(fn.businessFunctionId)}">
      <div class="formgrid">
        ${!def ? Components.field({
          name: 'metricKey', label: 'Key', required: true,
          placeholder: 'e.g. APPLICATIONS_RECEIVED', hint: 'Must be globally unique — this is what a KPI links to.'
        }) : `<input type="hidden" name="metricKey" value="${F.esc(def.metricKey)}">`}
        ${Components.field({ name: 'label', label: 'Label', required: true, value: (def && def.label) || '' })}
        ${Components.field({
          name: 'unit', label: 'Unit', type: 'select', value: (def && def.unit) || 'COUNT',
          options: ['COUNT', 'SUM', 'PCT', 'INR', 'DAYS', 'RATE']
        })}
        ${Components.field({
          name: 'direction', label: 'Direction', type: 'select', value: (def && def.direction) || 'HIGHER_BETTER',
          options: [
            { value: 'HIGHER_BETTER', label: 'Higher is better' },
            { value: 'LOWER_BETTER', label: 'Lower is better' }
          ]
        })}
        ${Components.field({
          name: 'aggregation', label: 'Computed as', type: 'select', value: aggregation,
          options: [
            { value: 'COUNT', label: 'Count of activities' },
            { value: 'SUM', label: 'Sum of a measure' },
            { value: 'DISTINCT_COUNT', label: 'Distinct count' },
            { value: 'RATIO', label: 'Ratio of two metrics' },
            { value: 'DERIVED', label: 'Formula over other metrics' }
          ]
        })}
      </div>
      <div class="formgrid" id="aggFields"></div>
    </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="saveMetric">Save</button>`
  });

  function renderAggFields(agg) {
    const box = D.q('#aggFields');
    if (agg === 'RATIO') {
      box.innerHTML = `
        ${Components.field({
          name: 'numeratorMetric', label: 'Numerator metric', type: 'select', required: true,
          value: (def && def.numeratorMetric) || '', options: metricOptions()
        })}
        ${Components.field({
          name: 'denominatorMetric', label: 'Denominator metric', type: 'select', required: true,
          value: (def && def.denominatorMetric) || '', options: metricOptions()
        })}
        ${Components.field({
          name: 'multiplier', label: 'Multiplier', type: 'number', step: 'any',
          value: (def && def.multiplier) || 100,
          hint: '100 for a percentage, 1 for a plain ratio.'
        })}`;
    } else if (agg === 'DERIVED') {
      box.innerHTML = Components.field({
        name: 'expression', label: 'Expression', wide: true, required: true,
        value: (def && def.expression) || '',
        placeholder: 'e.g. (RECEIVED - REJECTED) / RECEIVED * 100',
        hint: 'Arithmetic (+ - * / and parentheses) over other metric keys.'
      });
    } else {
      box.innerHTML = `
        ${Components.field({
          name: 'sourceActivityType', label: 'Activity type', type: 'select', required: true,
          value: (def && def.sourceActivityType) || '',
          options: [{ value: '', label: '— Select —' }].concat(
            ownTypes.map(t => ({ value: t.activityTypeId, label: t.label })))
        })}
        ${agg !== 'COUNT' ? Components.field({
          name: 'measureField', label: agg === 'SUM' ? 'Measure field' : 'Distinct-on field',
          type: 'select', required: agg === 'SUM',
          value: (def && def.measureField) || (agg === 'SUM' ? 'measureA' : 'pocUserId'),
          options: agg === 'SUM'
            ? ['count', 'measureA', 'measureB', 'measureC']
            : ['pocUserId', 'accountId', 'subjectName', 'regionId']
        }) : ''}`;
    }
  }

  renderAggFields(aggregation);
  D.q('[name=aggregation]', document.getElementById('metricForm')).onchange = (e) => renderAggFields(e.target.value);

  D.q('#saveMetric').onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      await Api.call('metricDef.save', D.formData(D.q('#metricForm')));
      Toast.success('Metric saved');
      Overlay.closeModal();
      Api.invalidate();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      D.markInvalid(D.q('#metricForm'), err.message);
    }
  };
}

/* ------------------------------------------------------------------ audit --- */
Router.register('audit', {
  permission: 'AUDIT_VIEW',
  skeleton: () => Components.tableSkeleton(12),
  async render(host) {
    const entries = await Api.call('audit.recent', { limit: 300 });

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Audit Trail',
        subtitle: 'Every change: who, when, what, and the before/after state',
        actions: State.can('REPORT_EXPORT')
          ? `<button class="btn" id="exportAudit">Export</button>` : ''
      })}

      <div class="filters">
        <div class="field" style="flex:1;min-width:200px">
          <label class="field__label" for="auSearch">Filter</label>
          <input class="input" id="auSearch" type="search" placeholder="Action, user or entity">
        </div>
      </div>

      ${Components.card({
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            { label: 'When', width: '150px', format: r => F.dateTime(r.timestamp) },
            {
              label: 'Who', width: '190px', format: r => `${F.esc(r.userEmail || '—')}
                <span class="cell-sub">${F.esc(r.role || '')}</span>`
            },
            { label: 'Action', width: '180px', format: r => `<span class="mono">${F.esc(r.action)}</span>` },
            {
              label: 'Entity', width: '160px', format: r => `${F.esc(r.entity || '—')}
                <span class="cell-sub mono">${F.esc(String(r.entityId || '').slice(0, 24))}</span>`
            },
            { label: 'Summary', format: r => F.esc(r.summary) },
            {
              label: '', width: '80px', format: r => r.success
                ? Components.pill('OK', 'good')
                : `${Components.pill('Failed', 'bad')}<span class="cell-sub">${F.esc(r.errorMessage || '')}</span>`
            }
          ],
          rows: entries,
          empty: 'No audit entries yet.'
        })
      })}`;

    D.q('#auSearch', host).oninput = (e) => {
      const q = e.target.value.toLowerCase();
      D.qa('.table tbody tr', host).forEach(tr => {
        tr.hidden = q && !tr.textContent.toLowerCase().includes(q);
      });
    };

    const exp = D.q('#exportAudit', host);
    if (exp) exp.onclick = () => runExport('AUDIT', { limit: 2000 }, exp);
  }
});
</script>

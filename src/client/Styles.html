<style>
/* ==========================================================================
   OMP Operations Tracker — design system
   Light-first tokens, redefined for dark under both prefers-color-scheme and
   an explicit [data-theme] so the manual toggle always wins.
   ========================================================================== */

:root {
  --bg:            #f4f6f9;
  --surface:       #ffffff;
  --surface-2:     #f8fafc;
  --surface-3:     #eef2f7;
  --border:        #dde3ec;
  --border-strong: #c3ccda;
  --text:          #131b26;
  --text-muted:    #5b6878;
  --text-faint:    #8a97a8;

  --brand:         #0f4c81;
  --brand-strong:  #0a3a63;
  --brand-soft:    #e6eef6;
  --brand-fg:      #ffffff;

  --excellent:     #0f7b52;
  --excellent-bg:  #e3f5ec;
  --good:          #2c8a5b;
  --good-bg:       #e8f6ee;
  --ok:            #9a6b09;
  --ok-bg:         #fdf3dc;
  --warn:          #b4560f;
  --warn-bg:       #fdeee2;
  --bad:           #b3261e;
  --bad-bg:        #fdeceb;
  --critical:      #8c1d18;
  --critical-bg:   #fbe3e1;
  --info:          #1b5faa;
  --info-bg:       #e7f0fb;

  --plan:          #7b61b6;
  --actual:        #0f4c81;
  --lastmonth:     #8a97a8;

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15,27,40,.06), 0 1px 3px rgba(15,27,40,.05);
  --shadow:    0 4px 12px rgba(15,27,40,.08), 0 1px 3px rgba(15,27,40,.05);
  --shadow-lg: 0 18px 44px rgba(15,27,40,.18);

  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;

  --topbar-h: 58px;
  --sidebar-w: 244px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:            #0c1219;
    --surface:       #131c26;
    --surface-2:     #18232f;
    --surface-3:     #1f2c3a;
    --border:        #24313f;
    --border-strong: #34455a;
    --text:          #e6edf5;
    --text-muted:    #9fb0c3;
    --text-faint:    #6d7f93;

    --brand:         #4b9fe1;
    --brand-strong:  #7bbcf0;
    --brand-soft:    #16293c;
    --brand-fg:      #06121d;

    --excellent:     #4ecf9a;
    --excellent-bg:  #102b21;
    --good:          #62c68f;
    --good-bg:       #12291d;
    --ok:            #e2b23c;
    --ok-bg:         #2c2410;
    --warn:          #f0904a;
    --warn-bg:       #331f11;
    --bad:           #f2776d;
    --bad-bg:        #331616;
    --critical:      #ff8a80;
    --critical-bg:   #3a1512;
    --info:          #6fb0f2;
    --info-bg:       #14263a;

    --plan:          #a892e0;
    --actual:        #4b9fe1;
    --lastmonth:     #6d7f93;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow:    0 4px 14px rgba(0,0,0,.45);
    --shadow-lg: 0 20px 50px rgba(0,0,0,.6);
  }
}

:root[data-theme="dark"] {
  --bg:            #0c1219;
  --surface:       #131c26;
  --surface-2:     #18232f;
  --surface-3:     #1f2c3a;
  --border:        #24313f;
  --border-strong: #34455a;
  --text:          #e6edf5;
  --text-muted:    #9fb0c3;
  --text-faint:    #6d7f93;

  --brand:         #4b9fe1;
  --brand-strong:  #7bbcf0;
  --brand-soft:    #16293c;
  --brand-fg:      #06121d;

  --excellent:     #4ecf9a;
  --excellent-bg:  #102b21;
  --good:          #62c68f;
  --good-bg:       #12291d;
  --ok:            #e2b23c;
  --ok-bg:         #2c2410;
  --warn:          #f0904a;
  --warn-bg:       #331f11;
  --bad:           #f2776d;
  --bad-bg:        #331616;
  --critical:      #ff8a80;
  --critical-bg:   #3a1512;
  --info:          #6fb0f2;
  --info-bg:       #14263a;

  --plan:          #a892e0;
  --actual:        #4b9fe1;
  --lastmonth:     #6d7f93;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow:    0 4px 14px rgba(0,0,0,.45);
  --shadow-lg: 0 20px 50px rgba(0,0,0,.6);
}

/* -------------------------------------------------------------- reset --- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1,h2,h3,h4,h5 { margin: 0; font-weight: 650; line-height: 1.25; letter-spacing: -.01em; }
p { margin: 0 0 .75em; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
table { border-collapse: collapse; width: 100%; }
[hidden] { display: none !important; }

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: 3px;
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 200;
  background: var(--brand); color: var(--brand-fg);
  padding: 10px 16px; border-radius: 0 0 var(--radius) 0;
}
.skip-link:focus { left: 0; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* --------------------------------------------------------------- boot --- */
.boot {
  position: fixed; inset: 0; display: grid; place-items: center;
  background: var(--bg); z-index: 100;
}
.boot__inner { text-align: center; }
.boot__mark {
  font-weight: 800; font-size: 26px; letter-spacing: .14em;
  color: var(--brand); margin-bottom: 18px;
}
.boot__text { color: var(--text-muted); margin-top: 14px; font-size: 13px; }
.spinner {
  width: 30px; height: 30px; margin: 0 auto;
  border: 2.5px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2s; }
  * { scroll-behavior: auto !important; }
}

/* -------------------------------------------------------------- shell --- */
.shell { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px;
  height: var(--topbar-h); padding: 0 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar__menu { display: none; }
.topbar__brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.topbar__mark {
  display: grid; place-items: center;
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--brand); color: var(--brand-fg);
  font-size: 10.5px; font-weight: 800; letter-spacing: .06em;
}
.topbar__title { font-weight: 650; white-space: nowrap; }
.topbar__context { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.topbar__actions { display: flex; align-items: center; gap: 6px; }

.burger, .burger::before, .burger::after {
  display: block; width: 17px; height: 2px; border-radius: 2px;
  background: currentColor; content: '';
}
.burger { position: relative; }
.burger::before { position: absolute; top: -5px; }
.burger::after  { position: absolute; top: 5px; }

.usermenu { position: relative; }
.usermenu__btn {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 8px 4px 4px; border: 1px solid transparent;
  border-radius: 999px; background: none; cursor: pointer;
}
.usermenu__btn:hover { background: var(--surface-3); }
.avatar {
  display: grid; place-items: center; flex: none;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--brand-soft); color: var(--brand);
  font-size: 11.5px; font-weight: 700;
}
.usermenu__meta { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
.usermenu__name { font-size: 12.5px; font-weight: 600; }
.usermenu__role { font-size: 10.5px; color: var(--text-muted); letter-spacing: .04em; }
.usermenu__panel {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 60;
  min-width: 250px; padding: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
}
.usermenu__panel dl { margin: 0; padding: 8px 10px; }
.usermenu__panel dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); }
.usermenu__panel dd { margin: 0 0 8px; font-size: 13px; }

.body { display: flex; flex: 1; min-height: 0; }

.sidebar {
  width: var(--sidebar-w); flex: none;
  display: flex; flex-direction: column;
  background: var(--surface); border-right: 1px solid var(--border);
  position: sticky; top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
}
.sidebar__scroll { flex: 1; overflow-y: auto; padding: 12px 10px; }
.sidebar__foot { padding: 10px 16px; border-top: 1px solid var(--border); }
.sidebar__version { font-size: 10.5px; color: var(--text-faint); }

.navgroup { margin-bottom: 16px; }
.navgroup__label {
  padding: 0 10px 6px; font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint);
}
.navitem {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; margin-bottom: 1px;
  border: 0; border-radius: var(--radius-sm);
  background: none; color: var(--text-muted);
  font-size: 13.5px; text-align: left; cursor: pointer;
}
.navitem:hover { background: var(--surface-3); color: var(--text); }
.navitem[aria-current="page"] {
  background: var(--brand-soft); color: var(--brand); font-weight: 600;
}
.navitem__icon { flex: none; width: 18px; text-align: center; opacity: .85; }
.navitem__badge {
  margin-left: auto; min-width: 20px; padding: 1px 6px;
  border-radius: 999px; background: var(--bad); color: #fff;
  font-size: 10.5px; font-weight: 700; text-align: center;
}

.scrim {
  position: fixed; inset: var(--topbar-h) 0 0; z-index: 25;
  background: rgba(8,14,20,.45);
}

.main { flex: 1; min-width: 0; padding: 20px 22px 56px; }
.view { max-width: 1560px; margin: 0 auto; }

@media (max-width: 900px) {
  .topbar__menu { display: grid; place-items: center; }
  .topbar__title { display: none; }
  .sidebar {
    position: fixed; top: var(--topbar-h); left: 0; z-index: 30;
    transform: translateX(-100%); transition: transform .2s ease;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.is-open { transform: none; }
  .main { padding: 14px 12px 48px; }
  .btn__label { display: none; }
}

/* ------------------------------------------------------------ headings --- */
.page-head {
  display: flex; flex-wrap: wrap; align-items: flex-end;
  justify-content: space-between; gap: 12px; margin-bottom: 18px;
}
.page-head__text { min-width: 0; }
.page-head h1 { font-size: 21px; }
.page-head__sub { margin: 4px 0 0; color: var(--text-muted); font-size: 13px; }
.page-head__actions { display: flex; flex-wrap: wrap; gap: 8px; }

.section { margin-bottom: 26px; }
.section__head {
  display: flex; flex-wrap: wrap; align-items: baseline;
  justify-content: space-between; gap: 10px; margin-bottom: 10px;
}
.section__head h2 { font-size: 15.5px; }
.section__hint { font-size: 12.5px; color: var(--text-muted); }

/* --------------------------------------------------------------- card --- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.card--pad { padding: 16px; }
.card__head {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: 10px;
  padding: 13px 16px; border-bottom: 1px solid var(--border);
}
.card__title { font-size: 14px; font-weight: 650; }
.card__body { padding: 16px; }
.card__body--flush { padding: 0; }
.card__foot {
  padding: 11px 16px; border-top: 1px solid var(--border);
  background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius);
  font-size: 12.5px; color: var(--text-muted);
}

.grid { display: grid; gap: 14px; }
.grid--tiles { grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

/* --------------------------------------------------------------- tile --- */
.tile {
  position: relative; padding: 15px 16px 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--border-strong);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
  text-align: left; width: 100%; cursor: pointer;
  transition: box-shadow .15s ease, transform .15s ease;
}
.tile:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.tile[data-tone="excellent"] { border-left-color: var(--excellent); }
.tile[data-tone="good"]      { border-left-color: var(--good); }
.tile[data-tone="ok"]        { border-left-color: var(--ok); }
.tile[data-tone="warn"]      { border-left-color: var(--warn); }
.tile[data-tone="bad"]       { border-left-color: var(--bad); }
.tile[data-tone="critical"]  { border-left-color: var(--critical); }

.tile__label {
  display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-muted);
}
.tile__value {
  margin: 7px 0 2px; font-size: 26px; font-weight: 700;
  letter-spacing: -.02em; font-variant-numeric: tabular-nums;
}
.tile__target { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.tile__foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--border);
  font-size: 11.5px; color: var(--text-muted);
}
.tile__drr { display: flex; gap: 4px; align-items: baseline; font-variant-numeric: tabular-nums; }
.tile__drr b { color: var(--text); font-weight: 650; }

.meter { height: 5px; margin-top: 10px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.meter__fill { height: 100%; border-radius: 3px; background: var(--brand); transition: width .3s ease; }
.meter__fill[data-tone="excellent"] { background: var(--excellent); }
.meter__fill[data-tone="good"]      { background: var(--good); }
.meter__fill[data-tone="ok"]        { background: var(--ok); }
.meter__fill[data-tone="warn"]      { background: var(--warn); }
.meter__fill[data-tone="bad"]       { background: var(--bad); }
.meter__fill[data-tone="critical"]  { background: var(--critical); }

/* --------------------------------------------------------------- pill --- */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
  background: var(--surface-3); color: var(--text-muted);
}
.pill[data-tone="excellent"] { background: var(--excellent-bg); color: var(--excellent); }
.pill[data-tone="good"]      { background: var(--good-bg); color: var(--good); }
.pill[data-tone="ok"]        { background: var(--ok-bg); color: var(--ok); }
.pill[data-tone="warn"]      { background: var(--warn-bg); color: var(--warn); }
.pill[data-tone="bad"]       { background: var(--bad-bg); color: var(--bad); }
.pill[data-tone="critical"]  { background: var(--critical-bg); color: var(--critical); }
.pill[data-tone="info"]      { background: var(--info-bg); color: var(--info); }
.pill[data-tone="brand"]     { background: var(--brand-soft); color: var(--brand); }

.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

/* ------------------------------------------------------------- button --- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); background: var(--surface); color: var(--text);
  font-size: 13px; font-weight: 550; cursor: pointer; white-space: nowrap;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover:not(:disabled) { background: var(--surface-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn--primary { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.btn--primary:hover:not(:disabled) { background: var(--brand-strong); border-color: var(--brand-strong); }
.btn--danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn--ghost { border-color: transparent; background: none; }
.btn--ghost:hover:not(:disabled) { background: var(--surface-3); }
.btn--sm { padding: 5px 10px; font-size: 12px; }
.btn--block { width: 100%; }

.iconbtn {
  display: grid; place-items: center; width: 34px; height: 34px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  background: none; cursor: pointer; color: var(--text-muted); font-size: 15px;
}
.iconbtn:hover { background: var(--surface-3); color: var(--text); }

.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }

/* --------------------------------------------------------------- form --- */
.field { margin-bottom: 13px; }
.field__label {
  display: block; margin-bottom: 5px;
  font-size: 12px; font-weight: 600; color: var(--text-muted);
}
.field__label .req { color: var(--bad); }
.field__hint { margin-top: 4px; font-size: 11.5px; color: var(--text-faint); }
.field__error { margin-top: 4px; font-size: 11.5px; color: var(--bad); font-weight: 550; }

.input, .select, .textarea {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); font-size: 13.5px;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--brand); outline: 2px solid var(--brand-soft); outline-offset: 0;
}
.input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] {
  border-color: var(--bad);
}
.textarea { min-height: 76px; resize: vertical; }
.input--num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }

.formgrid { display: grid; gap: 0 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.formgrid--wide { grid-column: 1 / -1; }

.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }
.check input { width: 15px; height: 15px; accent-color: var(--brand); }

.filters {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px;
  padding: 12px 14px; margin-bottom: 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
}
.filters .field { margin: 0; min-width: 150px; }
.filters__spacer { flex: 1; }

/* -------------------------------------------------------------- table --- */
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.table { font-size: 13px; min-width: 100%; }
.table th, .table td {
  padding: 9px 11px; text-align: left; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.table thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface-2); color: var(--text-muted);
  font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  white-space: nowrap;
}
.table tbody tr:hover { background: var(--surface-2); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table .strong { font-weight: 650; }
.table tfoot td {
  background: var(--surface-2); font-weight: 700; border-top: 2px solid var(--border-strong);
}
.table__group td {
  background: var(--surface-3); font-weight: 700; font-size: 12px;
  text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted);
}
.table--compact th, .table--compact td { padding: 6px 9px; }
.table--clickable tbody tr { cursor: pointer; }

.linklike {
  background: none; border: 0; padding: 0; color: var(--brand);
  font: inherit; cursor: pointer; text-align: left; text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--brand) 40%, transparent);
  text-underline-offset: 2px;
}
.linklike:hover { text-decoration-color: currentColor; }

.cell-sub { display: block; font-size: 11.5px; color: var(--text-faint); }

/* --------------------------------------------------------------- misc --- */
.empty { padding: 40px 20px; text-align: center; color: var(--text-muted); }
.empty__icon { font-size: 30px; opacity: .4; margin-bottom: 8px; }
.empty__title { font-weight: 650; color: var(--text); margin-bottom: 4px; }

.banner {
  display: flex; gap: 11px; align-items: flex-start;
  padding: 12px 14px; margin-bottom: 14px;
  border: 1px solid var(--border); border-left-width: 3px;
  border-radius: var(--radius); background: var(--surface);
  font-size: 13px;
}
.banner[data-tone="info"]     { border-left-color: var(--info); background: var(--info-bg); }
.banner[data-tone="warn"]     { border-left-color: var(--warn); background: var(--warn-bg); }
.banner[data-tone="bad"]      { border-left-color: var(--bad); background: var(--bad-bg); }
.banner[data-tone="critical"] { border-left-color: var(--critical); background: var(--critical-bg); }
.banner[data-tone="good"]     { border-left-color: var(--good); background: var(--good-bg); }
.banner__body { flex: 1; min-width: 0; }
.banner__title { font-weight: 650; margin-bottom: 2px; }

<script>
/* ==========================================================================
   Planning — "Assign Once".
   Cycle, KRA/KPI structure, assignments, account plan and the annual onboarding
   plan, in the order a Team Lead works through them at the start of a month.
   ========================================================================== */

Router.register('planning', {
  permission: 'PLAN_VIEW',
  skeleton: () => Components.tableSkeleton(6),
  async render(host) {
    const cycleId = State.params.cycleId || State.cycleId;
    if (!cycleId) { SetupView.renderNoCycle(host); return; }

    const tab = State.params.tab || 'structure';
    const cycle = await Api.call('cycle.get', { cycleId });
    const canEdit = State.can('KRA_MANAGE') || State.can('PLAN_MANAGE');
    const editable = cycle.status === 'DRAFT' || cycle.status === 'PUBLISHED';
    const bizFn = State.businessFunction(cycle.category);

    const tabs = [
      ['structure', 'KRAs & KPIs'],
      ['assignments', 'Assignments']
    ];
    // Account-level planning (tonnage/rate/GMV) is an OMP concept — a GENERIC
    // business function has no per-account book, so these tabs simply don't
    // appear rather than being rewritten for a model that doesn't apply.
    if (bizFn.hasAccountPlan) {
      tabs.push(['accounts', 'Account Plan'], ['annual', 'Annual Onboarding Plan']);
    }
    tabs.push(['validate', 'Readiness']);

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Monthly Plan',
        subtitle: `${F.esc(cycle.label)} ·
          <span class="pill" data-tone="${F.statusTone(cycle.status)}">${F.esc(cycle.status)}</span> ·
          ${cycle.workingDays} working days`,
        actions: cycleActions(cycle)
      })}

      <div class="tabs" role="tablist">
        ${tabs.map(([key, label]) => `
          <button class="tab" role="tab" data-tab="${key}"
                  aria-selected="${tab === key}">${F.esc(label)}</button>`).join('')}
      </div>

      <div id="planBody"></div>`;

    D.on(host, 'click', '[data-tab]', (e, el) =>
      Router.go('planning', { cycleId, tab: el.dataset.tab }));

    bindCycleActions(host, cycle);

    const body = D.q('#planBody', host);
    body.innerHTML = Components.tableSkeleton(5);

    if (tab === 'structure') await renderStructure(body, cycle, canEdit && editable);
    else if (tab === 'assignments') await renderAssignments(body, cycle, canEdit && editable);
    else if (tab === 'accounts' && bizFn.hasAccountPlan) {
      await renderAccountPlan(body, cycle, State.can('PLAN_MANAGE') && editable);
    } else if (tab === 'annual' && bizFn.hasAccountPlan) {
      await renderAnnualPlan(body, cycle, State.can('PLAN_MANAGE'));
    } else if (tab === 'validate') await renderValidation(body, cycle);
    else await renderStructure(body, cycle, canEdit && editable);
  }
});

/* ------------------------------------------------------------- structure --- */
async function renderStructure(host, cycle, canEdit) {
  const tree = await Api.call('kra.tree', { cycleId: cycle.cycleId });
  const bizFn = State.businessFunction(cycle.category);
  const streamLabels = bizFn.streamLabels || { SUPPLY: 'Supply', DEMAND: 'Demand' };
  const streamKeys = bizFn.streamMode === 'SINGLE' ? ['GENERAL'] : ['SUPPLY', 'DEMAND'];
  const byStream = {};
  streamKeys.forEach(s => { byStream[s] = []; });
  tree.forEach(k => (byStream[k.stream] || (byStream[k.stream] = [])).push(k));

  const streamBlock = (stream, label) => {
    const kras = byStream[stream] || [];
    const total = kras.reduce((sum, k) => sum + k.totalWeightage, 0);
    const valid = Math.abs(total - 100) < 0.01;
    return Components.section({
      title: label,
      hint: `Weightage total <b class="${valid ? '' : 'muted'}">${F.num(total, 1)}%</b>` +
        (valid ? ' ✓' : ' — must equal 100% before publishing'),
      actions: canEdit
        ? `<button class="btn btn--sm" data-add-kra="${stream}">＋ Add KRA</button>` : '',
      body: kras.length ? kras.map(k => Components.card({
        title: `${k.kraName}`,
        actions: `
          <span class="pill" data-tone="brand">${F.num(k.totalWeightage, 0)}%</span>
          ${k.perspective ? Components.pill(k.perspective, '') : ''}
          ${canEdit ? `
            <button class="btn btn--sm" data-add-kpi="${F.esc(k.kraId)}">＋ KPI</button>
            <button class="btn btn--sm" data-edit-kra="${F.esc(k.kraId)}">Edit</button>
            <button class="btn btn--sm" data-del-kra="${F.esc(k.kraId)}">Remove</button>` : ''}`,
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            {
              label: 'KPI', format: r => `<span class="strong">${F.esc(r.kpiName)}</span>
                <span class="cell-sub">${F.esc(r.definition)}</span>`
            },
            { label: 'Weight', align: 'right', width: '80px', format: r => F.num(r.weightage, 0) + '%' },
            {
              label: 'Measured by', width: '190px', format: r =>
                `${F.esc(r.metricLabel)}<span class="cell-sub">${F.esc(F.titleCase(r.direction))}</span>`
            },
            {
              label: 'Target from', width: '180px', format: r =>
                `${F.esc(F.titleCase(r.targetBasis))}${r.basisPct
                  ? `<span class="cell-sub">${F.pct(r.basisPct, 0)} of ${F.esc(F.titleCase(r.basisMetric))}</span>` : ''}`
            },
            {
              label: 'Rating bands (1→5)', format: r => `
                <div class="kpi-target-bands">${r.targets.map((t, i) =>
                  `<span title="Rating ${i + 1}">${r.unitOfMeasure === 'Percentage'
                    ? F.pct(t, 0) : F.num(t, t < 1 ? 3 : 0)}</span>`).join('')}</div>`
            },
            {
              label: '', width: '70px', format: r => canEdit
                ? `<button class="btn btn--sm" data-edit-kpi="${F.esc(r.kpiId)}"
                     data-kra="${F.esc(r.kraId)}">Edit</button>` : ''
            }
          ],
          rows: k.kpis,
          empty: 'No KPIs under this KRA yet.'
        }),
        foot: k.sourceOfTracking ? `Source of tracking: ${F.esc(k.sourceOfTracking)}` : ''
      })).join('<div style="height:12px"></div>')
        : Components.emptyState({
            title: `No ${label} KRAs`,
            message: canEdit ? 'Add the first KRA to start the plan.' : 'Nothing defined yet.'
          })
    });
  };

  host.innerHTML = streamKeys.map(s => streamBlock(s, streamLabels[s] || s)).join('');

  if (!canEdit) return;

  D.on(host, 'click', '[data-add-kra]', (e, el) => kraModal(cycle, { stream: el.dataset.addKra }));
  D.on(host, 'click', '[data-edit-kra]', (e, el) => {
    const kra = tree.find(k => k.kraId === el.dataset.editKra);
    kraModal(cycle, kra);
  });
  D.on(host, 'click', '[data-del-kra]', async (e, el) => {
    const kra = tree.find(k => k.kraId === el.dataset.delKra);
    const ok = await Overlay.confirm({
      title: 'Remove KRA',
      message: `Remove "${kra.kraName}" and its ${kra.kpis.length} KPI(s) from ${cycle.label}? ` +
        'Historical records are kept.',
      confirmLabel: 'Remove', tone: 'danger'
    });
    if (!ok) return;
    try {
      await Api.call('kra.delete', { kraId: kra.kraId });
      Toast.success('KRA removed');
      Router.render();
    } catch (err) { Toast.fromError(err); }
  });
  D.on(host, 'click', '[data-add-kpi]', (e, el) => kpiModal(cycle, { kraId: el.dataset.addKpi }));
  D.on(host, 'click', '[data-edit-kpi]', (e, el) => {
    const kra = tree.find(k => k.kraId === el.dataset.kra);
    const kpi = kra.kpis.find(p => p.kpiId === el.dataset.editKpi);
    kpiModal(cycle, Object.assign({ kraId: kra.kraId }, kpi));
  });
}

function kraModal(cycle, kra) {
  const bizFn = State.businessFunction(cycle.category);
  const streamLabels = bizFn.streamLabels || { SUPPLY: 'Supply', DEMAND: 'Demand' };
  const streamKeys = bizFn.streamMode === 'SINGLE' ? ['GENERAL'] : ['SUPPLY', 'DEMAND'];
  const streamOptions = streamKeys.map(s => ({ value: s, label: streamLabels[s] || s }));

  Overlay.openModal({
    title: kra && kra.kraId ? 'Edit KRA' : 'New KRA',
    body: `<form id="kraForm">
      <input type="hidden" name="cycleId" value="${F.esc(cycle.cycleId)}">
      ${kra && kra.kraId ? `<input type="hidden" name="kraId" value="${F.esc(kra.kraId)}">` : ''}
      <div class="formgrid">
        ${Components.field({
          name: 'stream', label: 'Stream', type: 'select', required: true,
          value: (kra && kra.stream) || streamKeys[0],
          options: streamOptions
        })}
        ${Components.field({
          name: 'perspective', label: 'Perspective', type: 'select',
          value: (kra && kra.perspective) || 'Sales',
          options: ['Sales', 'Scale', 'Customer', 'Process', 'People']
        })}
        ${Components.field({
          name: 'kraName', label: 'KRA name', required: true, wide: true,
          value: (kra && kra.kraName) || '',
          placeholder: 'e.g. Transaction from Existing Sellers'
        })}
        ${Components.field({
          name: 'sourceOfTracking', label: 'Source of tracking',
          value: (kra && kra.sourceOfTracking) || 'Operational Activity'
        })}
        ${Components.field({
          name: 'sequence', label: 'Order', type: 'number', min: 1,
          value: (kra && kra.sequence) || 1
        })}
      </div>
    </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="saveKra">Save KRA</button>`
  });

  D.q('#saveKra').onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      await Api.call('kra.save', D.formData(D.q('#kraForm')));
      Toast.success('KRA saved');
      Overlay.closeModal();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      D.markInvalid(D.q('#kraForm'), err.message);
    }
  };
}

function kpiModal(cycle, kpi) {
  const bizFn = State.businessFunction(cycle.category);
  const allMetrics = State.ref('metrics');
  // A GENERIC business function's own metrics first, then everything else —
  // so the picker leads with what actually applies to this cycle.
  const ownMetrics = allMetrics.filter(m => m.businessFunctionId === cycle.category);
  const metrics = ownMetrics.length
    ? ownMetrics.concat(allMetrics.filter(m => m.businessFunctionId !== cycle.category))
    : allMetrics;
  const defaultMetricKey = ownMetrics.length ? ownMetrics[0].key : 'GMV_CR';
  const targets = kpi.targets || [0.6, 0.75, 0.9, 1.0, 1.05];

  Overlay.openModal({
    title: kpi.kpiId ? 'Edit KPI' : 'New KPI',
    wide: true,
    body: `<form id="kpiForm">
      <input type="hidden" name="kraId" value="${F.esc(kpi.kraId)}">
      ${kpi.kpiId ? `<input type="hidden" name="kpiId" value="${F.esc(kpi.kpiId)}">` : ''}
      <div class="formgrid">
        ${Components.field({
          name: 'kpiName', label: 'KPI name', required: true, wide: true, value: kpi.kpiName || ''
        })}
        ${Components.field({
          name: 'definition', label: 'Definition — what "good" means', type: 'textarea', wide: true,
          value: kpi.definition || '', rows: 2,
          placeholder: 'e.g. 50% of total onboarded sellers should transact in the current month.'
        })}
        ${Components.field({
          name: 'weightage', label: 'Weightage (%)', type: 'number', required: true,
          min: 1, max: 100, step: 1, value: kpi.weightage || 15
        })}
        ${Components.field({
          name: 'unitOfMeasure', label: 'Unit of measure', type: 'select',
          value: kpi.unitOfMeasure || 'Percentage',
          options: ['Percentage', 'Count', 'Days', 'MT', 'Cr']
        })}
        ${Components.field({
          name: 'metricKey', label: 'Measured by', type: 'select', required: true,
          value: kpi.metricKey || defaultMetricKey,
          options: metrics.map(m => ({ value: m.key, label: `${m.label} (${m.unit})` })),
          hint: 'The engine computes this from operational records.'
        })}
        ${Components.field({
          name: 'direction', label: 'Direction', type: 'select',
          value: kpi.direction || 'HIGHER_BETTER',
          options: [
            { value: 'HIGHER_BETTER', label: 'Higher is better' },
            { value: 'LOWER_BETTER', label: 'Lower is better (DSO, DN%)' }
          ]
        })}
        ${Components.field({
          name: 'targetBasis', label: 'Target comes from', type: 'select',
          value: kpi.targetBasis || 'MANUAL',
          options: (bizFn.hasAccountPlan ? [
            { value: 'ACCOUNT_PLAN', label: 'Sum of the account plan' },
            { value: 'BALANCE_PLUS_MTD', label: 'Annual balance + month to date' }
          ] : []).concat([
            { value: 'PCT_OF_METRIC', label: 'Percentage of another metric' },
            { value: 'RATE_PER_DAY', label: 'Working days × rate' },
            { value: 'MANUAL', label: 'Entered manually' }
          ])
        })}
        ${Components.field({
          name: 'basisMetric', label: 'Base metric', type: 'select',
          value: kpi.basisMetric || '',
          options: [{ value: '', label: '— None —' }].concat(
            metrics.map(m => ({ value: m.key, label: m.label })),
            [
              { value: 'ONBOARDED_SELLERS_FYTD', label: 'Onboarded sellers (FYTD)' },
              { value: 'ONBOARDED_BUYERS_FYTD', label: 'Onboarded buyers (FYTD)' },
              { value: 'PREV_MONTH_TRANSACTING_SELLERS', label: 'Sellers transacting last month' },
              { value: 'PREV_MONTH_TRANSACTING_BUYERS', label: 'Buyers transacting last month' }
            ])
        })}
        ${Components.field({
          name: 'basisPct', label: 'Percentage of base', type: 'number', step: 'any',
          value: kpi.basisPct === null || kpi.basisPct === undefined ? '' : kpi.basisPct,
          hint: 'As a fraction — 0.5 means 50%.'
        })}
      </div>

      <div class="field formgrid--wide">
        <label class="field__label">Rating bands — the achievement needed for each rating</label>
        <div class="formgrid">
          ${targets.map((t, i) => `
            <div class="field">
              <label class="field__label" for="f_t${i + 1}">
                ${i + 1} · ${F.esc(State.ref('ratingScale').slice().reverse()[i]
                  ? State.ref('ratingScale').slice().reverse()[i].label : '')}</label>
              <input class="input input--num" type="number" step="any"
                     id="f_t${i + 1}" name="t${i + 1}" value="${F.esc(t)}">
            </div>`).join('')}
        </div>
        <div class="field__hint">For percentage KPIs use fractions (1.05 = 105%). For
          lower-is-better KPIs the bands descend (15 days → 2 days).</div>
      </div>
    </form>`,
    footer: `
      <button class="btn" data-close-modal>Cancel</button>
      ${kpi.kpiId ? `<button class="btn btn--danger" id="delKpi">Remove</button>` : ''}
      <button class="btn btn--primary" id="saveKpi">Save KPI</button>`
  });

  D.q('#saveKpi').onclick = async (e) => {
    const form = D.q('#kpiForm');
    const data = D.formData(form);
    data.targets = [data.t1, data.t2, data.t3, data.t4, data.t5].map(Number);
    ['t1', 't2', 't3', 't4', 't5'].forEach(k => delete data[k]);
    e.currentTarget.disabled = true;
    try {
      await Api.call('kpi.save', data);
      Toast.success('KPI saved');
      Overlay.closeModal();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      D.markInvalid(form, err.message);
    }
  };

  const del = D.q('#delKpi');
  if (del) del.onclick = async () => {
    const ok = await Overlay.confirm({
      title: 'Remove KPI', message: `Remove "${kpi.kpiName}" from this cycle?`,
      confirmLabel: 'Remove', tone: 'danger'
    });
    if (!ok) return;
    try {
      await Api.call('kpi.delete', { kpiId: kpi.kpiId });
      Toast.success('KPI removed');
      Overlay.closeModal();
      Router.render();
    } catch (err) { Toast.fromError(err); }
  };
}

/* ----------------------------------------------------------- assignments --- */
async function renderAssignments(host, cycle, canEdit) {
  const [assignments, tree] = await Promise.all([
    Api.call('assignment.list', { cycleId: cycle.cycleId }),
    Api.call('kra.tree', { cycleId: cycle.cycleId })
  ]);
  const allKpis = tree.flatMap(k => k.kpis.map(p => Object.assign({ kraName: k.kraName, stream: k.stream }, p)));
  const byPoc = {};
  assignments.forEach(a => (byPoc[a.pocUserId] || (byPoc[a.pocUserId] = [])).push(a));

  host.innerHTML = `
    ${canEdit ? Components.banner('info', 'Assign once',
      'Select the POCs and the KPIs they own. Targets are derived automatically from the ' +
      'account plan and the annual plan — override one only when there is a reason.',
      `<button class="btn btn--sm btn--primary" id="bulkAssign">Assign KPIs</button>`) : ''}

    ${Object.keys(byPoc).length ? Object.keys(byPoc).map(pocId => {
      const rows = byPoc[pocId];
      const total = rows.reduce((s, r) => s + Number(r.weightage || 0), 0);
      const valid = Math.abs(total - 100) < 0.01;
      return Components.card({
        title: State.userName(pocId),
        actions: `<span class="pill" data-tone="${valid ? 'good' : 'warn'}">${
          F.num(total, 1)}% weightage${valid ? ' ✓' : ''}</span>`,
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            { label: 'KPI', format: r => F.esc(r.kpiName) },
            {
              label: 'Weight', align: 'right', width: '90px',
              format: r => `${F.num(r.weightage, 0)}%${r.weightageInherited
                ? '<span class="cell-sub">inherited</span>' : '<span class="cell-sub">override</span>'}`
            },
            {
              label: 'Target', align: 'right', width: '150px',
              format: r => r.targetOverride
                ? `<span class="strong tnum">${F.num(r.targetValue, 2)}</span>
                   <span class="cell-sub">manual override</span>`
                : `<span class="faint">derived</span>
                   <span class="cell-sub">${F.esc(F.titleCase(r.targetBasis))}</span>`
            },
            { label: 'Due', width: '110px', format: r => F.date(r.dueDate) },
            { label: 'Notes', format: r => F.esc(r.notes) },
            {
              label: '', width: '110px', format: r => canEdit ? `
                <button class="btn btn--sm" data-edit-asg="${F.esc(r.assignmentId)}">Edit</button>
                <button class="btn btn--sm" data-del-asg="${F.esc(r.assignmentId)}">✕</button>` : ''
            }
          ],
          rows
        })
      });
    }).join('<div style="height:12px"></div>')
      : Components.emptyState({
          icon: '👥', title: 'No KPIs assigned yet',
          message: 'Assign the KRA set to each POC so their scorecard can be calculated.',
          action: canEdit ? '<button class="btn btn--primary" id="bulkAssign2">Assign KPIs</button>' : ''
        })}`;

  if (!canEdit) return;

  const openBulk = () => bulkAssignModal(cycle, allKpis);
  ['#bulkAssign', '#bulkAssign2'].forEach(sel => {
    const el = D.q(sel, host); if (el) el.onclick = openBulk;
  });

  D.on(host, 'click', '[data-edit-asg]', (e, el) => {
    const a = assignments.find(x => x.assignmentId === el.dataset.editAsg);
    assignmentModal(a);
  });
  D.on(host, 'click', '[data-del-asg]', async (e, el) => {
    const a = assignments.find(x => x.assignmentId === el.dataset.delAsg);
    const ok = await Overlay.confirm({
      title: 'Remove assignment',
      message: `Remove "${a.kpiName}" from ${a.pocName}'s scorecard?`,
      confirmLabel: 'Remove', tone: 'danger'
    });
    if (!ok) return;
    try {
      await Api.call('assignment.remove', { assignmentId: a.assignmentId });
      Toast.success('Assignment removed');
      Router.render();
    } catch (err) { Toast.fromError(err); }
  });
}

function bulkAssignModal(cycle, kpis) {
  const pocs = State.ref('users').filter(u => u.active && ['POC', 'RH', 'TEAM_LEAD'].includes(u.role));
  Overlay.openModal({
    title: 'Assign KPIs',
    wide: true,
    body: `
      <form id="assignForm">
        <input type="hidden" name="cycleId" value="${F.esc(cycle.cycleId)}">
        <div class="formgrid">
          <div class="field formgrid--wide">
            <label class="field__label">POCs <span class="req">*</span></label>
            <div class="btnrow" style="margin-bottom:6px">
              <button type="button" class="btn btn--sm" data-select="pocs" data-all="1">Select all</button>
              <button type="button" class="btn btn--sm" data-select="pocs" data-all="0">Clear</button>
            </div>
            <div class="stack" style="max-height:200px;overflow:auto;border:1px solid var(--border);
                 border-radius:var(--radius-sm);padding:10px">
              ${pocs.map(u => `<label class="check">
                <input type="checkbox" data-group="pocs" value="${F.esc(u.userId)}">
                <span>${F.esc(u.fullName)}<span class="faint"> · ${F.esc(u.regionName || u.role)}</span></span>
              </label>`).join('')}
            </div>
          </div>

          <div class="field formgrid--wide">
            <label class="field__label">KPIs <span class="req">*</span></label>
            <div class="btnrow" style="margin-bottom:6px">
              <button type="button" class="btn btn--sm" data-select="kpis" data-all="1">Select all</button>
              <button type="button" class="btn btn--sm" data-select="kpis" data-stream="SUPPLY">Supply set</button>
              <button type="button" class="btn btn--sm" data-select="kpis" data-stream="DEMAND">Demand set</button>
              <button type="button" class="btn btn--sm" data-select="kpis" data-all="0">Clear</button>
            </div>
            <div class="stack" style="max-height:220px;overflow:auto;border:1px solid var(--border);
                 border-radius:var(--radius-sm);padding:10px">
              ${kpis.map(k => `<label class="check">
                <input type="checkbox" data-group="kpis" data-stream="${F.esc(k.stream)}"
                       value="${F.esc(k.kpiId)}">
                <span>${F.esc(k.kpiName)}
                  <span class="faint"> · ${F.esc(k.kraName)} · ${F.num(k.weightage, 0)}%</span></span>
              </label>`).join('')}
            </div>
          </div>

          ${Components.field({
            name: 'dueDate', label: 'Due date', type: 'date',
            value: cycle.endDate, hint: 'Defaults to the end of the cycle.'
          })}
          ${Components.field({ name: 'notes', label: 'Note to the POC' })}
        </div>
      </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="doAssign">Assign</button>`
  });

  D.on(D.q('#assignForm'), 'click', '[data-select]', (e, el) => {
    const group = el.dataset.select;
    D.qa(`[data-group="${group}"]`).forEach(cb => {
      if (el.dataset.stream) cb.checked = cb.dataset.stream === el.dataset.stream;
      else cb.checked = el.dataset.all === '1';
    });
  });

  D.q('#doAssign').onclick = async (e) => {
    const form = D.q('#assignForm');
    const payload = D.formData(form);
    payload.pocUserIds = D.qa('[data-group="pocs"]:checked', form).map(c => c.value);
    payload.kpiIds = D.qa('[data-group="kpis"]:checked', form).map(c => c.value);
    if (!payload.pocUserIds.length || !payload.kpiIds.length) {
      Toast.warn('Select both', 'Choose at least one POC and one KPI.');
      return;
    }
    e.currentTarget.disabled = true;
    try {
      const res = await Api.call('assignment.assign', payload);

      'GMV (Cr) = Tonnage (MT) × Rate (₹/kg) ÷ 10,000. Enter tonnage and rate; ' +
      'the engine derives the rest and rolls it up to POC, region and category.')}

    ${Components.card({
      flush: true,
      body: Components.table({
        compact: true,
        columns: [
          {
            label: 'Account', format: r => `<span class="strong">${F.esc(r.accountName)}</span>
              <span class="cell-sub mono">${F.esc(r.gstin)}</span>`
          },
          { label: 'POC', width: '150px', format: r => F.esc(r.pocName) },
          { label: 'Region', width: '110px', format: r => F.esc(r.regionName) },
          { label: 'Material', width: '110px', format: r => F.esc(r.materialType) },
          { label: 'Txn', align: 'right', width: '70px', format: r => F.int(r.txnTarget) },
          { label: 'Tonnage', align: 'right', width: '100px', format: r => F.num(r.tonnageTargetMT, 1) },
          { label: '₹/kg', align: 'right', width: '80px', format: r => F.num(r.ratePerKgTarget, 2) },
          {
            label: 'GMV target', align: 'right', width: '110px',
            format: r => `<span class="strong">${F.cr(r.gmvTargetCr, 3)}</span>`
          },
          {
            label: 'Remarks', format: r => `${F.esc(r.remarks || '')}
              ${r.blockerReason ? `<span class="cell-sub">${F.esc(r.blockerReason)}</span>` : ''}`
          },
          {
            label: '', width: '70px', format: r => canEdit
              ? `<button class="btn btn--sm" data-edit-plan="${F.esc(r.planId)}">Edit</button>` : ''
          }
        ],
        rows: plans,
        empty: 'No accounts are planned for this cycle yet.',
        footer: plans.length ? `<tr>
          <td colspan="4">Total — ${plans.length} account(s)</td>
          <td class="num">${F.int(totals.txn)}</td>
          <td class="num">${F.num(totals.tonnage, 1)}</td>

        body: `<div class="btnrow">${unplanned.slice(0, 40).map(a =>

/* -------------------------------------------------------- cycle actions --- */
function cycleActions(cycle) {
  if (!State.can('CYCLE_MANAGE')) return Components.cycleSelect(cycle.cycleId);
  const buttons = [];
  if (cycle.status === 'DRAFT') buttons.push(`<button class="btn btn--primary" data-cycle="publish">Publish</button>`);
  if (cycle.status === 'PUBLISHED') buttons.push(`<button class="btn" data-cycle="lock">Lock cycle</button>`);
  if (cycle.status === 'LOCKED') {
    buttons.push(`<button class="btn" data-cycle="reopen">Reopen</button>`);
    buttons.push(`<button class="btn btn--primary" data-cycle="close">Close</button>`);
  }
  return `${Components.cycleSelect(cycle.cycleId)}
    <button class="btn" data-cycle="new">＋ New cycle</button>${buttons.join('')}`;
}

function bindCycleActions(host, cycle) {
  const picker = D.q('#cyclePicker', host);
  if (picker) picker.onchange = (e) => {
    State.cycleId = e.target.value;
    Router.go(State.route, Object.assign({}, State.params, { cycleId: e.target.value }));
  };

  D.on(host, 'click', '[data-cycle]', async (e, el) => {
    const op = el.dataset.cycle;
    if (op === 'new') { newCycleModal(); return; }

    const messages = {
      publish: ['Publish this cycle',
        'POCs will see their assignments and can start recording work. Structure changes stay possible.'],
      lock: ['Lock this cycle',
        'No further activity can be recorded and scores freeze for review. You can reopen it if needed.'],
      reopen: ['Reopen this cycle', 'Activity capture resumes and scores become live again.'],
      close: ['Close this cycle', 'The cycle is archived. This is the final state.']
    };
    const [title, message] = messages[op];
    const ok = await Overlay.confirm({ title, message, confirmLabel: F.titleCase(op) });
    if (!ok) return;

    el.disabled = true;
    try {
      await Api.call('cycle.' + op, { cycleId: cycle.cycleId });
      Toast.success(F.titleCase(op) + 'd', cycle.label);
      await Boot.reload();
      Router.render();
    } catch (err) {
      el.disabled = false;
      if (err.code === 'VALIDATION') {
        Toast.error('Cannot publish yet', err.message);
        Router.go('planning', { cycleId: cycle.cycleId, tab: 'validate' });
      } else {
        Toast.fromError(err);
      }
    }
  });
}

    e.currentTarget.disabled = true;
    try {
      const cycle = await Api.call('cycle.create', D.formData(D.q('#cycleForm')));
      Toast.success('Cycle created', cycle.label);
      Overlay.closeModal();
      await Boot.reload();
      State.cycleId = cycle.cycleId;
      Router.go('planning', { cycleId: cycle.cycleId });
    } catch (err) {
      e.currentTarget.disabled = false;
      D.markInvalid(D.q('#cycleForm'), err.message);
    }
  };
}

/* ----------------------------------------------------------- weekly plan --- */
Router.register('weekly', {
  permission: 'PLAN_VIEW',
  skeleton: () => Components.tableSkeleton(6),
  async render(host) {
    if (!State.businessFunction().hasAccountPlan) { host.innerHTML = Components.notApplicable(); return; }
    if (!State.cycleId) { SetupView.renderNoCycle(host); return; }
    const weekStart = State.params.weekStart || '';
    const review = await Api.call('weeklyPlan.review', { cycleId: State.cycleId, weekStart });
    const canEdit = State.can('PLAN_MANAGE');

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Weekly Plan vs Achievement',
        subtitle: `${F.date(review.weekStart)} – ${F.date(review.weekEnd)} · achievement is
          computed from shipments, never typed`,
        actions: `
          <button class="btn btn--sm" data-week="-1">← Previous</button>
          <button class="btn btn--sm" data-week="0">This week</button>
          <button class="btn btn--sm" data-week="1">Next →</button>
          ${canEdit ? `<button class="btn btn--primary" id="editWeek">Edit targets</button>` : ''}`
      })}

      <div class="grid grid--3" style="margin-bottom:16px">
        ${Components.statTile({ label: 'Weekly target', value: F.mt(review.totals.targetMT, 1) })}
        ${Components.statTile({ label: 'Achieved', value: F.mt(review.totals.achievedMT, 1) })}
        ${Components.statTile({
          label: 'Achievement',
          value: F.pct(review.totals.targetMT ? review.totals.achievedMT / review.totals.targetMT : 0),
          tone: F.tone(review.totals.targetMT ? review.totals.achievedMT / review.totals.targetMT : 0)
        })}
      </div>

      ${Components.card({
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            { label: 'POC', format: r => `${F.esc(r.pocName)}<span class="cell-sub">${F.esc(r.regionName)}</span>` },
            { label: 'Week target', align: 'right', format: r => F.num(r.weeklyTargetMT, 1) },
            { label: 'Achieved', align: 'right', format: r => F.num(r.weeklyAchievedMT, 1) },
            { label: 'Ach %', align: 'right', format: r => Components.achievementCell(r.achievementPct) }
          ].concat(review.days.map((d, i) => ({
            label: d.label.split(' ').slice(0, 2).join(' '), align: 'right',
            format: r => {
              const cell = r.daily[i];
              if (cell.future) return `<span class="faint tnum">${F.num(cell.target, 0)}</span>`;
              const tone = F.tone(cell.achievementPct);
              return `<span class="tnum">${F.num(cell.achieved, 1)}</span>
                <span class="cell-sub">of ${F.num(cell.target, 0)}</span>
                ${cell.target ? `<span class="pill" data-tone="${tone}"
                  style="font-size:10px">${F.pct(cell.achievementPct, 0)}</span>` : ''}`;
            }
          }))),
          rows: review.rows,
          empty: 'No weekly targets set. Use "Edit targets" to plan the week.'
        })
      })}`;

    D.on(host, 'click', '[data-week]', (e, el) => {
      const delta = Number(el.dataset.week);
      if (!delta) { Router.go('weekly'); return; }
      const d = new Date(review.weekStart + 'T00:00:00');
      d.setDate(d.getDate() + delta * 7);
      Router.go('weekly', { weekStart: d.toISOString().slice(0, 10) });
    });

    const edit = D.q('#editWeek', host);
    if (edit) edit.onclick = () => weeklyPlanModal(review);
  }
});

async function weeklyPlanModal(review) {
  const plan = await Api.call('weeklyPlan.get', {
    cycleId: State.cycleId, weekStart: review.weekStart
  });
  const pocs = State.ref('users').filter(u => u.active && ['POC', 'RH'].includes(u.role));
  const existing = {};
  plan.rows.forEach(r => r.daily.forEach(d => { existing[r.pocUserId + '|' + d.date] = d.tonnageTargetMT; }));

  Overlay.openModal({
    title: `Weekly targets · ${F.date(review.weekStart)}`,
    wide: true,
    body: `
      <p class="muted">Enter the daily tonnage target for each POC. Achievement is calculated
      from recorded shipments — there is nothing else to fill in.</p>
      <div class="tablewrap">
        <table class="table table--compact" id="weekGrid">
          <thead><tr><th>POC</th>${plan.days.map(d =>
            `<th class="num">${F.dateShort(d)}</th>`).join('')}<th class="num">Total</th></tr></thead>
          <tbody>
            ${pocs.map(u => `
              <tr data-poc="${F.esc(u.userId)}">
                <td>${F.esc(u.fullName)}</td>
                ${plan.days.map(d => `
                  <td class="num"><input class="input input--num" type="number" min="0" step="any"
                    style="width:76px" data-date="${F.esc(d)}"
                    value="${F.esc(existing[u.userId + '|' + d] || '')}"></td>`).join('')}
                <td class="num strong" data-total>0</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="saveWeek">Save targets</button>`
  });

  const recalc = () => {
    D.qa('#weekGrid tbody tr').forEach(tr => {
      const total = D.qa('input', tr).reduce((s, i) => s + Number(i.value || 0), 0);
      tr.querySelector('[data-total]').textContent = total ? F.num(total, 1) : '—';
    });
  };
  D.q('#weekGrid').addEventListener('input', recalc);
  recalc();

  D.q('#saveWeek').onclick = async (e) => {
    const entries = [];
    D.qa('#weekGrid tbody tr').forEach(tr => {
      const pocUserId = tr.dataset.poc;
      D.qa('input', tr).forEach(input => {
        const v = Number(input.value || 0);
        if (v > 0) entries.push({ pocUserId, date: input.dataset.date, tonnageTargetMT: v });
      });
    });
    if (!entries.length) { Toast.warn('Nothing entered', 'Add at least one daily target.'); return; }
    e.currentTarget.disabled = true;
    try {
      await Api.call('weeklyPlan.save', { cycleId: State.cycleId, entries });
      Toast.success('Weekly plan saved', entries.length + ' daily targets.');
      Overlay.closeModal();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      Toast.fromError(err);
    }
  };
}
</script>

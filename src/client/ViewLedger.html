<script>
/* ==========================================================================
   Three screens that complete the loop:
     · Account Performance — the generated replacement for OMP-Sellers/Buyers
     · Receivables         — the only input the Demand KRAs (DSO, DN%) need
     · My Reviews          — where a POC reads and acknowledges their review
   ========================================================================== */

/* ------------------------------------------------- account performance --- */
Router.register('account-performance', {
  skeleton: () => Components.tableSkeleton(10),
  async render(host) {
    if (!State.cycleId) { SetupView.renderNoCycle(host); return; }
    const accountType = State.params.accountType || 'SELLER';
    const data = await Api.call('report.accountPerformance', {
      cycleId: State.cycleId, accountType,
      pocUserId: State.isPoc() ? State.user.userId : (State.params.pocUserId || ''),
      regionId: State.params.regionId || '',
      materialType: State.params.materialType || ''
    });
    const t = data.totals;

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Account Performance',
        subtitle: `${data.rows.length} ${accountType === 'BUYER' ? 'buyer' : 'seller'} account(s) ·
          ${F.esc(data.cycleLabel)} · as of ${F.date(data.asOf)} — the generated replacement for
          the OMP-${accountType === 'BUYER' ? 'Buyers' : 'Sellers'} sheet`,
        actions: `
          <select class="select btn--sm" id="apType" style="width:auto">
            <option value="SELLER"${accountType === 'SELLER' ? ' selected' : ''}>Sellers</option>
            <option value="BUYER"${accountType === 'BUYER' ? ' selected' : ''}>Buyers</option>
          </select>
          <select class="select btn--sm" id="apMaterial" style="width:auto">
            <option value="">All materials</option>
            ${State.ref('materialTypes').map(m =>
              `<option value="${F.esc(m)}"${m === State.params.materialType ? ' selected' : ''}>${
                F.esc(m)}</option>`).join('')}
          </select>
          ${State.can('REPORT_EXPORT') ? `<button class="btn" id="apExport">Export</button>` : ''}`
      })}

      <div class="grid grid--3" style="margin-bottom:16px">
        ${Components.statTile({
          label: 'GMV', value: F.cr(t.gmvAchievedCr),
          sub: `of ${F.cr(t.gmvTargetCr)} target`,
          tone: F.tone(t.gmvTargetCr ? t.gmvAchievedCr / t.gmvTargetCr : 0)
        })}
        ${Components.statTile({
          label: 'Tonnage', value: F.mt(t.tonnageAchievedMT, 1),
          sub: `of ${F.mt(t.tonnageTargetMT, 0)} target`
        })}
        ${Components.statTile({
          label: 'Transactions', value: F.int(t.txnAchieved),
          sub: `of ${F.int(t.txnTarget)} target`
        })}
        ${Components.statTile({
          label: 'Accounts transacting',
          value: F.int(data.rows.filter(r => r.achieved.txnCount > 0).length),
          sub: `of ${data.rows.length} in the book`
        })}
      </div>

      ${Components.card({
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            {
              label: 'Account', format: r => `<span class="strong">${F.esc(r.accountName)}</span>
                <span class="cell-sub mono">${F.esc(r.gstin || '')}</span>`
            },
            {
              label: 'POC / Region', width: '150px',
              format: r => `${F.esc(r.pocName || '—')}<span class="cell-sub">${F.esc(r.regionName)}</span>`
            },
            { label: 'Material', width: '95px', format: r => F.esc(r.materialType || '—') },
            ...data.monthLabels.map((label, i) => ({
              label, align: 'right', width: '92px',
              format: r => {
                const m = r.monthly[i];
                return m.gmvCr
                  ? `<span class="tnum">${F.num(m.gmvCr, 2)}</span>
                     <span class="cell-sub">${F.num(m.tonnageMT, 0)} MT</span>`
                  : '<span class="faint">—</span>';
              }
            })),
            {
              label: 'Target', align: 'right', width: '120px',
              format: r => r.target.gmvTargetCr
                ? `<span class="tnum">${F.num(r.target.gmvTargetCr, 3)}</span>
                   <span class="cell-sub">${F.num(r.target.tonnageTargetMT, 0)} MT @ ₹${
                     F.num(r.target.ratePerKgTarget, 1)}</span>`
                : '<span class="faint">no plan</span>'
            },
            {
              label: 'Achieved', align: 'right', width: '130px',
              format: r => `<button class="linklike tnum strong" data-drill='${F.esc(JSON.stringify({
                metricKey: 'GMV_CR', cycleId: data.cycleId, gstin: r.gstin,
                stream: accountType === 'BUYER' ? 'DEMAND' : 'SUPPLY'
              }))}'>${F.num(r.achieved.gmvCr, 3)}</button>
                <span class="cell-sub">${F.num(r.achieved.tonnageMT, 1)} MT @ ₹${
                  F.num(r.achieved.ratePerKg, 1)}</span>`
            },
            {
              label: 'Ach %', align: 'right', width: '86px',
              format: r => r.target.gmvTargetCr
                ? Components.achievementCell(r.achievementPct.gmv) : '<span class="faint">—</span>'
            },
            {
              label: 'vs LMTD', align: 'right', width: '96px',
              format: r => Components.growthCell(r.growthPct.gmv)
            },
            {
              label: 'Blocker / remarks', format: r => `
                ${r.blockerReason ? Components.pill(r.blockerReason, 'warn') : ''}
                ${r.remarks ? `<span class="cell-sub">${F.esc(r.remarks)}</span>` : ''}
                ${r.detailedRemarks ? `<span class="cell-sub">${F.esc(r.detailedRemarks)}</span>` : ''}
                ${!r.blockerReason && !r.remarks ? '<span class="faint">—</span>' : ''}`
            }
          ],
          rows: data.rows,
          empty: 'No accounts in this book.',
          footer: data.rows.length ? `<tr>
            <td colspan="${3 + data.monthLabels.length}">Total — ${data.rows.length} account(s)</td>
            <td class="num">${F.num(t.gmvTargetCr, 3)}</td>
            <td class="num">${F.num(t.gmvAchievedCr, 3)}</td>
            <td class="num">${F.pct(t.gmvTargetCr ? t.gmvAchievedCr / t.gmvTargetCr : 0)}</td>
            <td colspan="2"></td>
          </tr>` : ''
        })
      })}

      <p class="faint" style="font-size:11.5px;margin-top:12px">
        Month-on-month, target-vs-achieved and growth columns are all computed from shipment
        records. Only the target block and the remarks are entered, under Monthly Plan →
        Account Plan.
      </p>`;

    Components.bindDrilldown(host);
    D.q('#apType', host).onchange = (e) =>
      Router.go('account-performance', { accountType: e.target.value });
    D.q('#apMaterial', host).onchange = (e) =>
      Router.go('account-performance', { accountType, materialType: e.target.value });
    const exp = D.q('#apExport', host);
    if (exp) exp.onclick = () =>
      runExport('ACCOUNT_PERFORMANCE', { cycleId: State.cycleId, accountType }, exp);
  }
});

/* ------------------------------------------------------------ receivables --- */
Router.register('receivables', {
  permission: 'PLAN_MANAGE',
  skeleton: () => Components.tableSkeleton(8),
  async render(host) {
    if (!State.cycleId) { SetupView.renderNoCycle(host); return; }
    const [rows, buyers] = await Promise.all([
      Api.call('receivable.list', { cycleId: State.cycleId }),
      Api.call('account.list', { category: State.category, accountType: 'BUYER' })
    ]);

    const totals = rows.reduce((t, r) => ({
      opening: t.opening + r.openingReceivableINR,
      closing: t.closing + r.closingReceivableINR,
      dn: t.dn + r.debitNoteINR,
      overdue: t.overdue + r.overdueINR
    }), { opening: 0, closing: 0, dn: 0, overdue: 0 });

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Receivables',
        subtitle: 'The only input the two Demand KPIs need — DSO Days and DN % of GMV are ' +
          'derived from these figures and the month\'s GMV',
        actions: `<button class="btn btn--primary" id="newRcv">＋ Record position</button>`
      })}

      ${Components.banner('info', 'How these become KPIs',
        '<b>DSO Days</b> = (average of opening and closing receivable ÷ GMV) × days in the month. ' +
        '<b>DN % of GMV</b> = debit notes ÷ GMV. Both are lower-is-better, so their rating bands ' +
        'descend — 15 days down to 2, and 1.3% down to 0.6%.')}

      <div class="grid grid--3" style="margin-bottom:16px">
        ${Components.statTile({ label: 'Opening receivable', value: F.inr(totals.opening) })}
        ${Components.statTile({ label: 'Closing receivable', value: F.inr(totals.closing) })}
        ${Components.statTile({
          label: 'Debit notes', value: F.inr(totals.dn), tone: totals.dn ? 'warn' : ''
        })}
        ${Components.statTile({
          label: 'Overdue', value: F.inr(totals.overdue), tone: totals.overdue ? 'bad' : 'good'
        })}
      </div>

      ${Components.card({
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            {
              label: 'Buyer', format: r => `<span class="strong">${F.esc(r.buyerName)}</span>
                <span class="cell-sub mono">${F.esc(r.buyerGstin)}</span>`
            },
            { label: 'POC', width: '150px', format: r => F.esc(r.pocName) },
            { label: 'As on', width: '110px', format: r => F.dateShort(r.asOnDate) },
            { label: 'Opening', align: 'right', format: r => F.inr(r.openingReceivableINR) },
            { label: 'Closing', align: 'right', format: r => F.inr(r.closingReceivableINR) },
            {
              label: 'Debit note', align: 'right',
              format: r => r.debitNoteINR
                ? `<span style="color:var(--warn);font-weight:600">${F.inr(r.debitNoteINR)}</span>`
                : '<span class="faint">—</span>'
            },
            {
              label: 'Overdue', align: 'right',
              format: r => r.overdueINR
                ? `<span style="color:var(--bad);font-weight:600">${F.inr(r.overdueINR)}</span>`
                : '<span class="faint">—</span>'
            },
            { label: 'Remarks', format: r => F.esc(r.remarks) },
            {
              label: '', width: '70px',
              format: r => `<button class="btn btn--sm" data-edit-rcv="${F.esc(r.receivableId)}">Edit</button>`
            }
          ],
          rows,
          empty: 'No receivable positions recorded for this cycle. ' +
            'DSO and DN% will read zero until they are.'
        })
      })}`;

    const openRcv = (row) => receivableModal(row, buyers);
    D.q('#newRcv', host).onclick = () => openRcv(null);
    D.on(host, 'click', '[data-edit-rcv]', (e, el) =>
      openRcv(rows.find(r => r.receivableId === el.dataset.editRcv)));
  }
});

function receivableModal(row, buyers) {
  Overlay.openModal({
    title: row ? 'Edit receivable position' : 'Record receivable position',
    body: `<form id="rcvForm">
      <input type="hidden" name="cycleId" value="${F.esc(State.cycleId)}">
      ${row ? `<input type="hidden" name="receivableId" value="${F.esc(row.receivableId)}">` : ''}
      <div class="formgrid">
        <div class="field formgrid--wide">
          <label class="field__label" for="f_accountId">Buyer <span class="req">*</span></label>
          <select class="select" id="f_accountId" name="accountId">
            <option value="">— Select buyer —</option>
            ${buyers.map(b => `<option value="${F.esc(b.accountId)}"${
              row && b.gstin === row.buyerGstin ? ' selected' : ''}>${
              F.esc(b.businessName)} · ${F.esc(b.gstin || 'no GSTIN')}</option>`).join('')}
          </select>
        </div>
        ${Components.field({
          name: 'asOnDate', label: 'As on', type: 'date', required: true,
          value: (row && row.asOnDate) || State.setting('asOf')
        })}
        ${Components.field({
          name: 'openingReceivableINR', label: 'Opening receivable (₹)', type: 'number',
          min: 0, step: 'any', value: (row && row.openingReceivableINR) || 0
        })}
        ${Components.field({
          name: 'closingReceivableINR', label: 'Closing receivable (₹)', type: 'number',
          min: 0, step: 'any', value: (row && row.closingReceivableINR) || 0
        })}
        ${Components.field({
          name: 'debitNoteINR', label: 'Debit notes (₹)', type: 'number',
          min: 0, step: 'any', value: (row && row.debitNoteINR) || 0,
          hint: 'Quality, weight or rate deductions raised this month.'
        })}
        ${Components.field({
          name: 'creditNoteINR', label: 'Credit notes (₹)', type: 'number',
          min: 0, step: 'any', value: (row && row.creditNoteINR) || 0
        })}
        ${Components.field({
          name: 'overdueINR', label: 'Overdue (₹)', type: 'number',
          min: 0, step: 'any', value: (row && row.overdueINR) || 0
        })}
        ${Components.field({
          name: 'remarks', label: 'Remarks', type: 'textarea', wide: true, rows: 2,
          value: (row && row.remarks) || ''
        })}
      </div>
    </form>`,
    footer: `<button class="btn" data-close-modal>Cancel</button>
             <button class="btn btn--primary" id="saveRcv">Save</button>`
  });

  D.q('#saveRcv').onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      await Api.call('receivable.save', D.formData(D.q('#rcvForm')));
      Toast.success('Receivable recorded', 'DSO and DN% now reflect it.');
      Overlay.closeModal();
      Router.render();
    } catch (err) {
      e.currentTarget.disabled = false;
      D.markInvalid(D.q('#rcvForm'), err.message);
    }
  };
}

/* ------------------------------------------------------------ my reviews --- */
Router.register('my-reviews', {
  skeleton: () => Components.tableSkeleton(5),
  async render(host) {
    const reviews = await Api.call('review.list', { subjectUserId: State.user.userId });
    const pending = reviews.filter(r => r.status === 'SHARED');

    host.innerHTML = `
      ${Components.pageHead({
        title: 'My Reviews',
        subtitle: 'Your performance reviews. The scorecard is frozen as it stood on the review date.'
      })}

      ${pending.length ? Components.banner('warn',
        `${pending.length} review(s) waiting for your acknowledgement`,
        'Read the assessment and add your response so it can be signed off.') : ''}

      ${reviews.length ? `<div class="stack">${reviews.map(r => Components.card({
        title: `${r.cycleId.replace('CYC-', '').replace(/-/g, ' ')} · ${F.date(r.reviewDate)}`,
        actions: `${Components.pill(F.titleCase(r.status), F.statusTone(r.status))}
                  ${Components.pill(r.ratingLabel, F.tone(r.overallAchievement))}`,
        body: `
          <div class="row" style="gap:20px;align-items:center;margin-bottom:14px">
            ${Components.progressRing(r.overallAchievement, 60)}
            <div>
              <div style="font-size:22px;font-weight:700" class="tnum">${F.pct(r.overallAchievement)}</div>
              <div class="muted" style="font-size:12.5px">
                Weighted score ${F.num(r.weightedScore, 1)} · rating ${r.rating} of 5</div>
            </div>
          </div>
          ${r.strengths ? `<div class="field">
            <div class="field__label">What went well</div><p>${F.esc(r.strengths)}</p></div>` : ''}
          ${r.gaps ? `<div class="field">
            <div class="field__label">Where the gap is</div><p>${F.esc(r.gaps)}</p></div>` : ''}
          ${r.leadershipNote ? `<div class="field">
            <div class="field__label">Leadership note</div><p>${F.esc(r.leadershipNote)}</p></div>` : ''}
          ${r.pocResponse ? `<div class="field">
            <div class="field__label">Your response</div><p>${F.esc(r.pocResponse)}</p></div>` : ''}
          ${r.status === 'SHARED' ? `
            <div class="field">
              <label class="field__label" for="resp_${F.esc(r.reviewId)}">Your response</label>
              <textarea class="textarea" id="resp_${F.esc(r.reviewId)}" rows="3"
                placeholder="Anything you want recorded alongside this review."></textarea>
            </div>
            <button class="btn btn--primary" data-ack="${F.esc(r.reviewId)}">Acknowledge</button>`
            : ''}`,
        foot: `Reviewed by ${F.esc(r.reviewedBy || '—')}${
          r.acknowledgedAt ? ' · acknowledged ' + F.dateTime(r.acknowledgedAt) : ''}`
      })).join('')}</div>`
        : Components.emptyState({
            icon: '★', title: 'No reviews yet',
            message: 'Your review appears here once your Team Lead shares it.'
          })}`;

    D.on(host, 'click', '[data-ack]', async (e, el) => {
      const id = el.dataset.ack;
      const response = (D.q('#resp_' + id, host) || {}).value || '';
      el.disabled = true;
      try {
        await Api.call('review.acknowledge', { reviewId: id, response });
        Toast.success('Acknowledged', 'Your response has been recorded.');
        Router.render();
      } catch (err) {
        el.disabled = false;
        Toast.fromError(err);
      }
    });
  }
});

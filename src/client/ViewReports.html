<script>
/* ==========================================================================
   Generated reports — daily review, scorecard, leaderboard, POC/Region
   performance and coverage. Nothing on these screens is ever typed.
   ========================================================================== */

/* ---------------------------------------------------------- daily review --- */
Router.register('daily-review', {
  skeleton: () => Components.tableSkeleton(10),
  async render(host) {
    if (!State.businessFunction().hasAccountPlan) { host.innerHTML = Components.notApplicable(); return; }
    if (!State.cycleId) { SetupView.renderNoCycle(host); return; }
    const stream = State.params.stream || State.stream;
    const dr = await Api.call('report.dailyReview', { cycleId: State.cycleId, stream });

    const gridTable = (metrics, scopeLabel) => Components.table({
      compact: true,
      columns: [
        { label: 'Metric', format: m => `<span class="strong">${F.esc(m.label)}</span>` },
        { label: 'Target', align: 'right', format: m => F.unit(m.target, m.unit) },
        {
          label: 'Achieved', align: 'right',
          format: m => `<button class="linklike tnum" data-drill='${F.esc(JSON.stringify(m.drill))}'
            >${F.unit(m.achieved, m.unit)}</button>`
        },
        { label: 'Ach %', align: 'right', format: m => Components.achievementCell(m.achievementPct) },
        {
          label: 'Current DRR', align: 'right',
          format: m => `<span class="tnum">${F.num(m.currentDrr, 2)}</span>`
        },
        {
          label: 'Required DRR', align: 'right', format: m => {
            const behind = m.requiredDrr > m.currentDrr;
            return `<span class="tnum ${behind ? '' : 'muted'}"
              ${behind ? 'style="color:var(--warn);font-weight:650"' : ''}>${F.num(m.requiredDrr, 2)}</span>`;
          }
        },
        { label: 'LMTD', align: 'right', format: m => `<span class="tnum">${F.unit(m.lmtd, m.unit)}</span>` },
        { label: 'MTD Growth', align: 'right', format: m => Components.growthCell(m.growthPct) },
        {
          label: 'Pace', width: '96px',
          format: m => Components.pill(F.paceLabel(m.paceStatus), F.paceTone(m.paceStatus))
        }
      ],
      rows: metrics
    });

    host.innerHTML = `
      ${Components.pageHead({
        title: dr.title,
        subtitle: `${F.esc(dr.asOfLabel)} · day ${dr.elapsedDays} of ${dr.daysInMonth},
          ${dr.remainingDays} remaining`,
        actions: `
          <select class="select btn--sm" id="drStream" style="width:auto">
            <option value="SUPPLY"${stream === 'SUPPLY' ? ' selected' : ''}>Supply (Sellers)</option>
            <option value="DEMAND"${stream === 'DEMAND' ? ' selected' : ''}>Demand (Buyers)</option>
          </select>
          ${State.can('REPORT_EXPORT') ? `<button class="btn" id="exportDR">Export</button>` : ''}
          <button class="btn" onclick="window.print()">Print</button>`
      })}

      ${Components.banner('info', 'Current DRR vs Required DRR',
        'Current DRR is the daily rate achieved so far. Required DRR is the rate needed each ' +
        'remaining day to reach the target. When required exceeds current, the gap is widening.')}

      ${Components.section({
        title: `${F.esc(dr.category)} — overall`,
        body: Components.card({ flush: true, body: gridTable(dr.overall) })
      })}

      ${dr.regions.map(r => Components.section({
        title: `${F.esc(r.regionName)}${r.rhName ? ' · ' + F.esc(r.rhName) : ''}`,
        hint: `${r.pocCount} POC(s)`,
        body: `
          ${Components.card({ flush: true, body: gridTable(r.metrics) })}
          <div style="height:10px"></div>
          <details>
            <summary style="cursor:pointer;padding:8px 2px;font-size:13px;color:var(--text-muted)">
              POC breakdown (${r.pocs.length})</summary>
            <div style="margin-top:10px" class="stack">
              ${r.pocs.map(p => Components.card({
                title: p.pocName, flush: true, body: gridTable(p.metrics)
              })).join('')}
            </div>
          </details>`
      })).join('')}

      <p class="faint" style="font-size:11.5px">Generated ${F.dateTime(dr.generatedAt)} —
        this replaces the manually maintained WhatsApp summary. Click any achieved figure to see
        the underlying operational records.</p>`;

    Components.bindDrilldown(host);
    D.q('#drStream', host).onchange = (e) => Router.go('daily-review', { stream: e.target.value });
    const exp = D.q('#exportDR', host);
    if (exp) exp.onclick = () => runExport('DAILY_REVIEW', { cycleId: State.cycleId, stream }, exp);
  }
});

/* -------------------------------------------------------------- scorecard --- */
Router.register('scorecard', {
  skeleton: () => Components.loading(3),
  async render(host) {
    if (!State.cycleId) { SetupView.renderNoCycle(host); return; }
    const pocUserId = State.params.pocUserId || State.user.userId;
    const card = await Api.call('report.scorecard', { cycleId: State.cycleId, pocUserId });

    const s = card.summary;
    const bySt = { SUPPLY: [], DEMAND: [] };
    card.kpis.forEach(k => (bySt[k.stream] || (bySt[k.stream] = [])).push(k));

    const kpiTable = (rows) => Components.table({
      columns: [
        {
          label: 'KRA / KPI', format: k => `<span class="strong">${F.esc(k.kpiName)}</span>
            <span class="cell-sub">${F.esc(k.kraName)}</span>`
        },
        { label: 'Weight', align: 'right', width: '76px', format: k => F.num(k.weightage, 0) + '%' },
        {
          label: 'Target', align: 'right', width: '128px',
          format: k => `<span class="tnum">${F.unit(k.evaluation.target, k.unit)}</span>
            <span class="cell-sub" title="${F.esc(k.targetDetail)}">${F.esc(k.targetDetail)}</span>`
        },
        {
          label: 'Actual', align: 'right', width: '110px',
          format: k => `<button class="linklike tnum" data-drill='${F.esc(JSON.stringify(k.drill))}'
            >${F.unit(k.evaluation.actual, k.unit)}</button>`
        },
        {
          label: 'Ach %', align: 'right', width: '86px',
          format: k => Components.achievementCell(k.evaluation.achievement)
        },
        {
          label: 'Weighted', align: 'right', width: '96px',
          format: k => `<span class="tnum strong">${F.num(k.evaluation.weightedScore, 2)}</span>
            <span class="cell-sub">of ${F.num(k.evaluation.maxWeightedScore, 1)}</span>`
        },
        {
          label: 'Status', width: '116px',
          format: k => `${Components.pill(k.evaluation.bandLabel, F.tone(k.evaluation.achievement))}
            <span class="cell-sub">${F.esc(k.evaluation.ratingLabel)}</span>`
        },
        {
          label: 'Pace', width: '150px', format: k => `
            ${Components.pill(F.paceLabel(k.evaluation.paceStatus), F.paceTone(k.evaluation.paceStatus))}
            <span class="cell-sub tnum">now ${F.num(k.evaluation.currentDrr, 2)}/d ·
              need ${F.num(k.evaluation.requiredDrr, 2)}/d</span>`
        },
        {
          label: 'vs LMTD', align: 'right', width: '92px',
          format: k => Components.growthCell(k.evaluation.growthPct)
        }
      ],
      rows,
      footer: `<tr>
        <td>Total</td>
        <td class="num">${F.num(rows.reduce((a, k) => a + k.weightage, 0), 0)}%</td>
        <td colspan="3"></td>
        <td class="num">${F.num(rows.reduce((a, k) => a + k.evaluation.weightedScore, 0), 2)}</td>
        <td colspan="3"></td>
      </tr>`
    });

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Scorecard',
        subtitle: `${F.esc(card.poc.fullName)} · ${F.esc(card.cycleLabel)} · as of ${F.date(card.asOf)}`,
        actions: `
          ${State.can('SCORECARD_VIEW_ALL') ? `
            <select class="select btn--sm" id="scPoc" style="width:auto">
              ${State.ref('users').filter(u => u.active).map(u =>
                `<option value="${F.esc(u.userId)}"${u.userId === pocUserId ? ' selected' : ''}>${
                  F.esc(u.fullName)}</option>`).join('')}
            </select>` : ''}
          ${State.can('REPORT_EXPORT') ? `<button class="btn" id="exportSC">Export</button>` : ''}
          <button class="btn" onclick="window.print()">Print</button>`
      })}

      ${s.weightageValid ? '' : Components.banner('warn', 'Weightage does not total 100%',
        `This scorecard carries ${F.num(s.totalWeightage, 1)}% of weightage. The overall figure is ` +
        `divided by the actual total, so it remains meaningful — but the plan should be corrected.`)}

      <div class="card card--pad" style="margin-bottom:18px">
        <div class="row" style="gap:24px;align-items:center">
          ${Components.progressRing(s.overallAchievement, 84)}
          <div>
            <div style="font-size:32px;font-weight:700" class="tnum">${F.pct(s.overallAchievement)}</div>
            <div class="row" style="gap:8px;margin-top:4px">
              ${Components.pill(s.ratingLabel, s.tone)}
              ${Components.pill('Rating ' + s.rating + ' of 5', '')}
            </div>
          </div>
          <div style="flex:1;min-width:220px">
            <div class="muted" style="font-size:12.5px">Weighted score</div>
            <div style="font-size:20px;font-weight:650" class="tnum">
              ${F.num(s.weightedScore, 2)} <span class="muted" style="font-size:14px">
                of ${F.num(s.maxWeightedScore, 0)}</span></div>
            <div class="muted" style="font-size:12.5px;margin-top:6px">
              ${s.kpiCount} KPI(s) · day ${s.elapsedDays} of ${s.daysInMonth} ·
              ${s.remainingDays} day(s) remaining</div>
          </div>
        </div>
      </div>

      ${bySt.SUPPLY && bySt.SUPPLY.length ? Components.section({
        title: 'Supply — Sellers',
        body: Components.card({ flush: true, body: kpiTable(bySt.SUPPLY) })
      }) : ''}
      ${bySt.DEMAND && bySt.DEMAND.length ? Components.section({
        title: 'Demand — Buyers',
        body: Components.card({ flush: true, body: kpiTable(bySt.DEMAND) })
      }) : ''}

      ${!card.kpis.length ? Components.emptyState({
        title: 'No KPIs assigned',
        message: 'Ask your Team Lead to assign the KRA set for this cycle.'
      }) : ''}

      <p class="faint" style="font-size:11.5px">
        Weighted score = MIN(achievement, ${F.pct(State.setting('achievementCap'), 0)}) × weightage,
        summed. Overall achievement = weighted score ÷ total weightage, capped at
        ${F.pct(State.setting('achievementCap'), 0)}. Click any actual to trace it to source records.
      </p>`;

    Components.bindDrilldown(host);
    const sel = D.q('#scPoc', host);
    if (sel) sel.onchange = (e) => Router.go('scorecard', { pocUserId: e.target.value });
    const exp = D.q('#exportSC', host);
    if (exp) exp.onclick = () => runExport('SCORECARD', { cycleId: State.cycleId, pocUserId }, exp);
  }
});

/* ------------------------------------------------------------ leaderboard --- */
Router.register('leaderboard', {
  permission: 'SCORECARD_VIEW_ALL',
  skeleton: () => Components.tableSkeleton(10),
  async render(host) {
    if (!State.cycleId) { SetupView.renderNoCycle(host); return; }
    const board = await Api.call('report.leaderboard', { cycleId: State.cycleId });

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Scorecard Leaderboard',
        subtitle: `${F.esc(board.cycleLabel)} · as of ${F.date(board.asOf)} ·
          team average ${F.pct(board.teamAverage)}`,
        actions: State.can('REPORT_EXPORT')
          ? `<button class="btn" id="exportLB">Export</button>` : ''
      })}

      ${Components.card({
        flush: true,
        body: Components.table({
          clickable: true,
          rowAttrs: r => `data-poc="${F.esc(r.pocUserId)}"`,
          columns: [
            {
              label: '#', width: '48px',
              format: r => `<span class="strong" style="font-size:15px">${r.rank}</span>`
            },
            {
              label: 'POC', format: r => `<span class="strong">${F.esc(r.pocName)}</span>
                <span class="cell-sub">${F.esc(r.regionName)}</span>`
            },
            {
              label: 'Overall', align: 'right', width: '160px', format: r => `
                <div class="row" style="justify-content:flex-end;gap:8px">
                  <span class="tnum strong" style="font-size:15px">${F.pct(r.overallAchievement)}</span>
                  ${Components.pill(r.ratingLabel, r.tone)}
                </div>
                <div class="meter" style="margin-top:5px">
                  <div class="meter__fill" data-tone="${r.tone}"
                       style="width:${Math.min(100, r.overallAchievement * 100).toFixed(1)}%"></div>
                </div>`
            },
            {
              label: 'Weighted score', align: 'right', width: '116px',
              format: r => `<span class="tnum">${F.num(r.weightedScore, 1)}</span>
                <span class="cell-sub">of 105</span>`
            },
            {
              label: 'GMV', align: 'right', width: '140px', format: r => {
                const m = r.metrics.GMV_CR;
                return m ? Components.tva(m.target, m.actual, 'CR') : '<span class="faint">—</span>';
              }
            },
            {
              label: 'Onboarding', align: 'right', width: '130px', format: r => {
                const m = r.metrics.SELLER_ONBOARDED;
                return m ? Components.tva(m.target, m.actual, 'COUNT', 0) : '<span class="faint">—</span>';
              }
            },
            {
              label: 'KPI health', width: '150px', format: r => `
                ${Components.pill(r.onPace + ' on pace', 'good')}
                ${r.atRisk ? Components.pill(r.atRisk + ' at risk', 'warn') : ''}`
            }
          ],
          rows: board.rows,
          empty: 'No POCs have been assigned KPIs for this cycle.'
        })
      })}

      <p class="faint" style="font-size:11.5px">
        Ranking uses competition ordering — tied scores share a rank and the next rank is skipped,
        matching the original scorecard.
      </p>`;

    D.on(host, 'click', '[data-poc]', (e, el) =>
      Router.go('scorecard', { pocUserId: el.dataset.poc }));
    const exp = D.q('#exportLB', host);
    if (exp) exp.onclick = () => runExport('LEADERBOARD', { cycleId: State.cycleId }, exp);
  }
});

/* --------------------------------------------------- POC / Region tables --- */
Router.register('performance', {
  skeleton: () => Components.tableSkeleton(10),
  async render(host) {
    if (!State.businessFunction().hasAccountPlan) { host.innerHTML = Components.notApplicable(); return; }
    if (!State.cycleId) { SetupView.renderNoCycle(host); return; }
    const level = State.params.level || 'poc';
    const stream = State.params.stream || State.stream;
    const params = { cycleId: State.cycleId, stream };

    const data = level === 'region'
      ? await Api.call('report.regionWise', params)
      : await Api.call('report.pocWise', params);

    host.innerHTML = `
      ${Components.pageHead({
        title: level === 'region' ? 'Region Performance' : 'POC Performance',
        subtitle: `${F.esc(data.cycleLabel)} · as of ${F.date(data.asOf)} ·
          generated from operational records`,
        actions: `
          <select class="select btn--sm" id="pfStream" style="width:auto">
            <option value="SUPPLY"${stream === 'SUPPLY' ? ' selected' : ''}>Supply</option>
            <option value="DEMAND"${stream === 'DEMAND' ? ' selected' : ''}>Demand</option>
          </select>
          ${State.can('REPORT_EXPORT') ? `<button class="btn" id="exportPF">Export</button>` : ''}`
      })}

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-level="poc" aria-selected="${level === 'poc'}">By POC</button>
        <button class="tab" role="tab" data-level="region" aria-selected="${level === 'region'}">By Region</button>
      </div>

      ${level === 'region' ? regionTable(data) : pocTable(data)}

      ${level === 'poc' ? Components.section({
        title: 'Material split',
        hint: 'Target vs achieved tonnage by material type',
        body: Components.card({
          flush: true,
          body: Components.table({
            compact: true,
            columns: [{ label: 'POC', format: r => F.esc(r.pocName) }].concat(
              (data.rows[0] ? data.rows[0].materials : []).map((m, i) => ({
                label: m.materialType, align: 'right',
                format: r => {
                  const x = r.materials[i];
                  return x.tonnageTargetMT || x.tonnageAchievedMT
                    ? Components.tva(x.tonnageTargetMT, x.tonnageAchievedMT, 'MT', 1)
                    : '<span class="faint">—</span>';
                }
              }))),
            rows: data.rows,
            empty: 'No material split available.'
          })
        })
      }) : ''}`;

    Components.bindDrilldown(host);
    D.on(host, 'click', '[data-level]', (e, el) =>
      Router.go('performance', { level: el.dataset.level, stream }));
    D.q('#pfStream', host).onchange = (e) =>
      Router.go('performance', { level, stream: e.target.value });
    const exp = D.q('#exportPF', host);
    if (exp) exp.onclick = () =>
      runExport(level === 'region' ? 'REGION_WISE' : 'POC_WISE', params, exp);
  }
});

function pocTable(data) {
  const t = data.totals;
  return Components.card({
    flush: true,
    body: Components.table({
      compact: true,
      columns: [
        {
          label: 'POC', format: r => `<span class="strong">${F.esc(r.pocName)}</span>
            <span class="cell-sub">${F.esc(r.regionName)}${r.rhName ? ' · ' + F.esc(r.rhName) : ''}</span>`
        },
        {
          label: 'Annual plan', align: 'right', width: '110px',
          format: r => `<span class="tnum">${F.int(r.onboarding.fytdOnboarded)}</span>
            <span class="cell-sub">of ${F.int(r.onboarding.annualPlan)} ·
              ${F.pct(r.onboarding.annualAchievementPct, 0)}</span>`
        },
        {
          label: 'Balance', align: 'right', width: '80px',
          format: r => F.int(r.onboarding.balanceToDo)
        },
        {
          label: 'Onboarding MTD', align: 'right', width: '130px',
          format: r => `<button class="linklike tnum" data-drill='${F.esc(JSON.stringify({
            metricKey: 'SELLER_ONBOARDED', cycleId: data.cycleId, pocUserId: r.pocUserId
          }))}'>${F.int(r.onboarding.mtdOnboarded)}</button>
            <span class="cell-sub">of ${F.int(r.onboarding.monthlyTarget)} ·
              ${F.pct(r.onboarding.monthlyAchievementPct, 0)}</span>`
        },
        {
          label: 'Transactions', align: 'right', width: '120px',
          format: r => `<button class="linklike tnum" data-drill='${F.esc(JSON.stringify({
            metricKey: 'TXN_COUNT', cycleId: data.cycleId, pocUserId: r.pocUserId, stream: data.stream
          }))}'>${F.int(r.mtd.txnAchieved)}</button>
            <span class="cell-sub">of ${F.int(r.mtd.txnTarget)} · ${F.pct(r.mtd.txnAchievementPct, 0)}</span>`
        },
        {
          label: 'Tonnage', align: 'right', width: '140px',
          format: r => `<button class="linklike tnum" data-drill='${F.esc(JSON.stringify({
            metricKey: 'TONNAGE_MT', cycleId: data.cycleId, pocUserId: r.pocUserId, stream: data.stream
          }))}'>${F.num(r.mtd.tonnageAchievedMT, 1)}</button>
            <span class="cell-sub">of ${F.num(r.mtd.tonnageTargetMT, 0)} ·
              ${F.pct(r.mtd.tonnageAchievementPct, 0)}</span>`
        },
        {
          label: 'GMV (Cr)', align: 'right', width: '150px',
          format: r => `<button class="linklike tnum strong" data-drill='${F.esc(JSON.stringify({
            metricKey: 'GMV_CR', cycleId: data.cycleId, pocUserId: r.pocUserId, stream: data.stream
          }))}'>${F.num(r.mtd.gmvAchievedCr, 3)}</button>
            <span class="cell-sub">of ${F.num(r.mtd.gmvTargetCr, 2)}</span>
            ${Components.achievementCell(r.mtd.gmvAchievementPct)}`
        },
        { label: '₹/kg', align: 'right', width: '76px', format: r => F.num(r.mtd.ratePerKg, 1) },
        {
          label: 'GMV vs LMTD', align: 'right', width: '110px',
          format: r => `${Components.growthCell(r.growth.gmvPct)}
            <span class="cell-sub tnum">${F.num(r.lmtd.gmvCr, 2)} Cr</span>`
        },
        {
          label: 'FYTD GMV', align: 'right', width: '96px',
          format: r => `<span class="tnum">${F.num(r.fytd.gmvCr, 2)}</span>`
        }
      ],
      rows: data.rows,
      empty: 'No POCs assigned for this cycle.',
      footer: data.rows.length ? `<tr>
        <td>Total — ${data.rows.length} POC(s)</td>
        <td class="num">${F.int(t.fytdOnboarded)} / ${F.int(t.annualPlan)}</td>
        <td class="num">${F.int(t.balanceToDo)}</td>
        <td class="num">${F.int(t.mtdOnboarded)} / ${F.int(t.monthlyTarget)}</td>
        <td class="num">${F.int(t.txnAchieved)} / ${F.int(t.txnTarget)}</td>
        <td class="num">${F.num(t.tonnageAchievedMT, 1)} / ${F.num(t.tonnageTargetMT, 0)}</td>
        <td class="num">${F.num(t.gmvAchievedCr, 3)} / ${F.num(t.gmvTargetCr, 2)}
          <span class="cell-sub">${F.pct(t.gmvAchievementPct, 0)}</span></td>
        <td class="num">—</td>
        <td class="num">${F.signedPct(t.gmvGrowthPct, 0)}</td>
        <td class="num">—</td>
      </tr>` : ''
    })
  });
}

function regionTable(data) {
  const t = data.totals;
  return Components.card({
    flush: true,
    body: Components.table({
      columns: [
        {
          label: 'Region', format: r => `<span class="strong">${F.esc(r.regionName)}</span>
            <span class="cell-sub">${F.esc(r.rhName || '')} · ${r.pocCount} POC(s)</span>`
        },
        {
          label: 'Onboarding MTD', align: 'right',
          format: r => `<span class="tnum">${F.int(r.totals.mtdOnboarded)}</span>
            <span class="cell-sub">of ${F.int(r.totals.monthlyTarget)}</span>`
        },
        {
          label: 'Transactions', align: 'right',
          format: r => Components.tva(r.totals.txnTarget, r.totals.txnAchieved, 'COUNT', 0)
        },
        {
          label: 'Tonnage', align: 'right',
          format: r => Components.tva(r.totals.tonnageTargetMT, r.totals.tonnageAchievedMT, 'MT', 1)
        },
        {
          label: 'GMV', align: 'right',
          format: r => `<button class="linklike tnum strong" data-drill='${F.esc(JSON.stringify({
            metricKey: 'GMV_CR', cycleId: data.cycleId, regionId: r.regionId, stream: data.stream
          }))}'>${F.cr(r.totals.gmvAchievedCr, 3)}</button>
            <span class="cell-sub">of ${F.cr(r.totals.gmvTargetCr, 2)}</span>
            ${Components.achievementCell(r.totals.gmvAchievementPct)}`
        },
        { label: 'vs LMTD', align: 'right', format: r => Components.growthCell(r.totals.gmvGrowthPct) },
        {
          label: 'Top contributors', format: r => r.pocs
            .slice().sort((a, b) => b.gmvAchievedCr - a.gmvAchievedCr).slice(0, 3)
            .map(p => `<span class="cell-sub">${F.esc(p.pocName)} — ${F.cr(p.gmvAchievedCr, 2)}</span>`)
            .join('')
        }
      ],
      rows: data.rows,
      empty: 'No regional data yet.',
      footer: data.rows.length ? `<tr>
        <td>All regions</td>
        <td class="num">${F.int(t.mtdOnboarded)} / ${F.int(t.monthlyTarget)}</td>
        <td class="num">${F.int(t.txnAchieved)} / ${F.int(t.txnTarget)}</td>
        <td class="num">${F.num(t.tonnageAchievedMT, 1)} / ${F.num(t.tonnageTargetMT, 0)}</td>
        <td class="num">${F.cr(t.gmvAchievedCr, 3)} / ${F.cr(t.gmvTargetCr, 2)}</td>
        <td class="num">${F.signedPct(t.gmvGrowthPct, 0)}</td>
        <td></td>
      </tr>` : ''
    })
  });
}

/* --------------------------------------------------------------- coverage --- */
Router.register('coverage', {
  skeleton: () => Components.tableSkeleton(10),
  async render(host) {
    if (!State.businessFunction().hasAccountPlan) { host.innerHTML = Components.notApplicable(); return; }
    if (!State.cycleId) { SetupView.renderNoCycle(host); return; }
    const accountType = State.params.accountType || 'SELLER';
    const cov = await Api.call('report.coverage', { cycleId: State.cycleId, accountType });
    const s = cov.summary;

    host.innerHTML = `
      ${Components.pageHead({
        title: 'Coverage',
        subtitle: `Are the accounts we onboarded actually being serviced? ·
          ${F.esc(cov.cycleLabel)} · as of ${F.date(cov.asOf)}`,
        actions: `
          <select class="select btn--sm" id="covType" style="width:auto">
            <option value="SELLER"${accountType === 'SELLER' ? ' selected' : ''}>Sellers</option>
            <option value="BUYER"${accountType === 'BUYER' ? ' selected' : ''}>Buyers</option>
          </select>`
      })}

      <div class="grid grid--tiles" style="margin-bottom:18px">
        ${Components.statTile({ label: 'Onboarded accounts', value: F.int(s.onboardedCount) })}
        ${Components.statTile({
          label: 'Visited this month', value: F.int(s.visitedCount),
          sub: F.pct(s.visitCoveragePct) + ' coverage', tone: F.tone(s.visitCoveragePct)
        })}
        ${Components.statTile({
          label: 'Transacted this month', value: F.int(s.transactedCount),
          sub: F.pct(s.txnCoveragePct) + ' coverage',
          tone: F.tone(s.txnCoveragePct)
        })}
        ${Components.statTile({
          label: 'Neither visited nor transacted', value: F.int(s.neitherCount),
          tone: s.neitherCount ? 'bad' : 'good', sub: 'Completely untouched this cycle'
        })}
      </div>

      ${Components.card({
        flush: true,
        body: Components.table({
          compact: true,
          columns: [
            {
              label: 'Account', format: r => `<span class="strong">${F.esc(r.businessName)}</span>
                <span class="cell-sub mono">${F.esc(r.gstin || '')}</span>`
            },
            { label: 'POC', width: '140px', format: r => F.esc(r.pocName) },
            { label: 'Region', width: '100px', format: r => F.esc(r.regionName) },
            {
              label: 'Status', width: '110px',
              format: r => Components.pill(F.titleCase(r.onboardingStatus), F.statusTone(r.onboardingStatus))
            },
            { label: 'Onboarded', width: '110px', format: r => F.dateShort(r.onboardedDate) },
            {
              label: 'Visits MTD', align: 'right', width: '96px',
              format: r => `<span class="tnum ${r.mtdVisits ? '' : 'faint'}">${F.int(r.mtdVisits)}</span>
                <span class="cell-sub">LMTD ${F.int(r.lmtdVisits)}</span>`
            },
            { label: 'Last visit', width: '110px', format: r => r.lastVisitDate ? F.relative(r.lastVisitDate) : '<span class="faint">Never</span>' },
            {
              label: 'Txns MTD', align: 'right', width: '86px',
              format: r => `<span class="tnum ${r.mtdTxns ? '' : 'faint'}">${F.int(r.mtdTxns)}</span>`
            },
            {
              label: 'Coverage', width: '150px', format: r => {
                if (r.transacted) return Components.pill('Transacting', 'good');
                if (r.visited) return Components.pill('Visited, no txn', 'warn');
                return Components.pill('Untouched', 'bad');
              }
            }
          ],
          rows: cov.rows,
          empty: 'No accounts to report on.'
        })
      })}`;

    D.q('#covType', host).onchange = (e) =>
      Router.go('coverage', { accountType: e.target.value });
  }
});
</script>

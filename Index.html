<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recykal · KRA / KPI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== Recykal brand system — Poppins (display) + Inter (data) ===== */
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-display:'Poppins','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  /* brand — Bright Blue is the single interactive accent; purple completes the gradient */
  --brand:#005DFF;--brand-2:#8460D4;--brand-soft:#EAF1FF;--brand-ink:#0048C7;
  --brand-grad:linear-gradient(135deg,#005DFF,#8460D4);
  --cta:#005DFF;--info:#567DE8;
  /* ink + cool, blue-tinted neutrals */
  --ink:#0C1A33;--ink-2:#47566E;--muted:#77859B;--faint:#A9B4C6;
  --line:#E5EAF2;--line-2:#D2DAE7;--line-soft:#EFF3F9;--bg:#FBFCFE;--card:#FFFFFF;--surface-2:#F5F8FD;--surface-3:#EAF0F8;
  /* status — green is on-brand (sustainability); amber/red are restrained functional signals */
  --good:#049769;--good-soft:#E3F5EE;--good-ink:#03794F;
  --warn:#C57A00;--warn-soft:#FBF0DA;--warn-ink:#98600A;
  --bad:#E5484D;--bad-soft:#FCEBEC;--bad-ink:#C42B30;
  --none:#C3CDDC;--none-soft:#F2F6FB;
  /* ===== Pastel grounds =====
     Each is a guideline primary lifted to ~95% luminance, so every tint is the
     brand's own hue rather than an invented one. Hue keeps a job — periwinkle
     = people, blue = the core metric, violet = process, mint = coverage,
     amber/rose = risk — so colour still reads as meaning, not decoration. */
  --p-peri:#ECF1FD;--p-peri-bd:#D3DEF9;      /* Periwinkle   #567DE8 */
  --p-blue:#E9F0FF;--p-blue-bd:#CCDEFF;      /* Bright Blue  #005DFF */
  --p-violet:#F3EDFD;--p-violet-bd:#E0D3F8;  /* Med Purple   #8460D4 */
  --p-mint:#E2F7F1;--p-mint-bd:#C1ECDF;      /* Bright Green #1DC797 */
  --p-green:#E5F5EC;--p-green-bd:#C5E9D5;    /* Duke Green   #049769 */
  --p-amber:#FCF3E2;--p-amber-bd:#F0DDB4;
  --p-rose:#FDEDEE;--p-rose-bd:#F6D3D5;
  /* bar ramp — red → amber → duke green → bright green → brand blue (best) */
  --bar-bad:#E5484D;--bar-warn:#C57A00;--bar-good:#049769;--bar-strong:#1DC797;--bar-elite:#005DFF;
  --shadow-xs:0 1px 1px rgba(12,26,51,.03);
  --shadow:0 1px 2px rgba(12,26,51,.05),0 12px 28px -18px rgba(12,26,51,.22);
  --shadow-lg:0 28px 64px -28px rgba(12,26,51,.30);
  --r-lg:18px;--r-md:14px;--sbw:246px;--ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:'tnum' 1,'calt' 1,'cv11' 1;letter-spacing:-.011em}
button,input,select{font-family:inherit}a{color:inherit;text-decoration:none}
/* Poppins carries brand personality on the logo, titles and headline figures;
   Inter keeps tables, meta and dense tabular numbers crisp. */
.wordmark,.page-head h1,.dash-head h1,.person-hd h1,.state h2,.hero-fig,.kc-value,.exp-pt,.dcard h3,.lead-tile .lt-name{font-family:var(--font-display);letter-spacing:-.02em}
.page-head h1,.dash-head h1{letter-spacing:-.022em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:5px}
::selection{background:rgba(0,0,0,.10)}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:#D4DAE3;border-radius:20px;border:3px solid var(--bg);background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:#BFC7D2}

.app{min-height:100vh;display:flex}

/* ===================== SIDEBAR =====================
   Persistent left rail: brand → grouped modules → identity.
   A single sliding indicator (.nav-rail) tracks the active module. */
/* Chrome sits back on a tinted ground so the white content plane advances —
   the flat white-on-white was what made the whole thing read as lifeless. */
.sidebar{width:var(--sbw);flex:0 0 var(--sbw);height:100vh;position:sticky;top:0;background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:45;transition:width .26s var(--ease),flex-basis .26s var(--ease)}
.sb-head{display:flex;align-items:center;gap:9px;padding:0 14px;height:56px;flex:0 0 56px;border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1;cursor:pointer}
.brand .logo{flex:0 0 auto;display:grid;place-items:center}
.brand .logo svg{width:26px;height:26px;display:block}
.wordmark{font-weight:700;font-size:16.5px;letter-spacing:.01em;color:var(--ink);white-space:nowrap;overflow:hidden}
/* The collapse control lives with identity at the foot, so it is reachable in
   both states — a rail with no way out is a trap. */
.sb-collapse{display:flex;align-items:center;gap:11px;width:100%;border:none;background:transparent;color:var(--muted);padding:8px 12px;border-radius:10px;cursor:pointer;font-size:12.5px;font-weight:600;margin-bottom:6px;transition:.15s;font-family:inherit}
.sb-collapse:hover{background:var(--surface-2);color:var(--ink-2)}
.sb-collapse svg{width:16px;height:16px;flex:0 0 16px;transition:transform .26s var(--ease)}
.sb-nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 10px 14px;position:relative}
.sb-nav::-webkit-scrollbar{width:6px}.sb-nav::-webkit-scrollbar-thumb{border:none;background:var(--line-2)}
.sb-gt{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:0 12px;margin:16px 0 6px;white-space:nowrap;overflow:hidden}
.sb-group:first-of-type .sb-gt{margin-top:6px}
/* Setup collapses out of the way; the chevron is the only affordance needed. */
button.sb-gt{display:flex;align-items:center;gap:6px;width:100%;background:transparent;border:none;cursor:pointer;font-family:inherit;border-radius:7px;padding:5px 12px;margin:16px 0 4px;transition:color .15s}
button.sb-gt:hover{color:var(--muted)}
button.sb-gt .cv{width:11px;height:11px;margin-left:auto;transition:transform .22s var(--ease);opacity:.8}
button.sb-gt.open .cv{transform:rotate(180deg)}
.sb-group.collapsed .sb-items{display:none}
/* the rail that slides between modules — ReactBits "Line Sidebar" idea */
.nav-rail{position:absolute;left:10px;width:3px;border-radius:3px;background:var(--brand);opacity:0;transition:transform .28s var(--ease),height .28s var(--ease),opacity .2s;pointer-events:none;will-change:transform}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;position:relative;color:var(--ink-2);font-weight:550;cursor:pointer;font-size:13.5px;letter-spacing:-.006em;white-space:nowrap;transition:background .16s var(--ease),color .16s var(--ease)}
.nav-item svg{display:block;width:17px;height:17px;flex:0 0 17px;opacity:.62;transition:.16s}
.nav-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item:hover svg{opacity:.9}
.nav-item.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:650}
.nav-item.active svg{opacity:1;color:var(--brand)}
.nav-item .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--surface-3);color:var(--ink-2);border-radius:20px;padding:1px 7px;flex:0 0 auto}
.nav-item.active .badge{background:#fff;color:var(--brand-ink)}
.sb-foot{flex:0 0 auto;border-top:1px solid var(--line-soft);padding:10px}
/* collapsed icon rail */
.app.rail{--sbw:68px}
.app.rail .wordmark,.app.rail .sb-gt,.app.rail .nav-item .lbl,.app.rail .nav-item .badge,.app.rail .userchip .u-meta{display:none}
.app.rail .sb-head{padding:0;justify-content:center}
.app.rail .brand{flex:0 0 auto;justify-content:center}
.app.rail .sb-collapse{justify-content:center;padding:8px 0}
.app.rail .sb-collapse .lbl{display:none}
.app.rail .sb-collapse svg{transform:rotate(180deg)}
.app.rail .sb-group+.sb-group{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
/* no headers in rail mode, so a collapsed section would be unreachable */
.app.rail .sb-group.collapsed .sb-items{display:block}
.app.rail .nav-item{justify-content:center;padding:10px 0}
.app.rail .userchip{justify-content:center;padding:5px}
.app.rail .nav-rail{left:5px}

/* ===================== MAIN COLUMN ===================== */
.app-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:38;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);min-height:56px;display:flex;align-items:center;gap:12px;padding:0 26px}
.tn-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;margin-left:auto}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:.15s}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}.icon-btn svg{width:16px;height:16px}
.userchip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:24px;background:#fff;cursor:pointer;transition:.15s;min-width:0}
.userchip:hover{border-color:var(--brand)}
.userchip.active{border-color:transparent;background:var(--brand)}.userchip.active .u-name{color:#fff}.userchip.active .u-sub{color:rgba(255,255,255,.72)}.userchip.active .avatar{background:#fff;color:var(--brand)}
.avatar{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--brand-grad);color:#fff;font-weight:600;font-size:11px;display:grid;place-items:center}
.userchip .u-meta{min-width:0}
.userchip .u-name{font-size:12.5px;font-weight:600;line-height:1.15;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userchip .u-sub{font-size:10.5px;color:var(--muted);white-space:nowrap}
.main-scroll{flex:1;min-height:0}
.crumbs{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;flex-wrap:wrap;padding:9px 0}
.crumbs b{color:var(--ink);font-weight:600}.crumbs .sep{color:var(--faint)}.crumbs .c-link{cursor:pointer}.crumbs .c-link:hover{color:var(--ink)}
.spacer{flex:1}
.updated{font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.updated .dot{width:6px;height:6px;border-radius:50%;background:var(--good)}
.sb-scrim{display:none}

.filterbar{max-width:1360px;margin:16px auto 0;width:100%;padding:0 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.selectwrap{position:relative}
.pill-select{appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 30px 8px 12px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;outline:none;transition:.15s;max-width:240px}
.pill-select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.selectwrap::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.fsearch{position:relative;flex:0 1 230px}
.fsearch input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px 8px 32px;font-size:12.5px;color:var(--ink);outline:none;transition:.15s}
.fsearch input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint)}
.fseg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.fseg button{border:none;background:transparent;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s}
.fseg button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;background:var(--brand-soft);color:var(--brand-ink);border-radius:20px;padding:4px 6px 4px 11px}
.chip b{font-weight:700}.chip button{border:none;background:rgba(0,0,0,.08);color:var(--ink);width:16px;height:16px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center}
.clear-all{font-size:12px;font-weight:650;color:var(--muted);cursor:pointer;padding:4px 6px}.clear-all:hover{color:var(--bad-ink)}

.content{padding:32px 32px 80px;max-width:1360px;width:100%;margin:0 auto}
.page-head{margin-bottom:16px}
.page-head{margin-bottom:24px}
.page-head h1{font-size:32px;font-weight:600;letter-spacing:-.03em;margin:0 0 6px;line-height:1.1}
.page-head p{margin:0;color:var(--ink-2);font-size:15px;max-width:760px;line-height:1.55}
.sect-t{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.sect-t .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted)}
.q{font-size:12px;color:var(--muted);font-weight:500;font-style:italic;margin:-4px 0 10px}

.banner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);margin-bottom:16px}
.banner.warn{border-color:var(--line-2);background:var(--surface-3)}
.banner .bi{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:#fff;display:grid;place-items:center;color:var(--brand);box-shadow:var(--shadow-xs)}
.banner.warn .bi{color:var(--warn-ink)}
.banner .bt{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.banner .bs{font-size:12px;color:var(--muted);margin-top:2px}
.banner .r{margin-left:auto}

.kc-grid{display:grid;gap:14px;margin-bottom:16px}
.kc-grid.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kc-grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kc-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kc-grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 18px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:126px;box-shadow:var(--shadow-xs);animation:rise .44s var(--ease) backwards;transition:border-color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease)}
.kc-grid .kc:nth-child(2){animation-delay:.04s}.kc-grid .kc:nth-child(3){animation-delay:.08s}.kc-grid .kc:nth-child(4){animation-delay:.12s}
.kc-click{cursor:pointer}.kc-click:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}.kc-click:active{transform:translateY(-1px);transition-duration:.06s}
.kc-label{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kc-label .wt{margin-left:auto;font-size:10px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.kc-value{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kc-value small{font-size:15px;font-weight:650;color:var(--faint);margin-left:0;letter-spacing:-.01em}
.kc-support{font-size:12px;font-weight:650;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc-bar{height:5px;border-radius:20px;background:var(--line-soft);overflow:hidden;margin-top:11px}
.kc-bar span{display:block;height:100%;border-radius:20px;transform-origin:left;animation:growx .7s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(max-width:1240px){.kc-grid.c5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.kc-grid.c5,.kc-grid.c4,.kc-grid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.kc-value{font-size:27px}.kc{min-height:108px}}

.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:750;padding:1px 7px 1px 5px;border-radius:20px;font-variant-numeric:tabular-nums;line-height:1.7}
.delta svg{width:9px;height:9px}
.delta.good,.delta.bad,.delta.none{background:transparent;color:var(--ink-2);padding:0}
.levelchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.levelchip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.levelchip.lv1{background:var(--bad-soft);color:var(--bad-ink)}
.levelchip.lv2{background:var(--warn-soft);color:var(--warn-ink)}
.levelchip.lv3{background:var(--brand-soft);color:var(--brand-ink)}
.levelchip.lv4{background:var(--good-soft);color:var(--good-ink)}
.levelchip.lv5{background:var(--good-soft);color:var(--good-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 25%,transparent)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-xs)}
.panel.pad{padding:20px 22px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.panel-h h3{font-size:14.5px;font-weight:700;margin:0;letter-spacing:-.014em}
.panel-h .sub{font-size:12px;color:var(--muted);font-weight:500}
.panel-h .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.link{font-size:12.5px;font-weight:650;color:var(--brand);cursor:pointer}.link:hover{text-decoration:underline}
.stack{margin-top:14px}
.two-col{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.two-eq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.two-col,.two-eq{grid-template-columns:minmax(0,1fr)}}

/* trend chart */
.trend{width:100%;height:auto;display:block;overflow:visible}
.trend .grid{stroke:var(--line);stroke-width:1}
.trend .thr{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 4}
.trend .area{opacity:.14}
.trend .ln{fill:none;stroke:var(--brand);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.trend .pt{fill:#fff;stroke:var(--brand);stroke-width:2}
.trend .pt.cur{fill:var(--brand)}
.trend .xl{fill:var(--faint);font-size:10.5px;font-weight:600}
.trend .yl{fill:var(--faint);font-size:9.5px;font-weight:600}
.trend .vlab{fill:var(--ink);font-size:10.5px;font-weight:800}

/* department / team cards */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;box-shadow:var(--shadow-xs);cursor:pointer;transition:border-color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease);animation:rise .44s var(--ease) backwards}
.dcard:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.dcard .dc-h{display:flex;align-items:center;gap:10px}
.dcard .dc-ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
/* teams cycle the brand hues so each card is identifiable at a glance */
.dcard .dc-ic.ic-0{background:var(--p-blue);color:#0048C7}
.dcard .dc-ic.ic-1{background:var(--p-mint);color:#0E8A66}
.dcard .dc-ic.ic-2{background:var(--p-violet);color:#6742BC}
.dcard .dc-ic.ic-3{background:var(--p-peri);color:#3A5FC0}
.dcard .dc-ic.ic-4{background:var(--p-green);color:var(--good-ink)}
.dcard .dc-ic.ic-n{background:var(--surface-3);color:var(--muted)}
.dcard .dc-ic svg{width:19px;height:19px}
.dcard h3{margin:0;font-size:15px;font-weight:750;letter-spacing:-.015em}
.dcard .dc-kind{font-size:11px;color:var(--muted);font-weight:600}
.dcard .dc-score{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.dcard .dc-metrics{display:flex;gap:16px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line-soft)}
.dcard .dm{font-size:11.5px;color:var(--muted);font-weight:600}.dcard .dm b{display:block;font-size:17px;color:var(--ink);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:1px}

.list{margin:2px -8px 0}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;transition:background .14s var(--ease)}
.lrow:hover{background:var(--surface-2)}.lrow+.lrow{box-shadow:inset 0 1px 0 var(--line-soft)}
.lrow.static{cursor:default}.lrow.static:hover{background:transparent}
.lrow-id{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.lrow-name{font-size:13.5px;font-weight:650;min-width:0;letter-spacing:-.01em}
.lrow-name .lrow-sub{display:block;font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lavatar{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:12px;display:grid;place-items:center;transition:.16s}
.lrow:hover .lavatar{background:var(--brand-soft);color:var(--brand)}
.rank{width:20px;flex:0 0 20px;text-align:center;font-size:12px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}.rank.top{color:var(--brand)}
.lrow-track{flex:0 0 116px;height:8px;background:var(--line-soft);border-radius:20px;overflow:hidden}
.lrow-track span{display:block;height:100%;border-radius:20px}
.lrow-meta{font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right;white-space:nowrap}
@media(max-width:620px){.lrow-track{display:none}}
.sdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;display:inline-block;border:1.5px solid var(--none);background:transparent}
/* Dual-encoded status: semantic colour (green/amber/red) AND fill fullness, so
   the scale still reads for colour-blind users and in greyscale print. */
.s-elite{border-color:var(--good);background:var(--good);box-shadow:0 0 0 2px var(--good) inset,0 0 0 1px #fff inset}
.s-strong{border-color:var(--good);background:var(--good)}
.s-good{border-color:var(--good);background:radial-gradient(circle,var(--good) 0 56%,transparent 56% 100%)}
.s-warn{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 0 50%,transparent 50% 100%)}
.s-bad{border-color:var(--bad);background:transparent}
.s-none{border-color:var(--none);background:transparent}
.chev{color:var(--faint);font-size:18px;flex:0 0 12px;text-align:center;transition:transform .18s var(--ease),color .18s var(--ease)}.lrow:hover .chev{transform:translateX(3px);color:var(--ink-2)}
.rchip{min-width:50px;text-align:center;font-size:13.5px;font-weight:800;padding:5px 8px;border-radius:9px;font-variant-numeric:tabular-nums;letter-spacing:-.015em;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 14%,transparent)}
.rchip small{font-size:9.5px;font-weight:700;opacity:.6}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.good,.pill.strong,.pill.elite{background:var(--good-soft);color:var(--good-ink)}.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}.pill.none{background:var(--surface-2);color:var(--muted)}
.pill.elite{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 22%,transparent)}
.tag{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 8px;white-space:nowrap}
.drawer-h .sub .tag.brand{background:var(--brand-soft);color:var(--brand-ink);border-color:rgba(0,93,255,.18)}
.tag.brand{color:var(--ink);background:var(--surface-3);border-color:var(--line)}
.tag.mt{color:var(--ink-2);background:#fff;border-color:var(--line)}
.mini-tag{font-size:9.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:middle}

.bc-row{display:flex;align-items:center;gap:14px;padding:10px 6px;border-radius:10px;cursor:pointer;transition:background .13s}
.bc-row.static{cursor:default}.bc-row.static:hover{background:transparent}
.bc-row:hover{background:var(--surface-2)}
.bc-label{width:184px;flex:0 0 184px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-label small{color:var(--muted);font-weight:500}
.bc-track{flex:1;height:10px;background:var(--line-soft);border-radius:20px;overflow:hidden;min-width:40px}
.bc-fill{height:100%;border-radius:20px;transform-origin:left center;animation:growx .72s var(--ease) backwards}
.bc-val{width:70px;flex:0 0 70px;text-align:right;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.bc-val small{font-size:9.5px;color:var(--faint);font-weight:700}
.bc-chev{color:var(--faint);flex:0 0 10px}
@media(max-width:560px){.bc-label{width:104px;flex-basis:104px}.bc-row{gap:9px}.bc-chev{display:none}.bc-val{width:auto;flex:0 0 auto}}

.person-hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.person-hd .pa{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;flex:0 0 54px}
.person-hd h1{margin:0;font-size:22px;letter-spacing:-.025em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.person-hd .meta{color:var(--muted);font-size:12.5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:5px}
.person-hd .r{margin-left:auto}

/* in-page tabs */
.tabs{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;margin:2px 0 4px}
.tabs button{border:none;background:transparent;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:650;color:var(--muted);cursor:pointer;transition:.15s}
.tabs button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs)}

/* KRA group + KPI score cards */
.kra-group{margin-top:6px}
.kg-h{display:flex;align-items:center;gap:9px;margin:20px 0 10px}
.kg-h .kg-t{font-size:13px;font-weight:750;letter-spacing:-.01em}
.kg-h .kg-p{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.kg-h .kg-line{flex:1;height:1px;background:var(--line)}
.kg-h .kg-r{font-size:12px;font-weight:750;font-variant-numeric:tabular-nums}
.kpigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(324px,1fr));gap:13px}
.kcard{border:1px solid var(--line);border-radius:15px;padding:15px 16px;box-shadow:var(--shadow-xs);cursor:pointer;background:var(--card);transition:border-color .16s,box-shadow .16s,transform .16s;display:flex;flex-direction:column}
.kcard:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.kcard .kh{display:flex;align-items:flex-start;gap:9px}
.kcard .kh .kt{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.3;min-width:0}
.kcard .kh .kt small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kcard .kh .wt{margin-left:auto;flex:0 0 auto;font-size:10px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.kcard .kmeta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.kcard .kfoot{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft)}
.kcard .kfoot .kval{font-size:12.5px;font-weight:600;color:var(--muted)}.kcard .kfoot .kval b{color:var(--ink);font-variant-numeric:tabular-nums}
.kcard .kfoot .r{margin-left:auto;display:flex;align-items:center;gap:8px}

/* band ladder (type-adaptive) */
.ladder{display:flex;gap:5px;margin-top:14px}
.lb{flex:1;min-width:0;border-radius:11px;padding:11px 4px 9px;text-align:center;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:.18s}
.lb .lbn{font-size:9px;font-weight:700;color:var(--faint);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .lbv{font-size:11px;font-weight:700;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb.on{border-color:transparent;color:#fff;box-shadow:0 3px 12px -3px var(--c),0 0 0 2px var(--c)}
.lb.on .lbn{color:rgba(255,255,255,.8)}.lb.on .lbv{color:#fff}
.lb.meets::after{content:"MEETS";position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:7px;font-weight:800;letter-spacing:.05em;color:var(--brand-ink);background:#fff;padding:0 5px;border-radius:3px;border:1px solid var(--brand-soft)}
.lb.g1{--c:var(--bad)}.lb.g2{--c:var(--warn)}.lb.g3{--c:var(--brand)}.lb.g4{--c:var(--good)}.lb.g5{--c:var(--good)}
.lb.on{background:var(--c)}
.lb .qd{width:11px;height:11px;border-radius:50%;border:2px solid var(--faint);margin:4px auto 0}
.lb.on .qd{border-color:#fff;background:#fff}
.ladder-cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-weight:600;margin-top:9px;gap:8px}
.ladder-act{font-size:12px;color:var(--ink-2);font-weight:600;margin-top:10px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ladder-act b{color:var(--ink);font-variant-numeric:tabular-nums}
.ladder-mark{position:relative;height:14px;margin-top:6px}
.ladder-mark .tk{position:absolute;top:0;width:2px;height:8px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.ladder-mark .tk::after{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--ink)}

/* milestone */
.ms{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:14px;padding:14px 16px;background:var(--card);box-shadow:var(--shadow-xs);display:flex;flex-direction:column;gap:10px}
.ms .ms-h{display:flex;align-items:center;gap:10px}
.ms .ms-h .ms-t{font-size:13.5px;font-weight:700}.ms .ms-h .ms-t small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.ms .ms-h .r{margin-left:auto}
.ms-track{position:relative;height:10px;border-radius:20px;background:var(--surface-3);overflow:hidden}
.ms-track span{position:absolute;left:0;top:0;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.ms-foot{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--muted);font-weight:600}
.ms-foot b{color:var(--ink)}
.ms.done{align-items:flex-start}

/* distribution histogram */
.hist{display:flex;align-items:flex-end;gap:12px;height:150px;padding:8px 4px 0}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;cursor:pointer}
.hbar{width:100%;max-width:56px;border-radius:8px 8px 3px 3px;background:var(--brand-soft);position:relative;transition:.16s;min-height:3px}
.hcol:hover .hbar{filter:brightness(.96)}
.hbar b{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.hlab{font-size:10.5px;font-weight:650;color:var(--muted);text-align:center;line-height:1.2}
.hlab small{display:block;color:var(--faint);font-weight:600;font-size:9px}

/* achievements */
.ach{display:flex;flex-wrap:wrap;gap:8px}
.ach span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:6px 12px}
.ach span svg{width:13px;height:13px;color:var(--good)}

/* review block */
.review{border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:var(--surface-2)}
.review .rv-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.review .rv-txt{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.review .rv-meta{font-size:11px;color:var(--faint);margin-top:9px;display:flex;gap:12px;flex-wrap:wrap}

/* KRAs & KPIs — expandable list (§8) */
.linkrow{display:flex;gap:24px;flex-wrap:wrap;margin-top:2px}
.bar{flex:0 0 120px;height:6px;background:var(--surface-3);border-radius:20px;overflow:hidden}
.bar.wide{flex-basis:200px}
.bar span{display:block;height:100%;background:var(--ink);border-radius:20px;transform-origin:left;animation:growx .7s var(--ease) backwards}
.exp-p{margin-bottom:24px}
.exp-ph{display:flex;align-items:center;gap:16px;padding:0 2px 12px;border-bottom:1px solid var(--line)}
.exp-pt{font-size:15px;font-weight:600;letter-spacing:-.012em;flex:1;min-width:0}
.exp-pr{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}.exp-pr small{font-size:11px;color:var(--muted);font-weight:600;margin-left:1px}
.exp-kra{display:flex;align-items:center;gap:14px;padding:14px 8px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .14s}
.exp-kra:hover{background:var(--surface-2)}
.exp-name{flex:1;min-width:0;font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-name small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.exp-val{width:48px;text-align:right;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.exp-chev{color:var(--muted);font-size:12px;width:14px;text-align:center}
.exp-kpis{overflow:hidden;animation:expand .32s var(--ease);padding-left:20px;border-left:1px solid var(--line);margin:0 0 10px 14px}
.exp-kpi{display:flex;align-items:center;gap:12px;padding:11px 8px;cursor:pointer;border-radius:9px;transition:background .14s}
.exp-kpi:hover{background:var(--surface-2)}
@keyframes expand{from{opacity:0;max-height:0}to{opacity:1;max-height:1600px}}
.tbl-wrap{overflow-x:auto;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:940px}
/* small tables inside half-width panels must not inherit the wide min-width */
.tbl.compact{min-width:0}
.tbl.compact th,.tbl.compact td{padding:8px 10px}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.num{text-align:right}.tbl th.sorted{color:var(--ink-2)}.tbl th .sc{opacity:.5;font-size:9px;margin-left:3px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tbl tbody tr{cursor:pointer;transition:.12s}.tbl tbody tr:hover{background:var(--surface-2)}.tbl tbody tr:last-child td{border-bottom:none}
.tbl .kname{font-weight:650}.tbl .kname small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.pager{display:flex;align-items:center;justify-content:space-between;padding-top:12px;font-size:12.5px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;margin-left:6px}
.pager button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}.pager button:disabled{opacity:.45;cursor:default}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px}.empty svg{width:36px;height:36px;opacity:.3;margin-bottom:6px}

.info-tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.info-tbl th{background:var(--surface-2);text-align:left;font-size:11px;font-weight:700;color:var(--ink-2);padding:8px 11px;border:1px solid var(--line);white-space:nowrap}
.info-tbl td{padding:8px 11px;border:1px solid var(--line-soft);vertical-align:top;color:var(--ink-2)}

.hcheck{display:flex;align-items:center;gap:11px;padding:11px 6px}.hcheck+.hcheck{box-shadow:inset 0 1px 0 var(--line-soft)}
.hcheck .hc-ic{width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:grid;place-items:center}
.hcheck .hc-ic svg{width:14px;height:14px}
.hcheck.ok .hc-ic{background:var(--good-soft);color:var(--good-ink)}.hcheck.warn .hc-ic{background:var(--warn-soft);color:var(--warn-ink)}.hcheck.bad .hc-ic{background:var(--bad-soft);color:var(--bad-ink)}
.hcheck .hc-t{font-size:13px;font-weight:600}.hcheck .hc-t small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.hcheck .r{margin-left:auto;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}

.state{min-height:60vh;display:grid;place-items:center;padding:20px}
.state-card{max-width:470px;text-align:center}
.state-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0 auto 16px;background:var(--brand-soft);color:var(--brand)}.state-ic svg{width:26px;height:26px}
.state h2{font-size:18px;font-weight:750;margin:0 0 8px;letter-spacing:-.02em}
.state p{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 18px}
.state.err .state-ic{background:var(--bad-soft);color:var(--bad-ink)}
.skl{background:linear-gradient(90deg,#EEF1F6,#F6F8FB,#EEF1F6);background-size:200% 100%;border-radius:12px;animation:sh 1.3s ease infinite}@keyframes sh{to{background-position:-200% 0}}
.btn{border:none;border-radius:11px;padding:10px 18px;font-size:13.5px;font-weight:650;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cta,#005DFF);color:#fff}.btn.primary:hover{background:var(--brand-ink)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.32);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s;z-index:60}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:540px;max-width:94vw;background:#fff;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .28s var(--ease);z-index:61;display:flex;flex-direction:column}.drawer.on{transform:none}
.drawer-h{padding:20px 22px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start;background:linear-gradient(180deg,var(--surface-2) 0%,var(--card) 72%);position:relative}
.drawer-h::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--brand-grad);pointer-events:none;border-radius:0}
.drawer-h h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.022em;line-height:1.25;font-family:var(--font-display)}
.drawer-h .sub{font-size:12px;color:var(--muted);margin-top:9px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.drawer-body{padding:22px 22px 36px;overflow-y:auto;flex:1}
.drawer .close{margin-left:auto;flex:0 0 34px;margin-top:-2px}
.section-t{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px;display:flex;align-items:center;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--line-soft)}.section-t:first-child{margin-top:0}
.section-t .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--faint)}
.def-box{font-size:13px;color:var(--ink-2);line-height:1.65;background:var(--brand-soft);border:1px solid rgba(0,93,255,.14);border-radius:13px;padding:14px 16px}
.def-box .dm{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid rgba(0,93,255,.1)}
.def-box .dm span{font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:20px;padding:2px 10px;display:inline-flex;align-items:center;gap:3px}
.def-box .dm b{color:var(--ink-2);font-weight:650}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric-grid.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.metric-grid.g4{grid-template-columns:repeat(2,1fr)}}
.metric{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 13px 12px;box-shadow:var(--shadow-xs)}
.metric .l{font-size:11px;color:var(--muted);font-weight:600;line-height:1.2}.metric .v{font-size:18px;font-weight:800;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}.metric .v small{font-size:11px;font-weight:600;color:var(--faint)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:650;color:var(--ink-2);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:13px;color:var(--ink);outline:none;transition:.15s;background:#fff}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.24s;z-index:80}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{background:var(--bad)}
.fade{animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.hamburger{display:none}
@media(max-width:900px){
  .hamburger{display:grid}
  /* sidebar becomes an off-canvas drawer */
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow-lg);transition:transform .28s var(--ease)}
  .sidebar.open{transform:none}
  .app.rail{--sbw:246px}
  .app.rail .wordmark,.app.rail .sb-gt,.app.rail .nav-item .lbl,.app.rail .nav-item .badge,.app.rail .userchip .u-meta,.app.rail .sb-collapse .lbl{display:revert}
  .app.rail .nav-item{justify-content:flex-start;padding:9px 12px}
  .app.rail .sb-head{padding:0 14px;justify-content:flex-start}
  .app.rail .sb-collapse{justify-content:flex-start;padding:8px 12px}
  .app.rail .sb-collapse svg{transform:none}
  .sb-scrim{display:block;position:fixed;inset:0;background:rgba(15,23,42,.32);opacity:0;pointer-events:none;transition:.2s;z-index:44}
  .sb-scrim.on{opacity:1;pointer-events:auto}
  .topbar{padding:0 16px}
  .filterbar{padding-left:16px;padding-right:16px}
  .content{padding:22px 16px 64px}
}
@media(max-width:620px){.userchip .u-meta{display:none}.updated{display:none}.metric-grid{grid-template-columns:repeat(2,1fr)}.person-hd .r{margin-left:0;width:100%}.fseg{flex-wrap:wrap}.fseg button{padding:6px 9px;font-size:11.5px}.fsearch{flex:1 1 100%}.pill-select{max-width:100%}}
@media(max-width:480px){.crumbs{display:none}.userchip{display:none}}

/* ---- Cycle chip ---- */
.cyc-chip{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--line-2);border-radius:20px;padding:2px 9px;color:var(--ink-2);background:#fff;cursor:pointer;margin-right:10px}
.cyc-chip.active{color:var(--ink);border-color:var(--ink)}
.cyc-chip.locked{background:var(--ink);color:#fff;border-color:var(--ink)}
.cyc-chip.review{background:var(--surface-3);color:var(--ink)}
.cyc-chip.draft{color:var(--muted)}

/* ---- score + rating pairing ---- */
.rt-sub{font-size:11px;font-weight:650;color:var(--muted);margin-left:8px;letter-spacing:0}
.kc-value .rt-sub{vertical-align:middle}
/* a word, not a number: drop to a readable size so long states fit the tile */
.kc-word{font-size:19px;letter-spacing:-.02em;line-height:1.2;display:inline-block}

/* ---- review workflow ---- */
.stage{font-size:11px;font-weight:650;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--ink-2);background:#fff;white-space:nowrap}
.stage.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.wf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);margin-bottom:16px}
.wf-step{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.wf-step.active{color:var(--ink)}.wf-step.done{color:var(--ink-2)}
.wf-dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--line-2);background:#fff;color:var(--muted)}
.wf-step.active .wf-dot{border-color:var(--ink);color:var(--ink)}
.wf-step.done .wf-dot{background:var(--ink);border-color:var(--ink);color:#fff}
.wf-line{flex:1;min-width:16px;height:1px;background:var(--line-2)}
.rv-state{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.rv-line{display:flex;align-items:center;gap:10px;padding:11px 13px;font-size:12.5px;font-weight:600}
.rv-line+.rv-line{border-top:1px solid var(--line-soft)}
.rv-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:9px;color:#fff;flex:0 0 16px}
.rv-dot.done{background:var(--ink);border-color:var(--ink)}
.rv-dot.active{border-color:var(--ink)}
.rv-st{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted)}

/* ---- check-ins ---- */
.ci-date{flex:0 0 52px;font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ci-log{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-top:6px}
.ci-item{display:flex;gap:14px;padding:13px 15px;position:relative;background:var(--card)}
.ci-item+.ci-item{border-top:1px solid var(--line-soft);background:var(--surface-2)}
.ci-when{flex:0 0 54px;font-size:11.5px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;padding-top:1px}
.ci-body{min-width:0;flex:1}
.ci-val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.ci-note{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-top:3px}
.ci-meta{font-size:11px;color:var(--faint);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.link.sm{font-size:11.5px;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;flex:0 0 auto}

/* ---- score explanation ---- */
.calc{margin-top:10px;font-size:12.5px;color:var(--ink-2);background:var(--brand-soft);border:1px solid rgba(0,93,255,.14);border-radius:11px;padding:11px 14px;line-height:1.7}
.calc b{color:var(--brand-ink);font-variant-numeric:tabular-nums}
.lockmsg{font-size:12px;font-weight:600;color:var(--warn-ink);background:var(--warn-soft);border:1px solid rgba(197,122,0,.2);border-radius:10px;padding:10px 13px;margin-bottom:10px}

/* ---- assignment editor ---- */
.asg{border:1px solid var(--line);border-radius:13px;padding:13px 15px;background:var(--surface-2);margin-top:4px}
.asg summary{font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;list-style:none}
.asg summary::-webkit-details-marker{display:none}
.asg summary::before{content:"▸ ";color:var(--brand)}
.asg[open] summary::before{content:"▾ ";color:var(--brand)}
.asg summary b{color:var(--ink)}
.band-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:4px 0 2px}
.band-grid .field label{font-size:10px}
.band-grid input{padding:7px 8px;font-size:12px}
@media(max-width:640px){.band-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---- settings ---- */
.pct-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:4px}
.pct-grid .field label{font-size:10px}
.pct-grid input{padding:8px;font-size:12.5px;text-align:center}
@media(max-width:640px){.pct-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:10px 0 14px;cursor:pointer;line-height:1.5}
.chk input{margin-top:2px;accent-color:var(--ink)}
.chk small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.status-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.status-row+.status-row{border-top:1px solid var(--line-soft)}
.status-row .st-label{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--ink);outline:none;background:#fff}
.status-row .st-min{width:76px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;outline:none;background:#fff}
.status-row .st-label:focus,.status-row .st-min:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.status-row .st-at{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.tbl tr.tot td{border-top:2px solid var(--line-2);font-weight:700;background:var(--surface-2)}

/* ============================================================ DASHBOARD
   A dashboard is an instrument panel, not a document: one hero figure, a
   dense tile grid, and a form chosen per job. Colour is disciplined — brand
   blue for the accent and progress, a green/amber/red ramp for status only,
   and neutral ink for pure magnitude, so hue always carries meaning. */
/* Band headings break the dashboard into answerable questions instead of one
   continuous wall of tiles: where we stand → how it breaks down → what to do. */
/* named .dband, not .band — the distribution chart already uses <g class="band"> */
.dband{display:flex;align-items:baseline;gap:10px;margin:30px 0 13px}
.dband:first-of-type{margin-top:4px}
.dband h2{font-size:13.5px;font-weight:700;letter-spacing:-.012em;margin:0;color:var(--ink);white-space:nowrap;font-family:var(--font-display)}
.dband .bd{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dband .ln{flex:1;height:1px;background:var(--line);min-width:12px}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-items:stretch}
.t1{grid-column:span 1}.t2{grid-column:span 2}.t3{grid-column:span 3}.t4{grid-column:span 4}
.t5{grid-column:span 5}.t6{grid-column:span 6}.t7{grid-column:span 7}.t8{grid-column:span 8}
.t9{grid-column:span 9}.t12{grid-column:span 12}
/* Below 1180 a 6-col hero + four 2-col stats overflows to 14 and strands the
   fourth stat alone. Hero takes its own row and the stats go 4-up, then 2-up. */
@media(max-width:1180px){.t2{grid-column:span 3}.t3{grid-column:span 6}.t4{grid-column:span 6}.t5,.t7,.t8,.t9{grid-column:span 12}
  .dash>.tile.t4:first-child{grid-column:span 12}}
@media(max-width:980px){.t2{grid-column:span 6}}
@media(max-width:720px){.dash{gap:10px}.t2,.t3,.t4,.t5,.t6{grid-column:span 12}}

/* compact page header — a dashboard states what it is in one line */
.dash-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.dash-head h1{font-size:23px;font-weight:600;letter-spacing:-.024em;margin:0;line-height:1.15}
.dash-head .sub{font-size:12.5px;color:var(--muted);padding-bottom:2px}
.dash-head .r{margin-left:auto;display:flex;align-items:center;gap:8px;padding-bottom:1px}

.tile{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:13px 15px;min-width:0;display:flex;flex-direction:column}
.tile.pad0{padding:13px 8px 8px}
/* Pastel tones. Applied per tile category so the grid reads as colour-coded
   groups rather than a field of identical white boxes. */
.tile.tn-peri{background:var(--p-peri);border-color:var(--p-peri-bd)}
.tile.tn-blue{background:var(--p-blue);border-color:var(--p-blue-bd)}
.tile.tn-violet{background:var(--p-violet);border-color:var(--p-violet-bd)}
.tile.tn-mint{background:var(--p-mint);border-color:var(--p-mint-bd)}
.tile.tn-green{background:var(--p-green);border-color:var(--p-green-bd)}
.tile.tn-amber{background:var(--p-amber);border-color:var(--p-amber-bd)}
.tile.tn-rose{background:var(--p-rose);border-color:var(--p-rose-bd)}
/* the tile label needs a step more contrast once it sits on a tint */
.tile[class*="tn-"] .tile-h .tlb{color:var(--ink-2);opacity:.82}
.tile[class*="tn-"] .stat .sub{color:var(--ink-2);opacity:.72}
/* the meter track would disappear into a tint, so give it its own ground */
.tile[class*="tn-"] .meter{background:rgba(255,255,255,.72)}
/* a white sheen reads better than a blue glow on a coloured ground */
.tile[class*="tn-"]::before{background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.62),transparent 64%)}
.tile-h{display:flex;align-items:center;gap:8px;margin-bottom:9px;min-height:16px}
.tile-h .tlb{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.tile-h .r{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.tile-h .r.link{cursor:pointer}.tile-h .r.link:hover{color:var(--ink)}
.tile.clickable{cursor:pointer;transition:border-color .15s var(--ease),box-shadow .15s var(--ease),transform .15s var(--ease)}
.tile.clickable:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
/* The hero is the one number the page leads with — it gets a brand edge and a
   tinted ground so it is not just another white box among twelve. */
.tile.t4:first-child{background:linear-gradient(150deg,var(--brand-soft) 0%,var(--card) 58%);border-color:rgba(0,93,255,.16)}
.tile.t4:first-child .tile-h .tlb{color:var(--brand-ink)}

/* hero: the one number the view leads with (proportional figures, ≥48px) */
.hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero-fig{font-size:56px;font-weight:600;letter-spacing:-.035em;line-height:.95;font-variant-numeric:proportional-nums}
.hero-fig .u{font-size:22px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:-.02em}
.hero-fig .hero-blank{color:var(--faint);font-weight:500}
.hero-side{display:flex;flex-direction:column;gap:7px;min-width:0}
.hero-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-note{font-size:11.5px;color:var(--muted);line-height:1.5}

/* stat tile: label · value · delta · sparkline */
.stat{display:flex;flex-direction:column;gap:2px;flex:1}
.stat .v{font-size:27px;font-weight:600;letter-spacing:-.028em;line-height:1.1;font-variant-numeric:proportional-nums}
.stat .v .u{font-size:14px;color:var(--muted);font-weight:600;margin-left:1px}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.stat .spark{margin-top:auto;padding-top:9px}

/* meter — a single ratio against its limit; track is a lighter step of the ramp */
.meter{height:6px;border-radius:20px;background:var(--line-soft);overflow:hidden;margin-top:9px}
.meter span{display:block;height:100%;border-radius:20px;background:var(--brand)}
.meter.sm{height:4px;margin-top:7px}

/* dense ranked rows — magnitude on nominal categories: one ink, length varies */
.drow{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:8px;cursor:pointer;transition:background .13s}
.drow:hover{background:var(--surface-2)}
.drow.static{cursor:default}.drow.static:hover{background:transparent}
.drow .nm{font-size:12.5px;font-weight:550;flex:0 0 118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow.wide .nm{flex:0 0 210px}
@media(max-width:720px){.drow.wide .nm{flex:0 0 130px}}
.drow .nm small{display:block;font-size:10.5px;color:var(--faint);font-weight:500}
.drow .bar{flex:1;height:8px;background:var(--line-soft);border-radius:20px;overflow:hidden;min-width:40px}
.drow .bar i{display:block;height:100%;border-radius:20px;background:var(--ink)}
.drow .val{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:44px;text-align:right}
.drow .val small{font-size:9.5px;color:var(--muted);font-weight:600}
.drow .d{flex:0 0 auto;min-width:52px;text-align:right}
@media(max-width:520px){.drow .nm{flex-basis:88px}.drow .d{display:none}}

/* distribution columns — ordered categories, so the ordinal ramp is legitimate */
.cols{display:flex;align-items:flex-end;gap:7px;height:104px;padding:0 2px}
.ccol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;min-width:0}
.ccol .cbar{width:100%;max-width:52px;border-radius:5px 5px 2px 2px;background:var(--cbar,var(--ink));position:relative;min-height:2px;transition:opacity .13s,filter .13s}
.ccol:hover .cbar{filter:brightness(1.06)}
.ccol .cbar b{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;color:var(--ink)}
.ccol .clab{font-size:9.5px;font-weight:600;color:var(--faint);text-align:center;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ccol.dim .cbar{background:var(--line-2)}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart .grid{stroke:var(--line-soft);stroke-width:1}
.chart .axis{fill:var(--faint);font-size:9.5px;font-weight:600}
.chart .ln{fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart .ar{fill:var(--brand-soft)}
.chart .pt{fill:#fff;stroke:var(--brand);stroke-width:2}
.chart .pt.cur{fill:var(--brand)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .cross{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.chart .band:hover .cross{opacity:1}
.sparksvg{display:block;width:100%;height:26px;overflow:visible}
.sparksvg .sl{fill:none;stroke:var(--line-2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sparksvg .sd{fill:var(--ink)}

/* one shared tooltip for every chart's hover layer */
.vtip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:7px 10px;font-size:11.5px;font-weight:600;line-height:1.45;opacity:0;transform:translate(-50%,-118%);transition:opacity .12s;white-space:nowrap;box-shadow:var(--shadow)}
.vtip.on{opacity:1}
.vtip b{font-variant-numeric:tabular-nums}
.vtip .k{color:rgba(255,255,255,.62);font-weight:600}

/* compact attention table */
.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini td{padding:7px 6px;border-bottom:1px solid var(--line-soft)}
.mini tr:last-child td{border-bottom:none}
.mini tr{cursor:pointer}.mini tr:hover{background:var(--surface-2)}
.mini .nm{font-weight:600}
.mini .nm small{display:block;font-size:10.5px;color:var(--faint);font-weight:500}
.mini .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.tile .empty{padding:16px 4px;font-size:12px}

/* ---- team lead ---- */
.lead-chip{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.lead-chip.static{cursor:default}
.lead-chip svg{width:13px;height:13px}
.lead-chip b{color:var(--ink);font-weight:700}
.lead-chip:not(.static):hover b{text-decoration:underline}
.lead-tile{display:flex;align-items:center;gap:11px;min-width:0}
.lead-tile .lt-name{font-size:16px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-tile .lt-role{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px}
.lavatar.lg{width:40px;height:40px;font-size:14px;flex:0 0 40px}

/* ---- teams editor ---- */
.team-edit{border:1px solid var(--line);border-radius:13px;padding:14px 15px;background:var(--card)}
.team-edit+.team-edit{margin-top:10px}
.te-h{display:flex;align-items:center;gap:11px}
.te-name{flex:1;min-width:0;border:1px solid transparent;border-radius:8px;padding:6px 9px;font-size:16px;font-weight:700;letter-spacing:-.015em;color:var(--ink);background:var(--surface-2);outline:none;width:100%}
.te-name:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.te-stat{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;flex:0 0 auto}
.te-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:640px){.te-grid{grid-template-columns:1fr}}
.te-note{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}
.te-subs{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ===== ReactBits-inspired micro-interactions =====
   Spotlight: a soft brand-tinted glow tracks the cursor across a card.
   Kept at 7% so it reads as depth, not decoration. */
.kc,.kcard,.dcard,.tile,.metric{position:relative}
.kc::before,.kcard::before,.dcard::before,.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .32s var(--ease);background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(0,93,255,.075),transparent 62%)}
.kc:hover::before,.kcard:hover::before,.dcard:hover::before,.tile:hover::before{opacity:1}
/* Animated list: rows arrive in sequence rather than all at once. */
.lrow{animation:rowIn .38s var(--ease) backwards}
.lrow:nth-child(1){animation-delay:.02s}.lrow:nth-child(2){animation-delay:.05s}.lrow:nth-child(3){animation-delay:.08s}
.lrow:nth-child(4){animation-delay:.11s}.lrow:nth-child(5){animation-delay:.14s}.lrow:nth-child(6){animation-delay:.17s}
.lrow:nth-child(7){animation-delay:.19s}.lrow:nth-child(8){animation-delay:.21s}.lrow:nth-child(n+9){animation-delay:.23s}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Achievement bar — one component, used everywhere achievement is listed, so a
   manager can scan a column and see who is behind without reading a number.
   The track runs 0–125% of target with a hairline TICK at 100%: without that
   reference a bar means nothing. Over-achievement stays visible (a caret past
   the tick) instead of being clipped at full. Colour comes from the KPI's own
   status band, and the number is always printed too — never colour alone. */
.achcell{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:66px}
.kbar{position:relative;height:5px;width:100%;min-width:58px;border-radius:20px;background:var(--surface-2)}
.kbar>span{position:absolute;left:0;top:0;bottom:0;border-radius:20px;transform-origin:left;
  animation:kbargrow .55s cubic-bezier(.22,.61,.36,1) backwards}
.kbar>i{position:absolute;top:-3px;bottom:-3px;left:80%;width:1px;background:var(--line-2);border-radius:1px}
.kbar.none{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 7px)}
.kbar.over>span::after{content:"";position:absolute;right:-4px;top:50%;transform:translateY(-50%);
  border:3.5px solid transparent;border-left-color:inherit}
@keyframes kbargrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.kbar>span{animation:none}}

/* Targets — a team's facts as one quiet line, not a row of competing cards. */
.tgt-facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:16px;
  font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tgt-facts span{position:relative}
.tgt-facts span+span::before{content:"";position:absolute;left:-12px;top:.42em;width:3px;height:3px;
  border-radius:50%;background:var(--line-2)}

/* Back — sits left of the breadcrumb, appears only when there is somewhere to
   return to. Present at every width, unlike the crumbs, which collapse. */
.back-btn{display:grid;flex:0 0 34px}
.back-btn:hover{border-color:var(--brand);color:var(--brand)}
.mo-h .mo-x[data-act="mo-back"]{margin-left:0;margin-right:2px}

/* ════════════════ MODAL SYSTEM ════════════════
   One surface for examining a level of the hierarchy (team → employee → KRA →
   target). The drawer stays for editing a single KPI; a modal is for reading a
   composite record, so it is centred, quiet, and never nests a card in a card.
   Hierarchy comes from type and space — colour appears once, on status.        */
.mo-scrim{position:fixed;inset:0;background:rgba(12,26,51,.38);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s var(--ease);z-index:70}
.mo-scrim.on{opacity:1;pointer-events:auto}
.mo-wrap{position:fixed;inset:0;z-index:71;display:grid;place-items:center;padding:28px;pointer-events:none}
.mo{width:100%;max-width:720px;max-height:calc(100vh - 56px);background:var(--card);border-radius:18px;
  box-shadow:0 1px 2px rgba(12,26,51,.06),0 40px 80px -32px rgba(12,26,51,.34);
  display:flex;flex-direction:column;opacity:0;transform:translateY(10px) scale(.985);
  transition:opacity .22s var(--ease),transform .26s var(--ease);pointer-events:auto;overflow:hidden}
.mo.wide{max-width:880px}
.mo.on{opacity:1;transform:none}
/* header — identity on the left, the one headline number on the right */
.mo-h{padding:22px 26px 18px;display:flex;align-items:flex-start;gap:16px;border-bottom:1px solid var(--line)}
.mo-ic{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand-ink);font-weight:700;font-size:14px;overflow:hidden}
.mo-ic svg{width:20px;height:20px}
.mo-id{min-width:0;flex:1}
.mo-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mo-h h2{margin:4px 0 0;font-size:20px;font-weight:650;letter-spacing:-.025em;line-height:1.2;font-family:var(--font-display)}
.mo-sub{margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.mo-score{flex:0 0 auto;text-align:right}
.mo-score .v{font-size:26px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.mo-score .l{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.mo-x{border:1px solid var(--line);background:#fff;border-radius:9px;width:32px;height:32px;flex:0 0 32px;
  display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:.15s;margin-left:2px}
.mo-x:hover{border-color:var(--ink-2);color:var(--ink)}.mo-x svg{width:15px;height:15px}
/* tabs */
.mo-tabs{display:flex;gap:2px;padding:0 26px;border-bottom:1px solid var(--line);overflow-x:auto}
.mo-tabs button{border:none;background:transparent;padding:12px 2px 11px;margin-right:22px;font:inherit;font-size:13px;
  font-weight:550;color:var(--muted);cursor:pointer;white-space:nowrap;position:relative;transition:color .15s}
.mo-tabs button:hover{color:var(--ink)}
.mo-tabs button.on{color:var(--ink);font-weight:650}
.mo-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}
/* body */
.mo-b{padding:22px 26px 26px;overflow-y:auto;flex:1}
.mo-sec+.mo-sec{margin-top:26px}
.mo-sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.mo-sec-h .t{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mo-sec-h .r{margin-left:auto;font-size:12px;color:var(--muted);font-weight:550}
/* headline stats — hairline separated, never boxed */
.mo-stats{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mo-stat{flex:1 1 0;min-width:132px;padding:14px 16px;border-right:1px solid var(--line)}
.mo-stat:last-child{border-right:none}
.mo-stat .l{font-size:11px;font-weight:600;color:var(--muted)}
.mo-stat .v{font-size:21px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:5px;line-height:1.1}
.mo-stat .s{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:500}
@media(max-width:620px){.mo-stat{flex:1 1 50%;min-width:50%;border-bottom:1px solid var(--line)}.mo-stat:nth-child(2n){border-right:none}}
/* definition pairs */
.mo-kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:0}
.mo-kv>div{padding:10px 0;border-top:1px solid var(--line-soft);font-size:13px;min-width:0}
.mo-kv>div:nth-child(-n+2){border-top:none}
.mo-kv .k{color:var(--muted);font-weight:550}
.mo-kv .v{color:var(--ink);font-weight:550;overflow-wrap:anywhere}
@media(max-width:560px){.mo-kv{grid-template-columns:1fr}.mo-kv .k{padding-bottom:2px}.mo-kv .v{padding-top:0;border-top:none}}
/* rating ladder — the achieved band is marked, the rest recede */
.mo-lad{display:flex;gap:5px}
.mo-lad .b{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 7px 8px;text-align:center;background:var(--surface-2);transition:.16s}
.mo-lad .b .n{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.mo-lad .b .v{font-size:12px;font-weight:650;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-lad .b.on{background:var(--brand-soft);border-color:rgba(0,93,255,.28)}
.mo-lad .b.on .n{color:var(--brand-ink)}.mo-lad .b.on .v{color:var(--brand-ink)}
.mo-lad-cap{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:11.5px;color:var(--muted);font-weight:550}
/* the measurement line: target → actual → achievement */
.mo-meas{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mo-meas>div{flex:1 1 0;padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.mo-meas>div:last-child{border-right:none}
.mo-meas .l{font-size:11px;font-weight:600;color:var(--muted)}
.mo-meas .v{font-size:19px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:5px}
.mo-meas .arrow{flex:0 0 26px;padding:0;display:grid;place-items:center;color:var(--faint);border-right:1px solid var(--line)}
@media(max-width:620px){.mo-meas{flex-wrap:wrap}.mo-meas>div{flex:1 1 50%;border-bottom:1px solid var(--line)}.mo-meas .arrow{display:none}}
/* compact table */
.mo-tbl{width:100%;border-collapse:collapse;font-size:13px}
.mo-tbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  padding:0 12px 9px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.mo-tbl th.n,.mo-tbl td.n{text-align:right;padding-right:0}
.mo-tbl td{padding:11px 12px 11px 0;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.mo-tbl td.n{font-variant-numeric:tabular-nums;font-weight:600}
.mo-tbl tbody tr:last-child td{border-bottom:none}
.mo-tbl tr.tot td{border-top:1px solid var(--line);border-bottom:none;font-weight:700;padding-top:12px}
.mo-tbl .nm{font-weight:600}.mo-tbl .nm small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;margin-top:2px}
.mo-tw{overflow-x:auto}
/* bars */
.mo-bars{display:flex;flex-direction:column;gap:11px}
.mo-bar{display:flex;align-items:center;gap:12px;font-size:13px}
.mo-bar .l{flex:0 0 132px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-bar .t{flex:1;height:6px;background:var(--line-soft);border-radius:20px;overflow:hidden;min-width:40px}
.mo-bar .t span{display:block;height:100%;border-radius:20px;background:var(--brand);transform-origin:left;animation:growx .7s var(--ease) backwards}
.mo-bar .v{flex:0 0 auto;font-weight:650;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
@media(max-width:560px){.mo-bar .l{flex-basis:96px}}
/* footer */
.mo-f{padding:16px 26px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--surface-2)}
.mo-f .sp{flex:1}
.mo-note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
@media(max-width:720px){.mo-wrap{padding:0}.mo,.mo.wide{max-width:100%;max-height:100vh;height:100vh;border-radius:0}}

/* Targets — individual allocation rows carry two figures (target + achievement),
   which is one too many for a phone. Drop the chevron, let the name shrink, and
   keep both numbers legible. Scoped so shared .bc-row usage is untouched. */
.tgt-alloc .bc-val{min-width:0}
@media(max-width:760px){
  .tgt-alloc .bc-row{gap:8px;flex-wrap:wrap}
  .tgt-alloc .bc-label{flex:1 1 100%;width:auto}
  .tgt-alloc .bc-track{flex:1 1 60px;min-width:40px}
  .tgt-alloc .bc-val{flex:0 0 auto;white-space:nowrap}
  .tgt-alloc .bc-chev{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.05ms!important}}
</style>

<body>
<div class="app" id="app">

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const n1=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10);
const n2=v=>v==null||isNaN(v)?'—':(Math.round(v*100)/100);
const pct=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10)+'%';
/* Status colour ramp: on-brand green for healthy tiers, restrained amber/red for
   risk. Applied to rating chips + status bars; pure-magnitude bars stay neutral. */
const SCOL={good:'var(--good)',strong:'var(--good)',elite:'var(--good)',warn:'var(--warn)',bad:'var(--bad)',none:'var(--none)'};
const STINT={good:'var(--good-soft)',strong:'var(--good-soft)',elite:'var(--good-soft)',warn:'var(--warn-soft)',bad:'var(--bad-soft)',none:'var(--none-soft)'};
const sc=k=>SCOL[k]||SCOL.none, tint=k=>STINT[k]||STINT.none;
const AR_UP='<svg viewBox="0 0 10 10"><path d="M5 2.2l3.2 5.2H1.8z" fill="currentColor"/></svg>';
const AR_DN='<svg viewBox="0 0 10 10"><path d="M5 7.8L1.8 2.6h6.4z" fill="currentColor"/></svg>';
const MONTHS=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function relTime(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';const s=(Date.now()-d.getTime())/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';return d.toLocaleDateString();}
function ratingStr(r){return r==null?'—':(Math.round(r*10)/10).toFixed(1);}
function periodShort(p){const m=/^(\d{4})-(\d{2})$/.exec(p||'');return m?(MONTHS[+m[2]]||m[2]):(p||'');}
function periodLong(p){const m=/^(\d{4})-(\d{2})$/.exec(p||'');return m?(periodShort(p)+" '"+m[1].slice(2)):(p||'');}
/* type-adaptive value formatting from the KPI rule layer. The master sheet
   stores percentages as fractions (0.96 = 96%, 0.013 = 1.3%), so any Percentage
   value at fractional scale is shown ×100 — otherwise a layman reads "0.96%". */
function pctScale(v){return Math.abs(v)<=1.5?v*100:v;}
function pctStr(v){const p=pctScale(v);const r=Math.round(p*10)/10;return (r===Math.round(r)?String(Math.round(r)):r.toFixed(1))+'%';}
function fmtVal(rec,v){if(v==null||v==='')return '—';const mt=rec&&rec.metricType;if(mt==='Percentage')return pctStr(v);if(mt==='Days')return n2(v)+' d';if(mt==='Amount')return '₹'+n2(v)+' Cr';return String(n2(v));}
function unitStr(rec,v){return fmtVal(rec,v);}
/* Prettify a band's raw cell for display: bare fractional numbers on a
   Percentage KPI become "60%", but rich labels ("≥ ₹9 Cr", "12 Days") stay. */
function bandDisplay(rec,b){
  const raw=(b&&b.raw!=null)?String(b.raw):'';
  if(rec&&rec.metricType==='Percentage'&&/^-?\d*\.?\d+$/.test(raw.trim())&&b.num!=null)return pctStr(b.num);
  return raw||'—';
}

function backend(){return (typeof google!=='undefined'&&google.script&&google.script.run)?google.script.run:null;}
function call(fn,payload){return new Promise((resolve,reject)=>{const b=backend();if(!b){reject({__offline:true});return;}b.withSuccessHandler(resolve).withFailureHandler(reject)[fn](payload);});}

const APP={boot:null,mode:'mgmt',view:'overview',ctx:{},meId:null,tab:'',expanded:{},navOpen:{},filters:{dept:'',subTeam:'',status:'',search:''},table:{sort:'employee',dir:1,page:0,per:14},period:''};
function B(){return APP.boot;}
function TH(){return B().settings.thresholds;}

async function boot(){
  drawBrand();restoreRail();showState('loading');
  try{const b=await call('apiBootstrap',{period:APP.period||undefined});
    if(!b){showState('error','No response from the backend.');return;}
    if(!b.ok||b.connected===false){showState('error',b.error||'Could not connect to the Google Sheet.');return;}
    applyBoot(b);
  }catch(e){if(e&&e.__offline){showState('offline');return;}showState('error',(e&&e.message)||String(e));}
}
function applyBoot(b){APP.boot=b;APP.period=b.period||APP.period;if(!APP.meId)APP.meId=guessMe(b);buildChrome();render();}
window.__applyBoot=applyBoot;window.__boot=boot;
function guessMe(b){const em=(b.user&&b.user.email||'').split('@')[0].replace(/[._]+/g,' ').trim().toLowerCase();if(!em)return null;let best=null;(b.employees||[]).forEach(e=>{const n=e.name.toLowerCase();if(n===em||em.indexOf(n)>=0||n.indexOf(em)>=0)best=best||e.id;});return best;}

/* ---------------- data helpers ---------------- */
function recById(id){return B().records.find(r=>r.kpiId===id);}
function empById(id){return B().employees.find(e=>e.id===id);}
function deptById(id){return B().departments.find(d=>d.id===id);}
function subById(id){return B().subTeams.find(s=>s.id===id);}
function recordsForEmp(id){return B().records.filter(r=>r.employeeId===id);}
function deptSubTeams(id){return B().subTeams.filter(s=>s.deptId===id);}
function deptEmployees(id){return B().employees.filter(e=>e.deptId===id);}
function withData(rs){return rs.filter(r=>r.rating!=null);}

/* ── navigation history ───────────────────────────────────────────────────────
   Breadcrumbs alone left no way back from a drill-down (and they are hidden on
   narrow screens). A real stack records where you came from, so Back always
   returns to the exact previous state — same view, same context, same tab, same
   table page — rather than guessing a parent. The browser/OS back gesture is
   wired to the same stack via history.pushState.                              */
const NAVSTACK=[];
const NAV_MAX=40;
function navSnapshot(){return {view:APP.view,ctx:APP.ctx,tab:APP.tab,mode:APP.mode,page:APP.table.page};}
function navSame(a,b){return a&&b&&a.view===b.view&&JSON.stringify(a.ctx||{})===JSON.stringify(b.ctx||{})&&a.tab===b.tab;}
function go(v,ctx,opts){
  if(v==='me'&&!APP.meId)v='pickme';
  const next={view:v,ctx:ctx||{},tab:'',mode:(v==='me'||v==='mykpis'||v==='pickme')?'me':'mgmt',page:0};
  const prev=navSnapshot();
  // record where we came from, unless this is a Back/replace or a no-op re-render
  if(!(opts&&opts.replace)&&APP.view&&!navSame(prev,next)){
    NAVSTACK.push(prev);
    if(NAVSTACK.length>NAV_MAX)NAVSTACK.shift();
    try{history.pushState({d:NAVSTACK.length},'',location.href);}catch(e){}
  }
  APP.mode=next.mode;APP.view=v;APP.ctx=next.ctx;APP.table.page=0;APP.tab='';
  buildChrome();scrollTop();closeNav();render();
}
/* Back: a modal is the top-most layer, so close that first. */
function goBack(){
  if($('#mo')&&$('#mo').classList.contains('on')){moBack();return;}
  const s=NAVSTACK.pop();
  if(!s){go('overview',{},{replace:true});return;}
  APP.mode=s.mode||'mgmt';APP.view=s.view;APP.ctx=s.ctx||{};APP.tab=s.tab||'';APP.table.page=s.page||0;
  buildChrome();scrollTop();closeNav();render();
}

/* SVG trend line (rating 1..5 over periods) */
function trendChart(series,opts){
  opts=opts||{};const W=opts.w||600,H=opts.h||150,pad={l:26,r:14,t:16,b:26};
  const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b,n=series.length;
  const idx=series.map((p,i)=>({i,v:p.rating,period:p.period})).filter(p=>p.v!=null);
  if(!idx.length)return '<div class="empty" style="padding:24px">No trend data for these periods yet.</div>';
  const x=i=>pad.l+(n<=1?iw/2:iw*i/(n-1));
  const y=v=>pad.t+ih*(1-(clamp(v,1,5)-1)/4);
  const th=TH();
  let g='';
  [1,2,3,4,5].forEach(v=>{g+='<line class="grid" x1="'+pad.l+'" y1="'+y(v)+'" x2="'+(W-pad.r)+'" y2="'+y(v)+'" opacity="'+(v===1?.9:.5)+'"/>';g+='<text class="yl" x="'+(pad.l-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>';});
  g+='<line class="thr" x1="'+pad.l+'" y1="'+y(th.onTrack)+'" x2="'+(W-pad.r)+'" y2="'+y(th.onTrack)+'"/>';
  const line=idx.map((p,k)=>(k?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=line+' L'+x(idx[idx.length-1].i).toFixed(1)+' '+(pad.t+ih)+' L'+x(idx[0].i).toFixed(1)+' '+(pad.t+ih)+' Z';
  let pts='';idx.forEach((p,k)=>{const cur=k===idx.length-1;pts+='<circle class="pt'+(cur?' cur':'')+'" cx="'+x(p.i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(cur?4:3)+'"/>';if(cur)pts+='<text class="vlab" x="'+x(p.i).toFixed(1)+'" y="'+(y(p.v)-9).toFixed(1)+'" text-anchor="middle">'+ratingStr(p.v)+'</text>';});
  let xl='';series.forEach((p,i)=>{xl+='<text class="xl" x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(periodShort(p.period))+'</text>';});
  return '<svg class="trend" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="tgr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>'+g+'<path class="area" d="'+area+'" fill="url(#tgr)"/><path class="ln" d="'+line+'"/>'+pts+xl+'</svg>';
}
/* native-unit sparkline for one KPI (actual over periods) */
function kpiSpark(rec){
  const hist=(rec.history||[]).map(h=>({period:h.period,v:rec.qualitative?h.rating:h.actual})).filter(h=>h.v!=null);
  if(hist.length<2)return '';
  const W=520,H=96,pad={l:8,r:8,t:14,b:20};const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const vals=hist.map(h=>h.v),mn=Math.min(...vals),mx=Math.max(...vals),sp=mx-mn||1;
  const all=rec.history.map((h,i)=>({i,v:rec.qualitative?h.rating:h.actual,period:h.period}));
  const n=all.length,x=i=>pad.l+(n<=1?iw/2:iw*i/(n-1)),y=v=>pad.t+ih*(1-(v-mn)/sp);
  const idx=all.filter(p=>p.v!=null);
  const line=idx.map((p,k)=>(k?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  let pts='';idx.forEach((p,k)=>{const cur=k===idx.length-1;pts+='<circle class="pt'+(cur?' cur':'')+'" cx="'+x(p.i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(cur?3.6:2.6)+'"/>';});
  let xl='';all.forEach((p,i)=>{xl+='<text class="xl" x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(periodShort(p.period))+'</text>';});
  const first=idx[0].v,last=idx[idx.length-1].v;
  return '<svg class="trend" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:96px"><path class="ln" style="stroke-width:2" d="'+line+'"/>'+pts+xl+'</svg>';
}

/* type-adaptive Target 1–5 ladder */
function ladder(rec){
  if(!rec.bands||!rec.bands.length)return '';
  const active=rec.rating==null?-1:clamp(Math.round(rec.rating),1,rec.bands.length)-1;
  const meetsIdx=rec.bands.length>=3?2:Math.floor(rec.bands.length/2);
  const cells=rec.bands.map((b,i)=>{const on=i===active;const g='g'+(i+1);const disp=bandDisplay(rec,b);const inner=rec.qualitative?'<div class="qd"></div>':'<div class="lbv" title="'+esc(b.raw||'')+'">'+esc(disp)+'</div>';return '<div class="lb '+g+(on?' on':'')+(i===meetsIdx?' meets':'')+'"><div class="lbn">'+esc(b.label?shortBand(b.label):(i+1)+'')+'</div>'+inner+'</div>';}).join('');
  const typ=rec.metricType||(rec.qualitative?'Qualitative':'Number');
  const dir=rec.qualitative?'manual assessment':dirLabel(rec.directionKey).toLowerCase();
  let mark='';
  if(!rec.qualitative&&rec.rating!=null&&rec.bands.length>1){const pos=clamp((rec.rating-1)/(rec.bands.length-1)*100,0,100);mark='<div class="ladder-mark"><div class="tk" style="left:'+pos+'%"></div></div>';}
  let act='';
  if(rec.hasActual&&rec.actual!=null&&!rec.qualitative)act='<div class="ladder-act">Actual <b>'+esc(fmtVal(rec,rec.actual))+'</b> lands in <b>'+esc(rec.achievedBand||'—')+'</b> → rating <b>'+ratingStr(rec.rating)+'</b>'+(rec.attainment!=null?' · '+pct(rec.attainment)+' of target':'')+'</div>';
  else if(rec.qualitative&&rec.rating!=null)act='<div class="ladder-act">Manual rating <b>'+ratingStr(rec.rating)+'</b> → <b>'+esc(rec.achievedBand||'—')+'</b></div>';
  return '<div class="ladder">'+cells+'</div>'+mark+'<div class="ladder-cap"><span>'+esc(typ)+' · '+esc(dir)+'</span><span>Band '+(meetsIdx+1)+' = Meets</span></div>'+act;
}
function shortBand(l){l=String(l);const m=l.match(/\((\d)\)/);if(m)return m[1];const t=l.replace(/target\s*/i,'T').match(/T\s*\d/i);if(t)return t[0].replace(/\s/g,'');if(/needs/i.test(l))return '1';if(/below/i.test(l))return '2';if(/meets/i.test(l))return '3';if(/above/i.test(l))return '4';if(/exceeds/i.test(l))return '5';return l.slice(0,7);}

/* next-milestone for a rated KPI */
function nextMilestone(r){
  if(r.rating==null||!r.bands||!r.bands.length)return null;
  const curIdx=clamp(Math.round(r.rating),1,r.bands.length)-1;
  const up=curIdx+1;
  if(up>=r.bands.length)return {done:true,r:r};
  const band=r.bands[up];
  let gap=null;
  if(!r.qualitative&&band.num!=null&&r.actual!=null)gap=Math.round(Math.abs(band.num-r.actual)*100)/100;
  return {done:false,r:r,band:band,toRating:up+1,gap:gap,target:band.num};
}
function milestoneCard(r){
  const m=nextMilestone(r);if(!m)return '';
  const impact=r.weightShown!=null&&r.weightShown>=25?'High impact':(r.weightShown!=null&&r.weightShown>=15?'Medium impact':'Low impact');
  if(m.done)return '<div class="ms done" data-rec="'+r.kpiId+'" style="cursor:pointer"><div class="ms-h"><div class="ms-t">'+esc(r.kpi||r.kra)+'<small>Top band reached — hold the line</small></div><div class="r">'+rchip(r.rating,r.status)+'</div></div></div>';
  const p=clamp((r.rating-1)/4*100,0,100);
  const gapTxt=m.gap!=null?('<b>'+fmtVal(r,m.gap)+'</b> to go'):('reach '+esc(shortBand(m.band.label||'')));
  return '<div class="ms" data-rec="'+r.kpiId+'" style="cursor:pointer"><div class="ms-h"><div class="ms-t">'+esc(r.kpi||r.kra)+'<small>Next: '+esc(m.band.label||('Band '+m.toRating))+(m.band.raw?' ('+esc(m.band.raw)+')':'')+'</small></div><div class="r">'+rchip(r.rating,r.status)+'</div></div>'
    +'<div class="ms-track"><span style="width:'+p+'%"></span></div>'
    +'<div class="ms-foot"><span>'+gapTxt+'</span><span>·</span><span><b>'+(r.weightShown==null?'—':n1(r.weightShown)+'%')+'</b> weight</span><span>·</span><span>'+impact+'</span></div></div>';
}

/* priority = gap-below-target × weight (business relevance) */
/* What management should act on first.
 * gap × weight alone produced ties — every Plastic GMV line scored exactly 1.0,
 * so the list showed six identical rows and told you nothing. Two changes:
 *   • carry the SHORTFALL in the KPI's own unit (target − actual), which is the
 *     number a manager actually acts on, and break ties on it;
 *   • collapse the same KPI repeating across a team into one row, so a systemic
 *     miss reads as one problem with N people, not N problems.                */
function priorityRecords(base){
  const onT=TH().onTrack;
  return (base||B().records).filter(r=>r.rating!=null).map(r=>{
    const gap=Math.max(0,onT-r.rating);
    const w=r.weightShown!=null?r.weightShown:10;
    const tgt=r.planTarget!=null?r.planTarget:r.target;
    const shortfall=(tgt!=null&&r.actual!=null&&tgt>r.actual)?(tgt-r.actual):null;
    return {r,gap,w,shortfall,score:gap*(w/100)};
  }).filter(x=>x.gap>0.01)
    .sort((a,b)=>(b.score-a.score)||((b.shortfall||0)-(a.shortfall||0)));
}
/* Group by KPI × team so one systemic miss is one line. */
function priorityGroups(base,limit){
  const out=[],idx={};
  priorityRecords(base).forEach(x=>{
    const k=(x.r.kpi||x.r.kra)+'|'+x.r.department;
    if(!idx[k]){idx[k]={key:k,lead:x,n:0,shortfall:null,unit:x.r.unit,score:x.score};out.push(idx[k]);}
    const g=idx[k];g.n++;
    if(x.shortfall!=null)g.shortfall=(g.shortfall||0)+x.shortfall;
    if(x.score>g.score){g.score=x.score;g.lead=x;}
  });
  return out.sort((a,b)=>(b.score-a.score)||((b.shortfall||0)-(a.shortfall||0))).slice(0,limit||6);
}
/* "₹0.67 Cr short" / "12 MT short" / "3 short" — the actionable magnitude. */
function shortfallText(g){
  if(g.shortfall==null)return '';
  return tKpiVal(Math.round(g.shortfall*100)/100,g.unit)+' short';
}
function priorityWho(g){
  return g.n>1?(g.n+' people · '+esc(g.lead.r.department)):(esc(titleName(g.lead.r.employee))+' · '+esc(g.lead.r.department));
}
function priorityList(base,limit){
  const items=priorityRecords(base).slice(0,limit||6);
  if(!items.length)return '<div class="empty">Nothing below target — everyone is on track 🎉</div>';
  return items.map((x,i)=>{const r=x.r;const impact=x.w>=25?'High impact':(x.w>=15?'Medium':'Low');return '<div class="lrow" data-rec="'+r.kpiId+'"><span class="rank'+(i===0?' top':'')+'">'+(i+1)+'</span><div class="lrow-id"><span class="sdot s-'+r.status.k+'"></span><div class="lrow-name">'+esc(r.kpi||r.kra)+'<span class="lrow-sub">'+esc(titleName(r.employee))+' · '+esc(r.department)+(r.subTeam?' · '+esc(r.subTeam):'')+'</span></div></div><span class="tag">'+(r.weightShown==null?'—':n1(r.weightShown)+'% · '+impact)+'</span>'+rchip(r.rating,r.status)+'<span class="chev">›</span></div>';}).join('');
}
function moversList(movers,limit){
  const arr=(movers||[]).filter(m=>Math.abs(m.delta)>=0.01);
  if(!arr.length)return '<div class="empty">No period-over-period change to compare yet.</div>';
  const top=arr.slice(0,Math.ceil((limit||6)/2)),bottom=arr.slice(-Math.floor((limit||6)/2)).reverse().filter(b=>top.indexOf(b)<0);
  return top.concat(bottom).map(m=>'<div class="lrow" data-person="'+m.id+'"><div class="lrow-id"><div class="lavatar">'+initials(m.name)+'</div><div class="lrow-name">'+esc(titleName(m.name))+'<span class="lrow-sub">'+esc(m.department)+'</span></div></div>'+deltaChip(m.delta)+rchip(m.rating,m.status)+'<span class="chev">›</span></div>').join('');
}

/* ==================== DASHBOARD COMPONENTS ====================
   Form is chosen per job: a hero figure for the one headline number, a meter
   for a ratio against its limit, bars for magnitude on nominal categories
   (one ink — length carries the value, never a value-ramp on team names),
   an area line for change over time, columns for an ordered distribution.
   Every mark carries a hover tooltip through the shared `data-tip` layer. */

function tile(cls,label,body,opts){
  opts=opts||{};
  const right=opts.right?('<span class="r'+(opts.rightNav?' link':'')+'"'+(opts.rightNav?' data-nav="'+opts.rightNav+'"':'')+'>'+opts.right+'</span>'):'';
  const head=label?('<div class="tile-h"><span class="tlb">'+label+'</span>'+right+'</div>'):'';
  const attr=opts.nav?(' data-nav="'+opts.nav+'"'):(opts.attr||'');
  const tone=opts.tone?(' tn-'+opts.tone):'';
  return '<div class="tile '+cls+tone+(opts.pad0?' pad0':'')+(attr?' clickable':'')+'"'+attr+'>'+head+body+'</div>';
}

/* The single number the view leads with. Exactly one per dashboard. */
function heroTile(score,rating,status,delta,note){
  const has=score!=null;
  return tile('t4','Overall performance',
    '<div class="hero">'+radialMeter(score)+
    '<div class="hero-side"><div class="hero-fig">'+(has?n1(score)+'<span class="u">%</span>':'<span class="hero-blank">—</span>')+'</div>'+
    '<div class="hero-meta">'+(has?statusPill(status):'<span class="pill none">Awaiting actuals</span>')+
    (rating!=null?'<span class="tag">'+ratingStr(rating)+' / 5</span>':'')+
    (delta!=null?deltaChip(delta):'')+'</div>'+
    (note?'<div class="hero-note">'+note+'</div>':'')+'</div></div>');
}
/* A ratio against its limit. Track is a lighter step of the same ramp. */
function radialMeter(score){
  const p=score==null?0:clamp(score,0,100)/100;
  const r=32,C=2*Math.PI*r,sweep=.75;
  return '<svg viewBox="0 0 84 84" style="width:84px;height:84px;flex:0 0 84px" aria-hidden="true">'
    +'<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="var(--line-soft)" stroke-width="8" stroke-linecap="round"'
    +' stroke-dasharray="'+(C*sweep).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(135 42 42)"/>'
    +(score==null?'':'<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="var(--brand)" stroke-width="8" stroke-linecap="round"'
    +' stroke-dasharray="'+(C*sweep*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(135 42 42)"/>')
    +'</svg>';
}
/* Title-case ALL-CAPS sheet names for display (AMIT JHA -> Amit Jha), leaving
   already-mixed names alone. Keys/ids are untouched — this is display only. */
function titleName(s){s=String(s||'');if(!/[a-z]/.test(s))return s.toLowerCase().replace(/\b([a-z])/g,(m,c)=>c.toUpperCase());return s;}
/* Inline "Lead: Name" chip for a team's sub-header. */
function leadChip(d){
  if(!d||!d.lead)return '';
  const nm=titleName(d.lead);
  return (d.leadEmployeeId?'<span class="lead-chip" data-person="'+d.leadEmployeeId+'">':'<span class="lead-chip static">')
    +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg>Lead · <b>'+esc(nm)+'</b></span> · ';
}
/* A dedicated Team lead tile for the team dashboard. */
function leadTile(d){
  const nm=titleName(d.lead||'—');
  const sub=d.leadResolved?esc(titleName(d.leadRole||'Team Lead')):'declared lead'+(d.lead?' · not in this sheet':'');
  const inner='<div class="lead-tile"><div class="lavatar lg">'+initials(nm)+'</div><div style="min-width:0">'
    +'<div class="lt-name">'+esc(nm)+'</div><div class="lt-role">'+sub+'</div></div></div>';
  return tile('t2','Team lead',inner,d.leadEmployeeId?{attr:'data-person="'+d.leadEmployeeId+'"'}:{});
}
/* Stat tile: label · value · delta · optional sparkline. */
function statTile(span,label,value,unit,sub,opts){
  opts=opts||{};
  const v='<div class="v">'+value+(unit?'<span class="u">'+unit+'</span>':'')+(opts.delta!=null?deltaChip(opts.delta):'')+'</div>';
  const meter=opts.meter!=null?('<div class="meter'+(opts.sm?' sm':'')+'"><span style="width:'+clamp(opts.meter,0,100)+'%"></span></div>'):'';
  const spark=opts.trend&&opts.trend.length>1?('<div class="spark">'+sparkMini(opts.trend)+'</div>'):'';
  return tile(span||'t2',label,'<div class="stat">'+v+(sub?'<div class="sub">'+sub+'</div>':'')+meter+spark+'</div>',opts);
}
/* 12-point sparkline; history in the de-emphasis step, current in the accent. */
function sparkMini(series){
  const pts=(series||[]).map(p=>p.rating==null?null:p.rating);
  const idx=pts.map((v,i)=>({v,i})).filter(p=>p.v!=null);
  if(idx.length<2)return '';
  const W=100,H=26,mn=Math.min(...idx.map(p=>p.v)),mx=Math.max(...idx.map(p=>p.v)),sp=(mx-mn)||1;
  const x=i=>pts.length<=1?W/2:(i/(pts.length-1))*W;
  const y=v=>3+(H-6)*(1-(v-mn)/sp);
  const d=idx.map((p,k)=>(k?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const last=idx[idx.length-1];
  return '<svg class="sparksvg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><path class="sl" d="'+d+'"/>'
    +'<circle class="sd" cx="'+x(last.i).toFixed(1)+'" cy="'+y(last.v).toFixed(1)+'" r="2.4"/></svg>';
}
/* Change over time. One series, so no legend — the tile label names it. */
function areaChart(series,opts){
  opts=opts||{};
  const H=opts.h||150,W=560,pad={l:26,r:10,t:12,b:20};
  const all=(series||[]).map((p,i)=>({i,period:p.period,v:p.rating,score:p.score}));
  const idx=all.filter(p=>p.v!=null);
  if(idx.length<2)return '<div class="empty">Not enough periods to plot a trend yet.</div>';
  const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const x=i=>pad.l+(all.length<=1?iw/2:iw*i/(all.length-1));
  const y=v=>pad.t+ih*(1-(clamp(v,1,5)-1)/4);
  let g='';[1,2,3,4,5].forEach(v=>{g+='<line class="grid" x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/>'
    +'<text class="axis" x="'+(pad.l-7)+'" y="'+(y(v)+3.2).toFixed(1)+'" text-anchor="end">'+v+'</text>';});
  const line=idx.map((p,k)=>(k?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=line+' L'+x(idx[idx.length-1].i).toFixed(1)+' '+(pad.t+ih)+' L'+x(idx[0].i).toFixed(1)+' '+(pad.t+ih)+' Z';
  let pts='',xl='',bands='';
  idx.forEach((p,k)=>{pts+='<circle class="pt'+(k===idx.length-1?' cur':'')+'" cx="'+x(p.i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(k===idx.length-1?4:3)+'"/>';});
  all.forEach(p=>{xl+='<text class="axis" x="'+x(p.i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+esc(periodShort(p.period))+'</text>';});
  const bw=all.length>1?iw/(all.length-1):iw;
  all.forEach(p=>{
    const tip=p.v==null?(periodLong(p.period)+' · no data'):(periodLong(p.period)+' · '+n1(p.score)+'% · '+ratingStr(p.v)+'/5');
    bands+='<g class="band"><line class="cross" x1="'+x(p.i).toFixed(1)+'" x2="'+x(p.i).toFixed(1)+'" y1="'+pad.t+'" y2="'+(pad.t+ih)+'"/>'
      +'<rect class="hit" x="'+(x(p.i)-bw/2).toFixed(1)+'" y="'+pad.t+'" width="'+bw.toFixed(1)+'" height="'+ih+'" data-tip="'+esc(tip)+'"/></g>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">'
    +g+'<path class="ar" d="'+area+'"/><path class="ln" d="'+line+'"/>'+pts+xl+bands+'</svg>';
}
/* Magnitude on nominal categories: one ink for every bar, length is the value. */
function dRow(name,sub,value,unit,pct01,attr,delta,opts){
  opts=opts||{};
  return '<div class="drow'+(opts.wide?' wide':'')+'"'+(attr||'')+' data-tip="'+esc(name+(sub?' · '+sub:'')+' · '+(value==null?'no data':value+(unit||'')))+'">'
    +'<div class="nm">'+esc(name)+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'
    +'<div class="bar"><i style="width:'+clamp(pct01*100,0,100).toFixed(1)+'%"></i></div>'
    +(delta!=null?'<span class="d">'+deltaChip(delta)+'</span>':'')
    +'<div class="val">'+(value==null?'—':value)+(unit?'<small>'+unit+'</small>':'')+'</div></div>';
}
/* Ordered categories (performance tiers) — an ordinal scale is legitimate here. */
/* Each column IS a status bin, so it carries that status's colour — a flat
 * black ramp made the reader match bar to legend by position alone. */
const BARC={bad:'var(--bar-bad)',warn:'var(--bar-warn)',good:'var(--bar-good)',strong:'var(--bar-strong)',elite:'var(--bar-elite)'};
function distCols(bins){
  const max=Math.max(1,...bins.map(b=>b.n));
  return '<div class="cols">'+bins.map(b=>{
    const h=b.n===0?2:clamp(b.n/max*100,10,100);
    const c=BARC[b.k]||'var(--ink)';
    return '<div class="ccol'+(b.n?'':' dim')+'" data-tip="'+esc(b.n+' '+(b.n===1?'person':'people')+' · '+b.label)+'">'
      +'<div class="cbar" style="height:'+h+'%;--cbar:'+c+'">'+(b.n?'<b>'+b.n+'</b>':'')+'</div>'
      +'<div class="clab">'+esc(b.short||b.label)+'</div></div>';
  }).join('')+'</div>';
}

/* ---------------- OVERVIEW (management) ----------------
   The dashboard. One hero figure, a dense tile grid, and a form per job —
   not a document with a paragraph on top. */
function vOverview(){
  const o=B().rollups.org, hasData=o.kpisWithData>0;
  const depts=perfDepts(), rv=B().rollups.reviews||{pending:0,complete:0,total:0,progress:0};

    <div class="r"><span class="link" data-nav="reports">Reports ›</span></div></div>`;

  // Blank state keeps the FULL card format — every tile, the modal, and the
  // defined framework (teams, members, KRAs/KPIs) are shown; only the measured
  // values stay empty until the backend sheet is connected.
  const banner=hasData?'':`<div class="banner"><div class="bi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h16M12 4v16"/></svg></div>
    <div><div class="bt">Awaiting the backend sheet</div>
    <div class="bs">The framework — teams, roles, KRAs/KPIs and the 5-band rubric — is loaded. Performance fills in every card below once the data source is connected.</div></div></div>`;

  // magnitude on nominal categories: identical ink, length carries the value
  const maxTeam=Math.max(1,...depts.map(d=>d.score||0));
  const teamRows=depts.slice().sort((a,b)=>(b.score||0)-(a.score||0))
    .map(d=>dRow(d.name,d.employeeCount+(d.employeeCount===1?' person':' people'),
      d.score==null?null:n1(d.score),'%',(d.score||0)/maxTeam,' data-dept="'+d.id+'"',d.delta)).join('');

  const perspRows=(B().perspectives||[]).slice(0,6).map(p=>
    dRow(p.perspective,p.kpis+' KPIs',p.score==null?null:n1(p.score),'%',(p.score||0)/100,' data-persp="'+esc(p.perspective)+'"')).join('');

  // ordered tiers -> an ordinal distribution, read left (weakest) to right
  const scale=SCALE().slice().sort((a,b)=>a.min-b.min);
  const bins=scale.map(s=>({label:s.label,short:s.label,k:s.key,
    n:B().employees.filter(e=>e.rating!=null&&e.status.k===s.key).length}));

  const priority=priorityGroups(null,6);
  const priorityRows=priority.length?priority.map(g=>{const r=g.lead.r;const sf=shortfallText(g);
    return `<tr data-rec="${r.kpiId}"><td class="nm"><span class="sdot s-${r.status.k}"></span> ${esc(r.kpi||r.kra)}<small>${priorityWho(g)}</small></td>
      <td class="n">${sf||(r.weightShown==null?'—':n1(r.weightShown)+'%')}</td><td class="n">${r.rating==null?'—':ratingStr(r.rating)}</td></tr>`;
  }).join(''):'<tr><td class="empty" colspan="3">'+(hasData?'Nothing below target.':'Awaiting the backend sheet.')+'</td></tr>';

  const movers=(o.movers||[]).filter(m=>Math.abs(m.delta)>=.01);
  const moverRows=movers.length?movers.slice(0,3).concat(movers.slice(-3).reverse().filter(m=>movers.slice(0,3).indexOf(m)<0)).map(m=>
    `<tr data-person="${m.id}"><td class="nm">${esc(titleName(m.name))}<small>${esc(m.department)}</small></td>
      <td class="n">${deltaChip(m.delta)}</td><td class="n">${m.score==null?'—':n1(m.score)+'%'}</td></tr>`).join('')
    :'<tr><td class="empty" colspan="3">'+(hasData?'No period-over-period change yet.':'Awaiting the backend sheet.')+'</td></tr>';

  return head+banner
  +band('Where we stand')
  +`<div class="dash">
    ${heroTile(o.score,o.rating,o.status,o.delta,
      hasData?(o.kpisWithData+' scored KPIs'+(o.previousPeriod?' · vs '+prev:'')):'Awaiting the backend sheet.')}
    ${statTile('t2','Employees on track',n1(o.peopleOnTrackPct),'%',o.onTrack+' of '+o.peopleWithData+' rated',{meter:o.peopleOnTrackPct,nav:'employees',tone:'peri'})}
    ${statTile('t2','KPIs on track',n1(o.recOnTrackPct),'%',o.recOnTrack+' of '+o.kpisWithData+' scored',{meter:o.recOnTrackPct,nav:'records',tone:'blue'})}
    ${statTile('t2','KPIs below target',String(o.recAtRisk+o.recOffTrack),'',o.recAtRisk+' at risk · '+o.recOffTrack+' off track',{nav:'records',tone:(o.recAtRisk+o.recOffTrack)?'amber':'green'})}
    ${statTile('t2','Reviews pending',String(rv.pending),'',rv.total?rv.complete+' of '+rv.total+' complete':'no reviews yet',{meter:rv.progress,nav:'reviews',tone:rv.pending?'violet':'green'})}
  </div>`
  +band('How it breaks down')
  +`<div class="dash">
    ${tile('t7','Performance trend',areaChart(o.trend,{h:150}),{right:o.delta!=null?(o.delta>0?'▲':'▼')+' vs '+prev:'rating / 5'})}
    ${tile('t5','Team performance','<div>'+(teamRows||'<div class="empty">No teams.</div>')+'</div>',{right:'score / 100'})}
    ${tile('t5','Perspective performance','<div>'+(perspRows||'<div class="empty">No perspectives tagged.</div>')+'</div>',{right:'All ›',rightNav:'perspectives'})}
    ${tile('t3','Performance distribution',distCols(bins),{right:o.peopleWithData+' rated'})}
    ${tile('t4','Coverage','<div class="stat"><div class="v">'+n1(o.coverage)+'<span class="u">%</span></div><div class="sub">'+o.kpisWithData+' of '+o.kpis+' KPIs have '+esc(periodShort(APP.period))+' actuals</div><div class="meter"><span style="width:'+clamp(o.coverage,0,100)+'%"></span></div></div>',{nav:'checkins',tone:'mint'})}
  </div>`
  +band('What needs attention')
  +`<div class="dash">
    ${tile('t6','Priority actions','<table class="mini"><tbody>'+priorityRows+'</tbody></table>',{right:'by shortfall'})}
    ${tile('t6','Biggest movers','<table class="mini"><tbody>'+moverRows+'</tbody></table>',{right:o.previousPeriod?'vs '+prev:''})}
  </div>`;
}

}
function coverageRows(){

function perspBar(p){const r=p.rating,pp=r==null?0:clamp((r-1)/4*100,0,100);return `<div class="bc-row" data-persp="${esc(p.perspective)}"><div class="bc-label">${esc(p.perspective)}<small> · ${p.kpis} KPIs</small></div><div class="bc-track"><div class="bc-fill" style="width:${pp}%;background:${sc(p.status.k)}"></div></div><div class="bc-val" style="color:${sc(p.status.k)}">${p.score==null?'—':n1(p.score)+'<small>%</small>'}</div><span class="bc-chev">›</span></div>`;}

    ${statTile('t2','Pending updates',String(pending),'',withData(recs).length+' of '+recs.length+' updated',{meter:recs.length?withData(recs).length/recs.length*100:0,nav:'checkins',tone:pending?'amber':'green'})}

/* Ranked people, dense — the third drill-down level (spec §22). */
function peopleRows(emps){
  if(!emps.length)return '<div class="empty">No people mapped for this team.</div>';
  return emps.slice().sort((a,b)=>(b.score==null?-1:b.score)-(a.score==null?-1:a.score)).map(e=>
    dRow(titleName(e.name),[titleName(e.role),e.region].filter(Boolean).join(' · ')||e.department,
      e.score==null?null:n1(e.score),'%',(e.score||0)/100,' data-person="'+e.id+'"',e.delta,{wide:true})).join('');
}
function teamPerspectives(recs){
  const map={};recs.forEach(r=>{const p=r.perspective||r.kra||'General';const m=map[p]||(map[p]={sw:0,sr:0,n:0});m.n++;if(r.rating!=null&&r.weightNorm!=null){m.sw+=r.weightNorm;m.sr+=r.weightNorm*r.rating;}});
  const arr=Object.keys(map).map(k=>{const m=map[k];const r=m.sw>0?m.sr/m.sw:null;return {k,r,n:m.n,st:statusFromRating(r)};}).sort((a,b)=>(b.r==null?-1:b.r)-(a.r==null?-1:a.r));
  return arr.map(a=>{const p=a.r==null?0:clamp((a.r-1)/4*100,0,100);return `<div class="bc-row static"><div class="bc-label">${esc(a.k)}<small> · ${a.n}</small></div><div class="bc-track"><div class="bc-fill" style="width:${p}%;background:${sc(a.st.k)}"></div></div><div class="bc-val" style="color:${sc(a.st.k)}">${a.r==null?'—':ratingStr(a.r)}</div></div>`;}).join('')||'<div class="empty">No data.</div>';
}
function vInfoDept(d){

/* ---------------- GOALS & KPIs (spec §2, §21) ----------------
   The framework as a hierarchy: PERSPECTIVE → KRA → KPI. Not "KRA → KPI" —
   the workbook carries a real perspective layer above the KRA and the product
   preserves it. */
function vGoals(){
  const o=B().rollups.org;const hasData=o.kpisWithData>0;
  const ps=B().perspectives||[];
  const kraCount=new Set(B().records.map(r=>r.kra).filter(Boolean)).size;
  return `<div class="page-head"><h1>Goals &amp; KPIs</h1>
    <p><b>Perspective → KRA → KPI</b> · each with its own weightage and target bands.</p></div>
  <div class="kc-grid c4">
    ${kpiCard('Perspectives',String(ps.length),'role dimensions in use',{nav:'perspectives'})}
    ${kpiCard('KRAs',String(kraCount),'result areas defined',{})}
    ${kpiCard('KPI lines',String(o.kpis),o.kpisWithData+' with actuals',{nav:'records'})}
    ${kpiCard('Definitions',String((B().library||[]).length),'distinct KPIs in the library',{nav:'library'})}
  </div>
  <div class="linkrow" style="margin-top:16px"><span class="link" data-nav="records">Full KPI table →</span><span class="link" data-nav="kpianalysis">Compare a KPI across teams →</span><span class="link" data-nav="library">KRA / KPI library →</span></div>
  <div class="sect-t">Perspective → KRA → KPI${hasData?'<span class="r">score · rating / 5</span>':''}</div>
  <div style="margin-top:4px">${perspectiveExpand()}</div>`;
}
function perspectiveExpand(){
  return B().perspectives.map(p=>{
    const recs=B().records.filter(r=>(r.perspective||r.kra||'General')===p.perspective);
    const byKra={};recs.forEach(r=>{const k=r.kra||'General';(byKra[k]=byKra[k]||[]).push(r);});
    const pp=p.rating==null?0:clamp((p.rating-1)/4*100,0,100);
    let rows='';
    Object.keys(byKra).forEach(k=>{
      const g=byKra[k];const wd=withData(g);const r=wd.length?wd.reduce((s,x)=>s+x.rating,0)/wd.length:null;const st=statusFromRating(r);
      const key=slugKey(p.perspective+'|'+k);const open=!!APP.expanded[key];
      const rp=r==null?0:clamp((r-1)/4*100,0,100);
      const owners=new Set(g.map(x=>x.employeeId)).size;
      const wsum=g.reduce((s,x)=>s+(x.weightShown||0),0);
      /* weightage only sums within one scorecard; across people show the average */
      const wt=!wsum?'':(owners===1?' · '+n1(wsum)+'% weight':' · '+owners+' people · avg '+n1(wsum/owners)+'% weight');
      rows+='<div class="exp-kra'+(open?' open':'')+'" data-exp="'+esc(key)+'"><span class="sdot s-'+st.k+'"></span><div class="exp-name">'+esc(k)+'<small>'+g.length+' KPI'+(g.length===1?'':'s')+wt+'</small></div><div class="bar"><span style="width:'+rp+'%"></span></div><div class="exp-val">'+(r==null?'—':n1(scoreFromRating(r))+'<small>%</small>')+'</div><span class="exp-chev">'+(open?'▾':'▸')+'</span></div>';
      if(open)rows+='<div class="exp-kpis">'+g.slice().sort((a,b)=>(a.rating==null?99:a.rating)-(b.rating==null?99:b.rating)).map(r2=>'<div class="exp-kpi" data-rec="'+r2.kpiId+'"><span class="sdot s-'+r2.status.k+'"></span><div class="exp-name">'+esc(r2.kpi||r2.kra)+'<small>'+esc(r2.employee)+' · '+esc(r2.department)+(r2.weightShown!=null?' · '+n1(r2.weightShown)+'%':'')+'</small></div><div class="exp-val">'+(r2.actual==null?'':esc(fmtVal(r2,r2.actual)))+'</div>'+rchip(r2.rating,r2.status)+'<span class="chev">›</span></div>').join('')+'</div>';
    });
    return '<div class="exp-p"><div class="exp-ph"><div class="exp-pt">'+esc(p.perspective)+'<small> · '+p.kpis+' KPIs · '+p.people+' people</small></div><div class="bar wide"><span style="width:'+pp+'%"></span></div><div class="exp-pr">'+(p.score==null?'—':n1(p.score)+'<small>%</small>')+(p.rating!=null?'<span class="rt-sub">'+ratingStr(p.rating)+'/5</span>':'')+'</div></div>'+rows+'</div>';
  }).join('')||'<div class="empty">No perspectives tagged in the sheet.</div>';
}
function slugKey(s){return String(s).replace(/[^a-z0-9]+/gi,'_').toLowerCase();}

function vPerspective(){

  const cards=`<div class="kc-grid c4">

    ${kpiCard('Owners',String(recs.length),Object.keys(byTeam).length+' teams',{})}
    ${kpiCard('Metric type',esc(mt||'—'),unit?esc(unit):'from rule layer',{})}
    ${kpiCard('With actuals',String(wd.length),pct(recs.length?wd.length/recs.length*100:0)+' coverage',{tone:'none'})}
  </div>
  <div class="two-eq">

    <div class="panel pad"><div class="panel-h"><h3>Owners</h3><span class="sub">ranked</span></div><div class="list stack" style="margin-top:2px">${owners.map(r=>`<div class="lrow" data-rec="${r.kpiId}"><div class="lrow-id"><div class="lavatar">${initials(r.employee)}</div><div class="lrow-name">${esc(titleName(r.employee))}<span class="lrow-sub">${esc(r.department)}${r.subTeam?' · '+esc(r.subTeam):''}</span></div></div><span class="lrow-meta">${r.actual==null?'—':esc(fmtVal(r,r.actual))}</span>${rchip(r.rating,r.status)}<span class="chev">›</span></div>`).join('')}</div></div>

/* Spec §25 — the whole picture on one screen: performance by perspective, then
 * every KPI with actual / rating / weight / status, then recent check-ins and
 * where the review stands. */
function personSummary(e,recs){
  const persp=e.perspectives||[];
  const log=(B().checkins||[]).filter(c=>c.period===APP.period&&recs.some(r=>r.kpiId===c.kpiId)).slice(0,6);
  const rv=e.review||{status:'Not Started'};
  /* The full chain, left to right, in the order management reads it:
     KRA · KPI → Weight → Target → Actual → Achievement % → Rating → Points →
     Status. Target and Achievement were missing, which broke the chain at the
     one place it matters most — the individual's scorecard. */
  const rows=recs.slice().sort((a,b)=>(b.weightShown||0)-(a.weightShown||0)).map(r=>{
    const tgt=r.planTarget!=null?r.planTarget:r.target;
    return `<tr data-rec="${r.kpiId}">
    <td class="kname">${esc(r.kpi||r.kra||'—')}<small>${esc([r.perspective,r.kra].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(' · '))}</small></td>
    <td class="num">${r.weightShown==null?'—':n1(r.weightShown)+'%'}</td>
    <td class="num">${tgt==null?'—':esc(fmtVal(r,tgt))}</td>
    <td class="num">${r.actual==null?'—':esc(fmtVal(r,r.actual))}</td>
    <td class="num">${achCell(r.attainment,r.status&&r.status.k,tgt==null?'':'Target '+fmtVal(r,tgt))}</td>
    <td class="num" style="font-weight:800">${r.rating==null?'—':ratingStr(r.rating)+'<small>/5</small>'}</td>
    <td class="num">${r.points==null?'—':n1(r.points)}</td>
    <td>${statusPill(r.status)}</td></tr>`;}).join('');
  return `<div class="two-eq">
    <div class="panel pad"><div class="panel-h"><h3>Performance by perspective</h3><span class="sub">what drives the score</span></div>
      <div class="stack" style="margin-top:6px">${persp.map(groupBar).join('')||'<div class="empty">No perspectives tagged.</div>'}</div>
      <div class="sect-t" style="margin-top:16px">By KRA</div>
      <div class="stack">${(e.kras||[]).slice(0,8).map(groupBar).join('')||'<div class="empty">No KRAs tagged.</div>'}</div></div>
    <div class="panel pad"><div class="panel-h"><h3>Recent check-ins</h3><span class="sub">${esc(periodLong(APP.period))}</span><div class="r"><span class="link" data-nav="checkins">All ›</span></div></div>
      <div class="list stack" style="margin-top:4px">${log.length?log.map(checkinRow).join(''):'<div class="empty">No check-ins yet this period.</div>'}</div>
      <div class="sect-t" style="margin-top:16px">Performance review</div>
      <div class="rv-state" data-review="${e.id}">
        ${['Self Review','Manager Review','Final Review'].map(l=>{
          const done=['Manager Review','Final Review','Complete'].indexOf(rv.status)>=['Self Review','Manager Review','Final Review'].indexOf(l)+1||rv.status==='Complete';
          const active=rv.status===l;
          return '<div class="rv-line"><span class="rv-dot '+(done?'done':(active?'active':''))+'">'+(done?'✓':'')+'</span><span>'+esc(l)+'</span><span class="rv-st">'+(done?'Done':(active?'In progress':'Not started'))+'</span></div>';
        }).join('')}
      </div></div>
  </div>
  <div class="sect-t">All KPIs<span class="r">weight → target → actual → achievement → rating → points</span></div>
  <div class="panel pad"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>KRA · KPI</th><th class="num">Weight</th><th class="num">Target</th><th class="num">Actual</th><th class="num">Achieved</th><th class="num">Rating</th><th class="num">Points</th><th>Status</th></tr></thead>
  <tbody>${rows||'<tr><td colspan="8" class="empty">No KPIs mapped.</td></tr>'}
  ${e.points!=null?'<tr class="tot"><td colspan="6" style="text-align:right">Overall</td><td class="num">'+n1(e.points)+'</td><td>'+statusPill(e.status)+'</td></tr>':''}</tbody></table></div></div>`;
}
function personScorecard(e,recs){
  const bySub={};recs.forEach(r=>{const k=r.subTeamId||'__';(bySub[k]=bySub[k]||[]).push(r);});
  let body='';
  Object.keys(bySub).forEach(sk=>{
    const list=bySub[sk];const s=sk==='__'?null:subById(sk);
    if(s)body+=`<div class="sect-t">${esc(s.name)} scorecard<span class="r">${s.rating==null?'':ratingStr(s.rating)+' / 5'}</span></div>`;
    const byKra={};list.forEach(r=>{const kk=r.kra||r.perspective||'General';(byKra[kk]=byKra[kk]||[]).push(r);});
    Object.keys(byKra).forEach(kk=>{
      const grp=byKra[kk];const wd=withData(grp);const gr=wd.length?wd.reduce((s,x)=>s+x.rating,0)/wd.length:null;
      body+=`<div class="kra-group"><div class="kg-h"><span class="kg-t">${esc(kk)}</span>${grp[0].perspective&&grp[0].perspective!==kk?'<span class="kg-p">'+esc(grp[0].perspective)+'</span>':''}<span class="kg-line"></span>${gr==null?'':'<span class="kg-r" style="color:'+sc(statusFromRating(gr).k)+'">'+ratingStr(gr)+' / 5</span>'}</div>
        <div class="kpigrid">${grp.map(kScoreCard).join('')}</div></div>`;
    });
  });
  return body||'<div class="empty">No KPIs mapped.</div>';
}
function personJourney(e,recs){
  const ach=achievements(e);
  let strong=[],focus=[];
  const byKra={};recs.forEach(r=>{const kk=r.kra||r.perspective||'General';const wd=byKra[kk]||(byKra[kk]={s:0,n:0});if(r.rating!=null){wd.s+=r.rating;wd.n++;}});
  Object.keys(byKra).forEach(k=>{const m=byKra[k];if(!m.n)return;const r=m.s/m.n;(r>=TH().onTrack?strong:focus).push({k,r});});
  strong.sort((a,b)=>b.r-a.r);focus.sort((a,b)=>a.r-b.r);
  const journey=`<div class="panel pad"><div class="panel-h"><h3>Performance journey</h3><span class="sub">your rating over time</span>${e.delta!=null?'<div class="r">'+deltaChip(e.delta)+'</div>':''}</div>${e.rating==null?'<div class="empty">No actuals yet.</div>':trendChart(e.trend,{h:150})}</div>`;
  const kraCol=`<div class="panel pad"><div class="panel-h"><h3>By KRA</h3><span class="sub">strong vs focus</span></div><div class="list stack" style="margin-top:2px">${
    strong.slice(0,4).map(x=>`<div class="lrow static"><div class="lrow-id"><span class="sdot s-good"></span><div class="lrow-name">${esc(x.k)}<span class="lrow-sub">strong</span></div></div><span class="lrow-meta" style="color:${sc('good')}">${ratingStr(x.r)}</span></div>`).join('')
    +focus.slice(0,4).map(x=>`<div class="lrow static"><div class="lrow-id"><span class="sdot s-${statusFromRating(x.r).k}"></span><div class="lrow-name">${esc(x.k)}<span class="lrow-sub">focus area</span></div></div><span class="lrow-meta" style="color:${sc(statusFromRating(x.r).k)}">${ratingStr(x.r)}</span></div>`).join('')||'<div class="empty">No rated KRAs.</div>'}</div></div>`;
  const recog=ach.length?`<div class="panel pad" style="margin-top:16px"><div class="panel-h"><h3>Recognition</h3><span class="sub">earned this period</span></div><div class="ach stack">${ach.map(a=>'<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>'+esc(a)+'</span>').join('')}</div></div>`:'';
  return `<div class="two-eq">${journey}${kraCol}</div>${recog}`;
}
function personMilestones(e,recs){
  const rated=recs.filter(r=>r.rating!=null);
  if(!rated.length)return '<div class="empty" style="padding:40px">No rated KPIs yet — enter actuals to unlock milestones.</div>';
  const ranked=rated.map(r=>{const m=nextMilestone(r);const gap=m&&!m.done?(TH().onTrack-r.rating):0;const w=r.weightShown||10;return {r,score:Math.max(0.01,gap)*(w/100),done:m&&m.done};}).sort((a,b)=>(a.done-b.done)||(b.score-a.score));
  return `<div class="kpigrid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">${ranked.map(x=>milestoneCard(x.r)).join('')}</div>`;
}
function achievements(e){
  const out=[];const recs=recordsForEmp(e.id);
  recs.forEach(r=>{if(r.rating!=null&&r.bands&&r.bands.length>=5&&r.rating>=r.bands.length-0.25)out.push('Top band · '+(r.kpi||r.kra));});
  if(e.consistency>=3)out.push(e.consistency+'-period consistency');
  if(e.delta!=null&&e.delta>=0.3)out.push('Improved +'+(Math.round(e.delta*100)/100)+' this period');
  if(e.level&&e.level.level>=4)out.push(e.level.label);
  return out.slice(0,6);
}
function kScoreCard(r){
  return `<div class="kcard" data-rec="${r.kpiId}">
    <div class="kh"><div class="kt">${esc(r.kpi||r.kra||'—')}${r.definition?'<small>'+esc(r.definition)+'</small>':''}</div>${r.weightShown!=null?'<span class="wt">'+n1(r.weightShown)+'%</span>':''}</div>
    <div class="kmeta">${statusPill(r.status)}${r.metricType?'<span class="tag mt">'+esc(r.metricType)+'</span>':''}${r.qualitative?'<span class="tag">Qualitative</span>':''}${r.bandSource==='assignment'?'<span class="tag brand">Custom ladder</span>':''}${r.checkinCount?'<span class="tag">'+r.checkinCount+' check-in'+(r.checkinCount===1?'':'s')+'</span>':''}</div>
    ${ladder(r)}
    <div class="kfoot"><span class="kval">${r.hasActual?'Actual <b>'+esc(fmtActual(r))+'</b>':(r.qualitative?'Manual rating pending':'No actual yet')}${r.points!=null?' · <b>'+n1(r.points)+'</b> pts':''}</span><span class="r">${r.delta!=null?deltaChip(r.delta):''}${rchip(r.rating,r.status)}</span></div>
  </div>`;
}
function fmtActual(r){if(r.actual==null)return r.rating!=null?'rated '+ratingStr(r.rating):'—';return fmtVal(r,r.actual);}

/* ---------------- RECORDS (All KPIs / My KPIs) ---------------- */
function vRecords(){
  const mine=APP.view==='mykpis';
  let base=mine?recordsForEmp(APP.meId):B().records;
  if(mine&&!APP.meId)return vPickMe();
  let rows=filteredRecords(base);
  const s=APP.table.sort,dir=APP.table.dir;
  const gv={employee:r=>r.employee,department:r=>r.department,subTeam:r=>r.subTeam||'',kra:r=>r.kra,kpi:r=>r.kpi,type:r=>r.metricType||'',weight:r=>r.weightShown==null?-1:r.weightShown,target:r=>r.target==null?-1e9:r.target,actual:r=>r.actual==null?-1e9:r.actual,ach:r=>r.attainment==null?-1:r.attainment,rating:r=>r.rating==null?-1:r.rating};
  rows.sort((a,b)=>{const va=(gv[s]||gv.employee)(a),vb=(gv[s]||gv.employee)(b);if(typeof va==='string')return va.localeCompare(vb)*dir;return (va-vb)*dir;});
  const per=APP.table.per,pages=Math.max(1,Math.ceil(rows.length/per)),page=Math.min(APP.table.page,pages-1),slice=rows.slice(page*per,page*per+per);

  const me=mine?empById(APP.meId):null;

  <div class="tbl-wrap stack"><table class="tbl"><thead><tr>${mine?'':th('employee','Person')}${mine?'':th('department','Team')}${th('kpi','KRA / KPI')}${th('type','Type')}${th('weight','Wt',1)}${th('target','Target',1)}${th('actual','Actual',1)}${th('ach','Achieved',1)}${th('rating','Rating',1)}<th>Status</th></tr></thead>
  <tbody>${slice.length?slice.map(r=>`<tr data-rec="${r.kpiId}">${mine?'':'<td class="kname">'+esc(titleName(r.employee))+'</td>'}${mine?'':'<td>'+esc(r.department)+(r.subTeam?' · '+esc(r.subTeam):'')+'</td>'}<td class="kname">${esc(r.kpi||r.kra||'—')}<small>${esc(r.kra&&r.kpi&&r.kra!==r.kpi?r.kra:(r.perspective||''))}</small></td><td><span class="tag mt">${esc(r.metricType||'—')}</span></td><td class="num">${r.weightShown==null?'—':n1(r.weightShown)+'%'}</td><td class="num">${r.target==null?'—':esc(fmtVal(r,r.target))}</td><td class="num">${r.actual==null?'—':esc(fmtVal(r,r.actual))}</td><td class="num">${achCell(r.attainment,r.status.k,r.target==null?'':'Target '+fmtVal(r,r.target))}</td><td class="num" style="color:${sc(r.status.k)};font-weight:800">${r.rating==null?'—':ratingStr(r.rating)}</td><td>${statusPill(r.status)}</td></tr>`).join(''):'<tr><td colspan="'+(mine?8:10)+'" class="empty">No records match the filters.</td></tr>'}</tbody></table></div>
  <div class="pager"><span>Page ${page+1} of ${pages} · ${slice.length} of ${rows.length}</span><div><button data-page="prev" ${page===0?'disabled':''}>Prev</button><button data-page="next" ${page>=pages-1?'disabled':''}>Next</button></div></div></div>`;
}

/* ---------------- CHECK-INS (spec §18) ----------------
   Progress through the period, not a single overwritten number. Every entry is
   kept, so "88% on the 12th, 93% on the 18th" survives as the record. */
function vCheckins(){
  const log=B().checkins||[];
  const recs=filteredRecords(null);
  const stale=recs.filter(r=>!r.hasActual);
  const updated=recs.filter(r=>r.hasActual);
  const mine=APP.meId?recs.filter(r=>r.employeeId===APP.meId):[];
  const byId={};B().records.forEach(r=>byId[r.kpiId]=r);
  const shown=log.filter(c=>{
    if(c.period!==APP.period)return false;
    const r=byId[c.kpiId];if(!r)return true;
    return filteredRecords([r]).length>0;
  });
  const locked=cycleLocked();
  return `<div class="page-head"><h1>Check-ins</h1>
    <p>Update actuals and attach evidence as ${esc(periodLong(APP.period))} runs · every entry is kept.</p></div>
  ${locked?banner('This cycle is locked','Reopen it in Performance Cycles to record new check-ins.'):''}
  <div class="kc-grid c4">
    ${kpiCard('Check-ins this period',String(shown.length),(B().checkinTotal||0)+' all time',{})}
    ${kpiCard('KPIs updated',String(updated.length),'of '+recs.length+' assigned',{tone:updated.length?'good':'none',bar:recs.length?updated.length/recs.length*100:0})}
    ${kpiCard('Awaiting an update',String(stale.length),stale.length?'no actual entered yet':'everything is current',{tone:stale.length?'warn':'good'})}
    ${kpiCard('My KPIs',APP.meId?String(mine.length):'—',APP.meId?mine.filter(r=>r.hasActual).length+' updated':'pick your profile',{attr:'data-nav="mykpis"'})}
  </div>
  <div class="two-col" style="margin-top:16px">
    <div class="panel pad"><div class="panel-h"><h3>Recent check-ins</h3><span class="sub">newest first</span></div>
      <div class="list stack" style="margin-top:4px">${shown.length?shown.slice(0,14).map(checkinRow).join(''):'<div class="empty">No check-ins recorded for '+esc(periodLong(APP.period))+' yet. Open any KPI to add the first.</div>'}</div></div>
    <div class="panel pad"><div class="panel-h"><h3>Needs an update</h3><span class="sub">no actual this period</span></div>
      <div class="list stack" style="margin-top:4px">${stale.length?stale.slice(0,14).map(r=>`<div class="lrow" data-rec="${r.kpiId}"><div class="lrow-id"><span class="sdot s-none"></span><div class="lrow-name">${esc(r.kpi||r.kra)}<span class="lrow-sub">${esc(titleName(r.employee))} · ${esc(r.department)}</span></div></div><span class="tag">${r.weightShown==null?'—':n1(r.weightShown)+'%'}</span><span class="chev">›</span></div>`).join(''):'<div class="empty">Every assigned KPI has an actual for this period.</div>'}</div></div>
  </div>`;
}
function checkinRow(c){
  const r=B().records.find(x=>x.kpiId===c.kpiId);
  const val=c.actual!=null?(r?fmtVal(r,c.actual):n2(c.actual)):(c.rating!=null?ratingStr(c.rating)+'/5':'—');
  return `<div class="lrow" data-rec="${esc(c.kpiId)}">
    <div class="ci-date">${esc(shortDate(c.date))}</div>
    <div class="lrow-id"><div class="lrow-name">${esc(c.kpi||(r&&(r.kpi||r.kra))||'KPI')}<span class="lrow-sub">${esc(c.employee||(r&&r.employee)||'')}${c.comment?' · '+esc(c.comment):''}</span></div></div>
    ${c.evidence?'<a class="link sm" href="'+esc(c.evidence)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Evidence ↗</a>':''}

function shortDate(d){if(!d)return '';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d));return m?(+m[3])+' '+(MONTHS[+m[2]]||''):String(d).slice(0,10);}
function banner(title,sub,action){return '<div class="banner warn"><div class="bi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg></div><div><div class="bt">'+esc(title)+'</div><div class="bs">'+esc(sub)+'</div></div>'+(action?'<div class="r">'+action+'</div>':'')+'</div>';}

/* ---------------- REVIEWS (spec §19) ----------------

   assessment; the final rating is an explicit, attributed decision. */
function vReviews(){

  const emps=filteredEmployees().filter(e=>!e.isTemplate);

  const stages=[['Not Started',rv.notStarted],['Self Review',rv.self],['Manager Review',rv.manager],['Final Review',rv.final],['Complete',rv.complete]];

    ${kpiCard('Review progress',n1(rv.progress)+'<small>%</small>',rv.complete+' of '+rv.total+' complete',{tone:rv.progress>=100?'good':'warn',bar:rv.progress})}
    ${kpiCard('Pending',String(rv.pending),'awaiting a step',{tone:rv.pending?'warn':'good'})}
    ${kpiCard('With manager input',String(rv.manager+rv.final+rv.complete),'reached manager review',{})}
    ${kpiCard('Cycle status',esc(cy?cy.status:'Active'),cy&&cy.endDate?'ends '+esc(cy.endDate):'no dates set',{attr:'data-nav="cycles"'})}
  </div>
  <div class="panel pad"><div class="panel-h"><h3>Where the cycle stands</h3><span class="sub">people at each stage</span></div>
    <div class="hist" style="margin-top:8px">${stages.map(([l,c])=>`<div class="hcol"><div class="hbar" style="height:${c===0?3:clamp(c/max*100,8,100)}%"><b>${c}</b></div><div class="hlab">${esc(l)}</div></div>`).join('')}</div></div>
  <div class="sect-t">People<span class="r">system score · review stage</span></div>
  <div class="panel pad"><div class="list stack" style="margin-top:2px">${

  }</div></div>`;
}
function reviewOrder(e){return ['Not Started','Self Review','Manager Review','Final Review','Complete'].indexOf((e.review&&e.review.status)||'Not Started');}
function reviewRow(e){

}

        <button class="btn primary sm" data-act="save-review" data-emp="${e.id}" data-stage="${stage}" data-submit="1"${disabled}>Submit</button>

/* One bar for any scored grouping (perspective, KRA) — score leads, rating supports. */
function groupBar(g){
  const p=g.rating==null?0:clamp((g.rating-1)/4*100,0,100);
  return `<div class="bc-row static"><div class="bc-label">${esc(g.name)}<small> · ${g.kpis} KPI${g.kpis===1?'':'s'}${groupWeight(g)}</small></div>
    <div class="bc-track"><div class="bc-fill" style="width:${p}%;background:${sc(g.status.k)}"></div></div>
    <div class="bc-val" style="color:${sc(g.status.k)}">${g.score==null?'—':n1(g.score)+'<small>%</small>'}</div></div>`;
}
/* Weightage sums only within one person's scorecard; across people it is an
   average, and the label has to say so or the number reads as nonsense. */
function groupWeight(g){
  if(g.weight!=null)return ' · '+n1(g.weight)+'% weight';
  if(g.avgWeight!=null)return ' · '+g.people+' people · avg '+n1(g.avgWeight)+'% weight';
  return '';
}

/* ---------------- HEALTH & DATA ---------------- */
/* ═══════════════════════ MODAL SYSTEM ═══════════════════════
   moOpen() is the only entry point. Everything below it composes the same few
   primitives, so every modal in the product reads the same way:

     header (who / what · one headline number)
     ── optional tabs
     headline stats      → the numbers you came for
     measurement         → target → actual → achievement
     rating ladder       → where that lands on the KPI's own scale
     detail table/bars   → the breakdown, one level down
     how it is measured  → definition, kept last because it rarely changes

   Colour appears once, on status. Everything else is type and space.          */
const MO={key:null,tab:'',ctx:{},build:null,tabs:null};
/* Opening a modal from inside a modal (team → person) stacks it, so Back steps
   up one level instead of dismissing the whole thing. */
const MOSTACK=[];
function moOpen(spec){
  if($('#mo')&&$('#mo').classList.contains('on')&&MO.build)MOSTACK.push({key:MO.key,tab:MO.tab,ctx:MO.ctx,build:MO.build,tabs:MO.tabs});
  MO.key=spec.key||null; MO.build=spec.build||null; MO.ctx=spec.ctx||{};
  MO.tabs=spec.tabs||null;
  MO.tab=spec.tab||((spec.tabs&&spec.tabs.length)?spec.tabs[0].id:'');
  moRender();
  $('#moWrap').style.display='grid';
  requestAnimationFrame(()=>{$('#mo').classList.add('on');$('#moScrim').classList.add('on');});
  document.body.style.overflow='hidden';
}
/* Step up one modal level, or dismiss if this is the only one. */
function moBack(){
  const p=MOSTACK.pop();
  if(!p){moClose();return;}
  MO.key=p.key;MO.tab=p.tab;MO.ctx=p.ctx;MO.build=p.build;MO.tabs=p.tabs;
  moRender();
}
function moRender(){
  if(!MO.build)return;
  const s=MO.build(MO.ctx,MO.tab)||{};
  const tl=s.tabs||MO.tabs;
  const tabs=(tl&&tl.length)?'<div class="mo-tabs">'+tl.map(t=>'<button data-motab="'+esc(t.id)+'" class="'+(t.id===MO.tab?'on':'')+'">'+esc(t.label)+'</button>').join('')+'</div>':'';
  const score=s.score?'<div class="mo-score"><div class="v"'+(s.scoreTone?' style="color:var(--'+s.scoreTone+'-ink)"':'')+'>'+s.score+'</div><div class="l">'+esc(s.scoreLabel||'')+'</div></div>':'';
  const ic=s.icon?('<div class="mo-ic">'+s.icon+'</div>'):'';
  $('#mo').className='mo on'+(s.wide?' wide':'');
  const backBtn=MOSTACK.length?('<button class="mo-x" data-act="mo-back" title="Back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>'):'';
  $('#mo').innerHTML=
    '<div class="mo-h">'+backBtn+ic+'<div class="mo-id">'
      +(s.eyebrow?'<div class="mo-eyebrow">'+esc(s.eyebrow)+'</div>':'')
      +'<h2>'+esc(s.title||'')+'</h2>'
      +(s.sub?'<div class="mo-sub">'+s.sub+'</div>':'')
    +'</div>'+score
    +'<button class="mo-x" data-act="mo-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'
    +tabs
    +'<div class="mo-b">'+(s.body||'')+'</div>'
    +(s.footer?'<div class="mo-f">'+s.footer+'</div>':'');
}
function moClose(){
  MOSTACK.length=0;
  $('#mo').classList.remove('on');$('#moScrim').classList.remove('on');
  document.body.style.overflow='';
  setTimeout(()=>{if(!$('#mo').classList.contains('on'))$('#moWrap').style.display='none';},240);
}
/* ---- primitives ---- */
function moSec(title,content,right){return '<div class="mo-sec"><div class="mo-sec-h"><span class="t">'+esc(title)+'</span>'+(right?'<span class="r">'+right+'</span>':'')+'</div>'+content+'</div>';}
function moStats(list){return '<div class="mo-stats">'+list.map(s=>'<div class="mo-stat"><div class="l">'+esc(s.l)+'</div><div class="v"'+(s.tone?' style="color:var(--'+s.tone+'-ink)"':'')+'>'+s.v+'</div>'+(s.s?'<div class="s">'+s.s+'</div>':'')+'</div>').join('')+'</div>';}
function moKV(pairs){return '<div class="mo-kv">'+pairs.map(p=>'<div class="k">'+esc(p[0])+'</div><div class="v">'+p[1]+'</div>').join('')+'</div>';}
const MO_ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h13M13 7l5 5-5 5"/></svg>';
function moMeas(target,actual,ach,tone){
  return '<div class="mo-meas">'
    +'<div><div class="l">Target</div><div class="v">'+target+'</div></div>'
    +'<div class="arrow">'+MO_ARROW+'</div>'
    +'<div><div class="l">Actual</div><div class="v">'+actual+'</div></div>'
    +'<div class="arrow">'+MO_ARROW+'</div>'
    +'<div><div class="l">Achievement</div><div class="v"'+(tone?' style="color:var(--'+tone+'-ink)"':'')+'>'+ach+'</div></div>'
    +'</div>';
}
function moLadder(bands,rating,fmt){
  if(!bands||!bands.length)return '';
  const active=rating==null?-1:clamp(Math.round(rating),1,bands.length)-1;
  const cells=bands.map((b,i)=>'<div class="b'+(i===active?' on':'')+'"><div class="n">'+esc(b.label||('T'+(i+1)))+'</div><div class="v">'+esc(fmt?fmt(b.num):(b.raw||'—'))+'</div></div>').join('');
  return '<div class="mo-lad">'+cells+'</div><div class="mo-lad-cap"><span>Band 4 = target met</span><span>'+(rating==null?'not yet rated':'achieved '+(bands[active]?bands[active].label:'—'))+'</span></div>';
}
function moTbl(cols,rows,total){
  const th=cols.map(c=>'<th'+(c.n?' class="n"':'')+'>'+esc(c.t)+'</th>').join('');
  const tr=rows.map(r=>'<tr'+(r.attr||'')+'>'+r.c.map((v,i)=>'<td'+(cols[i]&&cols[i].n?' class="n"':'')+'>'+v+'</td>').join('')+'</tr>').join('');

  return '<div class="mo-tw"><table class="mo-tbl"><thead><tr>'+th+'</tr></thead><tbody>'+tr+tt+'</tbody></table></div>';
}
function moBars(list){
  const max=list.reduce((m,x)=>Math.max(m,x.pct==null?0:x.pct),0)||100;
  return '<div class="mo-bars">'+list.map(x=>'<div class="mo-bar"><span class="l">'+esc(x.l)+'</span><span class="t"><span style="width:'+clamp((x.pct||0)/max*100,0,100)+'%"></span></span><span class="v">'+(x.v!=null?x.v:tPct(x.pct))+'</span></div>').join('')+'</div>';
}

/* ── Target plan for one person: the plan, the buyers behind it, the KPIs it feeds */
function moTargetPlan(teamKey,name){
  moOpen({key:'tplan',ctx:{teamKey,name},
    tabs:[{id:'plan',label:'Target plan'},{id:'buyers',label:'Buyer breakup'},{id:'kpis',label:'Linked KPIs'}],
    build:(c,tab)=>{
      const t=tgtTeam(c.teamKey), a=t&&t.allocation.filter(x=>x.name===c.name)[0];
      if(!a)return {title:'Not found',body:'<div class="empty">No target for this person.</div>'};
      const perf=t.mode==='performance';
      const st=a.achievementPct==null?null:statusFromRating(a.achievementPct>=100?4.2:(a.achievementPct>=90?3.2:(a.achievementPct>=75?2.2:1.5)));
      const head={eyebrow:t.team+' · '+periodLong(APP.period),title:a.name,
        icon:'<span>'+initials(a.name)+'</span>',
        sub:'<span class="tag">'+esc(a.region||'—')+'</span>'+(a.rh?'<span>RH '+esc(a.rh)+'</span>':'')+'<span>'+(a.share==null?'':a.share+'% of team target')+'</span>',
        score:perf?tPct(a.achievementPct):tCr(a.gmvTarget),scoreLabel:perf?'achievement':'gmv target',
        scoreTone:perf&&st?st.k:null,wide:tab!=='plan'};
      if(tab==='buyers'){
        const bs=a.buyers||[];
        head.body=bs.length
          ? moSec('Buyer-wise target',moTbl(
              [{t:'Buyer'},{t:'Region'},{t:'Category'},{t:'Quantity',n:1},{t:'GMV target',n:1},{t:'% of individual',n:1}],
              bs.map(b=>({c:[
                '<span class="nm">'+esc(b.buyer)+(b.placeholder?'<small>unnamed placeholder</small>':(b.bundled?'<small>several buyers in one cell</small>':''))+'</span>',
                esc(b.region||'—'),esc(b.category||'—'),tQty(b.qty,t.qtyUnit),tCr(b.gmvTarget),
                a.gmvTarget&&b.gmvTarget!=null?tPct(b.gmvTarget/a.gmvTarget*100):'—']})),
              ['Total','','',tQty(a.qtyTarget,t.qtyUnit),tCr(a.gmvTarget),'100%']),
              bs.length+' line'+(bs.length===1?'':'s'))
            +'<div class="mo-note">Buyer lines are the second level of the plan. They roll up into the individual target above — they are not scored separately.</div>'
          : '<div class="empty">This team\'s workbook has no owner column on its buyer plan, so buyer lines are held at team level.</div>';
        return head;
      }
      if(tab==='kpis'){
        const recs=(B().records||[]).filter(r=>r.targetSourced&&r.employee===a.name&&r.department===t.team);
        head.body=recs.length?moSec('KPIs this target feeds',moTbl(
          [{t:'KPI'},{t:'KRA'},{t:'Weight',n:1},{t:'Target',n:1},{t:'Actual',n:1},{t:'Achievement',n:1},{t:'Status'}],
          recs.map(r=>({attr:' data-rec="'+esc(r.kpiId)+'" style="cursor:pointer"',c:[
            '<span class="nm">'+esc(r.kpi)+(r.primaryMetric?'<small>primary metric</small>':'')+'</span>',
            esc(r.kra),r.weight+'%',
            tKpiVal(r.planTarget,r.unit),tKpiVal(r.actual,r.unit),
            achCell(r.attainment,r.status&&r.status.k),statusPill(r.status)]})) ),'Target → Actual → Achievement')
          +'<div class="mo-note">The target is assigned here; the weightage, band ladder and rating logic belong to the KPI and are unaffected by re-planning.</div>'
          :'<div class="empty">No KPI lines yet.</div>';
        return head;
      }
      head.body=moSec('This month',moStats([
          {l:'GMV target',v:tCr(a.gmvTarget),s:(a.share==null?'':a.share+'% of team')},
          {l:'Quantity target',v:tQty(a.qtyTarget,t.qtyUnit),s:'secondary metric'},
          {l:'Target buyers',v:String(a.buyerCount||0),s:(a.buyerLines||0)+' plan lines'},
          {l:perf?'Achieved':'Region',v:perf?tCr(a.gmvActual):esc(a.region||'—'),s:perf?tPct(a.achievementPct)+' of target':(a.rh?'RH '+esc(a.rh):'')}
        ]))
        +(perf?moSec('GMV achievement',moMeas(tCr(a.gmvTarget),tCr(a.gmvActual),tPct(a.achievementPct),st?st.k:null)):'')
        +(perf&&a.qtyActual!=null?moSec('Volume achievement',moMeas(tQty(a.qtyTarget,t.qtyUnit),tQty(a.qtyActual,t.qtyUnit),tPct(a.qtyAchievementPct))):'')
        +moSec('How this target was set',moKV([
          ['Source',esc(t.team)+' target plan · '+esc((t.tabs&&t.tabs[0])||'workbook')],
          ['Period',esc(periodLong(APP.period))],
          ['Basis',t.mode==='performance'?'Target and achievement both present':'Plan only — no achievement recorded yet'],
          ['Primary metric','GMV (₹ Cr) — quantity is secondary']
        ]));
      head.footer='<span class="sp"></span>'+(function(){const e=(B().employees||[]).filter(x=>x.name===a.name&&x.department===t.team)[0];return e?'<button class="btn ghost sm" data-person="'+esc(e.id)+'" data-act="mo-close">Open full scorecard</button>':'';})()
        +'<button class="btn primary sm" data-act="mo-close">Done</button>';
      return head;
    }});
}

/* ═══════════════ TARGETS — the input layer, not a spreadsheet view ═══════════
   Drill order is fixed: TEAM target → INDIVIDUAL allocation → BUYER lines.
   Buyer detail is deliberately second-level; it never reaches this dashboard's
   front page. Each individual target links straight to the KPI it feeds.      */
function TG(){return (B()&&B().targets)||{available:false,teams:[]};}
function tgtTeam(k){return (TG().teams||[]).filter(t=>t.key===k)[0]||null;}
const tCr=v=>v==null||isNaN(v)?'—':'₹'+(Math.round(v*100)/100).toFixed(2)+' Cr';
const tQty=(v,u)=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString('en-IN')+(u?' '+u:'');
/* Format a KPI figure in its own unit — ₹ Cr, a tonnage, or a bare count. */
const tKpiVal=(v,unit)=>v==null||isNaN(v)?'—':(unit==='Cr'?tCr(v):tQty(v,unit||''));

/* Achievement against target, as a bar the eye can scan down a column.
   Track = 0–125% of target, tick at 100%. Attainment is already direction-aware
   from the backend, so a lower-is-better KPI (DSO, DN%) reads the same way. */
function pctTone(p){return p==null?'none':(p>=100?'good':(p>=90?'warn':'bad'));}
function kpiBar(pct,tone){
  if(pct==null)return '<div class="kbar none" title="No actual recorded yet"></div>';
  const w=clamp(pct/125*100,0,100),over=pct>125,c=sc(tone||pctTone(pct));
  return '<div class="kbar'+(over?' over':'')+'" role="img" aria-label="'+n1(pct)+'% of target">'
    +'<span style="width:'+w+'%;background:'+c+';border-left-color:'+c+'"></span><i></i></div>';
}
/* The cell used in every achievement column: the number, then the bar. */
function achCell(pct,tone,title){
  return '<div class="achcell"'+(title?' title="'+esc(title)+'"':'')+'><span>'+(pct==null?'—':n1(pct)+'%')+'</span>'+kpiBar(pct,tone)+'</div>';
}
const tPct=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10)+'%';
function tgtModeChip(t){return '<span class="tag">'+(t.mode==='performance'?'Target vs achievement':'Plan · target &amp; allocation')+'</span>';}
/* one horizontal allocation row: label · share bar · target · achievement */
function tgtRow(a,t,max,attr){
  const w=max?clamp((a.gmvTarget||0)/max*100,0,100):0;
  const ach=t.mode==='performance'
    ? '<div class="bc-val">'+tCr(a.gmvActual)+'<small> '+tPct(a.achievementPct)+'</small></div>'
    : '<div class="bc-val" style="color:var(--faint)">'+tQty(a.qtyTarget,t.qtyUnit)+'</div>';
  return '<div class="bc-row" '+(attr||'')+'><div class="bc-label">'+esc(a.name)
    +'<small> · '+esc(a.region||'—')+(a.rh?' · RH '+esc(a.rh):'')+'</small></div>'
    +'<div class="bc-track"><div class="bc-fill" style="width:'+w+'%"></div></div>'
    +'<div class="bc-val">'+tCr(a.gmvTarget)+'<small> '+(a.share==null?'':a.share+'%')+'</small></div>'
    +ach+'<span class="bc-chev">›</span></div>';
}
function vTargets(){
  const T=TG();
  if(!T.available)return '<div class="page-head"><h1>Targets</h1><p>No target plan is connected yet. Each team\'s monthly plan workbook supplies the GMV and quantity targets that its KPIs are measured against.</p></div>'
    +'<div class="panel pad">'+(T.teams||[]).map(t=>'<div class="hcheck warn"><div class="hc-ic">!</div><div class="hc-t">'+esc(t.team)+'<small>'+esc(t.error||'Not configured')+'</small></div></div>').join('')+'</div>';
  const teams=T.teams.filter(t=>t.connected);
  const notCon=T.teams.filter(t=>!t.connected);
  const totT=teams.reduce((s,t)=>s+(t.summary.gmvTarget||0),0);
  const totQ=teams.reduce((s,t)=>s+(t.summary.qtyTarget||0),0);
  const totP=teams.reduce((s,t)=>s+(t.summary.employees||0),0);
  const totB=teams.reduce((s,t)=>s+(t.summary.buyerLines||0),0);
  const anyPerf=teams.some(t=>t.mode==='performance');
  const totA=anyPerf?teams.reduce((s,t)=>s+(t.summary.gmvActual||0),0):null;
  const cards='<div class="kc-grid c4">'
    +kpiCard('GMV target',tCr(totT),teams.map(t=>t.team).join(' + ')||'—',{})
    +kpiCard('Quantity target',tQty(totQ,'MT'),'across '+teams.length+' team'+(teams.length===1?'':'s'),{})
    +kpiCard(anyPerf?'GMV achieved':'Employees carrying target',anyPerf?tCr(totA):String(totP),anyPerf?tPct(totT?totA/totT*100:null)+' of target':totB+' buyer target lines',{})
    +kpiCard('Buyer target lines',String(totB),'second-level detail',{})
    +'</div>';
  /* One team, one block: a single line of facts, then the allocation. The team's
     numbers used to appear three times over — in cards here, again in a modal,
     again in the rows. Facts once, detail once. */
  const body=teams.map(t=>{
    const s=t.summary,perf=t.mode==='performance';
    const facts=[tCr(s.gmvTarget)+' GMV',tQty(s.qtyTarget,s.qtyUnit),s.employees+' employees',s.buyerLines+' buyer lines']
      .concat(perf?[tCr(s.gmvActual)+' achieved · '+tPct(s.achievementPct)]:[])
      .concat(t.concentration&&t.concentration.share!=null?[t.concentration.share+'% with '+esc(t.concentration.name)]:[]);
    return '<div class="sect-t">'+esc(t.team)+'<span class="r">'+tgtModeChip(t)+'</span></div>'
      +'<div class="panel pad"><div class="tgt-facts">'+facts.map(f=>'<span>'+f+'</span>').join('')+'</div>'
      +moTbl(
        [{t:'Employee'},{t:'Region'},{t:'GMV target',n:1},{t:'% of team',n:1},{t:'Quantity',n:1}]
          .concat(perf?[{t:'Achieved',n:1},{t:'Achievement',n:1}]:[]),
        t.allocation.map(a=>({attr:' data-tgtperson="'+esc(t.key)+'|'+esc(a.name)+'" style="cursor:pointer"',
          c:['<span class="nm">'+esc(titleName(a.name))+(a.rh?'<small>RH '+esc(titleName(a.rh))+'</small>':'')+'</span>',
             esc(a.region||'—'),tCr(a.gmvTarget),(a.share==null?'—':a.share+'%'),tQty(a.qtyTarget,t.qtyUnit)]
             .concat(perf?[tCr(a.gmvActual),achCell(a.achievementPct,null,'Target '+tCr(a.gmvTarget))]:[])})),
        ['Total','',tCr(s.gmvTarget),'100%',tQty(s.qtyTarget,s.qtyUnit)].concat(perf?[tCr(s.gmvActual),tPct(s.achievementPct)]:[]))
      +'</div>';
  }).join('');
  const missing=notCon.length?'<div class="sect-t">Not connected</div><div class="panel pad">'
    +notCon.map(t=>'<div class="hcheck warn"><div class="hc-ic">!</div><div class="hc-t">'+esc(t.team)+'<small>'+esc(t.error||'')+'</small></div></div>').join('')+'</div>':'';
  return '<div class="page-head"><h1>Targets</h1><p>The monthly business target, how it is allocated to each person, and where it is concentrated. Targets feed the KPI scorecard — the KPI keeps its own definition, weightage and rating logic.</p></div>'
    +cards+body+missing;
}

function vHealth(){
  const src=B().source,o=B().rollups.org,th=TH(),h=B().health;
  const checks=[];
  checks.push({ok:h.unmappedActuals===0,t:'All actual rows map to a KPI',s:h.unmappedActuals?h.unmappedActuals+' orphaned actual rows (KpiId not in framework)':'every KpiId in the actuals source resolves',v:h.unmappedActuals});
  checks.push({ok:h.weightIssues.length===0,warn:h.weightIssues.length>0,t:'Weightage totals 100% per person',s:h.weightIssues.length?h.weightIssues.length+' person-blocks off 100%':'every block sums to 100%',v:h.weightIssues.length});
  checks.push({ok:h.qualitative===0,warn:h.qualitative>0,t:'KPIs have numeric target bands',s:h.qualitative?h.qualitative+' qualitative KPIs need a manual rating':'all KPIs numeric',v:h.qualitative});
  checks.push({ok:h.coverage>=67,warn:h.coverage>0&&h.coverage<67,bad:h.coverage===0,t:'Actuals coverage',s:h.withData+' of '+h.kpis+' KPIs have actuals',v:pct(h.coverage)});
  const checkHtml=checks.map(c=>{const k=c.ok?'ok':(c.warn?'warn':'bad');const ic=c.ok?'<path d="M20 6L9 17l-5-5"/>':(c.warn?'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/>':'<path d="M6 6l12 12M18 6L6 18"/>');return `<div class="hcheck ${k}"><div class="hc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg></div><div class="hc-t">${esc(c.t)}<small>${esc(c.s)}</small></div><div class="r" style="color:${sc(k)}">${c.v}</div></div>`;}).join('');
  const weightRows=h.weightIssues.length?('<div class="sect-t">Weightage anomalies<span class="r">expected 100% per person-block</span></div><div class="panel pad"><div class="tbl-wrap"><table class="info-tbl"><thead><tr><th>Person</th><th>Team</th><th>Sub-team</th><th>KPIs</th><th>Weight sum</th></tr></thead><tbody>'+h.weightIssues.map(w=>'<tr><td>'+esc(w.employee)+'</td><td>'+esc(w.dept)+'</td><td>'+esc(w.subTeam||'—')+'</td><td>'+w.kpis+'</td><td style="color:var(--warn-ink);font-weight:700">'+w.sum+'%</td></tr>').join('')+'</tbody></table></div></div>'):'';
  return `<div class="page-head"><h1>Health &amp; Data</h1><p>Master-data validation and parser diagnostics · fix these before trusting a score.</p></div>
  <div class="kc-grid c3">
    ${kpiCard('Master sheet',esc(src.title),src.tabs.length+' tabs',{})}
    ${kpiCard('Actuals source',B().source.actuals.type,esc(B().source.actuals.tab)+' · '+B().source.actuals.rows+' rows',{tone:B().source.actuals.rows?'good':'none'})}
    ${kpiCard('Coverage',pct(o.coverage),o.kpisWithData+' of '+o.kpis+' KPIs',{tone:o.coverage>=67?'good':o.coverage>0?'warn':'none'})}
  </div>
  <div class="panel pad"><div class="panel-h"><h3>Master-data health</h3><span class="sub">validated before scoring is trusted</span></div><div class="stack" style="margin-top:2px">${checkHtml}</div></div>
  ${weightRows}
  <div class="two-eq" style="margin-top:16px">
    <div class="panel pad"><div class="panel-h"><h3>Actuals &amp; period</h3><span class="sub">the separate target/metric source</span></div>
      <div class="stack" style="font-size:13px;color:var(--ink-2);line-height:1.7">Definitions come from the master tabs; <b>targets &amp; actuals</b> live separately in <b>${esc(B().source.actuals.tab)}</b> (${esc(B().source.actuals.type)}), joined by a stable <code>KpiId</code>. Actuals are entered per <b>period</b> (${esc(periodLong(APP.period))}).</div>
      <div class="stack"><button class="btn primary sm" data-act="scaffold">Create / refresh actuals for ${esc(periodShort(APP.period))}</button>
      <div style="font-size:11.5px;color:var(--faint);margin-top:8px">Adds one blank row per KPI (target pre-filled from the "Meets" band). Never overwrites existing values.</div></div>
    </div>
    <div class="panel pad"><div class="panel-h"><h3>Scoring thresholds</h3><span class="sub">on the 1–5 rating scale</span></div>
      <div class="stack row2">
        <div class="field"><label>On Track ≥</label><input id="setOnTrack" type="number" step="0.1" min="0" max="5" value="${th.onTrack}"></div>
        <div class="field"><label>At Risk ≥</label><input id="setAtRisk" type="number" step="0.1" min="0" max="5" value="${th.atRisk}"></div>
      </div>
      <button class="btn ghost sm" data-act="save-settings">Save thresholds</button>
      <div style="font-size:11.5px;color:var(--faint);margin-top:10px">Band 3 = "Meets" = on-target. Below <b>At Risk</b> is Off Track. Applies on next refresh.</div>
    </div>
  </div>
  <div class="sect-t">Parser diagnostics</div>
  <div class="panel pad"><div class="tbl-wrap"><table class="info-tbl"><thead><tr><th>Tab</th><th>Rows</th><th>Cols</th></tr></thead><tbody>${src.tabs.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+t.rows+'</td><td>'+t.cols+'</td></tr>').join('')}</tbody></table></div>
  <div class="stack" style="font-size:12.5px;color:var(--muted)">${B().departments.map(d=>esc(d.name)+' → '+d.kind+' ('+d.employeeCount+' people, '+d.kpiCount+' KPIs)').join('<br>')}</div>
  ${(B().notes&&B().notes.length)?'<div class="stack" style="font-size:12px;color:var(--warn-ink)">'+B().notes.map(esc).join('<br>')+'</div>':''}</div>`;
}

/* ---------------- KRA / KPI LIBRARY (spec §15) ----------------
   The DEFINITION is permanent and shared; the ASSIGNMENT is per person per
   cycle and may carry its own weight and target ladder. This screen is the
   definition side; each row opens the assignments that reference it. */
function vLibrary(){
  const lib=B().library||[];
  const q=(APP.ctx.q||'').toLowerCase();
  const rows=q?lib.filter(d=>((d.kpi||'')+' '+(d.kra||'')+' '+(d.perspective||'')).toLowerCase().includes(q)):lib;
  const shared=lib.filter(d=>d.owners>1).length;
  const variants=lib.filter(d=>d.variants>1).length;
  return `<div class="page-head"><h1>KRA / KPI Library</h1>
    <p>One entry per KPI definition · assignable to many people, each with their own bands.</p></div>
  <div class="kc-grid c4">
    ${kpiCard('Definitions',String(lib.length),'distinct KPIs',{})}
    ${kpiCard('Shared across people',String(shared),'assigned to more than one person',{})}
    ${kpiCard('With differing ladders',String(variants),'target bands vary by assignment',{tone:variants?'warn':'none'})}
    ${kpiCard('Assignments',String(B().records.length),'employee × KPI lines',{attr:'data-nav="records"'})}
  </div>
  <div class="panel pad" style="margin-top:16px"><div class="panel-h"><h3>${rows.length} definition${rows.length===1?'':'s'}</h3><span class="sub">owners · weight range · average rating</span>
    <div class="r"><div class="fsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="libSearch" placeholder="Search definitions…" value="${esc(APP.ctx.q||'')}"></div></div></div>
  <div class="tbl-wrap stack"><table class="tbl"><thead><tr><th>KPI</th><th>Perspective</th><th>KRA</th><th>Type</th><th>Direction</th><th class="num">Owners</th><th class="num">Weight</th><th class="num">Rating</th></tr></thead>
  <tbody>${rows.length?rows.map(d=>`<tr data-def="${esc(d.defId)}">
    <td class="kname">${esc(d.kpi||d.kra||'—')}${d.definition?'<small>'+esc(d.definition)+'</small>':''}</td>
    <td>${esc(d.perspective||'—')}</td><td>${esc(d.kra||'—')}</td>
    <td><span class="tag mt">${esc(d.metricType||'—')}</span></td>
    <td><span class="tag${d.directionSource==='declared'?' brand':''}">${esc(dirLabel(d.directionKey))}</span></td>
    <td class="num">${d.owners}${d.teams>1?'<small> · '+d.teams+' teams</small>':''}</td>
    <td class="num">${d.weightMin==null?'—':(d.weightMin===d.weightMax?n1(d.weightMin)+'%':n1(d.weightMin)+'–'+n1(d.weightMax)+'%')}</td>
    <td class="num" style="font-weight:800">${d.rating==null?'—':ratingStr(d.rating)}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">No definitions match.</td></tr>'}</tbody></table></div></div>`;
}
function dirLabel(k){return k==='lower'?'Lower is better':(k==='exact'?'Exact / binary':'Higher is better');}

/* One definition, and every assignment that references it. */

  return `<div class="page-head"><h1>${esc(d.kpi||d.kra)}</h1>
    <p>${esc(d.definition||'No definition text in the master sheet.')}</p></div>
  <div class="kc-grid c4">
    ${kpiCard('Average rating',d.rating==null?'—':ratingStr(d.rating)+'<small>/5</small>',statusPill(d.status),{tone:d.status.k,bar:d.rating==null?null:(d.rating-1)/4*100})}
    ${kpiCard('Score',d.scorePct==null?'—':n1(d.scorePct)+'<small>%</small>','system conversion',{})}
    ${kpiCard('Assigned to',String(d.owners),d.teams+' team'+(d.teams===1?'':'s'),{})}
    ${kpiCard('Ladder variants',String(d.variants),d.variants>1?'targets differ by assignment':'one shared ladder',{tone:d.variants>1?'warn':'good'})}
  </div>
  <div class="two-eq" style="margin-top:16px">
    <div class="panel pad"><div class="panel-h"><h3>Definition</h3><span class="sub">permanent, shared</span></div>
      <div class="def-box">${esc(d.definition||d.kpi||'—')}<div class="dm">
        <span>Perspective <b>${esc(d.perspective||'—')}</b></span><span>KRA <b>${esc(d.kra||'—')}</b></span>
        <span>Type <b>${esc(d.metricType||'—')}</b></span>${d.unit?'<span>Unit <b>'+esc(d.unit)+'</b></span>':''}
        <span>Direction <b>${esc(dirLabel(d.directionKey))}</b>${d.directionSource==='declared'?'':' (inferred)'}</span>

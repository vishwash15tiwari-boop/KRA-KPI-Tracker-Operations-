  <tbody>${d.assignments.map(a=>`<tr data-rec="${esc(a.kpiId)}"><td class="kname">${esc(a.employee)}</td><td>${esc(a.department)}${a.subTeam?' · '+esc(a.subTeam):''}</td>
    <td class="num">${a.weight==null?'—':n1(a.weight)+'%'}</td>
    <td><span class="tag${a.bandSource==='assignment'?' brand':''}">${a.bandSource==='assignment'?'Overridden':'Master'}</span></td>
    <td>${esc(a.reviewer||'—')}</td>
    <td class="num" style="font-weight:800">${a.rating==null?'—':ratingStr(a.rating)}</td><td>${statusPill(a.status)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ---------------- PERFORMANCE CYCLES (spec §17) ---------------- */
function vCycles(){
  const cycles=B().cycles||[];
  const cur=CY();
  const periods=(B().settings&&B().settings.periods)||[];
  const known={};cycles.forEach(c=>known[c.period]=true);
  const undeclared=periods.filter(p=>!known[p]);
  const states=(B().settings&&B().settings.cycleStates)||['Draft','Active','Review','Locked'];
  const editor=c=>`<div class="panel pad"><div class="panel-h"><h3>${esc(c.name||periodLong(c.period))}</h3><span class="sub">${esc(c.period)}${c.implicit?' · not yet declared':''}</span>
      <div class="r"><span class="cyc-chip ${esc((c.status||'Active').toLowerCase())}">${c.locked?'🔒 ':''}${esc(c.status||'Active')}</span></div></div>
    <div class="row2">
      <div class="field"><label>Cycle name</label><input id="cyName_${esc(c.period)}" value="${esc(c.name||periodLong(c.period))}"></div>
      <div class="field"><label>Status</label><select id="cyStatus_${esc(c.period)}">${states.map(s=>'<option value="'+esc(s)+'"'+((c.status||'Active')===s?' selected':'')+'>'+esc(s)+'</option>').join('')}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Start date</label><input id="cyStart_${esc(c.period)}" type="date" value="${esc(c.startDate||'')}"></div>
      <div class="field"><label>End date</label><input id="cyEnd_${esc(c.period)}" type="date" value="${esc(c.endDate||'')}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Review due</label><input id="cyReview_${esc(c.period)}" type="date" value="${esc(c.reviewDue||'')}"></div>
      <div class="field"><label>Note</label><input id="cyNote_${esc(c.period)}" value="${esc(c.note||'')}" placeholder="Optional"></div>
    </div>
    <button class="btn primary sm" data-act="save-cycle" data-period="${esc(c.period)}">Save cycle</button>
    <div style="font-size:11.5px;color:var(--faint);margin-top:9px">A <b>Locked</b> cycle rejects every check-in, actual and review until it is reopened — that is what makes a closed period trustworthy.</div></div>`;
  return `<div class="page-head"><h1>Performance Cycles</h1>
    <p>Each cycle owns its assignments, actuals and review · lock to freeze it.</p></div>
  <div class="kc-grid c3">
    ${kpiCard('Active cycle',esc(cur?cur.name:periodLong(APP.period)),cur&&cur.startDate?esc(cur.startDate)+' → '+esc(cur.endDate||'—'):'no dates set',{})}
    ${kpiCard('Declared cycles',String(cycles.length),undeclared.length?undeclared.length+' periods not yet declared':'all periods declared',{tone:cycles.length?'good':'none'})}
    ${kpiCard('Locked',String(cycles.filter(c=>c.locked).length),'closed to further change',{})}
  </div>
  <div class="sect-t">Current cycle</div>${editor(cur||{period:APP.period,name:periodLong(APP.period),status:'Active',implicit:true})}
  ${cycles.length?'<div class="sect-t">All cycles</div><div class="panel pad"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Period</th><th>Name</th><th>Start</th><th>End</th><th>Review due</th><th>Status</th></tr></thead><tbody>'
    +cycles.map(c=>'<tr><td class="kname">'+esc(c.period)+'</td><td>'+esc(c.name)+'</td><td>'+esc(c.startDate||'—')+'</td><td>'+esc(c.endDate||'—')+'</td><td>'+esc(c.reviewDue||'—')+'</td><td><span class="cyc-chip '+esc(c.status.toLowerCase())+'">'+esc(c.status)+'</span></td></tr>').join('')
    +'</tbody></table></div></div>':''}
  ${undeclared.length?'<div class="sect-t">Periods without a cycle record</div><div class="panel pad"><div class="stack" style="font-size:13px;color:var(--ink-2)">These periods carry data but no declared cycle. They behave as <b>Active</b> with dates derived from the month: '+undeclared.map(esc).join(', ')+'.</div></div>':''}`;
}

/* ---------------- SETTINGS (spec §7/§8) ---------------- */
function vSettings(){
  const sc=SCORING(),scale=SCALE().slice().sort((a,b)=>a.min-b.min),th=TH(),h=B().health,src=B().source;
  const example=[[40,4],[30,4],[15,5],[10,4],[5,3]];
  const exRows=example.map(([w,r])=>{const p=scoreFromRating(r)*(w/100);return `<tr><td class="num">${w}%</td><td class="num">${r}</td><td class="num">${n1(scoreFromRating(r))}%</td><td class="num" style="font-weight:800">${n1(p)}</td></tr>`;}).join('');
  const exTotal=example.reduce((s,[w,r])=>s+scoreFromRating(r)*(w/100),0);
  return `<div class="page-head"><h1>Settings</h1>
    <p>How a rating becomes a score, and a score becomes a word · system-wide.</p></div>
  <div class="two-eq">
    <div class="panel pad"><div class="panel-h"><h3>Rating → performance %</h3><span class="sub">the one conversion (spec §7)</span></div>
      <div class="q">Weighted KPI score = (rating → %) × weightage. Set the five anchor points.</div>
      <div class="pct-grid">${sc.ratingPct.map((v,i)=>`<div class="field"><label>Rating ${i+1}</label><input id="scPct${i}" type="number" min="0" max="100" step="1" value="${v}"></div>`).join('')}</div>
      <label class="chk"><input type="checkbox" id="scInterp" ${sc.interpolate===false?'':'checked'}> Interpolate between anchors <small>a rating of 4.4 scores between the band-4 and band-5 values instead of snapping</small></label>
      <button class="btn primary sm" data-act="save-scoring">Save scoring</button>
      <div class="sect-t" style="margin-top:18px">Worked example</div>
      <div class="tbl-wrap"><table class="tbl compact"><thead><tr><th class="num">Weight</th><th class="num">Rating</th><th class="num">Score</th><th class="num">Points</th></tr></thead><tbody>${exRows}
        <tr><td colspan="3" style="text-align:right;font-weight:700">Overall</td><td class="num" style="font-weight:800">${n1(exTotal)} / 100</td></tr></tbody></table></div>
    </div>
    <div class="panel pad"><div class="panel-h"><h3>Performance status</h3><span class="sub">separate from rating (spec §8)</span></div>
      <div class="q">The rating measures; the status names it.</div>
      <div class="stack">${scale.map((s,i)=>`<div class="status-row"><span class="sdot s-${esc(s.key)}"></span>
        <input class="st-label" id="stLabel${i}" value="${esc(s.label)}" data-key="${esc(s.key)}">
        <span class="st-at">at rating ≥</span>
        <input class="st-min" id="stMin${i}" type="number" min="0" max="5" step="0.05" value="${s.min}">
      </div>`).join('')}</div>
      <button class="btn primary sm" data-act="save-statuses">Save statuses</button>
      <div style="font-size:11.5px;color:var(--faint);margin-top:10px">Anything below the lowest cut-off takes the lowest label. A KPI with no actual is always <b>Pending</b>, never a status.</div>
      <div class="sect-t" style="margin-top:18px">Preview</div>
      <div class="stack" style="display:flex;gap:8px;flex-wrap:wrap">${[1,2,3,3.6,4,4.6,5].map(r=>{const s=statusFromRating(r);return '<span class="pill '+s.k+'"><span class="sdot s-'+s.k+'"></span>'+ratingStr(r)+' · '+esc(s.label)+'</span>';}).join('')}</div>
    </div>
  </div>
  <div class="sect-t">Data health<span class="r">validate before an overall score is trusted</span></div>
  ${healthChecks(h)}
  ${h.weightIssues.length?weightIssueTable(h):''}
  <div class="two-eq" style="margin-top:16px">
    <div class="panel pad"><div class="panel-h"><h3>Sources</h3><span class="sub">where each layer lives</span></div>
      <div class="tbl-wrap"><table class="info-tbl"><thead><tr><th>Layer</th><th>Location</th><th class="num">Rows</th></tr></thead><tbody>
        <tr><td>Framework (KRA/KPI, weightage, bands)</td><td>${esc(src.title)} — master tabs</td><td class="num">${B().records.length}</td></tr>
        <tr><td>Targets &amp; actuals</td><td>${esc(B().source.actuals.tab)} (${esc(B().source.actuals.type)})</td><td class="num">${B().source.actuals.rows}</td></tr>
        <tr><td>Assignments</td><td>KKT_Assignments</td><td class="num">${B().assignmentCount||0}</td></tr>
        <tr><td>Check-ins</td><td>KKT_Checkins</td><td class="num">${B().checkinTotal||0}</td></tr>
        <tr><td>Cycles</td><td>KKT_Cycles</td><td class="num">${(B().cycles||[]).length}</td></tr>
      </tbody></table></div>
      <button class="btn ghost sm" data-act="scaffold">Create / refresh actuals rows for ${esc(periodShort(APP.period))}</button>
      <div style="font-size:11.5px;color:var(--faint);margin-top:8px">Adds one blank row per KPI with the target pre-filled from the Meets band. Never overwrites existing values.</div>
    </div>
    <div class="panel pad"><div class="panel-h"><h3>Legacy thresholds</h3><span class="sub">derived from the status scale</span></div>
      <div class="row2"><div class="field"><label>On Track ≥</label><input id="setOnTrack" type="number" step="0.1" min="0" max="5" value="${th.onTrack}"></div>
      <div class="field"><label>At Risk ≥</label><input id="setAtRisk" type="number" step="0.1" min="0" max="5" value="${th.atRisk}"></div></div>
      <button class="btn ghost sm" data-act="save-settings">Save thresholds</button>
      <div style="font-size:11.5px;color:var(--faint);margin-top:10px">These drive priority ranking and consistency streaks. Saving the status scale above keeps them in step automatically.</div>
      <div class="sect-t" style="margin-top:18px">Parser diagnostics</div>
      <div class="stack" style="font-size:12.5px;color:var(--muted)">${B().departments.map(d=>esc(d.name)+' → '+d.kind+' ('+d.employeeCount+' people, '+d.kpiCount+' KPIs)').join('<br>')}</div>
    </div>
  </div>`;
}
function healthChecks(h){
  const checks=[
    {ok:h.weightIssues.length===0,warn:h.weightIssues.length>0,t:'Weightage totals 100% per person',s:h.weightIssues.length?h.weightIssues.length+' person-blocks are off 100%':'every block sums to 100%',v:h.weightIssues.length},
    {ok:h.unmappedActuals===0,t:'All actual rows map to a KPI',s:h.unmappedActuals?h.unmappedActuals+' orphaned rows (KpiId not in the framework)':'every KpiId resolves',v:h.unmappedActuals},
    {ok:h.inferredDirection===0,warn:h.inferredDirection>0,t:'Direction is declared, not guessed',s:h.inferredDirection?h.inferredDirection+' KPIs infer direction from the band ladder — add a Direction column to be explicit':'every KPI declares its direction',v:h.inferredDirection},
    {ok:h.qualitative===0,warn:h.qualitative>0,t:'KPIs have numeric target bands',s:h.qualitative?h.qualitative+' qualitative KPIs need a manual rating':'all KPIs numeric',v:h.qualitative},
    {ok:h.coverage>=67,warn:h.coverage>0&&h.coverage<67,bad:h.coverage===0,t:'Actuals coverage',s:h.withData+' of '+h.kpis+' KPIs have actuals',v:pct(h.coverage)}
  ];
  return '<div class="panel pad"><div class="stack" style="margin-top:2px">'+checks.map(c=>{
    const k=c.ok?'ok':(c.warn?'warn':'bad');
    const ic=c.ok?'<path d="M20 6L9 17l-5-5"/>':(c.warn?'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/>':'<path d="M6 6l12 12M18 6L6 18"/>');
    return `<div class="hcheck ${k}"><div class="hc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg></div><div class="hc-t">${esc(c.t)}<small>${esc(c.s)}</small></div><div class="r">${c.v}</div></div>`;
  }).join('')+'</div></div>';

async function pushRec(fn,payload,id,okMsg){

/* ---------------- helpers using settings ---------------- */
/* Mirrors the backend exactly: status comes from the configurable scale, never
 * from hard-coded cut-offs, so relabelling in Settings moves the whole UI. */
function SCALE(){const s=B()&&B().settings&&B().settings.statusScale;return (s&&s.length)?s:[{key:'bad',label:'At Risk',min:0},{key:'warn',label:'Watch',min:2},{key:'good',label:'On Track',min:3},{key:'strong',label:'Strong',min:4},{key:'elite',label:'Exceeding',min:4.5}];}
function statusFromRating(r){
  if(r==null||isNaN(r))return {k:'none',label:'Pending',tier:0};
  const sc=SCALE().slice().sort((a,b)=>a.min-b.min);
  let pick=sc[0];sc.forEach(s=>{if(r>=s.min)pick=s;});
  return {k:pick.key,label:pick.label,tier:sc.indexOf(pick)+1};
}
/* The ONE rating→percentage conversion, client side, for anything the backend
 * did not pre-compute (ad-hoc groupings in the UI). */
function SCORING(){const s=B()&&B().settings&&B().settings.scoring;return (s&&s.ratingPct&&s.ratingPct.length===5)?s:{ratingPct:[20,40,60,80,100],interpolate:true};}
function scoreFromRating(r){
  if(r==null||isNaN(r))return null;
  const cfg=SCORING(),map=cfg.ratingPct,x=clamp(r,1,5);
  if(cfg.interpolate===false)return Math.round(map[Math.round(x)-1]*10)/10;
  const lo=Math.floor(x),hi=Math.ceil(x);
  if(lo===hi)return Math.round(map[lo-1]*10)/10;
  return Math.round((map[lo-1]+(x-lo)*(map[hi-1]-map[lo-1]))*10)/10;
}
function scoreStr(s){return s==null?'—':(Math.round(s*10)/10)+'%';}
/* The headline number: score out of 100, with rating/5 as the supporting
 * detail — the way the spec frames every screen. */
function scoreBig(score,rating){
  if(score==null)return '—';
  return n1(score)+'<small>%</small>'+(rating!=null?'<span class="rt-sub">'+ratingStr(rating)+'/5</span>':'');
}
/* subtle count-up on KPI values — animates the leading numeric text node only */
function countUp(){
  try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;}catch(e){}
  $$('#content .kc-value,#content .hero-fig').forEach(el=>{
    const raw=el.firstChild;if(!raw||raw.nodeType!==3)return;
    const m=/^\s*(\d+(?:\.\d+)?)\s*$/.exec(raw.nodeValue);if(!m)return;
    const to=parseFloat(m[1]),dec=(m[1].split('.')[1]||'').length,t0=performance.now(),dur=420;
    function step(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);raw.nodeValue=(to*e).toFixed(dec);if(k<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  });
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');if(act){handleAct(act.dataset.act,act);return;}
  const md=e.target.closest('[data-mode]');if(md){setMode(md.dataset.mode);return;}
  const nv=e.target.closest('[data-nav]');if(nv){go(nv.dataset.nav);closeNav();return;}
  const cr=e.target.closest('[data-crumb]');if(cr){let cx=null;try{cx=cr.dataset.crumbctx?JSON.parse(cr.dataset.crumbctx):null;}catch(x){}go(cr.dataset.crumb,cx);return;}
  const tb=e.target.closest('[data-tab]');if(tb){APP.tab=tb.dataset.tab;render();return;}
  const ex=e.target.closest('[data-exp]');if(ex){const k=ex.dataset.exp;APP.expanded[k]=!APP.expanded[k];render();return;}
  const cl=e.target.closest('[data-clear]');if(cl){APP.filters[cl.dataset.clear]='';APP.table.page=0;render();return;}
  const fs=e.target.closest('[data-fstatus]');if(fs){APP.filters.status=fs.dataset.fstatus;APP.table.page=0;render();return;}
  const so=e.target.closest('[data-sort]');if(so){const k=so.dataset.sort;if(APP.table.sort===k)APP.table.dir*=-1;else{APP.table.sort=k;APP.table.dir=(['employee','department','subTeam','kra','kpi','type'].indexOf(k)>=0)?1:-1;}render();return;}
  const pg=e.target.closest('[data-page]');if(pg){APP.table.page+=(pg.dataset.page==='next'?1:-1);render();return;}
  const pk=e.target.closest('[data-pick]');if(pk){APP.meId=pk.dataset.pick;go('me');return;}
  const rc=e.target.closest('[data-rec]');if(rc){openRec(rc.dataset.rec);return;}
  const pv=e.target.closest('[data-persp]');if(pv){go('perspective',{name:pv.dataset.persp});return;}
  const sb=e.target.closest('[data-subteam]');if(sb){APP.filters.subTeam=sb.dataset.subteam;APP.filters.dept=(subById(sb.dataset.subteam)||{}).deptId||'';go('employees');return;}
  const dp=e.target.closest('[data-dept]');if(dp){go('dept',{deptId:dp.dataset.dept});return;}
  const mtab=e.target.closest('[data-motab]');if(mtab){MO.tab=mtab.dataset.motab;moRender();return;}
  const tpn=e.target.closest('[data-tgtperson]');if(tpn){const parts=String(tpn.dataset.tgtperson).split('|');moTargetPlan(parts[0],parts.slice(1).join('|'));return;}
  const pc=e.target.closest('[data-person]');if(pc){go('person',{empId:pc.dataset.person});return;}
  const rv=e.target.closest('[data-review]');if(rv){go('review',{empId:rv.dataset.review});return;}
  const kd=e.target.closest('[data-def]');if(kd){go('kpidef',{defId:kd.dataset.def});return;}
});
document.addEventListener('change',e=>{
  const fl=e.target.closest('[data-filter]');if(fl){APP.filters[fl.dataset.filter]=fl.value;if(fl.dataset.filter==='dept')APP.filters.subTeam='';APP.table.page=0;render();return;}
  if(e.target&&e.target.id==='periodSel'){APP.period=e.target.value;doRefresh();return;}
  const ks=e.target.closest('[data-kpisel]');if(ks){APP.ctx.kpiName=e.target.value;render();return;}
});
/* Debounced search that restores focus + caret after the re-render. */
function liveSearch(id,apply){
  let t;return function(v){clearTimeout(t);t=setTimeout(()=>{
    apply(v);
    const el=document.activeElement,was=el&&el.id===id,pos=was?el.selectionStart:null;
    render();
    if(was){const s=$('#'+id);if(s){s.focus();try{s.setSelectionRange(pos,pos);}catch(x){}}}
  },200);};
}
const runFilterSearch=liveSearch('fSearch',v=>{APP.filters.search=v;APP.table.page=0;});
const runLibSearch=liveSearch('libSearch',v=>{APP.ctx.q=v;});
document.addEventListener('input',e=>{
  if(!e.target)return;
  if(e.target.id==='fSearch')runFilterSearch(e.target.value.trim());
  else if(e.target.id==='libSearch')runLibSearch(e.target.value.trim());
});
function handleAct(a,el){
  if(a==='mo-close')moClose();
  else if(a==='mo-back')moBack();
  else if(a==='back')goBack();
  else if(a==='close-drawer')closeDrawer();
  else if(a==='toggle-nav'){const s=$('#sidebar'),sc=$('#sbScrim');if(s){const on=s.classList.toggle('open');if(sc)sc.classList.toggle('on',on);}}
  else if(a==='close-nav')closeNav();
  else if(a==='toggle-rail')setRail(!$('#app').classList.contains('rail'));
  else if(a==='toggle-group'){const k=el.dataset.group;APP.navOpen[k]=!APP.navOpen[k];
    try{localStorage.setItem('kra_navopen',JSON.stringify(APP.navOpen));}catch(_){}
    buildChrome();}
  else if(a==='go-me')go(APP.meId?'me':'pickme');
  else if(a==='refresh')doRefresh();
  else if(a==='clear-filters'){APP.filters={dept:'',subTeam:'',status:'',search:''};APP.table.page=0;render();}
  else if(a==='save-actual')saveActual(el.dataset.rec);
  else if(a==='save-checkin')saveCheckin(el.dataset.rec);
  else if(a==='scaffold')doScaffold();
  else if(a==='save-settings')doSaveSettings();
  else if(a==='save-scoring')doSaveScoring();
  else if(a==='save-statuses')doSaveStatuses();
  else if(a==='save-cycle')doSaveCycle(el.dataset.period);
  else if(a==='save-teams')doSaveTeams();
  else if(a==='save-review')doSaveReview(el.dataset.emp,el.dataset.stage,el.dataset.submit==='1');
  else if(a==='save-assignment')doSaveAssignment(el.dataset.rec);
  else if(a==='switch-me')go('pickme');
}
function closeNav(){const s=$('#sidebar');if(s)s.classList.remove('open');const sc=$('#sbScrim');if(sc)sc.classList.remove('on');}
/* Rail preference survives reloads. localStorage can be walled off inside the
 * Apps Script iframe, so every access is guarded. */
function setRail(on){
  const ap=$('#app');if(!ap)return;
  ap.classList.toggle('rail',!!on);
  try{localStorage.setItem('kra_rail',on?'1':'0');}catch(_){}
  moveNavRail();
}
function restoreRail(){
  try{if(localStorage.getItem('kra_rail')==='1')$('#app').classList.add('rail');}catch(_){}
  try{APP.navOpen=JSON.parse(localStorage.getItem('kra_navopen')||'{}')||{};}catch(_){APP.navOpen={};}
}
async function doRefresh(){toast('Refreshing…');try{const b=await call('apiBootstrap',{force:true,period:APP.period||undefined});if(b&&b.ok&&b.connected!==false){applyBoot(b);toast('Up to date');}else showState('error',b&&b.error||'Refresh failed');}catch(e){if(e&&e.__offline)showState('offline');else toast('Error',true);}}
async function doScaffold(){toast('Building actuals sheet…');try{const res=await call('apiScaffoldActuals',{period:APP.period});if(res&&res.ok){toast(res.added+' rows added to '+res.tab);doRefresh();}else toast((res&&res.error)||'Failed',true);}catch(e){if(e&&e.__offline)toast('Connect to the sheet first',true);else toast('Failed',true);}}
async function doSaveSettings(){const on=$('#setOnTrack'),ar=$('#setAtRisk');const p={};if(on)p.onTrack=on.value;if(ar)p.atRisk=ar.value;await pushSettings(p,'Thresholds saved');}
async function doSaveScoring(){
  const pct=[0,1,2,3,4].map(i=>{const el=$('#scPct'+i);return el?el.value:null;});
  if(pct.some(v=>v===null||v===''))
    return toast('All five rating percentages are required',true);
  await pushSettings({ratingPct:pct,interpolate:$('#scInterp')?$('#scInterp').checked:true},'Scoring saved');
}
async function doSaveStatuses(){
  const scale=SCALE().slice().sort((a,b)=>a.min-b.min).map((s,i)=>{
    const l=$('#stLabel'+i),m=$('#stMin'+i);
    return {key:s.key,label:l?l.value.trim()||s.key:s.label,min:m?m.value:s.min};
  });
  if(scale.some(s=>s.min===''||isNaN(Number(s.min))))return toast('Every status needs a numeric cut-off',true);
  await pushSettings({statusScale:scale},'Statuses saved');
}
async function pushSettings(payload,okMsg){
  toast('Saving…');
  try{const res=await call('apiSaveSettings',payload);
    if(res&&res.ok){toast(okMsg||'Saved');doRefresh();}else toast((res&&res.error)||'Save failed',true);
  }catch(e){if(e&&e.__offline)toast('Connect to the sheet to save',true);else toast('Save failed',true);}
}
async function doSaveTeams(){
  const teams=((B().settings&&B().settings.teams)||[]).map((t,i)=>{
    const nm=$('#tmName'+i),ld=$('#tmLead'+i),pt=$('#tmPat'+i);
    return {key:t.key,name:nm?nm.value.trim()||t.name:t.name,lead:ld?ld.value.trim():t.lead,
      patterns:pt?pt.value.split(',').map(x=>x.trim()).filter(Boolean):t.patterns,members:t.members||[]};
  });
  if(!teams.length)return toast('No teams to save',true);
  toast('Saving teams…');
  try{const res=await call('apiSaveTeams',{teams:teams});
    if(res&&res.ok){toast('Teams saved');doRefresh();}else toast((res&&res.error)||'Save failed',true);
  }catch(e){if(e&&e.__offline)toast('Connect to the sheet to save',true);else toast('Save failed',true);}
}
async function doSaveCycle(period){
  const g=id=>{const el=$('#'+id+'_'+CSS.escape(period));return el?el.value:undefined;};
  const p={period:period,name:g('cyName'),status:g('cyStatus'),startDate:g('cyStart'),endDate:g('cyEnd'),reviewDue:g('cyReview'),note:g('cyNote')};
  if(p.startDate&&p.endDate&&p.startDate>p.endDate)return toast('End date is before the start date',true);
  toast('Saving cycle…');
  try{const res=await call('apiSaveCycle',p);
    if(res&&res.ok){toast('Cycle saved · '+res.status);doRefresh();}else toast((res&&res.error)||'Save failed',true);
  }catch(e){if(e&&e.__offline)toast('Connect to the sheet to save',true);else toast('Save failed',true);}
}
async function doSaveReview(empId,stage,submit){
  const e=empById(empId);if(!e)return;
  const r=$('#rvRating_'+stage),c=$('#rvComment_'+stage);
  const p={employeeId:empId,employee:e.name,department:e.department,period:APP.period,stage:stage,
    systemRating:e.rating==null?'':e.rating,systemScore:e.score==null?'':e.score,
    rating:r?r.value:'',comment:c?c.value:'',submit:!!submit};
  toast(submit?'Submitting…':'Saving…');
  try{const res=await call('apiSaveReview',p);
    if(res&&res.ok){toast(submit?('Submitted · '+res.status):'Draft saved');doRefresh();}else toast((res&&res.error)||'Save failed',true);
  }catch(e2){if(e2&&e2.__offline)toast('Connect to the sheet to save',true);else toast('Save failed',true);}
}
async function doSaveAssignment(id){
  const r=recById(id);if(!r)return;
  const w=$('#asgWeight'),d=$('#asgDirection'),rv=$('#asgReviewer');
  const bands=[0,1,2,3,4].map(i=>{const el=$('#asgBand'+i);return el?el.value:'';});
  const p={kpiId:id,period:APP.period,employee:r.employee,kpi:r.kpi||r.kra,
    weight:w?w.value:undefined,direction:d?d.value:undefined,reviewer:rv?rv.value:undefined,
    bands:bands};
  toast('Saving assignment…');
  try{const res=await call('apiSaveAssignment',p);
    if(res&&res.ok){const b=await call('apiBootstrap',{force:true,period:APP.period});applyBoot(b);toast('Assignment saved');openRec(id);}
    else toast((res&&res.error)||'Save failed',true);
  }catch(e){if(e&&e.__offline)toast('Connect to the sheet to save',true);else toast('Save failed',true);}
}
/* Shared hover layer: any element carrying data-tip gets a tooltip. Charts are
   interactive by default — a static SVG on a dashboard is a missed affordance. */
(function(){
  let tipEl;
  const get=()=>tipEl||(tipEl=$('#vtip'));
  document.addEventListener('mouseover',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip]');if(!t)return;
    const el=get();if(!el)return;
    el.innerHTML=esc(t.getAttribute('data-tip')).replace(/ · /g,' <span class="k">·</span> ');
    el.classList.add('on');
  });
  document.addEventListener('mousemove',e=>{
    const el=get();if(!el||!el.classList.contains('on'))return;
    el.style.left=e.clientX+'px';
    el.style.top=Math.max(34,e.clientY)+'px';
  });
  document.addEventListener('mouseout',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip]');if(!t)return;
    const el=get();if(el)el.classList.remove('on');
  });
  window.addEventListener('scroll',()=>{const el=get();if(el)el.classList.remove('on');},true);
})();
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#mo')&&$('#mo').classList.contains('on')){moBack();return;}closeDrawer();closeNav();const t=$('#vtip');if(t)t.classList.remove('on');return;}
  // Alt+← / Backspace (outside a field) go back, matching browser convention
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'');
  if(!typing&&((e.altKey&&e.key==='ArrowLeft')||e.key==='Backspace')){e.preventDefault();goBack();}
});
/* The browser/OS back gesture drives the same stack. */
window.addEventListener('popstate',()=>{
  if($('#mo')&&$('#mo').classList.contains('on')){moBack();try{history.pushState({},'',location.href);}catch(e){}return;}
  if(NAVSTACK.length){goBack();try{history.pushState({},'',location.href);}catch(e){}}
});

/* ---------------- ReactBits-inspired motion ----------------
 * Spotlight: one delegated listener feeds the hovered card its cursor offset. */
document.addEventListener('pointermove',e=>{
  const c=e.target.closest&&e.target.closest('.kc,.kcard,.dcard,.tile');
  if(!c)return;
  const r=c.getBoundingClientRect();
  c.style.setProperty('--mx',(e.clientX-r.left)+'px');
  c.style.setProperty('--my',(e.clientY-r.top)+'px');
},{passive:true});
window.addEventListener('resize',()=>requestAnimationFrame(moveNavRail));
let toastT;function toast(m,err){const t=$('#toast');t.textContent=m;t.classList.toggle('err',!!err);t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),err?4000:2200);}
boot();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recykal · KRA / KPI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   FOUNDATION
   Every value is a token. No component rule below invents a colour, size,
   radius or spacing step of its own.
   ============================================================================ */
:root{
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

  --bg:#FAFAF9;--card:#FFFFFF;--surface:#F4F4F2;--well:#E9E8E4;
  --ink:#18181B;--ink-2:#3F3F46;--muted:#6B6B72;--faint:#8A8A92;
  --line:#E6E6E2;--line-2:#D6D6D1;--line-soft:#F0F0EC;

  /* one accent, and it means INTERACTIVE - never performance */
  --accent:#1F1F23;--accent-soft:#EFEFED;

  /* the status ramp means performance, and nothing else does */
  --good:#3F6B47;--good-soft:#EAF0EA;
  --warn:#8A6320;--warn-soft:#F5EFE2;
  --bad:#A3453A;--bad-soft:#F6E9E6;
  --none:#6B6B72;--none-soft:#F1F1EF;

  --fs-page:26px;--fs-xl:20px;--fs-lg:15px;--fs-md:13px;--fs-sm:12px;--fs-xs:11px;
  --fw-n:400;--fw-m:500;--fw-b:600;
  --r-ctl:6px;--r-card:10px;--r-pill:999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s8:48px;
  --ease:cubic-bezier(.2,.6,.35,1);--d1:120ms;
  --maxw:1200px;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:var(--fs-md);
  line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1;
  letter-spacing:-.01em}
button,select{font-family:inherit;cursor:pointer}
b,strong{font-weight:var(--fw-b)}
small{font-size:var(--fs-xs)}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-ctl)}

/* ---------------------------------------------------------------- SHELL -- */
.top{position:sticky;top:0;z-index:20;background:rgba(250,250,249,.88);
  backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--s5);
  height:52px;display:flex;align-items:center;gap:var(--s4)}
.mark{font-size:var(--fs-sm);font-weight:var(--fw-b);letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap}
.teams{display:flex;gap:var(--s1);overflow-x:auto;flex:1;scrollbar-width:none}
.teams::-webkit-scrollbar{display:none}
.tb{border:none;background:transparent;color:var(--muted);font-size:var(--fs-md);
  font-weight:var(--fw-m);padding:var(--s1) var(--s3);border-radius:var(--r-ctl);
  white-space:nowrap;transition:background var(--d1) var(--ease),color var(--d1) var(--ease)}
.tb:hover{background:var(--accent-soft);color:var(--ink)}
.tb.on{background:var(--accent);color:#fff}
.tb .n{opacity:.6;margin-left:5px;font-size:var(--fs-xs)}
.sel{border:1px solid var(--line-2);background:var(--card);color:var(--ink);
  font-size:var(--fs-sm);font-weight:var(--fw-m);padding:5px var(--s2);
  border-radius:var(--r-ctl);max-width:170px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:var(--s6) var(--s5) var(--s8)}

/* ----------------------------------------------------------------- TYPE -- */
h1{font-size:var(--fs-page);font-weight:var(--fw-b);letter-spacing:-.02em;line-height:1.2;margin:0}
.sub{color:var(--muted);margin-top:var(--s1)}
.sect{font-size:var(--fs-lg);font-weight:var(--fw-b);letter-spacing:-.015em;
  margin:var(--s6) 0 var(--s3);display:flex;align-items:baseline;gap:var(--s2)}
.sect .r{margin-left:auto;font-size:var(--fs-sm);font-weight:var(--fw-n);color:var(--muted)}
.crumb{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm);
  color:var(--muted);margin-bottom:var(--s3)}
.crumb button{border:none;background:none;color:var(--ink);font-size:var(--fs-sm);
  font-weight:var(--fw-m);padding:0;text-decoration:underline;text-underline-offset:2px}

/* ---------------------------------------------------------------- CARDS -- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s4)}
.stat .l{font-size:var(--fs-xs);font-weight:var(--fw-m);color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:var(--fs-page);font-weight:var(--fw-b);letter-spacing:-.02em;
  line-height:1.15;margin-top:var(--s2);font-variant-numeric:tabular-nums}
.stat .v small{font-size:var(--fs-lg);color:var(--muted);font-weight:var(--fw-m)}
.stat .s{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--s1)}

/* ---------------------------------------------------------------- TABLE -- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-md)}
th{text-align:left;font-size:var(--fs-xs);font-weight:var(--fw-m);color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;padding:var(--s2) var(--s3);
  border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--card)}
td{padding:var(--s3);border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.quiet{color:var(--muted);font-weight:var(--fw-n)}
.strong{font-weight:var(--fw-b)}
.nm{font-weight:var(--fw-m)}
.nm small{display:block;color:var(--muted);font-weight:var(--fw-n);margin-top:1px}
tr.click{cursor:pointer;transition:background var(--d1) var(--ease)}
tr.click:hover{background:var(--surface)}
/* KRA group header is a row, not a nested table, so every column keeps one
   alignment the whole way down the page */
tr.grp td{background:var(--surface);font-size:var(--fs-xs);font-weight:var(--fw-b);
  color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;
  padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);cursor:pointer}
tr.grp .cv{display:inline-block;width:10px;color:var(--muted);font-weight:var(--fw-n)}
tr.grp .rs{float:right;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
td.kpi{padding-left:var(--s5)}

/* ----------------------------------------------------------------- PILL -- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);
  font-weight:var(--fw-m);padding:2px 9px;border-radius:var(--r-pill);white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--none-soft);color:var(--muted)}

/* ------------------------------------------------------------------ BAR --
   Magnitude on a nominal list: one ink, length carries the value. The band
   ticks mark the KPI's own thresholds so a bar can be read against its ladder
   rather than against an assumed 100. */
.bar{position:relative;height:6px;background:var(--well);border-radius:var(--r-pill);
  overflow:hidden;min-width:64px}
.bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--ink)}
.bar i.good{background:var(--good)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.barwrap{display:flex;align-items:center;gap:var(--s2);min-width:120px}
.barwrap .p{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

/* ---------------------------------------------------------------- STATE -- */
.state{display:grid;place-items:center;min-height:56vh;padding:var(--s5);text-align:center}
.state h2{font-size:var(--fs-xl);font-weight:var(--fw-b);margin:0 0 var(--s2)}
.state p{color:var(--muted);margin:0 0 var(--s4);max-width:44ch;line-height:1.6}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:var(--r-ctl);
  padding:8px 16px;font-size:var(--fs-md);font-weight:var(--fw-m)}
.btn:hover{opacity:.88}
.empty{padding:var(--s5);text-align:center;color:var(--muted)}
.note{font-size:var(--fs-sm);color:var(--muted);line-height:1.6;margin-top:var(--s3);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s3)}
.skl{background:linear-gradient(90deg,var(--surface),var(--well),var(--surface));
  background-size:200% 100%;border-radius:var(--r-card);animation:sh 1.4s ease-in-out infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ------------------------------------------------------------ RESPONSE -- */
@media(max-width:860px){
  .top-in{padding:0 var(--s4);gap:var(--s3)}
  .mark{display:none}
  .wrap{padding:var(--s5) var(--s4) var(--s6)}
}
@media(max-width:560px){
  .wrap{padding:var(--s4) var(--s3) var(--s6)}
  h1{font-size:var(--fs-xl)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <span class="mark">KRA / KPI</span>
  <nav class="teams" id="teams"></nav>
  <select class="sel" id="month" aria-label="Month"></select>
</div></header>
<main class="wrap" id="view"></main>

<script>
'use strict';
/* ============================================================================
   KRA / KPI Tracker - visualisation layer
   ----------------------------------------------------------------------------
   This file renders; it does not calculate. Achievement %, weighted score and
   status arrive already derived from the backend, so there is exactly one
   calculation engine in the product and it is not here. The only arithmetic
   below is presentational rollup - averaging KPI scores into a KRA line - and
   it is marked where it happens.

   Nothing about any team is hard-coded. Teams, people, KRAs, KPIs, weightages,
   units and directions all arrive from apiMasterModel(). A sixth team, or one
   person's KPI set changing, needs no edit here.
   ============================================================================ */

var $ = function (s) { return document.querySelector(s); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
/* Null-safe throughout: a missing measurement renders as an em dash, never as
   undefined, NaN or null. */
var n1 = function (v) { return (v == null || isNaN(v)) ? null : Math.round(v * 10) / 10; };
var show = function (v) { var n = n1(v); return n == null ? '—' : n; };

var APP = { model: null, teamId: null, empId: null, month: null, open: {} };

/* --------------------------------------------------------------- FORMAT --
 * Presentation follows the KPI's own measurement type, so a currency target
 * and a days target never render the same way. */
function fmt(value, unit) {
  var n = n1(value);
  if (n == null) return '—';
  switch (unit) {
    case 'CR':      return '₹' + n + ' Cr';
    case 'MT':      return n + ' MT';
    case 'DAYS':    return n + (Math.abs(n) === 1 ? ' day' : ' days');
    case 'PERCENT': return n + '%';
    default:        return String(n);
  }
}
function targetCell(k) { return k.target == null ? '<span class="quiet">Target not defined</span>' : fmt(k.target, k.unit); }
function actualCell(k) { return k.actual == null ? '<span class="quiet">Actual pending</span>' : fmt(k.actual, k.unit); }

/* --------------------------------------------------------------- DATA --- */
function load() {
  render(skeleton());
  if (!(window.google && google.script && google.script.run)) {
    return render(state('Not connected',
      'Open this page through the deployed Apps Script web app URL to load data.'));
  }
  google.script.run
    .withSuccessHandler(function (m) {
      if (!m || !m.ok) return render(state('Could not load', (m && m.error) || 'The backend returned no data.'));
      APP.model = m;
      if (!APP.teamId && m.teams && m.teams.length) APP.teamId = m.teams[0].team_id;
      draw();
    })
    .withFailureHandler(function (e) {
      render(state('Could not load', (e && e.message) || 'The backend could not be reached.'));
    })
    .apiMasterModel(null, APP.month);
}

/* ------------------------------------------------------------ HELPERS --- */
function teamById(id) {
  return (APP.model.teams || []).filter(function (t) { return t.team_id === id; })[0] || null;
}
function membersOf(id) {
  return (APP.model.scorecards || []).filter(function (s) { return s.team_id === id; });
}
function statusClass(s) {
  if (!s || s === 'Awaiting data') return 'none';
  if (s === 'Exceeded' || s === 'Above Expectation') return 'good';
  if (s === 'Near') return 'warn';
  return 'bad';
}
function scoreStatus(v) {
  if (v == null) return 'Awaiting data';
  if (v >= 100) return 'Exceeded';
  if (v >= 90) return 'Above Expectation';
  if (v >= 75) return 'Near';
  if (v >= 60) return 'At Risk';
  return 'Critical';
}
/* Members with no actuals are not counted as zero - that reports missing data
   as failure. They are excluded and the coverage is stated instead. */
function mean(list) {
  var v = list.filter(function (x) { return x != null; });
  if (!v.length) return null;
  var s = 0; v.forEach(function (x) { s += x; });
  return Math.round(s / v.length * 10) / 10;
}
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

/* Rollup: a KRA line is the weighted-score sum of its KPIs over their combined
   weightage. This is presentation only - it re-expresses backend values at a
   coarser grain and invents nothing. */
function rollupByKra(kpis) {
  var by = {}, order = [];
  kpis.forEach(function (k) {
    if (!by[k.kra]) { by[k.kra] = { kra: k.kra, perspective: k.perspective, kpis: [], wt: 0, earned: 0, measured: 0 }; order.push(k.kra); }
    var g = by[k.kra];
    g.kpis.push(k); g.wt += Number(k.weightage) || 0;
    if (k.weighted_score != null) { g.earned += k.weighted_score; g.measured += Number(k.weightage) || 0; }
  });
  return order.map(function (n) {
    var g = by[n];
    g.achievement = g.measured > 0 ? Math.round(g.earned / g.measured * 1000) / 10 : null;
    g.score = g.measured > 0 ? Math.round(g.earned * 10) / 10 : null;
    return g;
  });
}

/* --------------------------------------------------------------- VIEWS -- */
function draw() {
  drawTeams(); drawMonths();
  render(APP.empId ? individual() : team());
}

function drawTeams() {
  $('#teams').innerHTML = (APP.model.teams || []).map(function (t) {
    return '<button class="tb' + (t.team_id === APP.teamId ? ' on' : '') +
      '" data-team="' + esc(t.team_id) + '">' + esc(t.team_name) +
      '<span class="n">' + membersOf(t.team_id).length + '</span></button>';
  }).join('');
}

/* Months come from the backend. When no period data exists yet the control
   says so rather than offering invented dates. */
function drawMonths() {
  var months = APP.model.months || [];
  var sel = $('#month');
  if (!months.length) {
    sel.innerHTML = '<option>No period loaded</option>';
    sel.disabled = true; return;
  }
  sel.disabled = false;
  sel.innerHTML = months.map(function (m) {
    return '<option value="' + esc(m) + '"' + (m === APP.month ? ' selected' : '') + '>' + esc(monthLabel(m)) + '</option>';
  }).join('');
}
function monthLabel(m) {
  var M = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July',
           'August', 'September', 'October', 'November', 'December'];
  var x = /^(\d{4})-(\d{2})$/.exec(m || '');
  return x ? (M[+x[2]] || x[2]) + ' ' + x[1] : (m || '');
}

function team() {
  var t = teamById(APP.teamId);
  if (!t) return state('No team selected', 'Choose a team above.');
  var members = membersOf(APP.teamId);
  var scored = members.filter(function (m) { return m.overall_score != null; });
  var score = mean(members.map(function (m) { return m.overall_score; }));

  /* Team KRA rollup across every member's own assignment - not an assumed
     team-wide KPI list, because the teams do not have one. */
  var all = [];
  members.forEach(function (m) { all = all.concat(m.kpis); });
  var kras = rollupByKra(all);
  var achievement = mean(all.map(function (k) { return k.achievement; }));

  var head = '<h1>' + esc(t.team_name) + '</h1><div class="sub">Team performance · ' +
    esc(APP.month ? monthLabel(APP.month) : 'no period loaded') + '</div>';

  var stats = '<div class="stats" style="margin-top:var(--s5)">' +
    stat('Overall score', score == null ? '—' : show(score) + '<small> / 100</small>',
      scored.length + ' of ' + members.length + ' measured') +
    stat('KPI achievement', achievement == null ? '—' : show(achievement) + '%',
      'mean across assigned KPIs') +
    stat('Members', String(members.length), plural(distinctSets(members), 'distinct KPI set')) +
    stat('KPIs assigned', String(all.length), plural(kras.length, 'KRA')) +
    '</div>';

  var kraRows = kras.map(function (g) {
    var open = APP.open[g.kra] !== false;
    var head = '<tr class="grp" data-kra="' + esc(g.kra) + '"><td colspan="7">' +
      '<span class="cv">' + (open ? '▾' : '▸') + '</span>' + esc(g.kra) +
      '<span class="rs">' + (g.achievement == null ? '—' : show(g.achievement) + '%') + '</span></td></tr>';
    if (!open) return head;
    return head + g.kpis.map(function (k) {
      return '<tr>' +
        '<td class="kpi nm">' + esc(k.kpi) + '<small>' + esc(k.perspective || '') + '</small></td>' +
        '<td class="num quiet">' + show(k.weightage) + '%</td>' +
        '<td class="num quiet">' + targetCell(k) + '</td>' +
        '<td class="num">' + actualCell(k) + '</td>' +
        '<td class="num strong">' + (k.achievement == null ? '—' : show(k.achievement) + '%') + '</td>' +
        '<td>' + barFor(k.achievement) + '</td>' +
        '<td class="num">' + show(k.weighted_score) + '</td></tr>';
    }).join('');
  }).join('');

  var kraTable = '<div class="sect">KRA / KPI performance<span class="r">weightage · target · actual · achievement · score</span></div>' +
    '<div class="panel"><div class="tw"><table><thead><tr>' +
    '<th>KRA / KPI</th><th class="num">Weight</th><th class="num">Target</th>' +
    '<th class="num">Actual</th><th class="num">Achievement</th><th></th><th class="num">Score</th>' +
    '</tr></thead><tbody>' +
    (kraRows || '<tr><td colspan="7" class="empty">No KPIs assigned for this team.</td></tr>') +
    '</tbody></table></div></div>';

  var peopleRows = members.slice().sort(function (a, b) {
    return (b.overall_score == null ? -1 : b.overall_score) - (a.overall_score == null ? -1 : a.overall_score);
  }).map(function (m) {
    return '<tr class="click" data-emp="' + esc(m.employee_id) + '">' +
      '<td class="nm">' + esc(m.employee_name) + '<small>' + esc(m.designation || '') +
      (m.region ? ' · ' + esc(m.region) : '') + '</small></td>' +
      '<td class="num quiet">' + m.kpis.length + '</td>' +
      '<td class="num strong">' + show(m.overall_score) + '</td>' +
      '<td>' + barFor(m.overall_score) + '</td>' +
      '<td>' + pill(scoreStatus(m.overall_score)) + '</td></tr>';
  }).join('');

  var peopleTable = '<div class="sect">Individual performance<span class="r">score / 100</span></div>' +
    '<div class="panel"><div class="tw"><table><thead><tr>' +
    '<th>Employee</th><th class="num">KPIs</th><th class="num">Score</th><th></th><th>Status</th>' +
    '</tr></thead><tbody>' +
    (peopleRows || '<tr><td colspan="5" class="empty">No members mapped to this team.</td></tr>') +
    '</tbody></table></div></div>';

  var unmapped = members.filter(function (m) { return !m.kpis.length; });
  var note = unmapped.length
    ? '<div class="note">' + plural(unmapped.length, 'member') + ' without a KPI set: ' +
      unmapped.map(function (m) { return esc(m.employee_name); }).join(', ') +
      ' — in the roster, but not yet assigned in the master.</div>' : '';

  return head + stats + kraTable + peopleTable + note;
}

function individual() {
  var m = (APP.model.scorecards || []).filter(function (s) { return s.employee_id === APP.empId; })[0];
  if (!m) return state('Not found', 'That employee is not in the current model.');
  var t = teamById(m.team_id);
  var kras = rollupByKra(m.kpis);

  var crumb = '<div class="crumb"><button data-back="1">' + esc(t ? t.team_name : 'Team') +
    '</button><span>›</span><span>' + esc(m.employee_name) + '</span></div>';
  var head = '<h1>' + esc(m.employee_name) + '</h1><div class="sub">' +
    esc([m.designation, t ? t.team_name : '', m.region].filter(Boolean).join(' · ')) + '</div>';

  var pending = m.kpis.filter(function (k) { return k.achievement == null; }).length;
  var stats = '<div class="stats" style="margin-top:var(--s5)">' +
    stat('Overall score', show(m.overall_score) + (m.overall_score == null ? '' : '<small> / 100</small>'),
      m.overall_score == null ? 'Awaiting targets and actuals'
        : show(m.measured_weightage) + '% of weightage measured') +
    stat('KPIs', String(m.kpis.length), plural(kras.length, 'KRA')) +
    stat('Weightage', show(m.assigned_weightage) + '%', 'assigned in the master') +
    stat('Awaiting data', String(pending), 'excluded from the score') +
    '</div>';

  var rows = kras.map(function (g) {
    var open = APP.open[g.kra] !== false;
    var h = '<tr class="grp" data-kra="' + esc(g.kra) + '"><td colspan="7">' +
      '<span class="cv">' + (open ? '▾' : '▸') + '</span>' + esc(g.kra) +
      '<span class="rs">' + (g.achievement == null ? '—' : show(g.achievement) + '%') + '</span></td></tr>';
    if (!open) return h;
    return h + g.kpis.map(function (k) {
      return '<tr>' +
        '<td class="kpi nm">' + esc(k.kpi) + '<small>' + esc(k.perspective || '') +
        (k.direction === 'LOWER_IS_BETTER' ? ' · lower is better' : '') + '</small></td>' +
        '<td class="num quiet">' + show(k.weightage) + '%</td>' +
        '<td class="num quiet">' + targetCell(k) + '</td>' +
        '<td class="num">' + actualCell(k) + '</td>' +
        '<td class="num strong">' + (k.achievement == null ? '—' : show(k.achievement) + '%') + '</td>' +
        '<td>' + barFor(k.achievement) + '</td>' +
        '<td class="num">' + show(k.weighted_score) + '</td></tr>';
    }).join('');
  }).join('');

  var table = '<div class="sect">KRA / KPI<span class="r">only this employee\'s assignment</span></div>' +
    '<div class="panel"><div class="tw"><table><thead><tr>' +
    '<th>KRA / KPI</th><th class="num">Weight</th><th class="num">Target</th>' +
    '<th class="num">Actual</th><th class="num">Achievement</th><th></th><th class="num">Score</th>' +
    '</tr></thead><tbody>' +
    (rows || '<tr><td colspan="7" class="empty">No KPIs assigned in the master.</td></tr>') +
    '</tbody></table></div></div>';

  var note = pending
    ? '<div class="note">' + pending + ' of ' + m.kpis.length +
      ' KPIs have no target or actual for this period, so they are excluded from the score rather than counted as zero. ' +
      'The score therefore covers ' + show(m.measured_weightage) + '% of assigned weightage.</div>' : '';

  return crumb + head + stats + table + note;
}

/* ---------------------------------------------------------- COMPONENTS -- */
function stat(label, value, sub) {
  return '<div class="stat"><div class="l">' + esc(label) + '</div><div class="v">' + value + '</div>' +
    (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div>';
}
function pill(s) { return '<span class="pill ' + statusClass(s) + '">' + esc(s || 'Awaiting data') + '</span>'; }
function barFor(v) {
  if (v == null) return '<div class="barwrap"><div class="bar"></div><span class="p">—</span></div>';
  var w = Math.max(0, Math.min(100, v));
  var cls = v >= 90 ? 'good' : v >= 75 ? 'warn' : 'bad';
  return '<div class="barwrap"><div class="bar"><i class="' + cls + '" style="width:' + w + '%"></i></div>' +
    '<span class="p">' + show(v) + '%</span></div>';
}
function distinctSets(members) {
  var seen = {};
  members.forEach(function (m) {
    if (!m.kpis.length) return;
    seen[m.kpis.map(function (k) { return k.kpi + ':' + k.weightage; }).sort().join('|')] = 1;
  });
  return Object.keys(seen).length;
}
function state(title, body) {
  return '<div class="state"><div><h2>' + esc(title) + '</h2><p>' + esc(body) + '</p>' +
    '<button class="btn" data-retry="1">Try again</button></div></div>';
}
function skeleton() {
  return '<div class="skl" style="height:32px;width:200px"></div>' +
    '<div class="stats" style="margin-top:var(--s5)">' +
    '<div class="skl" style="height:92px"></div><div class="skl" style="height:92px"></div>' +
    '<div class="skl" style="height:92px"></div><div class="skl" style="height:92px"></div></div>' +
    '<div class="skl" style="height:260px;margin-top:var(--s6)"></div>';
}
function render(h) { $('#view').innerHTML = h; }

/* ---------------------------------------------------------------- WIRE -- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-team]');
  if (t) { APP.teamId = t.dataset.team; APP.empId = null; draw(); scrollTo(0, 0); return; }
  var emp = e.target.closest('[data-emp]');
  if (emp) { APP.empId = emp.dataset.emp; draw(); scrollTo(0, 0); return; }
  if (e.target.closest('[data-back]')) { APP.empId = null; draw(); scrollTo(0, 0); return; }
  var kra = e.target.closest('[data-kra]');
  if (kra) { var k = kra.dataset.kra; APP.open[k] = APP.open[k] === false; draw(); return; }
  if (e.target.closest('[data-retry]')) { load(); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'month') { APP.month = e.target.value; load(); }
});

load();
</script>
</body>
</html>

<script>
'use strict';
/* ============================================================================
   KRA / KPI Tracker
   Api -> Store -> Sel -> render. One backend call; every derived list computed
   in one place; pure render functions. The frontend calculates nothing about
   performance — achievement %, weighted score, level and status all arrive
   derived from apiMasterModel(); the only arithmetic here is presentational
   rollup (restating backend weighted scores at KRA or team grain).
   ============================================================================ */
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
var n1 = function (v) { return (v == null || v === '' || isNaN(v)) ? null : Math.round(v * 10) / 10; };
var show = function (v) { var n = n1(v); return n == null ? '—' : n; };
var initials = function (s) {
  return String(s || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0] || ''; }).join('').toUpperCase();
};

var S = { model: null, loading: true, error: null,
          view: 'team', team: null, employee: null, month: null,
          closed: {}, detail: null, demo: false, _demo: null,
          kpiFilter: 'all', actionFilter: 'open', session: null, saving: false,
          targetEmp: null, bulk: false,
          _trigger: null, _drawerOpen: false };

/* ============================== API ===================================== */
var Api = {
  live: function () { return !!(window.google && google.script && google.script.run); },
  fetch: function (month, done, fail) {
    if (!Api.live()) return fail({ message: 'Open this page through the deployed Apps Script URL to load live data.' });
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).apiMasterModel(null, month || null);
  },
  ping: function (done, fail) {
    if (!Api.live()) return fail({ message: 'Not running inside the deployed web app.' });
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).apiPing();
  }
};

/* ============================== DEMO ====================================
   Sample targets/actuals for visual preview only, confined here. It re-derives
   using the same rules the backend applies, so the shape on screen matches. */
var Demo = {
  seed: function (s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0x7fffffff; return h; },
  apply: function (model, period) {
    var c = JSON.parse(JSON.stringify(model));
    /* The period is part of the seed. Without it every month derives identical
       values, the month selector looks broken, and a performance history is a
       flat line saying nothing. */
    var p = period || S.month || c.month || '';
    c.month = p || c.month;
    c.scorecards.forEach(function (sc) {
      sc.kpis.forEach(function (k) {
        var seed = Demo.seed(p + sc.employee_id + k.kra + k.kpi), lower = k.direction === 'LOWER_IS_BETTER';
        var target = lower ? 5 : k.unit === 'CR' ? 1 + (seed % 900) / 100
                   : k.unit === 'PERCENT' ? 90 + (seed % 10) : 2 + (seed % 12);
        var ratio = 0.62 + ((seed >> 3) % 55) / 100;
        k.target = Math.round(target * 100) / 100;
        k.actual = lower ? Math.max(1, Math.round(target / ratio)) : Math.round(target * ratio * 100) / 100;
        k.variance = Math.round((k.actual - k.target) * 10) / 10;
        var ach = lower ? k.target / k.actual * 100 : k.actual / k.target * 100;
        k.achievement = Math.round(Math.min(ach, 105) * 10) / 10;
        k.weighted_score = Math.round(k.weightage * (k.achievement / 100) * 1000) / 1000;
        k.level = k.achievement >= 100 ? 5 : k.achievement >= 90 ? 4 : k.achievement >= 75 ? 3 : k.achievement >= 60 ? 2 : 1;
        // Same status contract as the backend: Exceeded / On Track / At Risk / Off Track.
        k.status = k.achievement >= 100 ? 'Exceeded' : k.achievement >= 90 ? 'On Track' : k.achievement >= 75 ? 'At Risk' : 'Off Track';
      });
      var e = 0, m = 0;
      sc.kpis.forEach(function (k) { e += k.weighted_score; m += k.weightage; });
      sc.measured_weightage = m; sc.overall_score = m ? Math.round(e * 10) / 10 : null;
      var ma = m ? Math.round(e / m * 1000) / 10 : null;
      sc.kpi_achievement = ma;
      sc.status = ma == null ? 'Pending Data' : ma >= 100 ? 'Exceeded' : ma >= 90 ? 'On Track' : ma >= 75 ? 'At Risk' : 'Off Track';
    });
    c.months = (c.months && c.months.length) ? c.months : ['2026-08'];
    c.month = c.month || c.months[c.months.length - 1];
    return c;
  }
};

/* ============================== SELECTORS =============================== */
var Sel = {
  model: function () { return S.demo && S.model ? (S._demo || (S._demo = Demo.apply(S.model))) : S.model; },
  teams: function () { var m = Sel.model(); return (m && m.teams) || []; },
  team: function () { return Sel.teams().filter(function (t) { return t.team_id === S.team; })[0] || null; },
  months: function () { var m = Sel.model(); return (m && m.months) || []; },
  members: function () {
    var m = Sel.model();
    return ((m && m.scorecards) || []).filter(function (s) { return s.team_id === S.team; });
  },
  member: function (id) { return Sel.members().filter(function (m) { return m.employee_id === id; })[0] || null; },
  allKpis: function () {
    var out = [];
    Sel.members().forEach(function (m) {
      m.kpis.forEach(function (k) { k.__owner = m.employee_id; k.__ownerName = m.employee_name; out.push(k); });
    });
    return out;
  },
  /* KRA rollup: restates KPIs' backend weighted scores over their combined
     weightage. Presentation only; it originates nothing. */
  byKra: function (kpis) {
    var by = {}, order = [];
    kpis.forEach(function (k) {
      if (!by[k.kra]) { by[k.kra] = { kra: k.kra, perspective: k.perspective, kpis: [], earned: 0, measured: 0 }; order.push(k.kra); }
      var g = by[k.kra]; g.kpis.push(k);
      if (k.weighted_score != null) { g.earned += k.weighted_score; g.measured += Number(k.weightage) || 0; }
    });
    return order.map(function (n) {
      var g = by[n]; g.achievement = g.measured > 0 ? Math.round(g.earned / g.measured * 1000) / 10 : null; return g;
    });
  },
  mean: function (vals) {
    var v = vals.filter(function (x) { return x != null; });
    if (!v.length) return null;
    var s = 0; v.forEach(function (x) { s += x; });
    return Math.round(s / v.length * 10) / 10;
  },
  ranked: function () {
    return Sel.members().slice().sort(function (a, b) {
      return (b.overall_score == null ? -1 : b.overall_score) - (a.overall_score == null ? -1 : a.overall_score);
    });
  },
  rankOf: function (id) {
    var me = Sel.member(id);
    if (!me || me.overall_score == null) return null;   // no score, no rank — never a fabricated position
    var measured = Sel.ranked().filter(function (x) { return x.overall_score != null; });
    return 1 + measured.filter(function (x) { return x.overall_score > me.overall_score; }).length;  // competition ranking; ties share a rank
  },
  /* The person the greeting names and "My profile" opens: the org root of the
     team (empty reporting manager), else the named team lead / category head. */
  lead: function () {
    var team = Sel.team(), ms = Sel.members();
    if (!ms.length) return null;
    var root = ms.filter(function (m) { return !m.reporting_manager; })[0];
    if (root) return root;
    var name = team && (team.team_lead || team.category_head);
    var byName = name && ms.filter(function (m) { return m.employee_name === name; })[0];
    return byName || Sel.ranked()[0];
  }
};

/* ============================== HISTORY ================================
   The added panels all ask one question the rest of the app does not: the same
   person, or the same KPI, across several months rather than one. That is
   answered once here and cached, so a profile does not re-derive six models per
   panel.

   Against a live model only the loaded period can be reported on, because the
   backend answers one period at a time; the trends then render their empty
   state rather than inventing a line. On sample data every period is
   re-derived with the period in the seed, which is what makes a trend exist at
   all before a sheet is connected. */
var Hist = {
  _c: {},
  clear: function () { Hist._c = {}; },
  modelFor: function (month) {
    if (Object.prototype.hasOwnProperty.call(Hist._c, month)) return Hist._c[month];
    var base = S.model, out = null;
    if (!base) return null;
    if (S.demo) out = Demo.apply(base, month);
    else if (base.month === month) out = base;
    Hist._c[month] = out;
    return out;
  },
  card: function (month, empId) {
    var m = Hist.modelFor(month);
    if (!m) return null;
    return (m.scorecards || []).filter(function (s) { return s.employee_id === empId; })[0] || null;
  },
  /* [{month, v}] for a person's overall score. Gaps are dropped rather than
     drawn as zero, which would read as a collapse instead of a blank. */
  employee: function (empId) {
    return Sel.months().map(function (mo) {
      var c = Hist.card(mo, empId);
      return { month: mo, v: c ? c.overall_score : null };
    }).filter(function (p) { return p.v != null; });
  },
  /* Achievement rather than the raw amount: the target itself moves month to
     month, so a line of raw values would be measured against a shifting bar. */
  kpi: function (empId, name) {
    return Sel.months().map(function (mo) {
      var c = Hist.card(mo, empId);
      var k = c && (c.kpis || []).filter(function (x) { return x.kpi === name; })[0];
      return { month: mo, v: k ? k.achievement : null };
    }).filter(function (p) { return p.v != null; });
  }
};

/* ============================== CHARTS =================================
   One small chart toolkit for the whole app, so a shape reads the same on every
   screen. Three primitives — BarTrend, Donut, VBars — cover the trend, the
   distribution and the comparison. All are static markup, so they survive the
   app's full-innerHTML re-renders with no per-chart listeners; every bar or
   column is a real button that drills where it points. */

var _btId = 0;
/* points:[{month,v}]. opts:{suffix,max,headline,pick,label,empty}.
   A column per period — the sharp, unambiguous read for a short monthly series:
   solid comparable bars, each labelled with its exact value, the latest one
   emphasised and tinted by the trend's direction (green up, red down). Past
   months sit back in a paler tint so the eye lands on "now". Fully static
   markup, so it survives the app's innerHTML re-renders with no listeners; each
   column is a button that opens its month. */
function BarTrend(points, opts) {
  opts = opts || {};
  if (!points || !points.length) {
    return '<div class="tr-empty">' + esc(opts.empty ||
      'A trend appears once this has been measured in more than one period.') + '</div>';
  }
  var n = points.length;
  var vals = points.map(function (p) { return p.v; });
  var max = opts.max || Math.max(10, Math.ceil(Math.max.apply(null, vals) / 10) * 10);
  var dir = n < 2 ? 'flat' : points[n - 1].v > points[0].v ? 'up' : points[n - 1].v < points[0].v ? 'down' : 'flat';

  var head = '';
  if (opts.headline !== false) {
    head = '<div class="bt-head"><div class="bt-val">' + show(points[n - 1].v) +
      (opts.suffix ? '<em>' + opts.suffix + '</em>' : '') + '</div>' + Delta(points, opts.suffix) + '</div>';
  }
  var cols = points.map(function (p, i) {
    // Bars top out at 84% of the track so a value label always clears the bar.
    var h = p.v == null ? 0 : Math.max(3, p.v / max * 84), now = i === n - 1;
    var pick = opts.pick !== false, tag = pick ? 'button' : 'div';
    return '<' + tag + (pick ? ' type="button" data-month="' + esc(p.month) + '"' : '') +
      ' class="bt-col' + (now ? ' is-now' : '') + '"' +
      ' aria-label="' + esc(monthLabel(p.month) + ': ' + show(p.v) + (opts.suffix || '')) + '">' +
      '<span class="bt-track"><span class="bt-cv">' + show(p.v) + (opts.suffix || '') + '</span>' +
        '<span class="bt-bar" style="height:' + h.toFixed(1) + '%"></span></span>' +
      '<span class="bt-cl">' + esc(monthShort(p.month)) + '</span></' + tag + '>';
  }).join('');
  return '<div class="bt ' + dir + '">' + head +
    '<div class="bt-plot">' + cols + '</div>' +
    '<p class="vh">' + esc(opts.label || 'Trend') + ': ' + points.map(function (p) {
      return monthShort(p.month) + ' ' + show(p.v) + (opts.suffix || ''); }).join(', ') + '</p>' +
    '</div>';
}

/* Donut for a distribution: one ring of segment arcs, the total in the middle,
   and a legend whose rows are real buttons — click one to jump to that slice of
   the KPI list. Each arc grows on hover and carries its own native tooltip. */
function Donut(segments, opts) {
  opts = opts || {};
  segments = segments.filter(function (s) { return s.value > 0; });
  var total = segments.reduce(function (a, s) { return a + s.value; }, 0);
  if (!total) return '<div class="tr-empty">' + esc(opts.empty || 'Nothing measured for this period yet.') + '</div>';
  var R = 56, C = 2 * Math.PI * R, gap = segments.length > 1 ? 5 : 0, off = 0, arcs = '', legend = '';
  segments.forEach(function (s, i) {
    var frac = s.value / total, len = Math.max(0.5, frac * C - gap);
    arcs += '<circle class="dn-seg t-' + s.tone + '" r="' + R + '" cx="90" cy="90"' +
      ' stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '"' +
      ' stroke-dashoffset="' + (-off).toFixed(2) + '"><title>' + esc(s.label + ': ' + s.value + ' (' + Math.round(frac * 100) + '%)') + '</title></circle>';
    off += frac * C;
    var tag = s.nav ? 'button' : 'div';
    legend += '<' + tag + (s.nav ? ' type="button" data-statusnav="' + esc(s.nav) + '"' : '') + ' class="dn-lg">' +
      '<i class="dn-sw t-' + s.tone + '"></i><span class="dn-ll">' + esc(s.label) + '</span>' +
      '<span class="dn-lv">' + s.value + '<em>' + Math.round(frac * 100) + '%</em></span></' + tag + '>';
  });
  return '<div class="dn"><div class="dn-ring">' +
    '<svg viewBox="0 0 180 180"><circle class="dn-track" r="' + R + '" cx="90" cy="90"/>' + arcs + '</svg>' +
    '<div class="dn-c"><b>' + (opts.center != null ? opts.center : total) + '</b><span>' + esc(opts.centerLabel || 'measured') + '</span></div>' +
    '</div><div class="dn-legend">' + legend + '</div></div>';
}

/* Vertical bars for a small comparison — value on top, category below, rounded
   caps, one hover state. The clean bar-graph read; each column can open its team. */
function VBars(items, opts) {
  opts = opts || {};
  var vals = items.map(function (it) { return it.value == null ? 0 : it.value; });
  var max = Math.max.apply(null, vals.concat([opts.max || 0])) || 100;
  max = Math.max(10, Math.ceil(max / 10) * 10);
  return '<div class="vb">' + items.map(function (it) {
    var h = it.value == null ? 0 : Math.max(3, it.value / max * 100), tag = it.nav ? 'button' : 'div';
    return '<' + tag + (it.nav ? ' type="button" data-team="' + esc(it.nav) + '"' : '') + ' class="vb-col"' +
      ' title="' + esc(it.label + ': ' + (it.value == null ? 'no score' : show(it.value))) + '">' +
      '<span class="vb-v">' + (it.value == null ? '—' : show(it.value)) + '</span>' +
      '<span class="vb-track"><i class="t-' + (it.tone || 'accent') + '" style="height:' + h + '%"></i></span>' +
      '<span class="vb-l">' + esc(it.label) + '</span></' + tag + '>';
  }).join('') + '</div>';
}
function monthShort(p) {
  var d = String(p).split('-');
  return ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
          'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][Number(d[1])] || p;
}
/* The change against the period before, as a direction and a size. */
function Delta(points, suffix) {
  if (!points || points.length < 2) return '';
  var a = points[points.length - 2], b = points[points.length - 1];
  var d = Math.round((b.v - a.v) * 10) / 10;
  if (!d) return '<span class="delta flat">No change vs ' + esc(monthShort(a.month)) + '</span>';
  return '<span class="delta ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '↑' : '↓') + ' ' +
    Math.abs(d).toFixed(1) + (suffix || '') + ' vs ' + esc(monthShort(a.month)) + '</span>';
}

/* ============================== PROFILE PANELS =========================
   None of these is a screen. They sit inside the profile that already existed,
   so the default view stays as simple as it was and the depth appears only
   where the question is asked. */

/* Performance history: the score by period and nothing else. The per-KPI
   version of this question is answered one level down, inside the KPI. */
function HistoryPanel(m) {
  var pts = Hist.employee(m.employee_id);
  return '<div class="block"><div class="sect">Performance history' +
    '<span class="r">overall score by month</span></div>' +
    '<div class="pcard">' +
      BarTrend(pts, { label: 'Overall score', max: 100 }) +
      (pts.length > 1 ? '<p class="tr-note">Hover the line for any month · click to open it.</p>' : '') +
    '</div></div>';
}

/* Performance by KPI — the profile's main chart, and what replaced the prose
   "incomplete" panel. One interactive bar per KPI, grouped by KRA, on the shared
   0-105 achievement scale with the target tick at 100%. Every row is a real
   button: hover for the figures, click through to the KPI's own detail and its
   month-by-month trend. A KPI still awaiting its actual is drawn as a hollow
   pending track rather than named in a list, so one chart carries both the
   performance and what is still missing from it. */
function PerfChart(m) {
  var groups = Sel.byKra(m.kpis || []);
  if (!groups.length) return '';
  var total = (m.kpis || []).length;
  var measured = (m.kpis || []).filter(function (k) { return k.achievement != null; }).length;
  var chart = groups.map(function (g) {
    var rows = g.kpis.map(function (k) {
      var pending = k.achievement == null;
      var w = pending ? 0 : Math.max(2, Math.min(100, k.achievement / 105 * 100));
      var tip = pending
        ? k.kpi + ' — awaiting this period’s actual'
        : k.kpi + ' — ' + show(k.achievement) + '% · target ' + fmt(k.target, k.unit) +
          ' · actual ' + fmt(k.actual, k.unit) + ' · score ' + show(k.weighted_score) + ' of ' + show(k.weightage);
      return '<button type="button" class="pf-r" data-kpi="' + esc((k.__owner || '') + '::' + k.kpi_id) +
        '" title="' + esc(tip) + '" aria-label="' + esc(tip) + '">' +
        '<span class="pf-n">' + esc(k.kpi) + '<em>' + show(k.weightage) + '%</em></span>' +
        '<span class="pf-t' + (pending ? ' pending' : '') + '">' + (pending ? '' : TARGET_TICK) +
          '<i class="' + tone(k.achievement) + '" style="width:' + w + '%"></i></span>' +
        '<span class="pf-v' + (pending ? ' pending' : '') + '">' + (pending ? 'Pending' : show(k.achievement) + '%') + '</span>' +
      '</button>';
    }).join('');
    return '<div class="pf-g"><div class="pf-gh"><span class="pf-gn">' + esc(g.kra) + '</span>' +
      (g.perspective ? '<span class="pf-gp">' + esc(g.perspective) + '</span>' : '') +
      '<span class="pf-ga">' + (g.achievement == null ? 'Pending Data' : show(g.achievement) + '%') + '</span></div>' +
      rows + '</div>';
  }).join('');
  return '<div class="block"><div class="sect">Performance by KPI' +
    '<span class="r">' + measured + ' of ' + total + ' measured · click a bar for detail</span></div>' +
    '<div class="pcard">' +
      (measured === 0 ? '<p class="tr-note" style="margin:0 0 var(--s4)">No actuals entered for this period yet — each KPI below is awaiting its number, and the bars fill in as data arrives.</p>' : '') +
      '<div class="pf">' + chart + '</div></div></div>';
}

/* ============================== DRAWER BODIES ==========================
   The drawer answers four kinds of question now. They are all the same gesture
   - ask for more about the thing in front of you - so they share one surface
   rather than each getting its own. */

/* The overall score, explained. The chain is overall -> KRA -> KPI
   contribution, every line a share of 100, so the parts visibly sum to the
   whole. Raw achievement is deliberately not the headline: 105% on a 5% KPI
   moves the total less than 70% on a 40% one, and only the weighted figure
   shows that. */
function ScoreBody(m) {
  var kpis = (m.kpis || []).filter(function (k) { return k.weighted_score != null; });
  var groups = Sel.byKra(kpis);
  var earned = 0, weight = 0;
  groups.forEach(function (g) { earned += g.earned; weight += g.measured; });

  var body = groups.map(function (g) {
    return '<div class="bd-g"><div class="bd-h"><span class="bd-n">' + esc(g.kra) + '</span>' +
      '<span class="bd-v">' + show(g.earned) + '<em> / ' + show(g.measured) + '</em></span></div>' +
      '<div class="bd-b"><i style="width:' +
        (g.measured ? Math.min(100, g.earned / g.measured * 100).toFixed(1) : 0) + '%"></i></div>' +
      g.kpis.map(function (k) {
        var share = k.weightage ? (k.weighted_score / k.weightage * 100) : 0;
        return '<div class="bd-k"><span class="bd-kn">' + esc(k.kpi) + '</span>' +
          '<span class="bd-kb"><i style="width:' + Math.max(0, Math.min(100, share)).toFixed(1) + '%"></i></span>' +
          '<span class="bd-kv">' + show(k.weighted_score) + '<em> / ' + show(k.weightage) + '</em></span></div>';
      }).join('') + '</div>';
  }).join('');

  return '<div class="d-h"><div><div class="eyebrow">' + esc(m.employee_name) + '</div>' +
    '<h2>Score breakdown</h2></div>' +
    '<button class="x" data-close="1" aria-label="Close">×</button></div>' +
    '<div class="d-b"><div class="bd-top"><div class="k">Overall score</div>' +
    '<div class="v">' + show(m.overall_score) + '<em> / 100</em></div></div>' +
    (groups.length ? body : '<div class="empty">No scored KPIs for this period.</div>') +
    '<div class="bd-t"><span>Total</span><span>' + show(earned) + '<em> / ' + show(weight) + '</em></span></div>' +
    (weight && Math.abs(weight - 100) > 0.5
      ? '<p class="tr-note">Measured weightage is ' + show(weight) + ' of 100. KPIs without ' +
        'actuals are excluded, so the total is out of what could be measured.</p>' : '') +
    '</div>';
}

/* A KPI's own history, inside the KPI it belongs to. */
function KpiTrendBlock(k, owner) {
  var pts = owner ? Hist.kpi(owner.employee_id, k.kpi) : [];
  return '<div class="d-rule"></div><div class="d-sect">Achievement by month</div>' +
    BarTrend(pts, { label: 'Achievement', suffix: '%', max: 110, pick: false, headline: false });
}

/* Reference material, on demand. It is the same every month, so leaving it on
   the KPI itself would crowd out the figures that are not. */
function DefBody(k) {
  return '<div class="d-h"><div><div class="eyebrow">KPI definition</div><h2>' + esc(k.kpi) + '</h2></div>' +
    '<button class="x alt" data-dback="1" aria-label="Back to KPI detail">‹</button>' +
    '<button class="x" data-close="1" aria-label="Close">×</button></div>' +
    '<div class="d-b">' +
      pair('KRA', esc(k.kra || '—')) +
      pair('Perspective', esc(k.perspective || '—')) +
      pair('Measurement', k.unit ? measureLabel(k.unit) : '—') +
      pair('Direction', k.direction === 'LOWER_IS_BETTER' ? 'Lower is better' : 'Higher is better') +
      pair('Weightage', show(k.weightage) + '% of the scorecard') +
      pair('Frequency', 'Monthly') +
      pair('Source of tracking', esc(k.source || 'Monthly MIS')) +
      (k.goal ? '<div class="d-rule"></div><div class="d-goal pair"><div class="k">Goal / description</div>' +
        '<p>' + esc(k.goal) + '</p></div>' : '') +
      '<p class="tr-note">Definitions come from the KPI master and are the same every ' +
      'month. Only the target and actual change.</p></div>';
}

/* Metadata, so it is a note behind an indicator rather than anything with a
   place in the navigation. It reports only what the model actually carries. */
function FreshBody() {
  var m = Sel.model() || {};
  return '<div class="d-h"><div><div class="eyebrow">Where these numbers came from</div>' +
    '<h2>Data freshness</h2></div>' +
    '<button class="x" data-close="1" aria-label="Close">×</button></div>' +
    '<div class="d-b">' +
      (!S.demo && m.generated_at ? pair('Last updated', esc(stamp(m.generated_at))) : '') +
      pair('Source', esc(S.demo ? 'Sample values' : (m.source || 'Google Sheet'))) +
      (!S.demo && m.records != null ? pair('Records', String(m.records)) : '') +
      pair('Period', esc(S.month ? monthLabel(S.month) : '—')) +
      pair('Periods available', String(Sel.months().length)) +
      pair('Status', S.demo ? '<span class="st warn">Sample values — not live</span>'
                            : '<span class="st good">Up to date</span>') +
      (S.demo ? '<p class="tr-note">No sheet is connected, so every target and actual on ' +
        'screen is generated for demonstration. Teams, employees, KRAs and weightages are ' +
        'real.</p>' : '') + '</div>';
}
function stamp(v) {
  var d = new Date(v);
  if (isNaN(d)) return String(v);
  var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  var h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return d.getDate() + ' ' + mo + ' ' + d.getFullYear() + ' · ' + h + ':' +
    ('0' + d.getMinutes()).slice(-2) + ' ' + ap;
}
/* The indicator itself: a dot, a relative time, and a way in. */
function FreshChip() {
  var m = Sel.model() || {};
  var label;
  if (S.demo) label = 'Sample data';
  else if (m.generated_at) {
    var mins = Math.max(0, Math.round((Date.now() - new Date(m.generated_at)) / 60000));
    label = mins < 1 ? 'Updated just now'
      : mins < 60 ? 'Updated ' + mins + ' min ago'
      : mins < 1440 ? 'Updated ' + Math.round(mins / 60) + ' h ago'
      : 'Updated ' + Math.round(mins / 1440) + ' d ago';
  } else label = 'Data status';
  return '<button class="fresh" data-fresh="1" aria-label="' + esc(label) +
    '. Show where this data came from"><i class="cdot ' + (S.demo ? 'warn' : 'good') + '"></i>' +
    esc(label) + '</button>';
}
/* ============================== FORMAT ================================== */
function fmt(v, unit) {
  var n = n1(v); if (n == null) return '—';
  return unit === 'CR' ? '₹' + n + ' Cr'
       : unit === 'MT' ? n + ' MT'
       : unit === 'DAYS' ? n + (Math.abs(n) === 1 ? ' day' : ' days')
       : unit === 'PERCENT' ? n + '%' : String(n);
}
function tone(ach) { return ach == null ? 'none' : ach >= 90 ? 'good' : ach >= 75 ? 'warn' : 'bad'; }
/* Pill tone from the backend's own level (5/4 met, 3 near, 2/1 short). The
   status TEXT always comes verbatim from k.status — the frontend never
   re-classifies performance, it only colours what the backend decided. */
function levelTone(level) { return level == null ? 'none' : level >= 4 ? 'good' : level === 3 ? 'warn' : 'bad'; }
function monthLabel(m) {
  var M = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var x = /^(\d{4})-(\d{2})$/.exec(m || '');
  return x ? (M[+x[2]] || x[2]) + ' ' + x[1] : (m || '');
}
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

/* ============================== PIECES ================================= */
function Avatar(name, cls) { return '<div class="avatar ' + (cls || '') + '">' + esc(initials(name)) + '</div>'; }

/* Achievement % over a fine bar on the KPI's own 105% ladder, with one tick at
   target (100%) — the same target reference the KRA rollup and drawer draw, so
   "at target" reads at an identical position everywhere. The bar annotates the
   figure; it is not a second reading. */
var TARGET_TICK = '<u style="left:' + (100 / 105 * 100) + '%"></u>';
function achBar(ach) {
  if (ach == null) return '';
  var w = Math.max(0, Math.min(100, ach / 105 * 100)), c = tone(ach);
  return '<span class="bar">' + TARGET_TICK + '<i class="' + c + '" style="width:' + w + '%"></i></span>';
}
function Ach(k) {
  if (k.achievement == null) return '<span class="quiet">—</span>';
  return '<span class="ach"><span class="n">' + show(k.achievement) + '%</span>' +
    achBar(k.achievement) + '</span>';
}
function KraBars(groups) {
  if (!groups.length) return '<div class="empty">No KRAs tagged.</div>';
  return '<div class="kbars">' + groups.map(function (g) {
    var ach = g.achievement, c = tone(ach), w = ach == null ? 0 : Math.max(0, Math.min(100, ach / 105 * 100));
    return '<div class="kbar"><div class="kn">' + esc(g.kra) +
      '<small>' + plural(g.kpis.length, 'KPI') + '</small></div>' +
      '<div class="tr">' + TARGET_TICK + '<i class="' + c + '" style="width:' + w + '%"></i></div>' +
      '<div class="kv">' + (ach == null ? '—' : show(ach) + '%') + '</div></div>';
  }).join('') + '</div>';
}
/* Ranking is derived only from real measured scores. Unmeasured members get no
   position, no ★ and no bar — array order is never dressed up as a rank. When
   nobody in the set is measured there is simply no order to show. */
function RankList(members, clickable) {
  var rk = members.slice().sort(function (a, b) {
    return (b.overall_score == null ? -1 : b.overall_score) - (a.overall_score == null ? -1 : a.overall_score);
  });
  var measured = rk.filter(function (x) { return x.overall_score != null; });
  var maxScore = measured.length ? measured[0].overall_score : null;
  var max = maxScore || 100;
  return '<div class="rank">' + rk.map(function (m) {
    var meas = m.overall_score != null;
    /* Competition ranking: position is 1 + how many people beat you, so tied
       scores share a rank and every co-leader is starred — array order is never
       dressed up as 1st-vs-2nd over identical performance. */
    var rank = meas ? 1 + measured.filter(function (x) { return x.overall_score > m.overall_score; }).length : null;
    var top = meas && m.overall_score === maxScore;
    var w = meas ? Math.max(4, m.overall_score / max * 100) : 0;
    return '<div class="rrow' + (top ? ' top' : '') + (clickable ? ' click' : '') + '"' +
      (clickable ? ' data-emp="' + esc(m.employee_id) + '" tabindex="0" role="button"' : '') + '>' +
      '<span class="pos">' + (top ? '<span aria-hidden="true">★</span><span class="vh">Rank 1</span>' : (rank == null ? '—' : rank)) + '</span>' +
      '<div class="nm"><b>' + esc(m.employee_name) + '</b><span>' + esc(m.designation || '—') + '</span></div>' +
      '<div class="mt">' + (meas ? '<div class="microbar"><i style="width:' + w + '%"></i></div>' : '') + '</div>' +
      '<div class="sc">' + show(m.overall_score) + '</div>' +
      (clickable ? '<span class="chev" aria-hidden="true">›</span>' : '') + '</div>';
  }).join('') + '</div>';
}

/* One table, six columns: KPI · Weight · Target · Actual · Achievement · Score.
   Perspective rides on the KRA band, not in a column (spec §14). The team-wide
   view names the owner under the KPI rather than adding a column, so the numeric
   columns line up the same way on every screen. */
function KpiTable(kpis, prefix, showOwner) {
  var groups = Sel.byKra(kpis);
  var body = groups.length ? groups.map(function (g) {
    var id = prefix + '|' + g.kra, open = !S.closed[id];
    var head = '<tr class="kra" data-kra="' + esc(id) + '"><td colspan="6">' +
      '<button type="button" class="kra-btn" aria-expanded="' + (open ? 'true' : 'false') + '">' +
      '<span class="cv" aria-hidden="true">' + (open ? '▾' : '▸') + '</span>' + esc(g.kra) +
      '<span class="rs">' + (g.perspective ? esc(g.perspective) + ' · ' : '') + plural(g.kpis.length, 'KPI') +

    if (!open) return head;

/* The team screen and the landing one. Per the UI/UX spec the flowchart is the
   canonical navigation surface, carried by a compact summary strip above it,
   with the KRA breakdown and ranking as secondary analytics below. */
function exceptionsOf(m) { return (m.kpis || []).filter(function (k) { return k.achievement != null && k.achievement < 90; }); }

function FlowchartScreen() {
  var t = Sel.team(), members = Sel.members();
  if (!members.length) return PageHead(t ? t.team_name : 'Team', '') + '<div class="empty">No members mapped for this team.</div>';
  var lead = Sel.lead();
  var reports = members.filter(function (m) { return !lead || m.employee_id !== lead.employee_id; });
  var allK = Sel.allKpis(), scored = allK.filter(function (k) { return k.achievement != null; });

  // Compact summary strip (spec §03): team score, KPI achievement, on-track, needs-attention.
  var teamScore = Sel.mean(members.map(function (m) { return m.overall_score; }));
  var kpiAch = (function () { var e = 0, w = 0; scored.forEach(function (k) { e += k.weighted_score; w += k.weightage; }); return w > 0 ? Math.round(e / w * 1000) / 10 : null; })();
  var onTrack = scored.filter(function (k) { return k.achievement >= 90; }).length;
  var attention = scored.length - onTrack;
  var tTrend = teamTrend(t.team_id);
  var tOverdue = members.reduce(function (a, m) { return a + actionsFor(m.employee_id).filter(isOverdue).length; }, 0);
  var strip = '<div class="mini">' +
    MiniStat('Team score', teamScore == null ? '—' : show(teamScore) + '<em>/100</em>', deltaText(tTrend) || 'mean overall') +
    MiniStat('KPI achievement', kpiAch == null ? '—' : show(kpiAch) + '<em>%</em>', onTrack + ' of ' + scored.length + ' KPIs on track') +
    MiniStat('Needs attention', String(attention), attention ? '<span class="down">' + plural(attention, 'KPI') + ' below target</span>' : '<span class="up">all on track</span>') +
    MiniStat('Open / overdue', String(tOverdue), tOverdue ? '<span class="down">actions overdue</span>' : 'no overdue actions') +
    '</div>';

  var node = function (m, isLead, idx) {
    var ex = exceptionsOf(m).length;
    var overdue = actionsFor(m.employee_id).filter(isOverdue).length;   // action issue count (brief §9)
    var flags = (ex ? '<span class="nfl warn">' + ex + ' KPI' + (ex === 1 ? '' : 's') + ' at risk</span>' : '') +
      (overdue ? '<span class="nfl bad">' + overdue + ' overdue</span>' : '');
    return '<div class="node' + (isLead ? ' lead' : '') + '" data-emp="' + esc(m.employee_id) + '"' +
      ' tabindex="0" role="button"' +
      ' style="animation-delay:' + (isLead ? 0 : Math.min(idx * 45, 400)) + 'ms">' +
      Avatar(m.employee_name, isLead ? 'lg' : 'xl') +
      '<div class="nn">' + esc(m.employee_name) + '</div>' +
      '<div class="nd">' + esc(m.designation || '—') + '</div>' +
      '<div class="ns">' + show(m.overall_score) + '<em>/100</em></div>' +
      '<span class="st ' + tone(m.kpi_achievement) + ' nst">' + esc(m.status || 'Pending Data') + '</span>' +
      (flags ? '<div class="nfls">' + flags + '</div>' : '') +
      (isLead ? '<div class="tag">Team lead</div>' : '') + '</div>';
  };

  var chart = '<div class="flow">' +
    (lead ? node(lead, true, 0) + '<div class="flow-stem"></div><div class="flow-bus"></div>' : '') +
    '<div class="flow-kids">' + reports.map(function (m, i) { return node(m, false, i); }).join('') + '</div></div>';

  var trend = '<div class="block"><div class="sect">Team score trend<span class="r">mean overall score by month</span></div>' +
    '<div class="pcard">' + BarTrend(teamTrend(t.team_id), { label: 'Team score', max: 100, empty: 'A trend appears once this team carries more than one measured period.' }) + '</div></div>';
  var kra = '<div class="block"><div class="sect">KRA performance<span class="r">achievement %</span>' +
    (canConfig() ? '<button class="cfg-edit" data-configteam="' + esc(t.team_id) + '" title="Edit this team’s KRA / KPI template">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>Configure team</button>' : '') +
    '</div><div class="pcard">' + KraBars(Sel.byKra(allK)) + '</div></div>';
  var rank = '<div class="block"><div class="sect">Ranking<span class="r">by overall score</span></div>' +
    '<div class="pcard" style="padding-top:var(--s2);padding-bottom:var(--s2)">' + RankList(members, true) + '</div></div>';

  return PageHead(t.team_name, 'Team performance · ' + esc(monthLabel(S.month))) +
    strip +
    '<div class="block">' + chart + '</div>' +
    '<div class="two">' + trend + kra + '</div>' +
    rank;
}

function EmployeeScreen() {
  var m = Sel.member(S.employee);
  if (!m) return PageHead('Employee not found', '') + '<div class="empty">That employee is not part of the selected team.</div>';
  var t = Sel.team();
  m.kpis.forEach(function (k) { k.__owner = m.employee_id; });
  var kpis = m.kpis;
  var scored = kpis.filter(function (k) { return k.achievement != null; });
  var kpiAch = (function () {
    var e = 0, w = 0; scored.forEach(function (k) { e += k.weighted_score; w += k.weightage; });
    return w > 0 ? Math.round(e / w * 1000) / 10 : null;
  })();
  var rank = Sel.rankOf(m.employee_id), total = Sel.members().filter(function (x) { return x.overall_score != null; }).length;
  /* Context for the story line (brief §60): change vs last period, the gap that
     remains, exceptions and the work under way — so the score never stands alone. */
  var hist = Hist.employee(m.employee_id);
  var atRisk = exceptionsOf(m).length;
  var openA = actionsFor(m.employee_id).filter(isOpenAct).length, overdue = actionsFor(m.employee_id).filter(isOverdue).length;
  var rev = reviewStatus(m.employee_id);

  var back = '<button class="back" data-back="1">‹ ' + esc(t ? t.team_name : 'Team') + '</button>';
  var head = '<div class="phead">' + Avatar(m.employee_name, 'lg') +
    '<div class="id"><h1>' + esc(m.employee_name) + '</h1>' +
    '<div class="meta">' + esc(m.designation || '—') + (t ? '<span class="dot">·</span>' + esc(t.team_name) : '') +
      (m.region ? '<span class="dot">·</span>' + esc(m.region) : '') + '</div></div>' +
    /* The score is the one figure on the page that is derived rather than
       reported, so it is a control: it has to be able to explain itself. It now
       carries its own change vs the previous period rather than standing alone. */
    '<button class="pscore" data-score="1" aria-label="Overall score ' + show(m.overall_score) +
    '. Show how it was calculated"><div class="v">' + show(m.overall_score) + '<em>/100</em></div>' +
    '<div class="l">' + (deltaText(hist) || 'Overall score') + '<span class="bdg">Breakdown</span></div></button></div>';

  var mini = '<div class="mini">' +
    MiniStat('KPI achievement', kpiAch == null ? '—' : show(kpiAch) + '<em>%</em>',
      atRisk ? '<span class="down">' + plural(atRisk, 'KPI') + ' at risk</span>' : (scored.length ? '<span class="up">all measured on track</span>' : 'awaiting data')) +
    MiniStat('Open actions', String(openA),
      overdue ? '<span class="down">' + overdue + ' overdue</span>' : (openA ? 'in progress' : 'none open')) +
    MiniStat('Team rank', rank == null ? '—' : rank + '<em> / ' + total + '</em>',
      rank === 1 ? '<span class="up">team best</span>' : (rank == null ? 'unmeasured' : 'by overall score')) +
    MiniStat('Review', esc(rev), 'cycle ' + esc(monthShort(S.month))) +
    '</div>';

  var table = '<div class="block"><div class="sect">Assigned KRA / KPI' +
    '<span class="r">the exact figures behind the chart</span>' +
    (canConfig(m) ? '<button class="cfg-edit" data-config="' + esc(m.employee_id) + '" title="Configure this individual’s KRA / KPIs">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>Configure</button>' : '') +
    '</div>' + KpiTable(kpis, 'emp|' + m.employee_id, false) + '</div>';

  /* The interactive performance chart leads - what is carrying the score and
     what is dragging on it, with any pending KPIs drawn as hollow bars rather
     than named in prose - then the score's history over the loaded periods, a
     strongest / needs-attention callout, and finally the exact figures. */
  return back + head + mini + PerfChart(m) + HistoryPanel(m) + table;
}
function MiniStat(l, v, sub) { return '<div class="mstat"><div class="l">' + esc(l) + '</div><div class="v">' + v + '</div>' + (sub ? '<div class="ms-sub">' + sub + '</div>' : '') + '</div>'; }
/* Compact change vs the previous period as plain text (not a pill) for the
   metric sub-lines — the "· +4 vs Jul" half of the brief's inline metric. */
function deltaText(points, suffix) {
  if (!points || points.length < 2) return '';
  var a = points[points.length - 2], b = points[points.length - 1], d = Math.round((b.v - a.v) * 10) / 10;
  if (!d) return '<span class="flat">no change vs ' + esc(monthShort(a.month)) + '</span>';
  return '<span class="' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '▲' : '▼') + ' ' + Math.abs(d).toFixed(1) + (suffix || '') + ' vs ' + esc(monthShort(a.month)) + '</span>';
}

/* ============================== KRA / KPI CONFIG ======================
   Individual configuration editor: add / modify / remove the KRA/KPIs assigned
   to one person and set their weightage, target and parameters. While the editor
   is open the FORM is the source of truth — add/remove manipulate the DOM
   directly and never trigger an app re-render, so nothing typed is lost. Save
   collects the rows; the server reconciles them against the dedicated config
   sheet and returns the recomputed model. Every change is versioned there and
   logged with old -> new values, shown back in the Change history panel. */
function canConfig(m) {
  var s = S.session; if (!s) return false;
  /* Respect the "view as" preview role so the editor is hidden when previewing
     an Employee; HR / Management / a manager may configure. The server enforces
     the authoritative rule (and that a manager only edits their own reports). */
  var role = (typeof effRole === 'function') ? effRole() : (s.role || 'Management');
  return role === 'HR' || role === 'Management' || role === 'Manager';
}
var CFG_UNITS = [['PERCENT', '%'], ['CR', '₹ Cr'], ['MT', 'MT'], ['DAYS', 'Days'], ['COUNT', 'Count']];
var CFG_DIRS = [['HIGHER_IS_BETTER', 'Higher is better'], ['LOWER_IS_BETTER', 'Lower is better']];
function cfgOpts(opts, sel) {
  return opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === sel ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('');
}
function cfgField(label, control, cls) {
  return '<label class="cfg-field ' + (cls || '') + '"><span>' + esc(label) + '</span>' + control + '</label>';
}
function cfgRowHtml(it) {
  it = it || {};
  return '<div class="cfg-row" data-kpi-id="' + esc(it.kpi_id || '') + '" data-config-id="' + esc(it.config_id || '') + '">' +
    '<div class="cfg-row-h">' +
      '<input class="cfg-in cfg-f-kpi" placeholder="KPI name" value="' + esc(it.kpi || '') + '" aria-label="KPI name">' +
      '<button type="button" class="cfg-rm" data-cfg-remove aria-label="Remove this KPI" title="Remove KPI">×</button>' +
    '</div>' +
    '<div class="cfg-grid">' +
      cfgField('KRA', '<input class="cfg-in cfg-f-kra" placeholder="KRA" value="' + esc(it.kra || '') + '">') +
      cfgField('Perspective', '<input class="cfg-in cfg-f-persp" placeholder="Perspective" value="' + esc(it.perspective || '') + '">') +
      cfgField('Weightage', '<span class="cfg-suffix"><input class="cfg-in cfg-f-wt" type="number" min="0" max="100" step="0.5" value="' + (it.weightage != null && it.weightage !== '' ? esc(it.weightage) : '') + '"><em>%</em></span>') +
      cfgField('Measurement', '<select class="cfg-in cfg-f-unit">' + cfgOpts(CFG_UNITS, it.unit || 'PERCENT') + '</select>') +
      cfgField('Direction', '<select class="cfg-in cfg-f-dir">' + cfgOpts(CFG_DIRS, it.direction || 'HIGHER_IS_BETTER') + '</select>') +
      cfgField('Target (' + esc(monthShort(S.month)) + ')', '<input class="cfg-in cfg-f-target" type="number" step="any" placeholder="—" value="' + (it.target != null && it.target !== '' ? esc(it.target) : '') + '">') +
      cfgField('Source of tracking', '<input class="cfg-in cfg-f-source" placeholder="e.g. Monthly MIS" value="' + esc(it.source || '') + '">') +
    '</div>' +
    cfgField('Goal / description', '<textarea class="cfg-in cfg-f-goal" rows="2" placeholder="What good looks like for this KPI">' + esc(it.goal || '') + '</textarea>', 'cfg-full') +
    '</div>';
}
function cfgMemberFor(id) {
  return ((Sel.model() && Sel.model().scorecards) || []).filter(function (x) { return x.employee_id === id; })[0] || null;
}
/* The one editor, two subjects: an individual (S.configFor) or a team template
   (S.configTeam). Same rows, same collect, same weightage gate — no duplicate
   screen. A team template seeds from a member who has no personal override, so
   it reflects the team's current KRA/KPIs. */
function teamSeedMember(teamId) {
  var ms = ((Sel.model() && Sel.model().scorecards) || []).filter(function (sc) { return sc.team_id === teamId; });
  var pref = ms.filter(function (m) { return !m.configured || m.team_configured; });
  return pref.filter(function (m) { return !m.reporting_manager; })[0] || pref[0] ||
    ms.filter(function (m) { return !m.reporting_manager; })[0] || ms[0] || null;
}
function cfgShell(title, kind, rows, saveBtn, note, histLabel, backLabel) {
  var head = '<div class="cfg-head"><button class="back" data-cfg-cancel>‹ ' + esc(backLabel) + '</button>' +
    '<div class="cfg-title"><h1>' + esc(title) + '</h1><div class="kind">' + kind + '</div></div></div>';
  var bar = '<div class="cfg-bar"><div class="cfg-total" id="cfg-total"></div>' +
    '<div class="cfg-actions">' +
      '<button type="button" class="btn sm sub" data-cfg-add>+ Add KRA / KPI</button>' +
      '<button type="button" class="btn sm sub" data-cfg-cancel>Cancel</button>' + saveBtn +
    '</div></div>';
  return head + bar + '<p class="cfg-note">' + note + '</p>' +
    '<div class="cfg-rows" id="cfg-rows">' + rows + '</div>' +
    '<button type="button" class="cfg-addbig" data-cfg-add>+ Add another KRA / KPI</button>' +
    '<div class="block" style="margin-top:var(--s7)"><div class="sect">Change history<span class="r">' + esc(histLabel) + '</span></div>' +
      '<div class="pcard" id="cfg-history"><div class="cfg-hist-empty">Loading history…</div></div></div>';
}
function ConfigScreen() {
  if (S.configTeam) {
    var teamId = S.configTeam;
    var t = ((Sel.model() && Sel.model().teams) || []).filter(function (x) { return x.team_id === teamId; })[0];
    if (!t) { S.configTeam = null; return PageHead('Not found', '') + '<div class="empty">That team is not available.</div>'; }
    var members = ((Sel.model() && Sel.model().scorecards) || []).filter(function (sc) { return sc.team_id === teamId; });
    var seed = teamSeedMember(teamId);
    var trows = ((seed && seed.kpis) || []).map(cfgRowHtml).join('');
    var tkind = esc(t.team_name) + ' <span class="dot">·</span> ' + plural(members.length, 'member') + ' <span class="dot">·</span> targets for ' + esc(monthLabel(S.month));

    return cfgShell('Configure team KRA / KPI', tkind, trows, tsave, tnote, 'team template · newest first', 'Back to team');
  }
  var m = cfgMemberFor(S.configFor);
  if (!m) { S.configFor = null; return PageHead('Not found', '') + '<div class="empty">That employee is not available for this period.</div>'; }
  var tm = ((Sel.model() && Sel.model().teams) || []).filter(function (x) { return x.team_id === m.team_id; })[0];
  var rows = (m.kpis || []).map(cfgRowHtml).join('');
  var kind = esc(m.employee_name) + (tm ? ' <span class="dot">·</span> ' + esc(tm.team_name) : '') + ' <span class="dot">·</span> targets for ' + esc(monthLabel(S.month));
  var save = '<button type="button" class="btn sm" id="cfg-save" data-cfg-save="' + esc(m.employee_id) + '">Save configuration</button>';
  var note = 'Weightages must total 100%. Changes are versioned and logged individually — editing one person never changes anyone else’s KRA / KPIs.';
  return cfgShell('Configure KRA / KPI', kind, rows, save, note, 'who changed what · newest first', 'Back to profile');
}
function cfgCollect() {
  var items = [];
  document.querySelectorAll('#cfg-rows .cfg-row').forEach(function (row) {
    var g = function (sel) { var el = row.querySelector(sel); return el ? String(el.value) : ''; };
    var tgt = g('.cfg-f-target');
    items.push({ kpi_id: row.getAttribute('data-kpi-id') || '', config_id: row.getAttribute('data-config-id') || '',
      kpi: g('.cfg-f-kpi').trim(), kra: g('.cfg-f-kra').trim(), perspective: g('.cfg-f-persp').trim(),
      weightage: Number(g('.cfg-f-wt')) || 0, unit: g('.cfg-f-unit'), direction: g('.cfg-f-dir'),
      target: tgt === '' ? null : Number(tgt), source: g('.cfg-f-source').trim(), goal: g('.cfg-f-goal').trim() });
  });
  return items;
}
/* Collect + validate (shared by the individual and team save). Returns the
   kept rows, or null after toasting the reason. */
function cfgCollectValid() {
  var kept = cfgCollect().filter(function (it) { return it.kpi; });
  if (!kept.length) { toast('Add at least one KRA / KPI.', 'bad'); return null; }
  var tot = kept.reduce(function (a, it) { return a + (Number(it.weightage) || 0); }, 0);
  if (Math.round(tot) !== 100) { toast('Weightages must total 100% (now ' + (Math.round(tot * 10) / 10) + '%).', 'bad'); return null; }
  return kept;
}
function cfgRecalcTotal() {
  var el = document.getElementById('cfg-total'); if (!el) return;
  var sum = 0, n = 0;
  document.querySelectorAll('#cfg-rows .cfg-f-wt').forEach(function (i) { sum += Number(i.value) || 0; n++; });
  var ok = Math.round(sum) === 100;
  el.className = 'cfg-total ' + (ok ? 'ok' : 'bad');
  el.innerHTML = 'Total weightage <b>' + (Math.round(sum * 10) / 10) + '%</b><span>' +
    (ok ? 'balanced' : 'must equal 100%') + ' · ' + n + ' KPI' + (n === 1 ? '' : 's') + '</span>';
  var save = document.getElementById('cfg-save'); if (save) save.disabled = !ok || n === 0;
}
function cfgAfterRender() {
  cfgRecalcTotal();
  var subj = S.configTeam ? 'TEAM:' + S.configTeam : S.configFor;
  if (S._cfgHistFor !== subj) { S._cfgHistFor = subj; cfgLoadHistory(); }

/* ============================== DRAWER ================================= */
/* Modal detail drawer. On open it takes focus and makes the shell inert; on
   close it returns focus to whatever opened it. The Status shown is the
   backend's own k.status, coloured by k.level — never re-classified here. */
/* Holding the page still behind the drawer.
   ---------------------------------------------------------------------------
   The page does not scroll on <body>: .canvas is the scroller, so that is what
   has to be pinned. Three things would otherwise move it.

   Wheeling over the scrim chains through to whatever is scrollable underneath,
   so the background drifts while the drawer is open. Hiding the overflow stops
   that - but it also takes the scrollbar away, and the content widens into the
   space it vacated, which is a visible jolt of the full scrollbar width. So the
   exact width removed is added back as padding, and every line stays put.

   The scroll position is read once, on the first lock, and written back on
   release, so reopening and closing the drawer repeatedly cannot drift. */
var Lock = {
  el: null, target: null, top: 0, pad: '',

  /* Which element actually scrolls has to be asked, not assumed. .canvas owns
     the overflow, but .app is min-height rather than height, so on a long page
     .canvas grows to fit its content and the document scrolls instead. Pinning
     .canvas in that case pins nothing. */
  scroller: function () {
    var c = $('.canvas');
    if (c && c.scrollHeight > c.clientHeight + 1) return c;
    return document.scrollingElement || document.documentElement;
  },

  on: function () {
    if (Lock.el) return;
    var s = Lock.scroller();
    var isDoc = (s === document.scrollingElement || s === document.documentElement || s === document.body);
    var t = isDoc ? document.documentElement : s;
    var bar = isDoc ? (window.innerWidth - document.documentElement.clientWidth)
                    : (s.offsetWidth - s.clientWidth);
    Lock.el = s; Lock.target = t; Lock.top = s.scrollTop;
    Lock.pad = t.style.paddingRight;
    t.style.overflow = 'hidden';
    if (bar > 0) {
      t.style.paddingRight = (parseFloat(getComputedStyle(t).paddingRight || 0) + bar) + 'px';
      /* Losing the scrollbar widens the viewport, and anything positioned
         against its right edge - the drawer - would slide out with it. The
         width is published so the drawer can hold its ground. */
      t.style.setProperty('--sbw', bar + 'px');
    }
  },

  off: function () {
    if (!Lock.el) return;
    Lock.target.style.overflow = '';
    Lock.target.style.paddingRight = Lock.pad;
    Lock.target.style.removeProperty('--sbw');
    Lock.el.scrollTop = Lock.top;
    Lock.el = null; Lock.target = null;
  }
};

/* Moving focus is the third thing that scrolls the page: the browser brings the
   target into view, which yanks the background to wherever the row happens to
   be. preventScroll asks for the focus without the scroll. */
function focusQuiet(el) {
  if (!el) return;
  try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) {} }
}

function renderDrawer() {
  var dr = $('#drawer'), sc = $('#scrim'), app = $('.app');
  if (!S.detail) {
    dr.classList.remove('on'); sc.classList.remove('on');
    dr.setAttribute('aria-hidden', 'true'); dr.setAttribute('inert', '');
    if (S._drawerOpen) {
      app.removeAttribute('inert'); app.removeAttribute('aria-hidden');
      /* Release before focus: the scroller has to be scrollable again for its
         position to be written back, and the focus must not move it after. */
      Lock.off();
      if (S._trigger && document.contains(S._trigger)) focusQuiet(S._trigger);
      S._trigger = null; S._drawerOpen = false;
    }
    return;
  }
  var det = S.detail;
  /* Four kinds of answer share this one surface. They are the same gesture -
     ask for more about the thing in front of you - so a second drawer, or a
     page, would only add somewhere else to look. */
  if (det.kind === 'score') { dr.innerHTML = ScoreBody(det.owner); openDrawer(dr, sc, app); return; }
  if (det.kind === 'fresh') { dr.innerHTML = FreshBody(); openDrawer(dr, sc, app); return; }
  if (det.kind === 'def')   { dr.innerHTML = DefBody(det.kpi); openDrawer(dr, sc, app); return; }
  if (det.kind === 'action'){ dr.innerHTML = ActionBody(det.action); openDrawer(dr, sc, app); return; }
  if (det.kind === 'review'){ dr.innerHTML = ReviewBody(det.emp); openDrawer(dr, sc, app); return; }
  if (det.kind === 'assign'){ dr.innerHTML = AssignBody(det.emp); openDrawer(dr, sc, app); return; }
  if (det.kind === 'autoassign'){ dr.innerHTML = AutoAssignBody(); openDrawer(dr, sc, app); setTimeout(aaPreview, 0); return; }

  var k = det.kpi;
  var achW = k.achievement == null ? 0 : Math.max(0, Math.min(100, k.achievement / 105 * 100));
  // Variance vs target (spec §06, fifth metric), coloured by whether the gap is
  // favourable for the KPI's direction — a lower DSO is a good variance.
  var vv = k.variance;
  var vFav = vv == null ? null : (k.direction === 'LOWER_IS_BETTER' ? vv <= 0 : vv >= 0);
  var vTxt = vv == null ? '—' : (vv > 0 ? '+' : '') + fmt(vv, k.unit);
  var vCls = vv == null ? '' : (vFav ? 'good' : 'bad');
  dr.innerHTML =
    '<div class="d-h"><div><div class="eyebrow">' + esc(k.kra || 'KPI') + '</div>' +
    '<h2>' + esc(k.kpi) + '<button class="info" data-def="1" aria-label="What this KPI means">i</button></h2></div>' +

    '<div class="d-b">' +
      '<div class="d-meas" style="grid-template-columns:1fr 1fr">' +
        '<div><div class="k">Target</div><div class="v">' + (k.target == null ? '—' : fmt(k.target, k.unit)) + '</div></div>' +
        '<div><div class="k">Actual</div><div class="v">' + (k.actual == null ? '—' : fmt(k.actual, k.unit)) + '</div></div>' +
        '<div><div class="k">Achievement</div><div class="v">' + (k.achievement == null ? '—' : show(k.achievement) + '%') + '</div></div>' +
        '<div><div class="k">Variance vs target</div><div class="v"' + (vCls ? ' style="color:var(--' + vCls + ')"' : '') + '>' + vTxt + '</div></div>' +
      '</div>' +
      (k.achievement == null ? '' : '<div class="pair" style="margin-top:calc(var(--s4)*-1)"><div class="d-ach">' + TARGET_TICK + '<i class="' + tone(k.achievement) + '" style="width:' + achW + '%"></i></div></div>') +
      '<div class="d-meas" style="grid-template-columns:1fr 1fr">' +
        '<div><div class="k">Weightage</div><div class="v">' + show(k.weightage) + '%</div></div>' +
        '<div><div class="k">Weighted score</div><div class="v">' + show(k.weighted_score) + '<span style="color:var(--faint);font-weight:var(--fw-m)"> / ' + show(k.weightage) + '</span></div></div>' +
      '</div>' +
      pair('Perspective', esc(k.perspective || '—')) +
      pair('Status', '<span class="st ' + levelTone(k.level) + '">' + esc(k.status || '—') + '</span>') +
      (k.goal || k.source || k.unit ? '<div class="d-rule"></div>' : '') +
      (k.goal ? '<div class="d-goal pair"><div class="k">Goal / description</div><p>' + esc(k.goal) + '</p></div>' : '') +
      (k.unit ? pair('Measurement', measureLabel(k.unit)) : '') +
      (k.source ? pair('Source of tracking', esc(k.source)) : '') +
      KpiTrendBlock(k, det.owner) +
      DrawerWrite(k, det.owner) +
    '</div>';
  openDrawer(dr, sc, app);
}

/* Opening is identical whichever body was built, so it is done in one place:
   the drawer takes focus, the shell behind it goes inert, and the element that
   opened it is remembered so focus can be handed back on close. */
function openDrawer(dr, sc, app) {
  if (!S._drawerOpen) { S._trigger = S._trigger || document.activeElement; S._drawerOpen = true; }
  /* Pin the background first, so nothing that follows can move it. Lock.on is
     idempotent: switching between the KPI, its definition and the breakdown
     re-enters here without re-reading the position. */
  Lock.on();
  dr.classList.add('on'); sc.classList.add('on');
  dr.removeAttribute('aria-hidden'); dr.removeAttribute('inert');
  app.setAttribute('inert', ''); app.setAttribute('aria-hidden', 'true');
  focusQuiet(dr.querySelector('[data-close]'));
}

/* Global search across the whole performance graph (brief §40): people, teams,
   KRA/KPI and actions, each result a jump straight to that object. */
function gsearch(q) {
  var box = document.getElementById('gsearch-res'); if (!box) return;
  q = String(q || '').trim().toLowerCase();
  if (q.length < 2) { box.hidden = true; box.innerHTML = ''; return; }
  var m = Sel.model() || {}, teamName = {}; (m.teams || []).forEach(function (t) { teamName[t.team_id] = t.team_name; });
  var out = '', hits = 0;
  function grp(label) { return '<div class="gs-grp">' + esc(label) + '</div>'; }
  function row(type, ids, main, sub, right, tone) {
    hits++;
    return '<button type="button" class="gs-row" data-goto="' + esc(type + '::' + ids) + '">' +
      '<span class="gs-t">' + esc(type) + '</span><span class="gs-m">' + main + (sub ? '<em>' + sub + '</em>' : '') + '</span>' +
      (right != null ? '<span class="gs-v ' + (tone || '') + '">' + right + '</span>' : '') + '</button>';
  }
  var emps = (m.scorecards || []).filter(function (s) { return String(s.employee_name).toLowerCase().indexOf(q) >= 0; }).slice(0, 6);
  if (emps.length) out += grp('People') + emps.map(function (s) {
    return row('person', s.employee_id, esc(s.employee_name), esc((s.designation || '') + ' · ' + (teamName[s.team_id] || '')), s.overall_score == null ? '—' : show(s.overall_score), tone(s.kpi_achievement));
  }).join('');
  var teams = (m.teams || []).filter(function (t) { return String(t.team_name).toLowerCase().indexOf(q) >= 0; });
  if (teams.length) out += grp('Teams') + teams.map(function (t) {
    var n = (m.scorecards || []).filter(function (s) { return s.team_id === t.team_id; }).length;
    return row('team', t.team_id, esc(t.team_name), plural(n, 'member'), null);
  }).join('');
  var kpis = []; (m.scorecards || []).forEach(function (s) { (s.kpis || []).forEach(function (k) { if ((String(k.kpi) + ' ' + String(k.kra)).toLowerCase().indexOf(q) >= 0) kpis.push({ s: s, k: k }); }); });
  if (kpis.length) out += grp('KRA / KPI') + kpis.slice(0, 8).map(function (x) {
    return row('kpi', x.s.employee_id + '|' + x.k.kpi_id, esc(x.k.kpi), esc(x.k.kra + ' · ' + x.s.employee_name), x.k.achievement == null ? 'Pending' : show(x.k.achievement) + '%', tone(x.k.achievement));
  }).join('');
  var acts = (m.actions || []).filter(function (a) { return String(a.title).toLowerCase().indexOf(q) >= 0; }).slice(0, 5);
  if (acts.length) out += grp('Actions') + acts.map(function (a) {
    return row('action', a.action_id, esc(a.title), esc(ownerName(a.employee_id)), esc(a.status));
  }).join('');
  box.innerHTML = hits ? out : '<div class="gs-empty">No matches for “' + esc(q) + '”.</div>';
  box.hidden = false;
}

/* ============================== RENDER ================================= */
function render() {
  if (S.loading) { $('#banner').innerHTML = ''; $('#view').innerHTML = Skeleton(); return; }
  if (S.error) {
    $('#banner').innerHTML = '';

      '</p><button class="btn" data-retry="1">Try again</button></div></div>';

  }
  buildRail(); buildTopbar();
  var mm = Sel.model();
  var noPerf = !((mm && mm.scorecards) || []).some(function (s) {
    return s.kpis.some(function (k) { return k.achievement != null; });
  });
  var demo = S.demo
    ? '<div class="demo"><div class="in"><span>Showing sample values. Teams, employees, KRAs, KPIs and weightages are real; targets and actuals are not.</span><button data-demo="off">Show real data</button></div></div>'
    : (noPerf ? '<div class="demo"><div class="in"><span>No targets or actuals loaded for this period yet.</span><button data-demo="on">Preview with sample values</button></div></div>' : '');

  /* Two team-level screens and the profile. Team is the landing view, so an
     unknown or stale view key falls back to it rather than to nothing. */
  var body = (S.configFor || S.configTeam) ? ConfigScreen()
    : S.employee ? EmployeeScreen()
    : S.view === 'overview' ? ExecutiveOverview()
    : S.view === 'teams' ? (PageHead('Teams', 'Compare teams · ' + esc(monthLabel(S.month))) + TeamsTable())
    : S.view === 'targets' ? TargetsScreen()

    : S.view === 'directory' ? DirectoryScreen()

    : FlowchartScreen();
  $('#view').innerHTML = body;
  $('#banner').innerHTML = demo || '';   // full-bleed sibling above .wrap, so .demo spans edge to edge
  if (S.configFor || S.configTeam) cfgAfterRender();     // recompute the weightage total and load change history

}

/* Land each role where its work starts, once, after both the session and the
   model are in (spec §2: default landing per role). */
function applyLanding() {
  if (S._landed || !S.session || !S.model) return;
  S._landed = true;
  S.view = LANDING[effRole()] || 'team';
  if (S.view === 'profile') { S.employee = myProfileId(); }
}
function load() {
  S.loading = true; S.error = null; S._demo = null; Hist.clear(); render();
  // Resolve who is signed in (role + permissions) once; drives landing + write controls.
  if (!S.session && Api.live()) {
    google.script.run.withSuccessHandler(function (se) { if (se && se.ok) { S.session = se; applyLanding(); render(); } })
      .withFailureHandler(function () {}).apiSession();
  }
  Api.fetch(S.month, function (m) {
    S.loading = false;
    if (!m) {
      Api.ping(function (pong) {
        S.error = (pong && pong.ok)
          ? 'The dashboard data could not be sent back, although the connection is fine. This is usually one unreadable value in the sheet — a target or weight holding text such as "-" or "TBD". Open MONTHLY_TARGETS and ACTUAL_PERFORMANCE and clear any non-numeric target, actual or weight, then reload.'
          : 'The deployment is serving an older version of the code. In the Apps Script editor use Deploy → Manage deployments → edit → Version: New version, then reload.';
        render();
      }, function () {
        S.error = 'The deployment is serving an older version of the code, or this account cannot run it. In the Apps Script editor use Deploy → Manage deployments → edit → Version: New version, then reload.';
        render();
      });
      return render();
    }
    if (!m.ok) { S.error = (m.error || 'The backend reported a failure.') + (m.where ? ' (' + m.where + ')' : ''); return render(); }
    S.model = m; S._demo = null;
    if (!S.team && m.teams && m.teams.length) S.team = m.teams[0].team_id;
    if (!S.month) { S.month = m.month || (Sel.months().slice(-1)[0] || null); }
    applyLanding();
    render();
  }, function (e) {
    S.loading = false; S.error = (e && e.message) || 'The backend could not be reached.'; render();
  });
}

    S.detail = { kind: 'def', kpi: S.detail.kpi, owner: S.detail.owner }; renderDrawer(); return;
  }
  if (e.target.closest('[data-dback]') && S.detail && S.detail.kpi) {
    S.detail = { kind: 'kpi', kpi: S.detail.kpi, owner: S.detail.owner }; renderDrawer(); return;
  }
  var k = e.target.closest('[data-kpi]');
  if (k) {
    var p = k.dataset.kpi.split('::'), owner = scById(p[0]);
    var picked = owner ? owner.kpis.filter(function (x) { return x.kpi_id === p[1]; })[0] : null;
    S._trigger = k;
    S.detail = picked ? { kind: 'kpi', kpi: picked, owner: owner } : null;
    renderDrawer(); return;
  }
  if (e.target.closest('[data-close]') || e.target.id === 'scrim') { S.detail = null; renderDrawer(); return; }
  var d = e.target.closest('[data-demo]');
  if (d) { S.demo = d.dataset.demo === 'on'; S._demo = null; S.detail = null; Hist.clear(); render(); return; }
  if (e.target.closest('[data-retry]')) load();
});
document.addEventListener('change', function (e) {
  var id = e.target.id;
  if (id === 'f-team') { S.team = e.target.value; S.employee = null; S.detail = null; render(); $('.canvas').scrollTop = 0; }
  else if (id === 'f-month') { S.month = e.target.value; S.detail = null; S._demo = null; Hist.clear(); load(); }
  else if (id === 'f-emp') { S.employee = e.target.value || null; S.detail = null; render(); }
  else if (id === 'assign-team') {
    var emp = S.detail && S.detail.emp, btn = $('#assign-btn'), mt = $('#map-team');
    var tn = e.target.options[e.target.selectedIndex] ? e.target.options[e.target.selectedIndex].text : '';
    var same = emp && e.target.value === emp.team_id;
    if (btn) { btn.disabled = !!same; btn.textContent = same ? 'Select a different team' : 'Reassign to ' + tn; }
    if (mt) mt.textContent = tn;   // live-preview the target mapping
  }
  else if (id === 'aa-team') { var kpiSel = $('#aa-kpi'); if (kpiSel) kpiSel.innerHTML = teamKpiOptions(e.target.value); aaPreview(); }
  else if (id === 'aa-kpi') { aaPreview(); }
  else if (id === 'f-role') {
    S.viewRole = e.target.value; S.employee = null; S.detail = null;
    S.view = LANDING[S.viewRole] || 'team';
    if (S.view === 'profile') { S.employee = myProfileId(); }
    render(); $('.canvas').scrollTop = 0;
  }
});
/* Live weightage total as the config form is typed (the form is not re-rendered
   while open, so this updates the running total and the Save gate directly). */
document.addEventListener('input', function (e) {
  if ((S.configFor || S.configTeam) && e.target.classList && e.target.classList.contains('cfg-f-wt')) cfgRecalcTotal();
  if (e.target.id === 'dir-search') dirFilter(e.target.value);
  if (e.target.id === 'gsearch') gsearch(e.target.value);
});
document.addEventListener('keydown', function (e) {
  // While the drawer is open: Escape closes it, Tab stays trapped inside it.
  if (S.detail) {
    if (e.key === 'Escape') { S.detail = null; renderDrawer(); return; }
    if (e.key === 'Tab') {
      var dr = $('#drawer');
      var f = dr.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
      if (f.length) {
        var first = f[0], last = f[f.length - 1];
        if (!dr.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
  }
  // Rank rows and flow nodes are div[role=button]; table rows and KRA bands now
  // carry native <button>s that handle their own keys, so only the [data-emp]
  // drill targets still need synthetic Enter/Space activation.
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
    var act = e.target.closest ? e.target.closest('[data-emp]') : null;
    if (act && act.getAttribute('role') === 'button') { e.preventDefault(); act.click(); }
  }
});

load();
</script>

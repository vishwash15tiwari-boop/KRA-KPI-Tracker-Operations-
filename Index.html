<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRA / KPI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   KRA / KPI Tracker
   ----------------------------------------------------------------------------
   The product answers four questions in order — who, what, how much, how well —
   and shows nothing that does not serve one of them.

   Three levels, and nothing beyond them is visible by default:
       TEAMS  →  TEAM FLOW  →  PERSON  →  KPI

   The restraint is the design. Almost monochrome until performance requires
   emphasis; typography and space carry hierarchy so most values need no box
   around them at all.
   ============================================================================ */
:root{
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

  --bg:#FAFAFA;--card:#FFFFFF;--surface:#F4F4F5;--well:#E9E9EC;
  --ink:#18181B;--ink-2:#3F3F46;--muted:#71717A;--faint:#A1A1AA;
  --line:#E7E7EA;--line-2:#D6D6DB;--line-soft:#F1F1F3;

  /* Status is the only colour, and it is muted enough that a screen full of it
     still reads as one calm surface. */
  --good:#2F6B4F;--good-soft:#EAF2ED;
  --warn:#8A6320;--warn-soft:#F7F0E3;
  --bad:#9C3B32;--bad-soft:#F7EAE8;

  --fs-hero:44px;--fs-xxl:30px;--fs-xl:19px;--fs-lg:15px;--fs-md:14px;
  --fs-sm:13px;--fs-xs:12px;--fs-2xs:11px;
  --fw-n:400;--fw-m:500;--fw-b:600;

  --r-ctl:6px;--r-card:10px;--r-lg:14px;--r-pill:999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:40px;--s8:56px;--s9:80px;

  --e1:0 1px 2px rgba(24,24,27,.04);
  --e2:0 1px 3px rgba(24,24,27,.06),0 10px 24px -16px rgba(24,24,27,.16);
  --e3:0 24px 56px -20px rgba(24,24,27,.24);

  --ease:cubic-bezier(.2,.6,.35,1);--d1:130ms;--d2:220ms;
  --maxw:1080px;--nodew:190px;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:var(--fs-sm);
  line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:'tnum' 1,'cv11' 1;letter-spacing:-.006em}
button,select{font-family:inherit;cursor:pointer}
b,strong{font-weight:var(--fw-b)}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--r-ctl)}

/* ---------------------------------------------------------------- CHROME --
   The navigation almost disappears: a wordmark, the period, and — once you are
   inside a team — the team names as plain text. The platform is the navigation. */
.top{position:sticky;top:0;z-index:30;background:rgba(250,250,250,.85);
  backdrop-filter:saturate(150%) blur(10px);border-bottom:1px solid var(--line)}
.nav{max-width:var(--maxw);margin:0 auto;padding:0 var(--s5);min-height:54px;
  display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap}
.mark{font-size:var(--fs-xs);font-weight:var(--fw-b);letter-spacing:.02em;color:var(--ink);
  white-space:nowrap;border:none;background:none;padding:0}
.mark:hover{color:var(--muted)}
.teams{display:flex;gap:var(--s4);overflow-x:auto;flex:1;scrollbar-width:none;align-items:center}
.teams::-webkit-scrollbar{display:none}
.tb{border:none;background:transparent;color:var(--muted);font-size:var(--fs-xs);
  font-weight:var(--fw-m);padding:4px 0;white-space:nowrap;position:relative;
  transition:color var(--d1) var(--ease)}
.tb:hover{color:var(--ink)}
.tb.on{color:var(--ink);font-weight:var(--fw-b)}
.tb.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--ink)}
.tb .ts{display:none}

.wrap{max-width:var(--maxw);margin:0 auto;padding:var(--s8) var(--s5) var(--s9)}
.demo{border-bottom:1px solid var(--line);background:var(--good-soft)}
.demo .in{max-width:var(--maxw);margin:0 auto;padding:7px var(--s5);display:flex;align-items:center;
  gap:var(--s2);font-size:var(--fs-xs);color:var(--good)}
.demo button{margin-left:auto;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);
  font-size:var(--fs-2xs);font-weight:var(--fw-m);padding:3px 10px;border-radius:var(--r-pill)}
.demo button:hover{border-color:var(--ink)}

.sel{border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-size:var(--fs-xs);
  font-weight:var(--fw-m);padding:5px var(--s3);border-radius:var(--r-ctl);
  transition:border-color var(--d1) var(--ease)}
.sel:hover:not(:disabled){border-color:var(--ink)}
.sel:disabled{color:var(--faint);background:var(--surface);cursor:not-allowed}
.nav .sel{margin-left:auto}

.back{border:none;background:none;color:var(--muted);font-size:var(--fs-xs);font-weight:var(--fw-m);
  padding:0;margin-bottom:var(--s5);display:inline-flex;align-items:center;gap:5px;
  transition:color var(--d1) var(--ease)}
.back:hover{color:var(--ink)}

/* ----------------------------------------------------------------- TEAMS --
   The landing screen is deliberately almost empty: a title, and the five places
   you can go. No totals, no charts, no summary. */
.page-t{font-size:var(--fs-xxl);font-weight:var(--fw-b);letter-spacing:-.03em;margin:0 0 var(--s2)}
.page-s{font-size:var(--fs-sm);color:var(--muted);margin:0 0 var(--s8)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s4)}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  padding:var(--s5);text-align:left;display:flex;flex-direction:column;gap:var(--s5);
  min-height:150px;cursor:pointer;
  transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.tcard:hover{border-color:var(--line-2);box-shadow:var(--e2)}
.tcard .tt{display:block;font-size:var(--fs-2xs);font-weight:var(--fw-b);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);line-height:1.4}
.tcard .tm{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:var(--s1);line-height:1.5}
.tcard .tv{margin-top:auto;display:block}
.tcard .tv .l{display:block;font-size:var(--fs-2xs);color:var(--muted)}
.tcard .tv .v{display:block;font-size:var(--fs-xxl);font-weight:var(--fw-b);letter-spacing:-.03em;
  line-height:1;font-variant-numeric:tabular-nums;margin-top:var(--s1)}
.tcard .tv .v em{font-style:normal;font-size:var(--fs-sm);color:var(--faint);font-weight:var(--fw-m)}

/* ------------------------------------------------------------- TEAM FLOW --
   People as performance nodes, not profile cards. Each node carries a name, a
   role and a score — enough to answer "who is performing well", and nothing
   that would begin to answer "why", which belongs inside the profile.

   The connectors are hairlines. They state the reporting relationship and then
   get out of the way. */
.flow{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:var(--s7)}
.lvl{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--s4);width:100%}
.drop{width:1px;height:var(--s5);background:var(--line-2);flex:0 0 auto}
.branch{display:flex;justify-content:center;width:100%}
.branch .arm{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;
  align-items:center}
.branch .arm::before{content:"";position:absolute;top:0;height:1px;background:var(--line-2);left:0;right:0}
.branch .arm:first-child::before{left:50%}
.branch .arm:last-child::before{right:50%}
.branch .arm:only-child::before{display:none}
.branch .arm .stem{width:1px;height:var(--s5);background:var(--line-2);flex:0 0 auto}

/* Two fixed rows: identity on top, performance pinned to the bottom. Because
   the identity block reserves exactly two lines for the role, the score, the
   stage word and the bar land on the same baseline in every card in the row —
   a name that wraps can never push one card's bar out of line with its
   neighbours'. */
.node{width:var(--nodew);background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-card);padding:var(--s4);text-align:left;cursor:pointer;
  display:grid;grid-template-rows:auto 1fr;gap:var(--s4);
  transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.node:hover{border-color:var(--line-2);box-shadow:var(--e2)}
.node:active{background:var(--surface)}
/* The lead is one step larger — the only size difference in the chart, and it
   carries the hierarchy without a heavier border or a colour. */
.node.lead{width:calc(var(--nodew) + 28px);box-shadow:var(--e1)}
.node .nh,.node .nf{display:block;min-width:0}
.node .nf{align-self:end}
.node .nm{display:block;font-size:var(--fs-sm);font-weight:var(--fw-b);line-height:17px;height:17px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* exactly two lines are reserved, so no node can grow taller than its siblings */
.node .rl{display:-webkit-box;font-size:var(--fs-2xs);color:var(--muted);line-height:1.35;
  margin-top:3px;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:30px}
/* score and stage share a baseline; the score is the anchor and the word is
   set small and quiet beside it, so the figure is still what you read first */
.node .sr{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2)}
.node .sc{font-size:var(--fs-xl);font-weight:var(--fw-b);letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.node.lead .sc{font-size:var(--fs-xxl)}
.node .sc em{font-style:normal;font-size:var(--fs-xs);color:var(--faint);font-weight:var(--fw-m)}
.node .stg{font-size:var(--fs-2xs);font-weight:var(--fw-b);white-space:nowrap;letter-spacing:.01em}
.node .stg.good{color:var(--good)}
.node .stg.warn{color:var(--warn)}
.node .stg.bad{color:var(--bad)}
.node .stg.none{color:var(--faint);font-weight:var(--fw-m)}

/* The bar itself. Notches are cut in the card's own colour so they read as
   breaks in the fill rather than marks on top of it. */
.pb{display:block;position:relative;height:6px;margin-top:var(--s3);
  background:var(--well);border-radius:var(--r-pill);overflow:hidden}
.pb i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);
  background:var(--ink);transition:width var(--d2) var(--ease)}
.pb i.good{background:var(--good)}
.pb i.warn{background:var(--warn)}
.pb i.bad{background:var(--bad)}
.pb i.none{background:var(--line-2)}
.pb u{position:absolute;top:0;width:1.5px;height:100%;background:var(--card);
  transform:translateX(-.75px)}
.gnode .pb u{background:var(--surface)}
.gnode.open .pb u,.gnode:hover .pb u{background:var(--card)}


/* A function tier, not a person. It is visibly a different kind of object —
   flatter, on the sunken surface, with a chevron — so no one mistakes it for
   someone they can open a profile on. */
/* Same two-row skeleton as a person node, so the two kinds of card align to
   the same internal grid and their bars sit at the same height when they share
   a row. */
.gnode{width:var(--nodew);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-card);padding:var(--s4);text-align:left;cursor:pointer;
  display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;
  gap:var(--s4) var(--s3);
  transition:border-color var(--d1) var(--ease),background var(--d1) var(--ease)}
.gnode:hover{border-color:var(--line-2);background:var(--card)}
.gnode.open{background:var(--card);border-color:var(--line-2)}
.gnode .gh{grid-column:1;grid-row:1;min-width:0}
.gnode .gt{display:block;font-size:var(--fs-2xs);font-weight:var(--fw-b);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);line-height:17px;height:17px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* one line here against the person card's two, plus the chevron row, brings
   both card types to the same height */
.gnode .gm{display:block;font-size:var(--fs-2xs);color:var(--muted);margin-top:3px;height:30px}
.gnode .gc{grid-column:2;grid-row:1;font-size:var(--fs-lg);color:var(--faint);
  width:18px;text-align:center;line-height:1.2}
.gnode:hover .gc,.gnode.open .gc{color:var(--ink)}
.gnode .gf{grid-column:1/-1;grid-row:2;align-self:end;min-width:0}
.gnode .sr{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2)}
.gnode .gs{font-size:var(--fs-xl);font-weight:var(--fw-b);letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.gnode .gs em{font-style:normal;font-size:var(--fs-xs);color:var(--faint);font-weight:var(--fw-m)}
.gnode .stg{font-size:var(--fs-2xs);font-weight:var(--fw-b);white-space:nowrap}
.gnode .stg.good{color:var(--good)}
.gnode .stg.warn{color:var(--warn)}
.gnode .stg.bad{color:var(--bad)}
.gnode .stg.none{color:var(--faint);font-weight:var(--fw-m)}
@media(max-width:760px){.gnode{width:100%;max-width:300px}}
/* --------------------------------------------------------------- PROFILE --
   One dominant figure, three stats, then the KRAs that explain it. */
.prof{display:flex;align-items:flex-start;gap:var(--s6);flex-wrap:wrap;margin-bottom:var(--s8)}
.prof .pid h1{font-size:var(--fs-xxl);font-weight:var(--fw-b);margin:0;letter-spacing:-.03em;line-height:1.15}
.prof .pid .meta{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--s2);line-height:1.6}
.prof .pr{margin-left:auto;display:flex;align-items:center;gap:var(--s7)}
.ring{position:relative;width:112px;height:112px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .tr{fill:none;stroke:var(--well);stroke-width:6}
.ring .fg{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0}
.ring .lbl b{font-size:var(--fs-xxl);font-weight:var(--fw-b);letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;line-height:1}
.ring .lbl span{font-size:var(--fs-2xs);color:var(--faint);margin-top:2px}
/* Three stats. Not four, not a grid of tiles — a short list set in type. */
.pstat{display:flex;flex-direction:column;gap:var(--s4)}
.pstat .si{display:flex;align-items:baseline;gap:var(--s4);justify-content:space-between;min-width:180px}
.pstat .si .l{font-size:var(--fs-xs);color:var(--muted)}
.pstat .si .v{font-size:var(--fs-lg);font-weight:var(--fw-b);font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}

/* ------------------------------------------------------------- KRA / KPI --
   The KRA heading is the navigation hierarchy; a rule and a label are enough.
   Each KPI is a row, not a card: name and weightage on one line, the numbers
   on the next, and a hairline bar beneath. Rows sit directly on the page, so
   twelve of them still read as one list rather than twelve objects. */
.kra-h{display:flex;align-items:baseline;gap:var(--s3);margin:var(--s7) 0 var(--s2)}
.kra-h .t{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--ink);
  text-transform:uppercase;letter-spacing:.11em;white-space:nowrap}
.kra-h .ln{flex:1;height:1px;background:var(--line)}
.kra-h .r{font-size:var(--fs-2xs);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.krow{display:block;width:100%;text-align:left;border:none;background:none;
  padding:var(--s4) var(--s3);border-bottom:1px solid var(--line-soft);cursor:pointer;
  transition:background var(--d1) var(--ease)}
.krow:hover{background:var(--card)}
.krow:last-child{border-bottom:none}
.krow .r1{display:flex;align-items:baseline;gap:var(--s4)}
.krow .kn{font-size:var(--fs-md);font-weight:var(--fw-b);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.012em}
.krow .kw{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.krow .r2{display:flex;align-items:baseline;gap:var(--s4);margin-top:var(--s2)}
.krow .flow-v{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow .flow-v b{color:var(--ink);font-weight:var(--fw-m)}
.krow .ach{font-size:var(--fs-md);font-weight:var(--fw-b);font-variant-numeric:tabular-nums;
  flex:0 0 auto;letter-spacing:-.015em}
.krow .ach.good{color:var(--good)}
.krow .ach.warn{color:var(--warn)}
.krow .ach.bad{color:var(--bad)}
.krow .ach.none{color:var(--faint);font-weight:var(--fw-m)}
.kbar{margin-top:var(--s3);height:3px;background:var(--well);border-radius:var(--r-pill);
  position:relative;overflow:hidden}
.kbar i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);background:var(--ink)}
.kbar i.good{background:var(--good)}
.kbar i.warn{background:var(--warn)}
.kbar i.bad{background:var(--bad)}

/* ---------------------------------------------------------------- DRAWER --
   One slim panel from the right. No modal stack, no nested popups. */
.scrim{position:fixed;inset:0;background:rgba(24,24,27,.28);opacity:0;pointer-events:none;
  transition:opacity var(--d2) var(--ease);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:calc(100vw - 32px);
  background:var(--card);border-left:1px solid var(--line);box-shadow:var(--e3);z-index:41;
  transform:translateX(100%);transition:transform var(--d2) var(--ease);
  overflow-y:auto;display:flex;flex-direction:column}
.modal.on{transform:none}
.m-h{padding:var(--s6) var(--s5) var(--s4);display:flex;align-items:flex-start;gap:var(--s3)}
.m-h h2{font-size:var(--fs-xl);font-weight:var(--fw-b);margin:0;letter-spacing:-.022em;line-height:1.25}
.m-h .sub{font-size:var(--fs-2xs);color:var(--muted);margin-top:var(--s1);text-transform:uppercase;
  letter-spacing:.11em;font-weight:var(--fw-b)}
.m-h .x{margin-left:auto;border:none;background:none;color:var(--faint);font-size:var(--fs-xl);
  line-height:1;padding:0 2px;flex:0 0 auto;transition:color var(--d1) var(--ease)}
.m-h .x:hover{color:var(--ink)}
.m-b{padding:0 var(--s5) var(--s7)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--s3) var(--s4);
  padding-top:var(--s4);border-top:1px solid var(--line)}
.kv dt{color:var(--muted);font-size:var(--fs-xs);white-space:nowrap}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:var(--fw-m);
  font-size:var(--fs-sm)}
.kv dd.hi{font-weight:var(--fw-b)}
.sect-t{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--muted);text-transform:uppercase;
  letter-spacing:.11em;margin:var(--s6) 0 var(--s3);padding-top:var(--s4);
  border-top:1px solid var(--line)}
.goal p{margin:0;color:var(--ink-2);line-height:1.65;font-size:var(--fs-xs)}
.m-perf .n{font-size:var(--fs-xxl);font-weight:var(--fw-b);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1}
.m-perf .n.good{color:var(--good)}.m-perf .n.warn{color:var(--warn)}.m-perf .n.bad{color:var(--bad)}
.m-perf .kbar{margin-top:var(--s3);height:4px}

/* ----------------------------------------------------------------- STATE -- */
.state{display:grid;place-items:center;min-height:52vh;text-align:center}
.state h2{font-size:var(--fs-xl);font-weight:var(--fw-b);margin:0 0 var(--s2)}
.state p{color:var(--muted);margin:0 0 var(--s4);max-width:46ch;line-height:1.6}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r-ctl);
  padding:8px 16px;font-size:var(--fs-sm);font-weight:var(--fw-m);
  transition:opacity var(--d1) var(--ease)}
.btn:hover{opacity:.86}
.btn.ghost{background:var(--card);border-color:var(--line-2);color:var(--ink-2);margin-left:var(--s2)}
.btn.ghost:hover{border-color:var(--ink);color:var(--ink);opacity:1}
.state .btn{margin-top:var(--s2)}
.empty{padding:var(--s6);text-align:center;color:var(--muted);font-size:var(--fs-xs)}
.hint{font-size:var(--fs-xs);color:var(--muted);margin-top:var(--s7);line-height:1.6}
.skl{background:linear-gradient(90deg,var(--surface),var(--well),var(--surface));
  background-size:200% 100%;border-radius:var(--r-card);animation:sh 1.4s ease-in-out infinite}
@keyframes sh{to{background-position:-200% 0}}

/* -------------------------------------------------------------- RESPONSE --
   The flow becomes a single column; a child still sits below its parent joined
   by the same hairline, so the structure survives the narrowing. */
@media(max-width:760px){
  .nav{padding:var(--s2) var(--s4);gap:var(--s3)}
  .nav .sel{margin-left:auto}
  .teams{order:3;flex-basis:100%;gap:var(--s4);padding-bottom:var(--s1)}
  .wrap{padding:var(--s6) var(--s4) var(--s8)}
  .demo .in{padding-left:var(--s4);padding-right:var(--s4)}
  .prof{gap:var(--s5)}
  .prof .pr{margin-left:0;width:100%;justify-content:space-between;gap:var(--s5)}
  .lvl,.branch{flex-direction:column;align-items:center;gap:var(--s3)}
  .branch{gap:0}
  .branch .arm{width:100%}
  .branch .arm::before{display:none}
  .branch .arm .stem{height:var(--s4)}
  .node,.node.lead{width:100%;max-width:300px}
  .modal{width:100%;max-width:100%}
}
@media(pointer:coarse){.tb,.btn,.sel{min-height:40px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============================================================================
   RECYKAL BRAND
   ----------------------------------------------------------------------------
   The structure above is right; what it was missing was the brand. Everything
   here comes from the official guidelines: Poppins across the family, Bright
   Blue #005DFF as the single interactive accent, the blue→purple gradient on
   the marks that carry identity, and Duke/Bright Green for success — green is
   on-brand for Recykal, which is why the "achieved" state is the one status
   colour that belongs to the palette rather than sitting outside it.

   Amber and red are not in the guidelines. They stay, because a performance
   system has to be able to say "behind", but they are held back to the muted
   functional pair the guide allows for alerts and never used decoratively.
   ============================================================================ */
:root{
  --font:'Poppins','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

  /* Brand */
  --brand:#005DFF;            /* Bright Blue — hero, the one interactive accent */
  --brand-ink:#024C8A;        /* Midnight Blue — pressed, and accent text on light */
  --brand-deep:#0000AF;       /* Blue — the deep end of the ramp */
  --brand-2:#8460D4;          /* Medium Purple — closes the gradient */
  --peri:#567DE8;             /* Periwinkle — informational, never performance */
  --brand-soft:#EAF1FF;
  --brand-line:#CFE0FF;
  --grad:linear-gradient(135deg,#005DFF,#8460D4);
  --grad-deep:linear-gradient(135deg,#024C8A,#0000AF);

  /* Neutrals, tinted toward the brand blue so nothing reads as flat grey */
  --bg:#F6F8FC;--card:#FFFFFF;--surface:#EFF3FA;--well:#DFE7F3;
  --ink:#0B1B36;--ink-2:#3A4A66;--muted:#66748C;--faint:#93A0B5;
  --line:#E3E9F3;--line-2:#CFD9E8;--line-soft:#EEF2F9;

  /* Status. Green is the brand's own; amber and red are functional only. */
  --good:#049769;--good-2:#1DC797;--good-soft:#E3F5EE;
  --warn:#B0740E;--warn-soft:#FBF1DE;
  --bad:#C0392F;--bad-soft:#FAEAE8;

  /* Elevation, tinted blue so shadows belong to the same light as the ground */
  --e1:0 1px 2px rgba(11,27,54,.05);
  --e2:0 1px 3px rgba(11,27,54,.06),0 14px 32px -18px rgba(11,27,54,.22);
  --e3:0 28px 60px -22px rgba(11,27,54,.30);
}

/* Poppins is geometric and sets a touch wider than Inter, so the tracking that
   suited Inter has to come back a step or headings start to look loose. */
body{letter-spacing:-.015em}
.page-t,.prof .pid h1,.m-h h2{letter-spacing:-.035em}
.node .sc,.gnode .gs,.tcard .tv .v,.ring .lbl b{letter-spacing:-.04em}

/* ---------------------------------------------------------------- CHROME -- */
.top{background:rgba(246,248,252,.86);border-bottom:1px solid var(--line)}
.mark{color:var(--brand);font-weight:700;letter-spacing:.04em}
.mark:hover{color:var(--brand-ink)}
.tb{font-weight:500}
.tb:hover{color:var(--brand)}
.tb.on{color:var(--brand);font-weight:600}
.tb.on::after{background:var(--brand);height:2px;border-radius:2px}
.sel:hover:not(:disabled),.sel:focus{border-color:var(--brand)}
.sel:focus{box-shadow:0 0 0 3px var(--brand-soft)}
.back:hover{color:var(--brand)}
*:focus-visible{outline-color:var(--brand)}
.demo{background:var(--good-soft);border-bottom-color:var(--good-soft)}
.demo .in{color:var(--good)}

/* ----------------------------------------------------------------- TEAMS --
   A team card carries the brand mark: the four-petal pinwheel from the guide,
   drawn in the four brand hues. It is the one piece of ornament in the
   product, and it earns its place by making the landing screen unmistakably
   Recykal at a glance. */
.tcard{border-color:var(--line);box-shadow:var(--e1);position:relative;overflow:hidden}
.tcard::after{content:"";position:absolute;right:-28px;top:-28px;width:104px;height:104px;
  border-radius:50%;background:var(--brand-soft);opacity:.55;pointer-events:none;
  transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease)}
.tcard:hover{border-color:var(--brand-line);box-shadow:var(--e2)}
.tcard:hover::after{opacity:.9;transform:scale(1.08)}
.tcard .tt{color:var(--ink)}
.tcard .tv .v{color:var(--brand)}
.tcard > *{position:relative;z-index:1}

/* ------------------------------------------------------------- TEAM FLOW --
   The lead is the identity node, so it takes the brand: a gradient rule across
   its top edge. Everyone else stays white, which keeps the chart calm and lets
   one card carry the hierarchy without a second border weight or a tint. */
.node{box-shadow:var(--e1);border-color:var(--line)}
.node:hover{border-color:var(--brand-line);box-shadow:var(--e2)}
.node.lead{position:relative;overflow:hidden;box-shadow:var(--e2)}
.node.lead::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.node .sc{color:var(--ink)}
.node.lead .sc{color:var(--brand)}
.gnode{border-color:var(--line);background:var(--surface)}
.gnode:hover,.gnode.open{border-color:var(--brand-line);background:var(--card)}
.gnode.open .gc,.gnode:hover .gc{color:var(--brand)}
.gnode .gt{color:var(--brand-ink)}
.drop,.branch .arm::before,.branch .arm .stem{background:var(--line-2)}

/* Status words and bar fills, on the brand ramp where the brand has one. */
.stg.good,.krow .ach.good,.st.good{color:var(--good)}
.stg.warn,.krow .ach.warn,.st.warn{color:var(--warn)}
.stg.bad,.krow .ach.bad,.st.bad{color:var(--bad)}
.pb{background:var(--well);height:6px}
.pb i{background:var(--brand)}
.pb i.good{background:linear-gradient(90deg,var(--good),var(--good-2))}
.pb i.warn{background:var(--warn)}
.pb i.bad{background:var(--bad)}
.kbar i.good{background:linear-gradient(90deg,var(--good),var(--good-2))}

/* --------------------------------------------------------------- PROFILE --
   The ring is the one place the full brand gradient appears at size. A flat
   stroke cannot take a gradient, so the arc is painted through an SVG gradient
   and the track sits behind it in the well tone. */
.prof{border-bottom:1px solid var(--line)}
.ring .tr{stroke:var(--well)}
.ring .fg{stroke:url(#brandArc)}
.ring .lbl b{color:var(--brand)}
.pstat .si .v{color:var(--ink)}
.kra-h .t{color:var(--brand-ink)}
.kra-h .ln{background:var(--line)}
.krow{border-bottom-color:var(--line-soft)}
.krow:hover{background:var(--card);box-shadow:var(--e1)}
.krow .kn{color:var(--ink)}

/* ---------------------------------------------------------------- DRAWER -- */
.modal{border-left:1px solid var(--line);box-shadow:var(--e3)}
.m-h h2{color:var(--ink)}
.m-h .sub{color:var(--brand-ink)}
.sect-t{color:var(--brand-ink)}
.kv{border-top-color:var(--line)}
.m-perf .n{color:var(--brand)}
.m-perf .n.good{color:var(--good)}
.m-perf .n.warn{color:var(--warn)}
.m-perf .n.bad{color:var(--bad)}
.scrim{background:rgba(11,27,54,.36)}

/* ----------------------------------------------------------------- STATE -- */
.btn{background:var(--brand);border-color:var(--brand)}
.btn:hover{background:var(--brand-ink);border-color:var(--brand-ink);opacity:1}
.btn.ghost{background:var(--card);border-color:var(--line-2);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand);background:var(--card)}

/* ============================================================================
   LOGO, RHYTHM AND FIT
   ----------------------------------------------------------------------------
   The mark is the four-petal pinwheel from the guidelines, in the four brand
   hues at 0/90/180/270°. It sits with the product name so the top-left corner
   identifies the product and returns you home in one control.

   The rest of this block is about fit: the screens were carrying more air than
   they earned. Whitespace is worth having when it separates things that mean
   different things — it is dead weight when it is simply left over. Every
   value below was measured against content rather than chosen for looks.
   ============================================================================ */
.mark{display:inline-flex;align-items:center;gap:9px;line-height:1}
.mark .logo{flex:0 0 auto;display:grid;place-items:center}
.mark .logo svg{width:22px;height:22px;display:block}
.mark .wm{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.mark .wm{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.mark .wm b{font-size:9.5px;font-weight:600;color:var(--brand);letter-spacing:.1em;
  text-transform:uppercase}
.mark:hover .wm{color:var(--brand)}
.nav{min-height:60px;gap:var(--s5)}

/* --- Vertical rhythm ------------------------------------------------------
   Was 56px above the title and 56px below the subtitle, which pushed the first
   real content most of a screen down. A title needs air above it, not a void. */
.wrap{padding-top:var(--s6);padding-bottom:var(--s7)}
.page-t{font-size:26px;margin-bottom:var(--s1)}
.page-s{font-size:var(--fs-xs);margin-bottom:var(--s5)}
.back{margin-bottom:var(--s3)}

/* --- Team grid ------------------------------------------------------------
   Five teams into a three-column grid always left one slot empty and a band of
   dead space beneath. A narrower minimum lets the row find its own count, and
   the cards carry their content at a height that fits it. */
/* Five teams, one row. An auto-fit grid put four across and left the fifth
   stranded on a row of its own with a band of dead space beside it; naming the
   count removes both. Below the width where five still read, it steps to three
   and then two rather than drifting. */
.tgrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s3)}
@media(max-width:1080px){.tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:440px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.tcard{min-height:0;padding:var(--s4);gap:var(--s4)}
.tcard::after{width:88px;height:88px;right:-24px;top:-24px}
/* Two lines are reserved for the name whether or not it needs them, so a team
   whose name wraps cannot stand taller than the four beside it. */
.tcard .tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.35;height:30px;font-size:10.5px;letter-spacing:.085em}
.tcard .tm{font-size:var(--fs-2xs);line-height:1.4;height:17px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.tcard .tv .l{font-size:10px}
.tcard .tv .v{font-size:25px}

/* --- Flow -----------------------------------------------------------------
   The chart began 40px below a heading that already had 24px under it. One
   gap, not two. */
.flow{margin-top:var(--s5)}
.lvl{gap:var(--s3)}
.drop{height:20px}
.branch .arm .stem{height:20px}
.node,.gnode{padding:var(--s3) var(--s4)}
.node{gap:var(--s3)}
.gnode{gap:var(--s3) var(--s3)}

/* --- Profile --------------------------------------------------------------
   The identity block and the ring belong on one line at any comfortable width;
   the stats sit between them rather than below, which removes a whole band of
   empty space on the left. */
.prof{margin-bottom:var(--s5);padding-bottom:var(--s5);gap:var(--s5);align-items:center}
.prof .pid h1{font-size:26px}
.prof .pid .meta{margin-top:var(--s1)}
.prof .pr{gap:var(--s6)}
.ring{width:96px;height:96px}
.ring .lbl b{font-size:24px}
.pstat{gap:var(--s3)}
.pstat .si{min-width:172px}
.pstat .si .v{font-size:var(--fs-md)}
.kra-h{margin:var(--s5) 0 0}
.kra-h:first-of-type{margin-top:var(--s4)}
.krow{padding:var(--s3)}
.krow .r2{margin-top:6px}
.kbar,.krow .kbar{margin-top:var(--s2)}
.hint{margin-top:var(--s5)}

/* --- Drawer --------------------------------------------------------------- */
.m-h{padding:var(--s5) var(--s5) var(--s3)}
.m-b{padding:0 var(--s5) var(--s6)}
.sect-t{margin:var(--s5) 0 var(--s2);padding-top:var(--s3)}

@media(max-width:760px){
  .wrap{padding-top:var(--s5)}
  .mark .wm{font-size:12px}
  .tgrid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .prof{align-items:flex-start}
}

/* ============================================================================
   FINAL SYSTEM — minimal at the surface, precise underneath
   ----------------------------------------------------------------------------
   Typography, alignment and spacing carry the hierarchy. Colour answers one
   question only — is there something I need to notice — and never decorates.
   Most surfaces are flat with a hairline; elevation is reserved for the drawer.
   ============================================================================ */
:root{
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

  --bg:#F7F7F5;--card:#FFFFFF;--surface:#F1F1EF;--well:#E7E7E5;
  --ink:#161616;--ink-2:#3F3F3D;--muted:#6B6B6B;--faint:#9A9A9A;
  --line:#E7E7E5;--line-2:#DCDCD9;--line-soft:#EFEFED;

  /* One restrained accent. It marks the current thing and the interactive
     thing, and appears almost nowhere else. */
  --brand:#005DFF;--brand-ink:#024C8A;--brand-soft:#EDF3FF;

  /* Muted semantics. Never bright, never decorative. */
  --good:#3F6B52;--good-soft:#EDF3EF;--good-bar:#6E9C81;
  --warn:#8A6A2F;--warn-soft:#F6F1E7;--warn-bar:#C0A063;
  --bad:#8F423A;--bad-soft:#F6EDEC;--bad-bar:#B77A72;

  --r-ctl:8px;--r-row:12px;--r-card:16px;--r-lg:20px;--r-pill:999px;
  --maxw:1320px;--nodew:236px;

  --e1:0 1px 2px rgba(22,22,22,.04);
  --e2:0 1px 2px rgba(22,22,22,.05);
  --e3:0 20px 48px -16px rgba(22,22,22,.22);
  --d1:150ms;--d2:220ms;
}
body{letter-spacing:-.011em}

/* --- Header: 60px, and everything on one line ---------------------------- */
.top{background:rgba(247,247,245,.9);border-bottom:1px solid var(--line)}
.nav{min-height:60px}
.mark .wm{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.mark .wm b{font-size:9.5px;font-weight:500;color:var(--muted);letter-spacing:.1em}
.mark:hover .wm{color:var(--ink)}
.tb{font-size:13px;font-weight:500;color:var(--muted);transition:color var(--d1) var(--ease),
  background var(--d1) var(--ease);padding:5px 10px;border-radius:var(--r-ctl)}
.tb:hover{color:var(--ink);background:var(--surface)}
.tb.on{color:var(--ink);font-weight:600;background:transparent}
.tb.on::after{background:var(--ink);height:1.5px;left:10px;right:10px}
.sel{border-radius:var(--r-ctl);font-size:12px;font-weight:500;padding:6px 12px}
.sel:hover:not(:disabled),.sel:focus{border-color:var(--ink)}
.sel:focus{box-shadow:0 0 0 3px var(--surface)}
.demo{background:var(--card);border-bottom:1px solid var(--line)}
.demo .in{color:var(--muted)}

/* --- Type scale ----------------------------------------------------------- */
.page-t{font-size:24px;font-weight:600;line-height:30px;letter-spacing:-.022em;margin-bottom:var(--s1)}
.page-s{font-size:13px;font-weight:400;color:var(--muted);margin-bottom:var(--s5)}
.back{font-size:12px;font-weight:500;margin-bottom:var(--s3)}

/* --- The one score per screen --------------------------------------------
   Flat, no card, no dark plane. The figure and the ring are the whole thing;
   the two supporting stats sit to the right in quiet type. */
.anchor{display:flex;align-items:center;gap:var(--s6);flex-wrap:wrap;
  background:transparent;border:none;border-bottom:1px solid var(--line);
  border-radius:0;padding:0 0 var(--s5);margin-bottom:var(--s5);color:var(--ink)}
.anchor::after{display:none}
.anchor > div{min-width:0}
/* The two supporting stats sit to the right of the score, not beneath it —
   three values on one line is the whole summary a screen needs. */
.anchor .ar{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap}
.anchor .ai{min-width:0}
.anchor .al{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.anchor .av{font-size:36px;font-weight:600;line-height:42px;letter-spacing:-.03em;
  color:var(--ink);margin-top:2px}
.anchor .av em{font-size:14px;font-weight:500;color:var(--faint);margin-left:3px}
.anchor .as{font-size:12px;font-weight:400;color:var(--muted);margin-top:var(--s2)}
.anchor .ar{gap:var(--s7)}
.anchor .ai .l{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.04em;
  text-transform:none}
.anchor .ai .v{font-size:18px;font-weight:600;line-height:24px;color:var(--ink);margin-top:2px}
.ring{width:88px;height:88px}
.ring .tr{stroke:var(--well);stroke-width:5}
.ring .fg{stroke:var(--ink);stroke-width:5}
.ring .lbl b{font-size:20px;font-weight:600;color:var(--ink)}
.ring .lbl span{font-size:10px;color:var(--faint)}

/* --- Team cards ----------------------------------------------------------- */
.tgrid{gap:var(--s3)}
.tcard{border-radius:var(--r-card);box-shadow:none;padding:var(--s4);gap:var(--s5)}
.tcard::after{display:none}
.tcard:hover{border-color:var(--line-2);background:var(--card);box-shadow:var(--e1)}
.tcard .tt{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink)}
.tcard .tm{font-size:11px;font-weight:400;color:var(--muted)}
.tcard .tv .l{font-size:11px;font-weight:500;color:var(--muted)}
.tcard .tv .v{font-size:28px;font-weight:600;letter-spacing:-.028em;color:var(--ink)}
.tcard .tv .v em{font-size:12px;color:var(--faint);font-weight:500}

/* --- Employee node: left-aligned, avatar beside the name -----------------
   Name top-left, role directly under it, score bottom-left. Nothing centred —
   a common left edge down the card is what makes a chart of them read as one
   system rather than a row of separate objects. */
.node,.gnode{border-radius:var(--r-card);box-shadow:none;padding:var(--s4);
  transition:border-color var(--d1) var(--ease),background var(--d1) var(--ease)}
.node:hover,.gnode:hover{border-color:var(--line-2);background:var(--card);box-shadow:var(--e1)}
.node.lead::before{display:none}
.node.lead{border-color:var(--line-2)}
.node .nh{display:flex;align-items:flex-start;gap:var(--s2)}
.node .av{flex:0 0 auto;width:30px;height:30px;border-radius:var(--r-pill);background:var(--surface);
  color:var(--ink-2);font-size:10.5px;font-weight:600;display:grid;place-items:center;
  letter-spacing:.02em;margin-top:1px}
.node .nt{min-width:0;flex:1}
.node .nm{font-size:14px;font-weight:600;line-height:20px;height:20px;color:var(--ink)}
.node .rl{font-size:12px;font-weight:400;line-height:16px;height:32px;color:var(--muted);margin-top:1px}
.node .sr{align-items:baseline}
.node .sc,.node.lead .sc{font-size:28px;font-weight:600;line-height:34px;letter-spacing:-.028em;
  color:var(--ink)}
.node .sc em{font-size:11px;color:var(--faint);font-weight:500}
.gnode .gt{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink);height:20px;
  line-height:20px}
.gnode .gm{font-size:12px;font-weight:400;color:var(--muted);height:32px;line-height:16px}
.gnode .gs{font-size:28px;font-weight:600;letter-spacing:-.028em;color:var(--ink)}
.gnode .gs em{font-size:11px;color:var(--faint);font-weight:500}

/* Status: a small label in subtle colour. Not a badge. */
.stg,.node .stg,.gnode .stg{font-size:11px;font-weight:500;color:var(--muted);
  display:inline-flex;align-items:center}
.node .stg.good,.gnode .stg.good{color:var(--good)}
.node .stg.warn,.gnode .stg.warn{color:var(--warn)}
.node .stg.bad,.gnode .stg.bad{color:var(--bad)}
.dot{display:none}

/* Connectors: 1px, low contrast, position first. */
.drop,.branch .arm::before,.branch .arm .stem{background:var(--line-2)}
.lvl{gap:var(--s5)}
.drop,.branch .arm .stem{height:var(--s5)}

/* --- One progress bar, everywhere ---------------------------------------- */
.pb,.kbar{background:var(--well);height:4px;border-radius:var(--r-pill)}
.pb i,.kbar i{background:var(--ink);border-radius:var(--r-pill)}
.pb i.good,.kbar i.good{background:var(--good-bar)}
.pb i.warn,.kbar i.warn{background:var(--warn-bar)}
.pb i.bad,.kbar i.bad{background:var(--bad-bar)}
.pb i.none,.kbar i.none{background:var(--line-2)}
.pb u{background:var(--card);width:1px}
.gnode .pb u{background:var(--surface)}
/* The bar animates its width, not a transform: a scaled fill renders at the
   wrong length whenever the animation has not resolved, and a progress bar
   that lies is worse than one that simply appears. */
.pb i,.kbar i{transition:width 400ms var(--ease)}

/* --- KRA header: whitespace, not a container ----------------------------- */
.kra-h{margin:var(--s6) 0 var(--s2);align-items:baseline;gap:var(--s3)}
.kra-h .ix{display:none}
.kra-h .t{font-size:13px;font-weight:600;line-height:18px;letter-spacing:.06em;color:var(--ink)}
.kra-h .ln{display:none}
.kra-h .r{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}

/* --- KPI row -------------------------------------------------------------
   Name and weightage on the first line, then actual → target → achievement,
   then the bar. Text left, numbers right, one fixed height so a long name
   never changes the rhythm of the list. */
.krow{border-radius:var(--r-row);border:1px solid transparent;border-bottom:1px solid var(--line);
  padding:var(--s4) var(--s3);transition:background var(--d1) var(--ease)}
.krow:last-child{border-bottom:1px solid var(--line)}
.krow:hover{background:var(--card);border-color:var(--line);box-shadow:none}
.krow .kn{font-size:14px;font-weight:500;line-height:20px;color:var(--ink);white-space:normal;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.krow .kw{font-size:12px;font-weight:500;color:var(--muted)}
.krow .r2{margin-top:var(--s2);align-items:baseline}
.krow .flow-v{font-size:13px;font-weight:400;color:var(--muted);white-space:normal}
.krow .flow-v b{font-weight:500;color:var(--ink)}
.krow .ach{font-size:14px;font-weight:600;color:var(--ink)}
.krow .ach.good{color:var(--good)}
.krow .ach.warn{color:var(--warn)}
.krow .ach.bad{color:var(--bad)}
.krow .ach.none{color:var(--faint);font-weight:400}
.krow .kbar{margin-top:var(--s3)}

/* --- Drawer: 400px, page still visible behind ---------------------------- */
.modal{width:400px;border-radius:0;border-left:1px solid var(--line);box-shadow:var(--e3)}
.scrim{background:rgba(22,22,22,.20)}
.m-h h2{font-size:20px;font-weight:600;line-height:26px;letter-spacing:-.02em}
.m-h .sub{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em}
.kv dt{font-size:12px;font-weight:400;color:var(--muted)}
.kv dd{font-size:13px;font-weight:500;color:var(--ink)}
.kv dd.hi{font-weight:600}
.sect-t{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.m-perf .n,.m-perf .n.good,.m-perf .n.warn,.m-perf .n.bad{font-size:28px;font-weight:600;
  color:var(--ink);letter-spacing:-.028em}
.goal p{font-size:12px;line-height:1.65;color:var(--ink-2)}

.btn{background:var(--ink);border-color:var(--ink);border-radius:var(--r-ctl);font-weight:500}
.btn:hover{background:#000;border-color:#000;opacity:1}
.empty,.hint{font-size:12px;color:var(--muted)}

@media(max-width:760px){
  .anchor{gap:var(--s4)}
  .anchor .ar{width:100%;gap:var(--s5)}
  .modal{width:100%;border-left:none;border-top:1px solid var(--line);
    top:auto;height:86vh;border-radius:var(--r-lg) var(--r-lg) 0 0;
    transform:translateY(100%)}
  .modal.on{transform:none}
}

/* ============================================================================
   MOTION
   ----------------------------------------------------------------------------
   One grammar, used everywhere, so movement means something:

     enter     fade + 8px up
     hover     2px lift, a faint light that follows the cursor
     press     scale 0.98
     reveal    stagger, 40ms apart
     score     count up, once, on arrival
     progress  width
     nav       one indicator that slides between teams
     drawer    translate X + fade

   Motion is ranked. Hover is almost invisible; selection and the drawer are
   noticeable; the flowchart entrance and the score reveal are focal — and no
   two focal animations ever run at once. Everything stops under
   prefers-reduced-motion.
   ============================================================================ */

/* --- Enter ---------------------------------------------------------------- */
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes drawLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dropLine{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* Every entrance rule sits behind .mo, which scripting adds on boot. An
   animation must never be the thing that makes content visible: if scripting
   is blocked, or the animation never runs, the finished state is what renders
   rather than an empty page. */
.mo .page-t,.mo .page-s,.mo .anchor{animation:riseIn 260ms var(--ease) both}
.mo .page-s{animation-delay:40ms}
.mo .anchor{animation-delay:80ms}

/* The chart assembles from the top down: lead, then the connectors it owns,
   then the people hanging off them. The order is the hierarchy. */
.mo .flow .lvl > .node{animation:riseIn 300ms var(--ease) both;animation-delay:200ms}
.mo .flow .drop{transform-origin:top center;animation:dropLine 220ms var(--ease) both;
  animation-delay:330ms}
.mo .flow .branch .arm::before{transform-origin:center;animation:drawLine 300ms var(--ease) both;
  animation-delay:400ms}
.mo .flow .branch .arm .stem{transform-origin:top center;animation:dropLine 200ms var(--ease) both;
  animation-delay:520ms}
.mo .flow .branch .arm > .node,.mo .flow .branch .arm > .gnode{
  animation:riseIn 320ms var(--ease) both;animation-delay:560ms}
.mo .flow .branch .arm:nth-child(2) > .node,.mo .flow .branch .arm:nth-child(2) > .gnode{animation-delay:600ms}
.mo .flow .branch .arm:nth-child(3) > .node,.mo .flow .branch .arm:nth-child(3) > .gnode{animation-delay:640ms}
.mo .flow .branch .arm:nth-child(4) > .node,.mo .flow .branch .arm:nth-child(4) > .gnode{animation-delay:680ms}
.mo .flow .branch .arm:nth-child(5) > .node,.mo .flow .branch .arm:nth-child(5) > .gnode{animation-delay:720ms}
.mo .flow .branch .arm:nth-child(n+6) > .node{animation-delay:760ms}

/* Team cards on the landing screen arrive in reading order. */
.mo .tgrid .tcard{animation:riseIn 280ms var(--ease) both}
.mo .tgrid .tcard:nth-child(2){animation-delay:50ms}
.mo .tgrid .tcard:nth-child(3){animation-delay:100ms}
.mo .tgrid .tcard:nth-child(4){animation-delay:150ms}
.mo .tgrid .tcard:nth-child(5){animation-delay:200ms}

/* --- Hover: a 2px lift and a light that notices the cursor ----------------
   Held at 6% so it reads as the surface catching light, not as a glow. */
.node,.gnode,.tcard{position:relative;isolation:isolate;
  transition:transform var(--d1) var(--ease),border-color var(--d1) var(--ease),
             box-shadow var(--d1) var(--ease)}
.node::after,.gnode::after,.tcard::after{content:"";position:absolute;inset:0;z-index:-1;
  border-radius:inherit;pointer-events:none;opacity:0;transition:opacity 200ms var(--ease);
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),
             rgba(22,22,22,.06),transparent 60%);display:block}
.node:hover,.gnode:hover,.tcard:hover{transform:translateY(-2px)}
.node:hover::after,.gnode:hover::after,.tcard:hover::after{opacity:1}
.node:active,.gnode:active,.tcard:active{transform:scale(.985);transition-duration:80ms}

/* --- KPI rows stay calm: no lift, the bar simply gains presence ----------- */
.krow{transition:background var(--d1) var(--ease)}
.krow .kbar{transition:height var(--d1) var(--ease),opacity var(--d1) var(--ease);opacity:.7}
.krow:hover .kbar{opacity:1;height:6px}
.krow:active{transform:none}

/* --- Navigation: one indicator, and it slides ---------------------------- */
.teams{position:relative}
.teams .slider{position:absolute;bottom:0;height:1.5px;background:var(--ink);border-radius:2px;
  transition:transform 200ms var(--ease),width 200ms var(--ease);pointer-events:none;
  transform-origin:left center;left:0;opacity:0}
.teams .slider.on{opacity:1}
.tb.on::after{display:none}

/* --- KRA sections reveal as they are reached ----------------------------- */
.kra-h,.krow{opacity:1}
.reveal{opacity:0;transform:translateY(8px)}
.reveal.in{opacity:1;transform:none;
  transition:opacity 320ms var(--ease),transform 320ms var(--ease)}

/* --- The score, once ------------------------------------------------------
   A single ring pulse when a score first lands. It says "this has loaded" and
   then never repeats. */
@keyframes pulseOnce{0%{box-shadow:0 0 0 0 rgba(22,22,22,.14)}
  70%{box-shadow:0 0 0 6px rgba(22,22,22,0)}100%{box-shadow:0 0 0 0 rgba(22,22,22,0)}}
.mo .ring{animation:pulseOnce 900ms var(--ease) 360ms both;border-radius:50%}

/* --- Drawer --------------------------------------------------------------- */
.modal{transition:transform 240ms var(--ease)}
.mo .modal .m-b,.mo .modal .m-h{animation:riseIn 260ms var(--ease) both;animation-delay:80ms}
.scrim{transition:opacity 240ms var(--ease)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .reveal{opacity:1!important;transform:none!important}
  .teams .slider{transition:none!important}
}

/* ============================================================================
   PREMIUM — depth, colour, and a face for every card
   ----------------------------------------------------------------------------
   The reference dashboard earns its richness with three devices, and only
   three: a saturated gradient tile that gives each card a face, real elevation
   so cards float rather than sit in a grid of boxes, and colour used at full
   strength in small, deliberate places.

   All three are adopted here. The gradients are Recykal's own four brand hues
   rather than the reference's magenta, so the product gains the richness
   without borrowing another company's identity.

   Structure, flow and every function are untouched: this layer only changes
   how the existing pieces look.
   ============================================================================ */

:root{
  /* The four brand hues, each as a two-stop gradient. One per team, assigned
     by position, so a team is recognisable by its colour before its name is
     read. */
  --g1:linear-gradient(135deg,#005DFF,#4D8BFF);
  --g2:linear-gradient(135deg,#1DC797,#4ADFB4);
  --g3:linear-gradient(135deg,#8460D4,#A98BE8);
  --g4:linear-gradient(135deg,#567DE8,#7FA0F2);
  --g5:linear-gradient(135deg,#F2994A,#F7BE7E);
  --gd:linear-gradient(135deg,#2E3138,#4A4E57);

  /* Elevation returns. Two shadows per level: a tight one that defines the
     edge, a wide soft one that lifts it off the page. */
  --el1:0 2px 4px rgba(22,22,26,.05),0 6px 16px -6px rgba(22,22,26,.10);
  --el2:0 4px 10px rgba(22,22,26,.06),0 16px 34px -12px rgba(22,22,26,.16);
  --el3:0 8px 20px rgba(22,22,26,.08),0 32px 64px -20px rgba(22,22,26,.26);
  /* A tinted shadow under a coloured tile reads as that colour's own light. */
  --elc:0 6px 16px -4px rgba(0,93,255,.36);

  --bg:#F4F5F7;
  --line:#E9EAEE;
  /* Both greys darkened to clear AA against every surface they sit on. */
  --muted:#63636C;
  --faint:#70707A;
}

body{background:var(--bg)}

/* --- Header: lifted off the page ----------------------------------------- */
.top{background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(22,22,26,.04)}

/* --- The gradient tile ---------------------------------------------------
   The reference's signature: a rounded square of saturated colour carrying a
   single white glyph, sitting slightly proud of the card it belongs to. It is
   what makes a card look designed rather than drawn. */
.gt-tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  flex:0 0 auto;background:var(--g1);box-shadow:var(--elc);position:relative}
.gt-tile svg{width:24px;height:24px;display:block}
.gt-tile[data-g="2"]{background:var(--g2);box-shadow:0 6px 16px -4px rgba(29,199,151,.40)}
.gt-tile[data-g="3"]{background:var(--g3);box-shadow:0 6px 16px -4px rgba(132,96,212,.38)}
.gt-tile[data-g="4"]{background:var(--g4);box-shadow:0 6px 16px -4px rgba(86,125,232,.38)}
.gt-tile[data-g="5"]{background:var(--g5);box-shadow:0 6px 16px -4px rgba(242,153,74,.38)}

/* --- Team cards ----------------------------------------------------------
   Restructured around the tile: face, then name, then the score as the largest
   thing on the card, then a sparkline that gives the number a direction. */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:20px}
.tcard{background:var(--card);border:1px solid transparent;border-radius:18px;
  padding:20px;box-shadow:var(--el1);display:flex;flex-direction:column;gap:14px;
  align-items:stretch;text-align:left;height:auto;width:auto;position:relative;overflow:hidden;
  transition:transform var(--d1) var(--ease),box-shadow var(--d2) var(--ease)}
.tcard:hover{box-shadow:var(--el2);transform:translateY(-3px);border-color:transparent}
.tcard::after{display:none}
.tcard .th{display:flex;align-items:flex-start;gap:14px}
.tcard .tt{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink);
  text-transform:none;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;height:39px}
.tcard .tm{font-size:12px;color:var(--muted);font-weight:400;margin-top:3px;height:auto;
  white-space:normal;letter-spacing:0;text-transform:none}
.tcard .tv{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  border-top:1px solid var(--line);padding-top:13px;margin-top:auto}
.tcard .tv .l{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint)}
.tcard .tv .v{font-size:26px;font-weight:700;letter-spacing:-.035em;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1}
.tcard .tv .v em{font-size:12px;font-weight:500;color:var(--faint);letter-spacing:0}

/* The sparkline: six months of shape behind one number. Decorative in the
   strict sense — the figure is always stated in text beside it. */
.spark{display:block;width:100%;height:34px;margin-top:-2px}
.spark path.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark path.fl{stroke:none;opacity:.13}

/* --- Flow nodes: a coloured face and real lift --------------------------- */
.node,.gnode{border-radius:16px;box-shadow:var(--el1);border:1px solid transparent;
  background:var(--card)}
.node:hover,.gnode:hover{box-shadow:var(--el2);border-color:transparent}
.node::after,.gnode::after{display:none}
.node.lead{box-shadow:var(--el2)}
.node.lead::before{display:none}

/* Initials on a gradient. The lead's is the dark plane so the top of the chart
   is unmistakable; everyone else takes a brand hue by position. */
.node .av{background:var(--g4);color:#fff;font-weight:600;font-size:11px;
  box-shadow:0 3px 8px -2px rgba(86,125,232,.44);border-radius:12px}
.node[data-a="1"] .av{background:var(--g1);box-shadow:0 3px 8px -2px rgba(0,93,255,.40)}
.node[data-a="2"] .av{background:var(--g2);box-shadow:0 3px 8px -2px rgba(29,199,151,.40)}
.node[data-a="3"] .av{background:var(--g3);box-shadow:0 3px 8px -2px rgba(132,96,212,.40)}
.node[data-a="4"] .av{background:var(--g5);box-shadow:0 3px 8px -2px rgba(242,153,74,.40)}
.node.lead .av{background:var(--gd);box-shadow:0 3px 8px -2px rgba(46,49,56,.34)}

/* Uniform width, lead included: a single left edge down the chart is what
   makes six cards read as one structure. */
.node.lead{width:var(--nodew)}

.gnode{background:linear-gradient(180deg,#FFFFFF,#F7F8FA)}
.gnode .gc{width:22px;height:22px;border-radius:8px;background:var(--surface);
  display:grid;place-items:center;font-size:13px;color:var(--ink-2);line-height:1}
.gnode.open .gc{background:var(--g1);color:#fff}

/* --- Bars: colour at full strength, which is the one place it belongs ---- */
.pb{height:6px;border-radius:999px;background:#EDEEF2;overflow:hidden}
.pb i{border-radius:999px;transition:width 500ms var(--ease)}
.pb i.good{background:linear-gradient(90deg,#1DC797,#3FD9AC)}
.pb i.warn{background:linear-gradient(90deg,#E9A23B,#F2BE6B)}
.pb i.bad{background:linear-gradient(90deg,#DE6B5E,#EC8E82)}
.pb i.none{background:#D3D5DC}
.pb u{background:rgba(255,255,255,.85);width:1px}
.kbar{height:6px;border-radius:999px;background:#EDEEF2;overflow:hidden}
.kbar i{border-radius:999px}
.kbar i.good{background:linear-gradient(90deg,#1DC797,#3FD9AC)}
.kbar i.warn{background:linear-gradient(90deg,#E9A23B,#F2BE6B)}
.kbar i.bad{background:linear-gradient(90deg,#DE6B5E,#EC8E82)}
.kbar i.none{background:#D3D5DC}
.krow:hover .kbar{height:6px}

/* --- The profile anchor: the one full-bleed gradient in the product ------ */
.anchor{background:var(--g1);border:none;border-radius:20px;color:#fff;padding:24px 26px;
  box-shadow:0 10px 28px -10px rgba(0,93,255,.45);position:relative;overflow:hidden}
.anchor::before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;
  border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.anchor::after{content:"";position:absolute;right:40px;bottom:-110px;width:190px;height:190px;
  border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.anchor > *{position:relative;z-index:1}
.anchor .al{color:rgba(255,255,255,.72)}
.anchor .av{color:#fff}
.anchor .av em{color:rgba(255,255,255,.62)}
.anchor .as{color:rgba(255,255,255,.80)}
.anchor .ai .l{color:rgba(255,255,255,.66)}
.anchor .ai .v{color:#fff}
.anchor .ring .fg{stroke:#fff}
.anchor .ring .bg{stroke:rgba(255,255,255,.26)}
.anchor .ring .lbl,.anchor .ring .lbl b{color:#fff}

/* --- KPI rows: taller, so the three lines can breathe -------------------- */
.krow{padding:16px 18px;border-radius:14px;min-height:92px;border-bottom:1px solid var(--line)}
.krow:hover{background:#fff;box-shadow:var(--el1);border-color:transparent}
.krow .r2{margin-top:7px}
.krow .kbar{margin-top:12px}

/* --- Cards and panels ---------------------------------------------------- */
.card,.panel,.pstat{background:var(--card);border:1px solid transparent;border-radius:18px;
  box-shadow:var(--el1)}

/* --- Drawer: gradient head, floating sheet ------------------------------- */
.modal{border-radius:20px 0 0 20px;box-shadow:var(--el3);border-left:none}
.m-h{background:var(--g1);color:#fff;padding:22px 24px;border-bottom:none;
  border-radius:20px 0 0 0}
.m-h h2{color:#fff}
.m-h .sub{color:rgba(255,255,255,.74)}
.m-h .x{color:rgba(255,255,255,.86);width:32px;height:32px;border-radius:10px;
  display:grid;place-items:center;padding:0;font-size:18px;
  background:rgba(255,255,255,.14)}
.m-h .x:hover{background:rgba(255,255,255,.26);color:#fff}
.m-b{padding-top:20px}

/* --- Controls ------------------------------------------------------------ */
.sel{border-radius:10px;border:1px solid var(--line);background:#fff;
  box-shadow:0 1px 2px rgba(22,22,26,.04);font-weight:500}
.sel:hover{border-color:#D3D5DC}
.btn{background:var(--g1);border:none;color:#fff;border-radius:10px;
  box-shadow:var(--elc);font-weight:600}
.btn:hover{box-shadow:0 8px 20px -4px rgba(0,93,255,.46);transform:translateY(-1px)}
.back{min-height:32px;align-items:center}

/* Team tabs become pills, which is what the sliding indicator wanted all along */
.tb{border-radius:999px;padding:7px 14px;font-weight:500;transition:all var(--d1) var(--ease)}
.tb:hover{background:rgba(0,93,255,.06);color:var(--brand)}
.tb.on{color:#fff}
.teams .slider{height:100%;top:0;bottom:auto;background:var(--g1);border-radius:999px;
  z-index:0;box-shadow:0 3px 10px -2px rgba(0,93,255,.44)}
.teams .tb{position:relative;z-index:1}

/* --- Status dots regain their colour ------------------------------------- */
.dot.good{background:#1DC797}
.dot.warn{background:#E9A23B}
.dot.bad{background:#DE6B5E}
.dot.none{background:#C9CBD2}

/* --- Section heads ------------------------------------------------------- */
.kra-h .t{color:var(--ink);font-weight:600}
.kra-h .ix{background:var(--surface);border-radius:7px;padding:2px 7px;color:var(--ink-2);
  font-weight:600}

/* --- Type scale: the two half-pixel sizes rejoin the scale --------------- */
.tcard .tt{font-size:15px}
.mark .wm b{font-size:10px}

@media(max-width:640px){
  .tgrid{grid-template-columns:1fr}
  .modal{border-radius:20px 20px 0 0}
  .m-h{border-radius:20px 20px 0 0}
}

@media(prefers-reduced-motion:reduce){
  .tcard:hover,.btn:hover{transform:none}
  .pb i{transition:none}
}

/* ============================================================================
   AUDIT FIXES
   ============================================================================ */

/* .kbar is a <span>. Without an explicit display it stays inline, which gives
   it no width and no height - the KPI bars were rendering as nothing. */
.kbar{display:block;width:100%}
.kbar i{display:block;height:100%}
.pb{display:block}
.pb i{display:block;height:100%}

/* KPI rows become their own white cards, so the list reads as a stack of
   objects rather than text sitting loose on the page background. */
.krow{background:var(--card);box-shadow:var(--el1);border:1px solid transparent;
  border-bottom:1px solid transparent;margin-bottom:10px;border-radius:14px}
.krow:last-child{border-bottom:1px solid transparent}
.krow:hover{background:#fff;box-shadow:var(--el2);border-color:transparent;
  transform:translateY(-1px)}

/* The anchor's supporting labels were below AA on the blue. */
.anchor .al{color:rgba(255,255,255,.86)}
.anchor .as{color:rgba(255,255,255,.92)}
.anchor .ai .l{color:rgba(255,255,255,.86)}
.anchor .av em{color:rgba(255,255,255,.78)}
.anchor .ring{margin-left:8px}
.anchor .ring .lbl{display:grid;place-items:center;color:#fff}
.anchor .ring .lbl b{color:#fff;font-size:17px;font-weight:600;letter-spacing:-.02em}

/* The ring reads as a gauge, so it needs weight and a track that is visible
   against the gradient behind it. */
.anchor .ring .fg{stroke:#fff;stroke-width:6}
.anchor .ring .tr{stroke:rgba(255,255,255,.28);stroke-width:6}

/* Section heads sit above their cards rather than on the same plane. */
.kra-h{margin:26px 0 12px}
.kra-h:first-of-type{margin-top:20px}
.kra-h .r{color:var(--muted)}

/* Tap targets reach the 24px minimum on touch. */
.back{min-height:32px;display:inline-flex}
.mark{min-height:36px;display:inline-flex;align-items:center}

/* ============================================================================
   AVATAR CONTRAST
   ----------------------------------------------------------------------------
   The tile gradients are tuned for a white stroke icon, which only has to
   reach 3:1. Initials are text and have to reach 4.5:1, and the lighter hues
   did not: white on the mid green measured 2.2:1.

   So avatars get their own darker set of the same four hues. The family still
   reads as one palette; each member is simply deep enough to carry type.
   ============================================================================ */
.node .av{background:linear-gradient(135deg,#2F4FB8,#3B5FCC);
  box-shadow:0 3px 8px -2px rgba(59,95,204,.42)}
.node[data-a="1"] .av{background:linear-gradient(135deg,#0047C4,#005DFF);
  box-shadow:0 3px 8px -2px rgba(0,71,196,.42)}
.node[data-a="2"] .av{background:linear-gradient(135deg,#0B6B50,#0E7A5B);
  box-shadow:0 3px 8px -2px rgba(14,122,91,.42)}
.node[data-a="3"] .av{background:linear-gradient(135deg,#5C3CB0,#6B47C0);

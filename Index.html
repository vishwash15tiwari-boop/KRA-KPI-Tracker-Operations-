<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRA / KPI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   KRA / KPI Tracker — premium enterprise scorecard.
   Left rail · top context bar · white canvas · right-side detail drawer.
   Journey: Team → Flowchart → Employee → KRA/KPI → KPI detail.
   Every element earns its place by defining, assigning, tracking, evaluating or
   reviewing a KRA/KPI. Nothing else is on screen.
   ============================================================================ */
:root{
  --font:'Inter','Inter var',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  /* Deep navy rail with a subtle vertical fall; cool-slate neutrals biased to the brand blue. */
  --nav:#0B1424;--nav-top:#132239;--nav-2:#18273f;--nav-line:rgba(255,255,255,.07);
  --nav-txt:#8393ac;--nav-active:#FFFFFF;--nav-accent:#4d8bff;
  /* On-navy text tiers (rail hover + navy summary card). */
  --nav-hi:#C9D5E8;--nav-txt-2:#A1B2CA;--nav-muted:#8A9AB2;--nav-faint:#70839f;
  --bg:#EDF0F6;--bg-2:#F6F8FC;--card:#FFFFFF;--surface:#ECF0F8;--well:#DFE6F1;
  --ink:#0F1826;--ink-2:#38465A;--muted:#59647B;--faint:#96A2B6;
  --line:#E5E9F1;--line-2:#D3DBE8;--line-soft:#EEF1F8;
  --accent:#005DFF;--accent-2:#0047CC;--accent-soft:#E9F0FF;--accent-glow:rgba(0,93,255,.16);
  --good:#0F8A5C;--good-soft:#E6F4EC;--warn:#B27411;--warn-soft:#FBF0DB;--bad:#D93A31;--bad-soft:#FCEBE9;
  --warn-line:#EAD8B4;--warn-line-2:#DFC48E;
  --fs-xxl:27px;--fs-xl:19px;--fs-lg:15px;--fs-md:14px;--fs-sm:13px;--fs-xs:12px;--fs-2xs:11px;--fs-3xs:10px;
  /* Bolder baseline across the board: normal text is medium, everything steps up. */
  --fw-n:500;--fw-m:600;--fw-b:700;--fw-h:800;
  --r-ctl:8px;--r-card:12px;--r-pill:999px;
  --s1:4px;--s2:7px;--s3:11px;--s4:14px;--s5:18px;--s6:24px;--s7:26px;--s8:34px;
  --ease:cubic-bezier(.2,.6,.35,1);--ease-out:cubic-bezier(.16,1,.3,1);--d1:150ms;--d2:240ms;--rail:78px;--maxw:1180px;
  --shadow-1:0 1px 2px rgba(15,24,40,.05),0 1px 1px rgba(15,24,40,.03);
  --shadow-2:0 2px 5px -1px rgba(15,24,40,.07),0 14px 30px -10px rgba(15,24,40,.16);
  --shadow-3:0 36px 70px -26px rgba(9,18,36,.44),0 6px 16px -8px rgba(9,18,36,.2);
  --ring:0 0 0 3px var(--accent-glow);
  --hair:inset 0 0 0 1px rgba(15,24,40,.035);
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);
  background-image:linear-gradient(180deg,var(--bg-2),var(--bg) 380px);background-attachment:fixed;
  color:var(--ink);font-size:var(--fs-sm);font-weight:var(--fw-n);line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:'tnum' 1,'cv05' 1,'cv11' 1,'ss03' 1;font-optical-sizing:auto;letter-spacing:-.011em}
button,select,input{font-family:inherit;cursor:pointer}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-ctl)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}

/* Summary cards — headline numbers, crafted with depth (summary before detail). */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4);margin-bottom:var(--s6)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s5);
  box-shadow:var(--shadow-1),var(--hair);position:relative;overflow:hidden;
  transition:box-shadow var(--d2) var(--ease-out),transform var(--d2) var(--ease-out),border-color var(--d1) var(--ease)}
.card::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent)}
.card:hover{border-color:var(--line-2)}
.card .l{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.card .v{font-size:var(--fs-xxl);font-weight:var(--fw-h);letter-spacing:-.035em;line-height:1.02;margin-top:10px;font-variant-numeric:tabular-nums}
.card .v em{font-style:normal;font-size:var(--fs-lg);color:var(--faint);font-weight:var(--fw-b);letter-spacing:-.01em}
.card .s{font-size:var(--fs-xs);color:var(--muted);margin-top:8px}
.card.hl{background:radial-gradient(135% 150% at 100% 0,#1c3559 0,var(--nav) 56%);border-color:#0b1424;color:#fff;
  box-shadow:var(--shadow-2),inset 0 1px 0 rgba(255,255,255,.06)}
.card.hl::after{background:linear-gradient(90deg,transparent,rgba(77,139,255,.55),transparent)}
.card.hl::before{content:"";position:absolute;right:-46px;top:-46px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(77,139,255,.3),transparent 70%);pointer-events:none}
.card.hl .l{color:var(--nav-txt-2)}.card.hl .v{color:#fff}.card.hl .v em{color:var(--nav-faint)}.card.hl .s{color:var(--nav-hi)}
@media(max-width:1080px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.cards{grid-template-columns:1fr}.card .v{font-size:var(--fs-xl)}}

/* ============================== SHELL ==================================== */
.app{display:flex;min-height:100vh}

/* Left rail — icon + small label, ~76px, never visually dominant. */
.rail{flex:0 0 var(--rail);width:var(--rail);background:linear-gradient(180deg,var(--nav-top),var(--nav) 42%);
  position:sticky;top:0;height:100vh;box-shadow:1px 0 0 rgba(15,24,40,.06),inset -1px 0 0 rgba(255,255,255,.03);
  display:flex;flex-direction:column;align-items:stretch;padding:var(--s4) 0;z-index:40}
.rail-logo{display:flex;align-items:center;justify-content:center;height:40px;margin-bottom:var(--s5)}
/* The mark is the official artwork: black with an alpha channel. brightness(0)
   flattens it to pure black whatever it started as, and invert(1) takes that to
   white, leaving the alpha alone - so the navy rail needs no second file, and
   dropping the filter would put it back to black on a light ground. Height is
   what is fixed; width follows the artwork's own ratio. */
.rail-logo img{height:26px;width:auto;display:block;filter:brightness(0) invert(1)}
.rail-nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.rail-i{appearance:none;border:none;background:transparent;color:var(--nav-txt);
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:10px;
  font-size:var(--fs-3xs);font-weight:var(--fw-m);letter-spacing:.01em;position:relative;
  transition:color var(--d1) var(--ease),background var(--d1) var(--ease)}
.rail-i svg{width:20px;height:20px;stroke-width:1.7}
.rail-i{transition:color var(--d1) var(--ease),background var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.rail-i:hover{color:var(--nav-hi);background:rgba(255,255,255,.045)}
.rail-i.on{color:var(--nav-active);background:linear-gradient(180deg,rgba(77,139,255,.18),rgba(77,139,255,.08));
  box-shadow:inset 0 0 0 1px rgba(77,139,255,.22)}
.rail-i:focus-visible{outline-color:var(--nav-accent)}
.rail-i.on::before{content:"";position:absolute;left:-8px;top:11px;bottom:11px;width:3px;
  border-radius:0 3px 3px 0;background:var(--nav-accent);box-shadow:0 0 10px 0 rgba(77,139,255,.6)}
.rail-sp{flex:1}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* Top context bar — team, month, then who you are. Compact. */
.tbar{position:sticky;top:0;z-index:30;background:rgba(240,243,249,.78);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:0 var(--s6);height:52px;display:flex;align-items:center;gap:var(--s3)}
.tbar .grow{flex:1}
.fld{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-2xs);color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;font-weight:var(--fw-m)}
.sel{border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-size:var(--fs-sm);
  font-weight:var(--fw-m);padding:7px 10px;border-radius:var(--r-ctl);max-width:230px;box-shadow:var(--shadow-1);
  transition:border-color var(--d1) var(--ease)}
.sel:hover{border-color:var(--line-2)}.sel:focus-visible{border-color:var(--accent)}
.sel:disabled{color:var(--faint);background:var(--surface)}
.greet{display:flex;align-items:center;gap:10px}
.greet .who{text-align:right;line-height:1.25}
.greet .who b{display:block;font-size:var(--fs-sm);font-weight:var(--fw-b)}
.greet .who span{font-size:var(--fs-2xs);color:var(--muted)}

.canvas{flex:1;min-height:0;overflow-y:auto}
.wrap{max-width:var(--maxw);margin:0 auto;padding:var(--s6) var(--s6) var(--s8)}

/* ============================== PRIMITIVES =============================== */
.avatar{flex:0 0 auto;border-radius:var(--r-pill);background:linear-gradient(140deg,#EAF1FF,#D9E7FF);color:var(--accent-2);
  box-shadow:inset 0 0 0 1px rgba(0,93,255,.1),0 1px 2px rgba(0,93,255,.08);
  display:grid;place-items:center;font-weight:var(--fw-h);letter-spacing:-.02em;
  width:30px;height:30px;font-size:var(--fs-2xs)}
.avatar.lg{width:48px;height:48px;font-size:var(--fs-md)}
.avatar.xl{width:42px;height:42px;font-size:var(--fs-sm)}

.page-h{display:flex;align-items:flex-start;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s6)}
.page-h h1{font-size:var(--fs-xl);font-weight:var(--fw-b);letter-spacing:-.02em;margin:0;line-height:1.2}
.page-h .kind{font-size:var(--fs-sm);color:var(--muted);margin-top:3px}
.page-h .r{margin-left:auto}
.back{border:none;background:none;color:var(--muted);font-size:var(--fs-xs);font-weight:var(--fw-m);
  padding:6px 8px;margin-left:-8px;display:inline-flex;align-items:center;gap:6px;margin-bottom:var(--s2)}
.back:hover{color:var(--ink)}

.sect{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--muted);text-transform:uppercase;
  letter-spacing:.07em;margin:0 0 var(--s3);display:flex;align-items:baseline;gap:var(--s2)}
.sect .r{margin-left:auto;font-weight:var(--fw-n);letter-spacing:0;text-transform:none;font-size:var(--fs-xs)}
.block{margin-bottom:var(--s7)}


/* KRA-wise bars — name left, bar centre, score right; one rhythm. */
.kbars{display:flex;flex-direction:column}
.kbar{display:grid;grid-template-columns:minmax(120px,1.1fr) 2.4fr auto;align-items:center;
  gap:var(--s4);padding:9px 0;border-bottom:1px solid var(--line-soft)}
.kbar:last-child{border-bottom:none}
.kbar .kn{font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbar .kn small{color:var(--muted);font-weight:var(--fw-n);margin-left:6px}
.kbar .tr{position:relative;height:6px;background:var(--well);border-radius:var(--r-pill)}
.kbar .tr i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);background:var(--accent);
  transform-origin:left;animation:grow .5s var(--ease) backwards}
.kbar .tr i.good{background:var(--good)}.kbar .tr i.warn{background:var(--warn)}.kbar .tr i.bad{background:var(--bad)}
.kbar .tr u{position:absolute;top:-2px;height:10px;width:1px;background:var(--line-2)}
.kbar .kv{font-weight:var(--fw-b);text-align:right;min-width:52px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* Ranking — derived from overall score, subtle top marker. */
.rank{display:flex;flex-direction:column}
.rrow{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s2);border-radius:var(--r-ctl);
  border-bottom:1px solid var(--line-soft);transition:background var(--d1) var(--ease)}
.rrow:last-child{border-bottom:none}
.rrow.click{cursor:pointer}.rrow.click:hover{background:var(--surface)}
.rrow .pos{flex:0 0 22px;text-align:center;font-size:var(--fs-xs);font-weight:var(--fw-b);color:var(--muted);
  font-variant-numeric:tabular-nums}
.rrow.top .pos{color:var(--accent)}
.rrow .nm{flex:1;min-width:0}
.rrow .nm b{display:block;font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm span{font-size:var(--fs-xs);color:var(--muted)}
.rrow .mt{width:96px;flex:0 0 96px}
.rrow .sc{font-weight:var(--fw-b);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.rrow .chev{color:var(--faint);flex:0 0 12px;text-align:center}
.rrow.click:hover .chev{color:var(--muted)}
.microbar{position:relative;height:5px;background:var(--well);border-radius:var(--r-pill)}
.microbar i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);background:var(--accent);opacity:.85}

/* ============================== FLOWCHART ================================ */
.flow{display:flex;flex-direction:column;align-items:center}
.flow-stem{width:1px;height:24px;background:var(--line-2)}
.flow-bus{width:100%;height:1px;background:var(--line-2)}
.flow-kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:var(--s4);width:100%;
  padding-top:var(--s5)}
.node{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-card);padding:var(--s4);
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;box-shadow:var(--shadow-1),var(--hair);
  cursor:pointer;transition:border-color var(--d1) var(--ease),box-shadow var(--d2) var(--ease-out),transform var(--d2) var(--ease-out);
  animation:rise .42s var(--ease) backwards}
.node:hover{border-color:var(--accent-soft);box-shadow:var(--shadow-2),var(--hair);transform:translateY(-3px)}
.node.lead{border-color:transparent;box-shadow:0 0 0 1.5px var(--accent),0 0 0 5px var(--accent-soft),var(--shadow-2);
  min-width:212px;padding:var(--s5)}
.node .avatar{margin-bottom:6px}
.node .nn{font-weight:var(--fw-b);letter-spacing:-.015em}
.node .nd{font-size:var(--fs-xs);color:var(--muted);line-height:1.35}
.node .ns{margin-top:7px;font-size:var(--fs-xl);font-weight:var(--fw-h);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.node .ns em{font-style:normal;font-size:var(--fs-xs);color:var(--faint);font-weight:var(--fw-m)}
.node .tag{margin-top:5px;font-size:var(--fs-3xs);font-weight:var(--fw-b);letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent-2);background:var(--accent-soft);padding:2px 8px;border-radius:var(--r-pill)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================== TABLE =================================== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  overflow:hidden;box-shadow:var(--shadow-1),var(--hair)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:640px;font-size:var(--fs-sm)}
th{text-align:left;font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;padding:12px var(--s3);border-bottom:1px solid var(--line-2);white-space:nowrap;
  background:linear-gradient(180deg,#fff,var(--surface))}
td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line-soft);vertical-align:middle;height:44px;overflow:hidden}
tbody tr:last-child td{border-bottom:none}
.quiet{color:var(--muted);font-weight:var(--fw-n)}
.strong{font-weight:var(--fw-b)}
.nm{font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;font-size:var(--fs-2xs);color:var(--muted);font-weight:var(--fw-n);
  text-transform:none;letter-spacing:0}
tr.click{cursor:pointer;transition:background var(--d1) var(--ease)}
tr.click:hover{background:var(--surface)}

/* KRA band: a rule with the KRA name and its rolled-up score. */
tr.kra td{padding:var(--s4) var(--s3) 10px;border-bottom:1px solid var(--line-2);font-size:var(--fs-2xs);
  font-weight:var(--fw-b);color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em;cursor:pointer;
  background:var(--card)}
tr.kra:first-child td{padding-top:var(--s3)}
tr.kra .cv{display:inline-block;width:14px;color:var(--faint);font-weight:var(--fw-n)}
tr.kra .rs{float:right;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:var(--fw-m);
  font-variant-numeric:tabular-nums}
tr.kra .rs b{color:var(--ink);font-weight:var(--fw-b)}
td.kpi{padding-left:var(--s6)}
/* The click/keyboard affordance lives in a real <button> inside the cell, not
   on the <tr>, so rows keep their table semantics (cells still map to their
   column headers for assistive tech). The buttons inherit the cell's type. */
.kra-btn{all:unset;display:block;width:100%;box-sizing:border-box;cursor:pointer}
.kra-btn:focus-visible{outline-offset:-2px}
.cellbtn{all:unset;display:block;cursor:pointer;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* Achievement: the % over a fine bar. Bar 60–100px, tick at target. */
.ach{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px;height:30px;
  margin-left:auto;width:96px}
.ach .n{font-variant-numeric:tabular-nums;font-weight:var(--fw-b)}
.bar{display:block;position:relative;width:100%;height:4px;background:var(--well);border-radius:var(--r-pill)}
.bar i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);background:var(--accent);
  transform-origin:left;animation:grow .5s var(--ease) backwards}
.bar i.good{background:var(--good)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.bar u{position:absolute;top:-2px;width:1px;height:8px;background:var(--line-2)}

.st{font-size:var(--fs-xs);font-weight:var(--fw-m);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:var(--r-pill);background:var(--surface)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.st.good{color:var(--good)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}
.st.none{color:var(--muted);font-weight:var(--fw-n)}

.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4);margin-bottom:var(--s7)}
.mstat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s4) var(--s5);box-shadow:var(--shadow-1),var(--hair);
  transition:box-shadow var(--d2) var(--ease-out),transform var(--d2) var(--ease-out)}
.mstat:hover{border-color:var(--line-2)}
.mstat .l{font-size:var(--fs-2xs);font-weight:var(--fw-m);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mstat .v{font-size:var(--fs-xl);font-weight:var(--fw-h);letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.mstat .v em{font-style:normal;font-size:var(--fs-sm);color:var(--faint);font-weight:var(--fw-m)}
.mstat .ms-sub{font-size:var(--fs-2xs);color:var(--muted);font-weight:var(--fw-m);margin-top:5px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-sub .up,.pscore .l .up{color:var(--good)}.ms-sub .down,.pscore .l .down{color:var(--bad)}.ms-sub .flat,.pscore .l .flat{color:var(--muted)}

/* Profile header card */
.phead{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s5);box-shadow:var(--shadow-1);
  margin-bottom:var(--s6)}
.phead .id h1{font-size:var(--fs-xl);font-weight:var(--fw-b);letter-spacing:-.02em;margin:0;line-height:1.2}
.phead .id .meta{color:var(--muted);font-size:var(--fs-sm);margin-top:3px}
.phead .id .meta .dot{color:var(--faint);margin:0 6px}
.phead .badge{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-2xs);font-weight:var(--fw-m);
  color:var(--good);background:var(--good-soft);padding:3px 9px;border-radius:var(--r-pill);margin-top:8px}
.phead .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.phead .pscore{margin-left:auto;text-align:right}
.phead .pscore .v{font-size:var(--fs-xxl);font-weight:var(--fw-h);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.phead .pscore .v em{font-style:normal;font-size:var(--fs-lg);color:var(--faint);font-weight:var(--fw-m)}
.phead .pscore .l{font-size:var(--fs-2xs);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

.two{display:grid;grid-template-columns:1.5fr 1fr;gap:var(--s5);align-items:start}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s5);box-shadow:var(--shadow-1),var(--hair)}

/* ============================== DRAWER =================================== */
.scrim{position:fixed;inset:0;background:rgba(15,26,46,.34);opacity:0;pointer-events:none;
  transition:opacity var(--d2) var(--ease);z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
/* --sbw is the width of the scrollbar the lock removed, published only while
   the drawer is open. Holding the drawer that far off the right edge keeps it
   exactly where it was drawn as the viewport widens underneath it. */
.drawer{position:fixed;top:0;right:var(--sbw,0px);height:100vh;width:412px;max-width:92vw;background:var(--card);
  box-shadow:var(--shadow-3);transform:translateX(100%);transition:transform var(--d2) var(--ease);
  z-index:51;display:flex;flex-direction:column}
.drawer.on{transform:none}
.d-h{padding:var(--s5) var(--s5) var(--s4);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:var(--s3)}
.d-h .eyebrow{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--accent-2);text-transform:uppercase;letter-spacing:.07em}
.d-h h2{font-size:var(--fs-lg);font-weight:var(--fw-b);margin:5px 0 0;letter-spacing:-.017em;line-height:1.3}
.d-h .x{margin-left:auto;border:1px solid var(--line-2);background:var(--card);color:var(--muted);width:30px;height:30px;
  border-radius:var(--r-ctl);font-size:16px;line-height:1;flex:0 0 auto;display:grid;place-items:center}
.d-h .x:hover{color:var(--ink);border-color:var(--ink)}
/* The drawer scrolls on its own. overscroll-behavior stops that scroll handing
   off to the page when it reaches either end, which is the other way the
   background moves while the drawer is open. */
.d-b{padding:var(--s5);overflow-y:auto;flex:1;overscroll-behavior:contain}
.scrim{overscroll-behavior:contain}
/* Stacked field pairs: label, 4px, value, 24px between pairs. */
.pair{margin-bottom:var(--s5)}
.pair:last-child{margin-bottom:0}
.pair .k{font-size:var(--fs-2xs);font-weight:var(--fw-m);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pair .v{font-size:var(--fs-md);font-weight:var(--fw-m);margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.4;overflow-wrap:anywhere}
.d-meas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r-ctl);overflow:hidden;margin-bottom:var(--s5)}
.d-meas>div{background:var(--card);padding:var(--s3) var(--s4)}
.d-meas .k{font-size:var(--fs-2xs);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.d-meas .v{font-size:var(--fs-lg);font-weight:var(--fw-b);margin-top:4px;font-variant-numeric:tabular-nums}
.d-rule{height:1px;background:var(--line);margin:0 0 var(--s5)}
.d-goal .k{font-size:var(--fs-2xs);font-weight:var(--fw-m);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.d-goal p{margin:6px 0 0;color:var(--ink-2);line-height:1.65;font-size:var(--fs-sm)}
.d-ach{position:relative;height:4px;background:var(--well);border-radius:var(--r-pill);margin-top:8px}
.d-ach i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);
  transform-origin:left;animation:grow .5s var(--ease) backwards}
.d-ach i.good{background:var(--good)}.d-ach i.warn{background:var(--warn)}.d-ach i.bad{background:var(--bad)}
.d-ach u{position:absolute;top:-2px;width:1px;height:8px;background:var(--line-2)}

/* ============================== STATES ================================== */
.state{display:grid;place-items:center;min-height:56vh;text-align:center;padding:var(--s5)}
.state h2{font-size:var(--fs-lg);font-weight:var(--fw-b);margin:0 0 var(--s2)}
.state p{color:var(--muted);margin:0 0 var(--s4);max-width:46ch;line-height:1.65}
.btn{border:1px solid var(--accent-2);background:linear-gradient(180deg,#1a6bff,var(--accent));color:#fff;border-radius:var(--r-ctl);
  padding:9px 16px;font-size:var(--fs-sm);font-weight:var(--fw-b);letter-spacing:-.006em;
  box-shadow:0 1px 2px rgba(0,71,204,.28),inset 0 1px 0 rgba(255,255,255,.22);
  transition:filter var(--d1) var(--ease),box-shadow var(--d1) var(--ease),transform var(--d1) var(--ease)}
.btn:hover{filter:brightness(1.06);box-shadow:0 2px 8px rgba(0,71,204,.32),inset 0 1px 0 rgba(255,255,255,.22)}
.btn:active{transform:translateY(1px)}
.btn.ghost,.btn.sub{background:var(--card);border-color:var(--line-2);color:var(--ink-2);box-shadow:var(--shadow-1)}
.btn.ghost:hover,.btn.sub:hover{border-color:var(--ink);color:var(--ink);filter:none}
.empty{padding:var(--s6);text-align:center;color:var(--muted)}
.hint{font-size:var(--fs-xs);color:var(--muted);margin-top:var(--s4);line-height:1.65}
.skl{background:linear-gradient(90deg,var(--surface),var(--well),var(--surface));background-size:200% 100%;
  border-radius:var(--r-card);animation:sh 1.4s ease-in-out infinite}
@keyframes sh{to{background-position:-200% 0}}
.demo{background:var(--warn-soft);border-bottom:1px solid var(--warn-line)}
.demo .in{max-width:var(--maxw);margin:0 auto;padding:8px var(--s6);display:flex;align-items:center;gap:var(--s2);
  font-size:var(--fs-xs);color:var(--warn)}
.demo button{margin-left:auto;border:1px solid var(--warn-line-2);background:var(--card);color:var(--warn);font-size:var(--fs-2xs);
  font-weight:var(--fw-m);padding:3px 10px;border-radius:var(--r-ctl)}
.demo button:hover{border-color:var(--warn)}

/* ============================== RESPONSIVE ============================== */
@media(max-width:1080px){.mini{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{flex-direction:column}
  .rail{width:100%;height:auto;flex-direction:row;position:sticky;top:0;padding:6px var(--s3);align-items:center;
    gap:var(--s2);overflow-x:auto}
  .rail-logo{margin:0 var(--s2) 0 0;height:auto}
  .rail-nav{flex-direction:row;padding:0;gap:2px;flex:1}
  .rail-i{flex-direction:row;gap:7px;padding:8px 12px;font-size:var(--fs-xs);min-height:44px;justify-content:center}
  .rail-i.on::before{display:none}.rail-sp{display:none}
  .wrap{padding:var(--s5) var(--s4) var(--s7)}.tbar{padding:0 var(--s4);height:auto;flex-wrap:wrap;gap:8px;padding-top:8px;padding-bottom:8px}
}
@media(max-width:560px){
  .mini{grid-template-columns:1fr}
  .page-h .r{margin-left:0;width:100%}
  .greet .who{display:none}
  .card .v{font-size:var(--fs-xl)}
  /* Comfortable tap targets on small screens (~44px). */
  .sel{padding:11px 12px}
  .d-h .x{width:40px;height:40px}
  .demo button{padding:9px 14px}
  .back{padding:10px 8px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============================== DEPTH LAYERS ============================
   Seven additions, none of which is a new screen. They sit inside the profile
   and the drawer that already exist, so the default view stays as sparse as it
   was and the detail appears only where it is asked for. All of it is built
   from the tokens already declared above.
   ========================================================================= */

/* --- Line chart (trend) — tinted line, gradient fill, hover crosshair -----
   Re-render-safe: the crosshair, active dot and value pill are revealed purely
   on :hover of a per-point column, so nothing has to be re-bound after the app
   rewrites the view. The line tints green when the visible range closed up, red
   when it closed down — the same read as a stock line. */
/* --- Column trend — one labelled bar per period, latest emphasised --------
   The clear read for a short monthly series: solid, comparable bars each
   carrying its exact value, past months paler, the current month tinted by the
   trend direction (green up / red down). Each column is a button that opens its
   month. Static markup — no listeners to rebind after a re-render. */
.bt{--c:var(--accent)}
.bt.up{--c:var(--good)}.bt.down{--c:var(--bad)}.bt.flat{--c:var(--accent)}
.bt-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.bt-val{font-size:var(--fs-xxl);font-weight:var(--fw-h);letter-spacing:-.03em;line-height:1;
  color:var(--ink);font-variant-numeric:tabular-nums}
.bt-val em{font-style:normal;font-size:var(--fs-lg);font-weight:var(--fw-b);color:var(--faint);margin-left:1px}
.bt-plot{display:flex;align-items:flex-end;gap:var(--s5);height:172px}
.bt-col{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;
  background:none;border:0;padding:0;font:inherit;color:inherit}
button.bt-col{cursor:pointer}
button.bt-col:focus-visible{outline-offset:3px}
.bt-track{flex:1;width:100%;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:6px}
.bt-cv{font-size:var(--fs-sm);font-weight:var(--fw-b);color:var(--muted);font-variant-numeric:tabular-nums;
  line-height:1;transition:color var(--d1) var(--ease)}
.bt-bar{width:100%;max-width:58px;background:var(--c);opacity:.26;border-radius:7px 7px 2px 2px;
  transition:opacity var(--d1) var(--ease),filter var(--d1) var(--ease);animation:growY .55s var(--ease-out) backwards}
.bt-col.is-now .bt-bar{opacity:1}
.bt-col.is-now .bt-cv{color:var(--c);font-weight:var(--fw-h);font-size:var(--fs-md)}
button.bt-col:hover:not(.is-now) .bt-bar{opacity:.5}
button.bt-col:hover .bt-bar{filter:brightness(1.05) saturate(1.05)}
button.bt-col:hover .bt-cv{color:var(--ink-2)}
button.bt-col:hover.is-now .bt-cv{color:var(--c)}
.bt-cl{font-size:var(--fs-2xs);color:var(--muted);font-weight:var(--fw-m);margin-top:var(--s3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bt-col.is-now .bt-cl{color:var(--ink-2);font-weight:var(--fw-b)}
.tr-empty{font-size:var(--fs-xs);color:var(--muted);background:var(--surface);
  border-radius:var(--r-ctl);padding:var(--s4);line-height:1.55}
.tr-note{font-size:var(--fs-2xs);color:var(--muted);margin:var(--s5) 0 0;line-height:1.55}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);
  white-space:nowrap;border:0;padding:0}

/* --- Change against the previous period ---------------------------------- */
.delta{font-size:var(--fs-xs);font-weight:var(--fw-b);font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r-pill)}
.delta.up{color:var(--good);background:var(--good-soft)}
.delta.down{color:var(--bad);background:var(--bad-soft)}
.delta.flat{color:var(--muted);background:var(--surface)}

/* --- Donut distribution — arc ring, total in the middle, clickable legend - */
.dn{display:flex;align-items:center;gap:var(--s6);flex-wrap:wrap}
.dn-ring{position:relative;flex:0 0 auto;width:168px;height:168px}
.dn-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.dn-track{fill:none;stroke:var(--well);stroke-width:20}
.dn-seg{fill:none;stroke:var(--c);stroke-width:20;stroke-linecap:round;cursor:default;
  transition:stroke-width var(--d2) var(--ease-out),opacity var(--d1) var(--ease)}
.dn-ring:hover .dn-seg{opacity:.38}
.dn-seg:hover{stroke-width:26;opacity:1}
.dn-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dn-c b{font-size:var(--fs-xxl);font-weight:var(--fw-h);letter-spacing:-.03em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.dn-c span{font-size:var(--fs-2xs);color:var(--muted);font-weight:var(--fw-m);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.dn-legend{flex:1 1 190px;min-width:170px;display:flex;flex-direction:column;gap:2px}
.dn-lg{display:flex;align-items:center;gap:var(--s3);width:100%;padding:7px var(--s2);border:0;border-radius:var(--r-ctl);
  background:none;font:inherit;color:inherit;text-align:left;transition:background var(--d1) var(--ease)}
button.dn-lg{cursor:pointer}
button.dn-lg:hover{background:var(--surface)}
.dn-sw{flex:0 0 10px;width:10px;height:10px;border-radius:3px;background:var(--c)}
.dn-ll{flex:1;font-weight:var(--fw-m);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-lv{font-weight:var(--fw-b);font-variant-numeric:tabular-nums;color:var(--ink)}
.dn-lv em{font-style:normal;color:var(--muted);font-weight:var(--fw-m);margin-left:6px;font-size:var(--fs-xs)}

/* --- Vertical comparison bars — value on top, category below -------------- */
.vb{display:flex;align-items:flex-end;gap:var(--s4);height:198px;padding-top:var(--s4)}
.vb-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%;
  background:none;border:0;padding:0;font:inherit;color:inherit}
button.vb-col{cursor:pointer}
.vb-v{font-size:var(--fs-sm);font-weight:var(--fw-b);color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:6px}
.vb-track{flex:1;width:100%;max-width:60px;display:flex;align-items:flex-end;background:var(--well);
  border-radius:6px 6px 0 0;overflow:hidden}
.vb-track i{width:100%;background:var(--c);border-radius:6px 6px 0 0;
  transition:filter var(--d1) var(--ease);animation:growY .55s var(--ease) backwards}
button.vb-col:hover .vb-track i{filter:brightness(1.08) saturate(1.08)}
.vb-l{font-size:var(--fs-2xs);color:var(--muted);font-weight:var(--fw-m);margin-top:var(--s2);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@keyframes growY{from{height:0}}

/* Chart tone → fill colour, shared by donut and vertical bars. */
.t-good{--c:var(--good)}.t-warn{--c:var(--warn)}.t-bad{--c:var(--bad)}.t-accent{--c:var(--accent)}

/* --- Performance-by-KPI chart -------------------------------------------
   The profile's centrepiece: one interactive bar per KPI, grouped by KRA, on
   the same 0-105 achievement scale as everywhere else with the target tick at
   100%. Each bar is a real button - hover for the figures, click through to the
   KPI's own detail and month-by-month trend. A KPI still awaiting its actual is
   drawn as a hollow "pending" track rather than listed in prose, so one chart
   carries both the performance and what is still missing from it. */
.pf{display:flex;flex-direction:column;gap:var(--s5)}
.pf-gh{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:6px;padding:0 var(--s2)}
.pf-gn{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em}
.pf-gp{font-size:var(--fs-2xs);color:var(--muted)}
.pf-ga{margin-left:auto;font-size:var(--fs-xs);font-weight:var(--fw-b);color:var(--ink);font-variant-numeric:tabular-nums}
.pf-r{display:grid;grid-template-columns:minmax(96px,1.25fr) 2fr auto;align-items:center;gap:var(--s4);
  width:100%;border:none;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
  padding:8px var(--s2);border-radius:var(--r-ctl);transition:background var(--d1) var(--ease)}
.pf-r:hover{background:var(--surface)}
.pf-r:focus-visible{outline-offset:-2px}
.pf-n{min-width:0;font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-n em{font-style:normal;color:var(--faint);font-weight:var(--fw-n);margin-left:6px;font-size:var(--fs-2xs)}
.pf-t{position:relative;height:8px;background:var(--well);border-radius:var(--r-pill)}
.pf-t i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);background:var(--accent);
  transform-origin:left;animation:grow .5s var(--ease) backwards}
.pf-t i.good{background:var(--good)}.pf-t i.warn{background:var(--warn)}.pf-t i.bad{background:var(--bad)}
.pf-t u{position:absolute;top:-2px;height:12px;width:1px;background:var(--line-2)}
.pf-t.pending{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.pf-v{font-weight:var(--fw-b);text-align:right;min-width:56px;font-variant-numeric:tabular-nums}
.pf-v.pending{color:var(--muted);font-weight:var(--fw-n);font-size:var(--fs-xs)}

/* --- Flowchart node: status label + exception count (spec §03) --------- */
.node .nst{margin-top:8px}
.node .nex{margin-top:6px;font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--warn)}
.node .nfls{margin-top:6px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.node .nfl{font-size:var(--fs-3xs);font-weight:var(--fw-b);padding:1px 7px;border-radius:var(--r-pill);white-space:nowrap}
.node .nfl.warn{color:var(--warn);background:var(--warn-soft)}
.node .nfl.bad{color:var(--bad);background:var(--bad-soft)}

/* --- All-clear line (admin weightage check) --------------------------- */
.att-ok{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s2);color:var(--muted);font-size:var(--fs-sm)}

/* --- KPI dashboard status-filter tabs (spec §05) ----------------------- */
.tabs{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s4)}
.tab{border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);font-weight:var(--fw-m);
  font-size:var(--fs-xs);padding:7px 12px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px;
  transition:border-color var(--d1) var(--ease),background var(--d1) var(--ease),color var(--d1) var(--ease)}
.tab:hover{border-color:var(--muted);color:var(--ink)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab-c{font-variant-numeric:tabular-nums;font-weight:var(--fw-b);font-size:var(--fs-3xs);
  background:var(--surface);color:var(--muted);border-radius:var(--r-pill);padding:1px 7px;min-width:20px;text-align:center}
.tab.on .tab-c{background:rgba(255,255,255,.22);color:#fff}

/* --- Closed-loop write UI: forms, actions, comments, toast --------------- */
.d-write{border-top:1px solid var(--line);margin-top:var(--s5);padding-top:var(--s5)}
.d-write .d-sect{margin-bottom:var(--s3)}
.form{display:flex;flex-direction:column;gap:var(--s3)}
.field{display:flex;flex-direction:column;gap:5px}
.field>span.lb{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.inp,.ta{font:inherit;font-size:var(--fs-sm);color:var(--ink);background:var(--card);border:1px solid var(--line-2);
  border-radius:var(--r-ctl);padding:9px 11px;width:100%;transition:border-color var(--d1) var(--ease)}
.inp:focus,.ta:focus{border-color:var(--accent)}
.ta{min-height:64px;resize:vertical;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.fbtns{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-top:var(--s1)}
.btn.sm{padding:8px 14px;font-size:var(--fs-xs)}
.btn.sub{background:var(--card);border-color:var(--line-2);color:var(--ink-2)}
.btn.sub:hover{border-color:var(--ink);color:var(--ink)}
.cmt{display:flex;flex-direction:column;gap:var(--s2);margin:0 0 var(--s3)}
.cmt-i{background:var(--surface);border-radius:var(--r-ctl);padding:9px 11px}
.cmt-i .h{font-size:var(--fs-2xs);color:var(--muted);margin-bottom:3px}
.cmt-i .h b{color:var(--ink-2);font-weight:var(--fw-b)}
.cmt-i .kd{font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-2);margin-right:6px}
.cmt-i p{margin:0;font-size:var(--fs-sm);color:var(--ink-2);line-height:1.5;overflow-wrap:anywhere}
.cmt-empty{font-size:var(--fs-xs);color:var(--muted);padding:0 0 var(--s3)}
.acard{border:1px solid var(--line);border-radius:var(--r-ctl);padding:var(--s3) var(--s4);margin-bottom:var(--s2);background:var(--card);
  display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.acard:hover{border-color:var(--line-2);box-shadow:var(--shadow-1)}
.acard .at{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.acard .at b{font-weight:var(--fw-b);font-size:var(--fs-sm)}
.acard .meta{font-size:var(--fs-2xs);color:var(--muted);margin-top:4px}
.pri{font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:var(--r-pill);white-space:nowrap}
.pri.High{color:var(--bad);background:var(--bad-soft)}.pri.Medium{color:var(--warn);background:var(--warn-soft)}.pri.Low{color:var(--muted);background:var(--surface)}
.ast{font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:var(--r-pill);white-space:nowrap;background:var(--surface);color:var(--ink-2)}
.ast.Completed{color:var(--good);background:var(--good-soft)}
.ast.Blocked,.ast.Cancelled{color:var(--bad);background:var(--bad-soft)}
.act-r{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:var(--s3);width:100%;border:none;background:none;
  font:inherit;color:inherit;text-align:left;cursor:pointer;padding:11px var(--s3);border-bottom:1px solid var(--line-soft);transition:background var(--d1) var(--ease)}
.act-r:last-child{border-bottom:none}
.act-r:hover{background:var(--surface)}
.act-r .an{min-width:0;font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-r .an small{display:block;font-size:var(--fs-2xs);color:var(--muted);font-weight:var(--fw-n)}
.act-due{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.act-due.over{color:var(--bad);font-weight:var(--fw-b)}
.toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:var(--r-ctl);padding:10px 16px;font-size:var(--fs-sm);font-weight:var(--fw-m);
  box-shadow:var(--shadow-3);max-width:90vw;animation:tin .2s var(--ease)}
.toast.bad{background:var(--bad)}.toast.good{background:var(--good)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.role-chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-2xs);font-weight:var(--fw-m);color:var(--muted);
  border:1px solid var(--line-2);background:var(--card);border-radius:var(--r-pill);padding:4px 6px 4px 10px;white-space:nowrap}
.role-chip select{border:none;background:none;font:inherit;color:var(--ink);font-weight:var(--fw-b);cursor:pointer;padding:2px}
/* --- comparison rows (Executive Overview / Teams / Analytics) ----------- */
.cmp-hd,.cmp-row{display:grid;grid-template-columns:1fr 64px 72px 84px;gap:var(--s3);align-items:center}
.cmp-hd{padding:0 var(--s3) 6px;font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cmp-hd span:not(:first-child),.cmp-row .cv{text-align:right}
.cmp-row{width:100%;border:none;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
  padding:11px var(--s3);border-bottom:1px solid var(--line-soft);transition:background var(--d1) var(--ease)}
.cmp-row:last-child{border-bottom:none}
.cmp-row:hover{background:var(--surface)}
.cmp-row .cn{font-weight:var(--fw-m);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-row .cn small{display:block;font-size:var(--fs-2xs);color:var(--muted);font-weight:var(--fw-n)}
.cmp-row .cv{font-weight:var(--fw-b);font-variant-numeric:tabular-nums}
.cmp-row .cv.q{font-weight:var(--fw-n);color:var(--muted)}
.cdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;display:inline-block;
  background:var(--faint)}
.cdot.good{background:var(--good)}
.cdot.warn{background:var(--warn)}

/* --- The score as a control ---------------------------------------------- */
button.pscore{background:none;border:none;padding:0;text-align:right;cursor:pointer;
  font-family:var(--font)}
.pscore .bdg{display:inline-block;margin-left:var(--s2);font-size:var(--fs-3xs);
  font-weight:var(--fw-b);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);
  background:var(--accent-soft);border-radius:var(--r-pill);padding:2px 8px;
  transition:all var(--d1) var(--ease)}
button.pscore:hover .bdg{background:var(--accent);color:#fff}

/* --- Score breakdown ----------------------------------------------------- */
.bd-top{background:var(--surface);border-radius:var(--r-ctl);padding:var(--s3) var(--s4);
  margin-bottom:var(--s5)}
.bd-top .k{font-size:var(--fs-3xs);font-weight:var(--fw-b);letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted)}
.bd-top .v{font-size:30px;font-weight:var(--fw-h);letter-spacing:-.03em;color:var(--ink);
  margin-top:2px;line-height:1;font-variant-numeric:tabular-nums}
.bd-top em,.bd-t em,.bd-v em,.bd-kv em{font-style:normal;font-weight:var(--fw-m);
  color:var(--faint);font-size:.62em}
.bd-g{margin-bottom:var(--s5)}
.bd-h{display:flex;align-items:baseline;gap:var(--s3)}
.bd-n{font-size:var(--fs-sm);font-weight:var(--fw-b);color:var(--ink)}
.bd-v{margin-left:auto;font-size:var(--fs-md);font-weight:var(--fw-b);color:var(--ink);
  font-variant-numeric:tabular-nums}
.bd-b{height:5px;border-radius:var(--r-pill);background:var(--well);overflow:hidden;
  margin:var(--s2) 0 var(--s3)}
.bd-b i{display:block;height:100%;border-radius:var(--r-pill);background:var(--accent)}
.bd-k{display:grid;grid-template-columns:1fr 60px auto;align-items:center;gap:var(--s3);
  padding:5px 0 5px var(--s3);border-left:2px solid var(--line)}
.bd-kn{font-size:var(--fs-xs);color:var(--ink-2);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.bd-kb{height:4px;border-radius:var(--r-pill);background:var(--well);overflow:hidden}
.bd-kb i{display:block;height:100%;border-radius:var(--r-pill);background:#93B0E6}
.bd-kv{font-size:var(--fs-xs);font-weight:var(--fw-b);color:var(--ink);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.bd-t{display:flex;justify-content:space-between;align-items:baseline;padding-top:var(--s3);
  border-top:1.5px solid var(--ink);font-size:var(--fs-lg);font-weight:var(--fw-h);
  color:var(--ink);font-variant-numeric:tabular-nums}

/* --- The information control on a KPI ------------------------------------ */
.info{width:19px;height:19px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--surface);color:var(--muted);font-size:var(--fs-2xs);
  font-weight:var(--fw-h);font-style:italic;line-height:1;margin-left:var(--s2);
  display:inline-grid;place-items:center;vertical-align:middle;padding:0;
  transition:all var(--d1) var(--ease)}
.info:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.d-sect{font-size:var(--fs-3xs);font-weight:var(--fw-b);letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);margin-bottom:var(--s2)}
.x.alt{margin-left:auto;margin-right:var(--s1);font-size:var(--fs-xl)}

/* --- Data freshness chip ------------------------------------------------- */
.fresh{display:inline-flex;align-items:center;gap:7px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 12px;
  font-size:var(--fs-xs);font-weight:var(--fw-m);color:var(--muted);min-height:32px;
  font-family:var(--font);transition:all var(--d1) var(--ease);align-self:flex-end;
  margin-bottom:1px}
.fresh:hover{color:var(--ink);border-color:var(--line-2);box-shadow:var(--shadow-1)}
.st.good{color:var(--good);background:var(--good-soft)}
.st.warn{color:var(--warn);background:var(--warn-soft)}
.st.bad{color:var(--bad);background:var(--bad-soft)}

@media(max-width:860px){
  .bd-k{grid-template-columns:1fr auto;gap:var(--s2)}
  .bd-kb{display:none}
  .fresh{align-self:auto}
}

/* ====================== PREMIUM POLISH (cascade tail) ==================== */
/* Dimensional data bars: a hairline track and a top sheen on every fill. */
.bar,.kbar .tr,.pf-t,.d-ach,.bd-b,.microbar{box-shadow:inset 0 0 0 1px rgba(15,24,40,.04)}
.bar i,.kbar .tr i,.pf-t i,.d-ach i,.bd-b i,.bd-kb i,.microbar i{box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
/* Fills gain a subtle vertical gradient so a flat bar reads as a solid form. */
.pf-t i.good,.kbar .tr i.good,.bar i.good,.d-ach i.good{background:linear-gradient(180deg,#1aa06f,var(--good))}
.pf-t i.warn,.kbar .tr i.warn,.bar i.warn,.d-ach i.warn{background:linear-gradient(180deg,#c98718,var(--warn))}
.pf-t i.bad,.kbar .tr i.bad,.bar i.bad,.d-ach i.bad{background:linear-gradient(180deg,#e5564d,var(--bad))}
.pf-t i,.kbar .tr i,.bar i,.d-ach i{background:linear-gradient(180deg,#1a6bff,var(--accent))}
/* Chips and pills get a hairline so they sit on the surface, not float flatly. */
.st,.pri,.ast,.delta,.levelchip,.role-chip,.tab{box-shadow:inset 0 0 0 1px rgba(15,24,40,.045)}
.tab.on{box-shadow:0 3px 10px -2px rgba(0,71,204,.4)}
/* Inputs: soft inner hairline at rest, an accent ring on focus. */
.sel{box-shadow:var(--shadow-1),var(--hair)}
.inp,.ta{box-shadow:var(--hair)}
.inp:focus,.ta:focus{box-shadow:var(--ring)}
.sel:focus-visible{box-shadow:var(--ring)}
/* Confident page and drawer titles. */
.page-h h1{font-size:20px;font-weight:var(--fw-h);letter-spacing:-.03em}
.page-h .kind{font-size:var(--fs-xs);color:var(--muted);margin-top:3px;font-weight:var(--fw-b)}
.d-h h2{letter-spacing:-.025em;font-weight:var(--fw-h)}
.sect{color:var(--ink-2)}
/* Rank/list rows: rounded hover fills, tabular scores. */
.rrow,.acard,.cmp-row,.act-r{border-radius:var(--r-ctl)}
@media(max-width:560px){.page-h h1{font-size:18px}}

/* ============================== KRA / KPI CONFIG EDITOR ================= */
.cfg-edit{display:inline-flex;align-items:center;gap:6px;margin-left:var(--s3);border:1px solid var(--line-2);
  background:var(--card);color:var(--accent-2);font:inherit;font-size:var(--fs-xs);font-weight:var(--fw-b);
  padding:6px 12px;border-radius:var(--r-pill);cursor:pointer;transition:border-color var(--d1) var(--ease),background var(--d1) var(--ease)}
.cfg-edit svg{width:14px;height:14px}
.cfg-edit:hover{border-color:var(--accent);background:var(--accent-soft)}
.cfg-head{display:flex;flex-direction:column;gap:var(--s3);margin-bottom:var(--s5)}
.cfg-title h1{font-size:var(--fs-xxl);font-weight:var(--fw-h);letter-spacing:-.025em}
.cfg-title .kind{color:var(--muted);font-size:var(--fs-sm);margin-top:2px}
.cfg-title .dot{margin:0 5px;color:var(--faint)}
.cfg-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s3) var(--s4);
  box-shadow:var(--shadow-1),var(--hair);margin-bottom:var(--s3)}
.cfg-total{display:flex;align-items:baseline;gap:8px;font-size:var(--fs-sm);color:var(--ink-2);font-weight:var(--fw-m)}
.cfg-total b{font-size:var(--fs-lg);font-weight:var(--fw-h);font-variant-numeric:tabular-nums}
.cfg-total span{font-size:var(--fs-2xs);color:var(--muted);font-weight:var(--fw-m)}
.cfg-total.ok b{color:var(--good)} .cfg-total.bad b{color:var(--bad)}
.cfg-actions{margin-left:auto;display:flex;gap:var(--s2);flex-wrap:wrap}
.cfg-note{font-size:var(--fs-2xs);color:var(--muted);margin:0 0 var(--s5);line-height:1.55}
.cfg-rows{display:flex;flex-direction:column;gap:var(--s4)}
.cfg-row{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  padding:var(--s4) var(--s5);box-shadow:var(--shadow-1),var(--hair)}
.cfg-row-h{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.cfg-row-h .cfg-f-kpi{flex:1;font-size:var(--fs-md);font-weight:var(--fw-b)}
.cfg-rm{flex:0 0 auto;width:30px;height:30px;border-radius:var(--r-ctl);border:1px solid var(--line-2);
  background:var(--card);color:var(--muted);font-size:19px;line-height:1;cursor:pointer;
  transition:all var(--d1) var(--ease)}
.cfg-rm:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3) var(--s4)}
.cfg-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.cfg-field.cfg-full{margin-top:var(--s3)}
.cfg-field>span{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cfg-in{width:100%;font-family:var(--font);font-size:var(--fs-sm);font-weight:var(--fw-m);color:var(--ink);
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:8px 10px;
  transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.cfg-in:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring);background:var(--card)}
select.cfg-in{cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px}
textarea.cfg-in{resize:vertical;min-height:44px;line-height:1.5}
.cfg-suffix{position:relative;display:flex;align-items:center}
.cfg-suffix .cfg-f-wt{padding-right:26px;font-variant-numeric:tabular-nums}
.cfg-suffix em{position:absolute;right:11px;font-style:normal;color:var(--muted);font-weight:var(--fw-b);font-size:var(--fs-xs);pointer-events:none}
.cfg-addbig{margin-top:var(--s4);width:100%;border:1px dashed var(--line-2);background:var(--bg-2);color:var(--accent-2);
  font:inherit;font-weight:var(--fw-b);font-size:var(--fs-sm);padding:12px;border-radius:var(--r-card);cursor:pointer;
  transition:border-color var(--d1) var(--ease),background var(--d1) var(--ease)}
.cfg-addbig:hover{border-color:var(--accent);background:var(--accent-soft)}
/* Change history */
#cfg-history{padding:var(--s2) var(--s3)}
.cfg-hist-empty{color:var(--muted);font-size:var(--fs-sm);padding:var(--s3) var(--s2)}
.cfg-h{padding:var(--s3) var(--s2);border-bottom:1px solid var(--line-soft)}
.cfg-h:last-child{border-bottom:none}
.cfg-h-top{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.cfg-h-act{font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.05em;
  padding:2px 8px;border-radius:var(--r-pill);background:var(--surface);color:var(--muted)}
.cfg-h-act.a-create,.cfg-h-act.a-assign{background:var(--accent-soft);color:var(--accent-2)}
.cfg-h-act.a-update{background:var(--warn-soft);color:var(--warn)}
.cfg-h-act.a-remove{background:var(--bad-soft);color:var(--bad)}
.cfg-h-kpi{font-weight:var(--fw-b);color:var(--ink);font-size:var(--fs-sm)}
.cfg-h-field{font-size:var(--fs-2xs);color:var(--muted);background:var(--surface);padding:1px 7px;border-radius:var(--r-pill)}
.cfg-h-when{margin-left:auto;font-size:var(--fs-2xs);color:var(--faint);white-space:nowrap}
.cfg-h-body{margin-top:5px;font-size:var(--fs-xs);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cfg-h-body s{color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.cfg-h-body b{color:var(--ink);font-weight:var(--fw-b);font-variant-numeric:tabular-nums}
.cfg-h-arrow{color:var(--faint)}
@media(max-width:560px){.cfg-h-when{margin-left:0;width:100%}.cfg-actions{width:100%}.cfg-actions .btn{flex:1}}

/* ---- Targets & Achievement ------------------------------------------- */
.st.none{color:var(--muted);background:var(--well)}
.avatar.sm{width:30px;height:30px;font-size:var(--fs-2xs)}
.avatar.xs{width:24px;height:24px;font-size:10px}
.ms-bar{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s4) var(--s5);box-shadow:var(--shadow-1);margin-bottom:var(--s5)}
.ms-l{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.ms-k{font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ms-steps{display:flex;align-items:center}
.ms-step{font-size:var(--fs-xs);font-weight:var(--fw-b);color:var(--muted);padding:5px 12px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--bg-2)}
.ms-step.done{color:var(--good);border-color:transparent;background:var(--good-soft)}
.ms-step.on{color:#fff;background:var(--accent);border-color:transparent}
.ms-step.on.warn{background:var(--warn)}
.ms-sep{width:14px;height:2px;background:var(--line-2);margin:0 3px}
.ms-meta{font-size:var(--fs-3xs);color:var(--muted);width:100%}
.ms-r{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.ms-note{width:150px}
.ms-view{font-size:var(--fs-xs);font-weight:var(--fw-b);color:var(--muted)}
.tg-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:var(--s3);margin-bottom:var(--s4)}
.tg-modes{display:inline-flex;background:var(--well);border-radius:var(--r-pill);padding:3px}
.tg-mode{border:none;background:none;font:inherit;font-size:var(--fs-xs);font-weight:var(--fw-b);color:var(--muted);padding:6px 16px;border-radius:var(--r-pill);cursor:pointer}
.tg-mode.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-1)}
.tgt-wrap{display:grid;grid-template-columns:minmax(0,248px) minmax(0,1fr);gap:var(--s5);align-items:start}
.tg-rail{display:flex;flex-direction:column;gap:4px;max-height:74vh;overflow:auto}
.tg-mrow{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;border:1px solid transparent;background:none;font:inherit;cursor:pointer;padding:8px 10px;border-radius:var(--r-ctl)}
.tg-mrow:hover{background:var(--surface)}
.tg-mrow.on{background:var(--card);border-color:var(--line);box-shadow:var(--shadow-1)}
.tg-mn{min-width:0;flex:1}
.tg-mn b{display:block;font-size:var(--fs-sm);font-weight:var(--fw-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-mn span{display:block;font-size:var(--fs-3xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-mo{font-weight:var(--fw-b);font-variant-numeric:tabular-nums;font-size:var(--fs-sm)}
.tg-main{min-width:0}
.tg-mhead{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.tg-mid{flex:1;min-width:0}
.tg-mid h3{margin:0;font-size:var(--fs-lg);font-weight:var(--fw-h)}
.tg-mid span{font-size:var(--fs-xs);color:var(--muted)}
.tg-mstat{text-align:right}
.tg-mstat-v{display:block;font-size:var(--fs-xl);font-weight:var(--fw-h);font-variant-numeric:tabular-nums}
.tg-mstat-l{font-size:var(--fs-3xs);color:var(--muted)}
.tg-hint{font-size:var(--fs-3xs);color:var(--muted);margin-bottom:var(--s3)}
.tgt-tbl table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.tgt-tbl th{font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--bg-2);white-space:nowrap}
.tgt-tbl th.num,.tgt-tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tgt-tbl td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tgt-tbl tbody tr:last-child td{border-bottom:none}
.tg-row{cursor:pointer}
.tg-row:hover td{background:var(--surface)}
.tg-kra td{background:var(--bg-2);padding:7px 12px}
.tg-kra-n{font-weight:var(--fw-b);font-size:var(--fs-xs)}
.tg-kra-p{font-size:var(--fs-3xs);color:var(--muted);margin-left:8px}
.tg-kra-a{float:right;font-weight:var(--fw-b);font-variant-numeric:tabular-nums}
.tg-nm b{font-weight:var(--fw-m)}
.tg-st{display:inline-block;font-size:10px;font-weight:var(--fw-b);padding:2px 7px;border-radius:5px;background:var(--well);color:var(--muted);margin-left:6px;vertical-align:middle}
.tg-st.ok{background:var(--good-soft);color:var(--good)}
.tg-st.none{background:transparent;border:1px dashed var(--line-2);color:var(--faint)}
.tg-flag{display:inline-block;font-size:10px;font-weight:var(--fw-b);padding:2px 6px;border-radius:5px;background:var(--warn-soft);color:var(--warn);margin-left:6px}
.tg-flag.bad{background:var(--bad-soft);color:var(--bad)}
.tg-foot td{border-top:2px solid var(--line);font-weight:var(--fw-b);background:var(--bg-2)}
.tgt-tbl .good{color:var(--good)}.tgt-tbl .warn{color:var(--warn)}.tgt-tbl .bad{color:var(--bad)}
.tg-kra-a.good,.tg-mo.good{color:var(--good)}.tg-kra-a.warn,.tg-mo.warn{color:var(--warn)}.tg-kra-a.bad,.tg-mo.bad{color:var(--bad)}
.tg-kra-a.none,.tg-mo.none{color:var(--muted)}
.tgt-empty{padding:var(--s6);text-align:center;color:var(--muted)}
.tg-note{font-size:var(--fs-3xs);color:var(--warn);margin-top:6px}
.tg-note.bad{color:var(--bad)}
.bulk-bar{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s3) var(--s4);margin-bottom:var(--s4);box-shadow:var(--shadow-1)}
.bulk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--s4)}
.bg-block{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s4);box-shadow:var(--shadow-1)}
.bg-h{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);padding-bottom:var(--s2);border-bottom:1px solid var(--line-soft)}
.bg-hn b{display:block;font-size:var(--fs-sm);font-weight:var(--fw-b)}
.bg-hn span{font-size:var(--fs-3xs);color:var(--muted)}
.bg-row{display:grid;grid-template-columns:minmax(0,1fr) auto 92px auto;align-items:center;gap:var(--s2);padding:5px 0}
.bg-kpi{min-width:0}
.bg-kpi b{display:block;font-size:var(--fs-xs);font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bg-kpi em{font-style:normal;font-size:10px;color:var(--muted)}
.bg-cur{font-size:var(--fs-3xs);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bg-row .inp{padding:5px 8px;font-size:var(--fs-xs)}
.bg-wt{font-size:var(--fs-3xs);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tgt-cmp{margin-top:var(--s6)}
@media(max-width:900px){.tgt-wrap{grid-template-columns:1fr}.tg-rail{flex-direction:row;overflow-x:auto;max-height:none}.tg-mrow{flex:0 0 210px}}
/* ============================== EMPLOYEE DIRECTORY ===================== */
.dir-tools{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s4)}
.dir-search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line-2);
  border-radius:var(--r-ctl);padding:0 12px;transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.dir-search:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
.dir-search svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
.dir-search input{flex:1;border:none;outline:none;background:none;font:inherit;font-size:var(--fs-sm);
  color:var(--ink);padding:10px 0}
.dir-teams{display:flex;gap:6px;flex-wrap:wrap}
.dir-chip{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 10px;display:inline-flex;align-items:center;gap:6px}
.dir-chip em{font-style:normal;color:var(--accent-2);font-weight:var(--fw-b)}
.dir-list{display:flex;flex-direction:column}
.dir-row{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:var(--s3);
  width:100%;border:none;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
  padding:9px var(--s2);border-bottom:1px solid var(--line-soft);border-radius:var(--r-ctl);
  transition:background var(--d1) var(--ease)}
.dir-row:last-of-type{border-bottom:none}
.dir-row:hover:not([disabled]){background:var(--surface)}
.dir-row[disabled]{cursor:default}
.dir-id{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.dir-id b{font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-id span{font-size:var(--fs-2xs);color:var(--muted)}
.dir-team{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:var(--fw-m);
  color:var(--ink-2);white-space:nowrap}
.dir-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.dir-moved{margin-left:6px;font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.04em;
  color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:var(--r-pill)}
.dir-score{font-weight:var(--fw-b);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.dir-row .chev{color:var(--faint);flex:0 0 12px;text-align:center}
.dir-row:hover:not([disabled]) .chev{color:var(--muted)}
.dir-empty{padding:var(--s5) var(--s2);color:var(--muted);font-size:var(--fs-sm);text-align:center}
@media(max-width:560px){.dir-row{grid-template-columns:auto 1fr auto}.dir-team,.dir-score{display:none}}

/* Employee → Team → Role mapping (assignment drawer) */
.map{display:flex;align-items:stretch;gap:var(--s2);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-card);padding:var(--s4)}
.map-node{flex:1;min-width:0;text-align:center}
.map-k{font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.map-v{font-size:var(--fs-sm);font-weight:var(--fw-b);color:var(--ink);margin-top:4px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis}
.map-arrow{display:flex;align-items:center;color:var(--faint);font-weight:var(--fw-b);flex:0 0 auto}
/* Auto-assign */
.aa-assignee{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:var(--s3);padding:var(--s3) var(--s4);
  background:var(--accent-soft);border:1px solid var(--accent-glow);border-radius:var(--r-ctl);font-size:var(--fs-sm);color:var(--ink-2)}
.aa-assignee b{color:var(--ink);font-weight:var(--fw-b)}
.aa-assignee em{font-style:normal;color:var(--muted);font-size:var(--fs-2xs);margin-left:auto}
.auto-tag{margin-left:8px;font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.05em;
  color:var(--accent-2);background:var(--accent-soft);padding:1px 6px;border-radius:var(--r-pill);vertical-align:middle}
/* Global search (top bar) */
.gsearch{position:relative;flex:0 1 300px;min-width:150px;display:flex;align-items:center;gap:7px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:0 12px}
.gsearch:focus-within{background:var(--card);border-color:var(--accent);box-shadow:var(--ring)}
.gsearch>svg{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
.gsearch input{flex:1;min-width:0;border:none;outline:none;background:none;font:inherit;font-size:var(--fs-sm);color:var(--ink);padding:8px 0}
.gsearch input::-webkit-search-cancel-button{-webkit-appearance:none}
.gsearch-res{position:absolute;top:calc(100% + 6px);right:0;width:360px;max-width:88vw;max-height:60vh;overflow-y:auto;
  background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-card);box-shadow:var(--shadow-3);z-index:60;padding:var(--s2)}
.gs-grp{font-size:var(--fs-3xs);font-weight:var(--fw-b);color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:var(--s3) var(--s2) 4px}
.gs-row{display:flex;align-items:center;gap:var(--s2);width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;
  cursor:pointer;padding:8px var(--s2);border-radius:var(--r-ctl);transition:background var(--d1) var(--ease)}
.gs-row:hover{background:var(--surface)}
.gs-t{flex:0 0 auto;font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.04em;color:var(--accent-2);
  background:var(--accent-soft);padding:2px 7px;border-radius:var(--r-pill);min-width:54px;text-align:center}
.gs-m{flex:1;min-width:0;font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-m em{font-style:normal;color:var(--muted);font-weight:var(--fw-n);margin-left:7px;font-size:var(--fs-xs)}
.gs-v{font-weight:var(--fw-b);font-variant-numeric:tabular-nums;font-size:var(--fs-xs);white-space:nowrap}
.gs-v.good{color:var(--good)}.gs-v.warn{color:var(--warn)}.gs-v.bad{color:var(--bad)}
.gs-empty{padding:var(--s4) var(--s2);color:var(--muted);font-size:var(--fs-sm)}
@media(max-width:720px){.gsearch{flex-basis:44px}.gsearch input{width:0}.gsearch:focus-within{position:absolute;left:var(--s3);right:var(--s3);flex-basis:auto;z-index:61}.gsearch:focus-within input{width:auto}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <!-- The Recykal mark: two blades turning about a common centre, the
         circularity motif the brand is built on.

         Traced off the artwork rather than drawn by eye. Reading the logo row
         by row gives both edges of one blade: it is a comma, not a crescent -
         a blunt rounded cap at the top, a full body sweeping out to the widest
         point just past halfway, then a long taper to a point. Earlier passes
         had it symmetric at both ends, which is what made them read as a ring
         instead of the mark.

         The rows also place the centre of rotation, at (17,69) in the source,
         so the second blade is simply the first turned through 180 degrees.
         The seam between them is the artwork's own - the rows where both
         blades appear show a two-pixel gap widening as the lower blade's tip
         rises, and that falls out of the geometry rather than being added.

         Drawn inline so it survives with no network and inside the Apps Script
         iframe, and filled with currentColor so the rail's white needs no
         second copy for dark backgrounds. -->

         to 256px - so it is exact, not approximate.

         Embedded as a data URI so it needs no network and survives inside the
         Apps Script iframe, like everything else here. It is black with an

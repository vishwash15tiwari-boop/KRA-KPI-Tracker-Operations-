<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRA / KPI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   KRA / KPI Tracker — premium enterprise scorecard.
   Left rail · top context bar · white canvas · right-side detail drawer.
   Journey: Team → Flowchart → Employee → KRA/KPI → KPI detail.
   Every element earns its place by defining, assigning, tracking, evaluating or
   reviewing a KRA/KPI. Nothing else is on screen.
   ============================================================================ */
:root{
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  /* Navy rail, cool-slate neutrals biased toward the blue accent. */
  --nav:#0E1A2E;--nav-2:#16253C;--nav-line:rgba(255,255,255,.08);
  --nav-txt:#8695AC;--nav-active:#FFFFFF;--nav-accent:#4C8DF6;
  /* On-navy text tiers (rail hover + navy summary card). */
  --nav-hi:#C6D2E4;--nav-txt-2:#9FB0C8;--nav-muted:#8A9AB2;--nav-faint:#6E829E;
  --bg:#F5F7FB;--card:#FFFFFF;--surface:#EEF2F8;--well:#E3E9F2;
  --ink:#15202F;--ink-2:#3E4C63;--muted:#5E6A82;--faint:#98A3B6;
  --line:#E7EBF2;--line-2:#D6DDE8;--line-soft:#F0F3F8;
  --accent:#2C63D6;--accent-2:#2453BE;--accent-soft:#E9F0FD;
  --good:#2C7D55;--good-soft:#E7F3EC;--warn:#B06A17;--warn-soft:#FAF1E1;--bad:#C13E31;--bad-soft:#FBECE9;
  --warn-line:#EFDCBE;--warn-line-2:#E4CB9C;
  --fs-xxl:33px;--fs-xl:21px;--fs-lg:16px;--fs-md:14px;--fs-sm:13px;--fs-xs:12px;--fs-2xs:11px;--fs-3xs:10px;
  --fw-n:400;--fw-m:500;--fw-b:600;--fw-h:700;
  --r-ctl:8px;--r-card:12px;--r-pill:999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:40px;--s8:56px;
  --ease:cubic-bezier(.2,.6,.35,1);--d1:140ms;--d2:220ms;--rail:76px;--maxw:1160px;
  --shadow-1:0 1px 2px rgba(20,32,52,.04);
  --shadow-2:0 1px 3px rgba(20,32,52,.06),0 8px 24px -12px rgba(20,32,52,.18);
  --shadow-3:0 24px 60px -22px rgba(15,26,46,.35);
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:var(--fs-sm);
  line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:'tnum' 1,'cv05' 1;letter-spacing:-.011em}
button,select,input{font-family:inherit;cursor:pointer}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-ctl)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}

/* ============================== SHELL ==================================== */
.app{display:flex;min-height:100vh}

/* Left rail — icon + small label, ~76px, never visually dominant. */
.rail{flex:0 0 var(--rail);width:var(--rail);background:var(--nav);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;align-items:stretch;padding:var(--s4) 0;z-index:40}
.rail-logo{display:flex;align-items:center;justify-content:center;height:40px;margin-bottom:var(--s5)}
/* The mark is the official artwork: black with an alpha channel. brightness(0)
   flattens it to pure black whatever it started as, and invert(1) takes that to
   white, leaving the alpha alone - so the navy rail needs no second file, and
   dropping the filter would put it back to black on a light ground. Height is
   what is fixed; width follows the artwork's own ratio. */
.rail-logo img{height:26px;width:auto;display:block;filter:brightness(0) invert(1)}
.rail-nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.rail-i{appearance:none;border:none;background:transparent;color:var(--nav-txt);
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:10px;
  font-size:var(--fs-3xs);font-weight:var(--fw-m);letter-spacing:.01em;position:relative;
  transition:color var(--d1) var(--ease),background var(--d1) var(--ease)}
.rail-i svg{width:20px;height:20px;stroke-width:1.7}
.rail-i:hover{color:var(--nav-hi);background:var(--nav-2)}
.rail-i.on{color:var(--nav-active);background:var(--nav-2)}
.rail-i:focus-visible{outline-color:var(--nav-accent)}
.rail-i.on::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;
  border-radius:0 3px 3px 0;background:var(--nav-accent)}
.rail-sp{flex:1}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* Top context bar — team, month, then who you are. Compact. */
.tbar{position:sticky;top:0;z-index:30;background:rgba(245,247,251,.85);backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line);padding:0 var(--s6);height:58px;display:flex;align-items:center;gap:var(--s3)}
.tbar .grow{flex:1}
.fld{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-2xs);color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;font-weight:var(--fw-m)}
.sel{border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-size:var(--fs-sm);
  font-weight:var(--fw-m);padding:7px 10px;border-radius:var(--r-ctl);max-width:230px;box-shadow:var(--shadow-1);
  transition:border-color var(--d1) var(--ease)}
.sel:hover{border-color:var(--line-2)}.sel:focus-visible{border-color:var(--accent)}
.sel:disabled{color:var(--faint);background:var(--surface)}
.greet{display:flex;align-items:center;gap:10px}
.greet .who{text-align:right;line-height:1.25}
.greet .who b{display:block;font-size:var(--fs-sm);font-weight:var(--fw-b)}
.greet .who span{font-size:var(--fs-2xs);color:var(--muted)}

.canvas{flex:1;min-height:0;overflow-y:auto}
.wrap{max-width:var(--maxw);margin:0 auto;padding:var(--s6) var(--s6) var(--s8)}

/* ============================== PRIMITIVES =============================== */
.avatar{flex:0 0 auto;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent-2);
  display:grid;place-items:center;font-weight:var(--fw-b);letter-spacing:-.02em;
  width:34px;height:34px;font-size:var(--fs-xs)}
.avatar.lg{width:56px;height:56px;font-size:var(--fs-lg)}
.avatar.xl{width:48px;height:48px;font-size:var(--fs-md)}

.page-h{display:flex;align-items:flex-start;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s6)}
.page-h h1{font-size:var(--fs-xl);font-weight:var(--fw-b);letter-spacing:-.02em;margin:0;line-height:1.2}
.page-h .kind{font-size:var(--fs-sm);color:var(--muted);margin-top:3px}
.page-h .r{margin-left:auto}
.back{border:none;background:none;color:var(--muted);font-size:var(--fs-xs);font-weight:var(--fw-m);
  padding:6px 8px;margin-left:-8px;display:inline-flex;align-items:center;gap:6px;margin-bottom:var(--s2)}
.back:hover{color:var(--ink)}

.sect{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--muted);text-transform:uppercase;
  letter-spacing:.07em;margin:0 0 var(--s3);display:flex;align-items:baseline;gap:var(--s2)}
.sect .r{margin-left:auto;font-weight:var(--fw-n);letter-spacing:0;text-transform:none;font-size:var(--fs-xs)}
.block{margin-bottom:var(--s7)}


/* KRA-wise bars — name left, bar centre, score right; one rhythm. */
.kbars{display:flex;flex-direction:column}
.kbar{display:grid;grid-template-columns:minmax(120px,1.1fr) 2.4fr auto;align-items:center;
  gap:var(--s4);padding:9px 0;border-bottom:1px solid var(--line-soft)}
.kbar:last-child{border-bottom:none}
.kbar .kn{font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbar .kn small{color:var(--muted);font-weight:var(--fw-n);margin-left:6px}
.kbar .tr{position:relative;height:6px;background:var(--well);border-radius:var(--r-pill)}
.kbar .tr i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);background:var(--accent);
  transform-origin:left;animation:grow .5s var(--ease) backwards}
.kbar .tr i.good{background:var(--good)}.kbar .tr i.warn{background:var(--warn)}.kbar .tr i.bad{background:var(--bad)}
.kbar .tr u{position:absolute;top:-2px;height:10px;width:1px;background:var(--line-2)}
.kbar .kv{font-weight:var(--fw-b);text-align:right;min-width:52px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* Ranking — derived from overall score, subtle top marker. */
.rank{display:flex;flex-direction:column}
.rrow{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s2);border-radius:var(--r-ctl);
  border-bottom:1px solid var(--line-soft);transition:background var(--d1) var(--ease)}
.rrow:last-child{border-bottom:none}
.rrow.click{cursor:pointer}.rrow.click:hover{background:var(--surface)}
.rrow .pos{flex:0 0 22px;text-align:center;font-size:var(--fs-xs);font-weight:var(--fw-b);color:var(--muted);
  font-variant-numeric:tabular-nums}
.rrow.top .pos{color:var(--accent)}
.rrow .nm{flex:1;min-width:0}
.rrow .nm b{display:block;font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm span{font-size:var(--fs-xs);color:var(--muted)}
.rrow .mt{width:96px;flex:0 0 96px}
.rrow .sc{font-weight:var(--fw-b);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.rrow .chev{color:var(--faint);flex:0 0 12px;text-align:center}
.rrow.click:hover .chev{color:var(--muted)}
.microbar{position:relative;height:4px;background:var(--well);border-radius:var(--r-pill)}
.microbar i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);background:var(--ink);opacity:.72}

/* ============================== FLOWCHART ================================ */
.flow{display:flex;flex-direction:column;align-items:center}
.flow-stem{width:1px;height:24px;background:var(--line-2)}
.flow-bus{width:100%;height:1px;background:var(--line-2)}
.flow-kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:var(--s4);width:100%;
  padding-top:var(--s5)}
.node{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-card);padding:var(--s4);
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;box-shadow:var(--shadow-1);
  cursor:pointer;transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease),transform var(--d1) var(--ease);
  animation:rise .42s var(--ease) backwards}
.node:hover{border-color:var(--line-2);box-shadow:var(--shadow-2);transform:translateY(-2px)}
.node.lead{border-color:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-1);
  min-width:210px;padding:var(--s5)}
.node .avatar{margin-bottom:6px}
.node .nn{font-weight:var(--fw-b);letter-spacing:-.01em}
.node .nd{font-size:var(--fs-xs);color:var(--muted);line-height:1.35}
.node .ns{margin-top:6px;font-size:var(--fs-lg);font-weight:var(--fw-h);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.node .ns em{font-style:normal;font-size:var(--fs-xs);color:var(--faint);font-weight:var(--fw-m)}
.node .tag{margin-top:5px;font-size:var(--fs-3xs);font-weight:var(--fw-b);letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent-2);background:var(--accent-soft);padding:2px 8px;border-radius:var(--r-pill)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================== TABLE =================================== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  overflow:hidden;box-shadow:var(--shadow-1)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:640px;font-size:var(--fs-sm)}
th{text-align:left;font-size:var(--fs-2xs);font-weight:var(--fw-m);color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;padding:11px var(--s3);border-bottom:1px solid var(--line-2);white-space:nowrap;
  background:var(--surface)}
td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line-soft);vertical-align:middle;height:52px;overflow:hidden}
tbody tr:last-child td{border-bottom:none}
.quiet{color:var(--muted);font-weight:var(--fw-n)}
.strong{font-weight:var(--fw-b)}
.nm{font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;font-size:var(--fs-2xs);color:var(--muted);font-weight:var(--fw-n);
  text-transform:none;letter-spacing:0}
tr.click{cursor:pointer;transition:background var(--d1) var(--ease)}
tr.click:hover{background:var(--surface)}

/* KRA band: a rule with the KRA name and its rolled-up score. */
tr.kra td{padding:var(--s4) var(--s3) 10px;border-bottom:1px solid var(--line-2);font-size:var(--fs-2xs);
  font-weight:var(--fw-b);color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em;cursor:pointer;
  background:var(--card)}
tr.kra:first-child td{padding-top:var(--s3)}
tr.kra .cv{display:inline-block;width:14px;color:var(--faint);font-weight:var(--fw-n)}
tr.kra .rs{float:right;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:var(--fw-m);
  font-variant-numeric:tabular-nums}
tr.kra .rs b{color:var(--ink);font-weight:var(--fw-b)}
td.kpi{padding-left:var(--s6)}
/* The click/keyboard affordance lives in a real <button> inside the cell, not
   on the <tr>, so rows keep their table semantics (cells still map to their
   column headers for assistive tech). The buttons inherit the cell's type. */
.kra-btn{all:unset;display:block;width:100%;box-sizing:border-box;cursor:pointer}
.kra-btn:focus-visible{outline-offset:-2px}
.cellbtn{all:unset;display:block;cursor:pointer;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* Achievement: the % over a fine bar. Bar 60–100px, tick at target. */
.ach{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px;height:30px;
  margin-left:auto;width:96px}
.ach .n{font-variant-numeric:tabular-nums;font-weight:var(--fw-b)}
.bar{display:block;position:relative;width:100%;height:4px;background:var(--well);border-radius:var(--r-pill)}
.bar i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);background:var(--accent);
  transform-origin:left;animation:grow .5s var(--ease) backwards}
.bar i.good{background:var(--good)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.bar u{position:absolute;top:-2px;width:1px;height:8px;background:var(--line-2)}

.st{font-size:var(--fs-xs);font-weight:var(--fw-m);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:var(--r-pill);background:var(--surface)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.st.good{color:var(--good)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}
.st.none{color:var(--muted);font-weight:var(--fw-n)}

.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4);margin-bottom:var(--s7)}
.mstat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s4);box-shadow:var(--shadow-1)}
.mstat .l{font-size:var(--fs-2xs);font-weight:var(--fw-m);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mstat .v{font-size:var(--fs-xl);font-weight:var(--fw-b);letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.mstat .v em{font-style:normal;font-size:var(--fs-sm);color:var(--faint);font-weight:var(--fw-m)}

/* Profile header card */
.phead{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s5);box-shadow:var(--shadow-1);
  margin-bottom:var(--s6)}
.phead .id h1{font-size:var(--fs-xl);font-weight:var(--fw-b);letter-spacing:-.02em;margin:0;line-height:1.2}
.phead .id .meta{color:var(--muted);font-size:var(--fs-sm);margin-top:3px}
.phead .id .meta .dot{color:var(--faint);margin:0 6px}
.phead .badge{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-2xs);font-weight:var(--fw-m);
  color:var(--good);background:var(--good-soft);padding:3px 9px;border-radius:var(--r-pill);margin-top:8px}
.phead .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.phead .pscore{margin-left:auto;text-align:right}
.phead .pscore .v{font-size:var(--fs-xxl);font-weight:var(--fw-h);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.phead .pscore .v em{font-style:normal;font-size:var(--fs-lg);color:var(--faint);font-weight:var(--fw-m)}
.phead .pscore .l{font-size:var(--fs-2xs);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

.two{display:grid;grid-template-columns:1.5fr 1fr;gap:var(--s5);align-items:start}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s5);box-shadow:var(--shadow-1)}

/* ============================== DRAWER =================================== */
.scrim{position:fixed;inset:0;background:rgba(15,26,46,.34);opacity:0;pointer-events:none;
  transition:opacity var(--d2) var(--ease);z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
/* --sbw is the width of the scrollbar the lock removed, published only while
   the drawer is open. Holding the drawer that far off the right edge keeps it
   exactly where it was drawn as the viewport widens underneath it. */
.drawer{position:fixed;top:0;right:var(--sbw,0px);height:100vh;width:412px;max-width:92vw;background:var(--card);
  box-shadow:var(--shadow-3);transform:translateX(100%);transition:transform var(--d2) var(--ease);
  z-index:51;display:flex;flex-direction:column}
.drawer.on{transform:none}
.d-h{padding:var(--s5) var(--s5) var(--s4);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:var(--s3)}
.d-h .eyebrow{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--accent-2);text-transform:uppercase;letter-spacing:.07em}
.d-h h2{font-size:var(--fs-lg);font-weight:var(--fw-b);margin:5px 0 0;letter-spacing:-.017em;line-height:1.3}
.d-h .x{margin-left:auto;border:1px solid var(--line-2);background:var(--card);color:var(--muted);width:30px;height:30px;
  border-radius:var(--r-ctl);font-size:16px;line-height:1;flex:0 0 auto;display:grid;place-items:center}
.d-h .x:hover{color:var(--ink);border-color:var(--ink)}
/* The drawer scrolls on its own. overscroll-behavior stops that scroll handing
   off to the page when it reaches either end, which is the other way the
   background moves while the drawer is open. */
.d-b{padding:var(--s5);overflow-y:auto;flex:1;overscroll-behavior:contain}
.scrim{overscroll-behavior:contain}
/* Stacked field pairs: label, 4px, value, 24px between pairs. */
.pair{margin-bottom:var(--s5)}
.pair:last-child{margin-bottom:0}
.pair .k{font-size:var(--fs-2xs);font-weight:var(--fw-m);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pair .v{font-size:var(--fs-md);font-weight:var(--fw-m);margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.4;overflow-wrap:anywhere}
.d-meas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r-ctl);overflow:hidden;margin-bottom:var(--s5)}
.d-meas>div{background:var(--card);padding:var(--s3) var(--s4)}
.d-meas .k{font-size:var(--fs-2xs);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.d-meas .v{font-size:var(--fs-lg);font-weight:var(--fw-b);margin-top:4px;font-variant-numeric:tabular-nums}
.d-rule{height:1px;background:var(--line);margin:0 0 var(--s5)}
.d-goal .k{font-size:var(--fs-2xs);font-weight:var(--fw-m);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.d-goal p{margin:6px 0 0;color:var(--ink-2);line-height:1.65;font-size:var(--fs-sm)}
.d-ach{position:relative;height:4px;background:var(--well);border-radius:var(--r-pill);margin-top:8px}
.d-ach i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);
  transform-origin:left;animation:grow .5s var(--ease) backwards}
.d-ach i.good{background:var(--good)}.d-ach i.warn{background:var(--warn)}.d-ach i.bad{background:var(--bad)}
.d-ach u{position:absolute;top:-2px;width:1px;height:8px;background:var(--line-2)}

/* ============================== STATES ================================== */
.state{display:grid;place-items:center;min-height:56vh;text-align:center;padding:var(--s5)}
.state h2{font-size:var(--fs-lg);font-weight:var(--fw-b);margin:0 0 var(--s2)}
.state p{color:var(--muted);margin:0 0 var(--s4);max-width:46ch;line-height:1.65}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:var(--r-ctl);
  padding:9px 16px;font-size:var(--fs-sm);font-weight:var(--fw-m);box-shadow:var(--shadow-1)}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:var(--card);border-color:var(--line-2);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--ink);color:var(--ink)}
.empty{padding:var(--s6);text-align:center;color:var(--muted)}
.hint{font-size:var(--fs-xs);color:var(--muted);margin-top:var(--s4);line-height:1.65}
.skl{background:linear-gradient(90deg,var(--surface),var(--well),var(--surface));background-size:200% 100%;
  border-radius:var(--r-card);animation:sh 1.4s ease-in-out infinite}
@keyframes sh{to{background-position:-200% 0}}
.demo{background:var(--warn-soft);border-bottom:1px solid var(--warn-line)}
.demo .in{max-width:var(--maxw);margin:0 auto;padding:8px var(--s6);display:flex;align-items:center;gap:var(--s2);
  font-size:var(--fs-xs);color:var(--warn)}
.demo button{margin-left:auto;border:1px solid var(--warn-line-2);background:var(--card);color:var(--warn);font-size:var(--fs-2xs);
  font-weight:var(--fw-m);padding:3px 10px;border-radius:var(--r-ctl)}
.demo button:hover{border-color:var(--warn)}

/* ============================== RESPONSIVE ============================== */
@media(max-width:1080px){.mini{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{flex-direction:column}
  .rail{width:100%;height:auto;flex-direction:row;position:sticky;top:0;padding:6px var(--s3);align-items:center;
    gap:var(--s2);overflow-x:auto}
  .rail-logo{margin:0 var(--s2) 0 0;height:auto}
  .rail-nav{flex-direction:row;padding:0;gap:2px;flex:1}
  .rail-i{flex-direction:row;gap:7px;padding:8px 12px;font-size:var(--fs-xs);min-height:44px;justify-content:center}
  .rail-i.on::before{display:none}.rail-sp{display:none}
  .wrap{padding:var(--s5) var(--s4) var(--s7)}.tbar{padding:0 var(--s4);height:auto;flex-wrap:wrap;gap:8px;padding-top:8px;padding-bottom:8px}
}
@media(max-width:560px){
  .mini{grid-template-columns:1fr}
  .page-h .r{margin-left:0;width:100%}
  .greet .who{display:none}
  .card .v{font-size:var(--fs-xl)}
  /* Comfortable tap targets on small screens (~44px). */
  .sel{padding:11px 12px}
  .d-h .x{width:40px;height:40px}
  .demo button{padding:9px 14px}
  .back{padding:10px 8px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============================== DEPTH LAYERS ============================
   Seven additions, none of which is a new screen. They sit inside the profile
   and the drawer that already exist, so the default view stays as sparse as it
   was and the detail appears only where it is asked for. All of it is built
   from the tokens already declared above.
   ========================================================================= */

/* --- Trend chart ---------------------------------------------------------
   The plot stretches to whatever width it is given, which is what lets the same
   chart serve a full-width panel and a 420px drawer. Only the SVG is allowed to
   stretch: a circle drawn in a non-uniformly scaled viewBox comes out an
   ellipse, and a label comes out many times too wide. So the SVG holds the area
   and the line, and the dots and labels are ordinary elements positioned over
   it in percentages — where a dot stays round and type stays its set size. */
.trend{margin-top:var(--s2)}
.tr-plot{position:relative;height:104px;margin-top:26px}
.tr-plot svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tr-plot .ln{fill:none;stroke:var(--accent);stroke-width:2;
  vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.tr-plot .ar{fill:var(--accent);opacity:.09;stroke:none}
.tr-pt{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);
  transform:translate(-50%,-50%);border:2px solid var(--card);box-sizing:border-box;
  box-shadow:0 1px 3px rgba(20,32,52,.22)}
.tr-pt.last{width:12px;height:12px}
.tr-vl{position:absolute;transform:translate(-50%,-100%);margin-top:-9px;white-space:nowrap;
  font-size:var(--fs-xs);font-weight:var(--fw-b);color:var(--ink);
  font-variant-numeric:tabular-nums}
.tr-vl.last{color:var(--accent)}
/* The end labels are pulled inside the plot so neither can sit outside the card
   it belongs to. */
.tr-pt[style*="left:0.00%"]{transform:translate(-1px,-50%)}
.tr-vl[style*="left:0.00%"]{transform:translate(0,-100%)}
.tr-pt[style*="left:100.00%"]{transform:translate(-100%,-50%)}
.tr-vl[style*="left:100.00%"]{transform:translate(-100%,-100%)}
/* The month row doubles as the hit area: one full-height column per period, so
   a month can be reached without having to hit a 9px dot. */
.tr-hits{position:absolute;left:0;right:0;top:0;bottom:-24px;display:flex}
.tr-h{flex:1 1 0;min-width:0;background:none;border:none;padding:0;font-family:var(--font);
  display:flex;align-items:flex-end;justify-content:center;border-radius:var(--r-ctl);
  transition:background var(--d1) var(--ease)}
button.tr-h{cursor:pointer}
button.tr-h:hover{background:var(--accent-soft)}
.tr-h>span{font-size:var(--fs-2xs);color:var(--muted);font-weight:var(--fw-m);padding-bottom:2px}
button.tr-h:hover>span{color:var(--accent)}
.tr-empty{font-size:var(--fs-xs);color:var(--muted);background:var(--surface);
  border-radius:var(--r-ctl);padding:var(--s3) var(--s4);line-height:1.55}
.tr-top{display:flex;margin-bottom:var(--s1)}
.tr-top.mt{margin-top:var(--s5)}
.tr-note{font-size:var(--fs-2xs);color:var(--muted);margin:var(--s5) 0 0;line-height:1.55}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);
  white-space:nowrap;border:0;padding:0}

/* --- Change against the previous period ---------------------------------- */
.delta{font-size:var(--fs-xs);font-weight:var(--fw-b);font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r-pill)}
.delta.up{color:var(--good);background:var(--good-soft)}
.delta.down{color:var(--bad);background:var(--bad-soft)}
.delta.flat{color:var(--muted);background:var(--surface)}

/* --- Performance snapshot ------------------------------------------------ */
.sn-g{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.sn{border-radius:var(--r-card);padding:var(--s4) var(--s5);border:1px solid transparent}
.sn.good{background:var(--good-soft);border-color:#D3E7DB}
.sn.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.sn-l{font-size:var(--fs-3xs);font-weight:var(--fw-b);letter-spacing:.09em;text-transform:uppercase}
.sn.good .sn-l{color:var(--good)}
.sn.warn .sn-l{color:var(--warn)}
.sn-k{font-size:var(--fs-md);font-weight:var(--fw-b);color:var(--ink);margin-top:var(--s2);
  line-height:1.35}
.sn-v{font-size:30px;font-weight:var(--fw-h);letter-spacing:-.03em;margin-top:var(--s3);
  line-height:1;font-variant-numeric:tabular-nums}
.sn-v em{font-style:normal;font-size:16px;font-weight:var(--fw-b)}
.sn.good .sn-v{color:var(--good)}
.sn.warn .sn-v{color:var(--warn)}
.sn-s{font-size:var(--fs-2xs);color:var(--muted);margin-top:var(--s1)}
.sn-f{font-size:var(--fs-xs);color:var(--ink-2);margin-top:var(--s3);padding-top:var(--s3);
  border-top:1px solid rgba(20,32,52,.08);font-variant-numeric:tabular-nums}

/* --- Performance-by-KPI chart -------------------------------------------
   The profile's centrepiece: one interactive bar per KPI, grouped by KRA, on
   the same 0-105 achievement scale as everywhere else with the target tick at
   100%. Each bar is a real button - hover for the figures, click through to the
   KPI's own detail and month-by-month trend. A KPI still awaiting its actual is
   drawn as a hollow "pending" track rather than listed in prose, so one chart
   carries both the performance and what is still missing from it. */
.pf{display:flex;flex-direction:column;gap:var(--s5)}
.pf-gh{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:6px;padding:0 var(--s2)}
.pf-gn{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em}
.pf-gp{font-size:var(--fs-2xs);color:var(--muted)}
.pf-ga{margin-left:auto;font-size:var(--fs-xs);font-weight:var(--fw-b);color:var(--ink);font-variant-numeric:tabular-nums}
.pf-r{display:grid;grid-template-columns:minmax(96px,1.25fr) 2fr auto;align-items:center;gap:var(--s4);
  width:100%;border:none;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
  padding:8px var(--s2);border-radius:var(--r-ctl);transition:background var(--d1) var(--ease)}
.pf-r:hover{background:var(--surface)}
.pf-r:focus-visible{outline-offset:-2px}
.pf-n{min-width:0;font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-n em{font-style:normal;color:var(--faint);font-weight:var(--fw-n);margin-left:6px;font-size:var(--fs-2xs)}
.pf-t{position:relative;height:8px;background:var(--well);border-radius:var(--r-pill)}
.pf-t i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);background:var(--accent);
  transform-origin:left;animation:grow .5s var(--ease) backwards}
.pf-t i.good{background:var(--good)}.pf-t i.warn{background:var(--warn)}.pf-t i.bad{background:var(--bad)}
.pf-t u{position:absolute;top:-2px;height:12px;width:1px;background:var(--line-2)}
.pf-t.pending{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.pf-v{font-weight:var(--fw-b);text-align:right;min-width:56px;font-variant-numeric:tabular-nums}
.pf-v.pending{color:var(--muted);font-weight:var(--fw-n);font-size:var(--fs-xs)}

/* --- Flowchart node: status label + exception count (spec §03) --------- */
.node .nst{margin-top:8px}
.node .nex{margin-top:6px;font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--warn)}

/* --- Needs-attention exception list (spec §01 / D1) -------------------- */
.att-r{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:var(--s3);
  width:100%;border:none;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
  padding:9px var(--s2);border-bottom:1px solid var(--line-soft);border-radius:var(--r-ctl);
  transition:background var(--d1) var(--ease)}
.att-r:last-child{border-bottom:none}
.att-r:hover{background:var(--surface)}
.att-n{min-width:0;font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-n em{font-style:normal;color:var(--muted);font-weight:var(--fw-n);margin-left:8px;font-size:var(--fs-xs)}
.att-v{font-weight:var(--fw-b);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.att-r .chev{color:var(--faint);flex:0 0 12px;text-align:center}
.att-ok{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s2);color:var(--muted);font-size:var(--fs-sm)}

/* --- KPI dashboard status-filter tabs (spec §05) ----------------------- */
.tabs{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s4)}
.tab{border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);font-weight:var(--fw-m);
  font-size:var(--fs-xs);padding:7px 12px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px;
  transition:border-color var(--d1) var(--ease),background var(--d1) var(--ease),color var(--d1) var(--ease)}
.tab:hover{border-color:var(--muted);color:var(--ink)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab-c{font-variant-numeric:tabular-nums;font-weight:var(--fw-b);font-size:var(--fs-3xs);
  background:var(--surface);color:var(--muted);border-radius:var(--r-pill);padding:1px 7px;min-width:20px;text-align:center}
.tab.on .tab-c{background:rgba(255,255,255,.22);color:#fff}

/* --- Closed-loop write UI: forms, actions, comments, toast --------------- */
.d-write{border-top:1px solid var(--line);margin-top:var(--s5);padding-top:var(--s5)}
.d-write .d-sect{margin-bottom:var(--s3)}
.form{display:flex;flex-direction:column;gap:var(--s3)}
.field{display:flex;flex-direction:column;gap:5px}
.field>span.lb{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.inp,.ta{font:inherit;font-size:var(--fs-sm);color:var(--ink);background:var(--card);border:1px solid var(--line-2);
  border-radius:var(--r-ctl);padding:9px 11px;width:100%;transition:border-color var(--d1) var(--ease)}
.inp:focus,.ta:focus{border-color:var(--accent)}
.ta{min-height:64px;resize:vertical;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.fbtns{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-top:var(--s1)}
.btn.sm{padding:8px 14px;font-size:var(--fs-xs)}
.btn.sub{background:var(--card);border-color:var(--line-2);color:var(--ink-2)}
.btn.sub:hover{border-color:var(--ink);color:var(--ink)}
.cmt{display:flex;flex-direction:column;gap:var(--s2);margin:0 0 var(--s3)}
.cmt-i{background:var(--surface);border-radius:var(--r-ctl);padding:9px 11px}
.cmt-i .h{font-size:var(--fs-2xs);color:var(--muted);margin-bottom:3px}
.cmt-i .h b{color:var(--ink-2);font-weight:var(--fw-b)}
.cmt-i .kd{font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-2);margin-right:6px}
.cmt-i p{margin:0;font-size:var(--fs-sm);color:var(--ink-2);line-height:1.5;overflow-wrap:anywhere}
.cmt-empty{font-size:var(--fs-xs);color:var(--muted);padding:0 0 var(--s3)}
.acard{border:1px solid var(--line);border-radius:var(--r-ctl);padding:var(--s3) var(--s4);margin-bottom:var(--s2);background:var(--card);
  display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.acard:hover{border-color:var(--line-2);box-shadow:var(--shadow-1)}
.acard .at{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.acard .at b{font-weight:var(--fw-b);font-size:var(--fs-sm)}
.acard .meta{font-size:var(--fs-2xs);color:var(--muted);margin-top:4px}
.pri{font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:var(--r-pill);white-space:nowrap}
.pri.High{color:var(--bad);background:var(--bad-soft)}.pri.Medium{color:var(--warn);background:var(--warn-soft)}.pri.Low{color:var(--muted);background:var(--surface)}
.ast{font-size:var(--fs-3xs);font-weight:var(--fw-b);text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:var(--r-pill);white-space:nowrap;background:var(--surface);color:var(--ink-2)}
.ast.Completed{color:var(--good);background:var(--good-soft)}
.ast.Blocked,.ast.Cancelled{color:var(--bad);background:var(--bad-soft)}
.act-r{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:var(--s3);width:100%;border:none;background:none;
  font:inherit;color:inherit;text-align:left;cursor:pointer;padding:11px var(--s3);border-bottom:1px solid var(--line-soft);transition:background var(--d1) var(--ease)}
.act-r:last-child{border-bottom:none}
.act-r:hover{background:var(--surface)}
.act-r .an{min-width:0;font-weight:var(--fw-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-r .an small{display:block;font-size:var(--fs-2xs);color:var(--muted);font-weight:var(--fw-n)}
.act-due{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.act-due.over{color:var(--bad);font-weight:var(--fw-b)}
.toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:var(--r-ctl);padding:10px 16px;font-size:var(--fs-sm);font-weight:var(--fw-m);
  box-shadow:var(--shadow-3);max-width:90vw;animation:tin .2s var(--ease)}
.toast.bad{background:var(--bad)}.toast.good{background:var(--good)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.role-chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-2xs);font-weight:var(--fw-m);color:var(--muted);
  border:1px solid var(--line-2);background:var(--card);border-radius:var(--r-pill);padding:4px 6px 4px 10px;white-space:nowrap}
.role-chip select{border:none;background:none;font:inherit;color:var(--ink);font-weight:var(--fw-b);cursor:pointer;padding:2px}
/* --- comparison rows (Executive Overview / Teams / Analytics) ----------- */
.cmp-hd,.cmp-row{display:grid;grid-template-columns:1fr 64px 72px 84px;gap:var(--s3);align-items:center}
.cmp-hd{padding:0 var(--s3) 6px;font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cmp-hd span:not(:first-child),.cmp-row .cv{text-align:right}
.cmp-row{width:100%;border:none;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
  padding:11px var(--s3);border-bottom:1px solid var(--line-soft);transition:background var(--d1) var(--ease)}
.cmp-row:last-child{border-bottom:none}
.cmp-row:hover{background:var(--surface)}
.cmp-row .cn{font-weight:var(--fw-m);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-row .cn small{display:block;font-size:var(--fs-2xs);color:var(--muted);font-weight:var(--fw-n)}
.cmp-row .cv{font-weight:var(--fw-b);font-variant-numeric:tabular-nums}
.cmp-row .cv.q{font-weight:var(--fw-n);color:var(--muted)}
.cdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;display:inline-block;
  background:var(--faint)}
.cdot.good{background:var(--good)}
.cdot.warn{background:var(--warn)}

/* --- The score as a control ---------------------------------------------- */
button.pscore{background:none;border:none;padding:0;text-align:right;cursor:pointer;
  font-family:var(--font)}
.pscore .bdg{display:inline-block;margin-left:var(--s2);font-size:var(--fs-3xs);
  font-weight:var(--fw-b);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);
  background:var(--accent-soft);border-radius:var(--r-pill);padding:2px 8px;
  transition:all var(--d1) var(--ease)}
button.pscore:hover .bdg{background:var(--accent);color:#fff}

/* --- Score breakdown ----------------------------------------------------- */
.bd-top{background:var(--surface);border-radius:var(--r-ctl);padding:var(--s3) var(--s4);
  margin-bottom:var(--s5)}
.bd-top .k{font-size:var(--fs-3xs);font-weight:var(--fw-b);letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted)}
.bd-top .v{font-size:30px;font-weight:var(--fw-h);letter-spacing:-.03em;color:var(--ink);
  margin-top:2px;line-height:1;font-variant-numeric:tabular-nums}
.bd-top em,.bd-t em,.bd-v em,.bd-kv em{font-style:normal;font-weight:var(--fw-m);
  color:var(--faint);font-size:.62em}
.bd-g{margin-bottom:var(--s5)}
.bd-h{display:flex;align-items:baseline;gap:var(--s3)}
.bd-n{font-size:var(--fs-sm);font-weight:var(--fw-b);color:var(--ink)}
.bd-v{margin-left:auto;font-size:var(--fs-md);font-weight:var(--fw-b);color:var(--ink);
  font-variant-numeric:tabular-nums}
.bd-b{height:5px;border-radius:var(--r-pill);background:var(--well);overflow:hidden;
  margin:var(--s2) 0 var(--s3)}
.bd-b i{display:block;height:100%;border-radius:var(--r-pill);background:var(--accent)}
.bd-k{display:grid;grid-template-columns:1fr 60px auto;align-items:center;gap:var(--s3);
  padding:5px 0 5px var(--s3);border-left:2px solid var(--line)}
.bd-kn{font-size:var(--fs-xs);color:var(--ink-2);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.bd-kb{height:4px;border-radius:var(--r-pill);background:var(--well);overflow:hidden}
.bd-kb i{display:block;height:100%;border-radius:var(--r-pill);background:#93B0E6}
.bd-kv{font-size:var(--fs-xs);font-weight:var(--fw-b);color:var(--ink);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.bd-t{display:flex;justify-content:space-between;align-items:baseline;padding-top:var(--s3);
  border-top:1.5px solid var(--ink);font-size:var(--fs-lg);font-weight:var(--fw-h);
  color:var(--ink);font-variant-numeric:tabular-nums}

/* --- The information control on a KPI ------------------------------------ */
.info{width:19px;height:19px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--surface);color:var(--muted);font-size:var(--fs-2xs);
  font-weight:var(--fw-h);font-style:italic;line-height:1;margin-left:var(--s2);
  display:inline-grid;place-items:center;vertical-align:middle;padding:0;
  transition:all var(--d1) var(--ease)}
.info:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.d-sect{font-size:var(--fs-3xs);font-weight:var(--fw-b);letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);margin-bottom:var(--s2)}
.x.alt{margin-left:auto;margin-right:var(--s1);font-size:var(--fs-xl)}

/* --- Data freshness chip ------------------------------------------------- */
.fresh{display:inline-flex;align-items:center;gap:7px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 12px;
  font-size:var(--fs-xs);font-weight:var(--fw-m);color:var(--muted);min-height:32px;
  font-family:var(--font);transition:all var(--d1) var(--ease);align-self:flex-end;
  margin-bottom:1px}
.fresh:hover{color:var(--ink);border-color:var(--line-2);box-shadow:var(--shadow-1)}
.st.good{color:var(--good);background:var(--good-soft)}
.st.warn{color:var(--warn);background:var(--warn-soft)}
.st.bad{color:var(--bad);background:var(--bad-soft)}

@media(max-width:860px){
  .sn-g{grid-template-columns:1fr}
  .bd-k{grid-template-columns:1fr auto;gap:var(--s2)}
  .bd-kb{display:none}
  .fresh{align-self:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <!-- The Recykal mark: two blades turning about a common centre, the
         circularity motif the brand is built on.

         Traced off the artwork rather than drawn by eye. Reading the logo row
         by row gives both edges of one blade: it is a comma, not a crescent -
         a blunt rounded cap at the top, a full body sweeping out to the widest
         point just past halfway, then a long taper to a point. Earlier passes
         had it symmetric at both ends, which is what made them read as a ring
         instead of the mark.

         The rows also place the centre of rotation, at (17,69) in the source,
         so the second blade is simply the first turned through 180 degrees.
         The seam between them is the artwork's own - the rows where both
         blades appear show a two-pixel gap widening as the lower blade's tip
         rises, and that falls out of the geometry rather than being added.

         Drawn inline so it survives with no network and inside the Apps Script
         iframe, and filled with currentColor so the rail's white needs no
         second copy for dark backgrounds. -->
    <!-- The Recykal mark, the artwork itself rather than a tracing of it.
         Every attempt to redraw this by hand was wrong, because the only copy
         on the machine was cropped through the left blade. This is the real
         asset, taken from the official lockup, cropped to the mark and scaled
         to 256px - so it is exact, not approximate.

         Embedded as a data URI so it needs no network and survives inside the
         Apps Script iframe, like everything else here. It is black with an
         alpha channel; the filter turns it white for the navy rail without a
         second copy, and lifting the filter would put it back to black for a
         light one. -->

<script>
'use strict';
/* ============================================================================
   KRA / KPI Tracker
   Api -> Store -> Sel -> render. One backend call; every derived list computed
   in one place; pure render functions. The frontend calculates nothing about
   performance — achievement %, weighted score, level and status all arrive
   derived from apiMasterModel(); the only arithmetic here is presentational
   rollup (restating backend weighted scores at KRA or team grain).
   ============================================================================ */
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
var n1 = function (v) { return (v == null || v === '' || isNaN(v)) ? null : Math.round(v * 10) / 10; };
var show = function (v) { var n = n1(v); return n == null ? '—' : n; };
var initials = function (s) {
  return String(s || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0] || ''; }).join('').toUpperCase();
};

var S = { model: null, loading: true, error: null,
          view: 'team', team: null, employee: null, month: null,
          closed: {}, detail: null, demo: false, _demo: null,
          kpiFilter: 'all', actionFilter: 'open', session: null, saving: false,
          _trigger: null, _drawerOpen: false };

/* ============================== API ===================================== */
var Api = {
  live: function () { return !!(window.google && google.script && google.script.run); },
  fetch: function (month, done, fail) {
    if (!Api.live()) return fail({ message: 'Open this page through the deployed Apps Script URL to load live data.' });
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).apiMasterModel(null, month || null);
  },
  ping: function (done, fail) {
    if (!Api.live()) return fail({ message: 'Not running inside the deployed web app.' });
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).apiPing();
  }
};

/* ============================== DEMO ====================================
   Sample targets/actuals for visual preview only, confined here. It re-derives
   using the same rules the backend applies, so the shape on screen matches. */
var Demo = {
  seed: function (s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0x7fffffff; return h; },
  apply: function (model, period) {
    var c = JSON.parse(JSON.stringify(model));
    /* The period is part of the seed. Without it every month derives identical
       values, the month selector looks broken, and a performance history is a
       flat line saying nothing. */
    var p = period || S.month || c.month || '';
    c.month = p || c.month;
    c.scorecards.forEach(function (sc) {
      sc.kpis.forEach(function (k) {
        var seed = Demo.seed(p + sc.employee_id + k.kra + k.kpi), lower = k.direction === 'LOWER_IS_BETTER';
        var target = lower ? 5 : k.unit === 'CR' ? 1 + (seed % 900) / 100
                   : k.unit === 'PERCENT' ? 90 + (seed % 10) : 2 + (seed % 12);
        var ratio = 0.62 + ((seed >> 3) % 55) / 100;
        k.target = Math.round(target * 100) / 100;
        k.actual = lower ? Math.max(1, Math.round(target / ratio)) : Math.round(target * ratio * 100) / 100;
        k.variance = Math.round((k.actual - k.target) * 10) / 10;
        var ach = lower ? k.target / k.actual * 100 : k.actual / k.target * 100;
        k.achievement = Math.round(Math.min(ach, 105) * 10) / 10;
        k.weighted_score = Math.round(k.weightage * (k.achievement / 100) * 1000) / 1000;
        k.level = k.achievement >= 100 ? 5 : k.achievement >= 90 ? 4 : k.achievement >= 75 ? 3 : k.achievement >= 60 ? 2 : 1;
        // Same status contract as the backend: Exceeded / On Track / At Risk / Off Track.
        k.status = k.achievement >= 100 ? 'Exceeded' : k.achievement >= 90 ? 'On Track' : k.achievement >= 75 ? 'At Risk' : 'Off Track';
      });
      var e = 0, m = 0;
      sc.kpis.forEach(function (k) { e += k.weighted_score; m += k.weightage; });
      sc.measured_weightage = m; sc.overall_score = m ? Math.round(e * 10) / 10 : null;
      var ma = m ? Math.round(e / m * 1000) / 10 : null;
      sc.kpi_achievement = ma;
      sc.status = ma == null ? 'Pending Data' : ma >= 100 ? 'Exceeded' : ma >= 90 ? 'On Track' : ma >= 75 ? 'At Risk' : 'Off Track';
    });
    c.months = (c.months && c.months.length) ? c.months : ['2026-08'];
    c.month = c.month || c.months[c.months.length - 1];
    return c;
  }
};

/* ============================== SELECTORS =============================== */
var Sel = {
  model: function () { return S.demo && S.model ? (S._demo || (S._demo = Demo.apply(S.model))) : S.model; },
  teams: function () { var m = Sel.model(); return (m && m.teams) || []; },
  team: function () { return Sel.teams().filter(function (t) { return t.team_id === S.team; })[0] || null; },
  months: function () { var m = Sel.model(); return (m && m.months) || []; },
  members: function () {
    var m = Sel.model();
    return ((m && m.scorecards) || []).filter(function (s) { return s.team_id === S.team; });
  },
  member: function (id) { return Sel.members().filter(function (m) { return m.employee_id === id; })[0] || null; },
  allKpis: function () {
    var out = [];
    Sel.members().forEach(function (m) {
      m.kpis.forEach(function (k) { k.__owner = m.employee_id; k.__ownerName = m.employee_name; out.push(k); });
    });
    return out;
  },
  /* KRA rollup: restates KPIs' backend weighted scores over their combined
     weightage. Presentation only; it originates nothing. */
  byKra: function (kpis) {
    var by = {}, order = [];
    kpis.forEach(function (k) {
      if (!by[k.kra]) { by[k.kra] = { kra: k.kra, perspective: k.perspective, kpis: [], earned: 0, measured: 0 }; order.push(k.kra); }
      var g = by[k.kra]; g.kpis.push(k);
      if (k.weighted_score != null) { g.earned += k.weighted_score; g.measured += Number(k.weightage) || 0; }
    });
    return order.map(function (n) {
      var g = by[n]; g.achievement = g.measured > 0 ? Math.round(g.earned / g.measured * 1000) / 10 : null; return g;
    });
  },
  mean: function (vals) {
    var v = vals.filter(function (x) { return x != null; });
    if (!v.length) return null;
    var s = 0; v.forEach(function (x) { s += x; });
    return Math.round(s / v.length * 10) / 10;
  },
  ranked: function () {
    return Sel.members().slice().sort(function (a, b) {
      return (b.overall_score == null ? -1 : b.overall_score) - (a.overall_score == null ? -1 : a.overall_score);
    });
  },
  rankOf: function (id) {
    var me = Sel.member(id);
    if (!me || me.overall_score == null) return null;   // no score, no rank — never a fabricated position
    var measured = Sel.ranked().filter(function (x) { return x.overall_score != null; });
    return 1 + measured.filter(function (x) { return x.overall_score > me.overall_score; }).length;  // competition ranking; ties share a rank
  },
  /* The person the greeting names and "My profile" opens: the org root of the
     team (empty reporting manager), else the named team lead / category head. */
  lead: function () {
    var team = Sel.team(), ms = Sel.members();
    if (!ms.length) return null;
    var root = ms.filter(function (m) { return !m.reporting_manager; })[0];
    if (root) return root;
    var name = team && (team.team_lead || team.category_head);
    var byName = name && ms.filter(function (m) { return m.employee_name === name; })[0];
    return byName || Sel.ranked()[0];
  }
};

/* ============================== HISTORY ================================
   The added panels all ask one question the rest of the app does not: the same
   person, or the same KPI, across several months rather than one. That is
   answered once here and cached, so a profile does not re-derive six models per
   panel.

   Against a live model only the loaded period can be reported on, because the
   backend answers one period at a time; the trends then render their empty
   state rather than inventing a line. On sample data every period is
   re-derived with the period in the seed, which is what makes a trend exist at
   all before a sheet is connected. */
var Hist = {
  _c: {},
  clear: function () { Hist._c = {}; },
  modelFor: function (month) {
    if (Object.prototype.hasOwnProperty.call(Hist._c, month)) return Hist._c[month];
    var base = S.model, out = null;
    if (!base) return null;
    if (S.demo) out = Demo.apply(base, month);
    else if (base.month === month) out = base;
    Hist._c[month] = out;
    return out;
  },
  card: function (month, empId) {
    var m = Hist.modelFor(month);
    if (!m) return null;
    return (m.scorecards || []).filter(function (s) { return s.employee_id === empId; })[0] || null;
  },
  /* [{month, v}] for a person's overall score. Gaps are dropped rather than
     drawn as zero, which would read as a collapse instead of a blank. */
  employee: function (empId) {
    return Sel.months().map(function (mo) {
      var c = Hist.card(mo, empId);
      return { month: mo, v: c ? c.overall_score : null };
    }).filter(function (p) { return p.v != null; });
  },
  /* Achievement rather than the raw amount: the target itself moves month to
     month, so a line of raw values would be measured against a shifting bar. */
  kpi: function (empId, name) {
    return Sel.months().map(function (mo) {
      var c = Hist.card(mo, empId);
      var k = c && (c.kpis || []).filter(function (x) { return x.kpi === name; })[0];
      return { month: mo, v: k ? k.achievement : null };
    }).filter(function (p) { return p.v != null; });
  }
};

/* ============================== TREND ==================================
   One chart, used by the profile history and the KPI drawer, so a line means
   the same thing in both places.

   The plot stretches to whatever width it is given, which is what lets it work
   in a full-width panel and a 420px drawer. Only the SVG may stretch: a circle
   drawn in a non-uniformly scaled viewBox comes out an ellipse and a label
   comes out many times too wide. So the SVG carries the area and the line and
   nothing else, and the dots and labels are ordinary elements positioned over
   it in percentages, where a dot stays round and type stays the size it was
   set. */
function Trend(points, opts) {
  opts = opts || {};
  if (!points || points.length < 2) {
    return '<div class="tr-empty">Not enough history yet. A trend appears once this ' +
      'has been measured in more than one period.</div>';
  }
  var vals = points.map(function (p) { return p.v; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var span = Math.max(hi - lo, 8);
  var min = Math.max(0, Math.floor((lo - span * 0.45) / 5) * 5);
  var max = Math.min(opts.max || 110, Math.ceil((hi + span * 0.55) / 5) * 5);
  if (max <= min) max = min + 10;

  var n = points.length;
  var px = function (i) { return i * 100 / (n - 1); };
  var py = function (v) { return (1 - (v - min) / (max - min)) * 100; };
  var d = points.map(function (p, i) {
    return (i ? 'L' : 'M') + px(i).toFixed(2) + ' ' + py(p.v).toFixed(2);
  }).join(' ');

  var marks = points.map(function (p, i) {
    var last = i === n - 1;
    var pos = 'left:' + px(i).toFixed(2) + '%;top:' + py(p.v).toFixed(2) + '%';
    return '<i class="tr-pt' + (last ? ' last' : '') + '" style="' + pos + '"></i>' +
      '<b class="tr-vl' + (last ? ' last' : '') + '" style="' + pos + '">' +
      show(p.v) + (opts.suffix || '') + '</b>';
  }).join('');

  /* A full-height column per period, so a month can be reached without having
     to hit the dot itself. */
  var hits = points.map(function (p, i) {
    var pick = opts.pick !== false;
    var tag = pick ? 'button' : 'span';
    return '<' + tag + ' class="tr-h"' + (pick ? ' data-month="' + esc(p.month) + '"' : '') +
      ' title="' + esc(monthLabel(p.month)) + ' · ' + show(p.v) + (opts.suffix || '') + '">' +
      '<span>' + esc(monthShort(p.month)) + '</span></' + tag + '>';
  }).join('');

  return '<div class="trend"><div class="tr-plot">' +
    '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
      '<path class="ar" d="' + d + ' L100 100 L0 100 Z"/>' +
      '<path class="ln" d="' + d + '"/></svg>' + marks +
    '<div class="tr-hits">' + hits + '</div></div>' +
    '<p class="vh">' + esc(opts.label || 'Trend') + ': ' + points.map(function (p) {
      return monthShort(p.month) + ' ' + show(p.v) + (opts.suffix || '');
    }).join(', ') + '</p></div>';
}
function monthShort(p) {
  var d = String(p).split('-');
  return ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
          'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][Number(d[1])] || p;
}
/* The change against the period before, as a direction and a size. */
function Delta(points, suffix) {
  if (!points || points.length < 2) return '';
  var a = points[points.length - 2], b = points[points.length - 1];
  var d = Math.round((b.v - a.v) * 10) / 10;
  if (!d) return '<span class="delta flat">No change vs ' + esc(monthShort(a.month)) + '</span>';
  return '<span class="delta ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '↑' : '↓') + ' ' +
    Math.abs(d).toFixed(1) + (suffix || '') + ' vs ' + esc(monthShort(a.month)) + '</span>';
}

/* ============================== PROFILE PANELS =========================
   None of these is a screen. They sit inside the profile that already existed,
   so the default view stays as simple as it was and the depth appears only
   where the question is asked. */

/* Performance history: the score by period and nothing else. The per-KPI
   version of this question is answered one level down, inside the KPI. */
function HistoryPanel(m) {
  var pts = Hist.employee(m.employee_id);
  return '<div class="block"><div class="sect">Performance history' +
    '<span class="r">' + (pts.length > 1 ? 'overall score by month' : 'overall score') + '</span></div>' +
    '<div class="pcard">' +
      (pts.length > 1 ? '<div class="tr-top">' + Delta(pts) + '</div>' : '') +
      Trend(pts, { label: 'Overall score', max: 100 }) +
      (pts.length > 1 ? '<p class="tr-note">Select a period to open it.</p>' : '') +
    '</div></div>';
}

/* Strongest and weakest, computed rather than assigned. Achievement is already
   direction-aware upstream - a lower DSO raises it - so a plain comparison
   holds for inverted KPIs too. */
function SnapshotPanel(m) {
  var rated = (m.kpis || []).filter(function (k) { return k.achievement != null; });
  if (rated.length < 2) return '';
  var sorted = rated.slice().sort(function (a, b) { return b.achievement - a.achievement; });
  var best = sorted[0], worst = sorted[sorted.length - 1];
  if (best === worst) return '';
  function card(cls, label, k) {
    var pair = (k.actual == null || k.target == null) ? ''
      : '<div class="sn-f">' + fmt(k.actual, k.unit) + ' actual · ' + fmt(k.target, k.unit) + ' target</div>';
    return '<div class="sn ' + cls + '"><div class="sn-l">' + label + '</div>' +
      '<div class="sn-k">' + esc(k.kpi) + '</div>' +
      '<div class="sn-v">' + show(k.achievement) + '<em>%</em></div>' +
      '<div class="sn-s">Achievement · ' + esc(k.kra || '') + '</div>' + pair + '</div>';
  }
  return '<div class="block"><div class="sect">Performance snapshot<span class="r">this period</span></div>' +
    '<div class="sn-g">' + card('good', 'Strongest KPI', best) +
    card('warn', 'Needs attention', worst) + '</div></div>';
}

/* Performance by KPI — the profile's main chart, and what replaced the prose
   "incomplete" panel. One interactive bar per KPI, grouped by KRA, on the shared
   0-105 achievement scale with the target tick at 100%. Every row is a real
   button: hover for the figures, click through to the KPI's own detail and its
   month-by-month trend. A KPI still awaiting its actual is drawn as a hollow
   pending track rather than named in a list, so one chart carries both the
   performance and what is still missing from it. */
function PerfChart(m) {
  var groups = Sel.byKra(m.kpis || []);
  if (!groups.length) return '';
  var total = (m.kpis || []).length;
  var measured = (m.kpis || []).filter(function (k) { return k.achievement != null; }).length;
  var chart = groups.map(function (g) {
    var rows = g.kpis.map(function (k) {
      var pending = k.achievement == null;
      var w = pending ? 0 : Math.max(2, Math.min(100, k.achievement / 105 * 100));
      var tip = pending
        ? k.kpi + ' — awaiting this period’s actual'
        : k.kpi + ' — ' + show(k.achievement) + '% · target ' + fmt(k.target, k.unit) +
          ' · actual ' + fmt(k.actual, k.unit) + ' · score ' + show(k.weighted_score) + ' of ' + show(k.weightage);
      return '<button type="button" class="pf-r" data-kpi="' + esc((k.__owner || '') + '::' + k.kpi_id) +
        '" title="' + esc(tip) + '" aria-label="' + esc(tip) + '">' +
        '<span class="pf-n">' + esc(k.kpi) + '<em>' + show(k.weightage) + '%</em></span>' +
        '<span class="pf-t' + (pending ? ' pending' : '') + '">' + (pending ? '' : TARGET_TICK) +
          '<i class="' + tone(k.achievement) + '" style="width:' + w + '%"></i></span>' +
        '<span class="pf-v' + (pending ? ' pending' : '') + '">' + (pending ? 'Pending' : show(k.achievement) + '%') + '</span>' +
      '</button>';
    }).join('');
    return '<div class="pf-g"><div class="pf-gh"><span class="pf-gn">' + esc(g.kra) + '</span>' +
      (g.perspective ? '<span class="pf-gp">' + esc(g.perspective) + '</span>' : '') +
      '<span class="pf-ga">' + (g.achievement == null ? 'Pending Data' : show(g.achievement) + '%') + '</span></div>' +
      rows + '</div>';
  }).join('');
  return '<div class="block"><div class="sect">Performance by KPI' +
    '<span class="r">' + measured + ' of ' + total + ' measured · click a bar for detail</span></div>' +
    '<div class="pcard">' +
      (measured === 0 ? '<p class="tr-note" style="margin:0 0 var(--s4)">No actuals entered for this period yet — each KPI below is awaiting its number, and the bars fill in as data arrives.</p>' : '') +
      '<div class="pf">' + chart + '</div></div></div>';
}

/* ============================== DRAWER BODIES ==========================
   The drawer answers four kinds of question now. They are all the same gesture
   - ask for more about the thing in front of you - so they share one surface
   rather than each getting its own. */

/* The overall score, explained. The chain is overall -> KRA -> KPI
   contribution, every line a share of 100, so the parts visibly sum to the
   whole. Raw achievement is deliberately not the headline: 105% on a 5% KPI
   moves the total less than 70% on a 40% one, and only the weighted figure
   shows that. */
function ScoreBody(m) {
  var kpis = (m.kpis || []).filter(function (k) { return k.weighted_score != null; });
  var groups = Sel.byKra(kpis);
  var earned = 0, weight = 0;
  groups.forEach(function (g) { earned += g.earned; weight += g.measured; });

  var body = groups.map(function (g) {
    return '<div class="bd-g"><div class="bd-h"><span class="bd-n">' + esc(g.kra) + '</span>' +
      '<span class="bd-v">' + show(g.earned) + '<em> / ' + show(g.measured) + '</em></span></div>' +
      '<div class="bd-b"><i style="width:' +
        (g.measured ? Math.min(100, g.earned / g.measured * 100).toFixed(1) : 0) + '%"></i></div>' +
      g.kpis.map(function (k) {
        var share = k.weightage ? (k.weighted_score / k.weightage * 100) : 0;
        return '<div class="bd-k"><span class="bd-kn">' + esc(k.kpi) + '</span>' +
          '<span class="bd-kb"><i style="width:' + Math.max(0, Math.min(100, share)).toFixed(1) + '%"></i></span>' +
          '<span class="bd-kv">' + show(k.weighted_score) + '<em> / ' + show(k.weightage) + '</em></span></div>';
      }).join('') + '</div>';
  }).join('');

  return '<div class="d-h"><div><div class="eyebrow">' + esc(m.employee_name) + '</div>' +
    '<h2>Score breakdown</h2></div>' +
    '<button class="x" data-close="1" aria-label="Close">×</button></div>' +
    '<div class="d-b"><div class="bd-top"><div class="k">Overall score</div>' +
    '<div class="v">' + show(m.overall_score) + '<em> / 100</em></div></div>' +
    (groups.length ? body : '<div class="empty">No scored KPIs for this period.</div>') +
    '<div class="bd-t"><span>Total</span><span>' + show(earned) + '<em> / ' + show(weight) + '</em></span></div>' +
    (weight && Math.abs(weight - 100) > 0.5
      ? '<p class="tr-note">Measured weightage is ' + show(weight) + ' of 100. KPIs without ' +
        'actuals are excluded, so the total is out of what could be measured.</p>' : '') +
    '</div>';
}

/* A KPI's own history, inside the KPI it belongs to. */
function KpiTrendBlock(k, owner) {
  var pts = owner ? Hist.kpi(owner.employee_id, k.kpi) : [];
  return '<div class="d-rule"></div><div class="d-sect">Achievement by month</div>' +
    Trend(pts, { label: 'Achievement', suffix: '%', max: 110, pick: false }) +
    (pts.length > 1 ? '<div class="tr-top mt">' + Delta(pts, '%') + '</div>' : '');
}

/* Reference material, on demand. It is the same every month, so leaving it on
   the KPI itself would crowd out the figures that are not. */
function DefBody(k) {
  return '<div class="d-h"><div><div class="eyebrow">KPI definition</div><h2>' + esc(k.kpi) + '</h2></div>' +
    '<button class="x alt" data-dback="1" aria-label="Back to KPI detail">‹</button>' +
    '<button class="x" data-close="1" aria-label="Close">×</button></div>' +
    '<div class="d-b">' +
      pair('KRA', esc(k.kra || '—')) +
      pair('Perspective', esc(k.perspective || '—')) +
      pair('Measurement', k.unit ? measureLabel(k.unit) : '—') +
      pair('Direction', k.direction === 'LOWER_IS_BETTER' ? 'Lower is better' : 'Higher is better') +
      pair('Weightage', show(k.weightage) + '% of the scorecard') +
      pair('Frequency', 'Monthly') +
      pair('Source of tracking', esc(k.source || 'Monthly MIS')) +
      (k.goal ? '<div class="d-rule"></div><div class="d-goal pair"><div class="k">Goal / description</div>' +
        '<p>' + esc(k.goal) + '</p></div>' : '') +
      '<p class="tr-note">Definitions come from the KPI master and are the same every ' +
      'month. Only the target and actual change.</p></div>';
}

/* Metadata, so it is a note behind an indicator rather than anything with a
   place in the navigation. It reports only what the model actually carries. */
function FreshBody() {
  var m = Sel.model() || {};
  return '<div class="d-h"><div><div class="eyebrow">Where these numbers came from</div>' +
    '<h2>Data freshness</h2></div>' +
    '<button class="x" data-close="1" aria-label="Close">×</button></div>' +
    '<div class="d-b">' +
      (!S.demo && m.generated_at ? pair('Last updated', esc(stamp(m.generated_at))) : '') +
      pair('Source', esc(S.demo ? 'Sample values' : (m.source || 'Google Sheet'))) +
      (!S.demo && m.records != null ? pair('Records', String(m.records)) : '') +
      pair('Period', esc(S.month ? monthLabel(S.month) : '—')) +
      pair('Periods available', String(Sel.months().length)) +
      pair('Status', S.demo ? '<span class="st warn">Sample values — not live</span>'
                            : '<span class="st good">Up to date</span>') +
      (S.demo ? '<p class="tr-note">No sheet is connected, so every target and actual on ' +
        'screen is generated for demonstration. Teams, employees, KRAs and weightages are ' +
        'real.</p>' : '') + '</div>';
}
function stamp(v) {
  var d = new Date(v);
  if (isNaN(d)) return String(v);
  var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  var h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return d.getDate() + ' ' + mo + ' ' + d.getFullYear() + ' · ' + h + ':' +
    ('0' + d.getMinutes()).slice(-2) + ' ' + ap;
}
/* The indicator itself: a dot, a relative time, and a way in. */
function FreshChip() {
  var m = Sel.model() || {};
  var label;
  if (S.demo) label = 'Sample data';
  else if (m.generated_at) {
    var mins = Math.max(0, Math.round((Date.now() - new Date(m.generated_at)) / 60000));
    label = mins < 1 ? 'Updated just now'
      : mins < 60 ? 'Updated ' + mins + ' min ago'
      : mins < 1440 ? 'Updated ' + Math.round(mins / 60) + ' h ago'
      : 'Updated ' + Math.round(mins / 1440) + ' d ago';
  } else label = 'Data status';
  return '<button class="fresh" data-fresh="1" aria-label="' + esc(label) +
    '. Show where this data came from"><i class="cdot ' + (S.demo ? 'warn' : 'good') + '"></i>' +
    esc(label) + '</button>';
}
/* ============================== FORMAT ================================== */
function fmt(v, unit) {
  var n = n1(v); if (n == null) return '—';
  return unit === 'CR' ? '₹' + n + ' Cr'
       : unit === 'MT' ? n + ' MT'
       : unit === 'DAYS' ? n + (Math.abs(n) === 1 ? ' day' : ' days')
       : unit === 'PERCENT' ? n + '%' : String(n);
}
function tone(ach) { return ach == null ? 'none' : ach >= 90 ? 'good' : ach >= 75 ? 'warn' : 'bad'; }
/* Pill tone from the backend's own level (5/4 met, 3 near, 2/1 short). The
   status TEXT always comes verbatim from k.status — the frontend never
   re-classifies performance, it only colours what the backend decided. */
function levelTone(level) { return level == null ? 'none' : level >= 4 ? 'good' : level === 3 ? 'warn' : 'bad'; }
function monthLabel(m) {
  var M = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var x = /^(\d{4})-(\d{2})$/.exec(m || '');
  return x ? (M[+x[2]] || x[2]) + ' ' + x[1] : (m || '');
}
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

/* ============================== PIECES ================================= */
function Avatar(name, cls) { return '<div class="avatar ' + (cls || '') + '">' + esc(initials(name)) + '</div>'; }

/* Achievement % over a fine bar on the KPI's own 105% ladder, with one tick at
   target (100%) — the same target reference the KRA rollup and drawer draw, so
   "at target" reads at an identical position everywhere. The bar annotates the
   figure; it is not a second reading. */
var TARGET_TICK = '<u style="left:' + (100 / 105 * 100) + '%"></u>';
function achBar(ach) {
  if (ach == null) return '';
  var w = Math.max(0, Math.min(100, ach / 105 * 100)), c = tone(ach);
  return '<span class="bar">' + TARGET_TICK + '<i class="' + c + '" style="width:' + w + '%"></i></span>';
}
function Ach(k) {
  if (k.achievement == null) return '<span class="quiet">—</span>';
  return '<span class="ach"><span class="n">' + show(k.achievement) + '%</span>' +
    achBar(k.achievement) + '</span>';
}
function KraBars(groups) {
  if (!groups.length) return '<div class="empty">No KRAs tagged.</div>';
  return '<div class="kbars">' + groups.map(function (g) {
    var ach = g.achievement, c = tone(ach), w = ach == null ? 0 : Math.max(0, Math.min(100, ach / 105 * 100));
    return '<div class="kbar"><div class="kn">' + esc(g.kra) +
      '<small>' + plural(g.kpis.length, 'KPI') + '</small></div>' +
      '<div class="tr">' + TARGET_TICK + '<i class="' + c + '" style="width:' + w + '%"></i></div>' +
      '<div class="kv">' + (ach == null ? '—' : show(ach) + '%') + '</div></div>';
  }).join('') + '</div>';
}
/* Ranking is derived only from real measured scores. Unmeasured members get no
   position, no ★ and no bar — array order is never dressed up as a rank. When
   nobody in the set is measured there is simply no order to show. */
function RankList(members, clickable) {
  var rk = members.slice().sort(function (a, b) {

  var t = document.createElement('div'); t.className = 'toast' + (kind ? ' ' + kind : ''); t.textContent = msg;
  w.appendChild(t);

var Write = {

function doWrite(fn, payload, opts) {

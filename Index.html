/* ==========================================================================
 * HOW ONE DERIVED FIGURE WAS REACHED
 *
 * The note stored with the achievement carries the three quantities; this puts
 * them next to the ladder the rating came from, so the whole chain — rupees to
 * days to a Target number — is on one screen.
 *
 * Parsed from the note rather than recomputed, deliberately: recomputing here
 * would let the explanation drift from the figure that was actually stored and
 * rated. If the two ever disagree, the note is the record of what happened.
 * ======================================================================== */
function modalWorking(empId,kpiId,month){
  var r=findRow(empId,kpiId), e=M.emps[empId];
  if(!r||!e) return;
  var note=noteFor(r,month);
  if(!note) return;
  var parts=String(note).split(' · ');
  var src=parts[0]||'', formula='', ships='';
  parts.slice(1).forEach(function(p){
    if(/shipment/.test(p)) ships=p; else if(!formula) formula=p;
  });
  /* pull the three quantities out of "receivable X ÷ GMV Y × Z days = N days" */
  var m=formula.match(/receivable\s+(.+?)\s+÷\s+GMV\s+(.+?)\s+×\s+(\d+)\s+days\s+=\s+(.+)$/);
  var rows='';
  if(m){
    rows=
      '<div class="cl"><span>Receivable outstanding</span><b>'+h(m[1])+'</b></div>'+
      '<div class="cl"><span>GMV for the month</span><b>'+h(m[2])+'</b></div>'+
      '<div class="cl"><span>Days in the period</span><b>'+h(m[3])+'</b></div>'+
      (ships?'<div class="cl"><span>Shipments counted</span><b>'+
        h(ships.replace(/\s*shipments?$/,''))+'</b></div>':'')+
      '<div class="eq"><b>'+h(m[1])+'</b> &divide; <b>'+h(m[2])+'</b> &times; <b>'+
      h(m[3])+' days</b> = <b>'+h(m[4])+'</b></div>';
  } else {
    /* an unrecognised note is shown verbatim rather than silently dropped */
    rows='<div class="eq">'+h(note)+'</div>';
  }
  var lad=(r.bands||[]).map(function(b,i){
    return String(b||'').trim()
      ?'<div class="cl"><span>Target '+(i+1)+'</span><b>'+h(b)+
        (r.plan_unit?'\u2009'+h(r.plan_unit):'')+'</b></div>':''; }).join('');
  var body='<div class="calc">'+rows+'</div>'+
    '<div class="cap" style="margin:18px 0 6px"><b style="color:var(--ink)">'+
    'What it was rated against</b></div>'+
    '<div class="calc">'+lad+
    '<div class="cl"><span>Target set</span><b>'+
    (r.plan_target===null||r.plan_target===undefined?'—'
      :h(fmtTarget(r.plan_target,r.plan_unit)))+'</b></div>'+
    '<div class="cl"><span>Rating earned</span><b>'+
    (r.level===null||r.level===undefined||r.level===''?'—':'Target '+f1(r.level))+
    '</b></div></div>'+
    '<div class="cap" style="margin-top:16px">Lower is better on this KPI, so a '+
    'rung is cleared by coming in at or BELOW it. Source: '+h(src)+'.</div>';
  openModal(shell('How this was calculated',
    e.name+' · '+r.kpi+(month?' · '+String(month).replace('per_',''):''),
    body,'<button class="btn p" data-close="1">Close</button>',true));
}

/* rupees as crore, because every other money figure on the page is in crore */
function crore(v){
  var x=Number(v);
  if(!isFinite(x)||x===0) return '0.00 Cr';
  return (Math.round(x/1e5)/100).toFixed(2)+' Cr';
}

/* ==========================================================================
 * THE WORKING BEHIND A CARD
 *
 * "33%" is not an explanation, and neither is a page of prose describing how
 * an average is taken. What answers the question is the five numbers that were
 * averaged, with the arithmetic written out underneath.
 *
 * So every card opens ITS OWN VALUES: the people, the KPIs, the targets and
 * the achieved figures that produced the number on its face, and a sum line
 * showing them being combined. The prose stays on the method page for anyone
 * who wants the rules rather than the workings; every modal links to it.
 *
 * Read from ovStats(), the same call the cards read, so a breakdown cannot
 * disagree with the number it explains.
 * ======================================================================== */
function sumLine(txt){
  return '<div class="sumline">'+txt+'</div>';
}
/* a person x level table, used by five of the cards */
function pplTable(list,note){
  if(!list.length) return emptyBox('Nobody here',note||'No scorecard falls in this group.');
  return '<div class="tw"><table class="mini"><thead><tr><th>Person</th>'+
    '<th>Department</th><th class="r">Level</th><th class="r">As %</th>'+
    '</tr></thead><tbody>'+
    list.slice().sort(function(a,b){ return (b.o.score||0)-(a.o.score||0); })
      .map(function(x){
        return '<tr><td>'+h(x.e.name)+'</td><td>'+
          h(teamLabel(M.teams[x.e.team_id])||'—')+'</td>'+
          '<td class="r num">'+f1(x.o.score)+'</td>'+
          '<td class="r num">'+pc(Number(x.o.score)/5*100)+'</td></tr>';
      }).join('')+'</tbody></table></div>';
}
/* a KPI x target x achieved table, used by the target-side cards */
function kpiTable(rows,showPct){

  return '<div class="tw"><table class="mini"><thead><tr><th>Person</th><th>KPI</th>'+

        '<td class="r num">'+(r.plan_target===null||r.plan_target===undefined
          ?'<span class="lv-na">—</span>':h(fmtTarget(r.plan_target,r.plan_unit)))+'</td>'+
        '<td class="r num">'+(r.actual===null||r.actual===undefined
          ?'<span class="lv-na">—</span>':h(fmtTarget(r.actual,r.plan_unit)))+'</td>'+
        (showPct?'<td class="r num">'+(p===null?'<span class="lv-na">—</span>':pc(p))+'</td>':'')+
        '<td class="r num">'+(r.level===null||r.level===undefined||r.level===''
          ?'<span class="lv-na">—</span>':'T'+f1(r.level))+'</td></tr>';

    (rows.length>60?'<div class="cap" style="margin-top:8px">showing the first 60 of '+
      rows.length+'</div>':'');
}

/* THE ORDER THE BUSINESS READS ITS DEPARTMENTS IN.
 *
 * The two revenue verticals first and side by side, because they are what
 * anybody opening a card looks at first; then the two support functions; then
 * Control Tower. Alphabetical put Collections at the top and Plastic fourth,
 * which is tidy and useless.
 *
 * Matched on the department NAME rather than the team id, so it survives a
 * re-seed. Anything not listed sorts after the listed ones, alphabetically —
 * a new department appears in a predictable place instead of vanishing. */
var VERTICAL_ORDER=['PLASTIC','METAL','ONBOARDING','COLLECTIONS'];
function verticalRank(tid){
  var nm=String(teamLabel(M.teams[tid])||'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ')
    .replace(/\s+/g,' ').trim();
  for(var i=0;i<VERTICAL_ORDER.length;i++){
    if(nm.indexOf(VERTICAL_ORDER[i])===0) return i;
  }
  return VERTICAL_ORDER.length;
}
function byVertical(items,empOf){
  var by={};
  items.forEach(function(it){
    var e=empOf(it); if(!e) return;
    var tid=String(e.team_id);
    (by[tid]=by[tid]||[]).push(it);
  });
  return Object.keys(by).sort(function(a,b){
    var ra=verticalRank(a), rb=verticalRank(b);
    if(ra!==rb) return ra-rb;
    return String(teamLabel(M.teams[a])).localeCompare(String(teamLabel(M.teams[b])));
  }).map(function(tid){ return { tid:tid, items:by[tid] }; });
}
/* A vertical's card, with its LEAD named. The lead is who a reader goes to
   about the numbers underneath, so a department heading without one is only
   half an answer — and saying "no lead recorded" is itself worth knowing. */
function vCard(tid,sub,body,foot){
  var t=M.teams[tid]||{}, lead=M.emps[t.lead_id];
  return '<section class="vcard"><div class="vch"><h4>'+h(teamLabel(t))+'</h4>'+
    '<div class="cap">'+(lead?'Lead · <b>'+h(lead.name)+'</b>'
      :'<span class="lv-na">no lead recorded</span>')+
    (sub?' · '+sub:'')+'</div></div>'+body+
    (foot?'<div class="vfoot">'+foot+'</div>':'')+'</section>';
}
function sbs(cards){
  return cards.length?'<div class="sbs">'+cards.join('')+'</div>'
    :emptyBox('Nothing to show','No vertical falls in this group.');
}
/* a bare table, for inside a vertical card */
/* A TOTAL ROW BEATS A WALL OF ADDITION. The footer used to print
   ( 3.8 + 0.5 + 1.2 + 0.7 + ... ) ÷ 12 = 1.1 — twelve numbers nobody reads,
   wrapping over two lines, in place of the one figure being explained. The sum
   and the count still say how it was reached; they just say it in a row whose
   columns line up with the ones above. */
function vTable(heads,rows,tot){
  if(!rows.length) return '<div class="cap" style="padding:12px 13px">nothing here</div>';
  return '<div class="tw"><table class="mini"><thead><tr>'+
    heads.map(function(x){
      return '<th'+(x.r?' class="r"':'')+'>'+h(x.t)+'</th>'; }).join('')+
    '</tr></thead><tbody>'+rows.join('')+'</tbody>'+
    (tot?'<tfoot><tr class="vtr">'+tot+'</tr></tfoot>':'')+
    '</table></div>';
}
function mean_(a,get){
  return a.length?a.reduce(function(t,x){ return t+Number(get(x)); },0)/a.length:null;
}
function cardDetail(key){
  var V=ovStats();
  var t='', cap='', body='';
  if(key==='employees'){
    t='Employees'; cap=String(V.people.length)+' matching the filters';
    body=sumLine('<b>'+V.people.length+'</b> people · <b>'+V.scored.length+'</b> scored · '+
        '<b>'+V.unscored.length+'</b> awaiting actuals')+
      '<div class="cap" style="margin:12px 0 0">Only a scored person can be '+
      'banded on the health row, which is why the three bands add up to '+
      V.scored.length+' and not '+V.people.length+'.</div>'+
      sbs(byVertical(V.all,function(x){ return x.e; }).map(function(gp){
        var sc=gp.items.filter(function(x){
          return x.o.score!==null&&x.o.score!==undefined; });
        var av=mean_(sc,function(x){ return x.o.score; });
        return vCard(gp.tid,
          '<b>'+gp.items.length+'</b> '+(gp.items.length===1?'person':'people'),
          vTable([{t:'Person'},{t:'Level',r:true},{t:'As %',r:true}],
            gp.items.slice().sort(function(a,b){
              return (b.o.score||-1)-(a.o.score||-1); }).map(function(x){
              var has=x.o.score!==null&&x.o.score!==undefined;
              return '<tr><td>'+h(x.e.name)+
                (M.teams[gp.tid]&&String(M.teams[gp.tid].lead_id)===String(x.e.id)
                  ?' <span class="tag g">lead</span>':'')+
                (x.e.designation?'<div class="cap">'+h(x.e.designation)+'</div>':'')+
                '</td><td class="r num">'+(has?f1(x.o.score)
                  :'<span class="lv-na">awaiting</span>')+'</td>'+
                '<td class="r num">'+(has?pc(Number(x.o.score)/5*100)
                  :'<span class="lv-na">—</span>')+'</td></tr>';
            })),
          sc.length?'mean '+f1(av)+' of 5 · '+pc(av/5*100)+
            ' · '+sc.length+' of '+gp.items.length+' scored'
            :'nothing scored yet');
      }));
  }
  else if(key==='avg'){
    t='Avg performance';
    cap=V.avgLvl===null?'no actuals yet'
      :f1(V.avgLvl)+' of 5 = '+pc(V.avgLvl/5*100);
    var each=V.scored.map(function(x){ return f1(x.o.score); }).join(' + ');
    body=(V.avgLvl===null?emptyBox('Nothing scored yet','No level can be averaged.')
      :sumLine('total <b>'+f1(V.scored.reduce(function(t,x){
           return t+Number(x.o.score); },0))+'</b> across <b>'+V.scored.length+
         '</b> scorecards &divide; '+V.scored.length+' = <b>'+f1(V.avgLvl)+
         '</b> of 5 &nbsp;→&nbsp; '+f1(V.avgLvl)+' &divide; 5 = <b>'+
         pc(V.avgLvl/5*100)+'</b>')+
       '<div class="cap" style="margin:12px 0 0">A mean of <b>people</b>, not '+
       'of KPIs — each scorecard is already a weighted mean of its own KPIs, so '+
       'counting KPIs again would weight a seven-KPI scorecard above a '+
       'five-KPI one. <b>The vertical means below do not average to the figure '+
       'above</b> unless every vertical has the same number of scorecards.</div>'+
       sbs(byVertical(V.scored,function(x){ return x.e; }).map(function(gp){
         var av=mean_(gp.items,function(x){ return x.o.score; });
         var sum=gp.items.reduce(function(t,x){ return t+Number(x.o.score); },0);
         return vCard(gp.tid,'<b>'+pc(av/5*100)+'</b> · level '+f1(av),
           vTable([{t:'Person'},{t:'Level',r:true},{t:'As %',r:true}],
             gp.items.slice().sort(function(a,b){ return b.o.score-a.o.score; })
               .map(function(x){
                 return '<tr><td>'+h(x.e.name)+'</td>'+
                   '<td class="r num">'+f1(x.o.score)+'</td>'+
                   '<td class="r num">'+pc(Number(x.o.score)/5*100)+'</td></tr>';
               }),
             '<td>Average of '+gp.items.length+'</td>'+
             '<td class="r num">'+f1(av)+'</td>'+
             '<td class="r num">'+pc(av/5*100)+'</td>'),
           'total '+f1(sum)+' ÷ '+gp.items.length+' = '+f1(av)+' of 5');
       })));
  }
  else if(key==='attain'){
    t='Target achievement';
    cap=V.attain===null?'nothing achieved against a target yet'
      :'mean of '+V.pctRows.length+' KPIs = '+pc(V.attain);
    body=(V.attain===null?emptyBox('Nothing to average',
        'No KPI has both a target and an achieved value.')
      :sumLine('sum of the '+V.pctRows.length+' percentages ÷ '+V.pctRows.length+
         ' = <b>'+pc(V.attain)+'</b> &nbsp;·&nbsp; <b>'+V.atTgt.length+'</b> of them '+
         'reached 100%')+
       '<div class="cap" style="margin:12px 0 8px">100% means on target. On a '+
       'lower-is-better KPI such as DSO the percentage is <b>target ÷ achieved</b>, '+
       'inverted so that 100% still means on target. KPIs on an absolute ladder '+
       'with no percentage at all are left out rather than counted as zero — '+
       'that is why this averages '+V.pctRows.length+' rows and not '+V.tr.length+'.'+
       '</div>'+
       sbs(byVertical(V.pctRows,function(r){ return M.emps[r.employee_id]; })
         .map(function(gp){
           var av=mean_(gp.items,function(r){ return pctOfTarget(r); });
           var met=gp.items.filter(function(r){ return pctOfTarget(r)>=100; }).length;
           return vCard(gp.tid,'<b>'+pc(av)+'</b> · '+met+' of '+gp.items.length+
             ' at or above target',
             vTable([{t:'Person'},{t:'KPI'},{t:'Target',r:true},
                     {t:'Achieved',r:true},{t:'%',r:true}],
               gp.items.slice().sort(function(a,b){
                 return pctOfTarget(a)-pctOfTarget(b); }).map(function(r){
                 var p=pctOfTarget(r);
                 return '<tr><td>'+h((M.emps[r.employee_id]||{}).name||'—')+'</td>'+
                   '<td>'+h(r.kpi)+'</td>'+
                   '<td class="r num">'+h(fmtTarget(r.plan_target,r.plan_unit))+'</td>'+
                   '<td class="r num">'+(r.actual===null||r.actual===undefined
                     ?'<span class="lv-na">—</span>'
                     :h(fmtTarget(r.actual,r.plan_unit)))+'</td>'+
                   '<td class="r num">'+(p>=100?'<b>'+pc(p)+'</b>'
                     :'<span class="miss">'+pc(p)+'</span>')+'</td></tr>';
               })),
             'mean of '+gp.items.length+' = '+pc(av));
         })));
  }
  else if(key==='completion'){
    t='KPI completion';
    cap=V.tr.length?V.withAch.length+' of '+V.tr.length+' = '+
      pc(V.withAch.length/V.tr.length*100):'nothing targeted yet';
    body=sumLine('<b>'+V.withAch.length+'</b> ÷ <b>'+V.tr.length+'</b> = <b>'+
        (V.tr.length?pc(V.withAch.length/V.tr.length*100):'—')+'</b>')+
      '<div class="cap" style="margin:12px 0 8px">This measures <b>how much has '+
      'been entered</b>, not how well anybody did. Only KPIs that have a target '+
      'are counted — the Target Sheet covers Metals and Plastics only.</div>'+
      sbs(byVertical(V.tr,function(r){ return M.emps[r.employee_id]; })
        .map(function(gp){
          var miss=gp.items.filter(function(r){
            return r.actual===null||r.actual===undefined; });
          var have=gp.items.length-miss.length;
          return vCard(gp.tid,'<b>'+pc(have/gp.items.length*100)+'</b> · '+have+
            ' of '+gp.items.length,
            miss.length
              ?vTable([{t:'Person'},{t:'KPI'},{t:'Target',r:true}],
                 miss.map(function(r){
                   return '<tr><td>'+h((M.emps[r.employee_id]||{}).name||'—')+'</td>'+
                     '<td>'+h(r.kpi)+'</td>'+
                     '<td class="r num">'+h(fmtTarget(r.plan_target,r.plan_unit))+
                     '</td></tr>';
                 }))
              :'<div class="cap" style="padding:12px 13px">every targeted KPI has '+
                'an achieved value</div>',
            miss.length?miss.length+' still missing a value':'complete');
        }));
  }
  else if(key==='top'){
    t='Top performer';
    /* shell() escapes cap, so this must NOT pre-escape or a name with an
       ampersand arrives as &amp; on screen */
    cap=V.top?V.top.e.name+' · level '+f1(V.top.o.score)+' of 5':'awaiting actuals';
    if(!V.top){ body=emptyBox('Nothing scored yet','No level can be ranked.'); }
    else {
      var mine=(M.byEmp[V.top.e.id]||[]).filter(function(r){
        return r.level!==null&&r.level!==undefined&&r.level!==''; });
      body=sumLine(h(V.top.e.name)+' · weighted mean of <b>'+mine.length+'</b> scored '+
          'KPIs = <b>'+f1(V.top.o.score)+'</b> of 5')+
        '<div class="cap" style="margin:12px 0 8px">Ties are broken arbitrarily, so '+
        'read this as <b>one of</b> the highest rather than a ranking. Each KPI '+
        'below counts in proportion to its weightage.</div>'+kpiTable(mine,true)+
        '<div class="cap" style="margin-top:14px">Everybody, for comparison:</div>'+
        pplTable(V.scored);
    }
  }
  else if(key==='ok'||key==='warn'||key==='crit'){
    var pick={ ok:{ t:'On track', l:V.ok, why:'Overall level <b>4 or above</b> — at or '+
                  'above target. Target 4 is the Target Sheet figure itself.' },
               warn:{ t:'Needs attention', l:V.warn, why:'Level <b>3 up to just under '+
                  '4</b> — reached 90% of target but not target.' },
               crit:{ t:'Critical', l:V.crit, why:'Level <b>below 3</b> — short of 90% '+
                  'of target.' } }[key];
    t=pick.t;
    cap=pick.l.length+' of '+V.scored.length+' scored';
    body=sumLine('<i class="dot '+key+'"></i><b>'+pick.l.length+'</b> of <b>'+
        V.scored.length+'</b> scored = <b>'+
        (V.scored.length?pc(pick.l.length/V.scored.length*100):'—')+'</b>')+
      '<div class="cap" style="margin:12px 0 8px">'+pick.why+' '+
      'The bands are cut on the rating scale, not on round percentages.</div>'+
      pplTable(pick.l);
  }
  else if(key==='gap'){
    t='KPI gap';
    cap=V.gap.length+' of '+V.st.n+' assignments carry no rating';
    /* four different causes look identical on the Overview, so name them */
    var why={ noTarget:[], noActual:[], noLadder:[], other:[] };
    V.gap.forEach(function(r){
      var defined=(r.bands||[]).filter(function(b){ return String(b||'').trim()!==''; }).length;
      if(!defined) why.noLadder.push(r);
      else if(r.plan_target===null||r.plan_target===undefined) why.noTarget.push(r);
      else if(r.actual===null||r.actual===undefined) why.noActual.push(r);
      else why.other.push(r);
    });
    body=sumLine('<b>'+V.st.n+'</b> assignments &minus; <b>'+V.st.scored+
        '</b> rated = <b>'+V.gap.length+'</b> with no rating')+
      '<div class="cap" style="margin:12px 0 10px">Four different causes look '+
      'identical on the card. Split out:</div>'+
      '<div class="tw"><table class="mini"><tbody>'+
      [['No ladder at all',why.noLadder],['No target for this period',why.noTarget],
       ['No achieved value',why.noActual],['Something else',why.other]]
        .map(function(p){
          return '<tr><td>'+p[0]+'</td><td class="r num"><b>'+p[1].length+'</b></td></tr>';
        }).join('')+'</tbody></table></div>'+
      '<div class="cap" style="margin:14px 0 6px"><b style="color:var(--ink)">'+
      'Every unrated assignment</b></div>'+kpiTable(V.gap,false);
  }
  else if(key==='dept'){
    t='Top department';
    cap=V.depts.length?teamLabel(V.depts[0].t)+' · level '+f1(V.depts[0].avg)+' of 5'
      :'awaiting actuals';
    body=(V.depts.length?sumLine('<b>'+h(teamLabel(V.depts[0].t))+'</b> leads on a mean '+
        'of <b>'+V.depts[0].n+'</b> scorecard'+(V.depts[0].n===1?'':'s'))+
       '<div class="cap" style="margin:12px 0 8px"><b>Read the count before the '+
       'rank.</b> A department with one scored person can top a department with '+
       'fourteen.</div>'+
       '<div class="tw"><table class="mini"><thead><tr><th>Department</th>'+
       '<th class="r">Scorecards</th><th class="r">Mean level</th>'+
       '<th class="r">As %</th></tr></thead><tbody>'+
       V.depts.map(function(d,i){
         return '<tr><td>'+(i===0?'<b>':'')+h(teamLabel(d.t))+(i===0?'</b>':'')+'</td>'+
           '<td class="r num">'+d.n+'</td><td class="r num">'+f1(d.avg)+'</td>'+
           '<td class="r num">'+pc(d.avg/5*100)+'</td></tr>';
       }).join('')+'</tbody></table></div>'
      :emptyBox('Nothing scored yet','No department mean can be taken.'));
  }
  else { return null; }

  return shell(t,cap,body,
    '<a class="btn" href="#/method" data-close="1">The rules behind every card</a>'+
    '<button class="btn p" data-close="1">Close</button>','cards');
}

function closeModal(){ var s=$('.scrim'); if(s) s.remove(); }
function openModal(html){
  closeModal();
  var d=document.createElement('div');
  d.className='scrim';
  d.innerHTML=html;
  d.addEventListener('click',function(ev){ if(ev.target===d) closeModal(); });
  /* wire() runs at the end of render(); a modal is created afterwards, so its
     [data-close] buttons were never bound and X / Cancel did nothing. Bind the
     modal's own controls here, where they exist. */
  Array.prototype.slice.call(d.querySelectorAll('[data-close]')).forEach(function(b){
    b.addEventListener('click',function(ev){ ev.preventDefault(); closeModal(); }); });
  document.body.appendChild(d);
  var first=d.querySelector('input,select,textarea,button');
  if(first) first.focus();
}

function modalTargets(empId,kpiId){
  var r=findRow(empId,kpiId), e=M.emps[empId]; if(!r||!e) return;
  var body='<div class="cap" style="margin-bottom:16px">Bands are free text by design — the '+
    'workbook holds ladders like <b>&gt; 28 Days</b>, <b>TGT-20 Days</b> and '+
    '<b>≥ ₹9 Cr</b>. Direction is detected from the values, not assumed, so the five must '+
    'move in one direction.</div>'+
    '<div class="bands">'+[0,1,2,3,4].map(function(i){
      return '<div class="b"><label>Target '+(i+1)+'</label>'+
        '<input id="t'+(i+1)+'" value="'+h((r.bands||[])[i]||'')+'"></div>'; }).join('')+
    '</div>'+
    '<div class="fld" style="margin-top:16px"><label>Currently reads as</label>'+
      '<div id="tPrev" class="cap"></div></div>';
  openModal(shell('Target bands',h(e.name)+' · '+r.kpi,body,
    '<button class="btn" data-close="1">Cancel</button>'+
    '<button class="btn p" id="tSave">Save bands</button>',true));
  /* Mirrors parseBands_ in Code.gs — the same tests IN THE SAME ORDER, because
     the point of this preview is to say what the server will actually decide.
     Order matters: an ordinal ladder has no parseable magnitudes, so if the
     relative check does not come first it reads as qualitative instead. */
  function preview(){
    var el=$('#tPrev'); if(!el) return;
    var vals=[1,2,3,4,5].map(function(i){ return String(($('#t'+i)||{}).value||'').trim(); });
    var EMPTY=/^(|-|--|—|–|n\/?a|na|nil|tbd)$/i;
    function isRel(v){ return /(^|[^A-Za-z])T\s*[+\-]\s*\d/i.test(v)||
      /on\s*time/i.test(v)||/as\s+per\b/i.test(v); }
    function val(v){
      if(EMPTY.test(v)||isRel(v)) return null;
      /* a hyphen after a LETTER is a separator, not a minus — "TGT-20 Days"
         must parse as 20, never as -20, or every DSO ladder inverts */
      var t=v.replace(/[₹$,]/g,' ').replace(/([A-Za-z])\s*-\s*/g,'$1 ');
      var rg=t.match(/(\d+(?:\.\d+)?)\s*[–—]\s*(\d+(?:\.\d+)?)/)||
             t.match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)/);
      if(rg) return (parseFloat(rg[1])+parseFloat(rg[2]))/2;
      var m=t.match(/-?\d+(?:\.\d+)?/);
      return m&&isFinite(parseFloat(m[0]))?parseFloat(m[0]):null;
    }
    var defined=0, relative=0, nums=[];
    vals.forEach(function(v){
      if(!EMPTY.test(v)) defined++;
      if(v&&isRel(v)) relative++;
      nums.push(val(v));
    });
    var got=nums.filter(function(x){ return x!==null; });
    if(relative>=2){
      el.innerHTML='<b>Ordinal</b> — Target 5 is best. The level is awarded here, '+
        'not measured from an actual.'; return;
    }
    if(defined<=1||!got.length){
      el.innerHTML='<b>Qualitative</b> — no numeric ladder, so the level has to be '+
        'awarded by hand.'; return;
    }
    var first=got[0], last=got[got.length-1], lower=last<first;
    var mono=true,prev=null;
    nums.forEach(function(v){ if(v===null) return;
      if(prev!==null){ if(!lower&&v<prev) mono=false; if(lower&&v>prev) mono=false; }
      prev=v; });
    el.innerHTML='<b>Numeric</b>, '+(lower?'lower is better':'higher is better')+
      ' — values '+JSON.stringify(nums)+
      (mono?'':'<br><span style="color:var(--crit)">Not monotonic: the five go up and down, '+
       'so the server will refuse this.</span>');
  }
  [1,2,3,4,5].forEach(function(i){ var el=$('#t'+i); if(el) el.oninput=preview; });
  preview();
  $('#tSave').onclick=function(){
    write('apiSaveTargets',{employee_id:empId,kpi_id:kpiId,
      t1:$('#t1').value,t2:$('#t2').value,t3:$('#t3').value,
      t4:$('#t4').value,t5:$('#t5').value},'Bands saved and level re-resolved.');
  };
}

      cols[4][0],y);
    var bands=(r.bands||[]).filter(function(b){ return String(b||'').trim()!==''; }).join(' | ');
    var wrapped=doc.splitTextToSize(bands,cols[5][2]);
    doc.text(wrapped,cols[5][0],y);
    var lines=Math.max(doc.splitTextToSize(String(r.kpi||''),cols[0][2]).length,wrapped.length);
    y+=(lines-1)*10;
  });
  y+=26; doc.setFontSize(8); doc.setTextColor(130);
  doc.text(doc.splitTextToSize('A level is the highest band cleared counting consecutively '+
    'from Target 1 — a gap stops the count. Unscored KPIs leave the rollup denominator '+
    'rather than counting as zero, so "measured" states how much of this scorecard the '+
    'overall score actually rests on.',W-2*x),x,y);
  doc.save('PerformanceTracker_scorecard_'+String(e.name).replace(/[^\w]+/g,'_')+'.pdf');
}

/* ================================= shell ================================== */
var NAV=[
  ['Performance',[['overview','Overview','grid'],['teams','Teams','layers'],
                  ['people','People','users']]],
  ['Framework',[['framework','KRA / KPI','card'],['review','Structure review','check']]],
  ['System',[['method','How it is calculated','info'],
             ['admin','Administration','cog']]]
];

function crumbs(){
  var c=[];
  if(S.route==='overview') c=['Performance','Overview'];
  else if(S.route==='teams') c=['Performance','Teams'];
  else if(S.route==='team') c=['Performance','Teams',teamLabel(M.teams[S.params[0]])||'Team'];
  else if(S.route==='people') c=['Performance','People'];
  else if(S.route==='emp') c=['Performance','People',(M.emps[S.params[0]]||{}).name||'Scorecard'];
  else if(S.route==='framework') c=['Framework','KRA / KPI'];
  else if(S.route==='review') c=['Framework','Structure review'];
  else if(S.route==='method') c=['System','How it is calculated'];
  else if(S.route==='admin') c=['System','Administration'];
  else c=['Not found'];
  return c.map(function(x,i){
    var last=i===c.length-1;
    return (i?'<span class="sep">/</span>':'')+
      (last?'<span class="cur">'+h(x)+'</span>':'<span>'+h(x)+'</span>'); }).join('');
}

function render(){
  destroyCharts();
  var root=$('#root');

  if(S.loading){
    root.innerHTML='<div class="app"><aside class="sb"></aside><div class="main">'+
      '<div class="top"></div><div class="content">'+
      '<div class="sk" style="height:34px;width:220px;margin-bottom:22px"></div>'+
      '<div class="row r-5">'+[1,2,3,4,5].map(function(){
        return '<div class="sk" style="height:96px"></div>'; }).join('')+'</div>'+
      '<div class="row r-2 mt">'+[1,2].map(function(){
        return '<div class="sk" style="height:300px"></div>'; }).join('')+'</div>'+
      '</div></div></div>';
    return;
  }
  if(S.error){
    root.innerHTML='<div style="max-width:620px;margin:16vh auto;padding:0 22px">'+
      '<div class="note '+(S.denied?'w':'c')+'" style="margin:0">'+svg('warn')+
      '<div><div class="t" style="font-size:17px">'+
      (S.denied?'This dashboard is not open to you':'Could not load Performance Tracker')+'</div>'+
      '<div class="m" style="margin-top:6px">'+h(S.error)+'</div>'+
      '<button class="btn" id="retry" style="margin-top:14px">Try again</button>'+
      '</div></div></div>';
    var rt=$('#retry'); if(rt) rt.onclick=function(){ boot(); };
    return;
  }

  var u=S.session||{};
  var nav=NAV.map(function(g){
    return '<div><div class="sb-g">'+h(g[0])+'</div>'+g[1].map(function(i){
      var on=S.route===i[0]||(S.route==='team'&&i[0]==='teams')||
             (S.route==='emp'&&i[0]==='people');
      return '<a class="sb-i'+(on?' on':'')+'" href="#/'+i[0]+'">'+svg(i[2])+
        '<span>'+h(i[1])+'</span></a>'; }).join('')+'</div>'; }).join('');

  var viewAs=u.can_switch&&S.users.length?
    '<select class="sel" id="viewAs" title="View the app as another role">'+
    '<option value="">Viewing as yourself</option>'+S.users.map(function(x){
      return '<option value="'+h(x.id)+'"'+(S.viewAs===x.id?' selected':'')+'>'+
        h(x.name)+' — '+h(roleName(x.role_id))+'</option>'; }).join('')+'</select>':'';

  var page=V[S.route], content;
  try{ content=page?page(S.params):emptyBox('Page not found','No page “'+S.route+'”.'); }
  catch(err){ content=emptyBox('This page could not be rendered',(err&&err.message)||String(err));
    if(window.console) console.error(err); }

  /* THE REVEALING CLASS IS EMITTED HERE, not added to the element afterwards.
     render() replaces root.innerHTML wholesale, so a class set on .app by the
     bootstrap callback is destroyed by the very next render — and route()
     calls one. The page would then never scale up, and the boot would look
     like a plain fade. finishBoot() removes it once the page is painted. */
  root.innerHTML=
    '<div class="app'+((S.reveal&&!lessMotion())?' revealing':'')+'">'+
      '<aside class="sb">'+
        '<div class="sb-brand"><div class="sb-logo">'+
          '<img src="'+LOGO+'" alt="Recykal" width="32" height="29">'+
        '</div>'+
        '<div class="sb-name">Performance Tracker<small>Individual KRA / KPI</small></div></div>'+
        '<nav class="sb-nav">'+nav+'</nav>'+
        '<div class="sb-foot">'+h(periodName(S.period))+'</div>'+
      '</aside>'+
      '<div class="main">'+
        '<header class="top">'+
          '<div class="crumbs">'+crumbs()+'</div><div class="spacer"></div>'+
          '<div class="search">'+svg('search')+
            '<input id="gs" placeholder="Search people, KRAs, KPIs…" autocomplete="off" '+
            'aria-label="Search">'+
            '<div class="sr" id="gsr"></div></div>'+
          viewAs+
          /* the month selector lives in the filter row now, not up here */
          '<div class="who"><div class="av">'+h(ini(u.name))+'</div><div>'+
            '<div class="n">'+h(u.name||'—')+'</div>'+
            '<div class="r">'+h(roleName(u.role_id))+'</div></div></div>'+
        '</header>'+
        ((u.open_access)?'<div class="uat">'+svg('warn')+'<span><b>UAT mode</b> — '+
          'everyone who opens this link gets full admin over all scorecards'+
          (u.open_access==='always'?' (no expiry set)':', until '+h(u.open_access))+
          '. Clear the PERFORMOS_OPEN_ACCESS script property before sharing more widely.'+
          '</span></div>':'')+
        '<main class="content">'+content+'</main>'+
      '</div>'+
    '</div>';
  wire();
  /* finishBoot owns playReveal when an overlay is up — it has to wait for
     the white to lift. It returns false when there is none (a view-as
     switch never paints one), and then the reveal is ours to run. */
  if(S.reveal){ S.reveal=false; if(!finishBoot()) playReveal(); }
}

/* The page-load reveal: tiles, then table rows, arriving in sequence rather
 * than all at once.
 *
 * The delay is set per element in JS because CSS cannot compute one from an
 * element's index, and it is CAPPED: with ~200 rows a fixed 18ms step would
 * take three and a half seconds to finish, so the tail all lands together.
 * An animation that outlives a reader's patience is worse than none.
 *
 * Only opacity and transform are animated — both composited, so a long list
 * does not thrash layout.
 *
 * NOT a count-up on the numbers. A figure that spins from 0 to 2.96 Cr is
 * briefly showing values that are not this person's, on a page whose whole
 * job is to state what their performance was. A number should be wrong for
 * zero milliseconds. */
/* ==========================================================================
 * THE BOOT SCREEN
 *
 * startBoot paints it; the teardown hands the mark over to the sidebar: freeze
 * the spin where it stands, fly the mark onto the sidebar logo's exact rect,
 * and fade the white out around it while playReveal staggers the tiles in.
 *
 * The rect is MEASURED with getBoundingClientRect rather than assumed, so it
 * lands correctly at any zoom or window width. It is measured AFTER the
 * hiding class comes off, because .app.revealing holds the page at scale(.94)
 * and a rect read through that transform is 6% out — the mark would land
 * beside the sidebar logo rather than on it.
 *
 * IT IS TIED TO THE DATA, NOT TO A TIMER. A fixed three-second hold would be
 * wrong in both directions: on a warm cache the server answers in well under a
 * second and the reader would be made to watch the rest of the countdown, and
 * on a cold one it takes longer, so the timer would lift the cover off an
 * empty page. So the overlay comes down WHEN THE DATA LANDS, with a floor of
 * BOOT_MIN_MS underneath it — long enough that a fast load still reads as a
 * considered pause rather than a flash — and no ceiling at all, because the
 * mark turns for as long as the load takes.
 *
 * finishBoot RETURNS whether it took the job on, because it also owns the call
 * to playReveal: when the overlay is up, the tiles must not stagger in behind
 * a cover that is still opaque — they would finish their entrance unseen. When
 * there is no overlay (a view-as switch), the caller runs playReveal itself.
 * ======================================================================== */
var _bootShown=false, _bootAt=0;
/* The floor, not the length. See above. */
var BOOT_MIN_MS=1750;

function lessMotion(){
  return !!(window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

function startBoot(){
  if(_bootShown) return;
  var ov=document.createElement('div');
  ov.className='boot'; ov.id='bootOverlay';
  /* The mark is decorative and hidden from assistive tech; the sentence is
     announced instead, so a reader who cannot see it is still told that
     something is loading rather than being left in silence. */
  ov.innerHTML='<div class="boot-inner">'+
    '<div class="boot-mark" id="bootMark" aria-hidden="true">'+
      '<img src="'+LOGO+'" alt=""></div>'+
    '<div class="boot-say" role="status">Preparing your performance dashboard'+
    '<span class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></span>'+
    '</div></div>';
  document.body.appendChild(ov);
  _bootShown=true; _bootAt=Date.now();
}

/* now=true skips the floor. Used by the two failure paths: somebody being told
   they were refused should be told at once, not after a pause staged to make a
   success feel considered. */
function finishBoot(now){
  if(!_bootShown) return false;
  _bootShown=false;
  var wait=(now||lessMotion())?0:Math.max(0,BOOT_MIN_MS-(Date.now()-_bootAt));
  if(wait>0) setTimeout(closeBoot,wait); else closeBoot();
  return true;
}

function closeBoot(){
  var ov=document.getElementById('bootOverlay');
  /* Cleared FIRST, and on every path including the one where the overlay has
     already gone missing. A decorative class left behind would hide the whole
     dashboard behind an invisible nothing. It also has to come off before the
     flight measures, or the target rect is read through scale(.94). */
  var app=$('.app'); if(app) app.classList.remove('revealing');
  if(!ov){ playReveal(); return; }
  if(lessMotion()){
    ov.classList.add('gone'); playReveal();
    setTimeout(function(){ if(ov.parentNode) ov.remove(); },400);
    return;
  }
  var mark=document.getElementById('bootMark');
  var target=$('.sb-logo img');
  /* Freeze the spin exactly where it stands before stopping it. Removing the
     animation drops the mark to its base transform, so without this it snaps
     upright a quarter-second before the flight — a visible jerk. */
  if(mark){
    var cur=window.getComputedStyle(mark).transform;
    if(cur && cur!=='none') mark.style.transform=cur;
  }
  ov.classList.add('done');
  setTimeout(function(){
    if(mark && target){
      var a=mark.getBoundingClientRect(), b=target.getBoundingClientRect();
      if(a.width && b.width){
        var k=b.width/a.width;
        var tx=(b.left+b.width/2)-(a.left+a.width/2);
        var ty=(b.top+b.height/2)-(a.top+a.height/2);
        /* No rotate() on the flight. It lands upright because the sidebar mark
           is upright, and the frozen angle means the turn it makes getting
           there is however far it still had to go — the spin finishing, rather
           than a separate extra revolution. */
        mark.style.transform='translate('+tx+'px,'+ty+'px) scale('+k+')';
      }
    }
    ov.classList.add('gone');
    /* The tiles start arriving as the white lifts, not before. */
    playReveal();
    setTimeout(function(){ if(ov.parentNode) ov.remove(); },900);
  },240);
}
function playReveal(){
  var els=$$('.content .tile, .content .pv tbody tr, .content .panel');
  var STEP=16, CAP=520;
  els.forEach(function(el,i){
    el.style.animationDelay=Math.min(i*STEP,CAP)+'ms';
    el.classList.add('rev');
  });
}
function wire(){
  var ps=$('#pSel');
  if(ps) ps.onchange=function(){ S.period=ps.value; reload(); };
  /* per-table month: no round trip, the rows already carry every month.
     $$ returns an array; $ returns one element. Using $ here threw a TypeError
     that aborted the whole of wire(), so every binding BELOW this point —
     view-as, row clicks, the filter row, search — silently stopped working
     too. A throw in a wiring function is never local to the line it is on. */
  $$('.tblm').forEach(function(el){
    el.onchange=function(){ S.tblMonth[el.getAttribute('data-tbl')]=el.value; render(); };
  });
  var va=$('#viewAs');
  if(va) va.onchange=function(){ S.viewAs=va.value||null; boot(true); };

  $$('[data-go]').forEach(function(el){
    el.addEventListener('click',function(ev){
      if(ev.target.closest('button')&&ev.target.closest('button')!==el) return;
      var go=el.getAttribute('data-go');
      /* A CARD SHOWS ITS OWN WORKING rather than navigating to a page of
         prose. Falls back to navigation if the key is unknown, so a card can
         never become a dead click. */
      if(go.indexOf('card:')===0){
        var m=cardDetail(go.slice(5));
        if(m){ ev.preventDefault(); openModal(m); return; }
        go='method';
      }
      location.hash='#/'+go;
    });
  });
  $$('[data-f]').forEach(function(el){
    el.onchange=function(){ S[el.getAttribute('data-f')]=el.value; render(); }; });
  $$('[data-clear]').forEach(function(el){
    el.onclick=function(){ S.fDept=S.fMgr=S.fSub=S.fLadder='';
      S.q=''; render(); }; });
  var fq=$('[data-fq]');
  if(fq) fq.oninput=debounce(function(){ S.q=fq.value; var at=document.activeElement===fq;
    render(); if(at){ var n=$('[data-fq]'); if(n){ n.focus(); n.setSelectionRange(
      n.value.length,n.value.length); } } },220);

  $$('[data-work]').forEach(function(el){ el.onclick=function(ev){
    ev.stopPropagation(); ev.preventDefault();
    var p=String(el.getAttribute('data-work')).split('|');
    modalWorking(p[0],p[1],p[2]||null); }; });
  $$('[data-cust]').forEach(function(el){ el.onclick=function(ev){ ev.stopPropagation();
    modalCustomers(el.getAttribute('data-cust')); }; });
  $$('[data-actual]').forEach(function(el){ el.onclick=function(ev){ ev.stopPropagation();
    var a=el.getAttribute('data-actual').split('|'); modalActual(a[0],a[1]); }; });
  $$('[data-targets]').forEach(function(el){ el.onclick=function(ev){ ev.stopPropagation();
    var a=el.getAttribute('data-targets').split('|'); modalTargets(a[0],a[1]); }; });
  $$('[data-assign]').forEach(function(el){ el.onclick=function(ev){ ev.stopPropagation();
    modalAssign(el.getAttribute('data-assign')); }; });
  $$('[data-close]').forEach(function(el){ el.onclick=closeModal; });
  $$('[data-xl]').forEach(function(el){ el.onclick=function(){
    exportXl(el.getAttribute('data-xl')); }; });
  $$('[data-pdf]').forEach(function(el){ el.onclick=function(){
    exportPdf(el.getAttribute('data-pdf')); }; });

  var ig=$('#impGo');
  if(ig) ig.onclick=function(){
    ig.disabled=true; ig.textContent='Importing…';
    Api.call('apiImportFromSource',[{sheet_id:$('#impId').value,period_id:S.period,
      replace:!!$('#impMode').value,view_as:S.viewAs}],function(res){
      ig.disabled=false; ig.innerHTML=svg('up')+' Run import';
      if(!res||!res.ok){ toast((res&&res.error)||'Import failed.','err'); return; }
      S.model=res.model; index(); render();
      var r=res.result||{};
      toast('Imported '+(r.assignments||0)+' assignments for '+(r.people||0)+' new people.');
    },function(e){ ig.disabled=false; ig.innerHTML=svg('up')+' Run import';
      toast((e&&e.message)||'Import failed.','err'); });
  };
  var rg=$('#recalcGo');
  if(rg) rg.onclick=function(){
    rg.disabled=true; rg.textContent='Recomputing…';
    Api.call('apiRecomputeAll',[{period_id:S.period,view_as:S.viewAs}],function(res){
      rg.disabled=false; rg.textContent='Recompute '+periodName(S.period);
      if(!res||!res.ok){ toast((res&&res.error)||'Recompute failed.','err'); return; }
      S.model=res.model; index(); render();
      toast('Recomputed '+(res.rows||0)+' rows.');
    },function(e){ rg.disabled=false; toast((e&&e.message)||'Failed.','err'); });
  };

  var gs=$('#gs');
  if(gs){
    gs.oninput=debounce(function(){ search(gs.value); },160);
    gs.onblur=function(){ setTimeout(function(){ var r=$('#gsr'); if(r) r.classList.remove('open'); },160); };
    gs.onfocus=function(){ if(gs.value) search(gs.value); };
  }
}
function debounce(fn,ms){ var t; return function(){ var a=arguments,s=this;
  clearTimeout(t); t=setTimeout(function(){ fn.apply(s,a); },ms); }; }

function search(q){
  var box=$('#gsr'); if(!box) return;
  q=String(q||'').trim().toLowerCase();
  if(q.length<2){ box.classList.remove('open'); box.innerHTML=''; return; }
  function hit(s){ return String(s||'').toLowerCase().indexOf(q)>=0; }
  var out='';
  var ppl=((S.model||{}).employees||[]).filter(function(e){
    return hit(e.name)||hit(e.designation); }).slice(0,6);
  if(ppl.length) out+='<div class="k">People</div>'+ppl.map(function(e){
    return '<a href="#/emp/'+h(e.id)+'">'+h(e.name)+
      '<span style="color:var(--ink-3)"> · '+h(e.designation||'')+'</span></a>'; }).join('');
  var tm=((S.model||{}).teams||[]).filter(function(t){
    return hit(t.name)||hit(teamLabel(t)); }).slice(0,4);
  if(tm.length) out+='<div class="k">Departments</div>'+tm.map(function(t){
    return '<a href="#/team/'+h(t.id)+'">'+h(teamLabel(t))+
      (teamShortened(t)?'<span style="color:var(--ink-3)"> · '+h(t.name)+'</span>':'')+
      '</a>'; }).join('');
  var seen={}, kp=[];
  rows().forEach(function(r){
    if(kp.length>=6||seen[r.kpi]) return;
    if(hit(r.kpi)){ seen[r.kpi]=1; kp.push(r); } });
  if(kp.length) out+='<div class="k">KPIs</div>'+kp.map(function(r){
    var e=M.emps[r.employee_id]||{};
    return '<a href="#/emp/'+h(r.employee_id)+'">'+h(r.kpi)+
      '<span style="color:var(--ink-3)"> · '+h(e.name||'')+'</span></a>'; }).join('');
  box.innerHTML=out||'<div class="k">Nothing found</div>';
  box.classList.add('open');
}

function parseHash(){
  var r=String(location.hash||'').replace(/^#\/?/,'').split('/')
    .filter(function(x){ return x!==''; });
  return {route:r[0]||'overview',params:r.slice(1)};
}
function route(){
  var p=parseHash(); S.route=p.route; S.params=p.params;
  closeModal(); render();
  var c=$('.content'); if(c) c.scrollTop=0;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape') closeModal();
  if(ev.key==='/'&&document.activeElement===document.body){
    var gs=$('#gs'); if(gs){ ev.preventDefault(); gs.focus(); } }
});

/* Changing the month is a full server round trip: buildModel_ re-reads every
 * table and re-parses every ladder for all 38 people. In Apps Script that is
 * seconds, not milliseconds, and three things made it feel broken rather than
 * slow:
 *
 *   1. NO FEEDBACK. The select changed, nothing else did, and the old month
 *      stayed on screen for several seconds. Indistinguishable from a dead
 *      control, which is why it was reported as "not working".
 *
 *   2. A STALE-RESPONSE RACE, which is a correctness bug and not just a
 *      nuisance. Every change fired another apiModel and the LAST response to
 *      arrive won — not the one for the month currently selected. Pick July
 *      then August quickly and July's slower reply lands second and overwrites
 *      August, so the page shows July's numbers under August's heading. That is
 *      the "sometimes not working". The sequence number makes any reply that is
 *      not the newest request get dropped.
 *
 *   3. NO CACHING. Going back to a month you had already opened paid the full
 *      round trip again.
 *
 * The cache is per period and is dropped whenever a write lands, because a
 * saved actual or band changes the model the server would return. */
var _modelCache={}, _reloadSeq=0;
function invalidateModelCache(){ _modelCache={}; }
function reload(){
  var want=String(S.period);
  if(_modelCache[want]){
    S.periodBusy=false; S.model=_modelCache[want]; index(); render(); return;
  }
  var mine=++_reloadSeq;
  S.periodBusy=true; render();
  Api.call('apiModel',[want],function(res){
    if(mine!==_reloadSeq) return;   /* a newer month was picked; this reply is stale */
    S.periodBusy=false;
    if(!res||!res.ok){ render();
      toast((res&&res.error)||'Could not load that period.','err'); return; }
    _modelCache[want]=res.model;
    S.model=res.model; S.period=res.model.period_id; index(); render();
  },function(e){
    if(mine!==_reloadSeq) return;
    S.periodBusy=false; render();
    toast((e&&e.message)||'Could not reach the server.','err');
  });
}
function boot(quiet){
  /* The boot screen belongs to a PAGE LOAD, not to a view-as switch: quiet is
     true when the reader changed who they are looking at, and covering the
     page for that would read as a fault rather than as loading. */
  if(!quiet){ S.loading=true; startBoot(); render(); }
  Api.call('apiBootstrap',[S.period,S.viewAs],function(res){
    S.loading=false;
    if(!res||!res.ok){
      /* Denied is the likeliest real outcome for somebody not yet in USERS,
         and it returns EARLY. Without this the overlay stays up and they watch
         somebody write in a book for ever instead of reading why. */
      finishBoot(true);
      S.denied=!!(res&&res.denied);
      S.error=(res&&res.error)||'The server returned nothing.';
      render(); return;
    }
    S.error=null; S.denied=false;
    /* a page load, not a filter change — this is the one time it plays */
    S.reveal=true;
    S.session=res.session; S.users=res.users||[]; S.model=res.model;
    S.period=res.model.period_id;
    index();
    if(!location.hash){ location.hash='#/overview'; } else { route(); }
  },function(e){
    /* The overlay is torn down on the ERROR path too. A load that fails must
       show the reader the error, not a figure writing for ever. */
    S.loading=false; finishBoot(true);
    S.error=(e&&e.message)||'Could not reach the server.'; render();
  });
}

window.__PerfTracker={S:S,M:M,V:V,boot:boot,render:render,index:index};
window.__PerformOS=window.__PerfTracker;   /* old handle kept: the preview harness uses it */
boot();
})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRA / KPI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   KRA / KPI Tracker
   ----------------------------------------------------------------------------
   The product answers four questions in order — who, what, how much, how well —
   and shows nothing that does not serve one of them.

   Three levels, and nothing beyond them is visible by default:
       TEAMS  →  TEAM FLOW  →  PERSON  →  KPI

   The restraint is the design. Almost monochrome until performance requires
   emphasis; typography and space carry hierarchy so most values need no box
   around them at all.
   ============================================================================ */
:root{
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

  --bg:#FAFAFA;--card:#FFFFFF;--surface:#F4F4F5;--well:#E9E9EC;
  --ink:#18181B;--ink-2:#3F3F46;--muted:#71717A;--faint:#A1A1AA;
  --line:#E7E7EA;--line-2:#D6D6DB;--line-soft:#F1F1F3;

  /* Status is the only colour, and it is muted enough that a screen full of it
     still reads as one calm surface. */
  --good:#2F6B4F;--good-soft:#EAF2ED;
  --warn:#8A6320;--warn-soft:#F7F0E3;
  --bad:#9C3B32;--bad-soft:#F7EAE8;

  --fs-hero:44px;--fs-xxl:30px;--fs-xl:19px;--fs-lg:15px;--fs-md:14px;
  --fs-sm:13px;--fs-xs:12px;--fs-2xs:11px;
  --fw-n:400;--fw-m:500;--fw-b:600;

  --r-ctl:6px;--r-card:10px;--r-lg:14px;--r-pill:999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:40px;--s8:56px;--s9:80px;

  --e1:0 1px 2px rgba(24,24,27,.04);
  --e2:0 1px 3px rgba(24,24,27,.06),0 10px 24px -16px rgba(24,24,27,.16);
  --e3:0 24px 56px -20px rgba(24,24,27,.24);

  --ease:cubic-bezier(.2,.6,.35,1);--d1:130ms;--d2:220ms;
  --maxw:1000px;--nodew:190px;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:var(--fs-sm);
  line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:'tnum' 1,'cv11' 1;letter-spacing:-.006em}
button,select{font-family:inherit;cursor:pointer}
b,strong{font-weight:var(--fw-b)}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--r-ctl)}

/* ---------------------------------------------------------------- CHROME --
   The navigation almost disappears: a wordmark, the period, and — once you are
   inside a team — the team names as plain text. The platform is the navigation. */
.top{position:sticky;top:0;z-index:30;background:rgba(250,250,250,.85);
  backdrop-filter:saturate(150%) blur(10px);border-bottom:1px solid var(--line)}
.nav{max-width:var(--maxw);margin:0 auto;padding:0 var(--s5);min-height:54px;
  display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap}
.mark{font-size:var(--fs-xs);font-weight:var(--fw-b);letter-spacing:.02em;color:var(--ink);
  white-space:nowrap;border:none;background:none;padding:0}
.mark:hover{color:var(--muted)}
.teams{display:flex;gap:var(--s4);overflow-x:auto;flex:1;scrollbar-width:none;align-items:center}
.teams::-webkit-scrollbar{display:none}
.tb{border:none;background:transparent;color:var(--muted);font-size:var(--fs-xs);
  font-weight:var(--fw-m);padding:4px 0;white-space:nowrap;position:relative;
  transition:color var(--d1) var(--ease)}
.tb:hover{color:var(--ink)}
.tb.on{color:var(--ink);font-weight:var(--fw-b)}
.tb.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--ink)}
.tb .ts{display:none}

.wrap{max-width:var(--maxw);margin:0 auto;padding:var(--s8) var(--s5) var(--s9)}
.demo{border-bottom:1px solid var(--line);background:var(--good-soft)}
.demo .in{max-width:var(--maxw);margin:0 auto;padding:7px var(--s5);display:flex;align-items:center;
  gap:var(--s2);font-size:var(--fs-xs);color:var(--good)}
.demo button{margin-left:auto;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);
  font-size:var(--fs-2xs);font-weight:var(--fw-m);padding:3px 10px;border-radius:var(--r-pill)}
.demo button:hover{border-color:var(--ink)}

.sel{border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-size:var(--fs-xs);
  font-weight:var(--fw-m);padding:5px var(--s3);border-radius:var(--r-ctl);
  transition:border-color var(--d1) var(--ease)}
.sel:hover:not(:disabled){border-color:var(--ink)}
.sel:disabled{color:var(--faint);background:var(--surface);cursor:not-allowed}
.nav .sel{margin-left:auto}

.back{border:none;background:none;color:var(--muted);font-size:var(--fs-xs);font-weight:var(--fw-m);
  padding:0;margin-bottom:var(--s5);display:inline-flex;align-items:center;gap:5px;
  transition:color var(--d1) var(--ease)}
.back:hover{color:var(--ink)}

/* ----------------------------------------------------------------- TEAMS --
   The landing screen is deliberately almost empty: a title, and the five places
   you can go. No totals, no charts, no summary. */
.page-t{font-size:var(--fs-xxl);font-weight:var(--fw-b);letter-spacing:-.03em;margin:0 0 var(--s2)}
.page-s{font-size:var(--fs-sm);color:var(--muted);margin:0 0 var(--s8)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s4)}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  padding:var(--s5);text-align:left;display:flex;flex-direction:column;gap:var(--s5);
  min-height:150px;cursor:pointer;
  transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.tcard:hover{border-color:var(--line-2);box-shadow:var(--e2)}
.tcard .tt{display:block;font-size:var(--fs-2xs);font-weight:var(--fw-b);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);line-height:1.4}
.tcard .tm{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:var(--s1);line-height:1.5}
.tcard .tv{margin-top:auto;display:block}
.tcard .tv .l{display:block;font-size:var(--fs-2xs);color:var(--muted)}
.tcard .tv .v{display:block;font-size:var(--fs-xxl);font-weight:var(--fw-b);letter-spacing:-.03em;
  line-height:1;font-variant-numeric:tabular-nums;margin-top:var(--s1)}
.tcard .tv .v em{font-style:normal;font-size:var(--fs-sm);color:var(--faint);font-weight:var(--fw-m)}

/* ------------------------------------------------------------- TEAM FLOW --
   People as performance nodes, not profile cards. Each node carries a name, a
   role and a score — enough to answer "who is performing well", and nothing
   that would begin to answer "why", which belongs inside the profile.

   The connectors are hairlines. They state the reporting relationship and then
   get out of the way. */
.flow{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:var(--s7)}
.lvl{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--s4);width:100%}
.drop{width:1px;height:var(--s5);background:var(--line-2);flex:0 0 auto}
.branch{display:flex;justify-content:center;width:100%}
.branch .arm{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;
  align-items:center}
.branch .arm::before{content:"";position:absolute;top:0;height:1px;background:var(--line-2);left:0;right:0}
.branch .arm:first-child::before{left:50%}
.branch .arm:last-child::before{right:50%}
.branch .arm:only-child::before{display:none}
.branch .arm .stem{width:1px;height:var(--s5);background:var(--line-2);flex:0 0 auto}

/* Two fixed rows: identity on top, performance pinned to the bottom. Because
   the identity block reserves exactly two lines for the role, the score, the
   stage word and the bar land on the same baseline in every card in the row —
   a name that wraps can never push one card's bar out of line with its
   neighbours'. */
.node{width:var(--nodew);background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-card);padding:var(--s4);text-align:left;cursor:pointer;
  display:grid;grid-template-rows:auto 1fr;gap:var(--s4);
  transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.node:hover{border-color:var(--line-2);box-shadow:var(--e2)}
.node:active{background:var(--surface)}
/* The lead is one step larger — the only size difference in the chart, and it
   carries the hierarchy without a heavier border or a colour. */
.node.lead{width:calc(var(--nodew) + 28px);box-shadow:var(--e1)}
.node .nh,.node .nf{display:block;min-width:0}
.node .nf{align-self:end}
.node .nm{display:block;font-size:var(--fs-sm);font-weight:var(--fw-b);line-height:17px;height:17px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* exactly two lines are reserved, so no node can grow taller than its siblings */
.node .rl{display:-webkit-box;font-size:var(--fs-2xs);color:var(--muted);line-height:1.35;
  margin-top:3px;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:30px}
/* score and stage share a baseline; the score is the anchor and the word is
   set small and quiet beside it, so the figure is still what you read first */
.node .sr{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2)}
.node .sc{font-size:var(--fs-xl);font-weight:var(--fw-b);letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.node.lead .sc{font-size:var(--fs-xxl)}
.node .sc em{font-style:normal;font-size:var(--fs-xs);color:var(--faint);font-weight:var(--fw-m)}
.node .stg{font-size:var(--fs-2xs);font-weight:var(--fw-b);white-space:nowrap;letter-spacing:.01em}
.node .stg.good{color:var(--good)}
.node .stg.warn{color:var(--warn)}
.node .stg.bad{color:var(--bad)}
.node .stg.none{color:var(--faint);font-weight:var(--fw-m)}

/* The bar itself. Notches are cut in the card's own colour so they read as
   breaks in the fill rather than marks on top of it. */
.pb{display:block;position:relative;height:6px;margin-top:var(--s3);
  background:var(--well);border-radius:var(--r-pill);overflow:hidden}
.pb i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);
  background:var(--ink);transition:width var(--d2) var(--ease)}
.pb i.good{background:var(--good)}
.pb i.warn{background:var(--warn)}
.pb i.bad{background:var(--bad)}
.pb i.none{background:var(--line-2)}
.pb u{position:absolute;top:0;width:1.5px;height:100%;background:var(--card);
  transform:translateX(-.75px)}
.gnode .pb u{background:var(--surface)}
.gnode.open .pb u,.gnode:hover .pb u{background:var(--card)}


/* A function tier, not a person. It is visibly a different kind of object —
   flatter, on the sunken surface, with a chevron — so no one mistakes it for
   someone they can open a profile on. */
/* Same two-row skeleton as a person node, so the two kinds of card align to
   the same internal grid and their bars sit at the same height when they share
   a row. */
.gnode{width:var(--nodew);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-card);padding:var(--s4);text-align:left;cursor:pointer;
  display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;
  gap:var(--s4) var(--s3);
  transition:border-color var(--d1) var(--ease),background var(--d1) var(--ease)}
.gnode:hover{border-color:var(--line-2);background:var(--card)}
.gnode.open{background:var(--card);border-color:var(--line-2)}
.gnode .gh{grid-column:1;grid-row:1;min-width:0}
.gnode .gt{display:block;font-size:var(--fs-2xs);font-weight:var(--fw-b);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);line-height:17px;height:17px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* one line here against the person card's two, plus the chevron row, brings
   both card types to the same height */
.gnode .gm{display:block;font-size:var(--fs-2xs);color:var(--muted);margin-top:3px;height:30px}
.gnode .gc{grid-column:2;grid-row:1;font-size:var(--fs-lg);color:var(--faint);
  width:18px;text-align:center;line-height:1.2}
.gnode:hover .gc,.gnode.open .gc{color:var(--ink)}
.gnode .gf{grid-column:1/-1;grid-row:2;align-self:end;min-width:0}
.gnode .sr{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2)}
.gnode .gs{font-size:var(--fs-xl);font-weight:var(--fw-b);letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.gnode .gs em{font-style:normal;font-size:var(--fs-xs);color:var(--faint);font-weight:var(--fw-m)}
.gnode .stg{font-size:var(--fs-2xs);font-weight:var(--fw-b);white-space:nowrap}
.gnode .stg.good{color:var(--good)}
.gnode .stg.warn{color:var(--warn)}
.gnode .stg.bad{color:var(--bad)}
.gnode .stg.none{color:var(--faint);font-weight:var(--fw-m)}
@media(max-width:760px){.gnode{width:100%;max-width:300px}}
/* --------------------------------------------------------------- PROFILE --
   One dominant figure, three stats, then the KRAs that explain it. */
.prof{display:flex;align-items:flex-start;gap:var(--s6);flex-wrap:wrap;margin-bottom:var(--s8)}
.prof .pid h1{font-size:var(--fs-xxl);font-weight:var(--fw-b);margin:0;letter-spacing:-.03em;line-height:1.15}
.prof .pid .meta{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--s2);line-height:1.6}
.prof .pr{margin-left:auto;display:flex;align-items:center;gap:var(--s7)}
.ring{position:relative;width:112px;height:112px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .tr{fill:none;stroke:var(--well);stroke-width:6}
.ring .fg{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0}
.ring .lbl b{font-size:var(--fs-xxl);font-weight:var(--fw-b);letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;line-height:1}
.ring .lbl span{font-size:var(--fs-2xs);color:var(--faint);margin-top:2px}
/* Three stats. Not four, not a grid of tiles — a short list set in type. */
.pstat{display:flex;flex-direction:column;gap:var(--s4)}
.pstat .si{display:flex;align-items:baseline;gap:var(--s4);justify-content:space-between;min-width:180px}
.pstat .si .l{font-size:var(--fs-xs);color:var(--muted)}
.pstat .si .v{font-size:var(--fs-lg);font-weight:var(--fw-b);font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}

/* ------------------------------------------------------------- KRA / KPI --
   The KRA heading is the navigation hierarchy; a rule and a label are enough.
   Each KPI is a row, not a card: name and weightage on one line, the numbers
   on the next, and a hairline bar beneath. Rows sit directly on the page, so
   twelve of them still read as one list rather than twelve objects. */
.kra-h{display:flex;align-items:baseline;gap:var(--s3);margin:var(--s7) 0 var(--s2)}
.kra-h .t{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--ink);
  text-transform:uppercase;letter-spacing:.11em;white-space:nowrap}
.kra-h .ln{flex:1;height:1px;background:var(--line)}
.kra-h .r{font-size:var(--fs-2xs);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.krow{display:block;width:100%;text-align:left;border:none;background:none;
  padding:var(--s4) var(--s3);border-bottom:1px solid var(--line-soft);cursor:pointer;
  transition:background var(--d1) var(--ease)}
.krow:hover{background:var(--card)}
.krow:last-child{border-bottom:none}
.krow .r1{display:flex;align-items:baseline;gap:var(--s4)}
.krow .kn{font-size:var(--fs-md);font-weight:var(--fw-b);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.012em}
.krow .kw{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.krow .r2{display:flex;align-items:baseline;gap:var(--s4);margin-top:var(--s2)}
.krow .flow-v{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow .flow-v b{color:var(--ink);font-weight:var(--fw-m)}
.krow .ach{font-size:var(--fs-md);font-weight:var(--fw-b);font-variant-numeric:tabular-nums;
  flex:0 0 auto;letter-spacing:-.015em}
.krow .ach.good{color:var(--good)}
.krow .ach.warn{color:var(--warn)}
.krow .ach.bad{color:var(--bad)}
.krow .ach.none{color:var(--faint);font-weight:var(--fw-m)}
.kbar{margin-top:var(--s3);height:3px;background:var(--well);border-radius:var(--r-pill);
  position:relative;overflow:hidden}
.kbar i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-pill);background:var(--ink)}
.kbar i.good{background:var(--good)}
.kbar i.warn{background:var(--warn)}
.kbar i.bad{background:var(--bad)}

/* ---------------------------------------------------------------- DRAWER --
   One slim panel from the right. No modal stack, no nested popups. */
.scrim{position:fixed;inset:0;background:rgba(24,24,27,.28);opacity:0;pointer-events:none;
  transition:opacity var(--d2) var(--ease);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:calc(100vw - 32px);
  background:var(--card);border-left:1px solid var(--line);box-shadow:var(--e3);z-index:41;
  transform:translateX(100%);transition:transform var(--d2) var(--ease);
  overflow-y:auto;display:flex;flex-direction:column}
.modal.on{transform:none}
.m-h{padding:var(--s6) var(--s5) var(--s4);display:flex;align-items:flex-start;gap:var(--s3)}
.m-h h2{font-size:var(--fs-xl);font-weight:var(--fw-b);margin:0;letter-spacing:-.022em;line-height:1.25}
.m-h .sub{font-size:var(--fs-2xs);color:var(--muted);margin-top:var(--s1);text-transform:uppercase;
  letter-spacing:.11em;font-weight:var(--fw-b)}
.m-h .x{margin-left:auto;border:none;background:none;color:var(--faint);font-size:var(--fs-xl);
  line-height:1;padding:0 2px;flex:0 0 auto;transition:color var(--d1) var(--ease)}
.m-h .x:hover{color:var(--ink)}
.m-b{padding:0 var(--s5) var(--s7)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--s3) var(--s4);
  padding-top:var(--s4);border-top:1px solid var(--line)}
.kv dt{color:var(--muted);font-size:var(--fs-xs);white-space:nowrap}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:var(--fw-m);
  font-size:var(--fs-sm)}
.kv dd.hi{font-weight:var(--fw-b)}
.sect-t{font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--muted);text-transform:uppercase;
  letter-spacing:.11em;margin:var(--s6) 0 var(--s3);padding-top:var(--s4);
  border-top:1px solid var(--line)}
.goal p{margin:0;color:var(--ink-2);line-height:1.65;font-size:var(--fs-xs)}
.m-perf .n{font-size:var(--fs-xxl);font-weight:var(--fw-b);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1}
.m-perf .n.good{color:var(--good)}.m-perf .n.warn{color:var(--warn)}.m-perf .n.bad{color:var(--bad)}
.m-perf .kbar{margin-top:var(--s3);height:4px}

/* ----------------------------------------------------------------- STATE -- */
.state{display:grid;place-items:center;min-height:52vh;text-align:center}
.state h2{font-size:var(--fs-xl);font-weight:var(--fw-b);margin:0 0 var(--s2)}
.state p{color:var(--muted);margin:0 0 var(--s4);max-width:46ch;line-height:1.6}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r-ctl);
  padding:8px 16px;font-size:var(--fs-sm);font-weight:var(--fw-m);
  transition:opacity var(--d1) var(--ease)}
.btn:hover{opacity:.86}
.btn.ghost{background:var(--card);border-color:var(--line-2);color:var(--ink-2);margin-left:var(--s2)}
.btn.ghost:hover{border-color:var(--ink);color:var(--ink);opacity:1}
.state .btn{margin-top:var(--s2)}
.empty{padding:var(--s6);text-align:center;color:var(--muted);font-size:var(--fs-xs)}
.hint{font-size:var(--fs-xs);color:var(--muted);margin-top:var(--s7);line-height:1.6}
.skl{background:linear-gradient(90deg,var(--surface),var(--well),var(--surface));
  background-size:200% 100%;border-radius:var(--r-card);animation:sh 1.4s ease-in-out infinite}
@keyframes sh{to{background-position:-200% 0}}

/* -------------------------------------------------------------- RESPONSE --
   The flow becomes a single column; a child still sits below its parent joined
   by the same hairline, so the structure survives the narrowing. */
@media(max-width:760px){
  .nav{padding:var(--s2) var(--s4);gap:var(--s3)}
  .nav .sel{margin-left:auto}
  .teams{order:3;flex-basis:100%;gap:var(--s4);padding-bottom:var(--s1)}
  .wrap{padding:var(--s6) var(--s4) var(--s8)}
  .demo .in{padding-left:var(--s4);padding-right:var(--s4)}
  .prof{gap:var(--s5)}
  .prof .pr{margin-left:0;width:100%;justify-content:space-between;gap:var(--s5)}
  .lvl,.branch{flex-direction:column;align-items:center;gap:var(--s3)}
  .branch{gap:0}
  .branch .arm{width:100%}
  .branch .arm::before{display:none}
  .branch .arm .stem{height:var(--s4)}
  .node,.node.lead{width:100%;max-width:300px}
  .modal{width:100%;max-width:100%}
}
@media(pointer:coarse){.tb,.btn,.sel{min-height:40px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<header class="top"><div class="nav">
  <button class="mark" data-crumb="teams">KRA / KPI Tracker</button>
  <nav class="teams" id="teams"></nav>
  <span id="months"></span>
</div></header>
<div id="demo"></div>
<main class="wrap" id="view"></main>
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="KPI detail"></div>

<script>
'use strict';
/* ============================================================================
   KRA / KPI Tracker
   ----------------------------------------------------------------------------
   Api -> Store -> Sel -> render. One backend call; every derived list computed
   in one place; pure render functions.

   The frontend calculates nothing about performance. Achievement %, weighted
   score, level and status arrive derived from the backend, which owns the
   scoring rules. The only arithmetic here is presentational rollup - restating
   backend weighted scores at KRA or team grain - and it is marked where it
   happens.

   Nothing about any team is hard-coded. Teams, people, KRAs, KPIs, weightages,
   units, directions and thresholds all arrive from apiMasterModel().
   ============================================================================ */

var $ = function (s) { return document.querySelector(s); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
var n1 = function (v) { return (v == null || v === '' || isNaN(v)) ? null : Math.round(v * 10) / 10; };
var show = function (v) { var n = n1(v); return n == null ? '—' : n; };

var S = { model: null, loading: true, error: null,
          team: null, employee: null, month: null, kra: '', kpi: '', region: '',
          showFilters: false, closed: {}, open: {}, detail: null, demo: false, _demo: null };

/* ============================== API ====================================== */
var Api = {
  live: function () { return !!(window.google && google.script && google.script.run); },
  fetch: function (month, done, fail) {
    if (!Api.live()) return fail({ message: 'Open this page through the deployed Apps Script URL to load live data.' });
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).apiMasterModel(null, month || null);
  },
  /* If the model comes back empty we need to know which failure it was, so the
   * message can name a cause instead of guessing. apiPing carries almost no
   * payload: if it answers, the deployment and permissions are fine and the
   * problem was the model's data; if it does not, the deployment is stale. */
  ping: function (done, fail) {
    if (!Api.live()) return fail({ message: 'Not running inside the deployed web app.' });
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).apiPing();
  }
};

/* ============================== DEMO =====================================
   Placeholder values for visual demonstration only, confined to this function.
   It clones the model, fills targets and actuals, then re-derives using the
   SAME rules the backend applies - 105% cap, direction-aware, weightage x
   achievement - so the shape on screen matches the real thing. Delete this and
   its toggle; nothing else changes. */
var Demo = {
  seed: function (s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0x7fffffff; return h; },
  apply: function (model) {
    var c = JSON.parse(JSON.stringify(model));
    /* The period is part of the seed, so each month produces its own targets
       and actuals and the month filter visibly changes the numbers. Without it
       every period would render identically and the control would look broken. */
    var period = S.month || c.month || (c.months && c.months[c.months.length - 1]) || '';
    c.month = period;
    c.scorecards.forEach(function (sc) {
      sc.kpis.forEach(function (k) {
        var seed = Demo.seed(period + sc.employee_id + k.kra + k.kpi), lower = k.direction === 'LOWER_IS_BETTER';
        var target = lower ? 5 : k.unit === 'CR' ? 1 + (seed % 900) / 100
                   : k.unit === 'PERCENT' ? 90 + (seed % 10) : 2 + (seed % 12);
        var ratio = 0.62 + ((seed >> 3) % 55) / 100;
        k.target = Math.round(target * 100) / 100;
        k.actual = lower ? Math.max(1, Math.round(target / ratio)) : Math.round(target * ratio * 100) / 100;
        k.variance = Math.round((k.actual - k.target) * 100) / 100;
        var ach = lower ? k.target / k.actual * 100 : k.actual / k.target * 100;
        k.achievement = Math.round(Math.min(ach, 105) * 10) / 10;
        k.weighted_score = Math.round(k.weightage * (k.achievement / 100) * 1000) / 1000;
        k.performance_level = k.achievement >= 100 ? 5 : k.achievement >= 90 ? 4 : k.achievement >= 75 ? 3 : k.achievement >= 60 ? 2 : 1;
        k.status = ['', 'Below Target', 'Below Target', 'At Risk', 'Achieved', 'Achieved'][k.performance_level];
      });
      var e = 0, m = 0;
      sc.kpis.forEach(function (k) { e += k.weighted_score; m += k.weightage; });
      sc.measured_weightage = m; sc.overall_score = m ? Math.round(e * 10) / 10 : null;
    });
    c.months = (c.months && c.months.length) ? c.months : ['2026-06', '2026-07', '2026-08'];
    c.month = c.month || c.months[c.months.length - 1];
    return c;
  }
};

/* ============================== SELECTORS ================================ */
/* ============================== SEED =====================================
   The structural model the app falls back to when no backend is reachable, so
   the whole interface can be seen and operated before a sheet is connected.
   It carries STRUCTURE ONLY - teams, people, KRAs, KPIs, weightages, units and
   directions. It holds no target, no actual and no score; Demo fills those and
   labels them as sample values on screen.

   The moment apiMasterModel answers, the real model replaces this wholesale.
   Everything here is confined to this one object: delete it and the app still
   works against the backend, it simply has nothing to show until data loads. */
var Seed = {
  KPIS: [
    { perspective: 'Process',  kra: 'Retention',   kpi: 'Repeat Seller Transaction Rate',   weightage: 5,  unit: 'PERCENT', direction: 'HIGHER_IS_BETTER', goal: 'Share of existing sellers transacting again in the month.' },
    { perspective: 'Customer', kra: 'Acquisition', kpi: 'New Buyer Acquisition',            weightage: 15, unit: 'COUNT',   direction: 'HIGHER_IS_BETTER', goal: 'New buyers onboarded against the monthly plan.' },
    { perspective: 'Customer', kra: 'Acquisition', kpi: 'New Seller Acquisition',           weightage: 15, unit: 'COUNT',   direction: 'HIGHER_IS_BETTER', goal: 'New sellers onboarded against the monthly plan.' },
    { perspective: 'Process',  kra: 'Activation',  kpi: 'New Buyer Same-Month Transaction', weightage: 5,  unit: 'PERCENT', direction: 'HIGHER_IS_BETTER', goal: 'New buyers who transact within their onboarding month.' },
    { perspective: 'Sales',    kra: 'GMV',         kpi: 'Monthly GMV Target Achievement',   weightage: 40, unit: 'CR',      direction: 'HIGHER_IS_BETTER', goal: 'Delivered GMV against the monthly buyer-wise plan.' },
    { perspective: 'Sales',    kra: 'Closure',     kpi: 'Successfully Closed Transactions', weightage: 10, unit: 'COUNT',   direction: 'HIGHER_IS_BETTER', goal: 'Transactions closed end to end, including POD.' },
    { perspective: 'Process',  kra: 'Cash Flow',   kpi: 'Days Sales Outstanding',           weightage: 10, unit: 'DAYS',    direction: 'LOWER_IS_BETTER',  goal: 'Average days to collect. Lower is better.' }
  ],
  TEAMS: [
    { team_id: 'MET', team_name: 'Metal', team_lead: 'Amit', people: [
      ['MET001', 'Amit',                'Team Lead — Business Development',        'Central'],
      ['MET002', 'Arijit Dutta',       'Senior Executive — Business Development', 'East'],
      ['MET003', 'Arghyadeep Samanta', 'Senior Executive — Business Development', 'East'],
      ['MET004', 'Abhisek Sanyal',     'Assistant Manager — Business Development','South'],
      ['MET005', 'Adarsh Krishna',     'Assistant Manager — Business Development','South'],
      ['MET006', 'Ayush Goyal',        'Assistant Manager — Business Development','East']
    ]},
    /* Plastic runs through two functions, so its people carry a sub_team and
       the chart grows a tier between the lead and the members. Nothing about
       this is specific to Plastic in the code — any team whose people carry a
       sub_team will draw the same way. */
    { team_id: 'PLA', team_name: 'Plastic', team_lead: 'Tabesh', people: [
      ['PLA001', 'Tabesh',        'Team Lead — Business Development',         'West',  null],
      ['PLA002', 'Rahul Sharma',  'Senior Executive — Supply',                'West',  'Supply'],
      ['PLA003', 'Nikhil Verma',  'Assistant Manager — Supply',               'North', 'Supply'],
      ['PLA004', 'Sneha Iyer',    'Senior Executive — Demand',                'South', 'Demand'],
      ['PLA005', 'Imran Qureshi', 'Assistant Manager — Demand',               'West',  'Demand']
    ]},
    { team_id: 'ONB', team_name: 'Onboarding', team_lead: 'Ajay', people: [
      ['ONB001', 'Ajay',          'Team Lead — Onboarding',       'Central'],
      ['ONB002', 'Naveen Ranga',  'Executive — Onboarding',       'South'],
      ['ONB003', 'Vishwash Tiwari','Executive — Onboarding',      'Central']
    ]},
    { team_id: 'COL', team_name: 'Collections', team_lead: 'Srinivas', people: [
      ['COL001', 'Srinivas',    'Team Lead — Collections', 'West'],
      ['COL002', 'Megaraj S',   'Executive — Collections', 'South']
    ]},
    { team_id: 'MCT', team_name: 'Marketplace — Control Tower', team_lead: 'Ashwin', people: [
      ['MCT001', 'Ashwin',       'Team Lead — Control Tower',  'Central'],
      ['MCT002', 'Priya Menon',  'Executive — Control Tower','South'],
      ['MCT003', 'Karan Bhatia', 'Executive — Control Tower','North']
    ]}
  ],
  model: function () {
    return {
      ok: true,
      placeholder: true,
      months: ['2026-06', '2026-07', '2026-08'],
      month: '2026-08',
      teams: Seed.TEAMS.map(function (t) {
        return { team_id: t.team_id, team_name: t.team_name, team_lead: t.team_lead };
      }),
      kpis: Seed.KPIS.map(function (k) { return JSON.parse(JSON.stringify(k)); }),
      scorecards: Seed.TEAMS.reduce(function (acc, t) {
        t.people.forEach(function (p) {
          acc.push({
            team_id: t.team_id, employee_id: p[0], employee_name: p[1],
            designation: p[2], region: p[3],
            /* The lead is the first person listed; everyone else reports to
               them. The real EMPLOYEE_MASTER carries manager_id and will
               replace this the moment the sheet is connected. */
            manager_id: p[1] === t.team_lead ? null : t.people[0][0],
            sub_team: p[4] || null,
            kpis: Seed.KPIS.map(function (k) { return JSON.parse(JSON.stringify(k)); })
          });
        });
        return acc;
      }, [])
    };
  }
};

/* ============================== SUMMARY ==================================
   The four figures a lead reads first, in the order the questions arrive:
   how are we doing, is the revenue line landing, is onboarding landing, and
   what is broken. Each is a rollup of backend weighted scores - none of them
   originates a number. */
var Sel = {
  model: function () { return S.demo && S.model ? (S._demo || (S._demo = Demo.apply(S.model))) : S.model; },
  teams: function () { var m = Sel.model(); return (m && m.teams) || []; },
  team: function () { return Sel.teams().filter(function (t) { return t.team_id === S.team; })[0] || null; },
  employee: function () {
    return Sel.members().filter(function (m) { return m.employee_id === S.employee; })[0] || null;
  },
  months: function () { var m = Sel.model(); return (m && m.months) || []; },
  members: function () {
    var m = Sel.model();
    return ((m && m.scorecards) || []).filter(function (s) { return s.team_id === S.team; });
  },
  visible: function () {
    var l = Sel.members();
    if (S.region) l = l.filter(function (m) { return (m.region || 'Unassigned') === S.region; });
    return S.employee ? l.filter(function (m) { return m.employee_id === S.employee; }) : l;
  },
  regions: function () {
    var seen = {}, out = [];
    Sel.members().forEach(function (m) {
      var r = m.region || 'Unassigned';
      if (!seen[r]) { seen[r] = 1; out.push(r); }
    });
    return out.sort();
  },
  kpisOf: function (m) {
    return m.kpis.filter(function (k) { return (!S.kra || k.kra === S.kra) && (!S.kpi || k.kpi === S.kpi); });
  },
  allKpis: function () {
    var out = [];
    Sel.visible().forEach(function (m) {
      Sel.kpisOf(m).forEach(function (k) { k.__owner = m.employee_id; out.push(k); });
    });
    return out;
  },
  names: function (field, within) {
    var seen = {}, out = [];
    Sel.members().forEach(function (m) {
      m.kpis.forEach(function (k) {
        if (within && k.kra !== within) return;
        if (!seen[k[field]]) { seen[k[field]] = 1; out.push(k[field]); }
      });
    });
    return out.sort();
  },
  /* Rollup: a KRA line restates its KPIs' backend weighted scores over their
     combined weightage. Presentation only; it originates nothing. */
  byKra: function (kpis) {
    var by = {}, order = [];
    kpis.forEach(function (k) {
      if (!by[k.kra]) { by[k.kra] = { kra: k.kra, perspective: k.perspective, kpis: [], earned: 0, measured: 0 }; order.push(k.kra); }
      var g = by[k.kra]; g.kpis.push(k);
      if (k.weighted_score != null) { g.earned += k.weighted_score; g.measured += Number(k.weightage) || 0; }
    });
    return order.map(function (n) {
      var g = by[n];
      g.achievement = g.measured > 0 ? Math.round(g.earned / g.measured * 1000) / 10 : null;
      return g;
    });
  },
  mean: function (vals) {
    var v = vals.filter(function (x) { return x != null; });
    if (!v.length) return null;
    var s = 0; v.forEach(function (x) { s += x; });
    return Math.round(s / v.length * 10) / 10;
  }
};

/* ============================== FORMAT =================================== */
/* ============================== FORMAT =================================== */
function fmt(v, unit) {
  if (v == null || v === '' || isNaN(v)) return '—';
  var n = Math.round(v * 100) / 100;
  if (unit === 'CR') return '₹' + n + ' Cr';
  if (unit === 'PERCENT') return n + '%';
  if (unit === 'DAYS') return n + (Math.abs(n) === 1 ? ' day' : ' days');
  return String(n);
}
function statusOf(k) {
  if (k.achievement == null) return { c: 'none', t: 'Not measured' };
  if (k.achievement >= 100) return { c: 'good', t: 'Achieved' };
  if (k.achievement >= 90) return { c: 'good', t: 'On track' };
  if (k.achievement >= 75) return { c: 'warn', t: 'Near target' };
  return { c: 'bad', t: 'Below target' };
}
/* The stage a score sits at, on the same band boundaries the progress bar
   notches: past 90 is on target, past 75 is near it, below that is behind.
   One function, so the word beside a bar and the colour of its fill can never
   disagree. */
function scoreStatus(v) {
  if (v == null) return { c: 'none', t: 'Not measured' };
  if (v >= 100) return { c: 'good', t: 'Exceeding' };
  if (v >= 90) return { c: 'good', t: 'On target' };
  if (v >= 75) return { c: 'warn', t: 'Near target' };
  if (v >= 60) return { c: 'bad', t: 'Behind' };
  return { c: 'bad', t: 'Well behind' };
}
function monthLabel(m) {
  var p = String(m || '').split('-');
  if (p.length !== 2) return String(m || '');
  var names = ['', 'January', 'February', 'March', 'April', 'May', 'June',
               'July', 'August', 'September', 'October', 'November', 'December'];
  return (names[+p[1]] || p[1]) + ' ' + p[0];
}
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

/* Weighted achievement across a set of KPIs: earned score over the weightage
   that was actually measured. Presentation rollup only — it originates nothing. */
function achOf(kpis) {
  var e = 0, w = 0;
  kpis.forEach(function (k) {
    if (k.weighted_score != null) { e += k.weighted_score; w += Number(k.weightage) || 0; }
  });
  return w > 0 ? Math.round(e / w * 1000) / 10 : null;
}

function MonthSelect() {
  var months = Sel.months();
  return '<select class="sel" id="f-month"' + (months.length ? '' : ' disabled') + '>' +
    (months.length ? months.map(function (x) {
      return '<option value="' + esc(x) + '"' + (x === S.month ? ' selected' : '') + '>' +
        esc(monthLabel(x)) + '</option>';
    }).join('') : '<option>No period</option>') + '</select>';
}

/* ============================== LEVEL 1 — TEAMS ==========================
   The landing screen is deliberately almost empty: the five places you can go
   and the one number that tells you where to look first. No totals, no charts,
   no summary of any kind. */
function TeamsScreen() {
  var m = Sel.model(), cards = (m && m.scorecards) || [];
  var teams = Sel.teams();
  if (!teams.length) return '<div class="state"><div><h2>No teams</h2><p>The backend returned no team records.</p></div></div>';

  var grid = teams.map(function (t) {
    var people = cards.filter(function (s) { return s.team_id === t.team_id; });
    var score = Sel.mean(people.map(function (p) { return p.overall_score; }));
    return '<button class="tcard" data-team="' + esc(t.team_id) + '">' +
      '<span><span class="tt">' + esc(t.team_name) + '</span>' +
      '<span class="tm">' + plural(people.length, 'person').replace('persons', 'people') +
      (t.team_lead ? ' · led by ' + esc(t.team_lead) : '') + '</span></span>' +
      '<span class="tv"><span class="l">Team score</span>' +
      '<span class="v">' + show(score) + '<em> / 100</em></span></span>' +
      '</button>';
  }).join('');

  return '<h1 class="page-t">Performance</h1>' +
    '<p class="page-s">' + esc(S.month ? monthLabel(S.month) : 'No period loaded') + '</p>' +
    '<div class="tgrid">' + grid + '</div>';
}

/* ============================== LEVEL 2 — TEAM FLOW ======================
   People as performance nodes. The tree is read from the data, never assumed:
   whoever has no manager inside the team is a root, everyone else hangs off the
   person they report to. A flat team draws one row; a two-layer team draws two.
   Nothing here knows the name of any team. */
function buildTree(members) {
  var byId = {}, roots = [];
  members.forEach(function (m) { byId[m.employee_id] = { m: m, kids: [] }; });
  members.forEach(function (m) {
    var pid = m.manager_id || m.reports_to || null;
    if (pid && byId[pid] && pid !== m.employee_id) byId[pid].kids.push(byId[m.employee_id]);
    else roots.push(byId[m.employee_id]);
  });
  /* No reporting line recorded anywhere: fall back to the lead named on the
     team record, so the shape still reflects how the team actually runs. */
  if (roots.length === members.length && members.length > 1) {
    var t = Sel.team(), lead = t && t.team_lead;
    var head = lead && members.filter(function (m) { return m.employee_name === lead; })[0];
    if (head) {
      var hn = byId[head.employee_id];
      hn.kids = roots.filter(function (n) { return n !== hn; });
      roots = [hn];
    }
  }
  var byScore = function (a, b) {
    return (b.m.overall_score == null ? -1 : b.m.overall_score) -
           (a.m.overall_score == null ? -1 : a.m.overall_score);
  };
  var order = function (n) { n.kids.sort(byScore); n.kids.forEach(order); };
  roots.sort(function (a, b) { return b.kids.length - a.kids.length || byScore(a, b); });
  roots.forEach(order);

  /* A team that splits into functions gets a tier between its lead and its
     people. The tier is not a person — it is the function itself — so it draws
     as a different kind of node and opens by expanding rather than by going to
     a profile. Any team whose people carry a sub_team grows this tier; no team
     is named anywhere in this code. */
  roots.forEach(function (r) {
    var groups = {}, names = [];
    r.kids.forEach(function (k) {
      var g = k.m.sub_team || k.m.sub_function || k.m.function_name || null;
      if (!g) return;
      if (!groups[g]) { groups[g] = []; names.push(g); }
      groups[g].push(k);
    });
    if (!names.length) return;
    var ungrouped = r.kids.filter(function (k) {
      return !(k.m.sub_team || k.m.sub_function || k.m.function_name);
    });
    r.kids = names.map(function (n) {
      var kids = groups[n];
      var scores = kids.map(function (k) { return k.m.overall_score; });
      return { group: n, kids: kids, score: Sel.mean(scores), count: kids.length };
    }).concat(ungrouped);
  });
  return roots;
}

/* Name, role, score. Enough to answer "who is performing well" — and nothing
   that begins to answer "why", which belongs inside the profile. */
/* The bar is the score, drawn. The notches sit on the band boundaries the
   scoring model already uses, so the fill's position against them says which
   stage the person is at without a legend: past the third notch is on target,
   short of the first is well behind. Notches are cut out of the fill rather
   than laid over it, so they read at any width and in greyscale. */
function ProgressBar(v, cls) {
  var pct = v == null ? 0 : Math.max(0, Math.min(100, v));
  return '<span class="pb" role="img" aria-label="' +
    (v == null ? 'Not measured' : show(v) + ' out of 100') + '">' +
    '<i class="' + cls + '" style="width:' + pct.toFixed(1) + '%"></i>' +
    '<u style="left:60%"></u><u style="left:75%"></u><u style="left:90%"></u>' +
    '</span>';
}

function Node(m, isLead) {
  var st = scoreStatus(m.overall_score);
  return '<button class="node' + (isLead ? ' lead' : '') + '" data-emp="' + esc(m.employee_id) + '">' +
    '<span class="nh"><span class="nm">' + esc(m.employee_name) + '</span>' +
    '<span class="rl">' + esc(m.designation || '') + '</span></span>' +
    '<span class="nf">' +
      '<span class="sr"><span class="sc">' + show(m.overall_score) + '<em> / 100</em></span>' +
      '<span class="stg ' + st.c + '">' + esc(st.t) + '</span></span>' +
      ProgressBar(m.overall_score, st.c) +
    '</span></button>';
}

/* A function, not a person: the name, how many people sit under it, and their
   mean score. It opens by expanding rather than by going anywhere, so the
   chevron is the whole affordance. */
function GroupNode(node) {
  var open = !!S.open[node.group], st = scoreStatus(node.score);
  return '<button class="gnode' + (open ? ' open' : '') + '" data-group="' + esc(node.group) + '"' +
    ' aria-expanded="' + (open ? 'true' : 'false') + '">' +
    '<span class="gh"><span class="gt">' + esc(node.group) + '</span>' +
    '<span class="gm">' + plural(node.count, 'person').replace('persons', 'people') + '</span></span>' +
    '<span class="gc" aria-hidden="true">' + (open ? '−' : '+') + '</span>' +
    '<span class="gf"><span class="sr">' +
      '<span class="gs">' + show(node.score) + '<em> / 100</em></span>' +
      '<span class="stg ' + st.c + '">' + esc(st.t) + '</span></span>' +
      ProgressBar(node.score, st.c) +
    '</span></button>';
}

function renderNode(node) {
  if (node.group) {
    var open = !!S.open[node.group];
    return '<div class="arm"><div class="stem"></div>' + GroupNode(node) +
      (open ? '<div class="drop"></div><div class="branch">' +
        node.kids.map(renderNode).join('') + '</div>' : '') + '</div>';
  }
  var card = Node(node.m, false);
  if (!node.kids.length) return '<div class="arm"><div class="stem"></div>' + card + '</div>';
  return '<div class="arm"><div class="stem"></div>' + card +
    '<div class="drop"></div><div class="branch">' +
    node.kids.map(renderNode).join('') + '</div></div>';
}

function Flowchart(members) {
  if (!members.length) return '<div class="empty">No people are mapped to this team.</div>';
  var roots = buildTree(members);
  var top = '<div class="lvl">' + roots.map(function (r) {
    return Node(r.m, r.kids.length > 0);
  }).join('') + '</div>';
  var below = roots.filter(function (r) { return r.kids.length; }).map(function (r) {
    return '<div class="drop"></div><div class="branch">' +
      r.kids.map(renderNode).join('') + '</div>';
  }).join('');
  return '<div class="flow">' + top + below + '</div>';
}

function TeamScreen() {
  var t = Sel.team();
  if (!t) return TeamsScreen();
  var members = Sel.members();
  var score = Sel.mean(members.map(function (m) { return m.overall_score; }));
  return '<button class="back" data-crumb="teams">← All teams</button>' +
    '<h1 class="page-t">' + esc(t.team_name) + '</h1>' +
    '<p class="page-s">' + esc(S.month ? monthLabel(S.month) : 'No period loaded') +
    ' · team score ' + show(score) + ' / 100</p>' +
    Flowchart(members);
}

/* ============================== LEVEL 3 — PROFILE ========================
   One reusable profile for every team. Which KRAs and KPIs appear is decided
   entirely by that person's backend mapping, so two people on the same team can
   carry different KPIs at different weightages and both render correctly. */
function Ring(v) {
  var pct = v == null ? 0 : Math.max(0, Math.min(100, v));
  var r = 50, c = 2 * Math.PI * r;
  return '<div class="ring"><svg viewBox="0 0 112 112">' +
    '<circle class="tr" cx="56" cy="56" r="' + r + '"></circle>' +
    '<circle class="fg" cx="56" cy="56" r="' + r + '" stroke-dasharray="' + c.toFixed(1) +
      '" stroke-dashoffset="' + (c - c * pct / 100).toFixed(1) + '"></circle></svg>' +
    '<div class="lbl"><b>' + show(v) + '</b><span>/ 100</span></div></div>';
}

/* A row, not a card. Name and weightage on one line, the numbers on the next,
   a hairline bar beneath. Twelve of these still read as one list. */
function KpiRow(k, i) {
  var st = statusOf(k);
  var pct = k.achievement == null ? 0 : Math.max(0, Math.min(100, k.achievement));
  var flow = (k.target == null && k.actual == null)
    ? 'No target or actual for this period'
    : '<b>' + esc(fmt(k.target, k.unit)) + '</b> → <b>' + esc(fmt(k.actual, k.unit)) + '</b>' +
      (k.weighted_score == null ? '' : ' · score ' + show(k.weighted_score) + ' / ' + show(k.weightage));
  return '<button class="krow" data-kpi="' + i + '">' +
    '<span class="r1"><span class="kn">' + esc(k.kpi) + '</span>' +
    '<span class="kw">' + show(k.weightage) + '%</span></span>' +
    '<span class="r2"><span class="flow-v">' + flow + '</span>' +
    '<span class="ach ' + st.c + '">' +
      (k.achievement == null ? '—' : show(k.achievement) + '%') + '</span></span>' +
    '<span class="kbar"><i class="' + st.c + '" style="width:' + pct + '%"></i></span>' +
    '</button>';
}

function ProfileScreen() {
  var m = Sel.employee();
  if (!m) return '<div class="state"><div><h2>Not found</h2><p>That person is not on the selected team.</p></div></div>';
  var t = Sel.team();
  var kpis = m.kpis || [];
  var rated = kpis.filter(function (k) { return k.achievement != null; });
  var meta = [m.designation, m.region].filter(Boolean).join(' · ');

  var prof = '<button class="back" data-crumb="team">← ' + esc(t ? t.team_name : 'Team') + '</button>' +
    '<div class="prof"><div class="pid"><h1>' + esc(m.employee_name) + '</h1>' +
    '<div class="meta">' + esc(meta) + '</div></div>' +
    '<div class="pr"><div class="pstat">' +
      '<div class="si"><span class="l">Overall score</span><span class="v">' + show(m.overall_score) + '</span></div>' +
      '<div class="si"><span class="l">KPI achievement</span><span class="v">' +
        (achOf(rated) == null ? '—' : achOf(rated) + '%') + '</span></div>' +
      '<div class="si"><span class="l">KPIs assigned</span><span class="v">' + kpis.length + '</span></div>' +
    '</div>' + Ring(m.overall_score) + '</div></div>';

  /* Grouped by KRA, in the order the backend supplied them. The heading is the
     hierarchy — no container, no card, just a label and a rule. */
  var by = {}, order = [];
  kpis.forEach(function (k, i) {
    k.__i = i;
    var g = k.kra || 'Other';
    if (!by[g]) { by[g] = []; order.push(g); }
    by[g].push(k);
  });
  var body = order.map(function (g) {
    var list = by[g], wt = 0;
    list.forEach(function (k) { wt += Number(k.weightage) || 0; });
    var a = achOf(list);
    return '<div class="kra-h"><span class="t">' + esc(g) + '</span><span class="ln"></span>' +
      '<span class="r">' + show(wt) + '%' + (a == null ? '' : ' · ' + a + '% achieved') + '</span></div>' +
      list.map(function (k) { return KpiRow(k, k.__i); }).join('');
  }).join('');
  if (!kpis.length) body = '<div class="empty">No KPIs are mapped to this person.</div>';

  var pending = kpis.length - rated.length;
  var hint = pending ? '<div class="hint">' + pending + ' of ' + kpis.length +
    ' KPIs have no target or actual for this period, so they are excluded from the score rather than counted as zero.</div>' : '';

  return prof + body + hint;
}

/* ============================== LEVEL 4 — KPI DRAWER =====================
   One slim panel from the right: the numbers, the goal, the performance. No
   modal stack, no nested popups. */
function renderModal() {
  var mo = $('#modal'), sc = $('#scrim');
  var k = S.detail;
  if (!k) { mo.classList.remove('on'); sc.classList.remove('on'); return; }
  var st = statusOf(k);
  var pct = k.achievement == null ? 0 : Math.max(0, Math.min(100, k.achievement));
  var lower = k.direction === 'LOWER_IS_BETTER';

  mo.innerHTML =
    '<div class="m-h"><div><h2>' + esc(k.kpi) + '</h2>' +
    '<div class="sub">' + esc(k.kra || '') + '</div></div>' +
    '<button class="x" data-close="1" aria-label="Close">×</button></div>' +
    '<div class="m-b">' +
      '<dl class="kv">' +
        kv('Weightage', show(k.weightage) + '%') +
        kv('Target', esc(fmt(k.target, k.unit))) +
        kv('Actual', esc(fmt(k.actual, k.unit))) +
        kv('Achievement', k.achievement == null ? '—' : show(k.achievement) + '%') +
        kv('Variance', k.variance == null ? '—'
           : (k.variance > 0 ? '+' : '') + esc(fmt(k.variance, k.unit))) +
        kv('Weighted score', '<span class="hi">' + show(k.weighted_score) + ' / ' + show(k.weightage) + '</span>') +
      '</dl>' +
      (k.goal ? '<div class="sect-t">Goal</div><div class="goal"><p>' + esc(k.goal) + '</p></div>' : '') +
      '<div class="sect-t">Performance</div>' +
      '<div class="m-perf"><div class="n ' + st.c + '">' +
        (k.achievement == null ? '—' : show(k.achievement) + '%') + '</div>' +
        '<div class="kbar"><i class="' + st.c + '" style="width:' + pct + '%"></i></div>' +
        '<p class="goal" style="margin-top:12px"><span style="color:var(--muted);font-size:var(--fs-xs)">' +
        esc(st.t) + (lower ? ' · lower is better, so achievement is target ÷ actual' : '') +
        '</span></p></div>' +
    '</div>';
  mo.classList.add('on'); sc.classList.add('on');
}
function kv(k, v) { return '<dt>' + esc(k) + '</dt><dd>' + v + '</dd>'; }

function Skeleton() {
  return '<div class="skl" style="height:30px;width:220px"></div>' +
    '<div class="skl" style="height:16px;width:140px;margin-top:12px"></div>' +
    '<div class="skl" style="height:150px;margin-top:56px"></div>';
}

/* ============================== RENDER =================================== */
function render() {
  if (S.loading) return void ($('#view').innerHTML = Skeleton());
  if (S.error) {
    $('#view').innerHTML = '<div class="state"><div><h2>Could not load</h2><p>' + esc(S.error) +
      '</p><button class="btn" data-retry="1">Try again</button>' +
      '<button class="btn ghost" data-demo="on">Preview the interface</button></div></div>';
    return;
  }
  /* The team strip only exists once you are inside a team; on the landing
   * screen the team cards are the navigation, so a second copy of it would be
   * one control too many. */
  $('#teams').innerHTML = S.team ? Sel.teams().map(function (t) {
    return '<button class="tb' + (t.team_id === S.team ? ' on' : '') + '" data-team="' + esc(t.team_id) + '">' +
      esc(t.team_name) + '</button>';
  }).join('') : '';
  $('#months').innerHTML = MonthSelect();

  var noPerf = !(S.model.scorecards || []).some(function (s) {
    return s.kpis.some(function (k) { return k.achievement != null; });
  });
  $('#demo').innerHTML = S.demo
    ? '<div class="demo"><div class="in"><span>Showing sample values. Teams, employees, KRAs, KPIs and weightages are real; targets and actuals are not.</span><button data-demo="off">Show real data</button></div></div>'
    : (noPerf ? '<div class="demo"><div class="in"><span>No targets or actuals loaded yet.</span><button data-demo="on">Preview with sample values</button></div></div>' : '');

  /* Three levels, and the state says which one you are on. */
  $('#view').innerHTML = !S.team ? TeamsScreen()
                       : S.employee ? ProfileScreen()
                       : TeamScreen();
  renderModal();
}

function load() {
  S.loading = true; S.error = null; S._demo = null; render();
  Api.fetch(S.month, function (m) {
    S.loading = false;
    /* google.script.run hands back null when a server function throws or its
     * result cannot be serialised, and the two look identical from here - so
     * say which case this is rather than "no data". */
    if (!m) {
      /* Ask the smallest possible question to tell the two cases apart. */
      Api.ping(function (pong) {
        S.error = (pong && pong.ok)
          ? 'The dashboard data could not be sent back, although the connection is fine. This is usually one unreadable value in the sheet — a target or weight holding text such as "-" or "TBD". Open MONTHLY_TARGETS and ACTUAL_PERFORMANCE and clear any non-numeric target, actual or weight, then reload.'
          : 'The deployment is serving an older version of the code. In the Apps Script editor use Deploy → Manage deployments → edit → Version: New version, then reload.';
        render();
      }, function () {
        S.error = 'The deployment is serving an older version of the code, or this account cannot run it. In the Apps Script editor use Deploy → Manage deployments → edit → Version: New version, then reload.';
        render();
      });
      return render();
    }
    if (!m.ok) { S.error = (m.error || 'The backend reported a failure.') + (m.where ? ' (' + m.where + ')' : ''); return render(); }
    S.model = m; S._demo = null;
    /* No team is chosen for the user: the landing screen is the first decision. */
    if (!S.month) { var mo = Sel.months(); S.month = mo[mo.length - 1] || null; }
    render();
  }, function (e) {
    S.loading = false;
    /* No backend reachable — fall back to the structural seed so the whole
     * interface can still be seen and operated. The banner says plainly that
     * the values are samples, and the real model replaces this the moment
     * apiMasterModel answers. */
    if (!Api.live()) return usePlaceholder();
    S.error = (e && e.message) || 'The backend could not be reached.'; render();
  });
}

function usePlaceholder() {
  var m = Seed.model();
  S.model = m; S._demo = null; S.demo = true; S.loading = false; S.error = null;
  /* land on the teams screen, not inside a team */
  if (!S.month) S.month = m.month;
  render();
}

/* ============================== EVENTS =================================== */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-team]');
  if (t) { S.team = t.dataset.team; S.employee = null; S.open = {}; S.detail = null; render(); scrollTo(0, 0); return; }
  var emp = e.target.closest('[data-emp]');
  if (emp) { S.employee = emp.dataset.emp; S.detail = null; render(); scrollTo(0, 0); return; }
  /* One step back per level: KPI → person → team → all teams. */
  var cb = e.target.closest('[data-crumb]');
  if (cb) {
    var to = cb.dataset.crumb;
    if (to === 'teams') { S.team = null; S.employee = null; }
    if (to === 'team') S.employee = null;
    S.detail = null; render(); scrollTo(0, 0); return;
  }
  var grp = e.target.closest('[data-group]');
  if (grp) { var g = grp.dataset.group; S.open[g] = !S.open[g]; render(); return; }
  var k = e.target.closest('[data-kpi]');
  if (k) {
    var owner = Sel.employee();
    S.detail = owner ? (owner.kpis || [])[Number(k.dataset.kpi)] : null;
    renderModal(); return;
  }
  if (e.target.closest('[data-close]') || e.target.id === 'scrim') { S.detail = null; renderModal(); return; }
  var d = e.target.closest('[data-demo]');
  if (d) {
    var on = d.dataset.demo === 'on';
    /* If the backend never answered there is no model to sample from, so the
     * structural seed stands in — the interface is fully operable either way. */
    if (on && !S.model) return usePlaceholder();
    S.demo = on; S._demo = null; S.detail = null;
    if (!on && S.model && S.model.placeholder) { S.model = null; S.error = 'No sheet connected yet.'; }
    render(); return;
  }
  if (e.target.closest('[data-retry]')) load();
});
document.addEventListener('change', function (e) {
  var id = e.target.id;
  /* The period is global: it survives every level, so changing it on a profile
   * keeps you on that profile and simply restates it for the new month. Where
   * a backend is attached the month is refetched; on the placeholder model it
   * is re-derived in place. Either way nothing about where you are changes. */
  if (id === 'f-month') {
    S.month = e.target.value; S.detail = null; S._demo = null;
    if (S.model && S.model.placeholder) { render(); } else { load(); }
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.detail) { S.detail = null; renderModal(); }
});

load();
</script>
</body>
</html>

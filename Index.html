<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recykal · KRA / KPI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#005DFF;--brand-2:#8460D4;--brand-soft:#ECF2FF;--brand-ink:#0047C4;
  --ink:#111318;--ink-2:#434A57;--muted:#767F8C;--faint:#A3ABB8;
  --line:#EBEEF3;--line-2:#E1E6EE;--line-soft:#F3F5F8;--bg:#F6F7F9;--card:#FFFFFF;--surface-2:#F5F7FA;
  --good:#00B386;--good-soft:#E6F7F1;--good-ink:#028268;
  --warn:#E8973A;--warn-soft:#FBF0E1;--warn-ink:#B26A17;
  --bad:#E5484D;--bad-soft:#FCEBEC;--bad-ink:#C2303A;
  --none:#98A2B3;--none-soft:#F0F2F6;
  --shadow-xs:0 1px 1.5px rgba(17,19,24,.05);
  --shadow:0 2px 6px -3px rgba(17,19,24,.07),0 14px 32px -14px rgba(17,19,24,.18);
  --shadow-lg:0 24px 60px -22px rgba(17,19,24,.28);
  --r-lg:18px;--r-md:14px;--sbw:244px;--ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:'tnum' 1,'calt' 1,'cv11' 1;letter-spacing:-.011em}
button,input,select{font-family:inherit}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:5px}
::selection{background:rgba(0,93,255,.15)}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:#D4DAE3;border-radius:20px;border:3px solid var(--bg);background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:#BFC7D2}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sbw);flex:0 0 var(--sbw);position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 14px}
.brand .mark{width:32px;height:32px;flex:0 0 32px}
.brand .name{font-weight:800;font-size:15px;letter-spacing:-.02em;line-height:1.1}
.brand .name span{display:block;font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:.01em}
.scope-badge{margin:4px 6px 8px;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,var(--brand-soft),#F4EEFF);border:1px solid #E4E9FF}
.scope-badge .t{font-size:12.5px;font-weight:750;color:var(--brand-ink);letter-spacing:-.01em}
.scope-badge .s{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;position:relative;color:var(--ink-2);font-weight:550;cursor:pointer;font-size:13.5px;letter-spacing:-.008em;transition:background .16s var(--ease),color .16s var(--ease)}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:650}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:17px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85}.nav-item.active svg{opacity:1}
.nav-item .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--bad-soft);color:var(--bad-ink);border-radius:20px;padding:1px 8px}
.sidebar .foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--faint);line-height:1.6}

.main{flex:1;min-width:0;display:flex;flex-direction:column}.main-scroll{flex:1;min-height:0}
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,247,249,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:12px}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);min-width:0;flex-wrap:wrap}
.crumbs b{color:var(--ink);font-weight:650}.crumbs .sep{color:var(--faint)}.crumbs .c-link{cursor:pointer}.crumbs .c-link:hover{color:var(--brand)}
.topbar .spacer{flex:1}
.updated{font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.updated .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:.15s}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}.icon-btn svg{width:17px;height:17px}
.userchip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:24px;background:#fff}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center}
.userchip .u-name{font-size:12.5px;font-weight:600;line-height:1.1}.userchip .u-sub{font-size:10.5px;color:var(--muted)}

.filterbar{position:sticky;top:57px;z-index:29;background:rgba(246,247,249,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.selectwrap{position:relative}
.pill-select{appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 30px 8px 12px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;outline:none;transition:.15s}
.pill-select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.selectwrap::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.fsearch{position:relative;flex:0 1 230px}
.fsearch input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px 8px 32px;font-size:12.5px;color:var(--ink);outline:none;transition:.15s}
.fsearch input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint)}
.fseg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.fseg button{border:none;background:transparent;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s}
.fseg button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;background:var(--brand-soft);color:var(--brand-ink);border-radius:20px;padding:4px 6px 4px 11px}
.chip b{font-weight:700}.chip button{border:none;background:rgba(0,71,196,.12);color:var(--brand-ink);width:16px;height:16px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center}
.clear-all{font-size:12px;font-weight:650;color:var(--muted);cursor:pointer;padding:4px 6px}.clear-all:hover{color:var(--bad-ink)}

.content{padding:22px 26px 64px;max-width:1260px;width:100%;margin:0 auto}
.page-head{margin-bottom:16px}
.page-head h1{font-size:21px;font-weight:800;letter-spacing:-.025em;margin:0 0 3px}
.page-head p{margin:0;color:var(--muted);font-size:13px;max-width:880px;line-height:1.5}
.sect-t{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.sect-t .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted)}

.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid #E4E9FF;background:linear-gradient(135deg,var(--brand-soft),#F6F1FF);margin-bottom:16px}
.banner .bi{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:#fff;display:grid;place-items:center;color:var(--brand);box-shadow:var(--shadow-xs)}
.banner .bt{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.banner .bs{font-size:12px;color:var(--muted);margin-top:2px}
.banner .r{margin-left:auto}

.kc-grid{display:grid;gap:14px;margin-bottom:16px}
.kc-grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kc-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 18px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:126px;box-shadow:var(--shadow-xs);animation:rise .44s var(--ease) backwards;transition:border-color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease)}
.kc-grid .kc:nth-child(2){animation-delay:.04s}.kc-grid .kc:nth-child(3){animation-delay:.08s}.kc-grid .kc:nth-child(4){animation-delay:.12s}
.kc-click{cursor:pointer}.kc-click:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}.kc-click:active{transform:translateY(-1px);transition-duration:.06s}
.kc-label{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kc-label .wt{margin-left:auto;font-size:10px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.kc-value{font-size:32px;font-weight:800;letter-spacing:-.033em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.kc-value small{font-size:15px;font-weight:650;color:var(--faint);margin-left:2px;letter-spacing:-.01em}
.kc-support{font-size:12px;font-weight:650;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
.kc-bar{height:5px;border-radius:20px;background:var(--line-soft);overflow:hidden;margin-top:11px}
.kc-bar span{display:block;height:100%;border-radius:20px;transform-origin:left;animation:growx .7s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(max-width:900px){.kc-grid.c4,.kc-grid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.kc-value{font-size:27px}.kc{min-height:108px}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-xs)}
.panel.pad{padding:20px 22px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.panel-h h3{font-size:14.5px;font-weight:700;margin:0;letter-spacing:-.014em}
.panel-h .sub{font-size:12px;color:var(--muted);font-weight:500}
.panel-h .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.link{font-size:12.5px;font-weight:650;color:var(--brand);cursor:pointer}.link:hover{text-decoration:underline}
.stack{margin-top:14px}
.two-col{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.two-col{grid-template-columns:minmax(0,1fr)}}

/* department cards */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;box-shadow:var(--shadow-xs);cursor:pointer;transition:border-color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease);animation:rise .44s var(--ease) backwards}
.dcard:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.dcard .dc-h{display:flex;align-items:center;gap:10px}
.dcard .dc-ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.dcard .dc-ic svg{width:19px;height:19px}
.dcard h3{margin:0;font-size:15px;font-weight:750;letter-spacing:-.015em}
.dcard .dc-kind{font-size:11px;color:var(--muted);font-weight:600}
.dcard .dc-score{margin-left:auto;text-align:right}
.dcard .dc-metrics{display:flex;gap:16px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line-soft)}
.dcard .dm{font-size:11.5px;color:var(--muted);font-weight:600}.dcard .dm b{display:block;font-size:17px;color:var(--ink);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:1px}

.list{margin:2px -8px 0}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;transition:background .14s var(--ease)}
.lrow:hover{background:var(--surface-2)}.lrow+.lrow{box-shadow:inset 0 1px 0 var(--line-soft)}
.lrow-id{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.lrow-name{font-size:13.5px;font-weight:650;min-width:0;letter-spacing:-.01em}
.lrow-name .lrow-sub{display:block;font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lavatar{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:12px;display:grid;place-items:center;transition:.16s}
.lrow:hover .lavatar{background:var(--brand-soft);color:var(--brand)}
.rank{width:20px;flex:0 0 20px;text-align:center;font-size:12px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}.rank.top{color:var(--brand)}
.lrow-track{flex:0 0 116px;height:8px;background:var(--line-soft);border-radius:20px;overflow:hidden}
.lrow-track span{display:block;height:100%;border-radius:20px}
.lrow-meta{font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right;white-space:nowrap}
@media(max-width:620px){.lrow-track{display:none}}
.sdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;display:inline-block}
.s-good{background:var(--good)}.s-warn{background:var(--warn)}.s-bad{background:var(--bad)}.s-none{background:var(--none)}
.chev{color:var(--faint);font-size:18px;flex:0 0 12px;text-align:center;transition:transform .18s var(--ease),color .18s var(--ease)}.lrow:hover .chev{transform:translateX(3px);color:var(--ink-2)}
.rchip{min-width:50px;text-align:center;font-size:13.5px;font-weight:800;padding:5px 8px;border-radius:9px;font-variant-numeric:tabular-nums;letter-spacing:-.015em;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 14%,transparent)}
.rchip small{font-size:9.5px;font-weight:700;opacity:.6}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good-ink)}.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}.pill.none{background:var(--none-soft);color:var(--ink-2)}
.tag{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 8px;white-space:nowrap}
.tag.brand{color:var(--brand-ink);background:var(--brand-soft);border-color:#E4E9FF}
.mini-tag{font-size:9.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:middle}

.bc-row{display:flex;align-items:center;gap:14px;padding:10px 6px;border-radius:10px;cursor:pointer;transition:background .13s}
.bc-row:hover{background:var(--surface-2)}
.bc-label{width:180px;flex:0 0 180px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-label small{color:var(--muted);font-weight:500}
.bc-track{flex:1;height:10px;background:var(--line-soft);border-radius:20px;overflow:hidden;min-width:40px}
.bc-fill{height:100%;border-radius:20px;transform-origin:left center;animation:growx .72s var(--ease) backwards}
.bc-val{width:56px;flex:0 0 56px;text-align:right;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.bc-val small{font-size:9.5px;color:var(--faint);font-weight:700}
.bc-chev{color:var(--faint);flex:0 0 10px}
@media(max-width:560px){.bc-label{width:120px;flex-basis:120px}}

.person-hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.person-hd .pa{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;flex:0 0 54px}
.person-hd h1{margin:0;font-size:22px;letter-spacing:-.025em}
.person-hd .meta{color:var(--muted);font-size:12.5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:4px}

/* KRA group + KPI score cards */
.kra-group{margin-top:6px}
.kg-h{display:flex;align-items:center;gap:9px;margin:20px 0 10px}
.kg-h .kg-t{font-size:13px;font-weight:750;letter-spacing:-.01em}
.kg-h .kg-p{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.kg-h .kg-line{flex:1;height:1px;background:var(--line)}
.kpigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:13px}
.kcard{border:1px solid var(--line);border-radius:15px;padding:15px 16px;box-shadow:var(--shadow-xs);cursor:pointer;background:var(--card);transition:border-color .16s,box-shadow .16s,transform .16s;display:flex;flex-direction:column}
.kcard:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.kcard .kh{display:flex;align-items:flex-start;gap:9px}
.kcard .kh .kt{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.3;min-width:0}
.kcard .kh .kt small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kcard .kh .wt{margin-left:auto;flex:0 0 auto;font-size:10px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.kcard .kmeta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.kcard .kfoot{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft)}
.kcard .kfoot .kval{font-size:12.5px;font-weight:600;color:var(--muted)}.kcard .kfoot .kval b{color:var(--ink);font-variant-numeric:tabular-nums}
.kcard .kfoot .r{margin-left:auto;display:flex;align-items:center;gap:8px}

/* band ladder */
.ladder{display:flex;gap:4px;margin-top:12px}
.lb{flex:1;min-width:0;border-radius:8px;padding:7px 4px 6px;text-align:center;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:.16s}
.lb .lbn{font-size:9px;font-weight:700;color:var(--faint);letter-spacing:.02em;text-transform:uppercase}
.lb .lbv{font-size:11px;font-weight:700;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb.on{border-color:transparent;color:#fff;box-shadow:var(--shadow-xs)}
.lb.on .lbn{color:rgba(255,255,255,.8)}.lb.on .lbv{color:#fff}
.lb.g1{--c:var(--bad)}.lb.g2{--c:var(--warn)}.lb.g3{--c:#C9A227}.lb.g4{--c:var(--good)}.lb.g5{--c:var(--good-ink)}
.lb.on{background:var(--c)}
.ladder-cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-weight:600;margin-top:6px}

.tbl-wrap{overflow-x:auto;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:920px}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.num{text-align:right}.tbl th.sorted{color:var(--ink-2)}.tbl th .sc{opacity:.5;font-size:9px;margin-left:3px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tbl tbody tr{cursor:pointer;transition:.12s}.tbl tbody tr:hover{background:var(--surface-2)}.tbl tbody tr:last-child td{border-bottom:none}
.tbl .kname{font-weight:650}.tbl .kname small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.pager{display:flex;align-items:center;justify-content:space-between;padding-top:12px;font-size:12.5px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;margin-left:6px}
.pager button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}.pager button:disabled{opacity:.45;cursor:default}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px}.empty svg{width:36px;height:36px;opacity:.3;margin-bottom:6px}

.info-tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.info-tbl th{background:var(--surface-2);text-align:left;font-size:11px;font-weight:700;color:var(--ink-2);padding:8px 11px;border:1px solid var(--line);white-space:nowrap}
.info-tbl td{padding:8px 11px;border:1px solid var(--line-soft);vertical-align:top;color:var(--ink-2)}

.state{min-height:60vh;display:grid;place-items:center;padding:20px}
.state-card{max-width:470px;text-align:center}
.state-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0 auto 16px;background:var(--brand-soft);color:var(--brand)}.state-ic svg{width:26px;height:26px}
.state h2{font-size:18px;font-weight:750;margin:0 0 8px;letter-spacing:-.02em}
.state p{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 18px}
.state.err .state-ic{background:var(--bad-soft);color:var(--bad-ink)}
.skl{background:linear-gradient(90deg,#EEF1F6,#F6F8FB,#EEF1F6);background-size:200% 100%;border-radius:12px;animation:sh 1.3s ease infinite}@keyframes sh{to{background-position:-200% 0}}
.btn{border:none;border-radius:11px;padding:10px 18px;font-size:13.5px;font-weight:650;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(0,71,196,.28),0 6px 16px -8px rgba(0,93,255,.55)}.btn.primary:hover{background:#0050db}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.32);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s;z-index:60}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:520px;max-width:94vw;background:#fff;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .28s var(--ease);z-index:61;display:flex;flex-direction:column}.drawer.on{transform:none}
.drawer-h{padding:20px 22px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.drawer-h h2{margin:0;font-size:17px;font-weight:750;letter-spacing:-.015em;line-height:1.25}
.drawer-h .sub{font-size:12px;color:var(--muted);margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drawer-body{padding:20px 22px;overflow-y:auto;flex:1}
.drawer .close{margin-left:auto;flex:0 0 34px}
.section-t{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px}.section-t:first-child{margin-top:0}
.def-box{font-size:12.5px;color:var(--ink-2);line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow-xs)}
.metric .l{font-size:11px;color:var(--muted);font-weight:600}.metric .v{font-size:17px;font-weight:800;letter-spacing:-.025em;margin-top:5px;font-variant-numeric:tabular-nums}.metric .v small{font-size:11px;font-weight:600;color:var(--faint)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:650;color:var(--ink-2);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:13px;color:var(--ink);outline:none;transition:.15s;background:#fff}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.24s;z-index:80}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{background:var(--bad)}
.fade{animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.hamburger{display:none}
@media(max-width:960px){:root{--sbw:0px}.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.24s;width:244px;flex-basis:244px}.sidebar.open{transform:none;box-shadow:var(--shadow-lg)}.hamburger{display:grid}.content{padding:18px 15px 60px}.topbar,.filterbar{padding:10px 15px}}
@media(max-width:620px){.userchip .u-meta{display:none}.updated{display:none}.metric-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.crumbs{display:none}.userchip{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.05ms!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="mark" id="brandMark"></div><div class="name">Recykal<span>KRA / KPI Tracker</span></div></div>
    <div class="scope-badge" id="scopeBadge" style="display:none"></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="sbFoot">Loading…</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="icon-btn hamburger" data-act="toggle-nav" style="margin-right:2px" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="crumbs" id="crumbs"></div><div class="spacer"></div>
      <div class="selectwrap" id="periodWrap" style="display:none"><select class="pill-select" id="periodSel" data-act="period"></select></div>
      <div class="updated" id="updated"></div>
      <button class="icon-btn" data-act="refresh" title="Refresh from sheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></button>
      <div class="userchip"><div class="avatar" id="userAv">R</div><div class="u-meta"><div class="u-name" id="userName">User</div><div class="u-sub">Recykal</div></div></div>
    </div>
    <div class="filterbar" id="filterbar" style="display:none"></div>
    <div class="main-scroll"><div class="content" id="content"></div></div>
  </div>
</div>
<div class="scrim" id="scrim" data-act="close-drawer"></div>
<aside class="drawer" id="drawer"><div id="drawerContent"></div></aside>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const n1=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10);
const n2=v=>v==null||isNaN(v)?'—':(Math.round(v*100)/100);
const pct=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10)+'%';
const SCOL={good:'var(--good)',warn:'var(--warn)',bad:'var(--bad)',none:'var(--none)'};
const STINT={good:'var(--good-soft)',warn:'var(--warn-soft)',bad:'var(--bad-soft)',none:'var(--none-soft)'};
const sc=k=>SCOL[k]||SCOL.none, tint=k=>STINT[k]||STINT.none;
function relTime(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';const s=(Date.now()-d.getTime())/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';return d.toLocaleDateString();}
function ratingStr(r){return r==null?'—':(Math.round(r*10)/10).toFixed(1);}
function unitStr(rec,v){if(v==null||v==='')return '—';const u=(rec.unit||'').toLowerCase();if(u.indexOf('cr')>=0||u.indexOf('₹')>=0)return '₹'+n2(v)+' Cr';if(u.indexOf('day')>=0)return v+' d';if(u.indexOf('percent')>=0||u.indexOf('%')>=0)return v+((''+v).indexOf('%')<0?'':'');return String(v);}

function backend(){return (typeof google!=='undefined'&&google.script&&google.script.run)?google.script.run:null;}
function call(fn,payload){return new Promise((resolve,reject)=>{const b=backend();if(!b){reject({__offline:true});return;}b.withSuccessHandler(resolve).withFailureHandler(reject)[fn](payload);});}

const APP={boot:null,view:'overview',ctx:{},filters:{dept:'',subTeam:'',status:'',search:''},table:{sort:'employee',dir:1,page:0,per:14},period:''};
function B(){return APP.boot;}

async function boot(){
  drawBrand();showState('loading');
  try{const b=await call('apiBootstrap',{period:APP.period||undefined});
    if(!b){showState('error','No response from the backend.');return;}
    if(!b.ok||b.connected===false){showState('error',b.error||'Could not connect to the Google Sheet.');return;}
    applyBoot(b);
  }catch(e){if(e&&e.__offline){showState('offline');return;}showState('error',(e&&e.message)||String(e));}
}
function applyBoot(b){APP.boot=b;APP.period=b.period||APP.period;buildChrome();$('#filterbar').style.display=b.empty?'none':'flex';render();}
window.__applyBoot=applyBoot;window.__boot=boot;

/* ---------------- data helpers ---------------- */
function recById(id){return B().records.find(r=>r.kpiId===id);}
function empById(id){return B().employees.find(e=>e.id===id);}
function deptById(id){return B().departments.find(d=>d.id===id);}
function subById(id){return B().subTeams.find(s=>s.id===id);}
function recordsForEmp(id){return B().records.filter(r=>r.employeeId===id);}
function deptSubTeams(id){return B().subTeams.filter(s=>s.deptId===id);}
function deptEmployees(id){return B().employees.filter(e=>e.deptId===id);}
function withData(rs){return rs.filter(r=>r.rating!=null);}
function filteredEmployees(){let es=B().employees.slice();const f=APP.filters;if(f.dept)es=es.filter(e=>e.deptId===f.dept);if(f.subTeam)es=es.filter(e=>e.subTeamIds&&e.subTeamIds.indexOf(f.subTeam)>=0);if(f.status)es=es.filter(e=>e.status.k===f.status);if(f.search){const q=f.search.toLowerCase();es=es.filter(e=>(e.name+' '+e.role+' '+e.region+' '+e.department).toLowerCase().includes(q));}return es;}
function filteredRecords(){let r=B().records.slice();const f=APP.filters;if(f.dept)r=r.filter(x=>x.deptId===f.dept);if(f.subTeam)r=r.filter(x=>x.subTeamId===f.subTeam);if(f.status)r=r.filter(x=>x.status.k===f.status);if(f.search){const q=f.search.toLowerCase();r=r.filter(x=>(x.employee+' '+x.kpi+' '+x.kra+' '+x.department+' '+(x.subTeam||'')).toLowerCase().includes(q));}return r;}

/* ---------------- chrome ---------------- */
const ICONS={overview:'<path d="M3 12l2-2 4 4 5-6 4 4 3-3"/><path d="M3 20h18" opacity=".4"/>',depts:'<rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="5" rx="1.5"/><rect x="14" y="15" width="7" height="5" rx="1.5"/>',people:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.6" opacity=".55"/><path d="M15 20a5 5 0 0 1 6.5-4.8" opacity=".55"/>',records:'<path d="M4 5h16M4 12h16M4 19h16"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'};
const NAV=[{id:'overview',label:'Overview'},{id:'depts',label:'Departments'},{id:'people',label:'People'},{id:'records',label:'All KPIs'},{id:'settings',label:'Data & Settings'}];
function deptIcon(kind){if(kind==='scorecard')return '<path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 4-5" fill="none"/>';if(kind==='individuals')return ICONS.people;if(kind==='info')return '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>';return ICONS.records;}
function buildChrome(){
  const nav=$('#nav');nav.innerHTML='';
  const off=B().empty?0:B().rollups.org.offTrack;
  NAV.forEach(nv=>{const badge=(nv.id==='people'&&off)?'<span class="badge">'+off+'</span>':'';nav.insertAdjacentHTML('beforeend','<div class="nav-item" data-nav="'+nv.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[nv.id]+'</svg>'+nv.label+badge+'</div>');});
  const em=(B().user&&B().user.email)||'';$('#userName').textContent=em?em.split('@')[0]:'You';$('#userAv').textContent=em?initials(em.split('@')[0].replace(/[._]/g,' ')):'R';
  const periods=(B().settings&&B().settings.periods)||[];const pw=$('#periodWrap');
  if(periods.length){pw.style.display='block';$('#periodSel').innerHTML=periods.map(p=>'<option value="'+esc(p)+'"'+(p===APP.period?' selected':'')+'>'+esc(p)+'</option>').join('');}else pw.style.display='none';
  if(!B().empty){const o=B().rollups.org;$('#scopeBadge').style.display='block';$('#scopeBadge').innerHTML='<div class="t">Org performance · '+(o.rating!=null?ratingStr(o.rating)+' / 5':'Framework')+'</div><div class="s">'+o.people+' people · '+o.departments+' departments · '+o.kpis+' KPIs</div>';
    $('#sbFoot').innerHTML='Live · '+esc(B().source.title||'Google Sheet')+'<br>'+o.kpisWithData+' of '+o.kpis+' KPIs have '+esc(APP.period)+' actuals';}
  else $('#sbFoot').textContent='Connected';
  $('#updated').innerHTML=B().lastUpdated?'<span class="dot"></span>Updated '+esc(relTime(B().lastUpdated)):'';
}
function drawBrand(){const p=[['var(--brand)',0],['var(--brand-2)',90],['var(--good)',180],['#567DE8',270]].map(([c,r])=>'<path d="M17 17 C17 9, 25 9, 25 17 C25 21, 21 25, 17 25 Z" fill="'+c+'" transform="rotate('+r+' 17 17)"/>').join('');$('#brandMark').innerHTML='<svg viewBox="0 0 34 34" width="34" height="34">'+p+'</svg>';}

function buildFilterbar(){
  if(B().empty||APP.view==='settings'||APP.view==='overview'){$('#filterbar').style.display='none';return;}
  $('#filterbar').style.display='flex';
  const f=APP.filters;
  const depts=B().departments.filter(d=>d.employeeCount>0);
  const subs=B().subTeams.filter(s=>!f.dept||s.deptId===f.dept);
  const statuses=[['','All status'],['good','On Track'],['warn','At Risk'],['bad','Off Track'],['none','Pending']];
  let h='';
  h+='<div class="selectwrap"><select class="pill-select" data-filter="dept"><option value="">All departments</option>'+depts.map(d=>'<option value="'+d.id+'"'+(f.dept===d.id?' selected':'')+'>'+esc(d.name)+'</option>').join('')+'</select></div>';
  if(subs.length)h+='<div class="selectwrap"><select class="pill-select" data-filter="subTeam"><option value="">All sub-teams</option>'+subs.map(s=>'<option value="'+s.id+'"'+(f.subTeam===s.id?' selected':'')+'>'+esc((f.dept?'':s.deptName+' · ')+s.name)+'</option>').join('')+'</select></div>';
  h+='<div class="fseg">'+statuses.map(([v,l])=>'<button data-fstatus="'+v+'" class="'+(f.status===v?'active':'')+'">'+l+'</button>').join('')+'</div>';
  h+='<div class="fsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="fSearch" placeholder="Search people, KRAs, KPIs…" value="'+esc(f.search)+'"></div>';
  const chips=[];if(f.dept)chips.push(chip('Dept','dept',(deptById(f.dept)||{}).name||''));if(f.subTeam)chips.push(chip('Sub-team','subTeam',(subById(f.subTeam)||{}).name||''));if(f.status)chips.push(chip('Status','status',(statuses.find(s=>s[0]===f.status)||['',''])[1]));if(f.search)chips.push(chip('Search','search','“'+f.search+'”'));
  if(chips.length)h+='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+chips.join('')+'<span class="clear-all" data-act="clear-filters">Clear all</span></div>';
  $('#filterbar').innerHTML=h;
}
function chip(l,k,v){return '<span class="chip">'+esc(l)+' <b>'+esc(v)+'</b><button data-clear="'+k+'">×</button></span>';}

function go(v,ctx){APP.view=v;APP.ctx=ctx||{};APP.table.page=0;scrollTop();render();}
function scrollTop(){window.scrollTo(0,0);const s=$('.main-scroll');if(s)s.scrollTop=0;}
function render(){
  if(!B()){renderEmpty();return;}
  if(B().empty){renderEmpty();return;}
  buildFilterbar();$$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.nav===APP.view));renderCrumbs();
  const c=$('#content');c.classList.remove('fade');void c.offsetWidth;c.classList.add('fade');
  const v={overview:vOverview,depts:vDepts,dept:vDept,people:vPeople,person:vPerson,records:vRecords,settings:vSettings}[APP.view]||vOverview;
  c.innerHTML=v();
}
function renderCrumbs(){
  const cr=[{t:'Overview',v:'overview'}];const lab={depts:'Departments',people:'People',records:'All KPIs',settings:'Data & Settings'};
  if(lab[APP.view])cr.push({t:lab[APP.view]});
  if(APP.view==='dept'){const d=deptById(APP.ctx.deptId);cr.push({t:'Departments',v:'depts'});if(d)cr.push({t:d.name});}
  if(APP.view==='person'){const e=empById(APP.ctx.empId);cr.push({t:'People',v:'people'});if(e)cr.push({t:e.name});}
  $('#crumbs').innerHTML=cr.map((c,i)=>{const last=i===cr.length-1,link=c.v&&!last;return (i?'<span class="sep">›</span>':'')+'<span class="'+(link?'c-link':'')+'" '+(link?'data-crumb="'+c.v+'"':'')+'>'+(last?'<b>'+esc(c.t)+'</b>':esc(c.t))+'</span>';}).join('');
}

/* ---------------- shared components ---------------- */
function kpiCard(label,value,support,opts){opts=opts||{};const color=opts.tone?'var(--'+opts.tone+'-ink)':'var(--ink)';const attr=opts.nav?('data-nav="'+opts.nav+'"'):(opts.attr||'');const clk=(opts.nav||opts.attr)?' kc-click':'';const barPct=opts.bar!=null?clamp(opts.bar,0,100):null;return '<div class="kc'+clk+'" '+attr+'><div class="kc-label">'+label+(opts.wt!=null?'<span class="wt">'+opts.wt+'%</span>':'')+'</div><div><div class="kc-value" style="color:'+color+'">'+value+'</div>'+(support?'<div class="kc-support">'+support+'</div>':'')+(barPct!=null?'<div class="kc-bar"><span style="width:'+barPct+'%;background:'+sc(opts.tone||'none')+'"></span></div>':'')+'</div></div>';}
function rchip(rating,status){return '<div class="rchip" style="color:'+sc(status.k)+';background:'+tint(status.k)+'">'+(rating==null?'—':ratingStr(rating))+(rating==null?'':'<small>/5</small>')+'</div>';}
function statusPill(status){return '<span class="pill '+status.k+'"><span class="sdot s-'+status.k+'"></span>'+esc(status.label)+'</span>';}
function ratingBar(rating){const p=rating==null?0:clamp((rating-1)/4*100,0,100);const k=rating==null?'none':(rating>=B().settings.thresholds.onTrack?'good':(rating>=B().settings.thresholds.atRisk?'warn':'bad'));return '<div class="bc-track"><div class="bc-fill" style="width:'+p+'%;background:'+sc(k)+'"></div></div>';}

function ladder(rec){
  if(!rec.bands||!rec.bands.length)return '';
  const active=rec.rating==null?-1:clamp(Math.round(rec.rating),1,rec.bands.length)-1;
  const cells=rec.bands.map((b,i)=>{const on=i===active;const g='g'+(i+1);return '<div class="lb '+g+(on?' on':'')+'"><div class="lbn">'+esc(b.label?shortBand(b.label):(i+1)+'')+'</div><div class="lbv" title="'+esc(b.raw||'')+'">'+esc(b.raw||'—')+'</div></div>';}).join('');
  const dir=rec.qualitative?'Qualitative — manual rating':(rec.direction<0?'Lower is better':'Higher is better');
  return '<div class="ladder">'+cells+'</div><div class="ladder-cap"><span>'+esc(dir)+'</span><span>Band 3 = Meets / on-target</span></div>';
}
function shortBand(l){l=String(l);const m=l.match(/\((\d)\)/);if(m)return m[1];const t=l.replace(/target\s*/i,'T').match(/T\s*\d/i);if(t)return t[0].replace(/\s/g,'');if(/needs/i.test(l))return '1';if(/below/i.test(l))return '2';if(/meets/i.test(l))return '3';if(/above/i.test(l))return '4';if(/exceeds/i.test(l))return '5';return l.slice(0,6);}

function deptBar(d,hasData){

function attentionList(hasData){

function coveragePanel(){

  <div class="panel pad"><div class="tbl-wrap"><table class="info-tbl"><thead><tr><th>Tab</th><th>Rows</th><th>Cols</th></tr></thead><tbody>${src.tabs.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+t.rows+'</td><td>'+t.cols+'</td></tr>').join('')}</tbody></table></div>
  <div class="stack" style="font-size:12.5px;color:var(--muted)">${B().departments.map(d=>esc(d.name)+' → '+d.kind+' ('+d.employeeCount+' people, '+d.kpiCount+' KPIs)').join('<br>')}</div>
  ${(B().notes&&B().notes.length)?'<div class="stack" style="font-size:12px;color:var(--warn-ink)">'+B().notes.map(esc).join('<br>')+'</div>':''}</div>`;
}

/* ---------------- DRAWER (KPI detail + edit) ---------------- */
function openRec(id){
  const r=recById(id);if(!r)return;const e=empById(r.employeeId);
  const meets=r.bands&&r.bands[2]?r.bands[2].raw:'';
  $('#drawerContent').innerHTML=`
    <div class="drawer-h"><div style="min-width:0">${statusPill(r.status)}<h2 style="margin-top:9px">${esc(r.kpi||r.kra||'KPI')}</h2>
      <div class="sub"><span class="tag brand">${esc(r.department)}</span>${r.subTeam?'<span class="tag">'+esc(r.subTeam)+'</span>':''}<span>${esc(r.employee)}</span></div></div>
      <button class="icon-btn close" data-act="close-drawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="drawer-body">
      ${r.kra&&r.kpi&&r.kra!==r.kpi?'<div class="section-t">KRA</div><div style="font-size:13px;font-weight:600;color:var(--ink-2)">'+esc(r.kra)+'</div>':''}
      ${r.definition?'<div class="section-t">Definition / goal</div><div class="def-box">'+esc(r.definition)+'</div>':''}
      <div class="section-t">Rubric — 5 band scale</div>
      ${ladder(r)}
      <div class="section-t">Scoring</div>
      <div class="metric-grid">
        <div class="metric"><div class="l">Weightage</div><div class="v">${r.weightShown==null?'—':n1(r.weightShown)+'<small>%</small>'}</div></div>
        <div class="metric"><div class="l">Rating</div><div class="v" style="color:${sc(r.status.k)}">${r.rating==null?'—':ratingStr(r.rating)}<small>/5</small></div></div>
        <div class="metric"><div class="l">Achieved band</div><div class="v" style="font-size:13px">${esc(r.achievedBand||'—')}</div></div>
        <div class="metric"><div class="l">Target (Meets)</div><div class="v" style="font-size:14px">${esc(meets||(r.target==null?'—':r.target))}</div></div>
        <div class="metric"><div class="l">Actual</div><div class="v" style="font-size:15px">${r.actual==null?'—':esc(unitStr(r,r.actual))}</div></div>
        <div class="metric"><div class="l">Attainment</div><div class="v">${r.attainment==null?'—':pct(r.attainment)}</div></div>
      </div>
      <div class="section-t">Enter ${esc(APP.period)} actual</div>
      <div class="row2">
        <div class="field"><label>Actual ${r.unit?'('+esc(r.unit)+')':''}</label><input id="edActual" type="number" step="any" value="${r.actual==null?'':r.actual}" ${r.qualitative?'disabled placeholder="qualitative"':''}></div>
        ${r.qualitative?'<div class="field"><label>Manual rating (1–5)</label><select id="edRating"><option value="">—</option>'+[1,2,3,4,5].map(n=>'<option value="'+n+'"'+(Math.round(r.rating)===n?' selected':'')+'>'+n+'</option>').join('')+'</select></div>':'<div class="field"><label>Target override</label><input id="edTarget" type="number" step="any" value="'+(r.target==null?'':r.target)+'"></div>'}
      </div>
      <div class="field"><label>Comment</label><textarea id="edComment" placeholder="Context, blockers, evidence notes…">${esc(r.comment||'')}</textarea></div>
      <div class="field"><label>Evidence link</label><input id="edEvidence" type="url" placeholder="https://…" value="${esc(r.evidence||'')}"></div>
      <button class="btn primary" data-act="save-actual" data-rec="${r.kpiId}">Save actual</button>
      ${r.updatedAt?'<div style="font-size:11.5px;color:var(--faint);margin-top:12px">Last updated '+esc(relTime(r.updatedAt))+'</div>':''}
      <div style="font-size:11.5px;color:var(--faint);margin-top:10px">Source of tracking: ${esc(r.source||'—')}. Saved to the ${esc(B().source.actuals.tab)} source; this view recomputes on refresh.</div>
    </div>`;
  $('#drawer').classList.add('on');$('#scrim').classList.add('on');
}
function closeDrawer(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');}
async function saveActual(id){
  const r=recById(id);if(!r)return;
  const payload={kpiId:id,period:APP.period};
  const a=$('#edActual');if(a&&!a.disabled)payload.actual=a.value===''?'':a.value;
  const t=$('#edTarget');if(t)payload.target=t.value===''?'':t.value;
  const rt=$('#edRating');if(rt)payload.rating=rt.value===''?'':rt.value;
  const c=$('#edComment');if(c)payload.comment=c.value;
  const ev=$('#edEvidence');if(ev)payload.evidence=ev.value;
  toast('Saving…');
  try{const res=await call('apiSaveActual',payload);
    if(res&&res.ok){const b=await call('apiBootstrap',{force:true,period:APP.period});applyBoot(b);toast('Saved');openRec(id);}
    else toast((res&&res.error)||'Save failed',true);
  }catch(e){if(e&&e.__offline)toast('Connect to the sheet to save',true);else toast('Save failed',true);}
}

/* ---------------- states ---------------- */
function showState(kind,msg){
  $('#filterbar').style.display='none';const c=$('#content');
  if(kind==='loading'){c.innerHTML=skeleton();return;}
  if(kind==='offline'){c.innerHTML=stateCard('link','Connect to the Google Sheet','This dashboard runs live via Apps Script reading your master KRA/KPI sheet. Open it from the deployed web-app URL (Extensions → Apps Script → Deploy → Web app). It carries no offline data by design.','<button class="btn primary" data-act="refresh">Retry connection</button>');return;}
  if(kind==='error'){c.innerHTML=stateCard('alert','Couldn’t load the dashboard',esc(msg||'Something went wrong reading the sheet.'),'<button class="btn primary" data-act="refresh">Try again</button>',true);return;}
}
function renderEmpty(){$('#filterbar').style.display='none';buildChrome();$('#content').innerHTML=stateCard('doc','No KRA/KPI framework detected',esc((B()&&B().message)||'The parser found no KRA/KPI tabs (Perspective / KRA / KPI / Weightage / band columns). Check the master sheet and refresh — see Data & Settings for what each tab was classified as.'),'<button class="btn primary" data-act="refresh">Refresh</button>');}
function stateCard(icon,title,body,action,err){const ic={link:'<path d="M9 12a4 4 0 0 1 4-4h3a4 4 0 1 1 0 8h-1"/><path d="M15 12a4 4 0 0 1-4 4H8a4 4 0 1 1 0-8h1"/>',alert:'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>'}[icon]||'';return '<div class="state '+(err?'err':'')+'"><div class="state-card"><div class="state-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ic+'</svg></div><h2>'+esc(title)+'</h2><p>'+body+'</p>'+(action||'')+'</div></div>';}
function skeleton(){const c='<div class="skl" style="height:126px"></div>';return '<div style="padding:4px 0 18px"><div class="skl" style="height:26px;width:280px;margin-bottom:10px"></div><div class="skl" style="height:14px;width:440px"></div></div><div class="kc-grid c4">'+c+c+c+c+'</div><div class="skl" style="height:240px"></div>';}

/* ---------------- helpers using settings ---------------- */
function statusFromRating(r){const th=B().settings.thresholds;if(r==null||isNaN(r))return {k:'none',label:'Pending'};if(r>=4.25)return {k:'good',label:'Exceeding'};if(r>=th.onTrack)return {k:'good',label:'On Track'};if(r>=th.atRisk)return {k:'warn',label:'At Risk'};return {k:'bad',label:'Off Track'};}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');if(act){handleAct(act.dataset.act,act);return;}
  const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);closeNav();return;}
  const cr=e.target.closest('[data-crumb]');if(cr){go(cr.dataset.crumb);return;}
  const cl=e.target.closest('[data-clear]');if(cl){APP.filters[cl.dataset.clear]='';APP.table.page=0;render();return;}
  const fs=e.target.closest('[data-fstatus]');if(fs){APP.filters.status=fs.dataset.fstatus;APP.table.page=0;render();return;}
  const so=e.target.closest('[data-sort]');if(so){const k=so.dataset.sort;if(APP.table.sort===k)APP.table.dir*=-1;else{APP.table.sort=k;APP.table.dir=(['employee','department','subTeam','kra','kpi'].indexOf(k)>=0)?1:-1;}render();return;}
  const pg=e.target.closest('[data-page]');if(pg){APP.table.page+=(pg.dataset.page==='next'?1:-1);render();return;}
  const rc=e.target.closest('[data-rec]');if(rc){openRec(rc.dataset.rec);return;}
  const sb=e.target.closest('[data-subteam]');if(sb){APP.filters.subTeam=sb.dataset.subteam;APP.filters.dept=(subById(sb.dataset.subteam)||{}).deptId||'';go('people');return;}
  const dp=e.target.closest('[data-dept]');if(dp){go('dept',{deptId:dp.dataset.dept});return;}
  const pc=e.target.closest('[data-person]');if(pc){go('person',{empId:pc.dataset.person});return;}
});
document.addEventListener('change',e=>{
  const fl=e.target.closest('[data-filter]');if(fl){APP.filters[fl.dataset.filter]=fl.value;if(fl.dataset.filter==='dept')APP.filters.subTeam='';APP.table.page=0;render();return;}
  if(e.target&&e.target.id==='periodSel'){APP.period=e.target.value;doRefresh();return;}
});
let searchT;document.addEventListener('input',e=>{if(e.target&&e.target.id==='fSearch'){clearTimeout(searchT);const v=e.target.value.trim();searchT=setTimeout(()=>{APP.filters.search=v;APP.table.page=0;const el=document.activeElement,was=el&&el.id==='fSearch',pos=was?el.selectionStart:null;render();if(was){const s=$('#fSearch');if(s){s.focus();try{s.setSelectionRange(pos,pos);}catch(x){}}}},200);}});
function handleAct(a,el){
  if(a==='close-drawer')closeDrawer();
  else if(a==='toggle-nav')$('#sidebar').classList.toggle('open');
  else if(a==='refresh')doRefresh();
  else if(a==='clear-filters'){APP.filters={dept:'',subTeam:'',status:'',search:''};APP.table.page=0;render();}
  else if(a==='save-actual')saveActual(el.dataset.rec);
  else if(a==='scaffold')doScaffold();
  else if(a==='save-settings')doSaveSettings();
}
function closeNav(){$('#sidebar').classList.remove('open');}
async function doRefresh(){toast('Refreshing…');try{const b=await call('apiBootstrap',{force:true,period:APP.period||undefined});if(b&&b.ok&&b.connected!==false){applyBoot(b);toast('Up to date');}else showState('error',b&&b.error||'Refresh failed');}catch(e){if(e&&e.__offline)showState('offline');else toast('Error',true);}}
async function doScaffold(){toast('Building actuals sheet…');try{const res=await call('apiScaffoldActuals',{period:APP.period});if(res&&res.ok){toast(res.added+' rows added to '+res.tab);doRefresh();}else toast((res&&res.error)||'Failed',true);}catch(e){if(e&&e.__offline)toast('Connect to the sheet first',true);else toast('Failed',true);}}
async function doSaveSettings(){const on=$('#setOnTrack'),ar=$('#setAtRisk');const p={};if(on)p.onTrack=on.value;if(ar)p.atRisk=ar.value;toast('Saving…');try{const res=await call('apiSaveSettings',p);if(res&&res.ok){toast('Saved');doRefresh();}else toast('Failed',true);}catch(e){if(e&&e.__offline)toast('Connect first',true);else toast('Failed',true);}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
let toastT;function toast(m,err){const t=$('#toast');t.textContent=m;t.classList.toggle('err',!!err);t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),err?4000:2200);}
boot();
</script>
</body>
</html>

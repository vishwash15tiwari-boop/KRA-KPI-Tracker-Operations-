<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recykal · KRA / KPI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Strictly white / black / grayscale — no colour coding, no gradients */
  --brand:#111111;--brand-2:#111111;--brand-soft:#F2F2F2;--brand-ink:#111111;
  --ink:#111111;--ink-2:#666666;--muted:#999999;--faint:#B4B4B4;
  --line:#E5E5E5;--line-2:#DADADA;--line-soft:#F0F0F0;--bg:#FFFFFF;--card:#FFFFFF;--surface-2:#F7F7F7;--surface-3:#F2F2F2;
  --good:#111111;--good-soft:#F2F2F2;--good-ink:#111111;
  --warn:#666666;--warn-soft:#F2F2F2;--warn-ink:#666666;
  --bad:#111111;--bad-soft:#F2F2F2;--bad-ink:#111111;
  --none:#C7C7C7;--none-soft:#F7F7F7;
  --shadow-xs:0 0 0 0 rgba(0,0,0,0);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px -16px rgba(0,0,0,.16);
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.20);
  --r-lg:18px;--r-md:14px;--sbw:246px;--ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:'tnum' 1,'calt' 1,'cv11' 1;letter-spacing:-.011em}
button,input,select{font-family:inherit}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:5px}
::selection{background:rgba(0,0,0,.10)}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:#D4DAE3;border-radius:20px;border:3px solid var(--bg);background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:#BFC7D2}

.app{min-height:100vh;display:flex;flex-direction:column}
/* top navigation — white, thin bottom border, minimal active state */
.topnav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.tn-inner{max-width:1360px;margin:0 auto;padding:0 32px;height:56px;display:flex;align-items:center;gap:28px}
.wordmark{font-weight:600;font-size:17px;letter-spacing:-.02em;color:var(--ink);flex:0 0 auto}
.tn-links{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.nav-item{display:flex;align-items:center;padding:8px 14px;border-radius:9px;position:relative;color:var(--ink-2);font-weight:500;cursor:pointer;font-size:14px;letter-spacing:-.006em;white-space:nowrap;transition:color .16s var(--ease)}
.nav-item:hover{color:var(--ink)}
.nav-item.active{color:var(--ink);font-weight:600}
.nav-item.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-17px;height:2px;background:var(--ink);border-radius:2px}
.nav-item svg{display:none}
.nav-item .badge{margin-left:7px;font-size:10.5px;font-weight:600;background:var(--surface-3);color:var(--ink-2);border-radius:20px;padding:1px 7px}
.tn-right{display:flex;align-items:center;gap:12px;flex:0 0 auto;margin-left:auto}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:.15s}
.icon-btn:hover{border-color:var(--ink);color:var(--ink)}.icon-btn svg{width:16px;height:16px}
.userchip{display:flex;align-items:center;gap:9px;padding:4px 13px 4px 5px;border:1px solid var(--line);border-radius:24px;background:#fff;cursor:pointer;transition:.15s}
.userchip:hover{border-color:var(--ink)}
.userchip.active{border-color:var(--ink);background:var(--ink)}.userchip.active .u-name{color:#fff}.userchip.active .u-sub{color:rgba(255,255,255,.68)}.userchip.active .avatar{background:#fff;color:var(--ink)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:600;font-size:11px;display:grid;place-items:center}
.userchip .u-name{font-size:12.5px;font-weight:600;line-height:1.1;color:var(--ink)}.userchip .u-sub{font-size:10.5px;color:var(--muted)}
.main-scroll{flex:1;min-height:0}
/* sub bar — breadcrumb + freshness */
.subbar{max-width:1360px;margin:0 auto;width:100%;padding:14px 32px 0;display:flex;align-items:center;gap:12px}
.subbar:empty{display:none}
.crumbs{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;flex-wrap:wrap}
.crumbs b{color:var(--ink);font-weight:600}.crumbs .sep{color:var(--faint)}.crumbs .c-link{cursor:pointer}.crumbs .c-link:hover{color:var(--ink)}
.spacer{flex:1}
.updated{font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.updated .dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}

.filterbar{max-width:1360px;margin:16px auto 0;width:100%;padding:0 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.selectwrap{position:relative}
.pill-select{appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 30px 8px 12px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;outline:none;transition:.15s;max-width:240px}
.pill-select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.selectwrap::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.fsearch{position:relative;flex:0 1 230px}
.fsearch input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px 8px 32px;font-size:12.5px;color:var(--ink);outline:none;transition:.15s}
.fsearch input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint)}
.fseg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.fseg button{border:none;background:transparent;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s}
.fseg button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;background:var(--brand-soft);color:var(--brand-ink);border-radius:20px;padding:4px 6px 4px 11px}
.chip b{font-weight:700}.chip button{border:none;background:rgba(0,0,0,.08);color:var(--ink);width:16px;height:16px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center}
.clear-all{font-size:12px;font-weight:650;color:var(--muted);cursor:pointer;padding:4px 6px}.clear-all:hover{color:var(--bad-ink)}

.content{padding:32px 32px 80px;max-width:1360px;width:100%;margin:0 auto}
.page-head{margin-bottom:16px}
.page-head{margin-bottom:24px}
.page-head h1{font-size:32px;font-weight:600;letter-spacing:-.03em;margin:0 0 6px;line-height:1.1}
.page-head p{margin:0;color:var(--ink-2);font-size:15px;max-width:760px;line-height:1.55}
.sect-t{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.sect-t .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted)}
.q{font-size:12px;color:var(--muted);font-weight:500;font-style:italic;margin:-4px 0 10px}

.banner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);margin-bottom:16px}
.banner.warn{border-color:var(--line-2);background:var(--surface-3)}
.banner .bi{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:#fff;display:grid;place-items:center;color:var(--brand);box-shadow:var(--shadow-xs)}
.banner.warn .bi{color:var(--warn-ink)}
.banner .bt{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.banner .bs{font-size:12px;color:var(--muted);margin-top:2px}
.banner .r{margin-left:auto}

.kc-grid{display:grid;gap:14px;margin-bottom:16px}
.kc-grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kc-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kc-grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 18px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:126px;box-shadow:var(--shadow-xs);animation:rise .44s var(--ease) backwards;transition:border-color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease)}
.kc-grid .kc:nth-child(2){animation-delay:.04s}.kc-grid .kc:nth-child(3){animation-delay:.08s}.kc-grid .kc:nth-child(4){animation-delay:.12s}
.kc-click{cursor:pointer}.kc-click:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}.kc-click:active{transform:translateY(-1px);transition-duration:.06s}
.kc-label{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kc-label .wt{margin-left:auto;font-size:10px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.kc-value{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kc-value small{font-size:15px;font-weight:650;color:var(--faint);margin-left:0;letter-spacing:-.01em}
.kc-support{font-size:12px;font-weight:650;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc-bar{height:5px;border-radius:20px;background:var(--line-soft);overflow:hidden;margin-top:11px}
.kc-bar span{display:block;height:100%;border-radius:20px;transform-origin:left;animation:growx .7s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(max-width:900px){.kc-grid.c4,.kc-grid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.kc-value{font-size:27px}.kc{min-height:108px}}

.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:750;padding:1px 7px 1px 5px;border-radius:20px;font-variant-numeric:tabular-nums;line-height:1.7}
.delta svg{width:9px;height:9px}
.delta.good,.delta.bad,.delta.none{background:transparent;color:var(--ink-2);padding:0}
.levelchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand-ink);white-space:nowrap}
.levelchip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.levelchip.lv5,.levelchip.lv1,.levelchip.lv2{background:var(--surface-3);color:var(--ink-2)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-xs)}
.panel.pad{padding:20px 22px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.panel-h h3{font-size:14.5px;font-weight:700;margin:0;letter-spacing:-.014em}
.panel-h .sub{font-size:12px;color:var(--muted);font-weight:500}
.panel-h .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.link{font-size:12.5px;font-weight:650;color:var(--brand);cursor:pointer}.link:hover{text-decoration:underline}
.stack{margin-top:14px}
.two-col{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.two-eq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.two-col,.two-eq{grid-template-columns:minmax(0,1fr)}}

/* trend chart */
.trend{width:100%;height:auto;display:block;overflow:visible}
.trend .grid{stroke:var(--line);stroke-width:1}
.trend .thr{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 4}
.trend .area{opacity:.14}
.trend .ln{fill:none;stroke:var(--brand);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.trend .pt{fill:#fff;stroke:var(--brand);stroke-width:2}
.trend .pt.cur{fill:var(--brand)}
.trend .xl{fill:var(--faint);font-size:10.5px;font-weight:600}
.trend .yl{fill:var(--faint);font-size:9.5px;font-weight:600}
.trend .vlab{fill:var(--ink);font-size:10.5px;font-weight:800}

/* department / team cards */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;box-shadow:var(--shadow-xs);cursor:pointer;transition:border-color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease);animation:rise .44s var(--ease) backwards}
.dcard:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.dcard .dc-h{display:flex;align-items:center;gap:10px}
.dcard .dc-ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.dcard .dc-ic svg{width:19px;height:19px}
.dcard h3{margin:0;font-size:15px;font-weight:750;letter-spacing:-.015em}
.dcard .dc-kind{font-size:11px;color:var(--muted);font-weight:600}
.dcard .dc-score{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.dcard .dc-metrics{display:flex;gap:16px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line-soft)}
.dcard .dm{font-size:11.5px;color:var(--muted);font-weight:600}.dcard .dm b{display:block;font-size:17px;color:var(--ink);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:1px}

.list{margin:2px -8px 0}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;transition:background .14s var(--ease)}
.lrow:hover{background:var(--surface-2)}.lrow+.lrow{box-shadow:inset 0 1px 0 var(--line-soft)}
.lrow.static{cursor:default}.lrow.static:hover{background:transparent}
.lrow-id{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.lrow-name{font-size:13.5px;font-weight:650;min-width:0;letter-spacing:-.01em}
.lrow-name .lrow-sub{display:block;font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lavatar{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:12px;display:grid;place-items:center;transition:.16s}
.lrow:hover .lavatar{background:var(--brand-soft);color:var(--brand)}
.rank{width:20px;flex:0 0 20px;text-align:center;font-size:12px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}.rank.top{color:var(--brand)}
.lrow-track{flex:0 0 116px;height:8px;background:var(--line-soft);border-radius:20px;overflow:hidden}
.lrow-track span{display:block;height:100%;border-radius:20px}
.lrow-meta{font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right;white-space:nowrap}
@media(max-width:620px){.lrow-track{display:none}}
.sdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;display:inline-block;border:1.5px solid var(--ink);background:transparent}
.s-good{background:var(--ink)}
.s-warn{background:linear-gradient(90deg,var(--ink) 0 50%,transparent 50% 100%)}
.s-bad{background:transparent}
.s-none{border-color:var(--none);background:transparent}
.chev{color:var(--faint);font-size:18px;flex:0 0 12px;text-align:center;transition:transform .18s var(--ease),color .18s var(--ease)}.lrow:hover .chev{transform:translateX(3px);color:var(--ink-2)}
.rchip{min-width:50px;text-align:center;font-size:13.5px;font-weight:800;padding:5px 8px;border-radius:9px;font-variant-numeric:tabular-nums;letter-spacing:-.015em;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 14%,transparent)}
.rchip small{font-size:9.5px;font-weight:700;opacity:.6}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.good,.pill.warn,.pill.bad{background:var(--surface-3);color:var(--ink)}.pill.none{background:var(--surface-2);color:var(--muted)}
.tag{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 8px;white-space:nowrap}
.tag.brand{color:var(--ink);background:var(--surface-3);border-color:var(--line)}
.tag.mt{color:var(--ink-2);background:#fff;border-color:var(--line)}
.mini-tag{font-size:9.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:middle}

.bc-row{display:flex;align-items:center;gap:14px;padding:10px 6px;border-radius:10px;cursor:pointer;transition:background .13s}
.bc-row.static{cursor:default}.bc-row.static:hover{background:transparent}
.bc-row:hover{background:var(--surface-2)}
.bc-label{width:184px;flex:0 0 184px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-label small{color:var(--muted);font-weight:500}
.bc-track{flex:1;height:10px;background:var(--line-soft);border-radius:20px;overflow:hidden;min-width:40px}
.bc-fill{height:100%;border-radius:20px;transform-origin:left center;animation:growx .72s var(--ease) backwards}
.bc-val{width:70px;flex:0 0 70px;text-align:right;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.bc-val small{font-size:9.5px;color:var(--faint);font-weight:700}
.bc-chev{color:var(--faint);flex:0 0 10px}
@media(max-width:560px){.bc-label{width:104px;flex-basis:104px}.bc-row{gap:9px}.bc-chev{display:none}.bc-val{width:auto;flex:0 0 auto}}

.person-hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.person-hd .pa{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;flex:0 0 54px}
.person-hd h1{margin:0;font-size:22px;letter-spacing:-.025em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.person-hd .meta{color:var(--muted);font-size:12.5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:5px}
.person-hd .r{margin-left:auto}

/* in-page tabs */
.tabs{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;margin:2px 0 4px}
.tabs button{border:none;background:transparent;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:650;color:var(--muted);cursor:pointer;transition:.15s}
.tabs button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs)}

/* KRA group + KPI score cards */
.kra-group{margin-top:6px}
.kg-h{display:flex;align-items:center;gap:9px;margin:20px 0 10px}
.kg-h .kg-t{font-size:13px;font-weight:750;letter-spacing:-.01em}
.kg-h .kg-p{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.kg-h .kg-line{flex:1;height:1px;background:var(--line)}
.kg-h .kg-r{font-size:12px;font-weight:750;font-variant-numeric:tabular-nums}
.kpigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(324px,1fr));gap:13px}
.kcard{border:1px solid var(--line);border-radius:15px;padding:15px 16px;box-shadow:var(--shadow-xs);cursor:pointer;background:var(--card);transition:border-color .16s,box-shadow .16s,transform .16s;display:flex;flex-direction:column}
.kcard:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.kcard .kh{display:flex;align-items:flex-start;gap:9px}
.kcard .kh .kt{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.3;min-width:0}
.kcard .kh .kt small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kcard .kh .wt{margin-left:auto;flex:0 0 auto;font-size:10px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.kcard .kmeta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.kcard .kfoot{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft)}
.kcard .kfoot .kval{font-size:12.5px;font-weight:600;color:var(--muted)}.kcard .kfoot .kval b{color:var(--ink);font-variant-numeric:tabular-nums}
.kcard .kfoot .r{margin-left:auto;display:flex;align-items:center;gap:8px}

/* band ladder (type-adaptive) */
.ladder{display:flex;gap:4px;margin-top:12px}
.lb{flex:1;min-width:0;border-radius:8px;padding:7px 4px 6px;text-align:center;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:.16s}
.lb .lbn{font-size:9px;font-weight:700;color:var(--faint);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .lbv{font-size:10.5px;font-weight:700;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb.on{border-color:transparent;color:#fff;box-shadow:var(--shadow-xs)}
.lb.on .lbn{color:rgba(255,255,255,.82)}.lb.on .lbv{color:#fff}
.lb.meets::after{content:"MEETS";position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:7px;font-weight:800;letter-spacing:.04em;color:var(--faint);background:var(--card);padding:0 3px}
.lb.g1,.lb.g2,.lb.g3,.lb.g4,.lb.g5{--c:var(--ink)}
.lb.on{background:var(--c)}
.lb .qd{width:11px;height:11px;border-radius:50%;border:2px solid var(--faint);margin:3px auto 0}
.lb.on .qd{border-color:#fff;background:#fff}
.ladder-cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-weight:600;margin-top:8px;gap:8px}
.ladder-act{font-size:11.5px;color:var(--ink-2);font-weight:600;margin-top:8px;padding:7px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ladder-act b{color:var(--ink);font-variant-numeric:tabular-nums}
.ladder-mark{position:relative;height:14px;margin-top:6px}
.ladder-mark .tk{position:absolute;top:0;width:2px;height:8px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.ladder-mark .tk::after{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--ink)}

/* milestone */
.ms{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card);box-shadow:var(--shadow-xs);display:flex;flex-direction:column;gap:10px}
.ms .ms-h{display:flex;align-items:center;gap:10px}
.ms .ms-h .ms-t{font-size:13.5px;font-weight:700}.ms .ms-h .ms-t small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.ms .ms-h .r{margin-left:auto}
.ms-track{position:relative;height:9px;border-radius:20px;background:var(--line-soft);overflow:hidden}
.ms-track span{position:absolute;left:0;top:0;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.ms-foot{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--muted);font-weight:600}
.ms-foot b{color:var(--ink)}
.ms.done{align-items:flex-start}

/* distribution histogram */
.hist{display:flex;align-items:flex-end;gap:12px;height:150px;padding:8px 4px 0}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;cursor:pointer}
.hbar{width:100%;max-width:56px;border-radius:8px 8px 3px 3px;background:var(--brand-soft);position:relative;transition:.16s;min-height:3px}
.hcol:hover .hbar{filter:brightness(.96)}
.hbar b{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.hlab{font-size:10.5px;font-weight:650;color:var(--muted);text-align:center;line-height:1.2}
.hlab small{display:block;color:var(--faint);font-weight:600;font-size:9px}

/* achievements */
.ach{display:flex;flex-wrap:wrap;gap:8px}
.ach span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:6px 12px}
.ach span svg{width:13px;height:13px;color:var(--good)}

/* review block */
.review{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--surface-2)}
.review .rv-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.review .rv-txt{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.review .rv-meta{font-size:11px;color:var(--faint);margin-top:9px;display:flex;gap:12px;flex-wrap:wrap}

/* KRAs & KPIs — expandable list (§8) */
.linkrow{display:flex;gap:24px;flex-wrap:wrap;margin-top:2px}
.bar{flex:0 0 120px;height:6px;background:var(--surface-3);border-radius:20px;overflow:hidden}
.bar.wide{flex-basis:200px}
.bar span{display:block;height:100%;background:var(--ink);border-radius:20px;transform-origin:left;animation:growx .7s var(--ease) backwards}
.exp-p{margin-bottom:24px}
.exp-ph{display:flex;align-items:center;gap:16px;padding:0 2px 12px;border-bottom:1px solid var(--line)}
.exp-pt{font-size:15px;font-weight:600;letter-spacing:-.012em;flex:1;min-width:0}
.exp-pr{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}.exp-pr small{font-size:11px;color:var(--muted);font-weight:600;margin-left:1px}
.exp-kra{display:flex;align-items:center;gap:14px;padding:14px 8px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .14s}
.exp-kra:hover{background:var(--surface-2)}
.exp-name{flex:1;min-width:0;font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-name small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.exp-val{width:48px;text-align:right;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.exp-chev{color:var(--muted);font-size:12px;width:14px;text-align:center}
.exp-kpis{overflow:hidden;animation:expand .32s var(--ease);padding-left:20px;border-left:1px solid var(--line);margin:0 0 10px 14px}
.exp-kpi{display:flex;align-items:center;gap:12px;padding:11px 8px;cursor:pointer;border-radius:9px;transition:background .14s}
.exp-kpi:hover{background:var(--surface-2)}
@keyframes expand{from{opacity:0;max-height:0}to{opacity:1;max-height:1600px}}
.tbl-wrap{overflow-x:auto;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:940px}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.num{text-align:right}.tbl th.sorted{color:var(--ink-2)}.tbl th .sc{opacity:.5;font-size:9px;margin-left:3px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tbl tbody tr{cursor:pointer;transition:.12s}.tbl tbody tr:hover{background:var(--surface-2)}.tbl tbody tr:last-child td{border-bottom:none}
.tbl .kname{font-weight:650}.tbl .kname small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.pager{display:flex;align-items:center;justify-content:space-between;padding-top:12px;font-size:12.5px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;margin-left:6px}
.pager button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}.pager button:disabled{opacity:.45;cursor:default}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px}.empty svg{width:36px;height:36px;opacity:.3;margin-bottom:6px}

.info-tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.info-tbl th{background:var(--surface-2);text-align:left;font-size:11px;font-weight:700;color:var(--ink-2);padding:8px 11px;border:1px solid var(--line);white-space:nowrap}
.info-tbl td{padding:8px 11px;border:1px solid var(--line-soft);vertical-align:top;color:var(--ink-2)}

.hcheck{display:flex;align-items:center;gap:11px;padding:11px 6px}.hcheck+.hcheck{box-shadow:inset 0 1px 0 var(--line-soft)}
.hcheck .hc-ic{width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:grid;place-items:center}
.hcheck .hc-ic svg{width:14px;height:14px}
.hcheck.ok .hc-ic{background:var(--good-soft);color:var(--good-ink)}.hcheck.warn .hc-ic{background:var(--warn-soft);color:var(--warn-ink)}.hcheck.bad .hc-ic{background:var(--bad-soft);color:var(--bad-ink)}
.hcheck .hc-t{font-size:13px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}.hcheck .hc-t small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.hcheck .r{margin-left:auto;flex:0 0 auto;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

.state{min-height:60vh;display:grid;place-items:center;padding:20px}
.state-card{max-width:470px;text-align:center}
.state-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0 auto 16px;background:var(--brand-soft);color:var(--brand)}.state-ic svg{width:26px;height:26px}
.state h2{font-size:18px;font-weight:750;margin:0 0 8px;letter-spacing:-.02em}
.state p{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 18px}
.state.err .state-ic{background:var(--bad-soft);color:var(--bad-ink)}
.skl{background:linear-gradient(90deg,#EEF1F6,#F6F8FB,#EEF1F6);background-size:200% 100%;border-radius:12px;animation:sh 1.3s ease infinite}@keyframes sh{to{background-position:-200% 0}}
.btn{border:none;border-radius:11px;padding:10px 18px;font-size:13.5px;font-weight:650;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cta,#000);color:#fff}.btn.primary:hover{background:#000}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.32);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s;z-index:60}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:540px;max-width:94vw;background:#fff;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .28s var(--ease);z-index:61;display:flex;flex-direction:column}.drawer.on{transform:none}
.drawer-h{padding:20px 22px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.drawer-h h2{margin:0;font-size:17px;font-weight:750;letter-spacing:-.015em;line-height:1.25}
.drawer-h .sub{font-size:12px;color:var(--muted);margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drawer-body{padding:20px 22px;overflow-y:auto;flex:1}
.drawer .close{margin-left:auto;flex:0 0 34px}
.section-t{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px;display:flex;align-items:center;gap:8px}.section-t:first-child{margin-top:0}
.section-t .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted)}
.def-box{font-size:12.5px;color:var(--ink-2);line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.def-box .dm{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.def-box .dm b{color:var(--ink-2)}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow-xs)}
.metric .l{font-size:11px;color:var(--muted);font-weight:600}.metric .v{font-size:17px;font-weight:800;letter-spacing:-.025em;margin-top:5px;font-variant-numeric:tabular-nums}.metric .v small{font-size:11px;font-weight:600;color:var(--faint)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:650;color:var(--ink-2);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:13px;color:var(--ink);outline:none;transition:.15s;background:#fff}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.24s;z-index:80}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{background:var(--bad)}
.fade{animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.hamburger{display:none}
@media(max-width:900px){
  .hamburger{display:grid;order:-1}
  .tn-inner{gap:14px;padding:0 16px}
  .tn-links{position:absolute;left:0;right:0;top:56px;flex-direction:column;align-items:stretch;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px 12px;box-shadow:var(--shadow);max-height:0;overflow:hidden;transition:max-height .28s var(--ease);z-index:39}
  .tn-links.open{max-height:70vh}
  .nav-item{padding:11px 12px;border-radius:10px;font-size:15px}
  .nav-item.active{background:var(--surface-3)}
  .nav-item.active::after{display:none}
  .subbar,.filterbar{padding-left:16px;padding-right:16px}
  .content{padding:22px 16px 64px}
  .wordmark{flex:1}
}
@media(max-width:620px){.userchip .u-meta{display:none}.updated{display:none}.metric-grid{grid-template-columns:repeat(2,1fr)}.person-hd .r{margin-left:0;width:100%}.fseg{flex-wrap:wrap}.fseg button{padding:6px 9px;font-size:11.5px}.fsearch{flex:1 1 100%}.pill-select{max-width:100%}}
@media(max-width:480px){.crumbs{display:none}.userchip{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.05ms!important}}
</style>

<body>
<div class="app">
  <header class="topnav" id="topnav">
    <div class="tn-inner">
      <div class="wordmark">RECYKAL</div>
      <button class="icon-btn hamburger" data-act="toggle-nav" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <nav class="tn-links" id="nav"></nav>
      <div class="tn-right">
        <div class="selectwrap" id="periodWrap" style="display:none"><select class="pill-select" id="periodSel" data-act="period"></select></div>
        <button class="icon-btn" data-act="refresh" title="Refresh from sheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></button>
        <div class="userchip" data-act="go-me" id="profileChip" title="My Performance"><div class="avatar" id="userAv">R</div><div class="u-meta"><div class="u-name" id="userName">User</div><div class="u-sub">My Performance</div></div></div>
      </div>
    </div>
  </header>
  <div class="subbar" id="subbar"><div class="crumbs" id="crumbs"></div><div class="spacer"></div><div class="updated" id="updated"></div></div>
  <div class="filterbar" id="filterbar" style="display:none"></div>
  <div class="main-scroll"><div class="content" id="content"></div></div>
</div>
<div class="scrim" id="scrim" data-act="close-drawer"></div>
<aside class="drawer" id="drawer"><div id="drawerContent"></div></aside>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const n1=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10);
const n2=v=>v==null||isNaN(v)?'—':(Math.round(v*100)/100);
const pct=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10)+'%';
/* Monochrome: bars/values are ink; status conveyed by glyph + label, not colour */
const SCOL={good:'var(--ink)',warn:'var(--ink)',bad:'var(--ink)',none:'var(--none)'};
const STINT={good:'var(--surface-3)',warn:'var(--surface-3)',bad:'var(--surface-3)',none:'var(--none-soft)'};
const sc=k=>SCOL[k]||SCOL.none, tint=k=>STINT[k]||STINT.none;
const AR_UP='<svg viewBox="0 0 10 10"><path d="M5 2.2l3.2 5.2H1.8z" fill="currentColor"/></svg>';
const AR_DN='<svg viewBox="0 0 10 10"><path d="M5 7.8L1.8 2.6h6.4z" fill="currentColor"/></svg>';
const MONTHS=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function relTime(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';const s=(Date.now()-d.getTime())/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';return d.toLocaleDateString();}
function ratingStr(r){return r==null?'—':(Math.round(r*10)/10).toFixed(1);}
function periodShort(p){const m=/^(\d{4})-(\d{2})$/.exec(p||'');return m?(MONTHS[+m[2]]||m[2]):(p||'');}
function periodLong(p){const m=/^(\d{4})-(\d{2})$/.exec(p||'');return m?(periodShort(p)+" '"+m[1].slice(2)):(p||'');}
/* type-adaptive value formatting from the KPI rule layer */
function fmtVal(rec,v){if(v==null||v==='')return '—';const mt=rec&&rec.metricType;if(mt==='Percentage')return n2(v)+'%';if(mt==='Days')return n2(v)+' d';if(mt==='Amount')return '₹'+n2(v)+' Cr';return String(n2(v));}
function unitStr(rec,v){return fmtVal(rec,v);}

function backend(){return (typeof google!=='undefined'&&google.script&&google.script.run)?google.script.run:null;}
function call(fn,payload){return new Promise((resolve,reject)=>{const b=backend();if(!b){reject({__offline:true});return;}b.withSuccessHandler(resolve).withFailureHandler(reject)[fn](payload);});}

const APP={boot:null,mode:'mgmt',view:'overview',ctx:{},meId:null,tab:'',expanded:{},filters:{dept:'',subTeam:'',status:'',search:''},table:{sort:'employee',dir:1,page:0,per:14},period:''};
function B(){return APP.boot;}
function TH(){return B().settings.thresholds;}

async function boot(){
  drawBrand();showState('loading');
  try{const b=await call('apiBootstrap',{period:APP.period||undefined});
    if(!b){showState('error','No response from the backend.');return;}
    if(!b.ok||b.connected===false){showState('error',b.error||'Could not connect to the Google Sheet.');return;}
    applyBoot(b);
  }catch(e){if(e&&e.__offline){showState('offline');return;}showState('error',(e&&e.message)||String(e));}
}
function applyBoot(b){APP.boot=b;APP.period=b.period||APP.period;if(!APP.meId)APP.meId=guessMe(b);buildChrome();render();}
window.__applyBoot=applyBoot;window.__boot=boot;
function guessMe(b){const em=(b.user&&b.user.email||'').split('@')[0].replace(/[._]+/g,' ').trim().toLowerCase();if(!em)return null;let best=null;(b.employees||[]).forEach(e=>{const n=e.name.toLowerCase();if(n===em||em.indexOf(n)>=0||n.indexOf(em)>=0)best=best||e.id;});return best;}

/* ---------------- data helpers ---------------- */
function recById(id){return B().records.find(r=>r.kpiId===id);}
function empById(id){return B().employees.find(e=>e.id===id);}

/* SVG trend line (rating 1..5 over periods) */
function trendChart(series,opts){
  opts=opts||{};const W=opts.w||600,H=opts.h||150,pad={l:26,r:14,t:16,b:26};
  const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b,n=series.length;

  if(!idx.length)return '<div class="empty" style="padding:24px">No trend data for these periods yet.</div>';
  const x=i=>pad.l+(n<=1?iw/2:iw*i/(n-1));
  const y=v=>pad.t+ih*(1-(clamp(v,1,5)-1)/4);
  const th=TH();
  let g='';
  [1,2,3,4,5].forEach(v=>{g+='<line class="grid" x1="'+pad.l+'" y1="'+y(v)+'" x2="'+(W-pad.r)+'" y2="'+y(v)+'" opacity="'+(v===1?.9:.5)+'"/>';g+='<text class="yl" x="'+(pad.l-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>';});
  g+='<line class="thr" x1="'+pad.l+'" y1="'+y(th.onTrack)+'" x2="'+(W-pad.r)+'" y2="'+y(th.onTrack)+'"/>';
  const line=idx.map((p,k)=>(k?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=line+' L'+x(idx[idx.length-1].i).toFixed(1)+' '+(pad.t+ih)+' L'+x(idx[0].i).toFixed(1)+' '+(pad.t+ih)+' Z';
  let pts='';idx.forEach((p,k)=>{const cur=k===idx.length-1;pts+='<circle class="pt'+(cur?' cur':'')+'" cx="'+x(p.i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(cur?4:3)+'"/>';if(cur)pts+='<text class="vlab" x="'+x(p.i).toFixed(1)+'" y="'+(y(p.v)-9).toFixed(1)+'" text-anchor="middle">'+ratingStr(p.v)+'</text>';});
  let xl='';series.forEach((p,i)=>{xl+='<text class="xl" x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(periodShort(p.period))+'</text>';});
  return '<svg class="trend" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="tgr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>'+g+'<path class="area" d="'+area+'" fill="url(#tgr)"/><path class="ln" d="'+line+'"/>'+pts+xl+'</svg>';
}

/* type-adaptive Target 1–5 ladder */
function ladder(rec){
  if(!rec.bands||!rec.bands.length)return '';
  const active=rec.rating==null?-1:clamp(Math.round(rec.rating),1,rec.bands.length)-1;
  const meetsIdx=rec.bands.length>=3?2:Math.floor(rec.bands.length/2);
  const cells=rec.bands.map((b,i)=>{const on=i===active;const g='g'+(i+1);const inner=rec.qualitative?'<div class="qd"></div>':'<div class="lbv" title="'+esc(b.raw||'')+'">'+esc(b.raw||'—')+'</div>';return '<div class="lb '+g+(on?' on':'')+(i===meetsIdx?' meets':'')+'"><div class="lbn">'+esc(b.label?shortBand(b.label):(i+1)+'')+'</div>'+inner+'</div>';}).join('');
  const typ=rec.metricType||(rec.qualitative?'Qualitative':'Number');
  const dir=rec.qualitative?'manual assessment':(rec.direction<0?'lower is better':'higher is better');
  let mark='';
  if(!rec.qualitative&&rec.rating!=null&&rec.bands.length>1){const pos=clamp((rec.rating-1)/(rec.bands.length-1)*100,0,100);mark='<div class="ladder-mark"><div class="tk" style="left:'+pos+'%"></div></div>';}
  let act='';
  if(rec.hasActual&&rec.actual!=null&&!rec.qualitative)act='<div class="ladder-act">Actual <b>'+esc(fmtVal(rec,rec.actual))+'</b> lands in <b>'+esc(rec.achievedBand||'—')+'</b> → rating <b>'+ratingStr(rec.rating)+'</b>'+(rec.attainment!=null?' · '+pct(rec.attainment)+' of target':'')+'</div>';
  else if(rec.qualitative&&rec.rating!=null)act='<div class="ladder-act">Manual rating <b>'+ratingStr(rec.rating)+'</b> → <b>'+esc(rec.achievedBand||'—')+'</b></div>';
  return '<div class="ladder">'+cells+'</div>'+mark+'<div class="ladder-cap"><span>'+esc(typ)+' · '+esc(dir)+'</span><span>Band '+(meetsIdx+1)+' = Meets</span></div>'+act;
}
function shortBand(l){l=String(l);const m=l.match(/\((\d)\)/);if(m)return m[1];const t=l.replace(/target\s*/i,'T').match(/T\s*\d/i);if(t)return t[0].replace(/\s/g,'');if(/needs/i.test(l))return '1';if(/below/i.test(l))return '2';if(/meets/i.test(l))return '3';if(/above/i.test(l))return '4';if(/exceeds/i.test(l))return '5';return l.slice(0,7);}

/* next-milestone for a rated KPI */
function nextMilestone(r){
  if(r.rating==null||!r.bands||!r.bands.length)return null;
  const curIdx=clamp(Math.round(r.rating),1,r.bands.length)-1;
  const up=curIdx+1;
  if(up>=r.bands.length)return {done:true,r:r};
  const band=r.bands[up];
  let gap=null;
  if(!r.qualitative&&band.num!=null&&r.actual!=null)gap=Math.round(Math.abs(band.num-r.actual)*100)/100;
  return {done:false,r:r,band:band,toRating:up+1,gap:gap,target:band.num};
}
function milestoneCard(r){
  const m=nextMilestone(r);if(!m)return '';
  const impact=r.weightShown!=null&&r.weightShown>=25?'High impact':(r.weightShown!=null&&r.weightShown>=15?'Medium impact':'Low impact');
  if(m.done)return '<div class="ms done" data-rec="'+r.kpiId+'" style="cursor:pointer"><div class="ms-h"><div class="ms-t">'+esc(r.kpi||r.kra)+'<small>Top band reached — hold the line</small></div><div class="r">'+rchip(r.rating,r.status)+'</div></div></div>';
  const p=clamp((r.rating-1)/4*100,0,100);
  const gapTxt=m.gap!=null?('<b>'+fmtVal(r,m.gap)+'</b> to go'):('reach '+esc(shortBand(m.band.label||'')));
  return '<div class="ms" data-rec="'+r.kpiId+'" style="cursor:pointer"><div class="ms-h"><div class="ms-t">'+esc(r.kpi||r.kra)+'<small>Next: '+esc(m.band.label||('Band '+m.toRating))+(m.band.raw?' ('+esc(m.band.raw)+')':'')+'</small></div><div class="r">'+rchip(r.rating,r.status)+'</div></div>'
    +'<div class="ms-track"><span style="width:'+p+'%"></span></div>'
    +'<div class="ms-foot"><span>'+gapTxt+'</span><span>·</span><span><b>'+(r.weightShown==null?'—':n1(r.weightShown)+'%')+'</b> weight</span><span>·</span><span>'+impact+'</span></div></div>';
}

/* priority = gap-below-target × weight (business relevance) */
function priorityRecords(base){
  const onT=TH().onTrack;
  return (base||B().records).filter(r=>r.rating!=null).map(r=>{const gap=Math.max(0,onT-r.rating);const w=r.weightShown!=null?r.weightShown:10;return {r,gap,w,score:gap*(w/100)};}).filter(x=>x.gap>0.01).sort((a,b)=>b.score-a.score);
}
function priorityList(base,limit){
  const items=priorityRecords(base).slice(0,limit||6);
  if(!items.length)return '<div class="empty">Nothing below target — everyone is on track 🎉</div>';
  return items.map((x,i)=>{const r=x.r;const impact=x.w>=25?'High impact':(x.w>=15?'Medium':'Low');return '<div class="lrow" data-rec="'+r.kpiId+'"><span class="rank'+(i===0?' top':'')+'">'+(i+1)+'</span><div class="lrow-id"><span class="sdot s-'+r.status.k+'"></span><div class="lrow-name">'+esc(r.kpi||r.kra)+'<span class="lrow-sub">'+esc(r.employee)+' · '+esc(r.department)+(r.subTeam?' · '+esc(r.subTeam):'')+'</span></div></div><span class="tag">'+(r.weightShown==null?'—':n1(r.weightShown)+'% · '+impact)+'</span>'+rchip(r.rating,r.status)+'<span class="chev">›</span></div>';}).join('');
}
function moversList(movers,limit){
  const arr=(movers||[]).filter(m=>Math.abs(m.delta)>=0.01);

  const top=arr.slice(0,Math.ceil((limit||6)/2)),bottom=arr.slice(-Math.floor((limit||6)/2)).reverse().filter(b=>top.indexOf(b)<0);
  return top.concat(bottom).map(m=>'<div class="lrow" data-person="'+m.id+'"><div class="lrow-id"><div class="lavatar">'+initials(m.name)+'</div><div class="lrow-name">'+esc(m.name)+'<span class="lrow-sub">'+esc(m.department)+'</span></div></div>'+deltaChip(m.delta)+rchip(m.rating,m.status)+'<span class="chev">›</span></div>').join('');

/* ---------------- KPI ANALYSIS ---------------- */
function kpiNameGroups(){
  const map={};B().records.forEach(r=>{const k=(r.kpi||r.kra||'—').trim();(map[k]=map[k]||[]).push(r);});
  return Object.keys(map).map(k=>({name:k,recs:map[k]})).filter(g=>g.recs.length>1||true).sort((a,b)=>b.recs.length-a.recs.length);
}
function vKpiAnalysis(){
  const groups=kpiNameGroups();
  const sel=APP.ctx.kpiName||(groups[0]&&groups[0].name);
  const g=groups.find(x=>x.name===sel)||groups[0];
  const opts=groups.map(x=>'<option value="'+esc(x.name)+'"'+(x.name===sel?' selected':'')+'>'+esc(x.name)+' ('+x.recs.length+')</option>').join('');
  if(!g)return `<div class="page-head"><h1>KPI Analysis</h1><p>No KPIs found.</p></div>`;

function distributionBlock(emps){
  const levels=[{n:1,l:'Needs focus',k:'bad'},{n:2,l:'Developing',k:'warn'},{n:3,l:'Solid',k:'good'},{n:4,l:'High',k:'good'},{n:5,l:'Elite',k:'good'}];

  return '<div class="hist">'+levels.map((L,i)=>{const c=counts[i];const h=c===0?3:clamp(c/max*100,8,100);return `<div class="hcol"><div class="hbar" style="height:${h}%;background:${tint(L.k)}"><b>${c}</b></div><div class="hlab">Lv ${L.n}<small>${L.l}</small></div></div>`;}).join('')+'</div>';
}

function personScorecard(e,recs){
  const bySub={};recs.forEach(r=>{const k=r.subTeamId||'__';(bySub[k]=bySub[k]||[]).push(r);});
  let body='';
  Object.keys(bySub).forEach(sk=>{

    if(s)body+=`<div class="sect-t">${esc(s.name)} scorecard<span class="r">${s.rating==null?'':ratingStr(s.rating)+' / 5'}</span></div>`;
    const byKra={};list.forEach(r=>{const kk=r.kra||r.perspective||'General';(byKra[kk]=byKra[kk]||[]).push(r);});
    Object.keys(byKra).forEach(kk=>{
      const grp=byKra[kk];const wd=withData(grp);const gr=wd.length?wd.reduce((s,x)=>s+x.rating,0)/wd.length:null;
      body+=`<div class="kra-group"><div class="kg-h"><span class="kg-t">${esc(kk)}</span>${grp[0].perspective&&grp[0].perspective!==kk?'<span class="kg-p">'+esc(grp[0].perspective)+'</span>':''}<span class="kg-line"></span>${gr==null?'':'<span class="kg-r" style="color:'+sc(statusFromRating(gr).k)+'">'+ratingStr(gr)+' / 5</span>'}</div>
        <div class="kpigrid">${grp.map(kScoreCard).join('')}</div></div>`;
    });
  });
  return body||'<div class="empty">No KPIs mapped.</div>';
}
function personJourney(e,recs){
  const ach=achievements(e);

  Object.keys(byKra).forEach(k=>{const m=byKra[k];if(!m.n)return;const r=m.s/m.n;(r>=TH().onTrack?strong:focus).push({k,r});});
  strong.sort((a,b)=>b.r-a.r);focus.sort((a,b)=>a.r-b.r);
  const journey=`<div class="panel pad"><div class="panel-h"><h3>Performance journey</h3><span class="sub">your rating over time</span>${e.delta!=null?'<div class="r">'+deltaChip(e.delta)+'</div>':''}</div><div class="q">Am I getting better?</div>${e.rating==null?'<div class="empty">No actuals yet.</div>':trendChart(e.trend,{h:150})}</div>`;

  const recog=ach.length?`<div class="panel pad" style="margin-top:16px"><div class="panel-h"><h3>Recognition</h3><span class="sub">earned this period</span></div><div class="ach stack">${ach.map(a=>'<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>'+esc(a)+'</span>').join('')}</div></div>`:'';

function personMilestones(e,recs){
  const rated=recs.filter(r=>r.rating!=null);
  if(!rated.length)return '<div class="empty" style="padding:40px">No rated KPIs yet — enter actuals to unlock milestones.</div>';
  const ranked=rated.map(r=>{const m=nextMilestone(r);const gap=m&&!m.done?(TH().onTrack-r.rating):0;const w=r.weightShown||10;return {r,score:Math.max(0.01,gap)*(w/100),done:m&&m.done};}).sort((a,b)=>(a.done-b.done)||(b.score-a.score));
  return `<div class="q">What should I improve next — highest weight × biggest gap first.</div><div class="kpigrid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">${ranked.map(x=>milestoneCard(x.r)).join('')}</div>`;

function achievements(e){
  const out=[];const recs=recordsForEmp(e.id);
  recs.forEach(r=>{if(r.rating!=null&&r.bands&&r.bands.length>=5&&r.rating>=r.bands.length-0.25)out.push('Top band · '+(r.kpi||r.kra));});

  if(e.delta!=null&&e.delta>=0.3)out.push('Improved +'+(Math.round(e.delta*100)/100)+' this period');

  return out.slice(0,6);
}

      +kpiCard('Rows parsed',String((pl.counts&&pl.counts.gmvRows)||0),((pl.counts&&pl.counts.mappingRows)||0)+' mapping · '+((pl.counts&&pl.counts.requisitionRows)||0)+' requisitions',{})
      +'</div>'+planReport()+planSourcePanel();
  }
  const src=B().source,o=B().rollups.org,th=TH(),h=B().health;
  const checks=[];
  checks.push({ok:h.unmappedActuals===0,t:'All actual rows map to a KPI',s:h.unmappedActuals?h.unmappedActuals+' orphaned actual rows (KpiId not in framework)':'every KpiId in the actuals source resolves',v:h.unmappedActuals});
  checks.push({ok:h.weightIssues.length===0,warn:h.weightIssues.length>0,t:'Weightage totals 100% per person',s:h.weightIssues.length?h.weightIssues.length+' person-blocks off 100%':'every block sums to 100%',v:h.weightIssues.length});
  checks.push({ok:h.qualitative===0,warn:h.qualitative>0,t:'KPIs have numeric target bands',s:h.qualitative?h.qualitative+' qualitative KPIs need a manual rating':'all KPIs numeric',v:h.qualitative});
  checks.push({ok:h.coverage>=67,warn:h.coverage>0&&h.coverage<67,bad:h.coverage===0,t:'Actuals coverage',s:h.withData+' of '+h.kpis+' KPIs have actuals',v:pct(h.coverage)});
  const checkHtml=checks.map(c=>{const k=c.ok?'ok':(c.warn?'warn':'bad');const ic=c.ok?'<path d="M20 6L9 17l-5-5"/>':(c.warn?'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/>':'<path d="M6 6l12 12M18 6L6 18"/>');return `<div class="hcheck ${k}"><div class="hc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg></div><div class="hc-t">${esc(c.t)}<small>${esc(c.s)}</small></div><div class="r" style="color:${sc(k)}">${c.v}</div></div>`;}).join('');
  const weightRows=h.weightIssues.length?('<div class="sect-t">Weightage anomalies<span class="r">expected 100% per person-block</span></div><div class="panel pad"><div class="tbl-wrap"><table class="info-tbl"><thead><tr><th>Person</th><th>Team</th><th>Sub-team</th><th>KPIs</th><th>Weight sum</th></tr></thead><tbody>'+h.weightIssues.map(w=>'<tr><td>'+esc(w.employee)+'</td><td>'+esc(w.dept)+'</td><td>'+esc(w.subTeam||'—')+'</td><td>'+w.kpis+'</td><td style="color:var(--warn-ink);font-weight:700">'+w.sum+'%</td></tr>').join('')+'</tbody></table></div></div>'):'';
  return `<div class="page-head"><h1>Health &amp; Data</h1><p>Master-data validation, the separate actuals source, scoring thresholds and parser diagnostics. Validation is for admins — fix these before an overall score is trusted.</p></div>
  <div class="kc-grid c3">
    ${kpiCard('Master sheet',esc(src.title),src.tabs.length+' tabs',{})}
    ${kpiCard('Actuals source',B().source.actuals.type,esc(B().source.actuals.tab)+' · '+B().source.actuals.rows+' rows',{tone:B().source.actuals.rows?'good':'none'})}
    ${kpiCard('Coverage',pct(o.coverage),o.kpisWithData+' of '+o.kpis+' KPIs',{tone:o.coverage>=67?'good':o.coverage>0?'warn':'none'})}
  </div>
  <div class="panel pad"><div class="panel-h"><h3>Master-data health</h3><span class="sub">validated before scoring is trusted</span></div><div class="stack" style="margin-top:2px">${checkHtml}</div></div>
  ${weightRows}
  <div class="two-eq" style="margin-top:16px">
    <div class="panel pad"><div class="panel-h"><h3>Actuals &amp; period</h3><span class="sub">the separate target/metric source</span></div>
      <div class="stack" style="font-size:13px;color:var(--ink-2);line-height:1.7">Definitions come from the master tabs; <b>targets &amp; actuals</b> live separately in <b>${esc(B().source.actuals.tab)}</b> (${esc(B().source.actuals.type)}), joined by a stable <code>KpiId</code>. Actuals are entered per <b>period</b> (${esc(periodLong(APP.period))}).</div>
      <div class="stack"><button class="btn primary sm" data-act="scaffold">Create / refresh actuals for ${esc(periodShort(APP.period))}</button>
      <div style="font-size:11.5px;color:var(--faint);margin-top:8px">Adds one blank row per KPI (target pre-filled from the "Meets" band). Never overwrites existing values.</div></div>
    </div>
    <div class="panel pad"><div class="panel-h"><h3>Scoring thresholds</h3><span class="sub">on the 1–5 rating scale</span></div>
      <div class="stack row2">
        <div class="field"><label>On Track ≥</label><input id="setOnTrack" type="number" step="0.1" min="0" max="5" value="${th.onTrack}"></div>
        <div class="field"><label>At Risk ≥</label><input id="setAtRisk" type="number" step="0.1" min="0" max="5" value="${th.atRisk}"></div>
      </div>
      <button class="btn ghost sm" data-act="save-settings">Save thresholds</button>
      <div style="font-size:11.5px;color:var(--faint);margin-top:10px">Band 3 = "Meets" = on-target. Below <b>At Risk</b> is Off Track. Applies on next refresh.</div>
    </div>
  </div>
  ${planReport()}${planSourcePanel()}
  <div class="sect-t">Parser diagnostics</div>
  <div class="panel pad"><div class="tbl-wrap"><table class="info-tbl"><thead><tr><th>Tab</th><th>Rows</th><th>Cols</th></tr></thead><tbody>${src.tabs.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+t.rows+'</td><td>'+t.cols+'</td></tr>').join('')}</tbody></table></div>
  <div class="stack" style="font-size:12.5px;color:var(--muted)">${B().departments.map(d=>esc(d.name)+' → '+d.kind+' ('+d.employeeCount+' people, '+d.kpiCount+' KPIs)').join('<br>')}</div>
  ${(B().notes&&B().notes.length)?'<div class="stack" style="font-size:12px;color:var(--warn-ink)">'+B().notes.map(esc).join('<br>')+'</div>':''}</div>`;
}

/* ================= PLAN LAYER VIEWS (GMV · Onboarding · Buyers · Suppliers · Team)
   July = performance (target → achievement → variance)
   August = plan       (target → allocation → coverage)  — never a fabricated %  */
function modeBadge(p){return '<span class="tag">'+(p.mode==='performance'?'Performance · target vs achievement':'Plan · target &amp; allocation')+'</span>';}
function planHead(title,sub){const p=PP();return '<div class="page-head"><h1>'+esc(title)+'</h1><p>'+sub+'</p><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+(p?modeBadge(p):'')+'<span class="tag">'+esc(p?p.label:periodLong(APP.period))+'</span></div></div>';}
function noPlan(what){return '<div class="page-head"><h1>'+esc(what)+'</h1><p>No '+esc(what.toLowerCase())+' data for '+esc(periodLong(APP.period))+'. Use the period switch, or point at the plan workbook in Reports → plan source.</p></div>';}
/* horizontal bar row: label · bar · value · optional share */
function planBar(label,sub,val,valTxt,max,attrs,share){
  const w=(max&&val!=null)?clamp(val/max*100,0,100):0;
  return '<div class="bc-row'+(attrs?'':' static')+'" '+(attrs||'')+'><div class="bc-label">'+esc(label)+(sub?'<small> · '+esc(sub)+'</small>':'')+'</div><div class="bc-track"><div class="bc-fill" style="width:'+w+'%;background:var(--ink)"></div></div><div class="bc-val">'+valTxt+(share!=null?'<small> '+share+'%</small>':'')+'</div>'+(attrs?'<span class="bc-chev">›</span>':'')+'</div>';
}
function groupBars(list,fmt,attrFn){
  const max=list.reduce((m,g)=>Math.max(m,g.target||0),0);
  return list.map(g=>planBar(g.key,g.rows+(g.rows===1?' row':' rows'),g.target,fmt(g),max,attrFn?attrFn(g):'',g.share)).join('')||'<div class="empty">No data.</div>';
}

/* ---------------- OVERVIEW (plan-led) ---------------- */
function planOverview(){
  const p=PP(),pl=PL();
  if(!p)return noPlan('Overview');
  const g=p.gmv,o=p.onboarding,perf=p.mode==='performance';
  let cards;
  if(perf){
    const so=o.stated.seller_onboarding||{},bo=o.stated.buyer_onboarding||{};
    cards='<div class="kc-grid c4">'
      +kpiCard('GMV achieved',cr(g.actual),'of '+cr(g.statedTarget||g.target)+' target · '+(g.attainment==null?'—':g.attainment+'%'),{bar:g.attainment==null?null:clamp(g.attainment,0,100)})
      +kpiCard('Quantity',mt(g.qty),g.rows+' buyer rows',{})
      +kpiCard('Buyer onboarding',numOr(bo.actual),'of '+numOr(bo.target)+' target'+(bo.actual!=null&&bo.target?' · '+Math.round(bo.actual/bo.target*100)+'%':''),{bar:(bo.actual!=null&&bo.target)?clamp(bo.actual/bo.target*100,0,100):null})
      +kpiCard('Seller onboarding',numOr(so.actual),'of '+numOr(so.target)+' target'+(so.actual!=null&&so.target?' · '+Math.round(so.actual/so.target*100)+'%':''),{bar:(so.actual!=null&&so.target)?clamp(so.actual/so.target*100,0,100):null})
      +'</div>';
  }else{
    cards='<div class="kc-grid c4">'
      +kpiCard('GMV target',cr(g.target),g.rows+' buyer rows · '+g.buyers+' named',{nav:'gmv'})
      +kpiCard('Quantity target',mt(g.qty),(g.byCategory||[]).length+' categories',{nav:'gmv'})
      +kpiCard('Planned onboardings',numOr(o.total),numOr(o.suppliers)+' suppliers · '+numOr(o.buyers)+' buyers',{nav:'onboarding'})
      +kpiCard('Buyers in mapping',String(pl.buyers.length),pl.buyers.filter(b=>b.active).length+' active · '+pl.suppliers.length+' suppliers',{nav:'buyers'})
      +'</div>';
  }
  const conc=g.concentration;
  const concCard=conc&&conc.share!=null?'<div class="banner"><div class="bi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V10M10 20V4M16 20v-7"/></svg></div><div><div class="bt">'+esc(conc.team)+' carries '+conc.share+'% of the '+(perf?'':'')+'target</div><div class="bs">'+cr(conc.target)+' of '+cr(g.target)+' sits with one person — the plan is concentrated.</div></div><div class="r"><button class="btn ghost sm" data-member="'+esc(slugKey(conc.team))+'">View</button></div></div>':'';
  // period comparison
  let cmp='';
  const keys=planPeriodKeys();
  if(keys.length>1){
    const rows=keys.map(k=>{const d=pl.byPeriod[k];return {k,d};});
    const max=rows.reduce((m,r)=>Math.max(m,r.d.gmv.target||0,r.d.gmv.actual||0),0);
    cmp='<div class="panel pad"><div class="panel-h"><h3>Period comparison</h3><span class="sub">GMV target vs achievement</span></div><div class="stack" style="margin-top:4px">'
      +rows.map(r=>planBar(r.d.label,r.d.mode==='performance'?'achieved '+cr(r.d.gmv.actual):'plan',r.d.gmv.target,cr(r.d.gmv.target),max,'data-period-go="'+r.k+'"')).join('')
      +'</div></div>';
  }
  const findings=pl.findings||[];
  const fCard='<div class="panel pad"><div class="panel-h"><h3>Data to fix</h3><span class="sub">reconciliation &amp; quality</span><div class="r"><span class="link" data-nav="health">All '+findings.length+' →</span></div></div><div class="list stack" style="margin-top:2px">'
    +(findings.length?findings.slice(0,5).map(f=>'<div class="lrow static"><div class="lrow-id"><span class="sdot s-'+(f.severity==='high'?'bad':f.severity==='medium'?'warn':'none')+'"></span><div class="lrow-name">'+esc(f.title)+'<span class="lrow-sub">'+esc(f.detail.slice(0,110))+'</span></div></div></div>').join(''):'<div class="empty">Nothing flagged.</div>')
    +'</div></div>';
  return planHead('Open Marketplace — Metal',(perf
      ?'July closed above plan. Achievement is taken from the sheet\'s stated total, the only figure carrying real performance; allocation views use the buyer rows.'
      :'August is a <b>plan</b>: target, allocation and coverage. No achievement is shown until transaction data is connected.'))
    +cards+concCard
    +'<div class="sect-t">GMV by team member<span class="r">'+cr(g.target)+' total · click to drill</span></div><div class="panel pad"><div class="stack" style="margin-top:2px">'+groupBars(g.byTeam,x=>cr(x.target),x=>'data-member="'+esc(slugKey(x.key))+'"')+'</div></div>'
    +'<div class="two-eq" style="margin-top:16px"><div class="panel pad"><div class="panel-h"><h3>Region contribution</h3><span class="sub">GMV &amp; volume</span></div><div class="stack" style="margin-top:4px">'+groupBars(g.byRegion,x=>cr(x.target)+' <small>'+mt(x.qty)+'</small>')+'</div></div>'
    +'<div class="panel pad"><div class="panel-h"><h3>Category contribution</h3><span class="sub">GMV &amp; volume</span></div><div class="stack" style="margin-top:4px">'+groupBars(g.byCategory,x=>cr(x.target)+' <small>'+mt(x.qty)+'</small>')+'</div></div></div>'
    +'<div class="two-eq" style="margin-top:16px">'+(cmp||'<div class="panel pad"><div class="panel-h"><h3>Onboarding</h3></div><div class="stack">'+onboardingBars(o)+'</div></div>')+fCard+'</div>';
}
function onboardingBars(o){
  const list=o.byTeam||[];const max=list.reduce((m,x)=>Math.max(m,x.total||0),0);
  return list.map(x=>planBar(x.team,x.region,x.total,numOr(x.total)+' <small>'+numOr(x.suppliers)+'S/'+numOr(x.buyers)+'B</small>',max,'data-member="'+esc(x.teamId)+'"')).join('')||'<div class="empty">No onboarding plan.</div>';
}

/* ---------------- GMV ---------------- */
function vGmv(){

    +kpiCard(perf?'GMV achieved':'GMV target',perf?cr(g.actual):cr(g.target),perf?('of '+cr(g.statedTarget||g.target)+' · '+(g.attainment==null?'—':g.attainment+'%')):(g.rows+' buyer rows'),{bar:perf&&g.attainment!=null?clamp(g.attainment,0,100):null})
    +kpiCard('Quantity',mt(g.qty),'across '+g.byRegion.length+' regions',{})
    +kpiCard('Named buyers',String(g.buyers),g.placeholders?g.placeholders+' unnamed placeholder rows':'no placeholders',{})

    +rows.map(r=>'<tr data-member="'+esc(slugKey(r.teamName))+'"><td class="kname">'+esc(r.buyer||'—')+(r.placeholder?'<small>unnamed placeholder</small>':(r.bundled?'<small>several buyers in one cell</small>':''))+'</td><td>'+esc(r.teamName)+'</td><td>'+esc(titleC(r.region))+'</td><td>'+esc(titleC(r.category))+'</td><td class="num">'+(r.qty==null?'—':mt(r.qty))+'</td><td class="num">'+cr(r.target)+'</td>'+(perf?'<td class="num">'+cr(r.actual)+'</td>':'')+'</tr>').join('')
    +'</tbody></table></div>';
  return planHead('GMV',perf?'Buyer-level plan and what was achieved. Row-level achievement mirrors target in the source, so the headline uses the sheet\'s stated total.':'Buyer-level target plan. Aggregates are recomputed from these rows, never read from the sheet\'s TOTAL/SUMMARY rows.')
    +cards
    +'<div class="sect-t">By team member<span class="r">click a bar to open the member</span></div><div class="panel pad"><div class="stack" style="margin-top:2px">'+groupBars(g.byTeam,x=>cr(x.target)+' <small>'+mt(x.qty)+'</small>',x=>'data-member="'+esc(slugKey(x.key))+'"')+'</div></div>'
    +'<div class="two-eq" style="margin-top:16px"><div class="panel pad"><div class="panel-h"><h3>By region</h3></div><div class="stack" style="margin-top:4px">'+groupBars(g.byRegion,x=>cr(x.target)+' <small>'+mt(x.qty)+'</small>')+'</div></div>'
    +'<div class="panel pad"><div class="panel-h"><h3>By category</h3></div><div class="stack" style="margin-top:4px">'+groupBars(g.byCategory,x=>cr(x.target)+' <small>'+mt(x.qty)+'</small>')+'</div></div></div>'
    +'<div class="sect-t">All buyer rows<span class="r">'+rows.length+' rows</span></div><div class="panel pad">'+tbl+'</div>';

function titleC(s){return String(s||'').toLowerCase().replace(/\b([a-z])/g,(m,c)=>c.toUpperCase());}

/* ---------------- ONBOARDING ---------------- */
function vOnboarding(){
  const p=PP();if(!p)return noPlan('Onboarding');
  const o=p.onboarding,perf=p.mode==='performance';
  const so=o.stated.seller_onboarding||{},bo=o.stated.buyer_onboarding||{};
  const cards='<div class="kc-grid c4">'
    +kpiCard('Total onboardings',numOr(o.total),numOr(o.suppliers)+' suppliers · '+numOr(o.buyers)+' buyers',{})
    +kpiCard(perf?'Suppliers onboarded':'Supplier target',perf?numOr(so.actual):numOr(o.suppliers),perf?('of '+numOr(so.target)+' target'):(o.namedSuppliers+' named in the pipeline'),{bar:(perf&&so.actual!=null&&so.target)?clamp(so.actual/so.target*100,0,100):null})
    +kpiCard(perf?'Buyers onboarded':'Buyer target',perf?numOr(bo.actual):numOr(o.buyers),perf?('of '+numOr(bo.target)+' target'):(o.namedBuyers+' named in the pipeline'),{bar:(perf&&bo.actual!=null&&bo.target)?clamp(bo.actual/bo.target*100,0,100):null})
    +kpiCard('Named pipeline',String(o.namedSuppliers+o.namedBuyers),'names listed vs '+numOr(o.total)+' planned',{})
    +'</div>';
  // per-team expandable pipeline
  const rows=o.byTeam.map(t=>{
    const key=slugKey('onb|'+t.teamId),open=!!APP.expanded[key];
    const max=o.byTeam.reduce((m,x)=>Math.max(m,x.total||0),0);
    const w=(max&&t.total!=null)?clamp(t.total/max*100,0,100):0;
    let h='<div class="exp-kra'+(open?' open':'')+'" data-exp="'+esc(key)+'"><span class="sdot s-'+((t.supplierNamed===t.suppliers&&t.buyerNamed===t.buyers)?'good':'warn')+'"></span><div class="exp-name">'+esc(t.team)+'<small>'+esc(t.region)+' · '+numOr(t.suppliers)+' suppliers + '+numOr(t.buyers)+' buyers</small></div><div class="bar"><span style="width:'+w+'%"></span></div><div class="exp-val">'+numOr(t.total)+'</div><span class="exp-chev">'+(open?'▾':'▸')+'</span></div>';
    if(open){
      const nameList=(label,names,target)=>'<div style="padding:10px 8px"><div class="section-t" style="margin:0 0 8px">'+label+' <span class="r">'+names.length+' named vs '+numOr(target)+' target</span></div>'
        +(names.length?'<div class="ach">'+names.map(n=>'<span>'+esc(n)+'</span>').join('')+'</div>':'<div style="font-size:12.5px;color:var(--muted)">No names listed yet.</div>')+'</div>';
      h+='<div class="exp-kpis">'+nameList('Suppliers',t.supplierNames,t.suppliers)+nameList('Buyers',t.buyerNames,t.buyers)+(t.notes?'<div style="padding:0 8px 10px;font-size:12px;color:var(--muted)">Focus: '+esc(t.notes)+'</div>':'')+'</div>';
    }
    return h;
  }).join('')||'<div class="empty">No onboarding plan for this period.</div>';
  // requisition funnel + tracker
  const rq=p.requisitions;
  let rqHtml='';
  if(rq.total){
    const max=rq.funnel.reduce((m,f)=>Math.max(m,f.count),0);
    rqHtml='<div class="sect-t">Buyer requisition status<span class="r">'+rq.total+' buyers · '+rq.yes+' with a requisition raised</span></div>'
      +'<div class="two-eq"><div class="panel pad"><div class="panel-h"><h3>Outcome funnel</h3></div><div class="stack" style="margin-top:4px">'
      +rq.funnel.map(f=>planBar(f.label,'',f.count,f.count+' <small>'+f.share+'%</small>',max,'')).join('')+'</div></div>'
      +'<div class="panel pad"><div class="panel-h"><h3>Tracker</h3><span class="sub">from the onboarding tab</span></div><div class="tbl-wrap stack"><table class="tbl" style="min-width:520px"><thead><tr><th>Buyer</th><th>Region</th><th>POC</th><th>Req.</th><th>Remarks</th></tr></thead><tbody>'
      +rq.rows.map(r=>'<tr><td class="kname">'+esc(r.buyer)+'</td><td>'+esc(titleC(r.region))+'</td><td>'+esc(r.teamName||r.poc)+'</td><td>'+esc(r.requisition||'—')+'</td><td>'+esc(r.remarks||'—')+'</td></tr>').join('')
      +'</tbody></table></div></div></div>';
  }
  return planHead('Onboarding',perf?'Supplier and buyer onboarding: target vs what was achieved, plus the named pipeline and per-buyer requisition outcomes.':'Supplier and buyer onboarding targets per team member, with the named pipeline behind each number. Click a member to expand.')
    +cards
    +'<div class="sect-t">By team member<span class="r">click to see the named pipeline</span></div><div class="panel pad" style="padding:8px 14px">'+rows+'</div>'
    +rqHtml;
}

  const f=APP.filters;
  if(f.status==='good')list=list.filter(b=>b.active);
  else if(f.status==='bad')list=list.filter(b=>!b.active);
  if(f.search){const q=f.search.toLowerCase();list=list.filter(b=>(b.name+' '+(b.team||'')+' '+(b.category||'')+' '+b.suppliers.join(' ')).toLowerCase().includes(q));}
  const withCap=pl.buyers.filter(b=>b.capacity!=null);
  const totalCap=withCap.reduce((s,b)=>s+b.capacity,0);
  const cards='<div class="kc-grid c4">'
    +kpiCard('Buyers mapped',String(pl.buyers.length),pl.buyers.filter(b=>b.mappingMissing).length?pl.buyers.filter(b=>b.mappingMissing).length+' known only to the tracker':'all from the mapping tab',{})
    +kpiCard('Active',String(pl.buyers.filter(b=>b.active).length),pl.buyers.filter(b=>!b.active&&b.status).length+' inactive',{})
    +kpiCard('Monthly capacity',mt(totalCap),withCap.length+' of '+pl.buyers.length+' report capacity',{})
    +kpiCard('With Est. GMV',String(pl.buyers.filter(b=>b.estGmv!=null).length),'of '+pl.buyers.length+' — blanks stay blank',{})

function memberRow(t,max){

}
function teamRollup(){
  const p=PP();if(!p)return [];
  const g=p.gmv,o=p.onboarding;
  const byId={};
  (PL().team||[]).forEach(m=>{byId[m.id]={id:m.id,name:m.name,gmv:null,qty:null,buyers:0,region:'',onbS:null,onbB:null,onbTotal:null};});
  g.records.forEach(r=>{
    const id=slugKey(r.teamName);
    const e=byId[id]||(byId[id]={id:id,name:r.teamName,gmv:null,qty:null,buyers:0,region:'',onbS:null,onbB:null,onbTotal:null});
    e.gmv=(e.gmv||0)+(r.target||0);e.qty=(e.qty||0)+(r.qty||0);
    if(r.buyer&&!r.placeholder)e.buyers++;
    if(!e.region&&r.region)e.region=titleC(r.region);
  });
  o.byTeam.forEach(t=>{const e=byId[t.teamId];if(!e)return;e.onbS=t.suppliers;e.onbB=t.buyers;e.onbTotal=t.total;if(!e.region)e.region=t.region;});
  return Object.keys(byId).map(k=>byId[k]).filter(t=>t.gmv!=null||t.onbTotal!=null).sort((a,b)=>(b.gmv||0)-(a.gmv||0));
}
function vTeamPlan(){

async function saveActual(id){
  const r=recById(id);if(!r)return;
  const payload={kpiId:id,period:APP.period};
  const a=$('#edActual');if(a&&!a.disabled)payload.actual=a.value===''?'':a.value;
  const t=$('#edTarget');if(t)payload.target=t.value===''?'':t.value;
  const rt=$('#edRating');if(rt)payload.rating=rt.value===''?'':rt.value;
  const c=$('#edComment');if(c)payload.comment=c.value;
  const ev=$('#edEvidence');if(ev)payload.evidence=ev.value;
  toast('Saving…');
  try{const res=await call('apiSaveActual',payload);
    if(res&&res.ok){const b=await call('apiBootstrap',{force:true,period:APP.period});applyBoot(b);toast('Saved');openRec(id);}
    else toast((res&&res.error)||'Save failed',true);
  }catch(e){if(e&&e.__offline)toast('Connect to the sheet to save',true);else toast('Save failed',true);}
}

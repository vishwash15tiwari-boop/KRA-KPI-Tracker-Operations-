<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Performance Tracker — Individual KRA / KPI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
/* ============================================================================
   TOKENS.  White surface #ffffff is the surface every chart value below was
   validated against — changing it means re-running the palette validator, not
   just eyeballing the result.
   ========================================================================== */
:root{
  /* BLACK & WHITE, on white.  Every value here is achromatic — no hue anywhere,
     so the page survives greyscale printing and forced-colors mode unchanged. */
  --bg:#ffffff; --surface:#ffffff; --raised:#f4f4f4; --sunken:#f8f8f8;
  --line:#dcdcdc; --line-soft:#ebebeb;
  --ink:#111111; --ink-2:#5a5a5a; --ink-3:#8a8a8a;
  --accent:#111111; --accent-soft:#d8d8d8;
  --accent-weak:rgba(0,0,0,.07);
  /* Ordinal ramp, Target 1..5 — RE-SELECTED for a white ground, not inverted
     from the dark set.  On light, "more" reads as MORE INK, so Target 5 is the
     DARKEST step.  Validated in light mode against #ffffff: monotone lightness,
     every adjacent gap >= 0.06 L, light end 2.17:1, single hue (spread 0°).
     A first attempt starting at #c6c6c6 failed the light-end floor at 1.71:1,
     which would have left Target 1 all but invisible on white. */
  --lv1:#b0b0b0; --lv2:#8c8c8c; --lv3:#6a6a6a; --lv4:#464646; --lv5:#1a1a1a;
  --lv0:#d8d8d8;            /* below Target 1 — faintest, deliberately outside the ramp */
  --lvna:#ededed;           /* not scored — an empty track, not data */
  /* Ladder-kind classes.  In black & white these CANNOT carry identity by
     colour — greys have zero chroma, so the categorical chroma-floor check
     fails by definition.  Separation is by lightness (all-pairs dE 18.5) and
     all three clear 3:1 against white, plus the legend's name+count labels and
     the 2px gaps between segments.  Never use these without those labels. */
  --cat1:#1a1a1a; --cat2:#5e5e5e; --cat3:#949494; --cat-rest:#d0d0d0;
  /* Status.  Monochrome too, so severity is carried by the icon, the label and
     the left rule weight on .note — never by hue alone. */
  --good:#1a1a1a; --warn:#5a5a5a; --crit:#0d0d0d;
  /* HEADINGS ONLY, and never anything that carries meaning. The palette is
     monochrome so the page survives greyscale printing and forced-colors mode;
     confining this to heading TEXT means those lose decoration and nothing
     else. 8.9:1 on white. */
  --head:#1f3a5f;
  /* THE ONE PLACE HUE IS USED. Performance Health is a triage strip, and a
     reader scanning it wants the red one without reading three labels first.
     Hue is ADDITIVE here, never the only encoding: each dot sits beside its
     own word (On track / Needs attention / Critical), so greyscale printing
     and forced-colors mode lose nothing but the shortcut. Contrast on white:
     4.6:1, 4.5:1, 4.8:1. */
  --st-ok:#1a7f37; --st-warn:#a86400; --st-crit:#b42318;
  --r-lg:14px; --r:10px; --r-sm:7px;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* An inline <svg> with no intrinsic size fills its container. Default every
   icon to a sane box here; the specific rules below override where needed.
   Without this, any bare icon dropped into a cell renders 90px tall. */
svg{width:16px;height:16px;flex:none}
/* the vertical pivot: KRAs across the top, Target/Achieved beneath each.
   The name column is sticky because the table scrolls sideways and a row of
   numbers with the person scrolled out of sight is unreadable. */
/* The page-load reveal. `both` holds the from-state before the delay elapses,
   otherwise every element would flash at full opacity and then restart. */
@keyframes revIn{from{opacity:0;transform:translateY(5px)}
                 to{opacity:1;transform:none}}
.rev{animation:revIn .3s ease both}
/* Someone who has asked the system for less motion gets the data immediately
   and in full. Nothing is lost: the stagger is decoration, not information. */
@media (prefers-reduced-motion: reduce){
  .rev{animation:none!important}
}

/* ================================ THE BOOT SCREEN =========================
 *
 * The Recykal mark, turning, held over the page while the first server call is
 * in flight — then it flies onto the sidebar logo and the dashboard opens out
 * from underneath it.
 *
 * It has been three things now. The desk figure that briefly stood here was
 * replaced by the mark on request; what survived from it is the part that was
 * never about the picture — the minimum hold, the staged exit, the sentence
 * underneath, and the tests. Only the visual changed.
 *
 * WHY THE MARK AND NOT A LOCKUP. The AR & Collections dashboard cuts its SVG
 * into mark and wordmark at runtime so only the mark turns: a spinning wordmark
 * is upside down for half of every revolution and reads as a broken asset. Ours
 * is a PNG, which cannot be split — but it is also a near-square MARK (182x163)
 * rather than a horizontal lockup, so there is no wordmark to turn over and the
 * spin is safe as it stands.
 *
 * The page is shrunk and hidden by a CLASS the script adds and the teardown
 * removes — that way round on purpose. If the script never runs or throws
 * before finishing, the reader gets the dashboard rather than a blank page
 * held down by a style nothing ever clears. */
.boot{position:fixed;inset:0;z-index:200;overflow:hidden;
  /* white in the middle, a breath of grey at the corners: depth without a
     colour, and it falls back to flat white if the gradient is unsupported. */
  background:var(--bg);
  background-image:radial-gradient(ellipse 72% 62% at 50% 44%,
    rgba(0,0,0,0) 0%, rgba(17,17,17,.04) 100%);
  display:flex;align-items:center;justify-content:center;
  /* Last of the three to go — see .boot.gone below. */
  transition:opacity .42s ease .28s}
.boot-inner{display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:0 16px}
/* Square, and larger than the image inside it, so a full turn never clips the
   corners. Sized against the viewport too, so it cannot force a scrollbar. */
.boot-mark{width:min(96px,26vw);height:min(96px,26vw);
  display:grid;place-items:center;
  /* Eased rather than linear, and slow: it should read as a mark turning over,
     not as a busy-spinner. */
  animation:bootspin 2.8s cubic-bezier(.62,0,.38,1) infinite;
  /* The flight to the sidebar runs on THIS element. .72s — at .6s the travel
     was over before the eye caught it. */
  transition:transform .72s cubic-bezier(.5,0,.2,1)}
/* 68%, not more. The PNG is 182x163, so at width w its diagonal is
   w*sqrt(1+(163/182)^2) = 1.343w — and that diagonal is what sweeps the
   box as the mark turns. At 78% the diagonal was 1.047 of the box and the
   corners swung outside it on every quarter turn. */
.boot-mark img{width:68%;height:auto;display:block}
@keyframes bootspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* Stops on completion, so the mark is still when it flies. animation:none is
   required — a running loop would keep overwriting the flight's transform. */
.boot.done .boot-mark{animation:none}
.boot-say{font-size:13.5px;color:var(--ink-3);letter-spacing:.015em;
  text-align:center;
  animation:wtSay .8s ease-out .3s both}
@keyframes wtSay{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* The ellipsis is three elements rather than three characters so they can
   arrive one at a time — and it is padded to its own full width, so the line
   does not jog left and right as they come and go. */
.boot-dots{display:inline-block;width:1.6em;text-align:left}
.boot-dots i{font-style:normal;opacity:0;animation:wtDot 1.5s ease-in-out infinite}
.boot-dots i::before{content:"."}
.boot-dots i:nth-child(2){animation-delay:.22s}
.boot-dots i:nth-child(3){animation-delay:.44s}
@keyframes wtDot{0%,70%,100%{opacity:0}16%,54%{opacity:1}}
/* Leaving, in order: the sentence goes first, then the mark flies while the
   white fades out around it. The mark is deliberately NOT faded — it is
   handed over to the sidebar, and a handover you cannot see is just a
   disappearance. Staged with transition-delay rather than with three timers,
   so the sequence cannot come apart if a frame is dropped. */
.boot.gone{opacity:0;pointer-events:none}
.boot.gone .boot-say{opacity:0;transition:opacity .22s ease}
/* The dashboard opens out from the centre as the mark flies up. */
.app.revealing{transform:scale(.94);opacity:0}
.app{transform-origin:center center;
  transition:transform .6s cubic-bezier(.16,.84,.30,1), opacity .5s ease-out}
/* Someone who asked for less motion gets the data immediately and in full: no
   spin, no flight, no minimum hold, no scale. The mark still shows — a still
   image is not motion — but nothing in here moves and nothing in here waits.
   Belt and braces with the JS check: even if the class were applied, the page
   must not be scaled or hidden. */
@media (prefers-reduced-motion: reduce){
  .boot-mark,.boot-say,.boot-dots i{animation:none!important}
  .boot-mark{transition:none}
  .boot-dots i{opacity:1}
  .boot,.boot.gone .boot-say{transition:none}
  .app{transition:none}
  .app.revealing{transform:none;opacity:1}
}

/* the calculation notes: a definition list that stays readable at width */
.defs{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:10px 20px;margin:0}
.defs dt{font-weight:700;font-size:12.5px;color:var(--ink)}
.defs dd{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
@media(max-width:720px){.defs{grid-template-columns:1fr;gap:3px 0}
  .defs dd{margin-bottom:10px}}
table.mini{width:auto;min-width:280px}
table.mini th{position:static}

/* the vertical x KRA roll-up */
.sum td{padding:9px 14px}
.sum .vname{white-space:nowrap;vertical-align:top;font-weight:800;
  background:var(--sunken);border-right:1px solid var(--line);
  letter-spacing:.01em;min-width:118px;font-size:14.5px;color:var(--head)}
/* the KRA is the other heading in this table, so it reads as one */
.sum .kname{font-weight:700;font-size:13.5px;color:var(--head)}
.sum .kname .cap{font-weight:500;color:var(--ink-3);margin-top:2px}
.sum thead th{font-size:11.5px;font-weight:800;color:var(--head)}
.sum tr.vrow td{border-bottom:1px solid var(--line-soft)}
.sum tr.vtot td{background:var(--sunken);font-weight:700;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sum tr.gtot td{background:var(--ink);color:var(--bg);border:0;font-weight:700}
/* A DELIBERATE BLANK, NOT MISSING DATA.
   Muted by COLOUR, never by opacity: these classes sit on the <td> itself, and
   opacity fades an element background along with its text. On the Grand total
   row — which is painted var(--ink) — that turned two black cells 35% grey and
   left a silver band across the middle of the row. */
.sum .na{color:#d6d6d6}
.sum tr.gtot .na{color:rgba(255,255,255,.45)}
/* under target reads quieter than at or above it */
.sum .miss{color:var(--ink-3)}
.sum .pill{display:inline-block;margin-left:9px;padding:1px 9px;border-radius:999px;
  border:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--ink-3);
  background:var(--surface);letter-spacing:0;text-transform:none}
.sum tr.gtot .pill{border-color:rgba(255,255,255,.3);color:var(--bg);
  background:transparent}
.sum .sub2{font-size:9.5px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;
  text-transform:none;margin-top:2px}

/* the month selector as a filter cell */
.filters .f select#pSel{width:100%}
select#pSel.busy{opacity:.55}

/* a flush panel header with a control on the right */
.ph.phrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sel.sm{padding:5px 8px;font-size:12px;flex:none}
/* numbers never break across lines; headers always wrap */
.pv td{white-space:nowrap}
.pv th{white-space:normal}
/* the same two headings in the per-vertical pivot */
.pv .pvkra{font-size:13px;font-weight:800;color:var(--head)}
.pv .pvname{font-size:13px;font-weight:800;color:var(--head)}
.pv .pvkra{text-align:center;border-left:1px solid var(--line);
  font-size:11px;letter-spacing:.02em;line-height:1.3;
  /* min-width, not max-width: a KRA name is now allowed as many lines as it
     needs, but the column still has to be wide enough for its three numbers */
  min-width:180px;max-width:230px;padding-bottom:7px}
/* Target / Achieved / Achieved % are short and read as a unit — wrapping
   "Achieved %" onto two lines would misalign it against its neighbours */
.pv .pvsub{font-size:10.5px;font-weight:600;color:var(--ink-3);
  letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
/* a KRA group is now three columns wide, starting at column 2 */
.pv td:nth-child(3n+2){border-left:1px solid var(--line)}
/* The frozen POC column.
 *
 * The background MUST be an opaque colour that EXISTS. This rule previously
 * named a token that is not in this palette (the tokens are --bg, --surface,
 * --raised, --sunken), so it resolved to transparent and every scrolled number
 * slid visibly through the names. A sticky cell with no background is just a
 * cell that does not move. CSS gives no warning for this, so shapetest asserts
 * that every var() without a fallback names a token that is defined — do not
 * write an undefined token here even inside a comment, it fails that check.
 *
 * The separator is a box-shadow, not border-right: with border-collapse the
 * table owns the borders, and a collapsed border does not travel with a cell
 * that is offset from its column. */
.pv .pvname{position:sticky;left:0;background:var(--surface);z-index:1;
  min-width:168px;max-width:230px;white-space:normal;
  box-shadow:1px 0 0 var(--line)}
/* the top-left corner is sticky in BOTH directions, so it has to outrank the
   other sticky headers (z-index 2) as well as the body cells */
.pv thead .pvname{background:var(--raised);z-index:3}
/* same reason as .sum .na: no opacity on a cell that may be given a background */
.pv .pvna{color:#cacaca}
/* .pwrap / .pspin were the top-bar month select and its loading marker. The
   select moved into the filter row, where the "loading…" state rides on the
   cell's own label instead, so both rules and the pulse keyframes are gone
   rather than left behind for someone to wonder about. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9c9c9;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------------ shell -- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sb{background:#ffffff;border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.sb-brand{display:flex;gap:11px;align-items:center;padding:20px 18px 22px}
/* Holds the Recykal mark, inlined as a data URI further down so the dashboard
   does not depend on the marketing site's CDN staying put.  The mark is solid
   black, which IS the ink colour on this white theme — if the theme ever goes
   dark again, add  .sb-logo img{filter:invert(1)}  and it works there too. */
.sb-logo{width:32px;height:32px;display:grid;place-items:center;flex:none}
.sb-logo img{max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;display:block}
.sb-name{font-weight:700;letter-spacing:-.2px;line-height:1.15}
.sb-name small{display:block;font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:0}
.sb-nav{padding:0 10px;overflow-y:auto;flex:1}
.sb-g{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:16px 9px 7px}
.sb-i{display:flex;gap:10px;align-items:center;padding:9px 9px;border-radius:var(--r-sm);
  color:var(--ink-2);text-decoration:none;font-weight:500;transition:background .12s,color .12s}
.sb-i:hover{background:#f2f2f2;color:var(--ink)}
.sb-i.on{background:var(--accent-weak);color:var(--ink)}
.sb-i.on{box-shadow:inset 2px 0 0 var(--ink)}   /* a rule, not a hue, marks the page */
.sb-i.on svg{color:var(--accent)}
.sb-i svg{width:17px;height:17px;flex:none;color:var(--ink-3)}
.sb-foot{padding:12px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;gap:14px;align-items:center;
  padding:13px 26px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-3);
  min-width:0;flex:0 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumbs .cur{color:var(--ink);font-weight:600}
.crumbs .sep{opacity:.45}
.spacer{flex:1}
.search{position:relative;flex:1 1 190px;max-width:330px;min-width:0}
.search input{width:100%;padding:8px 11px 8px 32px;background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:10px;top:9px;width:15px;height:15px;color:var(--ink-3)}
.sr{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--raised);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 36px rgba(0,0,0,.14);
  max-height:340px;overflow:auto;display:none}
.sr.open{display:block}
.sr a{display:block;padding:9px 12px;color:var(--ink-2);text-decoration:none;font-size:13px;
  border-bottom:1px solid var(--line-soft)}
.sr a:last-child{border-bottom:0}
.sr a:hover{background:#f2f2f2;color:var(--ink)}
.sr .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  padding:8px 12px 4px;font-weight:700}
.sel{padding:8px 10px;background:var(--sunken);border:1px solid var(--line);
  border-radius:var(--r-sm);color:var(--ink);flex:none;max-width:200px}
.who{display:flex;gap:9px;align-items:center;padding:6px 10px 6px 7px;background:var(--sunken);
  border:1px solid var(--line);border-radius:999px;flex:none;white-space:nowrap}
.av{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:#ececec;color:#1a1a1a;flex:none;
  border:1px solid #d9d9d9}
.who .n{font-size:12.5px;font-weight:600;line-height:1.15}
.who .r{font-size:10.5px;color:var(--ink-3);line-height:1.15}
.content{padding:24px 26px 60px;max-width:1560px;width:100%}

/* --------------------------------------------------------------- surfaces -- */
.hdr{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.hdr h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.4px}
.hdr .sub{color:var(--ink-3);font-size:13px;margin-top:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px 20px}
.panel.flush{padding:0;overflow:hidden}
.panel h3{margin:0 0 3px;font-size:14px;font-weight:650;letter-spacing:-.1px}
.panel .ph{padding:17px 20px 14px;border-bottom:1px solid var(--line-soft)}
.panel .cap{font-size:12px;color:var(--ink-3)}
.row{display:grid;gap:14px}
.r-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.r-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.r-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.r-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.r-21{grid-template-columns:1.45fr 1fr}
.mt{margin-top:14px}

/* stat tile — a headline number is a tile, never a one-bar chart */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 17px}
.tile.clk{cursor:pointer;transition:border-color .12s ease,background .12s ease}
.tile.clk:hover{border-color:var(--ink-3);background:var(--sunken)}
.tile.clk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .l{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-size:29px;font-weight:750;letter-spacing:-1px;margin-top:7px;line-height:1}
.tile .v.sm{font-size:17px;letter-spacing:-.3px;font-weight:650}
.tile .h{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.tile .h b{color:var(--ink-2);font-weight:600}
/* the arithmetic, written out: the point of opening a card */
.sumline{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;font-size:14px;line-height:1.6}
.sumline b{font-weight:700}
.sumline .dot{margin-right:7px}
/* the derivation printed under a figure nobody typed */
.working{font-size:10.5px;color:var(--ink-3);margin-top:3px;line-height:1.5;
  white-space:normal;max-width:260px;text-align:right;margin-left:auto}
button.worklink{display:block;background:transparent;border:0;padding:0;
  font-family:inherit;cursor:pointer;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:2px}
button.worklink:hover{color:var(--ink)}
button.worklink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* the calculation, laid out one step per line */
.calc{font-size:14px;line-height:2.1}
.calc .cl{display:flex;gap:10px;align-items:baseline;
  border-bottom:1px dashed var(--line-soft);padding:5px 0}
.calc .cl span:first-child{color:var(--ink-3);min-width:150px}
.calc .cl b{margin-left:auto;font-variant-numeric:tabular-nums}
.calc .eq{background:var(--sunken);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;margin-top:14px;font-size:14px}
/* one card per vertical, side by side while there is room for them */
.sbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:13px;margin-top:13px}
.vcard{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column}
.vch{padding:10px 13px;background:var(--sunken);border-bottom:1px solid var(--line)}
.vch h4{margin:0;font-size:15px;font-weight:800;letter-spacing:.01em;
  color:var(--head)}
.vch .cap{margin-top:2px}
.vcard .tw{flex:1}
.vcard table{width:100%}
.vcard .vfoot{padding:9px 13px;border-top:1px solid var(--line);
  background:var(--surface);font-size:12px;font-weight:600}
.mini tfoot tr.vtr td{border-top:1px solid var(--line);background:var(--sunken);
  font-weight:700}
@media(max-width:700px){.sbs{grid-template-columns:1fr}}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;
  margin-right:7px;flex:none}
.tile .l{display:flex;align-items:center}
.dot.ok{background:var(--st-ok)}
.dot.warn{background:var(--st-warn)}
.dot.crit{background:var(--st-crit)}

/* meter — a single ratio against a limit, same-ramp track (not a 2-slice pie) */
.meter{height:7px;border-radius:99px;background:#e9e9e9;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter i+i{box-shadow:-2px 0 0 var(--surface)}

/* level meter — 5 discrete bands.  The engine resolves a LEVEL, not a
   percentage, so the mark has to be discrete or it misrepresents the score. */
.lv{display:flex;gap:2px;align-items:center}
.lv b{width:15px;height:7px;border-radius:2px;background:var(--lvna);display:block}
.lv.r4 b{border-radius:2px}
.lv-t{font-size:11.5px;color:var(--ink-2);margin-left:7px;white-space:nowrap}
.lv-na{font-size:11.5px;color:var(--ink-3);font-style:italic}

.chartbox{height:262px;position:relative;overflow:hidden}
.chartbox.tall{height:300px}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:20px}
.empty .t{font-weight:600;margin-bottom:5px}
.empty .m{font-size:12.5px;color:var(--ink-3);max-width:330px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;font-size:12px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;
  vertical-align:-1px}

/* ----------------------------------------------------------------- tables -- */
.tw{overflow:auto;max-height:none}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;z-index:2;background:var(--raised);text-align:left;
  font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);
  /* Headers WRAP. They were nowrap, which on the pivot meant "TRANSACTION FROM
     EXISTING BUYE…" — a truncated KRA name is unreadable and, worse, two
     different KRAs can truncate to the same string. Data cells stay nowrap so
     a figure never breaks across lines. */
  white-space:normal;vertical-align:bottom;line-height:1.3}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .1s}
tbody tr:hover{background:#f7f7f7}
tr.clk{cursor:pointer}
/* department band inside the people table — one table keeps the columns
   aligned across groups, which separate tables per department would not */
tr.grp td{background:var(--raised);font-size:11px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-2);padding:8px 14px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tr.grp:first-child td{border-top:0}
tr.grp .n{color:var(--ink-3);font-weight:700;letter-spacing:0;text-transform:none}
tbody tr.grp:hover td{background:var(--raised)}
/* the row's own actions stay reachable however far the table scrolls */
td.act,th.act{position:sticky;right:0;z-index:3;background:var(--surface);
  box-shadow:-9px 0 13px -7px rgba(0,0,0,.12)}
th.act{background:var(--raised);z-index:4}
tbody tr:hover td.act{background:#f7f7f7}
td.act .btn+.btn{margin-left:5px}
td.r,th.r{text-align:right}
/* dropped first when the table runs out of room */
@media(max-width:1120px){.opt2{display:none}}
@media(max-width:960px){.opt1{display:none}}
.who2{display:flex;gap:10px;align-items:center;min-width:0}
.who2 .av{width:29px;height:29px;font-size:11px}
.who2 .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who2 .d{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
  font-size:11px;font-weight:600;background:#f1f1f1;color:var(--ink-2);white-space:nowrap}
/* the three ladder kinds, distinguished by lightness and by their own words */
.tag.b{background:#1a1a1a;color:#ffffff}
.tag.o{background:#949494;color:#ffffff}
.tag.a{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px #c4c4c4}
.tag.g{background:#f1f1f1;color:var(--ink-3)}
.tag svg{width:12px;height:12px}

/* ---------------------------------------------------------------- controls -- */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;
  border:1px solid var(--line);background:var(--raised);border-radius:var(--r-sm);
  font-weight:600;font-size:13px;line-height:1;white-space:nowrap;
  transition:background .12s,border-color .12s}
.btn svg{width:15px;height:15px;flex:none}
.btn.sm svg{width:13px;height:13px}
.btn:hover{background:#f4f4f4;border-color:#c9c9c9}
.btn.p{background:var(--accent);border-color:var(--accent);color:#ffffff}
.btn.p:hover{background:#000000;border-color:#000000}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px;margin-bottom:16px}
.f label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.f select,.f input{width:100%;padding:8px 10px;background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--r-sm)}

/* notices — status colour always with an icon and a label, never colour alone */
.note{display:flex;gap:11px;padding:13px 15px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);margin-bottom:16px}
.note svg{width:17px;height:17px;flex:none;margin-top:2px}
.note .t{font-weight:650;margin-bottom:2px}
.note .m{font-size:12.5px;color:var(--ink-2)}
/* No hue to spend, so severity is the weight of the left rule plus the icon */
.note.w{border-left:3px solid var(--ink-2);background:rgba(0,0,0,.028)}
.note.w svg{color:var(--ink-2)}
.note.c{border-left:3px solid var(--ink);background:rgba(0,0,0,.05)}
.note.c svg{color:var(--ink)}
.note.i{border-left:3px solid var(--ink-3)}
.note.i svg{color:var(--ink-3)}

/* ---------------------------------------------------------------- overlays -- */
.scrim{position:fixed;inset:0;background:rgba(28,28,28,.40);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:14px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.20)}
.modal.wide{width:min(900px,100%)}
/* A CARD BREAKDOWN CARRIES TABLES, not a form. At 900px the vertical cards
   were ~300px each and every one of them scrolled inside its own box while the
   modal scrolled too — two scrollbars for one list. Wider, taller, and the
   inner tables no longer get their own scroller. */
.modal.cards{width:min(1320px,100%);max-height:94vh}
.modal.cards .m-b{padding:18px}
.modal.cards .sbs{grid-template-columns:repeat(2,minmax(0,1fr))}
.modal.cards .vcard .tw{overflow:visible}
@media(max-width:900px){.modal.cards .sbs{grid-template-columns:1fr}}
.m-h{display:flex;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.m-h h2{margin:0;font-size:17px;font-weight:680;letter-spacing:-.2px}
.m-h .cap{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.m-b{padding:20px;overflow:auto}
.m-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.x{margin-left:auto;background:transparent;border:0;color:var(--ink-3);padding:4px;border-radius:6px}
.x:hover{background:#f0f0f0;color:var(--ink)}
.x svg{width:18px;height:18px;display:block}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--r-sm)}
.fld .hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.bands{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
/* these inputs live outside .fld, so they were unstyled and used their default
   intrinsic width — five of them overflowed the modal body */
.bands .b label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;text-align:center}
.bands .b input{width:100%;min-width:0;padding:9px 8px;background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--r-sm);text-align:center}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0;font-weight:550}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;
  background:var(--raised);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 16px;box-shadow:0 14px 36px rgba(0,0,0,.18);font-size:13px;font-weight:550;
  display:flex;gap:9px;align-items:center;max-width:90vw}
.toast svg{width:16px;height:16px;flex:none}
.toast.ok svg{color:var(--good)}
.toast.err{border-color:var(--ink-2);box-shadow:0 14px 36px rgba(0,0,0,.18),
  inset 2px 0 0 var(--ink)}
.toast.err svg{color:var(--crit)}
.sk{background:linear-gradient(90deg,#f2f2f2,#e6e6e6,#f2f2f2);background-size:200% 100%;
  animation:sh 1.3s linear infinite;border-radius:var(--r-sm)}
@keyframes sh{to{background-position:-200% 0}}
.hide{display:none!important}
/* Standing banner while UAT mode is on. Deliberately hard to ignore: full
   width, inverted, above the content, on every page. */
.uat{display:flex;gap:10px;align-items:center;padding:9px 26px;background:var(--ink);
  color:var(--bg);font-size:12.5px;font-weight:600;position:sticky;top:0;z-index:29}
.uat svg{width:15px;height:15px;flex:none}
.uat b{font-weight:800}
@media(max-width:900px){.uat{padding:8px 14px;font-size:12px}}

/* the breadcrumb yields first, then the identity text — the search and the
   period selector are the two controls that must survive every width */
@media(max-width:1200px){.crumbs{display:none}}
@media(max-width:1180px){.r-5,.r-4{grid-template-columns:repeat(3,minmax(0,1fr))}
  .r-21,.r-2{grid-template-columns:1fr}}
@media(max-width:940px){.who .n,.who .r{display:none}.who{padding:5px}}
@media(max-width:900px){
  .app{grid-template-columns:64px 1fr}
  .sb-name,.sb-g,.sb-i span,.sb-foot{display:none}
  .sb-i{justify-content:center;padding:11px 0}
  .sb-brand{padding:18px 0;justify-content:center}
  .content{padding:18px 14px 50px}.top{padding:11px 14px}
  .r-5,.r-4,.r-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:1fr 1fr}
  .search{width:auto;flex:1}
}
@media(max-width:600px){
  .r-5,.r-4,.r-3,.filters,.bands{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* The numeric target, which is a DENOMINATOR and not a band.
 * Most ladders here are ratios — 0.6 / 0.75 / 0.9 / 1.0 / 1.05 — so the level
 * comes from actual divided by this. Showing the ladder without it leaves a
 * person reading "0.9" with no way to know 0.9 of what.
 * A blank is honest: not every KPI has a typed target, and the three derived
 * ones are computed from last month's data rather than typed at all. */
/* HOW MANY DECIMALS A FIGURE DESERVES, decided by what it measures rather
 * than by whatever the arithmetic happened to produce.
 *
 *   Cr     2dp — lakhs matter on a crore figure
 *   days   1dp — 18.93 days is false precision; 18.9 is the honest form
 *   count  0dp — there is no such thing as 8.35 sellers
 *   other  2dp, trailing zeros dropped
 *
 * A YTD figure is a mean, so it arrives with a long tail (18.924999999) that
 * no formatter downstream was trimming. Every number on a tile, a card or a
 * table goes through here. */
function fmtTarget(v,unit,exact){
  /* Number(null), Number(undefined) and Number('') are all 0 or NaN, and the 0
     is the dangerous one: a blank meaning NOTHING RECORDED would render as a
     real measurement of zero. Callers do guard, but a formatter that invents a
     figure from an absence is one call site away from a wrong number on
     somebody's scorecard. */
  if(v===null||v===undefined||v==='') return '';
  var x=Number(v);
  if(!isFinite(x)) return '';
  var u=String(unit||'').toLowerCase();
  if(u==='cr') return (Math.round(x*100)/100).toFixed(2)+' Cr';
  /* KRA owner, 17 Sep 2026: only GMV keeps its decimals. A DSO of 18.9 days
     and one of 19 are the same answer, and the extra digit only invites a
     conversation about the tenth of a day. */
  if(u==='days'||u==='day') return String(Math.round(x))+'\u2009days';
  /* EXACT is for a LADDER RUNG, which is a threshold rather than a quantity.
     Rounding 5.4 sellers to 5 would say somebody with 5 had cleared a rung
     they had missed \u2014 the rounding that is right for a measured count is
     wrong for the bar it is measured against. */
  /* A RATE: the stored number is a fraction of 1, because the ladder it is
     read against runs 0.8 to 1.0 and there is no target to divide by. Without
     this it falls to the count branch below and Math.round turns 87% into "1"
     and 33% into "0". One decimal, so 66.7% does not read as 67%. */
  if(u==='ratio') return String(Math.round(x*1000)/10)+'%';
  if(u==='count'||u===''){
    return exact?String(Math.round(x*100)/100):String(Math.round(x));
  }
  return String(Math.round(x))+'\u2009'+unit;
}
/* THE LADDER, READ IN THE UNITS PEOPLE WORK IN.
 *
 * A ratio ladder is stored as 0.6 / 0.75 / 0.9 / 1.0 / 1.05, which is what the
 * scoring compares against but is not what anybody has in their head. The
 * Target Sheet figure IS Target 4, so the other four rungs are that figure
 * scaled: a 6.50 Cr target makes Target 3 5.85 Cr and Target 5 6.83 Cr.
 *
 * Derived for display only — nothing is written back, and the rating still
 * comes from achieved over target. Returns null when there is nothing to
 * derive from: no numeric target, or an ABSOLUTE ladder (DSO in days, PDD in
 * crore) whose rungs are already real figures and must not be rescaled. */
function ratioLadder(r){
  var v=(r||{}).values;
  if(!v||v.length!==5) return null;
  for(var i=0;i<5;i++){
    if(typeof v[i]!=='number'||!isFinite(v[i])) return null;
    if(i&&v[i]<v[i-1]) return null;          /* descends: absolute, not a ratio */
  }
  return v[4]<=2?v:null;                     /* over 200% is an absolute ladder */
}
function ladderInUnits(r){
  var v=ratioLadder(r), t=(r||{}).plan_target;
  /* A RATE ROW has no target to scale the rungs by — the rungs ARE the rate.
     Shown as percentages so the ladder and the achievement are in the same
     units: 80% | 85% | 90% | 95% | 100% beside an achieved 87%, rather than
     "0.8" beside "87%". */
  if(v&&String((r||{}).plan_unit||'')==='ratio'){
    return v.map(function(x){ return fmtTarget(x,'ratio'); });
  }
  if(!v||t===null||t===undefined||!isFinite(Number(t))||Number(t)===0) return null;
  /* exact: these are THRESHOLDS, so 5.4 sellers must not read as 5 */
  return v.map(function(x){ return fmtTarget(Number(t)*x,(r||{}).plan_unit,true); });
}
/* HOW MANY KPIs THERE ARE — COUNTED BY NAME, NOT BY ROW.
 *
 * The KPIS table holds one row per KRA + KPI name, and that is deliberate: two
 * KRAs sharing a KPI name are different measurements with different targets,
 * and collapsing them onto one id used to drop a person's KPI and its
 * weightage outright. Right for storage; wrong for a headline count.
 *
 * 'Monthly Target Achievement (%)' alone occupies six catalogue rows — GMV,
 * New Buyer Acquisition, New Seller Acquisition and so on, in two verticals.
 * Reporting 91 KPIs where there are 64 distinct ones makes the framework look
 * broader than it is, and invites the reader to divide 225 assignments by the
 * wrong denominator.
 *
 * Names are folded the way the SERVER folds them (normName_ in Code.gs): upper
 * case, punctuation to spaces, runs of space collapsed. That is what makes
 * 'TAT ( 3 Days)' and 'TAT ( 3 Days )' one KPI rather than two — a typo in the
 * workbook, not a second measurement.
 *
 * COUNTING ONLY. Nothing is merged anywhere else: every assignment keeps its
 * own catalogue row, its own ladder and its own weightage, and the rollup
 * denominator is untouched. */
function normKpiName(v){

/* WHAT MAKES TWO KPIs THE SAME KPI.

 * The KRA AND the name together, never the name alone. Several KRAs share one
 * KPI name: "Monthly Target Achievement (%)" is the KPI for GMV, for New Buyer
 * Acquisition and for New Seller Acquisition alike. They are three different
 * measurements with three different targets and three different weightages,
 * and folding them together would report Metal as having 5 KPIs when it has 7.
 * 20 of the 38 people hold some KPI name more than once for this reason.
 *
 * The KRA is deliberately taken by NAME rather than by kra_id, because a KRA
 * id is scoped to a team: Metal's GMV and Plastic's GMV are different ids for
 * the same result area, and the whole point of these counts is that holding
 * the same KPI does not make it a new one.
 *
 * Both parts are folded the way the SERVER folds names (normName_ in Code.gs),
 * so a workbook typo does not invent a KPI. */
function kpiIdentity(kraName,kpiName){

/* Over the ROWS CURRENTLY ON SCREEN rather than the catalogue. The Overview

}
function distinctKpiCount(){

/* ONE COMPUTATION, TWO READERS.
 *
 * The cards on the Overview and the breakdown that explains each card must
 * never be able to disagree. A second copy of "how the average was reached",
 * written for the explanation, would drift from the first the next time either
 * changed — and an explanation that quietly contradicts the number it explains
 * is worse than no explanation. So both read this, and it keeps the CONTENTS of

function ovStats(){
  var EPS=1e-9;

  var all=people.map(function(e){ return { e:e, o:M.overalls[e.id]||{} }; });
  var scored=all.filter(function(x){
    return x.o.score!==null&&x.o.score!==undefined; });
  var unscored=all.filter(function(x){
    return x.o.score===null||x.o.score===undefined; });

    return a.length?a.reduce(function(t,x){ return t+Number(get(x)); },0)/a.length:null; }

  var noAch=tr.filter(function(r){

     which is scored on the raw figure and has no percentage to average. Those
     rows are left out rather than counted as zero. */
  var pctRows=tr.filter(function(r){ return pctOfTarget(r)!==null; });
  var attain=mean(pctRows,function(r){ return pctOfTarget(r); });
  var atTgt=pctRows.filter(function(r){ return pctOfTarget(r)>=100-EPS; });

  var gap=list.filter(function(r){
    return r.level===null||r.level===undefined||r.level===''; });

  function band(lo,hi){

  var ok=band(4,null), warn=band(3,4), crit=band(0,3);

  var keep={}; people.forEach(function(e){ keep[e.id]=1; });
  var depts=[];
  ((S.model||{}).teams||[]).forEach(function(t){
    var ss=(M.byTeam[t.id]||[]).filter(function(e){ return keep[e.id]; })
      .map(function(e){ return { e:e, o:M.overalls[e.id]||{} }; })
      .filter(function(x){ return x.o.score!==null&&x.o.score!==undefined; });

  });

  var top=scored.slice().sort(function(a,b){ return b.o.score-a.o.score; })[0]||null;
  return { people:people, list:list, st:st, all:all, scored:scored, unscored:unscored,
           avgLvl:avgLvl, tr:tr, withAch:withAch, noAch:noAch, pctRows:pctRows,
           attain:attain, atTgt:atTgt, rated:rated, gap:gap,
           ok:ok, warn:warn, crit:crit, depts:depts, top:top,
           total:((S.model||{}).employees||[]).length };
}
/* Every filtered row that HAS a numeric target, newest department first.
   A KPI with no target cannot appear here — there is nothing to be a
   percentage of — and saying so is more useful than showing a blank row. */
function targetedRows(){
  return filteredRows().filter(function(r){

}
/* Achieved as a share of target. The server computes r.ratio only for a RATIO

function pctOfTarget(r){
  if(r.ratio===null||r.ratio===undefined) return null;

/* One table per VERTICAL: POCs down the side, KRAs across the top, Target and

 * Built per vertical rather than as one wide grid because the KRA sets differ

/* Achievement as a percentage, with 100% always meaning ON TARGET.

 * For a KRA where more is better that is achieved / target. For one where
 * LESS is better it has to be inverted — target / achieved — or the number
 * says the opposite of what it means: a DSO of 4 days against a 3-day target

 * Inverted, it reads 75%, and every column on the page can then be read the

/* VERTICAL x KRA SUMMARY — one row per KRA, grouped by vertical, with a total
 * row per vertical and a grand total.
 *
 * WHAT CAN AND CANNOT BE ADDED UP.
 *
 * A KRA row sums across PEOPLE, which is sound: every person's GMV target is
 * in crore, every person's New Seller Acquisition target is a count. Same KRA,
 * same unit.
 *
 * A vertical TOTAL cannot sum those rows. 15.61 crore of GMV plus 19 sellers
 * plus 3 days of DSO is not 37.61 of anything. The shipment report this table
 * is modelled on can total its columns because each one is a single unit —
 * transactions, MT, lakhs. Here every row is a different unit, so the total
 * row reports what IS countable: how many KRAs met their target.
 *

 * nothing, on the most prominent row of the page. */
function verticalSummary(){
  var rows=targetedRows();
  if(!rows.length) return '';

  rows.forEach(function(r){
    var e=M.emps[r.employee_id]; if(!e) return;
    var v=String(e.team_id);
    if(!byV[v]){ byV[v]={kra:{},people:{}}; order.push(v); }
    byV[v].people[e.id]=1;

       20 days plus Rishi's 10 against a target of 5 + 5 — 30 days against 10,
       which is not a number of anything and showed as an achievement. The old
       comment defended summing on the grounds that every POC's GMV is in crore
       and every POC's seller target is a count: true, and irrelevant to a rate
       or a duration.

       model applies down the month axis — agg_kind / plan_agg, which the server

    if(r.actual!==null&&r.actual!==undefined) k.as.push(Number(r.actual));
    k.unit=r.plan_unit||k.unit;

    k.agg=r.agg_kind||k.agg;

  function meansAcrossPocs(k){

    body+='<tr class="vtot"><td colspan="2">'+h(teamLabel(M.teams[v]))+' total'+

      ?(function(){ var p=((S.model||{}).periods||[]).filter(function(x){

/* The achieved value. Under YTD this is the year's figure, and HOW it was
 * aggregated has to be said out loud: a seller count or a crore amount is
 * SUMMED across the months, while a DSO or a rate is AVERAGED. "22.75 days"
 * and "91 days" are the same four months read two different ways, and a
 * reader cannot tell which they are looking at unless the page says.
 *
 * The month count matters too: an achieved value from 2 months against a
 * target that spans 3 is not a shortfall, it is an incomplete year. */
/* The working behind a number NOBODY TYPED. A DSO of 29.8 days is unarguable
   and unexaminable at once; the three figures it came from make it neither. */
function noteFor(r,month){
  return (month&&r&&r.monthly&&r.monthly[month]&&r.monthly[month].note)||
         (r&&r.actual_note)||'';
}
function workingOf(r,month){
  var note=noteFor(r,month);
  if(!note) return '';
  /* the note leads with its source, which the column already implies */
  var txt=String(note).replace(/^MM_CT DSO · /,'');
  /* Clickable, because the one-line form is a summary: the modal lays the
     calculation out against the ladder the rating came from, which is what
     somebody actually wants when they disagree with the number. */
  return '<button class="working worklink" data-work="'+
    h(r.employee_id)+'|'+h(r.kpi_id)+'|'+h(month||'')+
    '" title="See the calculation">'+h(txt)+'</button>';
}
function achievedCell(r,month){
  if(r.actual===null||r.actual===undefined) return '<span class="lv-na">—</span>';
  var main=h(fmtTarget(r.actual,r.plan_unit));
  var work=workingOf(r,month);
  if(!r.months_total) return main+work;
  var how=r.agg_kind==='mean'?'monthly average':'total';
  var mo=(r.actual_months||0)+' of '+r.months_total+' mo';
  return main+'<div style="font-size:11px;color:var(--ink-3)">'+h(how)+
    ' · '+h(mo)+'</div>'+work;
}
function targetCell(r){
  if(r.plan_target===null||r.plan_target===undefined) return '<span class="lv-na">\u2014</span>';
  var why=r.plan_rule||'';
  /* a YTD figure built from fewer months than the span is not a full-year
     target, and silently showing it as one would overstate the ask */
  var part=(r.months_total&&r.plan_months&&r.plan_months<r.months_total)
    ? '<div style="font-size:11px;color:var(--ink-3)">'+r.plan_months+' of '+
      r.months_total+' mo</div>' : '';
  var drv=r.plan_source==='derived'
    ? '<div style="font-size:11px;color:var(--ink-3)">auto</div>' : '';
  return '<span'+(why?' title="'+h(why)+'"':'')+'>'+
    h(fmtTarget(r.plan_target,r.plan_unit))+'</span>'+part+drv;
}

var MONTHS=['January','February','March','April','May','June','July','August',
            'September','October','November','December'];
/* The server now stores these correctly, but a sheet written by an older
   version still holds dates where the month name should be — and the id is the
   only timezone-proof source, so read the label off that first. */
function periodLabel(p){
  if(!p) return '';
  var m=String(p.id||'').match(/(\d{4})-(\d{2})$/);
  if(m) return MONTHS[Number(m[2])-1]+' '+m[1];
  var nm=String(p.name==null?'':p.name);
  if(/^\d{4}-\d{2}-\d{2}T/.test(nm)){
    var d=new Date(nm);
    if(!isNaN(d.getTime())) return MONTHS[d.getMonth()]+' '+d.getFullYear();
  }
  return nm||String(p.id||'');
}

/* Short display labels for departments whose full name will not fit a chart
 * axis, a table cell or a filter option.

 * Keyed by team ID, and DISPLAY ONLY — deliberately not a rename in the data.

 * seedFromEmbedded_ and importFromSource_), so renaming the team to "OMP_CT"
 * would mint a new id — team_omp-ct instead of
 * team_open-marketplace-control-tower — and the next import would create a
 * SECOND team, orphaning the 8 people still pointing at the old one. The full
 * name stays the record; this is what the reader sees. */

/* ---------------------------------------------------------------- filters --
 * DEPARTMENT is team_id.  There is no separate department column in the
 * schema, and the two candidates that could have been one are unusable:
 * `region` is blank for all 38 people, and `sub_group` is set for 14.  The
 * team IS the business function here — Metal, Plastic, Onboarding, Collections,

/* ============================ derived facts ================================
 * All of this is computed from what the server actually sent. Nothing is
 * synthesised — if no actual has been recorded, the number is null and the
 * chart says so rather than drawing a plausible line.
 * ========================================================================= */
function stats(list){
  list=list||rows();
  var st={n:list.length,scored:0,levels:[0,0,0,0,0,0],kinds:{numeric:0,ordinal:0,qualitative:0,none:0},
          weight:0,measured:0,nonMono:0};
  list.forEach(function(r){
    st.weight+=r.weightage||0;
    var defined=(r.bands||[]).filter(function(b){ return String(b||'').trim()!==''; }).length;
    if(!defined) st.kinds.none++; else st.kinds[r.kind]=(st.kinds[r.kind]||0)+1;
    if(r.band_note&&/not monotonic/i.test(r.band_note)) st.nonMono++;
    if(r.level!==null&&r.level!==undefined&&r.level!==''){
      st.scored++; st.measured+=r.weightage||0;
      /* a YTD level is a MEAN and can be fractional — Number(2.67) as an array
         index would silently produce NaN and lose the bar */
      st.levels[Math.max(0,Math.min(5,Math.round(Number(r.level))))]++;
    }
  });
  return st;
}
/* Ladders whose direction contradicts the KPI's wording, plus the ones that
   cannot be measured at all. These decide people's ratings, so they are
   surfaced rather than quietly normalised. */
function flags(list){
  var out=[];
  (list||rows()).forEach(function(r){
    var e=M.emps[r.employee_id]; if(!e) return;
    var defined=(r.bands||[]).filter(function(b){ return String(b||'').trim()!==''; }).length;
    if(!defined){ out.push({sev:'w',emp:e,row:r,what:'No ladder defined',
      why:'Target 1 to 5 are all empty, so no level can ever be resolved for this KPI.'}); return; }
    if(r.kind==='numeric'&&r.direction==='lower_is_better'&&
       /\b(recovered|recovery|collection|collections|gmv|revenue|achieved|achievement|acquisition|conversion|closure|completed|accuracy)\b/i.test(r.kpi)){
      out.push({sev:'c',emp:e,row:r,what:'Rating scale rewards a lower number',
        why:'Target 1 is '+h(r.bands[0])+' and Target 5 is '+h(r.bands[4])+
            ', so a smaller result scores higher — although the KPI reads as something to increase.'});
    }
    if(r.kind==='numeric'&&r.band_note&&/not monotonic/i.test(r.band_note)){
      out.push({sev:'c',emp:e,row:r,what:'Rating scale is not monotonic',
        why:'Target 1 to 5 do not move in one direction, so the level cannot be resolved reliably.'});
    }
    if(r.kind==='qualitative'){ out.push({sev:'w',emp:e,row:r,what:'Awarded by hand',
      why:'No numeric ladder — someone has to award the level for this KPI.'}); }
  });
  var order={c:0,w:1};
  return out.sort(function(a,b){ return order[a.sev]-order[b.sev]; });
}
function weightWarnings(){
  var out=[];
  Object.keys(M.overalls).forEach(function(id){
    var w=M.overalls[id].assigned_weightage;
    if(Math.abs(w-100)>0.5&&M.emps[id]) out.push({emp:M.emps[id],w:w});
  });

}

/* ================================ charts ==================================
 * Chart.js reads CSS custom properties through this helper so the palette
 * lives in exactly one place.
 * ======================================================================== */
function tok(name){ return getComputedStyle(document.documentElement)
  .getPropertyValue(name).trim(); }
function destroyCharts(){ Object.keys(CH).forEach(function(k){
  try{ CH[k].destroy(); }catch(e){} delete CH[k]; }); }
function baseOpts(){
  var ink2=tok('--ink-2'), ink3=tok('--ink-3'), line=tok('--line-soft');
  return {
    responsive:true, maintainAspectRatio:false,
    animation:{duration:260},
    plugins:{
      legend:{display:false},
      tooltip:{
        backgroundColor:tok('--raised'), borderColor:tok('--line'), borderWidth:1,
        titleColor:tok('--ink'), bodyColor:ink2, padding:10, cornerRadius:8,
        displayColors:true, boxWidth:9, boxHeight:9, boxPadding:4,
        titleFont:{family:tok('--font'),size:12,weight:'600'},
        bodyFont:{family:tok('--font'),size:12}
      }
    },
    scales:{
      x:{ticks:{color:ink3,font:{family:tok('--font'),size:11}},
         grid:{display:false},border:{color:line}},
      y:{ticks:{color:ink3,font:{family:tok('--font'),size:11}},
         grid:{color:line},border:{display:false}}
    }
  };
}
function mkChart(id,cfg){
  var el=document.getElementById(id); if(!el||!window.Chart) return;
  if(CH[id]){ try{CH[id].destroy();}catch(e){} }
  CH[id]=new Chart(el,cfg);
}
/* chartLevels() lived here and drew the level distribution on the Overview.
   That card was replaced by the per-vertical month-by-month cards, leaving it
   with no caller, so it is gone rather than left as a function the next reader
   has to work out is dead.
   Note that the level distribution is now shown NOWHERE. stats() still counts
   st.levels, so putting it back — on Teams or Structure review — is a panel and
   a canvas, not a rebuild. */
/* MONTH-WISE PERFORMANCE for one vertical.
 *
 * The measure is the SHARE OF TARGETED KPIs THAT MET OR BEAT TARGET in that
 * month, not an average achievement %.
 *
 * An average would be wrong here and badly so. The real data contains 600%,
 * 400% and 325% against small counts, and a mean of ratios lets one KPI with
 * a target of 3 drown twenty others — Metal would read as a triumph in a
 * month most of it missed. A share is immune to that: every targeted KPI
 * counts once, however spectacular its overshoot.
 *
 * Direction matters: on a lower-is-better KRA (DSO days) meeting target means
 * achieved <= target, not >=.
 *
 * A month with no targeted KPI carrying BOTH a target and an achievement has
 * no share at all, and is left null rather than drawn as zero — nothing
 * recorded is not the same as nothing achieved. */
function monthlyHitRate(rows){
  var span=((S.model||{}).ytd_periods)||[];
  return span.map(function(pid){
    var n=0,hit=0;
    rows.forEach(function(r){
      var m=(r.monthly||{})[pid]; if(!m) return;
      var t=m.target, a=m.actual;
      if(t===null||t===undefined||a===null||a===undefined||!t) return;
      n++;
      if(r.direction==='lower_is_better'? a<=t : a>=t) hit++;
    });
    return {period:pid,n:n,hit:hit,pct:n?hit/n*100:null};
  });
}
function chartMonthly(id,rows){
  var pts=monthlyHitRate(rows);
  var o=baseOpts();
  o.scales.y.min=0; o.scales.y.max=100;
  o.scales.y.ticks.callback=function(v){ return v+'%'; };
  o.plugins.tooltip.callbacks={label:function(c){
    var p=pts[c.dataIndex];
    return p.n? p.hit+' of '+p.n+' targeted KPIs met target'
              : 'nothing recorded'; }};
  mkChart(id,{type:'bar',data:{
    labels:pts.map(function(p){
      var per=((S.model||{}).periods||[]).filter(function(x){
        return String(x.id)===String(p.period); })[0];
      return per?periodLabel(per):p.period; }),
    datasets:[{data:pts.map(function(p){ return p.pct; }),
      backgroundColor:tok('--accent'),borderRadius:4,borderSkipped:'bottom',
      maxBarThickness:46}]},options:o});
}
function chartTeams(id,mode){
  var m=S.model||{}, labels=[], vals=[];
  /* the bars must describe the same population the tiles and the table do */
  var keep={}; filteredEmployees().forEach(function(e){ keep[e.id]=1; });
  (m.teams||[]).forEach(function(t){
    var people=(M.byTeam[t.id]||[]).filter(function(e){ return keep[e.id]; });
    if(!people.length) return;
    labels.push(teamLabel(t));
    if(mode==='kpis'){
      var rs=[]; people.forEach(function(e){ rs=rs.concat(M.byEmp[e.id]||[]); });
      vals.push(distinctKpiCountIn(rs));
    } else {
      var acc=0,c=0;
      people.forEach(function(e){ var o=M.overalls[e.id];
        if(o&&o.score!==null&&o.score!==undefined){ acc+=o.score; c++; } });
      vals.push(c?Math.round(acc/c*10)/10:0);
    }
  });
  var o=baseOpts();
  o.indexAxis='y';
  o.scales.x.grid={color:tok('--line-soft')};
  o.scales.y.grid={display:false};
  if(mode!=='kpis'){ o.scales.x.min=0; o.scales.x.max=5; o.scales.x.ticks.stepSize=1; }
  o.plugins.tooltip.callbacks={label:function(c){
    return mode==='kpis'? c.parsed.x+(c.parsed.x===1?' KPI':' KPIs')
                        : 'average level '+f1(c.parsed.x)+' of 5'; }};
  mkChart(id,{type:'bar',data:{labels:labels,datasets:[{data:vals,
    backgroundColor:tok('--accent'),borderRadius:4,borderSkipped:'start',
    maxBarThickness:24}]},options:o});
}

V.overview=function(){

  /* The year-to-date explanation card was removed on request. The rules it

     its own totals rather than on a mean of monthly ratings. They are written

  if(!st.scored){

  if(ww.length){
    out+=note('w',ww.length+' scorecard'+(ww.length===1?'':'s')+' do not total 100% weightage',

         threw "Cannot read properties of undefined (reading 'name')" and took
         the whole Overview down. It stayed hidden because this branch only runs
         when a scorecard does not total 100%, and none did until the framework
         re-import took assignments from 208 to 225.
         tests/shapetest.js asserts the page never reads that field again, so
         do not write the offending expression even inside a comment. */
      ww.slice(0,4).map(function(x){ return h(x.emp.name)+' ('+f1(x.w)+'%)'; }).join(', ')+
      (ww.length>4?' and '+(ww.length-4)+' more':'')+'.');
  }

  /* ======================= THE TWO CARD ROWS =============================
   *
   * Row 1, EXECUTIVE SUMMARY: how many people, how well they are doing, and
   * how much of it is actually measured.
   * Row 2, PERFORMANCE HEALTH: how those people split three ways, and what is
   * still missing.

   * Every figure respects the filters, like everything else on this page.
   *
   * The four tiles this replaced — with a numeric target, achieved recorded,
   * at or above target, rated — are NOT lost: each of their numbers now sits
   * in the small print of the tile that supersedes it, so nothing that was
   * countable before has stopped being visible. */
  var V1=ovStats();
  function ofScored(x){
    return V1.scored.length?'<b>'+pc(x/V1.scored.length*100)+'</b> of scored':'—'; }

  out+='<div class="row r-5">'+
    tile('Employees',String(V1.people.length),
      V1.unscored.length
        ?'<b>'+V1.scored.length+'</b> scored · '+V1.unscored.length+

    tile('Target achievement',V1.attain===null?'—':pc(V1.attain),
      V1.pctRows.length?'<b>'+V1.atTgt.length+'</b> of '+V1.pctRows.length+

                 :'nothing achieved against a target yet',false,'card:attain')+
    tile('KPI completion',V1.tr.length?pc(V1.withAch.length/V1.tr.length*100):'—',
      V1.tr.length?'<b>'+V1.withAch.length+'</b> of '+V1.tr.length+
        ' targeted KPIs have a value'
               :'nothing targeted yet',false,'card:completion')+
    tile('Top performer',V1.top?h(V1.top.e.name):'—',
      V1.top?'level <b>'+f1(V1.top.o.score)+'</b> of 5':'awaiting actuals',
      true,'card:top')+
    '</div>';

  out+='<div class="row r-5 mt">'+
    statTile('ok','On track',String(V1.ok.length),
      ofScored(V1.ok.length)+' · at or above target','card:ok')+
    statTile('warn','Needs attention',String(V1.warn.length),
      ofScored(V1.warn.length)+' · reached Target 3, not target','card:warn')+
    statTile('crit','Critical',String(V1.crit.length),
      ofScored(V1.crit.length)+' · below Target 3','card:crit')+
    tile('KPI gap',String(V1.gap.length),
      /* the deduped KPI count keeps a home here: the Overview lost its own
         KPIs card in this layout, and it is the one number that says how
         much of the framework these assignments actually cover. */
      'of <b>'+V1.st.n+'</b> assignments · <b>'+distinctKpiCountIn(V1.list)+
      '</b> KPIs · <b>'+V1.rated.length+'</b> of '+V1.tr.length+' targeted rated',
      false,'card:gap')+
    tile('Top department',V1.depts.length?h(teamLabel(V1.depts[0].t)):'—',
      V1.depts.length?'level <b>'+f1(V1.depts[0].avg)+'</b> of 5 across '+
        V1.depts[0].n+(V1.depts[0].n===1?' scorecard':' scorecards')
        :'awaiting actuals',true,'card:dept')+
    '</div>';

  /* ladder readiness — part-to-whole across 4 classes, so a stacked bar with a
     legend AND direct labels; identity is never carried by colour alone */
  var k=st.kinds, tot=st.n||1;
  var segs=[['numeric','Numeric','--cat1'],['ordinal','Ordinal','--cat2'],
            ['qualitative','Qualitative','--cat3'],['none','No ladder','--cat-rest']];
  var meter='<div class="meter" style="height:11px">'+segs.map(function(s){
      var v=k[s[0]]||0; if(!v) return '';
      return '<i style="width:'+(v/tot*100)+'%;background:var('+s[2]+')" ' +
             'title="'+h(s[1])+': '+v+'"></i>'; }).join('')+'</div>'+
    '<div class="legend">'+segs.filter(function(s){ return (k[s[0]]||0)>0; })
      .map(function(s){
        var v=k[s[0]]||0, share=v/tot*100;
        return '<span><i style="background:var('+s[2]+')"></i>'+h(s[1])+
               ' <b class="num" style="color:var(--ink)">'+v+'</b>'+
               ' <span style="color:var(--ink-3)">('+
               (share<1?'<1':Math.round(share))+'%)</span></span>'; }).join('')+
    '</div>'+
    '<div class="cap" style="margin-top:12px">Only numeric ladders can be scored from an '+
    'actual. Ordinal and qualitative ones are awarded by hand.</div>';

  out+='<div class="row r-21 mt">'+
    panel({title:'How KPIs are scored',cap:'Rating scale across all '+st.n+' assignments',
      body:meter})+
    panel({title:'Weightage measured',cap:'Share of scorecard weight with a recorded actual',
      body:'<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px">'+
        '<div style="font-size:34px;font-weight:750;letter-spacing:-1.2px" class="num">'+
        pc(st.measured/(st.weight||1)*100)+'</div>'+
        '<div class="cap">'+st.scored+' of '+st.n+' weighted KPIs '+
        'have an actual</div></div>'+
        '<div class="meter"><i style="width:'+(st.measured/(st.weight||1)*100)+
        '%;background:var(--accent)"></i></div>'+
        '<div class="cap" style="margin-top:11px">Unscored KPIs leave the rollup '+
        'denominator rather than counting as zero, so a thin measurement base '+
        'inflates confidence in a score.</div>'})+
    '</div>';

  /* one table per vertical, so the KRA columns are the ones that vertical

  (function(){
    var sum=verticalSummary();
    if(sum) out+='<div class="mt">'+panel({flush:true,

  out+='<div class="mt"><div class="cap" style="margin-bottom:9px">'+
    '<b style="color:var(--ink)">Targets and achieved</b> · '+
    ((S.model||{}).ytd
      ?'the year so far — counts and amounts summed across the months, '+
       'rates and durations averaged'
      :h(periodName(S.period)))+'</div>'+
    targetsPanel()+'</div>';

  /* month-wise performance, one card per vertical that has targets at all */
  var perfCards=[], perfDraw=[];
  (function(){
    var byTeam={};
    targetedRows().forEach(function(r){
      var e=M.emps[r.employee_id]; if(!e) return;

               'A month counts once a KPI has BOTH a target and an achieved value.'))+
          '</div>'}));
        if(any) perfDraw.push({id:cid,rows:rows});
      });
  })();
  if(perfCards.length){
    out+='<div class="row r-'+(perfCards.length>1?2:1)+' mt">'+
      perfCards.join('')+'</div>';
  }

  out+='<div class="mt">'+panel({flush:true,title:'People',
    cap:'Weighted mean of scored KPI levels · '+h(periodName(S.period)),
    body:'<div class="tw">'+peopleTable(people)+'</div>'})+'</div>';

  setTimeout(function(){
    perfDraw.forEach(function(c){ chartMonthly(c.id,c.rows); });
  },0);
  return out;

/* People, banded by department.  The Team column is gone because the band

  if(!list.length) return emptyBox('No people','Nothing matches the current filters.');

    '<th class="opt2">KPIs</th><th class="r opt2">Weightage</th>'+
    '<th class="r">Score</th><th>Level</th></tr></thead><tbody>';
  /* band them in the department order the workbook uses, not alphabetically,

  var byDept={}, order=[];

V.emp=function(p){

  var rs=(M.byEmp[e.id]||[]).slice().sort(function(a,b){
    return (b.weightage||0)-(a.weightage||0); });
  var o=M.overalls[e.id]||{}, t=M.teams[e.team_id], st=stats(rs);

  var out='<div class="hdr"><div style="display:flex;gap:14px;align-items:center">'+
    '<div class="av" style="width:46px;height:46px;font-size:16px">'+h(ini(e.name))+'</div>'+

    (mayFramework(e.id)?'<button class="btn p" data-assign="new:'+h(e.id)+
      '">+ Add KPI</button>':'')+'</div>';
  /* the scorecard is where actuals are RECORDED, so the month must be pickable
     here above all — editable() is false under Year to date */
  out+=periodBar();

  out+='<div class="row r-5">'+
    tile('Overall score',o.score===null||o.score===undefined?'—':f1(o.score)+
      '<span style="font-size:15px;color:var(--ink-3)"> / 5</span>',
      o.level?'rounds to <b>Target '+o.level+'</b>':'awaiting actuals')+
    tile('KPIs',String(rs.length),'<b>'+(o.scored_count||0)+'</b> scored')+
    tile('Weightage',f1(o.assigned_weightage)+'%',
      Math.abs((o.assigned_weightage||0)-100)>0.5?
        '<b style="color:var(--warn)">does not total 100%</b>':'totals 100% as required')+
    tile('Measured',pc((o.measured_weightage||0)/(o.assigned_weightage||1)*100),
      '<b>'+(o.scored_count||0)+'</b> of '+rs.length+' KPIs have an actual')+
    tile('Level',levelMeter(o.level===undefined?null:o.level),'',true)+
    '</div>';

  /* KRA rollups — the same weighted mean renormalised inside each KRA */
  var byKra={};
  rs.forEach(function(r){ (byKra[r.kra_id]=byKra[r.kra_id]||[]).push(r); });
  var kraBody='';

      '<td class="num">'+list.length+'</td><td class="r num">'+f1(w)+'%</td>'+
      '<td>'+(lvl===null||lvl===undefined?levelMeter(null):
        levelMeter(Math.round(lvl),f1(lvl)))+'</td></tr>';
  });

  out+='<div class="row r-21 mt">'+
    panel({flush:true,title:'KRA rollups',cap:'Weighted mean renormalised within each KRA',
      body:'<div class="tw"><table><thead><tr><th>KRA</th><th>KPIs</th>'+
        '<th class="r">Weight</th><th>Level</th></tr></thead><tbody>'+kraBody+
        '</tbody></table></div>'})+
    panel({title:'Rating scale mix',cap:'How this scorecard can be scored',
      body:'<div class="meter" style="height:11px">'+
        [['numeric','--cat1'],['ordinal','--cat2'],['qualitative','--cat3'],
         ['none','--cat-rest']].map(function(s){
          var v=st.kinds[s[0]]||0; if(!v) return '';
          return '<i style="width:'+(v/(st.n||1)*100)+'%;background:var('+s[1]+')"></i>'; }).join('')+
        '</div><div class="legend">'+
        [['numeric','Numeric','--cat1'],['ordinal','Ordinal','--cat2'],
         ['qualitative','Qualitative','--cat3'],['none','No ladder','--cat-rest']]
          .filter(function(s){ return (st.kinds[s[0]]||0)>0; })
          .map(function(s){ return '<span><i style="background:var('+s[2]+')"></i>'+
            h(s[1])+' <b class="num" style="color:var(--ink)">'+st.kinds[s[0]]+'</b></span>'; })
          .join('')+'</div>'})+

    '<th class="r">Actual</th><th>Level</th>'+
    '<th class="r act">Actions</th></tr></thead><tbody>';
  rs.forEach(function(r){
    var kra=M.kras[r.kra_id]||{};
    /* A ratio ladder reads as 0.6 / 0.75 / 0.9 / 1.0 / 1.05, which nobody
       carries a target in. Where a numeric target exists the rungs are shown
       as the figures they actually represent, with the stored ratios kept
       underneath so the two can always be reconciled. */
    var inUnits=ladderInUnits(r);
    var bands=(inUnits||(r.bands||[]).map(function(b){ return String(b||'').trim(); }))
      .filter(Boolean).map(h).join('&nbsp; · &nbsp;');
    if(inUnits) bands+='<div style="margin-top:3px;color:var(--ink-3)">'+
      (r.bands||[]).map(function(b){ return String(b||'').trim(); })
        .filter(Boolean).map(h).join('&nbsp; · &nbsp;')+'&nbsp; of target</div>';
    body+='<tr>'+
      '<td style="min-width:196px"><div style="font-weight:600">'+h(r.kpi)+'</div>'+
        (r.unit?'<div style="font-size:11.5px;color:var(--ink-3)">'+h(r.unit)+'</div>':'')+'</td>'+
      '<td class="opt1" style="max-width:200px"><div style="font-size:12.5px">'+
        h(kra.name||'—')+'</div></td>'+
      '<td class="r num">'+f1(r.weightage)+'%</td>'+
      '<td style="min-width:210px;max-width:330px">'+kindTag(r.kind)+
        (bands?'<div class="cap" style="margin-top:5px;line-height:1.45">'+bands+'</div>':'')+
        (r.band_note?'<div style="font-size:11.5px;color:var(--warn);margin-top:4px">'+
          h(r.band_note)+'</div>':'')+'</td>'+
      '<td class="r num">'+targetCell(r)+'</td>'+
      '<td class="r num">'+achievedCell(r)+'</td>'+
      '<td>'+levelMeter(r.level===undefined?null:r.level)+'</td>'+
      '<td class="r act" style="white-space:nowrap">'+
        (mayActual(e.id)?'<button class="btn sm" data-actual="'+h(e.id)+'|'+h(r.kpi_id)+
          '">Actual</button> ':'')+
        (mayTargets(e.id)?'<button class="btn sm" data-targets="'+h(e.id)+'|'+h(r.kpi_id)+
          '">Bands</button> ':'')+
        (mayFramework(e.id)?'<button class="btn sm" data-assign="'+h(r.assignment_id)+':'+
          h(e.id)+'">Edit</button>':'')+
      '</td></tr>';
  });
  out+='<div class="mt">'+panel({flush:true,title:'Scorecard',
    cap:rs.length+' individually weighted KPIs · '+h(periodName(S.period)),
    body:'<div class="tw">'+body+'</tbody></table></div>'})+'</div>';
  return out;
};

V.review=function(){

  var warn=fl.filter(function(f){ return f.sev==='w'; });

  out+='<div class="row r-3">'+
    tile('Need a decision',String(crit.length),'ladders that contradict the KPI')+
    tile('Awarded by hand',String(warn.length),'no measurable ladder')+

    '</div>';

    out+='<div class="mt">'+panel({body:emptyBox('Nothing to review',

    return out;
  }
  function flagRows(arr){
    if(!arr.length) return '';
    var b='<table><thead><tr><th>Person</th><th>KPI</th><th>Issue</th>'+
      '<th>Target 1 → 5</th></tr></thead><tbody>';

      b+='<tr class="clk" data-go="emp/'+h(f.emp.id)+'">'+
        '<td>'+person(f.emp)+'</td>'+

          (f.sev==='c'?'var(--crit)':'var(--warn)')+'">'+h(f.what)+'</div>'+
          '<div style="font-size:12px;color:var(--ink-2);margin-top:2px">'+f.why+
          '</div></div></div></td>'+
        '<td style="max-width:300px"><div style="display:flex;gap:4px;flex-wrap:wrap">'+

            '<span class="tag g">'+h(x)+'</span>':''; }).filter(Boolean).join('')+
          '</div></td></tr>';
    });
    return b+'</tbody></table>';
  }
  if(crit.length) out+='<div class="mt">'+panel({flush:true,
    title:'Needs a decision from the KRA owner',
    cap:'Reverse the bands if the direction is unintended — these change ratings',
    body:'<div class="tw">'+flagRows(crit)+'</div>'})+'</div>';
  if(warn.length) out+='<div class="mt">'+panel({flush:true,
    title:'Must be awarded by hand',

    body:'<div class="tw">'+flagRows(warn)+'</div>'})+'</div>';
  if(ww.length){
    var b='<table><thead><tr><th>Person</th><th class="r">Assigned weightage</th>'+
      '<th>Gap</th></tr></thead><tbody>';
    ww.forEach(function(x){
      b+='<tr class="clk" data-go="emp/'+h(x.emp.id)+'"><td>'+person(x.emp)+'</td>'+
        '<td class="r num">'+f1(x.w)+'%</td><td class="num" style="color:var(--warn)">'+
        (x.w>100?'+':'')+f1(x.w-100)+'%</td></tr>';
    });
    out+='<div class="mt">'+panel({flush:true,title:'Weightage does not total 100%',
      cap:'Per-KPI weightage is normalised per person on import, so a gap means the source changed',
      body:'<div class="tw">'+b+'</tbody></table></div>'})+'</div>';
  }
  return out;
};

/* WHERE THE ANSWERS LIVE.
 *
 * "What is this card and how is it worked out?" is the question a scorecard
 * gets asked most, and it is asked by the person being rated. Answering it in
 * a handover document is answering the wrong audience — they will never read
 * it, and by the time they ask, the meeting is already happening.
 *
 * So every rule that decides a number is written on a page inside the app,
 * reachable from the nav, in the same words the KRA owner used when deciding
 * it. Definitions belong where the numbers are.
 *
 * This page is generated from the same helpers the dashboard uses, so a
 * worked example cannot drift from the real arithmetic: RATING_SCALE_UI below
 * is the one the server applies. */
var RATING_SCALE_UI=[['60%','1'],['75%','2'],['90%','3'],
                     ['100% — on target','4'],['105%','5']];
function dl(rows){
  return '<dl class="defs">'+rows.map(function(r){
    return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>'; }).join('')+'</dl>';
}
V.method=function(){

    'Every card, column and rating on the Overview, and the arithmetic behind it'+
    '</div></div></div>';

  out+=note('i','The one distinction everything else rests on',
    'A <b>target rating</b> is not a <b>target</b>. The five rungs (Target 1 to 5) are '+
    'the bar for each rating. The target is a single number — 9 sellers, 6.50 Cr — and '+
    'on most KPIs here the rating comes from <b>achieved divided by target</b>, so the '+
    'target is the denominator, not a rung.');

  out+='<div class="mt">'+panel({title:'Assignments, KRAs and KPIs',
    cap:'Three counts of the same framework, and why they differ',

      ['KPIs <span class="cap">(the number on the card)</span>',
       'How many <b>different things are measured</b>, counted once however many '+

       'One per <b>person and KPI</b>. The same KPI held by four people is four '+
       'assignments, because each carries its own target, its own weightage and '+
       'its own rating. This is the number every rollup divides by, and it is '+
       'why the two counts are both worth showing.'],
      ['KRAs',
       'The result areas those KPIs sit under. A KPI name can appear under '+
       'several — <b>Monthly Target Achievement (%)</b> is the KPI for GMV, for '+

  out+='<div class="mt">'+panel({title:'Row 1 — Executive summary',

    ])})+'</div>';

  out+='<div class="mt">'+panel({title:'Row 2 — Performance health',

      'A <b>vertical total cannot add those rows together</b>. 15.61 crore of GMV '+
      'plus 19 sellers plus 3 days of DSO is not 37.61 of anything. So the total '+
      'rows report what genuinely is countable — <b>how many KRAs met their '+
      'target</b> — and the two quantity columns are deliberately left blank '+
      'rather than filled with a confident number that means nothing.</div>'})+'</div>';

  out+='<div class="mt">'+panel({title:'When a cell is blank',
    cap:'Four different causes that look identical on screen',
    body:dl([
      ['&middot; (a faint dot)','That person does not hold that KRA at all.'],
      ['&mdash; in Target','No target was typed in the Target Sheet for that month.'],
      ['&mdash; in Achieved','The Achievement column is empty for that month.'],
      ['A value, but no rating',
       'An achieved value with no target for that month cannot be rated — '+
       'there is nothing to be a percentage of. It is shown but deliberately '+
       'left unrated rather than scored as though the target had been met.']
    ])})+'</div>';

  out+='<div class="mt">'+panel({title:'Where the numbers come from',
    body:dl([
      ['Who holds which KRA, and the five rungs','The KRA / KPI workbook.'],

      ['Anything missing','Almost always a blank column in the Target Sheet '+

    ])})+'</div>';
  return out;
};

 *
 * One server round trip, on demand. It is not folded into apiModel because
 * 324 shipment rows joined to the POC maps on every dashboard load would be

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Performance Tracker — Individual KRA / KPI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --raised:#f4f4f4; --sunken:#f8f8f8;
  --line:#dcdcdc; --line-soft:#ebebeb;
  --ink:#111111; --ink-2:#5a5a5a; --ink-3:#8a8a8a;
  --accent:#111111; --accent-soft:#d8d8d8;
  --accent-weak:rgba(0,0,0,.07);
  --lv1:#b0b0b0; --lv2:#8c8c8c; --lv3:#6a6a6a; --lv4:#464646; --lv5:#1a1a1a;
  --lv0:#d8d8d8;
  --lvna:#ededed;
  --cat1:#1a1a1a; --cat2:#5e5e5e; --cat3:#949494; --cat-rest:#d0d0d0;
  --good:#1a1a1a; --warn:#5a5a5a; --crit:#0d0d0d;
  --head:#1f3a5f;
  --st-ok:#1a7f37; --st-warn:#a86400; --st-crit:#b42318;
  --r-lg:14px; --r:10px; --r-sm:7px;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:16px;height:16px;flex:none}
@keyframes revIn{from{opacity:0;transform:translateY(5px)}
                 to{opacity:1;transform:none}}
.rev{animation:revIn .3s ease both}
@media (prefers-reduced-motion: reduce){
  .rev{animation:none!important}
}

.boot{position:fixed;inset:0;z-index:200;overflow:hidden;
  background:var(--bg);
  background-image:radial-gradient(ellipse 72% 62% at 50% 44%,
    rgba(0,0,0,0) 0%, rgba(17,17,17,.04) 100%);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .42s ease .28s}
.boot-inner{display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:0 16px}
.boot-mark{width:min(96px,26vw);height:min(96px,26vw);
  display:grid;place-items:center;
  animation:bootspin 2.8s cubic-bezier(.62,0,.38,1) infinite;
  transition:transform .72s cubic-bezier(.5,0,.2,1)}
.boot-mark img{width:68%;height:auto;display:block}
@keyframes bootspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.boot.done .boot-mark{animation:none}
.boot-say{font-size:13.5px;color:var(--ink-3);letter-spacing:.015em;
  text-align:center;
  animation:wtSay .8s ease-out .3s both}
@keyframes wtSay{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.boot-dots{display:inline-block;width:1.6em;text-align:left}
.boot-dots i{font-style:normal;opacity:0;animation:wtDot 1.5s ease-in-out infinite}
.boot-dots i::before{content:"."}
.boot-dots i:nth-child(2){animation-delay:.22s}
.boot-dots i:nth-child(3){animation-delay:.44s}
@keyframes wtDot{0%,70%,100%{opacity:0}16%,54%{opacity:1}}
.boot.gone{opacity:0;pointer-events:none}
.boot.gone .boot-say{opacity:0;transition:opacity .22s ease}
.app.revealing{transform:scale(.94);opacity:0}
.app{transform-origin:center center;
  transition:transform .6s cubic-bezier(.16,.84,.30,1), opacity .5s ease-out}
@media (prefers-reduced-motion: reduce){
  .boot-mark,.boot-say,.boot-dots i{animation:none!important}
  .boot-mark{transition:none}
  .boot-dots i{opacity:1}
  .boot,.boot.gone .boot-say{transition:none}
  .app{transition:none}
  .app.revealing{transform:none;opacity:1}
}

.defs{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:10px 20px;margin:0}
.defs dt{font-weight:700;font-size:12.5px;color:var(--ink)}
.defs dd{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
@media(max-width:720px){.defs{grid-template-columns:1fr;gap:3px 0}
  .defs dd{margin-bottom:10px}}
table.mini{width:auto;min-width:280px}
table.mini th{position:static}

.sum td{padding:9px 14px}
.sum .vname{white-space:nowrap;vertical-align:top;font-weight:800;
  background:var(--sunken);border-right:1px solid var(--line);
  letter-spacing:.01em;min-width:118px;font-size:14.5px;color:var(--head)}
.sum .kname{font-weight:700;font-size:13.5px;color:var(--head)}
.sum .kname .cap{font-weight:500;color:var(--ink-3);margin-top:2px}
.sum thead th{font-size:11.5px;font-weight:800;color:var(--head)}
.sum tr.vrow td{border-bottom:1px solid var(--line-soft)}
.sum tr.vtot td{background:var(--sunken);font-weight:700;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sum tr.gtot td{background:var(--ink);color:var(--bg);border:0;font-weight:700}
.sum .na{color:#d6d6d6}
.sum tr.gtot .na{color:rgba(255,255,255,.45)}
.sum .miss{color:var(--ink-3)}
.sum .pill{display:inline-block;margin-left:9px;padding:1px 9px;border-radius:999px;
  border:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--ink-3);
  background:var(--surface);letter-spacing:0;text-transform:none}
.sum tr.gtot .pill{border-color:rgba(255,255,255,.3);color:var(--bg);
  background:transparent}
.sum .sub2{font-size:9.5px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;
  text-transform:none;margin-top:2px}

.filters .f select#pSel{width:100%}
select#pSel.busy{opacity:.55}

.ph.phrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sel.sm{padding:5px 8px;font-size:12px;flex:none}
.pv td{white-space:nowrap}
.pv th{white-space:normal}
.pv .pvkra{font-size:13px;font-weight:800;color:var(--head)}
.pv .pvname{font-size:13px;font-weight:800;color:var(--head)}
.pv .pvkra{text-align:center;border-left:1px solid var(--line);
  font-size:11px;letter-spacing:.02em;line-height:1.3;
  min-width:180px;max-width:230px;padding-bottom:7px}
.pv .pvsub{font-size:10.5px;font-weight:600;color:var(--ink-3);
  letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pv td:nth-child(3n+2){border-left:1px solid var(--line)}
.pv .pvname{position:sticky;left:0;background:var(--surface);z-index:1;
  min-width:168px;max-width:230px;white-space:normal;
  box-shadow:1px 0 0 var(--line)}
.pv thead .pvname{background:var(--raised);z-index:3}
.pv .pvna{color:#cacaca}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9c9c9;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sb{background:#ffffff;border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.sb-brand{display:flex;gap:11px;align-items:center;padding:20px 18px 22px}
.sb-logo{width:32px;height:32px;display:grid;place-items:center;flex:none}
.sb-logo img{max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;display:block}
.sb-name{font-weight:700;letter-spacing:-.2px;line-height:1.15}
.sb-name small{display:block;font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:0}
.sb-nav{padding:0 10px;overflow-y:auto;flex:1}
.sb-g{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:16px 9px 7px}
.sb-i{display:flex;gap:10px;align-items:center;padding:9px 9px;border-radius:var(--r-sm);
  color:var(--ink-2);text-decoration:none;font-weight:500;transition:background .12s,color .12s}
.sb-i:hover{background:#f2f2f2;color:var(--ink)}
.sb-i.on{background:var(--accent-weak);color:var(--ink)}
.sb-i.on{box-shadow:inset 2px 0 0 var(--ink)}
.sb-i.on svg{color:var(--accent)}
.sb-i svg{width:17px;height:17px;flex:none;color:var(--ink-3)}
.sb-foot{padding:12px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;gap:14px;align-items:center;
  padding:13px 26px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-3);
  min-width:0;flex:0 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumbs .cur{color:var(--ink);font-weight:600}
.crumbs .sep{opacity:.45}
.spacer{flex:1}
.search{position:relative;flex:1 1 190px;max-width:330px;min-width:0}
.search input{width:100%;padding:8px 11px 8px 32px;background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:10px;top:9px;width:15px;height:15px;color:var(--ink-3)}
.sr{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--raised);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 36px rgba(0,0,0,.14);
  max-height:340px;overflow:auto;display:none}
.sr.open{display:block}
.sr a{display:block;padding:9px 12px;color:var(--ink-2);text-decoration:none;font-size:13px;
  border-bottom:1px solid var(--line-soft)}
.sr a:last-child{border-bottom:0}
.sr a:hover{background:#f2f2f2;color:var(--ink)}
.sr .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  padding:8px 12px 4px;font-weight:700}
.sel{padding:8px 10px;background:var(--sunken);border:1px solid var(--line);
  border-radius:var(--r-sm);color:var(--ink);flex:none;max-width:200px}
.who{display:flex;gap:9px;align-items:center;padding:6px 10px 6px 7px;background:var(--sunken);
  border:1px solid var(--line);border-radius:999px;flex:none;white-space:nowrap}
.av{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:#ececec;color:#1a1a1a;flex:none;
  border:1px solid #d9d9d9}
.who .n{font-size:12.5px;font-weight:600;line-height:1.15}
.who .r{font-size:10.5px;color:var(--ink-3);line-height:1.15}
.content{padding:24px 26px 60px;max-width:1560px;width:100%}

.hdr{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.hdr h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.4px}
.hdr .sub{color:var(--ink-3);font-size:13px;margin-top:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px 20px}
.panel.flush{padding:0;overflow:hidden}
.panel h3{margin:0 0 3px;font-size:14px;font-weight:650;letter-spacing:-.1px}
.panel .ph{padding:17px 20px 14px;border-bottom:1px solid var(--line-soft)}
.panel .cap{font-size:12px;color:var(--ink-3)}
.row{display:grid;gap:14px}
.r-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.r-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.r-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.r-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.r-21{grid-template-columns:1.45fr 1fr}
.mt{margin-top:14px}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 17px}
.tile.clk{cursor:pointer;transition:border-color .12s ease,background .12s ease}
.tile.clk:hover{border-color:var(--ink-3);background:var(--sunken)}
.tile.clk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .l{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-size:29px;font-weight:750;letter-spacing:-1px;margin-top:7px;line-height:1}
.tile .v.sm{font-size:17px;letter-spacing:-.3px;font-weight:650}
.tile .h{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.tile .h b{color:var(--ink-2);font-weight:600}
.sumline{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;font-size:14px;line-height:1.6}
.sumline b{font-weight:700}
.sumline .dot{margin-right:7px}
.working{font-size:10.5px;color:var(--ink-3);margin-top:3px;line-height:1.5;
  white-space:normal;max-width:260px;text-align:right;margin-left:auto}
button.worklink{display:block;background:transparent;border:0;padding:0;
  font-family:inherit;cursor:pointer;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:2px}
button.worklink:hover{color:var(--ink)}
button.worklink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.calc{font-size:14px;line-height:2.1}
.calc .cl{display:flex;gap:10px;align-items:baseline;
  border-bottom:1px dashed var(--line-soft);padding:5px 0}
.calc .cl span:first-child{color:var(--ink-3);min-width:150px}
.calc .cl b{margin-left:auto;font-variant-numeric:tabular-nums}
.calc .eq{background:var(--sunken);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;margin-top:14px;font-size:14px}
.sbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:13px;margin-top:13px}
.vcard{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column}
.vch{padding:10px 13px;background:var(--sunken);border-bottom:1px solid var(--line)}
.vch h4{margin:0;font-size:15px;font-weight:800;letter-spacing:.01em;
  color:var(--head)}
.vch .cap{margin-top:2px}
.vcard .tw{flex:1}
.vcard table{width:100%}
.vcard .vfoot{padding:9px 13px;border-top:1px solid var(--line);
  background:var(--surface);font-size:12px;font-weight:600}
.mini tfoot tr.vtr td{border-top:1px solid var(--line);background:var(--sunken);
  font-weight:700}
@media(max-width:700px){.sbs{grid-template-columns:1fr}}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;
  margin-right:7px;flex:none}
.tile .l{display:flex;align-items:center}
.dot.ok{background:var(--st-ok)}
.dot.warn{background:var(--st-warn)}
.dot.crit{background:var(--st-crit)}

.meter{height:7px;border-radius:99px;background:#e9e9e9;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter i+i{box-shadow:-2px 0 0 var(--surface)}

.lv{display:flex;gap:2px;align-items:center}
.lv b{width:15px;height:7px;border-radius:2px;background:var(--lvna);display:block}
.lv.r4 b{border-radius:2px}
.lv-t{font-size:11.5px;color:var(--ink-2);margin-left:7px;white-space:nowrap}
.lv-na{font-size:11.5px;color:var(--ink-3);font-style:italic}

.chartbox{height:262px;position:relative;overflow:hidden}
.chartbox.tall{height:300px}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:20px}
.empty .t{font-weight:600;margin-bottom:5px}
.empty .m{font-size:12.5px;color:var(--ink-3);max-width:330px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;font-size:12px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;
  vertical-align:-1px}

.tw{overflow:auto;max-height:none}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;z-index:2;background:var(--raised);text-align:left;
  font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);
  white-space:normal;vertical-align:bottom;line-height:1.3}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .1s}
tbody tr:hover{background:#f7f7f7}
tr.clk{cursor:pointer}
tr.grp td{background:var(--raised);font-size:11px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-2);padding:8px 14px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tr.grp:first-child td{border-top:0}
tr.grp .n{color:var(--ink-3);font-weight:700;letter-spacing:0;text-transform:none}
tbody tr.grp:hover td{background:var(--raised)}
td.act,th.act{position:sticky;right:0;z-index:3;background:var(--surface);
  box-shadow:-9px 0 13px -7px rgba(0,0,0,.12)}
th.act{background:var(--raised);z-index:4}
tbody tr:hover td.act{background:#f7f7f7}
td.act .btn+.btn{margin-left:5px}
td.r,th.r{text-align:right}
@media(max-width:1120px){.opt2{display:none}}
@media(max-width:960px){.opt1{display:none}}
.who2{display:flex;gap:10px;align-items:center;min-width:0}
.who2 .av{width:29px;height:29px;font-size:11px}
.who2 .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who2 .d{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
  font-size:11px;font-weight:600;background:#f1f1f1;color:var(--ink-2);white-space:nowrap}
.tag.b{background:#1a1a1a;color:#ffffff}
.tag.o{background:#949494;color:#ffffff}
.tag.a{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px #c4c4c4}
.tag.g{background:#f1f1f1;color:var(--ink-3)}
.tag svg{width:12px;height:12px}

.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;
  border:1px solid var(--line);background:var(--raised);border-radius:var(--r-sm);
  font-weight:600;font-size:13px;line-height:1;white-space:nowrap;
  transition:background .12s,border-color .12s}
.btn svg{width:15px;height:15px;flex:none}
.btn.sm svg{width:13px;height:13px}
.btn:hover{background:#f4f4f4;border-color:#c9c9c9}
.btn.p{background:var(--accent);border-color:var(--accent);color:#ffffff}
.btn.p:hover{background:#000000;border-color:#000000}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px;margin-bottom:16px}
.f label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.f select,.f input{width:100%;padding:8px 10px;background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--r-sm)}

.note{display:flex;gap:11px;padding:13px 15px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);margin-bottom:16px}
.note svg{width:17px;height:17px;flex:none;margin-top:2px}
.note .t{font-weight:650;margin-bottom:2px}
.note .m{font-size:12.5px;color:var(--ink-2)}
.note.w{border-left:3px solid var(--ink-2);background:rgba(0,0,0,.028)}
.note.w svg{color:var(--ink-2)}
.note.c{border-left:3px solid var(--ink);background:rgba(0,0,0,.05)}
.note.c svg{color:var(--ink)}
.note.i{border-left:3px solid var(--ink-3)}
.note.i svg{color:var(--ink-3)}

.scrim{position:fixed;inset:0;background:rgba(28,28,28,.40);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:14px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.20)}
.modal.wide{width:min(900px,100%)}
.modal.cards{width:min(1320px,100%);max-height:94vh}
.modal.cards .m-b{padding:18px}
.modal.cards .sbs{grid-template-columns:repeat(2,minmax(0,1fr))}
.modal.cards .vcard .tw{overflow:visible}
@media(max-width:900px){.modal.cards .sbs{grid-template-columns:1fr}}
.m-h{display:flex;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.m-h h2{margin:0;font-size:17px;font-weight:680;letter-spacing:-.2px}
.m-h .cap{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.m-b{padding:20px;overflow:auto}
.m-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.x{margin-left:auto;background:transparent;border:0;color:var(--ink-3);padding:4px;border-radius:6px}
.x:hover{background:#f0f0f0;color:var(--ink)}
.x svg{width:18px;height:18px;display:block}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--r-sm)}
.fld .hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.bands{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.bands .b label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;text-align:center}
.bands .b input{width:100%;min-width:0;padding:9px 8px;background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--r-sm);text-align:center}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0;font-weight:550}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;
  background:var(--raised);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 16px;box-shadow:0 14px 36px rgba(0,0,0,.18);font-size:13px;font-weight:550;
  display:flex;gap:9px;align-items:center;max-width:90vw}
.toast svg{width:16px;height:16px;flex:none}
.toast.ok svg{color:var(--good)}
.toast.err{border-color:var(--ink-2);box-shadow:0 14px 36px rgba(0,0,0,.18),
  inset 2px 0 0 var(--ink)}
.toast.err svg{color:var(--crit)}
.sk{background:linear-gradient(90deg,#f2f2f2,#e6e6e6,#f2f2f2);background-size:200% 100%;
  animation:sh 1.3s linear infinite;border-radius:var(--r-sm)}
@keyframes sh{to{background-position:-200% 0}}
.hide{display:none!important}
.uat{display:flex;gap:10px;align-items:center;padding:9px 26px;background:var(--ink);
  color:var(--bg);font-size:12.5px;font-weight:600;position:sticky;top:0;z-index:29}
.uat svg{width:15px;height:15px;flex:none}
.uat b{font-weight:800}
@media(max-width:900px){.uat{padding:8px 14px;font-size:12px}}

@media(max-width:1200px){.crumbs{display:none}}
@media(max-width:1180px){.r-5,.r-4{grid-template-columns:repeat(3,minmax(0,1fr))}
  .r-21,.r-2{grid-template-columns:1fr}}
@media(max-width:940px){.who .n,.who .r{display:none}.who{padding:5px}}
@media(max-width:900px){
  .app{grid-template-columns:64px 1fr}
  .sb-name,.sb-g,.sb-i span,.sb-foot{display:none}
  .sb-i{justify-content:center;padding:11px 0}
  .sb-brand{padding:18px 0;justify-content:center}
  .content{padding:18px 14px 50px}.top{padding:11px 14px}
  .r-5,.r-4,.r-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:1fr 1fr}
  .search{width:auto;flex:1}
}
@media(max-width:600px){
  .r-5,.r-4,.r-3,.filters,.bands{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function write(fn,payload,okMsg){

function index(){

function fmtTarget(v,unit,exact){
  if(v===null||v===undefined||v==='') return '';
  var x=Number(v);
  if(!isFinite(x)) return '';
  var u=String(unit||'').toLowerCase();
  if(u==='cr') return (Math.round(x*100)/100).toFixed(2)+' Cr';
  if(u==='days'||u==='day') return String(Math.round(x))+'\u2009days';
  if(u==='ratio') return String(Math.round(x*1000)/10)+'%';
  if(u==='count'||u===''){
    return exact?String(Math.round(x*100)/100):String(Math.round(x));
  }
  return String(Math.round(x))+'\u2009'+unit;
}
function ratioLadder(r){
  var v=(r||{}).values;
  if(!v||v.length!==5) return null;
  for(var i=0;i<5;i++){
    if(typeof v[i]!=='number'||!isFinite(v[i])) return null;
    if(i&&v[i]<v[i-1]) return null;
  }
  return v[4]<=2?v:null;
}
// Display only: ratio rungs shown in crore, sellers or days. Nothing is written back.
function ladderInUnits(r){
  var v=ratioLadder(r), t=(r||{}).plan_target;
  if(v&&String((r||{}).plan_unit||'')==='ratio'){
    return v.map(function(x){ return fmtTarget(x,'ratio'); });
  }
  if(!v||t===null||t===undefined||!isFinite(Number(t))||Number(t)===0) return null;
  return v.map(function(x){ return fmtTarget(Number(t)*x,(r||{}).plan_unit,true); });

  var k=normKpiName(kraName), nm=normKpiName(kpiName);
  if(!nm) return '';

    if(key&&!seen[key]){ seen[key]=1; n++; }

  var atTgt=pctRows.filter(function(r){ return pctOfTarget(r)>=100-EPS; });
  var rated=tr.filter(function(r){
    return r.level!==null&&r.level!==undefined&&r.level!==''; });
  var gap=list.filter(function(r){
    return r.level===null||r.level===undefined||r.level===''; });

  function band(lo,hi){
    return scored.filter(function(x){
      var v=Number(x.o.score);
      return v>=lo-EPS&&(hi===null||v<hi-EPS); });
  }
  var ok=band(4,null), warn=band(3,4), crit=band(0,3);

  var keep={}; people.forEach(function(e){ keep[e.id]=1; });
  var depts=[];
  ((S.model||{}).teams||[]).forEach(function(t){
    var ss=(M.byTeam[t.id]||[]).filter(function(e){ return keep[e.id]; })
      .map(function(e){ return { e:e, o:M.overalls[e.id]||{} }; })
      .filter(function(x){ return x.o.score!==null&&x.o.score!==undefined; });
    if(!ss.length) return;
    depts.push({ t:t, avg:mean(ss,function(x){ return x.o.score; }), n:ss.length });
  });
  depts.sort(function(a,b){ return b.avg-a.avg; });

  var top=scored.slice().sort(function(a,b){ return b.o.score-a.o.score; })[0]||null;
  return { people:people, list:list, st:st, all:all, scored:scored, unscored:unscored,
           avgLvl:avgLvl, tr:tr, withAch:withAch, noAch:noAch, pctRows:pctRows,

function verticalSummary(){
  var rows=targetedRows();
  if(!rows.length) return '';
  var byV={}, order=[];
  rows.forEach(function(r){
    var e=M.emps[r.employee_id]; if(!e) return;
    var v=String(e.team_id);
    if(!byV[v]){ byV[v]={kra:{},people:{}}; order.push(v); }
    byV[v].people[e.id]=1;
    var k=byV[v].kra[r.kra_id]||(byV[v].kra[r.kra_id]=
      {ts:[],as:[],unit:'',dir:'',agg:'',pagg:''});
    if(r.plan_target!==null&&r.plan_target!==undefined) k.ts.push(Number(r.plan_target));
    if(r.actual!==null&&r.actual!==undefined) k.as.push(Number(r.actual));
    k.unit=r.plan_unit||k.unit;
    k.dir=r.direction||k.dir;
    k.agg=r.agg_kind||k.agg;
    k.pagg=r.plan_agg||k.pagg;
  });
  function meansAcrossPocs(k){
    if(k.agg==='mean'||k.pagg==='mean') return true;
    var u=String(k.unit||'').toLowerCase();
    return u==='days'||u==='day'||u==='%';
  }
  function reduce_(arr,mean){
    if(!arr.length) return null;
    var sum=arr.reduce(function(a,b){ return a+b; },0);
    return mean?sum/arr.length:sum;
  }
  Object.keys(byV).forEach(function(v){
    var g=byV[v];
    Object.keys(g.kra).forEach(function(kid){
      var k=g.kra[kid], mean=meansAcrossPocs(k);
      k.mean=mean;
      k.n=Math.max(k.ts.length,k.as.length);
      k.t=reduce_(k.ts,mean);
      k.a=reduce_(k.as,mean);
    });
  });
  order.sort(function(a,b){
    var ra=verticalRank(a), rb=verticalRank(b);
    if(ra!==rb) return ra-rb;
    return String(teamLabel(M.teams[a])).localeCompare(String(teamLabel(M.teams[b]))); });

  var gMet=0,gN=0,gPeople={},gKra=0;
  var body='';
  order.forEach(function(v){
    var g=byV[v], kids=Object.keys(g.kra).sort(function(a,b){
      return String((M.kras[a]||{}).name||'').localeCompare(String((M.kras[b]||{}).name||'')); });
    var met=0,cnt=0;
    kids.forEach(function(kid,i){
      var c=g.kra[kid], p=achievedPct(c);
      if(p!==null){ cnt++; if(p>=100) met++; }
      body+='<tr class="vrow">'+
        (i===0?'<td class="vname" rowspan="'+kids.length+'">'+
          h(teamLabel(M.teams[v]))+'</td>':'')+
        '<td class="kname">'+h((M.kras[kid]||{}).name||kid)+
          (c.n>1?'<div class="cap">'+(c.mean?'mean of ':'total of ')+c.n+
            ' POCs</div>':'')+'</td>'+
        '<td class="r num">'+(c.t===null?'<span class="lv-na">—</span>'
          :h(fmtTarget(c.t,c.unit)))+'</td>'+
        '<td class="r num">'+(c.a===null?'<span class="lv-na">—</span>'
          :h(fmtTarget(c.a,c.unit)))+'</td>'+
        '<td class="r num">'+(p===null?'<span class="lv-na">—</span>'
          :(p>=100?'<b>':'<span class="miss">')+pc(p)+(p>=100?'</b>':'</span>'))+
        '</td></tr>';
    });
    gMet+=met; gN+=cnt; gKra+=kids.length;
    Object.keys(g.people).forEach(function(id){ gPeople[id]=1; });
    body+='<tr class="vtot"><td colspan="2">'+h(teamLabel(M.teams[v]))+' total'+
      '<span class="pill">'+Object.keys(g.people).length+' POCs · '+kids.length+' KRAs</span></td>'+
      '<td class="r na">·</td><td class="r na">·</td>'+
      '<td class="r num">'+(cnt?met+' / '+cnt:'—')+'</td></tr>';
  });
  body+='<tr class="gtot"><td colspan="2">Grand total'+
    '<span class="pill">'+Object.keys(gPeople).length+' POCs · '+gKra+' KRAs</span></td>'+
    '<td class="r na">·</td><td class="r na">·</td>'+
    '<td class="r num">'+(gN?gMet+' / '+gN:'—')+'</td></tr>';
  return '<div class="tw"><table class="sum"><thead><tr>'+
    '<th>Vertical</th><th>KRA</th><th class="r">Target</th>'+
    '<th class="r">Achieved</th><th class="r">Achieved %<div class="sub2">'+
    'totals: KRAs met</div></th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div>';
}

  if(!p) return '';

function stats(list){

          weight:0,measured:0,nonMono:0};
  list.forEach(function(r){
    st.weight+=r.weightage||0;
    var defined=(r.bands||[]).filter(function(b){ return String(b||'').trim()!==''; }).length;
    if(!defined) st.kinds.none++; else st.kinds[r.kind]=(st.kinds[r.kind]||0)+1;
    if(r.band_note&&/not monotonic/i.test(r.band_note)) st.nonMono++;
    if(r.level!==null&&r.level!==undefined&&r.level!==''){
      st.scored++; st.measured+=r.weightage||0;
      st.levels[Math.max(0,Math.min(5,Math.round(Number(r.level))))]++;

    if(!defined){ out.push({sev:'w',emp:e,row:r,what:'No ladder defined',
      why:'Target 1 to 5 are all empty, so no level can ever be resolved for this KPI.'}); return; }
    if(r.kind==='numeric'&&r.direction==='lower_is_better'&&
       /\b(recovered|recovery|collection|collections|gmv|revenue|achieved|achievement|acquisition|conversion|closure|completed|accuracy)\b/i.test(r.kpi)){
      out.push({sev:'c',emp:e,row:r,what:'Rating scale rewards a lower number',
        why:'Target 1 is '+h(r.bands[0])+' and Target 5 is '+h(r.bands[4])+
            ', so a smaller result scores higher — although the KPI reads as something to increase.'});
    }
    if(r.kind==='numeric'&&r.band_note&&/not monotonic/i.test(r.band_note)){
      out.push({sev:'c',emp:e,row:r,what:'Rating scale is not monotonic',
        why:'Target 1 to 5 do not move in one direction, so the level cannot be resolved reliably.'});
    }
    if(r.kind==='qualitative'){ out.push({sev:'w',emp:e,row:r,what:'Awarded by hand',
      why:'No numeric ladder — someone has to award the level for this KPI.'}); }
  });
  var order={c:0,w:1};
  return out.sort(function(a,b){ return order[a.sev]-order[b.sev]; });
}
function weightWarnings(){
  var out=[];
  Object.keys(M.overalls).forEach(function(id){
    var w=M.overalls[id].assigned_weightage;
    if(Math.abs(w-100)>0.5&&M.emps[id]) out.push({emp:M.emps[id],w:w});
  });
  return out;
}

function mkChart(id,cfg){
  var el=document.getElementById(id); if(!el||!window.Chart) return;
  if(CH[id]){ try{CH[id].destroy();}catch(e){} }

function monthlyHitRate(rows){
  var span=((S.model||{}).ytd_periods)||[];
  return span.map(function(pid){
    var n=0,hit=0;
    rows.forEach(function(r){
      var m=(r.monthly||{})[pid]; if(!m) return;
      var t=m.target, a=m.actual;
      if(t===null||t===undefined||a===null||a===undefined||!t) return;
      n++;
      if(r.direction==='lower_is_better'? a<=t : a>=t) hit++;
    });
    return {period:pid,n:n,hit:hit,pct:n?hit/n*100:null};
  });
}
function chartMonthly(id,rows){
  var pts=monthlyHitRate(rows);
  var o=baseOpts();
  o.scales.y.min=0; o.scales.y.max=100;
  o.scales.y.ticks.callback=function(v){ return v+'%'; };
  o.plugins.tooltip.callbacks={label:function(c){
    var p=pts[c.dataIndex];
    return p.n? p.hit+' of '+p.n+' targeted KPIs met target'
              : 'nothing recorded'; }};
  mkChart(id,{type:'bar',data:{
    labels:pts.map(function(p){
      var per=((S.model||{}).periods||[]).filter(function(x){
        return String(x.id)===String(p.period); })[0];
      return per?periodLabel(per):p.period; }),
    datasets:[{data:pts.map(function(p){ return p.pct; }),
      backgroundColor:tok('--accent'),borderRadius:4,borderSkipped:'bottom',
      maxBarThickness:46}]},options:o});
}
function chartTeams(id,mode){
  var m=S.model||{}, labels=[], vals=[];
  var keep={}; filteredEmployees().forEach(function(e){ keep[e.id]=1; });
  (m.teams||[]).forEach(function(t){
    var people=(M.byTeam[t.id]||[]).filter(function(e){ return keep[e.id]; });
    if(!people.length) return;
    labels.push(teamLabel(t));
    if(mode==='kpis'){
      var rs=[]; people.forEach(function(e){ rs=rs.concat(M.byEmp[e.id]||[]); });
      vals.push(distinctKpiCountIn(rs));
    } else {
      var acc=0,c=0;
      people.forEach(function(e){ var o=M.overalls[e.id];
        if(o&&o.score!==null&&o.score!==undefined){ acc+=o.score; c++; } });
      vals.push(c?Math.round(acc/c*10)/10:0);
    }
  });
  var o=baseOpts();
  o.indexAxis='y';
  o.scales.x.grid={color:tok('--line-soft')};
  o.scales.y.grid={display:false};
  if(mode!=='kpis'){ o.scales.x.min=0; o.scales.x.max=5; o.scales.x.ticks.stepSize=1; }
  o.plugins.tooltip.callbacks={label:function(c){
    return mode==='kpis'? c.parsed.x+(c.parsed.x===1?' KPI':' KPIs')
                        : 'average level '+f1(c.parsed.x)+' of 5'; }};
  mkChart(id,{type:'bar',data:{labels:labels,datasets:[{data:vals,
    backgroundColor:tok('--accent'),borderRadius:4,borderSkipped:'start',
    maxBarThickness:24}]},options:o});
}

    tile('KPIs',String(rs.length),'<b>'+(o.scored_count||0)+'</b> scored')+
    tile('Weightage',f1(o.assigned_weightage)+'%',
      Math.abs((o.assigned_weightage||0)-100)>0.5?
        '<b style="color:var(--warn)">does not total 100%</b>':'totals 100% as required')+
    tile('Measured',pc((o.measured_weightage||0)/(o.assigned_weightage||1)*100),
      '<b>'+(o.scored_count||0)+'</b> of '+rs.length+' KPIs have an actual')+
    tile('Level',levelMeter(o.level===undefined?null:o.level),'',true)+
    '</div>';

  var byKra={};
  rs.forEach(function(r){ (byKra[r.kra_id]=byKra[r.kra_id]||[]).push(r); });
  var kraBody='';
  Object.keys(byKra).forEach(function(kid){
    var kra=M.kras[kid]||{}, list=byKra[kid];
    var w=list.reduce(function(a,r){ return a+(r.weightage||0); },0);

    kraBody+='<tr><td><div style="font-weight:600">'+h(kra.name||'—')+'</div>'+
      '<div style="font-size:11.5px;color:var(--ink-3)">'+h(kra.perspective||'')+'</div></td>'+
      '<td class="num">'+list.length+'</td><td class="r num">'+f1(w)+'%</td>'+
      '<td>'+(lvl===null||lvl===undefined?levelMeter(null):
        levelMeter(Math.round(lvl),f1(lvl)))+'</td></tr>';
  });

  out+='<div class="row r-21 mt">'+
    panel({flush:true,title:'KRA rollups',cap:'Weighted mean renormalised within each KRA',
      body:'<div class="tw"><table><thead><tr><th>KRA</th><th>KPIs</th>'+
        '<th class="r">Weight</th><th>Level</th></tr></thead><tbody>'+kraBody+
        '</tbody></table></div>'})+
    panel({title:'Rating scale mix',cap:'How this scorecard can be scored',
      body:'<div class="meter" style="height:11px">'+
        [['numeric','--cat1'],['ordinal','--cat2'],['qualitative','--cat3'],
         ['none','--cat-rest']].map(function(s){
          var v=st.kinds[s[0]]||0; if(!v) return '';
          return '<i style="width:'+(v/(st.n||1)*100)+'%;background:var('+s[1]+')"></i>'; }).join('')+
        '</div><div class="legend">'+
        [['numeric','Numeric','--cat1'],['ordinal','Ordinal','--cat2'],
         ['qualitative','Qualitative','--cat3'],['none','No ladder','--cat-rest']]
          .filter(function(s){ return (st.kinds[s[0]]||0)>0; })
          .map(function(s){ return '<span><i style="background:var('+s[2]+')"></i>'+
            h(s[1])+' <b class="num" style="color:var(--ink)">'+st.kinds[s[0]]+'</b></span>'; })
          .join('')+'</div>'})+
    '</div>';

  var body='<table><thead><tr><th>KPI</th><th class="opt1">KRA</th>'+
    '<th class="r">Weight</th><th>Target ratings</th><th class="r">Target</th>'+
    '<th class="r">Actual</th><th>Level</th>'+
    '<th class="r act">Actions</th></tr></thead><tbody>';
  rs.forEach(function(r){
    var kra=M.kras[r.kra_id]||{};
    var inUnits=ladderInUnits(r);
    var bands=(inUnits||(r.bands||[]).map(function(b){ return String(b||'').trim(); }))
      .filter(Boolean).map(h).join('&nbsp; · &nbsp;');
    if(inUnits) bands+='<div style="margin-top:3px;color:var(--ink-3)">'+
      (r.bands||[]).map(function(b){ return String(b||'').trim(); })
        .filter(Boolean).map(h).join('&nbsp; · &nbsp;')+'&nbsp; of target</div>';
    body+='<tr>'+
      '<td style="min-width:196px"><div style="font-weight:600">'+h(r.kpi)+'</div>'+
        (r.unit?'<div style="font-size:11.5px;color:var(--ink-3)">'+h(r.unit)+'</div>':'')+'</td>'+
      '<td class="opt1" style="max-width:200px"><div style="font-size:12.5px">'+
        h(kra.name||'—')+'</div></td>'+
      '<td class="r num">'+f1(r.weightage)+'%</td>'+
      '<td style="min-width:210px;max-width:330px">'+kindTag(r.kind)+
        (bands?'<div class="cap" style="margin-top:5px;line-height:1.45">'+bands+'</div>':'')+
        (r.band_note?'<div style="font-size:11.5px;color:var(--warn);margin-top:4px">'+
          h(r.band_note)+'</div>':'')+'</td>'+
      '<td class="r num">'+targetCell(r)+'</td>'+
      '<td class="r num">'+achievedCell(r)+'</td>'+
      '<td>'+levelMeter(r.level===undefined?null:r.level)+'</td>'+
      '<td class="r act" style="white-space:nowrap">'+
        (mayActual(e.id)?'<button class="btn sm" data-actual="'+h(e.id)+'|'+h(r.kpi_id)+
          '">Actual</button> ':'')+
        (mayTargets(e.id)?'<button class="btn sm" data-targets="'+h(e.id)+'|'+h(r.kpi_id)+
          '">Bands</button> ':'')+
        (mayFramework(e.id)?'<button class="btn sm" data-assign="'+h(r.assignment_id)+':'+
          h(e.id)+'">Edit</button>':'')+
      '</td></tr>';
  });
  out+='<div class="mt">'+panel({flush:true,title:'Scorecard',
    cap:rs.length+' individually weighted KPIs · '+h(periodName(S.period)),
    body:'<div class="tw">'+body+'</tbody></table></div>'})+'</div>';
  return out;
};

V.review=function(){
  var fl=flags(), ww=weightWarnings();
  var crit=fl.filter(function(f){ return f.sev==='c'; });
  var warn=fl.filter(function(f){ return f.sev==='w'; });
  var out='<div class="hdr"><div><h1>Structure review</h1><div class="sub">'+
    'Open data decisions that change how people are rated</div></div></div>';
  out+=periodBar();

  out+='<div class="row r-3">'+
    tile('Need a decision',String(crit.length),'ladders that contradict the KPI')+
    tile('Awarded by hand',String(warn.length),'no measurable ladder')+
    tile('Weightage off 100%',String(ww.length),'scorecards that do not total')+
    '</div>';

  if(!fl.length&&!ww.length){
    out+='<div class="mt">'+panel({body:emptyBox('Nothing to review',
      'Every ladder resolves in one direction and every scorecard totals 100%.')})+'</div>';
    return out;
  }
  function flagRows(arr){
    if(!arr.length) return '';
    var b='<table><thead><tr><th>Person</th><th>KPI</th><th>Issue</th>'+
      '<th>Target 1 → 5</th></tr></thead><tbody>';
    arr.forEach(function(f){
      b+='<tr class="clk" data-go="emp/'+h(f.emp.id)+'">'+
        '<td>'+person(f.emp)+'</td>'+
        '<td style="max-width:220px"><div style="font-weight:600;font-size:12.5px">'+
          h(f.row.kpi)+'</div><div style="font-size:11.5px;color:var(--ink-3)">'+
          f1(f.row.weightage)+'% of the scorecard</div></td>'+
        '<td style="max-width:400px"><div style="display:flex;gap:7px">'+
          svg(f.sev==='c'?'warn':'info')+
          '<div><div style="font-weight:600;font-size:12.5px;color:'+
          (f.sev==='c'?'var(--crit)':'var(--warn)')+'">'+h(f.what)+'</div>'+
          '<div style="font-size:12px;color:var(--ink-2);margin-top:2px">'+f.why+
          '</div></div></div></td>'+
        '<td style="max-width:300px"><div style="display:flex;gap:4px;flex-wrap:wrap">'+
          (f.row.bands||[]).map(function(x){ return String(x||'').trim()?
            '<span class="tag g">'+h(x)+'</span>':''; }).filter(Boolean).join('')+
          '</div></td></tr>';
    });
    return b+'</tbody></table>';
  }
  if(crit.length) out+='<div class="mt">'+panel({flush:true,
    title:'Needs a decision from the KRA owner',
    cap:'Reverse the bands if the direction is unintended — these change ratings',
    body:'<div class="tw">'+flagRows(crit)+'</div>'})+'</div>';
  if(warn.length) out+='<div class="mt">'+panel({flush:true,
    title:'Must be awarded by hand',
    cap:'No numeric ladder, so no actual can resolve a level',
    body:'<div class="tw">'+flagRows(warn)+'</div>'})+'</div>';
  if(ww.length){
    var b='<table><thead><tr><th>Person</th><th class="r">Assigned weightage</th>'+
      '<th>Gap</th></tr></thead><tbody>';
    ww.forEach(function(x){
      b+='<tr class="clk" data-go="emp/'+h(x.emp.id)+'"><td>'+person(x.emp)+'</td>'+
        '<td class="r num">'+f1(x.w)+'%</td><td class="num" style="color:var(--warn)">'+
        (x.w>100?'+':'')+f1(x.w-100)+'%</td></tr>';
    });
    out+='<div class="mt">'+panel({flush:true,title:'Weightage does not total 100%',
      cap:'Per-KPI weightage is normalised per person on import, so a gap means the source changed',
      body:'<div class="tw">'+b+'</tbody></table></div>'})+'</div>';
  }
  return out;
};

V.method=function(){
  var out='<div class="hdr"><div><h1>How it is calculated</h1><div class="sub">'+
    'Every card, column and rating on the Overview, and the arithmetic behind it'+
    '</div></div></div>';

  out+=note('i','The one distinction everything else rests on',
    'A <b>target rating</b> is not a <b>target</b>. The five rungs (Target 1 to 5) are '+
    'the bar for each rating. The target is a single number — 9 sellers, 6.50 Cr — and '+
    'on most KPIs here the rating comes from <b>achieved divided by target</b>, so the '+
    'target is the denominator, not a rung.');

  out+='<div class="mt">'+panel({title:'Assignments, KRAs and KPIs',
    cap:'Three counts of the same framework, and why they differ',
    body:dl([
      ['KPIs <span class="cap">(the number on the card)</span>',
       'How many <b>different things are measured</b>, counted once however many '+
       'people hold them. All six Metal POCs carry the same seven KPIs, and that '+
       'is seven — not forty-two. Names are matched ignoring case, punctuation '+
       'and stray spacing, so <b>TAT ( 3 Days)</b> and <b>TAT ( 3 Days )</b> are '+
       'one KPI rather than two.'],
      ['What counts as the same KPI',
       'The <b>KRA and the name together</b>, never the name alone. '+
       '<b>Monthly Target Achievement (%)</b> is the KPI name for GMV, for New '+
       'Buyer Acquisition and for New Seller Acquisition — three different '+
       'targets with three different weightages, so they count as three. Folding '+
       'on the name alone would report Metal as having 5 KPIs when it has 7.'],
      ['KPI assignments <span class="cap">(beneath it)</span>',
       'One per <b>person and KPI</b>. The same KPI held by four people is four '+
       'assignments, because each carries its own target, its own weightage and '+
       'its own rating. This is the number every rollup divides by, and it is '+
       'why the two counts are both worth showing.'],
      ['KRAs',
       'The result areas those KPIs sit under. A KPI name can appear under '+
       'several — <b>Monthly Target Achievement (%)</b> is the KPI for GMV, for '+
       'New Buyer Acquisition and for New Seller Acquisition alike — so the two '+
       'counts do not line up, and should not.']
    ])})+'</div>';

  out+='<div class="mt">'+panel({title:'Row 1 — Executive summary',
    cap:'Counted over whatever the filters currently show',
    body:dl([
      ['Employees',
       'How many people the filters currently describe. Where some have no '+
       'rating yet, the line beneath splits them — <b>scored</b> against '+
       '<b>awaiting actuals</b> — because the three health bands below can only '+
       'band somebody who has a score.'],
      ['Avg performance',
       'The mean overall level across scored people, shown as a percentage of '+
       '5. A level of 3.9 reads as 78%. It is a mean of <b>people</b>, not of '+
       'KPIs: each scorecard is already a weighted mean of its own KPIs, so '+
       'counting KPIs again here would weight a seven-KPI scorecard above a '+
       'five-KPI one.'],
      ['Target achievement',
       'The average of <b>achieved &divide; target</b> across every KPI that has '+
       'both. 100% means on target. KPIs on an <b>absolute</b> ladder — DSO in '+
       'days, PDD in crore — are left out rather than counted as zero, because '+
       'they are scored on the raw figure and have no percentage to average. '+
       'The line beneath says how many reached 100%.'],
      ['KPI completion',
       'Of the KPIs that have a target, how many also have an achieved value. '+
       'This measures <b>how much has been entered</b>, not how well anybody '+
       'did. Not every KPI has a target at all — the Target Sheet covers Metals '+
       'and Plastics only, so Collections, Onboarding and Control Tower have '+
       'none, and those are outside this figure entirely.'],
      ['Top performer',
       'The highest overall level among scored people. Ties are broken '+
       'arbitrarily, so read it as <b>one of</b> the highest rather than a '+
       'ranking.']
    ])})+'</div>';

  out+='<div class="mt">'+panel({title:'Row 2 — Performance health',
    cap:'The three bands are cut on the rating scale, not on round numbers',
    body:dl([
      ['<i class="dot ok"></i> On track',
       'Overall level <b>4 or above</b> — at or above target. This is the same '+
       'rung as the Target Sheet figure itself, which is what makes the band '+
       'mean something rather than being a threshold somebody picked.'],
      ['<i class="dot warn"></i> Needs attention',
       'Level <b>3 up to just under 4</b> — reached 90% of target but not '+
       'target.'],
      ['<i class="dot crit"></i> Critical',
       'Level <b>below 3</b> — short of 90% of target.'],
      ['Why the three may not add up to Employees',
       'Only somebody with a score can be banded. People with no actual '+
       'recorded are counted on the Employees card instead, and are '+
       '<b>deliberately not</b> filed under Critical — nothing recorded is not '+
       'the same as doing badly.'],
      ['KPI gap',
       'Assignments carrying <b>no rating at all</b>. Four different things '+
       'cause it — no target, no achieved value, no ladder, or a ladder that '+
       'cannot be applied — and they are told apart in <b>Structure '+
       'review</b>. The line beneath gives the narrower figure: how many of '+
       'the KPIs that DO have a target came out rated.'],
      ['Top department',
       'The department with the highest mean level among its scored people. '+
       'The count beneath is how many scorecards that mean rests on — <b>read '+
       'it before reading the rank</b>, since a department with one scored '+
       'person can top a department with fourteen.']
    ])})+'</div>';

  out+='<div class="mt">'+panel({title:'The rating scale',
    cap:'The Target Sheet figure is Target 4 · hitting it is a 4 of 5',
    body:'<table class="mini"><thead><tr><th>Achieved as % of target</th>'+
      '<th class="r">Rating</th></tr></thead><tbody>'+
      RATING_SCALE_UI.map(function(r){
        return '<tr><td>'+r[0]+'</td><td class="r num"><b>'+r[1]+'</b></td></tr>';
      }).join('')+'</tbody></table>'+
      '<div class="cap" style="margin-top:12px">A rating is earned only when its '+
      'threshold is fully reached. 98% of target clears 90% but not 100%, so it '+
      'rates <b>3</b> — the nearer number does not round up. '+
      'Below 60% rates 0.<br><br>'+
      '<b>The rungs are percentages of the figure in the Target Sheet.</b> A GMV '+
      'target of 6.50 Cr is Target 4, so Target 3 is 90% of it — 5.85 Cr — and '+
      'Target 5 is 105%, 6.83 Cr. Every ladder on this page is shown in its own '+
      'units for that reason.<br><br>'+
      'This applies to KPIs scored as a percentage of target. KPIs with their own '+
      'absolute scale — DSO in days, PDD in crore — keep it and are compared '+
      'directly, so for those <b>hitting target is not necessarily a 4</b>.'+
      '</div>'})+'</div>';

  out+='<div class="mt">'+panel({title:'Achieved %',
    cap:'100% always means on target',
    body:dl([
      ['More is better','achieved &divide; target. 7.15 Cr against 6.50 Cr is 110%.'],
      ['Less is better',
       '<b>target &divide; achieved</b>, inverted on purpose. A DSO of 4 days '+
       'against a 3-day target is a miss; read the other way round it would '+
       'show as 133% and look like an overachievement. Inverted it reads 75%, '+
       'so every percentage on the page can be read the same way.'],
      ['Blank','No target, a target of zero, or nothing achieved. 5 against a '+
       'target of 0 is not 500% — it is a target nobody set.']
    ])})+'</div>';

  out+='<div class="mt">'+panel({title:'Year to date',
    cap:'The default view · read only',
    body:dl([
      ['The year\'s rating',
       'Where a KPI has a numeric target, the months are added up and compared '+
       '<b>once</b> — the year\'s achieved against the year\'s target. That is '+
       'not the same as averaging the monthly ratings, and it is the fairer of '+
       'the two: an average lets a month with a target of 1 count as much as a '+
       'month with a target of 40.'],
      ['Counts and amounts',
       '<b>Summed</b> across the months. 9 + 6 + 4 sellers is a target of 19.'],
      ['Rates and durations',
       '<b>Averaged</b>, because five months of 20-day DSO is not 100 days. '+
       'Each row says which it did.'],
      ['Months with nothing recorded',
       'Left out rather than counted as zero, so a scorecard measured in one '+
       'month of five reads the same as one measured in all five. <b>Check the '+
       'month count before reading a thin year as a bad one.</b>'],
      ['KPIs with no numeric target',
       'Keep the mean of their monthly ratings — there is no year-level '+
       'quotient to compute.']
    ])})+'</div>';

  out+='<div class="mt">'+panel({title:'The summary table',
    cap:'Why its totals count KRAs instead of adding the columns',
    body:'<div class="cap">A KRA row adds up across the people who hold it, '+
      'which is sound: every POC\'s GMV target is in crore, every POC\'s seller '+
      'target is a count. Same KRA, same unit.<br><br>'+
      'A <b>vertical total cannot add those rows together</b>. 15.61 crore of GMV '+
      'plus 19 sellers plus 3 days of DSO is not 37.61 of anything. So the total '+
      'rows report what genuinely is countable — <b>how many KRAs met their '+
      'target</b> — and the two quantity columns are deliberately left blank '+
      'rather than filled with a confident number that means nothing.</div>'})+'</div>';

  out+='<div class="mt">'+panel({title:'When a cell is blank',
    cap:'Four different causes that look identical on screen',
    body:dl([
      ['&middot; (a faint dot)','That person does not hold that KRA at all.'],
      ['&mdash; in Target','No target was typed in the Target Sheet for that month.'],
      ['&mdash; in Achieved','The Achievement column is empty for that month.'],
      ['A value, but no rating',
       'An achieved value with no target for that month cannot be rated — '+
       'there is nothing to be a percentage of. It is shown but deliberately '+
       'left unrated rather than scored as though the target had been met.']
    ])})+'</div>';

  out+='<div class="mt">'+panel({title:'Where the numbers come from',
    body:dl([
      ['Who holds which KRA, and the five rungs','The KRA / KPI workbook.'],
      ['Targets and achieved values','The Target Sheet — its Metals and Plastics '+
       'tabs, typed by hand. Nothing is written back to either workbook.'],
      ['Anything missing','Almost always a blank column in the Target Sheet '+
       'rather than a fault here. An administrator can confirm which, per '+
       'person, from the diagnostics.']
    ])})+'</div>';
  return out;
};

    '</div>';
  var a=(m.audit||[]);
  var body=a.length?'<table><thead><tr><th>When</th><th>Actor</th><th>Action</th>'+
    '<th>Entity</th><th>Detail</th></tr></thead><tbody>'+a.map(function(x){
      return '<tr><td class="num" style="white-space:nowrap;color:var(--ink-3)">'+
        h(String(x.ts).slice(0,16).replace('T',' '))+'</td>'+
        '<td>'+h(x.actor)+'</td><td><span class="tag g">'+h(x.action)+'</span></td>'+
        '<td style="font-size:12px;color:var(--ink-2)">'+h(x.entity_type)+'</td>'+
        '<td style="max-width:420px;font-size:12px;color:var(--ink-3);overflow:hidden;'+
        'text-overflow:ellipsis;white-space:nowrap">'+h(x.reason||x.new_value||'')+'</td></tr>';
    }).join('')+'</tbody></table>':emptyBox('No changes recorded',
      'Every edit to a band, a weightage or an actual is appended here.');
  out+='<div class="mt">'+panel({flush:true,title:'Audit trail',
    cap:'Most recent '+a.length+' entries',body:'<div class="tw">'+body+'</div>'})+'</div>';
  return out;
};

function modalWorking(empId,kpiId,month){
  var r=findRow(empId,kpiId), e=M.emps[empId];
  if(!r||!e) return;
  var note=noteFor(r,month);
  if(!note) return;
  var parts=String(note).split(' · ');
  var src=parts[0]||'', formula='', ships='';
  parts.slice(1).forEach(function(p){
    if(/shipment/.test(p)) ships=p; else if(!formula) formula=p;
  });
  var m=formula.match(/receivable\s+(.+?)\s+÷\s+GMV\s+(.+?)\s+×\s+(\d+)\s+days\s+=\s+(.+)$/);
  var rows='';
  if(m){
    rows=
      '<div class="cl"><span>Receivable outstanding</span><b>'+h(m[1])+'</b></div>'+
      '<div class="cl"><span>GMV for the month</span><b>'+h(m[2])+'</b></div>'+
      '<div class="cl"><span>Days in the period</span><b>'+h(m[3])+'</b></div>'+
      (ships?'<div class="cl"><span>Shipments counted</span><b>'+
        h(ships.replace(/\s*shipments?$/,''))+'</b></div>':'')+
      '<div class="eq"><b>'+h(m[1])+'</b> &divide; <b>'+h(m[2])+'</b> &times; <b>'+
      h(m[3])+' days</b> = <b>'+h(m[4])+'</b></div>';
  } else {
    rows='<div class="eq">'+h(note)+'</div>';
  }
  var lad=(r.bands||[]).map(function(b,i){
    return String(b||'').trim()
      ?'<div class="cl"><span>Target '+(i+1)+'</span><b>'+h(b)+
        (r.plan_unit?'\u2009'+h(r.plan_unit):'')+'</b></div>':''; }).join('');
  var body='<div class="calc">'+rows+'</div>'+
    '<div class="cap" style="margin:18px 0 6px"><b style="color:var(--ink)">'+
    'What it was rated against</b></div>'+
    '<div class="calc">'+lad+
    '<div class="cl"><span>Target set</span><b>'+
    (r.plan_target===null||r.plan_target===undefined?'—'
      :h(fmtTarget(r.plan_target,r.plan_unit)))+'</b></div>'+
    '<div class="cl"><span>Rating earned</span><b>'+
    (r.level===null||r.level===undefined||r.level===''?'—':'Target '+f1(r.level))+
    '</b></div></div>'+
    '<div class="cap" style="margin-top:16px">Lower is better on this KPI, so a '+
    'rung is cleared by coming in at or BELOW it. Source: '+h(src)+'.</div>';
  openModal(shell('How this was calculated',
    e.name+' · '+r.kpi+(month?' · '+String(month).replace('per_',''):''),
    body,'<button class="btn p" data-close="1">Close</button>',true));
}

        'outstanding <b>'+crore(t.receivable)+'</b>')+

        'debit notes</b>, the same basis the DSO calculation uses. Outstanding '+
        'never goes below zero on a customer, so an over-collected account '+
        'cannot cancel out somebody else\'s overdue.</div>'+
      '<div class="tw"><table class="mini"><thead><tr><th>Customer</th><th>Side</th>'+
      '<th class="r">Ships</th><th class="r">Value</th><th class="r">Collected</th>'+
      '<th class="r">Debit notes</th><th class="r">Outstanding</th><th>Months</th>'+
      '</tr></thead><tbody>'+
      res.rows.map(function(c){
        return '<tr><td>'+h(c.customer)+
          (c.category?'<div class="cap">'+h(c.category)+'</div>':'')+'</td>'+
          '<td><span class="tag g">'+h(c.side)+'</span></td>'+
          '<td class="r num">'+c.ships+'</td>'+
          '<td class="r num">'+crore(c.value)+'</td>'+
          '<td class="r num">'+crore(c.paid)+'</td>'+
          '<td class="r num">'+(c.dn?crore(c.dn):'<span class="lv-na">—</span>')+'</td>'+
          '<td class="r num">'+(c.receivable?'<b>'+crore(c.receivable)+'</b>'
            :'<span class="lv-na">nil</span>')+'</td>'+
          '<td class="cap">'+h((c.months||[]).join(', '))+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  },function(err){
    var el=$('#custBody');
    if(el) el.innerHTML=emptyBox('Could not reach the server',
      (err&&err.message)||'Try again.');
  });
}
function crore(v){
  var x=Number(v);
  if(!isFinite(x)||x===0) return '0.00 Cr';
  return (Math.round(x/1e5)/100).toFixed(2)+' Cr';
}

function sumLine(txt){
  return '<div class="sumline">'+txt+'</div>';
}
function pplTable(list,note){
  if(!list.length) return emptyBox('Nobody here',note||'No scorecard falls in this group.');
  return '<div class="tw"><table class="mini"><thead><tr><th>Person</th>'+
    '<th>Department</th><th class="r">Level</th><th class="r">As %</th>'+
    '</tr></thead><tbody>'+
    list.slice().sort(function(a,b){ return (b.o.score||0)-(a.o.score||0); })
      .map(function(x){
        return '<tr><td>'+h(x.e.name)+'</td><td>'+
          h(teamLabel(M.teams[x.e.team_id])||'—')+'</td>'+
          '<td class="r num">'+f1(x.o.score)+'</td>'+
          '<td class="r num">'+pc(Number(x.o.score)/5*100)+'</td></tr>';
      }).join('')+'</tbody></table></div>';
}
function kpiTable(rows,showPct){
  if(!rows.length) return emptyBox('Nothing to show','No KPI falls in this group.');
  return '<div class="tw"><table class="mini"><thead><tr><th>Person</th><th>KPI</th>'+
    '<th class="r">Target</th><th class="r">Achieved</th>'+
    (showPct?'<th class="r">Achieved %</th>':'')+'<th class="r">Rating</th>'+
    '</tr></thead><tbody>'+
    rows.slice(0,60).map(function(r){
      var p=pctOfTarget(r);
      return '<tr><td>'+h((M.emps[r.employee_id]||{}).name||'—')+'</td>'+
        '<td>'+h(r.kpi)+'</td>'+
        '<td class="r num">'+(r.plan_target===null||r.plan_target===undefined
          ?'<span class="lv-na">—</span>':h(fmtTarget(r.plan_target,r.plan_unit)))+'</td>'+
        '<td class="r num">'+(r.actual===null||r.actual===undefined
          ?'<span class="lv-na">—</span>':h(fmtTarget(r.actual,r.plan_unit)))+'</td>'+
        (showPct?'<td class="r num">'+(p===null?'<span class="lv-na">—</span>':pc(p))+'</td>':'')+
        '<td class="r num">'+(r.level===null||r.level===undefined||r.level===''
          ?'<span class="lv-na">—</span>':'T'+f1(r.level))+'</td></tr>';
    }).join('')+'</tbody></table></div>'+
    (rows.length>60?'<div class="cap" style="margin-top:8px">showing the first 60 of '+
      rows.length+'</div>':'');
}

var VERTICAL_ORDER=['PLASTIC','METAL','ONBOARDING','COLLECTIONS'];
function verticalRank(tid){
  var nm=String(teamLabel(M.teams[tid])||'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ')
    .replace(/\s+/g,' ').trim();
  for(var i=0;i<VERTICAL_ORDER.length;i++){
    if(nm.indexOf(VERTICAL_ORDER[i])===0) return i;
  }
  return VERTICAL_ORDER.length;
}
function byVertical(items,empOf){
  var by={};
  items.forEach(function(it){
    var e=empOf(it); if(!e) return;
    var tid=String(e.team_id);
    (by[tid]=by[tid]||[]).push(it);
  });
  return Object.keys(by).sort(function(a,b){
    var ra=verticalRank(a), rb=verticalRank(b);
    if(ra!==rb) return ra-rb;
    return String(teamLabel(M.teams[a])).localeCompare(String(teamLabel(M.teams[b])));
  }).map(function(tid){ return { tid:tid, items:by[tid] }; });
}
function vCard(tid,sub,body,foot){
  var t=M.teams[tid]||{}, lead=M.emps[t.lead_id];
  return '<section class="vcard"><div class="vch"><h4>'+h(teamLabel(t))+'</h4>'+
    '<div class="cap">'+(lead?'Lead · <b>'+h(lead.name)+'</b>'
      :'<span class="lv-na">no lead recorded</span>')+
    (sub?' · '+sub:'')+'</div></div>'+body+
    (foot?'<div class="vfoot">'+foot+'</div>':'')+'</section>';
}
function sbs(cards){
  return cards.length?'<div class="sbs">'+cards.join('')+'</div>'
    :emptyBox('Nothing to show','No vertical falls in this group.');
}
function vTable(heads,rows,tot){
  if(!rows.length) return '<div class="cap" style="padding:12px 13px">nothing here</div>';
  return '<div class="tw"><table class="mini"><thead><tr>'+
    heads.map(function(x){
      return '<th'+(x.r?' class="r"':'')+'>'+h(x.t)+'</th>'; }).join('')+
    '</tr></thead><tbody>'+rows.join('')+'</tbody>'+
    (tot?'<tfoot><tr class="vtr">'+tot+'</tr></tfoot>':'')+
    '</table></div>';
}
function mean_(a,get){
  return a.length?a.reduce(function(t,x){ return t+Number(get(x)); },0)/a.length:null;
}
function cardDetail(key){
  var V=ovStats();
  var t='', cap='', body='';
  if(key==='employees'){
    t='Employees'; cap=String(V.people.length)+' matching the filters';
    body=sumLine('<b>'+V.people.length+'</b> people · <b>'+V.scored.length+'</b> scored · '+
        '<b>'+V.unscored.length+'</b> awaiting actuals')+
      '<div class="cap" style="margin:12px 0 0">Only a scored person can be '+
      'banded on the health row, which is why the three bands add up to '+
      V.scored.length+' and not '+V.people.length+'.</div>'+
      sbs(byVertical(V.all,function(x){ return x.e; }).map(function(gp){
        var sc=gp.items.filter(function(x){
          return x.o.score!==null&&x.o.score!==undefined; });
        var av=mean_(sc,function(x){ return x.o.score; });
        return vCard(gp.tid,
          '<b>'+gp.items.length+'</b> '+(gp.items.length===1?'person':'people'),
          vTable([{t:'Person'},{t:'Level',r:true},{t:'As %',r:true}],
            gp.items.slice().sort(function(a,b){
              return (b.o.score||-1)-(a.o.score||-1); }).map(function(x){
              var has=x.o.score!==null&&x.o.score!==undefined;
              return '<tr><td>'+h(x.e.name)+
                (M.teams[gp.tid]&&String(M.teams[gp.tid].lead_id)===String(x.e.id)
                  ?' <span class="tag g">lead</span>':'')+
                (x.e.designation?'<div class="cap">'+h(x.e.designation)+'</div>':'')+
                '</td><td class="r num">'+(has?f1(x.o.score)
                  :'<span class="lv-na">awaiting</span>')+'</td>'+
                '<td class="r num">'+(has?pc(Number(x.o.score)/5*100)
                  :'<span class="lv-na">—</span>')+'</td></tr>';
            })),
          sc.length?'mean '+f1(av)+' of 5 · '+pc(av/5*100)+
            ' · '+sc.length+' of '+gp.items.length+' scored'
            :'nothing scored yet');
      }));
  }
  else if(key==='avg'){
    t='Avg performance';
    cap=V.avgLvl===null?'no actuals yet'
      :f1(V.avgLvl)+' of 5 = '+pc(V.avgLvl/5*100);
    var each=V.scored.map(function(x){ return f1(x.o.score); }).join(' + ');
    body=(V.avgLvl===null?emptyBox('Nothing scored yet','No level can be averaged.')
      :sumLine('total <b>'+f1(V.scored.reduce(function(t,x){
           return t+Number(x.o.score); },0))+'</b> across <b>'+V.scored.length+
         '</b> scorecards &divide; '+V.scored.length+' = <b>'+f1(V.avgLvl)+
         '</b> of 5 &nbsp;→&nbsp; '+f1(V.avgLvl)+' &divide; 5 = <b>'+
         pc(V.avgLvl/5*100)+'</b>')+
       '<div class="cap" style="margin:12px 0 0">A mean of <b>people</b>, not '+
       'of KPIs — each scorecard is already a weighted mean of its own KPIs, so '+
       'counting KPIs again would weight a seven-KPI scorecard above a '+
       'five-KPI one. <b>The vertical means below do not average to the figure '+
       'above</b> unless every vertical has the same number of scorecards.</div>'+
       sbs(byVertical(V.scored,function(x){ return x.e; }).map(function(gp){
         var av=mean_(gp.items,function(x){ return x.o.score; });
         var sum=gp.items.reduce(function(t,x){ return t+Number(x.o.score); },0);
         return vCard(gp.tid,'<b>'+pc(av/5*100)+'</b> · level '+f1(av),
           vTable([{t:'Person'},{t:'Level',r:true},{t:'As %',r:true}],
             gp.items.slice().sort(function(a,b){ return b.o.score-a.o.score; })
               .map(function(x){
                 return '<tr><td>'+h(x.e.name)+'</td>'+
                   '<td class="r num">'+f1(x.o.score)+'</td>'+
                   '<td class="r num">'+pc(Number(x.o.score)/5*100)+'</td></tr>';
               }),
             '<td>Average of '+gp.items.length+'</td>'+
             '<td class="r num">'+f1(av)+'</td>'+
             '<td class="r num">'+pc(av/5*100)+'</td>'),
           'total '+f1(sum)+' ÷ '+gp.items.length+' = '+f1(av)+' of 5');
       })));
  }
  else if(key==='attain'){
    t='Target achievement';
    cap=V.attain===null?'nothing achieved against a target yet'
      :'mean of '+V.pctRows.length+' KPIs = '+pc(V.attain);
    body=(V.attain===null?emptyBox('Nothing to average',
        'No KPI has both a target and an achieved value.')
      :sumLine('sum of the '+V.pctRows.length+' percentages ÷ '+V.pctRows.length+
         ' = <b>'+pc(V.attain)+'</b> &nbsp;·&nbsp; <b>'+V.atTgt.length+'</b> of them '+
         'reached 100%')+
       '<div class="cap" style="margin:12px 0 8px">100% means on target. On a '+
       'lower-is-better KPI such as DSO the percentage is <b>target ÷ achieved</b>, '+
       'inverted so that 100% still means on target. KPIs on an absolute ladder '+
       'with no percentage at all are left out rather than counted as zero — '+
       'that is why this averages '+V.pctRows.length+' rows and not '+V.tr.length+'.'+
       '</div>'+
       sbs(byVertical(V.pctRows,function(r){ return M.emps[r.employee_id]; })
         .map(function(gp){
           var av=mean_(gp.items,function(r){ return pctOfTarget(r); });
           var met=gp.items.filter(function(r){ return pctOfTarget(r)>=100; }).length;
           return vCard(gp.tid,'<b>'+pc(av)+'</b> · '+met+' of '+gp.items.length+
             ' at or above target',
             vTable([{t:'Person'},{t:'KPI'},{t:'Target',r:true},
                     {t:'Achieved',r:true},{t:'%',r:true}],
               gp.items.slice().sort(function(a,b){
                 return pctOfTarget(a)-pctOfTarget(b); }).map(function(r){
                 var p=pctOfTarget(r);
                 return '<tr><td>'+h((M.emps[r.employee_id]||{}).name||'—')+'</td>'+
                   '<td>'+h(r.kpi)+'</td>'+
                   '<td class="r num">'+h(fmtTarget(r.plan_target,r.plan_unit))+'</td>'+
                   '<td class="r num">'+(r.actual===null||r.actual===undefined
                     ?'<span class="lv-na">—</span>'
                     :h(fmtTarget(r.actual,r.plan_unit)))+'</td>'+
                   '<td class="r num">'+(p>=100?'<b>'+pc(p)+'</b>'
                     :'<span class="miss">'+pc(p)+'</span>')+'</td></tr>';
               })),
             'mean of '+gp.items.length+' = '+pc(av));
         })));
  }
  else if(key==='completion'){
    t='KPI completion';
    cap=V.tr.length?V.withAch.length+' of '+V.tr.length+' = '+
      pc(V.withAch.length/V.tr.length*100):'nothing targeted yet';
    body=sumLine('<b>'+V.withAch.length+'</b> ÷ <b>'+V.tr.length+'</b> = <b>'+
        (V.tr.length?pc(V.withAch.length/V.tr.length*100):'—')+'</b>')+
      '<div class="cap" style="margin:12px 0 8px">This measures <b>how much has '+
      'been entered</b>, not how well anybody did. Only KPIs that have a target '+
      'are counted — the Target Sheet covers Metals and Plastics only.</div>'+
      sbs(byVertical(V.tr,function(r){ return M.emps[r.employee_id]; })
        .map(function(gp){
          var miss=gp.items.filter(function(r){
            return r.actual===null||r.actual===undefined; });
          var have=gp.items.length-miss.length;
          return vCard(gp.tid,'<b>'+pc(have/gp.items.length*100)+'</b> · '+have+
            ' of '+gp.items.length,
            miss.length
              ?vTable([{t:'Person'},{t:'KPI'},{t:'Target',r:true}],
                 miss.map(function(r){
                   return '<tr><td>'+h((M.emps[r.employee_id]||{}).name||'—')+'</td>'+
                     '<td>'+h(r.kpi)+'</td>'+
                     '<td class="r num">'+h(fmtTarget(r.plan_target,r.plan_unit))+
                     '</td></tr>';
                 }))
              :'<div class="cap" style="padding:12px 13px">every targeted KPI has '+
                'an achieved value</div>',
            miss.length?miss.length+' still missing a value':'complete');
        }));
  }
  else if(key==='top'){
    t='Top performer';
    cap=V.top?V.top.e.name+' · level '+f1(V.top.o.score)+' of 5':'awaiting actuals';
    if(!V.top){ body=emptyBox('Nothing scored yet','No level can be ranked.'); }
    else {
      var mine=(M.byEmp[V.top.e.id]||[]).filter(function(r){
        return r.level!==null&&r.level!==undefined&&r.level!==''; });
      body=sumLine(h(V.top.e.name)+' · weighted mean of <b>'+mine.length+'</b> scored '+
          'KPIs = <b>'+f1(V.top.o.score)+'</b> of 5')+
        '<div class="cap" style="margin:12px 0 8px">Ties are broken arbitrarily, so '+
        'read this as <b>one of</b> the highest rather than a ranking. Each KPI '+
        'below counts in proportion to its weightage.</div>'+kpiTable(mine,true)+
        '<div class="cap" style="margin-top:14px">Everybody, for comparison:</div>'+
        pplTable(V.scored);
    }
  }
  else if(key==='ok'||key==='warn'||key==='crit'){
    var pick={ ok:{ t:'On track', l:V.ok, why:'Overall level <b>4 or above</b> — at or '+
                  'above target. Target 4 is the Target Sheet figure itself.' },
               warn:{ t:'Needs attention', l:V.warn, why:'Level <b>3 up to just under '+
                  '4</b> — reached 90% of target but not target.' },
               crit:{ t:'Critical', l:V.crit, why:'Level <b>below 3</b> — short of 90% '+
                  'of target.' } }[key];
    t=pick.t;
    cap=pick.l.length+' of '+V.scored.length+' scored';
    body=sumLine('<i class="dot '+key+'"></i><b>'+pick.l.length+'</b> of <b>'+
        V.scored.length+'</b> scored = <b>'+
        (V.scored.length?pc(pick.l.length/V.scored.length*100):'—')+'</b>')+
      '<div class="cap" style="margin:12px 0 8px">'+pick.why+' '+
      'The bands are cut on the rating scale, not on round percentages.</div>'+
      pplTable(pick.l);
  }
  else if(key==='gap'){
    t='KPI gap';
    cap=V.gap.length+' of '+V.st.n+' assignments carry no rating';
    var why={ noTarget:[], noActual:[], noLadder:[], other:[] };
    V.gap.forEach(function(r){
      var defined=(r.bands||[]).filter(function(b){ return String(b||'').trim()!==''; }).length;
      if(!defined) why.noLadder.push(r);
      else if(r.plan_target===null||r.plan_target===undefined) why.noTarget.push(r);
      else if(r.actual===null||r.actual===undefined) why.noActual.push(r);
      else why.other.push(r);
    });
    body=sumLine('<b>'+V.st.n+'</b> assignments &minus; <b>'+V.st.scored+
        '</b> rated = <b>'+V.gap.length+'</b> with no rating')+
      '<div class="cap" style="margin:12px 0 10px">Four different causes look '+
      'identical on the card. Split out:</div>'+
      '<div class="tw"><table class="mini"><tbody>'+
      [['No ladder at all',why.noLadder],['No target for this period',why.noTarget],
       ['No achieved value',why.noActual],['Something else',why.other]]
        .map(function(p){
          return '<tr><td>'+p[0]+'</td><td class="r num"><b>'+p[1].length+'</b></td></tr>';
        }).join('')+'</tbody></table></div>'+
      '<div class="cap" style="margin:14px 0 6px"><b style="color:var(--ink)">'+
      'Every unrated assignment</b></div>'+kpiTable(V.gap,false);
  }

function openModal(html){
  closeModal();
  var d=document.createElement('div');
  d.className='scrim';
  d.innerHTML=html;
  d.addEventListener('click',function(ev){ if(ev.target===d) closeModal(); });
  Array.prototype.slice.call(d.querySelectorAll('[data-close]')).forEach(function(b){
    b.addEventListener('click',function(ev){ ev.preventDefault(); closeModal(); }); });
  document.body.appendChild(d);
  var first=d.querySelector('input,select,textarea,button');
  if(first) first.focus();
}

function modalTargets(empId,kpiId){
  var r=findRow(empId,kpiId), e=M.emps[empId]; if(!r||!e) return;
  var body='<div class="cap" style="margin-bottom:16px">Bands are free text by design — the '+
    'workbook holds ladders like <b>&gt; 28 Days</b>, <b>TGT-20 Days</b> and '+
    '<b>≥ ₹9 Cr</b>. Direction is detected from the values, not assumed, so the five must '+
    'move in one direction.</div>'+
    '<div class="bands">'+[0,1,2,3,4].map(function(i){
      return '<div class="b"><label>Target '+(i+1)+'</label>'+
        '<input id="t'+(i+1)+'" value="'+h((r.bands||[])[i]||'')+'"></div>'; }).join('')+
    '</div>'+
    '<div class="fld" style="margin-top:16px"><label>Currently reads as</label>'+
      '<div id="tPrev" class="cap"></div></div>';
  openModal(shell('Target bands',h(e.name)+' · '+r.kpi,body,
    '<button class="btn" data-close="1">Cancel</button>'+
    '<button class="btn p" id="tSave">Save bands</button>',true));
  function preview(){
    var el=$('#tPrev'); if(!el) return;
    var vals=[1,2,3,4,5].map(function(i){ return String(($('#t'+i)||{}).value||'').trim(); });
    var EMPTY=/^(|-|--|—|–|n\/?a|na|nil|tbd)$/i;
    function isRel(v){ return /(^|[^A-Za-z])T\s*[+\-]\s*\d/i.test(v)||
      /on\s*time/i.test(v)||/as\s+per\b/i.test(v); }
    function val(v){
      if(EMPTY.test(v)||isRel(v)) return null;
      var t=v.replace(/[₹$,]/g,' ').replace(/([A-Za-z])\s*-\s*/g,'$1 ');
      var rg=t.match(/(\d+(?:\.\d+)?)\s*[–—]\s*(\d+(?:\.\d+)?)/)||
             t.match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)/);
      if(rg) return (parseFloat(rg[1])+parseFloat(rg[2]))/2;
      var m=t.match(/-?\d+(?:\.\d+)?/);
      return m&&isFinite(parseFloat(m[0]))?parseFloat(m[0]):null;
    }
    var defined=0, relative=0, nums=[];
    vals.forEach(function(v){
      if(!EMPTY.test(v)) defined++;
      if(v&&isRel(v)) relative++;
      nums.push(val(v));
    });
    var got=nums.filter(function(x){ return x!==null; });
    if(relative>=2){
      el.innerHTML='<b>Ordinal</b> — Target 5 is best. The level is awarded here, '+
        'not measured from an actual.'; return;
    }
    if(defined<=1||!got.length){
      el.innerHTML='<b>Qualitative</b> — no numeric ladder, so the level has to be '+
        'awarded by hand.'; return;
    }
    var first=got[0], last=got[got.length-1], lower=last<first;
    var mono=true,prev=null;
    nums.forEach(function(v){ if(v===null) return;
      if(prev!==null){ if(!lower&&v<prev) mono=false; if(lower&&v>prev) mono=false; }
      prev=v; });
    el.innerHTML='<b>Numeric</b>, '+(lower?'lower is better':'higher is better')+
      ' — values '+JSON.stringify(nums)+
      (mono?'':'<br><span style="color:var(--crit)">Not monotonic: the five go up and down, '+
       'so the server will refuse this.</span>');
  }
  [1,2,3,4,5].forEach(function(i){ var el=$('#t'+i); if(el) el.oninput=preview; });
  preview();
  $('#tSave').onclick=function(){
    write('apiSaveTargets',{employee_id:empId,kpi_id:kpiId,
      t1:$('#t1').value,t2:$('#t2').value,t3:$('#t3').value,
      t4:$('#t4').value,t5:$('#t5').value},'Bands saved and level re-resolved.');
  };
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recykal · KRA / KPI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
 * DESIGN SYSTEM — Groww-inspired: white space, big-number-first snapshots,
 * light borderless surfaces, subtle status colour, segmented controls,
 * clean area charts, progressive disclosure. Recykal brand accent retained.
 * ==========================================================================*/
:root{
  --brand:#005DFF; --brand-2:#8460D4; --brand-soft:#ECF2FF;
  --ink:#14161B; --ink-2:#464C59; --muted:#79828F; --faint:#A6AEBB;
  --line:#EEF0F4; --line-soft:#F4F6F9; --bg:#F7F8FA; --card:#FFFFFF;
  --surface-2:#F6F8FB;
  --good:#00B386; --good-soft:#E6F7F1; --good-ink:#028268;
  --warn:#E8973A; --warn-soft:#FBF0E1; --warn-ink:#B26A17;
  --bad:#E5484D;  --bad-soft:#FCEBEC;  --bad-ink:#C2303A;
  --none:#98A2B3; --none-soft:#F0F2F6;
  --shadow-xs:0 1px 2px rgba(16,24,40,.04);
  --shadow:0 8px 28px -14px rgba(16,24,40,.16);
  --shadow-lg:0 24px 60px -22px rgba(16,24,40,.30);
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --sbw:246px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.num,.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#DBE0E8;border-radius:20px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#C6CDD8}

/* --------------------------------------------------------------- app frame */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sbw);flex:0 0 var(--sbw);position:sticky;top:0;height:100vh;
  background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 14px;z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .mark{width:32px;height:32px;flex:0 0 32px}
.brand .name{font-weight:800;font-size:15px;letter-spacing:-.02em;line-height:1.1}
.brand .name span{display:block;font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:.01em}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:16px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;
  color:var(--ink-2);font-weight:550;cursor:pointer;transition:.14s;font-size:13.5px;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:650}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.9}
.nav-item .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--bad-soft);color:var(--bad-ink);border-radius:20px;padding:1px 8px}
.sidebar .foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--faint);line-height:1.6}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.main-scroll{flex:1;min-height:0}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(247,248,250,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:11px 28px;display:flex;align-items:center;gap:12px;
}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);min-width:0;flex-wrap:wrap}
.crumbs b{color:var(--ink);font-weight:650}
.crumbs .sep{color:var(--faint)}
.crumbs .c-link{cursor:pointer}
.crumbs .c-link:hover{color:var(--brand)}
.topbar .spacer{flex:1}
.search{position:relative}
.search input{
  border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 12px 8px 34px;
  font-size:13px;width:200px;color:var(--ink);transition:.15s;outline:none;
}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);width:236px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.icon-btn{
  border:1px solid var(--line);background:#fff;border-radius:11px;width:37px;height:37px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:.15s;
}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.icon-btn svg{width:17px;height:17px}
.userchip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:24px;background:#fff}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center}
.userchip .u-name{font-size:12.5px;font-weight:600;line-height:1.1}
.userchip .u-sub{font-size:10.5px;color:var(--muted)}

.content{padding:24px 28px 64px;max-width:1200px;width:100%;margin:0 auto}
.page-head{margin-bottom:18px}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:-.025em;margin:0 0 3px}
.page-head p{margin:0;color:var(--muted);font-size:13px;max-width:760px;line-height:1.55}

/* ------------------------------------------------------------- segmented */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg-btn{border:none;background:transparent;border-radius:9px;padding:7px 15px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.14s;white-space:nowrap}
.seg-btn:hover{color:var(--ink)}
.seg-btn.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs);font-weight:650}

/* ---------------------------------------------------------------- panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.panel.pad{padding:20px 22px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.panel-h h3{font-size:14.5px;font-weight:700;margin:0;letter-spacing:-.01em}
.panel-h .sub{font-size:12px;color:var(--muted);font-weight:500}
.panel-h .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.link{font-size:12.5px;font-weight:650;color:var(--brand);cursor:pointer}
.link:hover{text-decoration:underline}
.stack{margin-top:14px}

.up{color:var(--good-ink)} .down{color:var(--bad-ink)} .flat{color:var(--muted)}

/* delta chips */
.dchip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.dchip.up{background:var(--good-soft);color:var(--good-ink)}
.dchip.down{background:var(--bad-soft);color:var(--bad-ink)}
.dchip.flat{background:var(--none-soft);color:var(--muted)}

/* -------------------------------------------------------------- list rows */
.list{margin:2px -8px 0}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;cursor:pointer;transition:background .13s}
.lrow:hover{background:var(--surface-2)}
.lrow + .lrow{box-shadow:inset 0 1px 0 var(--line-soft)}
.lrow-id{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.lrow-name{font-size:13.5px;font-weight:650;min-width:0;letter-spacing:-.01em}
.lrow-name .lrow-sub{display:block;font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lavatar{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:12.5px;display:grid;place-items:center}
.tlogo{border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;flex:0 0 auto}
.lrow-spark{flex:0 0 74px;display:none}
.lrow-val{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto;min-width:56px}
.lrow-num{font-size:16px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lrow-num span{font-size:11px;font-weight:600;color:var(--faint);margin-left:1px}
.chev{color:var(--faint);font-size:18px;flex:0 0 12px;text-align:center}
.mini-tag{font-size:9.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:middle}
.lrow-mid{flex:0 0 auto;text-align:right}
.lrow-attain{font-size:12px;font-weight:650;color:var(--ink-2)}

/* compact metric cluster on rows */
.kmetrics{display:flex;align-items:center;gap:18px;flex:0 0 auto}
.km{display:flex;flex-direction:column;align-items:flex-end;min-width:52px}
.km-l{font-size:10px;color:var(--faint);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.km-v{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.km-s{font-size:10.5px;color:var(--faint)}
.rchip{min-width:40px;text-align:center;font-size:14px;font-weight:800;padding:5px 8px;border-radius:9px;font-variant-numeric:tabular-nums}

/* status dot + pills */
.sdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;display:inline-block}
.s-good{background:var(--good)} .s-warn{background:var(--warn)} .s-bad{background:var(--bad)} .s-none{background:var(--none)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill.none{background:var(--none-soft);color:var(--ink-2)}
.tag{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 8px}

/* progress bar */
.track{flex:1;height:7px;background:var(--line-soft);border-radius:20px;overflow:hidden;min-width:60px}
.track .fill{height:100%;border-radius:20px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* grids */
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.wide-narrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.two-col,.wide-narrow{grid-template-columns:minmax(0,1fr)}}

/* mini bars used inside rows */
.kra-row{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:12px}
.kra-row + .kra-row{box-shadow:inset 0 1px 0 var(--line-soft)}
.kra-row .knm{width:200px;flex:0 0 200px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kra-row .knm small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.kra-row .kv{width:60px;flex:0 0 60px;text-align:right;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.kra-row .kv small{color:var(--faint);font-weight:600;font-size:10.5px}

.rank{width:20px;flex:0 0 20px;text-align:center;font-size:12px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.rank.top{color:var(--brand)}

.person-hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.person-hd .pa{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;flex:0 0 54px}
.person-hd h1{margin:0;font-size:22px;letter-spacing:-.025em}
.person-hd .meta{color:var(--muted);font-size:12.5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:3px}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.legend .li{display:flex;align-items:center;gap:6px}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty svg{width:36px;height:36px;opacity:.3;margin-bottom:6px}

.chart-note{font-size:11px;color:var(--faint);display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
.chart-note b{color:var(--muted);font-weight:600}

/* tables kept for Data view */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tbl-wrap{overflow-x:auto}
.pill-select{appearance:none;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;outline:none}
.pill-select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* KPI cards — one primary metric per card (title + big number + 1 support) */
.kc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;display:flex;flex-direction:column;justify-content:space-between;min-height:132px;transition:border-color .15s,box-shadow .15s,transform .15s}
.kc-click{cursor:pointer}
.kc-click:hover{border-color:#DCE2EC;box-shadow:var(--shadow);transform:translateY(-1px)}
.kc-label{font-size:12.5px;color:var(--muted);font-weight:600}
.kc-value{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.02;font-variant-numeric:tabular-nums;color:var(--ink)}
.kc-value small{font-size:17px;font-weight:600;color:var(--faint);margin-left:1px;letter-spacing:0}
.kc-support{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:8px}
.kc-support.up{color:var(--good-ink)} .kc-support.down{color:var(--bad-ink)} .kc-support.warn{color:var(--warn-ink)} .kc-support.bad{color:var(--bad-ink)}
@media(max-width:820px){.kc-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
@media(max-width:380px){.kc-value{font-size:32px}.kc{min-height:118px;padding:16px 16px 15px}}

/* titled chart header — the title explains what the chart shows */
.chart-title{margin-bottom:10px}
.chart-title h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.chart-title span{font-size:12px;color:var(--muted)}

/* team comparison bars */
.bc{display:flex;flex-direction:column;gap:2px}
.bc-row{display:flex;align-items:center;gap:14px;padding:11px 6px;border-radius:10px;cursor:pointer;transition:background .13s}
.bc-row:hover{background:var(--surface-2)}
.bc-label{width:108px;flex:0 0 108px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-track{flex:1;height:10px;background:var(--line-soft);border-radius:20px;overflow:hidden;min-width:40px}
.bc-fill{height:100%;border-radius:20px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bc-val{width:40px;flex:0 0 40px;text-align:right;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}

/* simplified list-row right column */
.lrow>.lrow-num{flex:0 0 auto;color:var(--ink)}
.lrow>.sdot{flex:0 0 8px}
.lrow-meta{font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right;white-space:nowrap}
.lrow-meta span{color:var(--faint)}
@media(max-width:560px){.lrow-meta{display:none}}

/* ------------------------------------------------------------------ drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.32);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:540px;max-width:94vw;background:#fff;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:61;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{padding:20px 22px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.drawer-h h2{margin:0;font-size:17px;font-weight:750;letter-spacing:-.015em;line-height:1.25}
.drawer-h .sub{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drawer-body{padding:20px 22px;overflow-y:auto;flex:1}
.drawer .close{margin-left:auto;flex:0 0 34px}
.section-t{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px}
.section-t:first-child{margin-top:0}
.def-box{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:14px 16px;font-size:13px;color:var(--ink-2);line-height:1.55}
.def-box code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px;color:var(--ink)}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px 13px}
.metric .l{font-size:11px;color:var(--muted);font-weight:600}
.metric .v{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.metric .v small{font-size:12px;font-weight:600;color:var(--faint)}
.bandscale{margin-top:6px}
.bandscale .bs-track{display:flex;gap:4px;margin-bottom:6px}
.bandscale .bs-seg{flex:1;height:34px;border-radius:9px;position:relative;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff}
.bandscale .bs-lab{display:flex;gap:4px}
.bandscale .bs-lab div{flex:1;text-align:center;font-size:9.5px;color:var(--muted);font-weight:600;line-height:1.2}
.bandscale .marker{position:absolute;top:-9px;transform:translateX(-50%);z-index:2;font-size:10px;font-weight:700;color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:20px;padding:1px 7px;white-space:nowrap;box-shadow:var(--shadow-xs)}
.bandscale .marker::after{content:"";position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);width:0;height:0;border:5px solid transparent;border-top-color:var(--ink)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13.5px;font-family:inherit;color:var(--ink);outline:none;transition:.15s;background:#fff}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field textarea{resize:vertical;min-height:62px}
.inline2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:none;border-radius:11px;padding:10px 18px;font-size:13.5px;font-weight:650;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#0050db;box-shadow:0 6px 16px -6px rgba(0,93,255,.5)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.drawer-foot{padding:15px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.drawer-foot .saved{font-size:11.5px;color:var(--muted);margin-right:auto}
.rating-picker{display:flex;gap:6px}
.rating-picker button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-weight:700;cursor:pointer;font-size:13px;color:var(--ink-2);transition:.12s}
.rating-picker button:hover{border-color:var(--brand)}
.rating-picker button.sel{background:var(--brand);color:#fff;border-color:var(--brand)}

/* toast + loader */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.24s;z-index:80;display:flex;align-items:center;gap:9px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--bad)}

<body>

<div class="loader" id="loader"><div style="text-align:center"><div class="spin" style="margin:0 auto 14px"></div><div style="font-size:13px;color:var(--muted);font-weight:600">Loading performance data…</div></div></div>

<div class="app">
  <aside class="sidebar" id="sidebar">

<div class="toast" id="toast"></div>

<script>
/* ============================================================================
 * RECYKAL KRA/KPI TRACKER — FRONTEND
 * The SINGLE scoring engine lives here (Scoring.*). It runs identically on
 * live server data (from Code.gs) and on the offline preview mock, so there is
 * exactly one calculation implementation in the product. This redesign is
 * presentation-only: every metric, view, filter, drill-down, calculation and
 * write path is preserved — only the visual language changed (Groww-inspired).
 * ==========================================================================*/
'use strict';

/* -------------------------------------------------------------- utilities */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
function fmtNum(v,unit){
  if(v==null||isNaN(v))return '—';
  const r=Math.round(v*100)/100;
  if(unit==='Percentage')return r+'%';
  if(unit==='Days')return r+' d';
  if(unit==='₹ Cr')return '₹'+r+' Cr';
  return String(r);
}
const pct=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10)+'%';
const one=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10).toFixed(1);

/* status vocabulary (rating 0..5) */
function statusOf(rating,S){
  if(rating==null)return {k:'none',t:'No Data',cls:'none'};
  if(rating>=S.onTrack)return {k:'good',t:'On Track',cls:'good'};
  if(rating>=S.atRisk)return {k:'warn',t:'At Risk',cls:'warn'};
  return {k:'bad',t:'Off Track',cls:'bad'};
}
const STATUS_COLOR={good:'var(--good)',warn:'var(--warn)',bad:'var(--bad)',none:'var(--none)'};
const STATUS_TINT={good:'var(--good-soft)',warn:'var(--warn-soft)',bad:'var(--bad-soft)',none:'var(--none-soft)'};
function scoreColor(score5,S){return STATUS_COLOR[statusOf(score5,S).k];}
function tint(k){return STATUS_TINT[k]||STATUS_TINT.none;}

/* =====================================================  SCORING ENGINE  ==== */
const Scoring=(()=>{
  /* value -> rating(0..5) using the 5 ordered bands (worst..best) + direction */
  function valueToRating(kpi,actual){
    const v=kpi.bands.map(b=>b.value);
    // fill nulls with nearest numeric neighbour so interpolation is safe
    const w=v.slice();
    for(let i=0;i<5;i++) if(w[i]==null) w[i]=nearest(v,i);
    if(w.every(x=>x==null))return null;
    const sign=kpi.direction==='lower'?-1:1;
    const s=sign*actual, ww=w.map(x=>sign*x);
    if(s<=ww[0]){
      const d=(ww[1]-ww[0])||1;
      return clamp(1+(s-ww[0])/d,0,1);
    }
    if(s>=ww[4])return 5;
    for(let i=0;i<4;i++){
      if(s>=ww[i]&&s<=ww[i+1]){
        const d=(ww[i+1]-ww[i])||1;
        return (i+1)+(s-ww[i])/d;
      }
    }
    return 5;
  }
  function nearest(v,i){for(let d=1;d<5;d++){if(v[i-d]!=null)return v[i-d];if(v[i+d]!=null)return v[i+d];}return null;}

  /* one KPI for one member in one period */
  function evalKpi(kpi,rec,S){
    const out={rating:null,value:null,achievement:null,gap:null,gapToTarget:null,
               hasData:false,manual:false,status:statusOf(null,S)};
    if(!rec)return out;
    if(rec.rating!=null&&!isNaN(rec.rating)){         // qualitative / manual
      out.rating=clamp(Number(rec.rating),0,5);out.manual=true;out.hasData=true;
    }else if(rec.actual!=null&&!isNaN(rec.actual)){
      out.value=Number(rec.actual);
      out.rating=valueToRating(kpi,out.value);
      out.hasData=out.rating!=null;
    }
    if(out.value!=null&&kpi.target!=null){
      const t=kpi.target;
      if(kpi.direction==='lower'){
        out.achievement= out.value>0 ? (t/out.value)*100 : null;
        out.gapToTarget = t-out.value;               // + = better than target
      }else{
        out.achievement= t>0 ? (out.value/t)*100 : null;
        out.gapToTarget = out.value-t;               // + = above target
      }
      out.gap=out.gapToTarget;
    }
    out.status=statusOf(out.rating,S);
    return out;
  }

  const wsum=a=>a.reduce((s,x)=>s+x,0);
  function weightedRating(rows){
    const d=rows.filter(r=>r.hasData&&r.weight!=null&&r.weight>0);
    if(!d.length)return null;
    return wsum(d.map(r=>r.weight*r.rating))/wsum(d.map(r=>r.weight));
  }
  function weightedAch(rows){
    const d=rows.filter(r=>r.hasData&&r.achievement!=null&&r.weight!=null&&r.weight>0);
    if(!d.length)return null;
    return wsum(d.map(r=>r.weight*r.achievement))/wsum(d.map(r=>r.weight));
  }

  /* Build the full computed model for the whole org, for one period. */
  function build(boot,period){
    const S=boot.settings;
    const key=(m,k)=>m+'||'+k+'||'+period;
    const kpisByMember={};
    boot.kpis.forEach(k=>{(kpisByMember[k.memberId]=kpisByMember[k.memberId]||[]).push(k);});

    const members={};
    boot.members.forEach(m=>{
      const list=(kpisByMember[m.id]||[]).map(kpi=>{
        const rec=boot.actuals[key(m.id,kpi.kpiId)];
        const ev=evalKpi(kpi,rec,S);
        return Object.assign({kpi,weight:kpi.weight,rec:rec||null},ev);
      });
      // roll up KRAs
      const kraMap={};
      list.forEach(r=>{const g=kraMap[r.kpi.kra]=kraMap[r.kpi.kra]||{kra:r.kpi.kra,rows:[]};g.rows.push(r);});
      const kras=Object.values(kraMap).map(g=>({
        kra:g.kra,rows:g.rows,weight:wsum(g.rows.map(r=>r.weight||0)),
        score:weightedRating(g.rows),ach:weightedAch(g.rows),
        segment:g.rows[0].kpi.segment||'',perspective:g.rows[0].kpi.perspective||''
      }));
      // segments (Metal/Plastic)
      const segMap={};
      list.forEach(r=>{const s=r.kpi.segment;if(!s)return;(segMap[s]=segMap[s]||[]).push(r);});
      const segments=Object.keys(segMap).map(s=>({segment:s,rows:segMap[s],score:weightedRating(segMap[s]),ach:weightedAch(segMap[s])}));
      const score=weightedRating(list);
      members[m.id]={member:m,rows:list,kras,segments,
        score,ach:weightedAch(list),status:statusOf(score,S),
        counts:tally(list,S),hasData:list.some(r=>r.hasData)};
    });

    // teams
    const teams={};
    boot.teams.forEach(t=>{
      const mem=boot.members.filter(m=>m.team===t.name).map(m=>members[m.id]);
      const withData=mem.filter(m=>m.score!=null);
      const score=withData.length?wsum(withData.map(m=>m.score))/withData.length:null;
      const ach=avg(withData.map(m=>m.ach).filter(x=>x!=null));
      const allRows=[].concat.apply([],mem.map(m=>m.rows));
      teams[t.name]={team:t,members:mem,ranked:mem.slice().sort((a,b)=>(b.score||-1)-(a.score||-1)),
        score,ach,status:statusOf(score,S),counts:tally(allRows,S),
        onTrackPct:onTrackPct(allRows,S),rows:allRows};
    });

    // org
    const allMembers=Object.values(members);
    const md=allMembers.filter(m=>m.score!=null);
    const orgScore=md.length?wsum(md.map(m=>m.score))/md.length:null;
    const allRows=[].concat.apply([],allMembers.map(m=>m.rows));
    const org={score:orgScore,ach:avg(md.map(m=>m.ach).filter(x=>x!=null)),
      status:statusOf(orgScore,S),counts:tally(allRows,S),onTrackPct:onTrackPct(allRows,S),
      headcount:allMembers.length,withData:md.length,
      teamsRanked:Object.values(teams).sort((a,b)=>(b.score||-1)-(a.score||-1)),
      top:md.slice().sort((a,b)=>b.score-a.score).slice(0,5),
      bottom:md.slice().sort((a,b)=>a.score-b.score).slice(0,5),
      atRisk:allRows.filter(r=>r.hasData&&r.status.k!=='good').sort((a,b)=>shortfall(b)-shortfall(a)),
      interventions:allRows.filter(r=>r.hasData&&r.status.k==='bad').sort((a,b)=>shortfall(b)-shortfall(a))
    };
    return {period,S,members,teams,org,allRows};
  }

  function tally(rows,S){const c={good:0,warn:0,bad:0,none:0};rows.forEach(r=>{c[r.hasData?r.status.k:'none']++;});return c;}
  function onTrackPct(rows,S){const d=rows.filter(r=>r.hasData);if(!d.length)return null;return d.filter(r=>r.status.k==='good').length/d.length*100;}
  function shortfall(r){return (r.weight||0)*Math.max(0,3-(r.rating==null?0:r.rating));}
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;

  return {build,evalKpi,valueToRating,shortfall};
})();

/* ==========================================================  APP STATE  ==== */
const APP={boot:null,cmp:null,view:'overview',ctx:{},period:null,search:'',navOpen:false,tab:null};

/* server bridge — mock when google.script is unavailable (offline preview) */
const MOCK={enabled:(typeof google==='undefined'||!google.script||!google.script.run)};
function call(fn,payload){
  return new Promise((resolve,reject)=>{
    if(MOCK.enabled){try{resolve(MockBackend[fn](payload));}catch(e){reject(e);}return;}
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](payload);
  });
}

/* ================================================  BOOT + DATA REFRESH  ==== */
async function boot(){
  drawBrand();
  try{
    let b=await call('apiBootstrap',{});
    if(!b||!b.ok)throw new Error(b&&b.error||'Bootstrap failed');
    if(!b.actuals||Object.keys(b.actuals).length===0){
      const s=await call('apiSeedSampleData',false);
      if(s&&s.ok)b=s;
    }
    applyBoot(b);
    $('#loader').classList.add('off');
  }catch(e){
    $('#loader').innerHTML='<div style="text-align:center;max-width:420px;padding:20px"><div style="font-size:15px;font-weight:700;color:var(--bad-ink);margin-bottom:8px">Could not load data</div><div style="font-size:13px;color:var(--muted)">'+esc(e.message||e)+'</div></div>';
  }
}
function applyBoot(b){
  APP.boot=b;
  APP.period=b.settings.currentPeriod||(b.periods[b.periods.length-1]);
  recompute();buildChrome();render();
}
function recompute(){APP.cmp=Scoring.build(APP.boot,APP.period);}

/* ==============================================================  CHROME  ==== */
const ICONS={
  overview:'<path d="M3 12l2-2 4 4 5-6 4 4 3-3"/><path d="M3 20h18" opacity=".4"/>',
  teams:'<rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="5" rx="1.5"/><rect x="14" y="15" width="7" height="5" rx="1.5"/>',
  people:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.6" opacity=".55"/><path d="M15 20a5 5 0 0 1 6.5-4.8" opacity=".55"/>',
  risk:'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
  data:'<ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.6 3.4 3 7.5 3s7.5-1.4 7.5-3v-6M4.5 11.5v6c0 1.6 3.4 3 7.5 3s7.5-1.4 7.5-3v-6"/>'
};
const NAV=[
  {id:'overview',label:'Organisation'},
  {id:'teams',label:'Teams'},
  {id:'people',label:'People'},
  {id:'risk',label:'At-Risk KPIs',icon:'risk'},
  {sep:'Manage'},
  {id:'data',label:'Data & Settings',icon:'data'}
];
function buildChrome(){
  const nav=$('#nav');nav.innerHTML='';
  NAV.forEach(n=>{
    if(n.sep){nav.insertAdjacentHTML('beforeend','<div class="nav-label">'+n.sep+'</div>');return;}
    const ic=n.icon||n.id;
    const risk=(n.id==='risk')?APP.cmp.org.atRisk.length:0;
    nav.insertAdjacentHTML('beforeend',
      '<div class="nav-item" data-nav="'+n.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+
      (ICONS[ic]||ICONS.overview)+'</svg>'+n.label+
      (risk?'<span class="badge">'+risk+'</span>':'')+'</div>');
  });
  // period as a Groww-style segmented control
  $('#periodSeg').innerHTML=APP.boot.periods.map(p=>'<button class="seg-btn'+(p===APP.period?' active':'')+'" data-period="'+p+'">'+periodLabel(p)+'</button>').join('');
  const em=(APP.boot.user&&APP.boot.user.email)||'';
  $('#userName').textContent= em?em.split('@')[0]:'Preview';
  $('#userAv').textContent= em?initials(em.split('@')[0].replace(/[._]/g,' ')):'R';
  $('#sbFoot').innerHTML=(MOCK.enabled?'Preview mode · sample data':'Live · Google Sheet backend')+'<br>'+APP.boot.members.length+' people · '+APP.boot.kpis.length+' KPI lines';
}
function periodLabel(p){if(!p)return p;const[y,m]=p.split('-');const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return (mn[(+m)-1]||m)+" '"+String(y).slice(2);}

function drawBrand(){
  const petals=[['var(--brand)',0],['var(--brand-2)',90],['var(--good)',180],['#567DE8',270]];
  const p=petals.map(([c,r])=>'<path d="M17 17 C17 9, 25 9, 25 17 C25 21, 21 25, 17 25 Z" fill="'+c+'" transform="rotate('+r+' 17 17)"/>').join('');
  $('#brandMark').innerHTML='<svg viewBox="0 0 34 34" width="34" height="34">'+p+'</svg>';
}

/* =============================================================  ROUTER  ==== */
function go(view,ctx){APP.view=view;APP.ctx=ctx||{};APP.tab=null;window.scrollTo(0,0);const sc=$('.main-scroll');if(sc)sc.scrollTop=0;render();}
function render(){
  $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.nav===APP.view));
  renderCrumbs();
  const c=$('#content');c.classList.remove('fade');void c.offsetWidth;c.classList.add('fade');
  const v={overview:viewOverview,teams:viewTeams,team:viewTeam,people:viewPeople,member:viewMember,risk:viewRisk,data:viewData}[APP.view]||viewOverview;
  c.innerHTML=v();
}
function renderCrumbs(){
  const cr=[];
  cr.push({t:'Organisation',v:'overview'});
  if(APP.view==='teams')cr.push({t:'Teams'});
  if(APP.view==='people')cr.push({t:'People'});
  if(APP.view==='risk')cr.push({t:'At-Risk KPIs'});
  if(APP.view==='data')cr.push({t:'Data & Settings'});
  if(APP.view==='team'){cr.push({t:'Teams',v:'teams'});cr.push({t:APP.ctx.team});}
  if(APP.view==='member'){const m=APP.boot.members.find(x=>x.id===APP.ctx.memberId);if(m){cr.push({t:m.team,v:'team',ctx:{team:m.team}});cr.push({t:m.name});}}
  $('#crumbs').innerHTML=cr.map((c,i)=>{
    const last=i===cr.length-1;
    const link=c.v&&!last;
    return (i?'<span class="sep">›</span>':'')+'<span class="'+(link?'c-link':'')+'" '+(link?'data-crumb=\''+JSON.stringify({v:c.v,ctx:c.ctx||{}}).replace(/'/g,'&#39;')+'\'':'')+'>'+(last?'<b>'+esc(c.t)+'</b>':esc(c.t))+'</span>';
  }).join('');
}

/* =====================================================  CHART / PIECES  ==== */
let _uid=0;
function trendColor(series){
  const v=series.filter(p=>p.v!=null);
  if(v.length<2)return 'var(--muted)';
  const d=v[v.length-1].v-v[v.length-2].v;
  return d>0.02?'var(--good)':d<-0.02?'var(--bad)':'var(--brand)';
}
function toneOf(score,S){if(score==null)return '';const k=statusOf(score,S).cls;return k==='none'?'':k;}
function supportTrend(series){
  const v=series.filter(p=>p.v!=null);
  if(v.length<2)return {cls:'',html:'first tracked period'};
  const d=v[v.length-1].v-v[v.length-2].v;
  const cls=d>0.02?'up':d<-0.02?'down':'';const ar=d>0.02?'▲':d<-0.02?'▼':'•';
  return {cls:cls,html:ar+' '+Math.abs(Math.round(d*100)/100).toFixed(2)+' vs last month'};
}
/* One KPI card: a title + one big number + at most one supporting element. */
function kpiCard(label,value,support,opts){
  opts=opts||{};
  const color=opts.tone?('var(--'+opts.tone+'-ink)'):'var(--ink)';
  const attr=opts.nav?('data-nav="'+opts.nav+'"'):(opts.attr||'');
  const clk=(opts.nav||opts.attr)?' kc-click':'';
  return '<div class="kc'+clk+'" '+attr+'>'+
    '<div class="kc-label">'+label+'</div>'+
    '<div><div class="kc-value" style="color:'+color+'">'+value+'</div>'+
    (support?'<div class="kc-support '+(opts.supportTone||'')+'">'+support+'</div>':'')+
    '</div></div>';
}
/* Simple horizontal bar chart — one row per item, clear value, no legend. */
function barChart(rows){
  return '<div class="bc">'+rows.map(function(r){return '<div class="bc-row" '+(r.attr||'')+'>'+
    '<div class="bc-label">'+esc(r.label)+'</div>'+
    '<div class="bc-track"><div class="bc-fill" style="width:'+(clamp(r.value/5,0,1)*100).toFixed(1)+'%;background:'+r.color+'"></div></div>'+
    '<div class="bc-val" style="color:'+r.color+'">'+one(r.value)+'</div></div>';}).join('')+'</div>';
}
function areaChart(series,S,h){
  h=h||168;const w=560;const n=series.length;
  const pad={l:6,r:6,t:14,b:24},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const xs=i=>pad.l+(n<=1?iw/2:i*iw/(n-1));
  const ys=v=>pad.t+ih-(clamp(v,0,5)/5)*ih;
  const valid=series.map((p,i)=>({i,v:p.v})).filter(p=>p.v!=null);
  if(valid.length<1)return '<div class="empty" style="height:'+h+'px;display:grid;place-items:center">No data for this period</div>';
  const col=trendColor(series),id='gr'+(++_uid);
  let line='';valid.forEach((p,idx)=>{line+=(idx?'L':'M')+xs(p.i).toFixed(1)+' '+ys(p.v).toFixed(1)+' ';});
  let area='';
  if(valid.length>=2){area='M'+xs(valid[0].i).toFixed(1)+' '+(pad.t+ih)+' '+line.replace(/^M/,'L')+'L'+xs(valid[valid.length-1].i).toFixed(1)+' '+(pad.t+ih)+' Z';}
  const grid=[S.atRisk,S.onTrack].map(t=>'<line x1="'+pad.l+'" x2="'+(w-pad.r)+'" y1="'+ys(t).toFixed(1)+'" y2="'+ys(t).toFixed(1)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5"/>').join('');
  const dots=valid.map(p=>'<circle cx="'+xs(p.i).toFixed(1)+'" cy="'+ys(p.v).toFixed(1)+'" r="3.4" fill="#fff" stroke="'+col+'" stroke-width="2.2"/>').join('');
  const vlab=valid.map(p=>'<text x="'+xs(p.i).toFixed(1)+'" y="'+(ys(p.v)-10).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+col+'">'+one(p.v)+'</text>').join('');
  const labels=series.map((p,i)=>'<text x="'+xs(i).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+periodLabel(p.period)+'</text>').join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+col+'" stop-opacity="0.22"/><stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+(area?'<path d="'+area+'" fill="url(#'+id+')"/>':'')+
    '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'+
    dots+vlab+labels+'</svg>';
}
function miniSpark(series,S,w,h){
  w=w||74;h=h||26;
  const valid=series.filter(p=>p.v!=null);
  if(valid.length<2)return '<svg width="'+w+'" height="'+h+'"></svg>';
  const n=series.length,xs=i=>2+i*(w-4)/(n-1),ys=v=>h-3-((clamp(v,0,5))/5)*(h-6);
  let d='';series.forEach((p,i)=>{if(p.v==null)return;d+=(d?'L':'M')+xs(i).toFixed(1)+' '+ys(p.v).toFixed(1)+' ';});
  const col=trendColor(series);
  return '<svg width="'+w+'" height="'+h+'" style="display:block"><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function trendSeries(kind,id){
  return APP.boot.periods.map(p=>{
    const cmp=Scoring.build(APP.boot,p);
    let v=null;
    if(kind==='org')v=cmp.org.score;
    else if(kind==='team')v=cmp.teams[id]?cmp.teams[id].score:null;
    else if(kind==='member')v=cmp.members[id]?cmp.members[id].score:null;
    return {period:p,v};
  });
}
function bar(score5,S){const p=score5==null?0:clamp(score5/5,0,1)*100;const col=scoreColor(score5,S);
  return '<div class="track"><div class="fill" style="width:'+p+'%;background:'+col+'"></div></div>';}
function pillFor(st){return '<span class="pill '+st.cls+'"><span class="sdot s-'+st.k+'"></span>'+st.t+'</span>';}
function teamColor(name){const map={Metal:'#64748B',Plastic:'#0EA5A0',Onboarding:'#7C5CE0',Collections:'#E07A2A'};return map[name]||'var(--brand)';}
function teamLogo(name,size){size=size||38;const c=teamColor(name);return '<div class="tlogo" style="background:linear-gradient(135deg,'+c+',color-mix(in srgb,'+c+' 65%,#000 12%));width:'+size+'px;height:'+size+'px;font-size:'+(size*0.4)+'px">'+esc(name[0])+'</div>';}
function segControl(items,active,attr){
  return '<div class="seg" style="margin-bottom:14px">'+items.map(it=>'<button class="seg-btn'+(it.id===active?' active':'')+'" '+attr+'="'+esc(it.id)+'">'+esc(it.label)+'</button>').join('')+'</div>';
}

function kraRow(k,S){
  return `<div class="kra-row"><div class="knm">${esc(k.kra)}<small>weight ${k.weight}%${k.segment?' · '+esc(k.segment.split('·')[0].trim()):''}</small></div>

function aggregateKras(rows,S){
  const map={};
  rows.forEach(r=>{if(!r.hasData)return;const key=r.kpi.kra+'||'+(r.kpi.segment||'');const g=map[key]=map[key]||{kra:r.kpi.kra,segment:r.kpi.segment,rows:[]};g.rows.push(r);});
  return Object.values(map).map(g=>{
    const d=g.rows.filter(r=>r.weight);const ws=d.reduce((s,r)=>s+r.weight,0)||1;
    return {kra:g.kra,segment:g.segment,weight:Math.round(d.reduce((s,r)=>s+r.weight,0)),
      score:d.length?d.reduce((s,r)=>s+r.weight*r.rating,0)/ws:null};

}

async function saveKpi(memberId,kpiId){
  const m=APP.boot.members.find(x=>x.id===memberId);
  const k=APP.boot.kpis.find(x=>x.memberId===memberId&&x.kpiId===kpiId);
  if(!k)return;
  const payload={memberId,kpiId,period:APP.period,team:k.team,individual:k.individual,kpiName:k.kpi,
    commentary:($('#commentInput')?$('#commentInput').value:''),
    evidence:($('#evidenceInput')?$('#evidenceInput').value:''),actual:'',rating:''};
  const ai=$('#actualInput');const rp=$('#ratePick');
  if(ai&&ai.value!=='')payload.actual=Number(ai.value);
  if(rp){const sel=$('#ratePick button.sel');if(sel)payload.rating=Number(sel.dataset.rate);}
  const btn=$('[data-action="save-kpi"]');if(btn){btn.disabled=true;btn.textContent='Saving…';}
  try{
    const b=await call('apiSaveActual',payload);
    if(!b||!b.ok)throw new Error(b&&b.error||'Save failed');
    applyBoot(b);openKpi(memberId,kpiId);
    toast('Saved · dashboard recalculated');
  }catch(e){toast('Error: '+(e.message||e),true);if(btn){btn.disabled=false;btn.textContent='Save';}}
}
async function saveSettings(){
  const patch={currentPeriod:$('#dataPeriod').value,onTrack:$('#thOn').value,atRisk:$('#thAt').value};
  toast('Saving settings…');
  try{const b=await call('apiSaveSettings',patch);if(!b||!b.ok)throw new Error(b&&b.error);APP.period=patch.currentPeriod;applyBoot(b);go('data');toast('Settings saved');}
  catch(e){toast('Error: '+(e.message||e),true);}
}
async function reseed(){toast('Re-seeding…');try{const b=await call('apiSeedSampleData',true);if(b&&b.ok){applyBoot(b);go('overview');toast('Sample data re-seeded');}}catch(e){toast('Error: '+(e.message||e),true);}}
async function clearData(){if(!confirm('Clear ALL actuals? The KRA/KPI framework stays intact.'))return;toast('Clearing…');try{const b=await call('apiClearActuals');if(b&&b.ok){applyBoot(b);go('overview');toast('Actuals cleared');}}catch(e){toast('Error: '+(e.message||e),true);}}

/* ==============================================================  EVENTS  ==== */
document.addEventListener('click',e=>{
  // actions (buttons) win first — a Save button also carries data-member/data-kpi
  const act=e.target.closest('[data-action]');if(act){handleAction(act.dataset.action,act);return;}
  const nav=e.target.closest('[data-nav]');if(nav){const id=nav.dataset.nav;if(id==='risk')APP.ctx={};go(id);closeNav();return;}
  const cr=e.target.closest('[data-crumb]');if(cr){const o=JSON.parse(cr.dataset.crumb.replace(/&#39;/g,"'"));go(o.v,o.ctx);return;}
  const rt=e.target.closest('[data-riskteam]');if(rt){APP.ctx.teamFilter=rt.dataset.riskteam;render();return;}
  const pp=e.target.closest('[data-period]');if(pp){if(pp.dataset.period!==APP.period){APP.period=pp.dataset.period;recompute();buildChrome();render();}return;}
  const tb=e.target.closest('[data-tab]');if(tb){APP.tab=tb.dataset.tab;render();return;}
  const tm=e.target.closest('[data-team]');if(tm){go('team',{team:tm.dataset.team});return;}
  const kp=e.target.closest('[data-kpi]');if(kp){openKpi(kp.dataset.member,kp.dataset.kpi);return;}
  const mb=e.target.closest('[data-member]');if(mb){go('member',{memberId:mb.dataset.member});return;}
});
function handleAction(a,el){
  if(a==='close-drawer')closeDrawer();
  else if(a==='toggle-nav'){APP.navOpen=!APP.navOpen;$('#sidebar').classList.toggle('open',APP.navOpen);}
  else if(a==='refresh')doRefresh();
  else if(a==='save-kpi')saveKpi(el.dataset.member,el.dataset.kpi);
  else if(a==='save-settings')saveSettings();
  else if(a==='reseed')reseed();
  else if(a==='clear')clearData();
}
function closeNav(){APP.navOpen=false;$('#sidebar').classList.remove('open');}

const MockBackend=(()=>{
  const pnum=s=>{if(s==null)return null;const m=String(s).replace(/,/g,'').replace(/([A-Za-z])-/g,'$1 ').match(/\d+(?:\.\d+)?/);return m?Number(m[0]):null;};

  function dir(bs){const v=bs.map(b=>b.value).filter(x=>x!=null);if(v.length<2)return 'qualitative';return v[v.length-1]>v[0]?'higher':v[v.length-1]<v[0]?'lower':'higher';}
  function unit(bs){const j=bs.map(b=>b.raw).join(' ').toLowerCase();if(j.includes('%'))return 'Percentage';if(j.includes('day'))return 'Days';if(j.includes('cr'))return '₹ Cr';return 'Number';}
  function tgt(bs){const b=bs[2];return b&&b.value!=null?b.value:(bs.find(x=>x.value!=null)||{}).value||null;}

    return [

  // ---------- assemble model ----------
  function buildModel(){
    const teams=[],members=[],kpis=[];
    [['Metal',METAL_POC,'Amit Jha'],['Plastic',PLASTIC_POC,'Tabesh']].forEach(([tn,roster,lead])=>{
      const segs=[SUP,DEM];
      teams.push({id:slug(tn),name:tn,lead,type:'scorecard',segments:segs});
      const tmpl=scTemplate();
      roster.forEach(([nm,region])=>{
        const mid=slug(tn+'|'+nm);
        members.push({id:mid,name:nm,team:tn,role:region?region+' Region POC':(nm===lead?'Team Lead':'Team Member'),region,isLead:nm===lead});
        tmpl.forEach(t=>{const kpiId=slug([tn,t.segment,t.kra,t.kpi].join('|'));

        data[nm].forEach(row=>{

          const kpiId=slug([tn,nm,kra,kpi].join('|'));

  // ---------- seed sample actuals (data prep only, not scoring) ----------
  const hash01=s=>{let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*16777619)>>>0;}return (h%100000)/100000;};
  function ratingToValue(bs,r){const v=bs.map(b=>b.value);for(let i=0;i<5;i++)if(v[i]==null){for(let d=1;d<5;d++){if(v[i-d]!=null){v[i]=v[i-d];break;}if(v[i+d]!=null){v[i]=v[i+d];break;}}}r=clamp(r,1,5);const lo=Math.floor(r);if(lo>=5)return v[4];return v[lo-1]+(r-lo)*(v[lo]-v[lo-1]);}
  function seed(model,periods){

      const base=1.6+3.0*hash01(k.memberId+'|'+k.kpiId);
      periods.forEach((p,pi)=>{
        const drift=(pi-(periods.length-1))*0.2, wob=(hash01(k.kpiId+p)-0.5)*0.5;
        const r=clamp(base+drift+wob,0.7,5);
        const key=k.memberId+'||'+k.kpiId+'||'+p;
        if(k.direction==='qualitative'||k.target==null)actuals[key]={rating:Math.round(r*10)/10,actual:null,commentary:'',evidence:'',updatedBy:'sample@recykal.com',updatedAt:''};
        else actuals[key]={actual:Math.round(ratingToValue(k.bands,r)*100)/100,rating:null,commentary:'',evidence:'',updatedBy:'sample@recykal.com',updatedAt:''};
      });
    });
    return actuals;
  }
  function months(n){const out=[],d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const dd=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0'));}return out;}

  const periods=months(3);
  const model=buildModel();
  let actuals=seed(model,periods);
  const settings={onTrack:3.0,atRisk:2.0,targetBandLevel:3,currentPeriod:periods[periods.length-1]};

  function bootstrap(){return {ok:true,generatedAt:new Date().toISOString(),user:{email:''},
    settings:JSON.parse(JSON.stringify(settings)),periods:periods.slice(),
    teams:model.teams,members:model.members,kpis:model.kpis,actuals:JSON.parse(JSON.stringify(actuals))};}
  return {
    apiBootstrap:()=>bootstrap(),
    apiSeedSampleData:(force)=>{if(force||Object.keys(actuals).length===0)actuals=seed(model,periods);return bootstrap();},
    apiClearActuals:()=>{actuals={};return bootstrap();},
    apiSaveSettings:(patch)=>{Object.assign(settings,patch||{});['onTrack','atRisk','targetBandLevel'].forEach(k=>{if(settings[k]!=null)settings[k]=Number(settings[k]);});return bootstrap();},
    apiSaveActual:(p)=>{const key=p.memberId+'||'+p.kpiId+'||'+p.period;actuals[key]={actual:(p.actual===''||p.actual==null)?null:Number(p.actual),rating:(p.rating===''||p.rating==null)?null:Number(p.rating),commentary:p.commentary||'',evidence:p.evidence||'',updatedBy:'you@recykal.com',updatedAt:new Date().toISOString()};return bootstrap();}
  };
})();

/* ================================================================  START  == */
boot();
</script>
